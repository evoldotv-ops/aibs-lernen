tnamen"], "r": 1, "e": "Ohne Autonomie ist es laut Kenza Ait Si Abbou nur Prozessautomatisierung, kein echter Agent."}, {"id": "C9.vq.cm7fDEqukz8.vor1", "vid": "cm7fDEqukz8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt das Gespräch scherzhaft den Umstand, dass moderne KI-Tools trotz Plug-and-Play-Versprechen oft erst mit viel Aufwand angebunden werden müssen?", "a": ["Plug and Pray", "Click and Go", "Setup Hell", "Instant Fail"], "r": 0, "e": "Kenza Ait Si Abbou nennt es Plug and Pray statt Plug and Play, weil man erst Adapter bauen muss."}, {"id": "C9.v.cm7fDEqukz8", "t": "frei", "abruf": 1, "vid": "cm7fDEqukz8", "vq": "nach", "q": "Video «KI im Unternehmen: Von Plug & Pray zu echter AI Readiness | Kenza Ait Si Abbou» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Ein System gilt laut dem Gespräch nur dann als echter Agent, wenn es eigenständig entscheidet und autonom handelt; fehlt diese Autonomie, handelt es sich um reine Prozessautomatisierung. 2. Der Shared-Core-Ansatz sucht nach einem Werkzeug oder Verhalten, das über viele Abteilungen und Standorte hinweg gleich funktioniert, um mit einer Lösung Skalierungshebel für viele Bereiche gleichzeitig zu bekommen. 3. Ein unscheinbarer Use Case wie automatisiertes Dokumentenmanagement (Klassifizieren, gesetzeskonformes Archivieren und Löschen, Befragen von Dokumenten per Sprachmodell) wirkt nicht spektakulär, lässt sich aber über praktisch jede Abteilung ausrollen und hat einen grossen finanziellen Effekt."}, {"id": "C9.vq.cm7fDEqukz8.nach0", "vid": "cm7fDEqukz8", "vq": "nach", "t": "mc", "q": "Welchen Use Case beschreibt Kenza Ait Si Abbou als unsexy, aber mit riesigem Hebel für fast jedes Unternehmen?", "a": ["Social-Media-Marketing", "Dokumentenmanagement", "Logo-Design", "Kundenumfragen"], "r": 1, "e": "Dokumentenmanagement betrifft jede Abteilung, weil alle Unternehmen Dokumente verwalten und nach Gesetz archivieren müssen."}, {"id": "C9.vq.cm7fDEqukz8.nach1", "vid": "cm7fDEqukz8", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge werden im Dokumentenmanagement-Beispiel als neu möglich beschrieben, seit Sprachmodelle gut funktionieren?", "a": ["Mit den eigenen Dokumenten wie in einem Gespräch Fragen stellen", "Dokumente automatisch nach gesetzlichen Fristen löschen lassen", "Alle Mitarbeitenden sofort entlassen", "Dokumente ganz ohne Klassifizierung archivieren"], "r": [0, 1], "e": "Man kann Dokumente jetzt automatisiert klassifizieren, archivieren, nach Ablauf der Frist löschen und per Frage direkt befragen."}, {"id": "C9.vq.cm7fDEqukz8.nach2", "vid": "cm7fDEqukz8", "vq": "nach", "t": "lueck", "q": "Der wichtigste Tipp am Ende des Gesprächs für Individuen und Unternehmen lautet, ___ zu bleiben.", "r": ["neugierig"], "e": "Kenza Ait Si Abbou nennt Neugierde als ihren zentralen Tipp, um offen für neue Entwicklungen zu bleiben."}, {"id": "C9.vq.cm7fDEqukz8.nach3", "vid": "cm7fDEqukz8", "vq": "nach", "t": "frei", "q": "Erkläre, warum ein automatisiertes System laut dem Gespräch nicht automatisch ein Agent ist, nur weil es Aufgaben erledigt.", "m": "Ein System, das immer nur denselben festen Ablauf abarbeitet, ist laut dem Gespräch reine Prozessautomatisierung. Ein echter Agent muss dagegen autonom eigene Entscheidungen treffen können, zum Beispiel selbstständig einen Flug, ein Hotel und weitere Buchungen sinnvoll miteinander verknüpfen. Fehlt diese Autonomie, sollte man laut dem Gespräch nicht von einem Agenten sprechen, sondern das Kind beim richtigen Namen nennen."}, {"id": "C9.vq.cm7fDEqukz8.abc", "t": "abc", "abruf": 1, "vid": "cm7fDEqukz8", "vq": "nach", "m": ["Adapter", "Autonomie", "Business Value", "Dokumentenmanagement", "Hebel", "Klassifizierung", "Löschskript", "Neugierde", "Plug and Pray", "Prozessautomatisierung", "Shared Core", "Vertrag"], "q": "ABC-Liste zu «KI im Unternehmen: Von Plug & Pray zu echter AI Readiness | Kenza Ait Si Abbou»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.cm7fDEqukz8.kawa", "t": "kawa", "abruf": 1, "vid": "cm7fDEqukz8", "vq": "nach", "wort": "AGENT", "m": ["A: Autonomie: das entscheidende Kriterium für einen echten Agenten", "G: Geschwindigkeit: soll durch einen gemeinsamen Shared Core über Abteilungen hinweg entstehen", "E: Entwicklerin: Kenza Ait Si Abbou startete als Ingenieurin und Entwicklerin", "N: Neugierde: der wichtigste Rat am Ende des Gesprächs", "T: Tool: braucht oft erst einen Adapter, bevor es wirklich funktioniert"], "q": "KaWa zu «AGENT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.vq.khKblB-6BPM.vor0", "vid": "khKblB-6BPM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was macht ein Sprachmodell laut Video technisch beim Antworten, ganz ohne Zauberei?", "a": ["Es sucht die Antwort in einer riesigen Bibliothek nachgeschlagener Fakten", "Es berechnet stochastisch, welcher nächste Token am wahrscheinlichsten ist", "Es fragt im Hintergrund einen Menschen", "Es würfelt komplett zufällig Wörter zusammen"], "r": 1, "e": "Das Video sagt ausdrücklich, das Modell rechnet stochastisch das nächste wahrscheinliche Token aus."}, {"id": "C9.vq.khKblB-6BPM.vor1", "vid": "khKblB-6BPM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was sind laut Video die drei entscheidenden Zutaten für ein gutes Ergebnis mit KI?", "a": ["Internet, Strom und Bildschirm", "Modell, Prompt und Kontext", "Tastatur, Maus und Monitor", "Zeit, Geld und Glück"], "r": 1, "e": "Das Video nennt genau diese drei Faktoren: Modell, Prompt und Kontext."}, {"id": "C9.v.khKblB-6BPM", "t": "frei", "abruf": 1, "vid": "khKblB-6BPM", "vq": "nach", "q": "Video «Was Führungskräfte jetzt über KI wissen MÜSSEN! Live-Keynote» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Magnussen zeigt anhand aktueller Nutzerzahlen ein Chatbot-Ranking (ChatGPT vor Claude, DeepSeek, Mistral/Le Chat und Gemini) und stellt klar, dass hohe private Nutzung nicht gleichbedeutend mit geschäftlicher Nutzung ist. 2. Er erklärt Reasoning am Beispiel des berühmten Zugs 37 von AlphaGo gegen Lee Sedol: Das Modell simuliert Lösungswege tausendfach gegen sich selbst, statt wie ein einfaches Chat-Modell nur das nächste Wort vorherzusagen. 3. Er stellt drei Arbeitsmodi vor: Catchup für automatisierte Routineaufgaben wie E-Mail-Zusammenfassungen, Work with für gemeinsames Arbeiten mit KI und Grow Beyond für vorher unmögliche neue Anwendungen."}, {"id": "C9.vq.khKblB-6BPM.nach0", "vid": "khKblB-6BPM", "vq": "nach", "t": "mc", "q": "Warum kann laut Video ein Agent namens Operator im Beispiel des Sprechers selbstständig einen Flug und ein Hotel buchen?", "a": ["Weil er komplett autonom im Browser Aufgaben erledigen kann", "Weil er nur Texte vorliest", "Weil er ausschliesslich auf Anrufe reagiert", "Weil ein Mensch jeden Klick manuell bestätigen musste"], "r": 0, "e": "Das Video zeigt, dass Operator komplett autonom im Browser arbeitet, ohne dass der Sprecher etwas anfassen musste."}, {"id": "C9.vq.khKblB-6BPM.nach1", "vid": "khKblB-6BPM", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge beschreibt das Video beim Thema Reasoning?", "a": ["Das Modell durchdenkt und vergleicht mehrere Lösungswege, bevor es antwortet", "Ein Modell kann dabei zwischendurch die Sprache wechseln, in der es nachdenkt", "Reasoning bedeutet, dass das Modell schneller antwortet als sonst", "Reasoning funktioniert nur bei Bildern, nie bei Text"], "r": [0, 1], "e": "Das Video beschreibt beides: das Durchdenken mehrerer Lösungswege und den beobachteten Sprachwechsel."}, {"id": "C9.vq.khKblB-6BPM.nach2", "vid": "khKblB-6BPM", "vq": "nach", "t": "lueck", "q": "Ein schwaches Modell braucht laut Video einen besseren ___ und mehr Kontext, um ein gutes Ergebnis zu liefern.", "r": ["prompt"], "e": "Das Video sagt: schlechtes Modell bedeutet, Prompt und Kontext müssen besser sein."}, {"id": "C9.vq.khKblB-6BPM.nach3", "vid": "khKblB-6BPM", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen an einem eigenen Beispiel, warum ein Prompt laut Video wie ein guter Auftrag an eine Kollegin oder einen Kollegen sein sollte.", "m": "So wie man einer neuen Werkstudentin genau erklärt, was sie tun soll und was nicht, sollte man auch einem Sprachmodell die Aufgabe klar und vollständig beschreiben. Fehlt der Kontext, muss das Modell raten, was gemeint ist, und das Ergebnis wird ungenau. Ein klarer Auftrag mit Rahmenbedingungen führt dagegen zu einem brauchbaren Ergebnis."}, {"id": "C9.vq.khKblB-6BPM.abc", "t": "abc", "abruf": 1, "vid": "khKblB-6BPM", "vq": "nach", "m": ["Agent", "AGI", "ASI", "Kontext", "Modell", "Operator", "Prompt", "Reasoning", "Reinforcement Learning", "Stochastik", "Token", "Transformer"], "q": "ABC-Liste zu «Was Führungskräfte jetzt über KI wissen MÜSSEN! Live-Keynote»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.khKblB-6BPM.kawa", "t": "kawa", "abruf": 1, "vid": "khKblB-6BPM", "vq": "nach", "wort": "TOKEN", "m": ["T: Token: die kleinste Einheit, die ein Sprachmodell tatsächlich sieht", "O: Operator: der Agent, der im Video selbstständig Flug und Hotel bucht", "K: Kontext: das, was du zusätzlich zum Prompt ins Chatfenster eingibst", "E: Energieverbrauch: ein Rechenzentrum von Meta verbraucht laut Video enorm viel Strom", "N: Next Token Prediction: das Grundprinzip, wie ChatGPT ohne Reasoning direkt antwortet"], "q": "KaWa zu «TOKEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.vq.t2Je16OfKT8.vor0", "vid": "t2Je16OfKT8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Produkte will Cisco laut Video dieses Jahr auf den Markt bringen, die zu 100 Prozent von KI geschrieben wurden?", "a": ["Eins", "Sechs", "Zwanzig", "Keins, das ist noch Zukunftsmusik"], "r": 1, "e": "Uwe Peter sagt im Video, dass Cisco dieses Jahr die ersten sechs zu 100 Prozent KI-geschriebenen Produkte veröffentlicht."}, {"id": "C9.vq.t2Je16OfKT8.vor1", "vid": "t2Je16OfKT8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie hoch war die Erfolgsquote, mit der die zehnjährige Tochter im Video einen KI-Agenten austricksen konnte?", "a": ["Etwa 10 Prozent", "Etwa 80 bis 100 Prozent", "Genau 0 Prozent, es hat nie geklappt", "Etwa 30 Prozent"], "r": 1, "e": "Uwe Peter schätzt im Video die Trefferquote auf 80 bis 90 Prozent, sagt dann aber, es waren am Ende sogar 100 Prozent."}, {"id": "C9.v.t2Je16OfKT8", "t": "frei", "abruf": 1, "vid": "t2Je16OfKT8", "vq": "nach", "q": "Video «Deutschlands zweite Chance: Warum Agentic AI aufholt, was die Digitalisierung verpasst hat | Uwe Peter» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Uwe Peter berichtet, dass Cisco im Jahr 2025 die ersten sechs Produkte auf den Markt bringt, die zu 100 Prozent von KI geschrieben wurden, wobei Menschen nur noch die Qualitätskontrolle übernehmen. 2. Er erklärt, warum kleine, lokale und deterministische Modelle statt grosser Sprachmodelle für industrielle Anwendungen wie Robotersteuerung entscheidend sind, weil Halluzinationen dort inakzeptabel sind, und sieht darin dank 1800 Rechenzentren Deutschlands grösste Chance. 3. Beim eigenen Red-Teaming der Sicherheitslösung AI Defense gelang es Ciscos Team in 80 bis 90 Prozent der Fälle, Prüfroutinen des Modells allein durch veränderte Wortzwischenräume auszuhebeln."}, {"id": "C9.vq.t2Je16OfKT8.nach0", "vid": "t2Je16OfKT8", "vq": "nach", "t": "mc", "q": "Wie hat die Tochter im Video den KI-Agenten laut Erzählung ausgetrickst?", "a": ["Sie hat die Zugriffsrechte des Servers gehackt", "Sie hat die Abstände zwischen Wörtern und Silben verändert", "Sie hat das Modell komplett neu trainiert", "Sie hat einen anderen Computer benutzt"], "r": 1, "e": "Uwe Peter erzählt, dass schon veränderte Spaces zwischen Wörtern und Silben ausgereicht haben, um die Prüfroutine zu umgehen."}, {"id": "C9.vq.t2Je16OfKT8.nach1", "vid": "t2Je16OfKT8", "vq": "nach", "t": "mc", "q": "Warum eignen sich kleine, abgespeckte KI-Modelle laut Video besonders gut für die Industrie?", "a": ["Weil sie mehr Rechenzentren brauchen als grosse Modelle", "Weil sie mit einem reduzierten, abgesteckten Datensatz deterministische, verlässliche Ergebnisse liefern", "Weil sie ausschliesslich in der Cloud laufen können", "Weil sie keine Sprache verstehen"], "r": 1, "e": "Kleine Modelle mit reduziertem Datensatz liefern laut Video deterministische Ergebnisse ohne Halluzination, das ist wichtig für die Steuerung von Maschinen in Echtzeit."}, {"id": "C9.vq.t2Je16OfKT8.nach2", "vid": "t2Je16OfKT8", "vq": "nach", "t": "ms", "q": "Welche zwei Stärken nennt Uwe Peter, die Deutschland für industrielle KI mitbringt?", "a": ["Eine sehr grosse Anzahl an Rechenzentren", "Vorhandene Fabriken und industrielle Daten", "Die niedrigsten Stromkosten der Welt", "Die meisten Smartphone-Nutzer weltweit"], "r": [0, 1], "e": "Uwe Peter nennt über 1800 Rechenzentren sowie die vorhandenen Fabriken und Daten als Stärken Deutschlands für industrielle KI."}, {"id": "C9.vq.t2Je16OfKT8.nach3", "vid": "t2Je16OfKT8", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, was mit dem Zitat Hope is not a strategy when it comes to AI gemeint ist, das im Video zitiert wird.", "m": "Das Zitat bedeutet, dass es nicht reicht, bei KI einfach zu hoffen, dass sich alles von selbst gut entwickelt oder dass man rechtzeitig mithalten kann. Unternehmen und Führungskräfte müssen aktiv planen, testen und investieren, statt abzuwarten. Im Video wird das als Grundhaltung für den Umgang mit der aktuellen KI-Entwicklung dargestellt, gerade weil sich alles so schnell verändert."}, {"id": "C9.vq.t2Je16OfKT8.abc", "t": "abc", "abruf": 1, "vid": "t2Je16OfKT8", "vq": "nach", "m": ["Agentic", "Automatisierung", "Cisco", "Deterministisch", "Halluzination", "MCP", "Mittelstand", "Prompt Injection", "Rechenzentrum", "Sicherheit", "Souveränität", "Token"], "q": "ABC-Liste zu «Deutschlands zweite Chance: Warum Agentic AI aufholt, was die Digitalisierung verpasst hat | Uwe Peter»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.t2Je16OfKT8.kawa", "t": "kawa", "abruf": 1, "vid": "t2Je16OfKT8", "vq": "nach", "wort": "CISCO", "m": ["C: Cisco bringt dieses Jahr sechs komplett KI-geschriebene Produkte heraus", "I: In Echtzeit müssen KI-Agenten für Maschinensteuerung deterministisch arbeiten", "S: Souveränität Deutschlands hängt laut Uwe Peter vor allem an der Bildung", "O: Ohne Halluzination funktionieren kleine, abgesteckte Modelle besonders zuverlässig"], "q": "KaWa zu «CISCO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.vq.pJPVqL5jrIo.vor0", "vid": "pJPVqL5jrIo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viel schneller verläuft der aktuelle KI-Umbruch laut Redner im Vergleich zu früheren Technologieumbrüchen, die er miterlebt hat?", "a": ["Etwa doppelt so schnell", "Etwa fünfmal so schnell", "Fast zehnmal so schnell", "Genau gleich schnell"], "r": 2, "e": "Der Redner sagt, wir seien fast zehnmal so schnell unterwegs wie bei den letzten Technologieumbrüchen."}, {"id": "C9.vq.pJPVqL5jrIo.vor1", "vid": "pJPVqL5jrIo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reicht es, einer KI dieselbe kurze Frage zu stellen, die man auch bei Google eingeben würde, um ein gutes Ergebnis zu bekommen?", "a": ["Ja, das reicht meistens völlig", "Nein, ohne zusätzlichen Kontext ist die Antwort oft enttäuschend", "Nur bei einfachen Rechenaufgaben", "Ja, weil KI genauso funktioniert wie eine Suchmaschine"], "r": 1, "e": "Der Redner sagt, viele Menschen seien enttäuscht, weil sie der KI wie bei Google nur eine kurze Frage stellen, statt ihr Kontext zu geben."}, {"id": "C9.v.pJPVqL5jrIo", "t": "frei", "abruf": 1, "vid": "pJPVqL5jrIo", "vq": "nach", "q": "Video «Neue Keynote 2024: KI richtig im Unternehmen anwenden» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Magnussen nennt als gemessenes Beispiel 70 Prozent Zeitersparnis bei Grafikdesign-Aufgaben und ordnet den aktuellen KI-Umbruch als etwa zehnmal schneller ein als frühere Technologiewellen, die er selbst miterlebt hat. 2. Er schlägt vor, jede Bedenken-Diskussion in vier getrennte Töpfe zu teilen: Datenschutz (persönliche Daten), Datensicherheit (Zugriffsschutz), strategische Erwägungen (Anbieterabhängigkeit) und rein emotionale Beweggründe, die man nicht vermischen sollte. 3. Als Prompting-Praxisbeispiel zeigt er, wie man ChatGPT frühere eigene Pressemitteilungen als Stilvorlage gibt, damit es eine neue Pressemitteilung im gleichen Corporate-Ton erzeugt."}, {"id": "C9.vq.pJPVqL5jrIo.nach0", "vid": "pJPVqL5jrIo", "vq": "nach", "t": "mc", "q": "Welche vier 'Töpfe' schlägt der Redner vor, um Bedenken gegenüber KI zu strukturieren?", "a": ["Datenschutz, Datensicherheit, strategische Erwägungen, emotionale Beweggründe", "Kosten, Zeit, Qualität, Umfang", "Hardware, Software, Netzwerk, Cloud", "Marketing, Vertrieb, Produktion, Finanzen"], "r": 0, "e": "Der Redner trennt Bedenken bewusst in diese vier Töpfe, um die Diskussion sauberer zu führen."}, {"id": "C9.vq.pJPVqL5jrIo.nach1", "vid": "pJPVqL5jrIo", "vq": "nach", "t": "mc", "q": "Was empfiehlt der Redner, um von der KI bessere Ergebnisse zu bekommen als eine kurze, Google-artige Frage?", "a": ["Der KI zusätzlichen Kontext geben, z.B. frühere eigene Texte als Stilvorlage", "Immer nur auf Englisch fragen", "Nie mehr als 5 Wörter eingeben", "Die Frage mehrmals identisch wiederholen"], "r": 0, "e": "Als Beispiel nennt er, frühere Pressemeldungen als Stilvorlage mitzugeben, damit die KI im passenden Stil antwortet."}, {"id": "C9.vq.pJPVqL5jrIo.nach2", "vid": "pJPVqL5jrIo", "vq": "nach", "t": "ms", "q": "Welche zwei neuen Blickwinkel nennt der Redner als Folge des schnellen KI-Wandels?", "a": ["Supercharged me, also der Einzelne", "Der komplette Verzicht auf Teams", "Supercharged Team", "Die Abschaffung jeglicher Führung"], "r": [0, 2], "e": "Der Redner nennt einen neuen Blick auf sich selbst, 'supercharged me', und auf das Team, 'supercharged Team', als nötige Anpassungen."}, {"id": "C9.vq.pJPVqL5jrIo.nach3", "vid": "pJPVqL5jrIo", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum es laut Redner sinnvoll ist, die Diskussion um KI-Bedenken in vier getrennte Töpfe aufzuteilen, statt alles zusammen zu diskutieren.", "m": "Wenn Datenschutz, Datensicherheit, strategische Überlegungen und rein emotionale Bedenken vermischt werden, wird die Diskussion unklar und es lässt sich schwer sagen, welches Argument wirklich zählt. Trennt man die Töpfe, kann man zum Beispiel sehen, dass es für Datenschutzfragen oft schon vertragliche Lösungen mit Anbietern gibt, während eine rein emotionale Ablehnung eine ganz andere Art von Gespräch braucht."}, {"id": "C9.vq.pJPVqL5jrIo.abc", "t": "abc", "abruf": 1, "vid": "pJPVqL5jrIo", "vq": "nach", "m": ["Datenschutz", "Datensicherheit", "Emotionale Beweggründe", "Forbs-Liste", "Grafikdesign", "Kontext", "New Work Force", "Pressemeldung", "Strategische Erwägungen", "Supercharged Team", "Töpfe", "Zeitersparnis"], "q": "ABC-Liste zu «Neue Keynote 2024: KI richtig im Unternehmen anwenden»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.pJPVqL5jrIo.kawa", "t": "kawa", "abruf": 1, "vid": "pJPVqL5jrIo", "vq": "nach", "wort": "TOPF", "m": ["T: Töpfe strukturieren die Diskussion in Datenschutz, Datensicherheit, Strategie und Emotionen.", "O: Ohne zusätzlichen Kontext liefert die KI nur eine generische Antwort wie bei einer Google-Suche.", "P: Pressemeldungen lassen sich im eigenen Stil erzeugen, wenn frühere Texte als Vorlage dienen.", "F: Frühere Ängste vor der Cloud ähneln heute der Sorge um KI und Daten."], "q": "KaWa zu «TOPF»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.0", "t": "mc", "q": "Was ist Benchmarking?", "a": ["Ein Geschwindigkeitstest für Computer", "Systematischer Vergleich eigener Prozesse oder Lösungen mit den Besten, um Ansätze zu übernehmen", "Eine Mitarbeiterbefragung", "Ein Finanzbericht"], "r": 1, "e": "B1: Lösungen aus anderen Geschäftsfeldern analysieren, adaptieren und in den eigenen Kontext übertragen. Nicht kopieren, sondern übersetzen."}, {"id": "C9.1", "t": "ms", "q": "Was gehört in eine KI-Strategie? Wähle drei.", "a": ["Zielbild: Wozu setzen wir KI ein, passend zur Unternehmensstrategie", "Handlungsfelder und Prioritäten", "Voraussetzungen: Daten, Kompetenzen, Governance, Budget", "Die Liste aller KI-Tools am Markt"], "r": [0, 1, 2], "e": "Strategie beantwortet wozu, wo und womit. Die Toolwahl folgt daraus."}, {"id": "C9.2", "t": "ord", "q": "Design Thinking: Phasen in der richtigen Reihenfolge.", "a": ["Verstehen und beobachten", "Problem definieren (Sichtweise)", "Ideen finden", "Prototyp bauen", "Testen"], "e": "Nützlich für B1, um Handlungsfelder aus Nutzersicht zu finden, nicht aus Technikbegeisterung."}, {"id": "C9.3", "t": "frei", "q": "Der CEO sagt öffentlich «KI ist unser strategischer Schwerpunkt», intern gibt es weder Zielbild noch Roadmap. Welche drei strategischen Beiträge lieferst du (A4)?", "m": "1. Analyse: SWOT der KI für unseren Kontext, gestützt auf Umfeld- und Unternehmensanalyse. 2. Zielbild-Entwurf: wozu KI, in welchen zwei bis drei Handlungsfeldern, mit welchen Leitplanken. 3. Priorisierte Roadmap mit Portfolio-Logik und Entscheidgremium. Alles zielgruppengerecht für die Geschäftsleitung, mit klarer Empfehlung."}], "videos": [{"id": "hhRo3EMnM6U", "kanal": "Targetter", "titel": "KI-Strategie 1x1 für Vorstände und Geschäftsführungen", "dauer": "5:38"}, {"id": "X_aDxKKutm0", "kanal": "Digital Campus Zollverein", "titel": "Erfolgsfaktor KI-Strategie: Schritt für Schritt", "dauer": "24:15"}, {"id": "jtpZIEg6nZk", "kanal": "ZumFachwirt", "titel": "Benchmarking", "dauer": "3:53"}, {"id": "Fb7yfse1w3M", "kanal": "caesar.academy", "titel": "Benchmarking einfach erklärt", "dauer": "4:38"}, {"id": "KH_zqH8EgDo", "kanal": "shribe!", "titel": "Design Thinking einfach erklärt (mit Workshop-Beispiel)", "dauer": "9:10"}, {"id": "cm7fDEqukz8", "kanal": "Christoph Magnussen", "titel": "KI im Unternehmen: Von Plug & Pray zu echter AI Readiness | Kenza Ait Si Abbou", "dauer": "1:17:05"}, {"id": "khKblB-6BPM", "kanal": "Christoph Magnussen", "titel": "Was Führungskräfte jetzt über KI wissen MÜSSEN! Live-Keynote", "dauer": "37:27"}, {"id": "t2Je16OfKT8", "kanal": "Christoph Magnussen", "titel": "Deutschlands zweite Chance: Warum Agentic AI aufholt, was die Digitalisierung verpasst hat | Uwe Peter", "dauer": "59:18"}, {"id": "pJPVqL5jrIo", "kanal": "Christoph Magnussen", "titel": "Neue Keynote 2024: KI richtig im Unternehmen anwenden", "dauer": "6:57"}], "pn": 11}, {"key": "C10", "titel": "Business Case, Kapitalwert, ROI", "warum": "C5 und C6: Gesamtbewertung als Business Case, Kennzahlen, Best und Worst Case.", "fragen": [{"id": "C10.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Business Case, Kapitalwert, ROI»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: C5 und C6: Gesamtbewertung als Business Case, Kennzahlen, Best und Worst Case. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C10.vq.MCuflAXWjOU.vor0", "vid": "MCuflAXWjOU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Schritte umfasst der perfekte Start in eine Business Analyse laut Video?", "a": ["zwei", "drei", "vier", "sechs"], "r": 2, "e": "Das Video beschreibt genau vier Schritte: Ist-Analyse, Soll-Zustand, Lösungsansätze und Empfehlung."}, {"id": "C10.vq.MCuflAXWjOU.vor1", "vid": "MCuflAXWjOU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Sollte man im zweiten Schritt, bei der Definition des Soll-Zustands, schon konkrete Lösungen und Massnahmen festlegen?", "a": ["ja, das ist genau der richtige Moment dafür", "nein, im zweiten Schritt geht es nur um Ziele, noch nicht um konkrete Lösungen", "nein, der Soll-Zustand wird nie festgelegt", "ja, aber nur technische Lösungen"], "r": 1, "e": "Das Video warnt ausdrücklich davor, im zweiten Schritt schon in Massnahmen oder Lösungsansätzen zu denken, es geht erst um die Ziele."}, {"id": "C10.v.MCuflAXWjOU", "t": "frei", "abruf": 1, "vid": "MCuflAXWjOU", "vq": "nach", "q": "Video «Wie erstellt man einen Business Case?» (ibo Gruppe): Was waren die Kernaussagen?", "m": "1. Ein Business Case beziehungsweise eine Auftragsklaerung beginnt mit einer Ist-Analyse, die den aktuellen Zustand, die betroffenen Systeme und Prozesse sowie die Ursachen bestehender Probleme erfasst, etwa mithilfe von Mindmap oder Ursachenanalyse. 2. Im zweiten Schritt werden die Ziele beziehungsweise Geschaeftsanforderungen fuer den Soll-Zustand loesungsneutral formuliert, bevor im dritten Schritt konkrete Loesungswege vom Ist- zum Soll-Zustand entwickelt werden. 3. Im vierten und letzten Schritt vergleicht man mehrere Loesungsalternativen nach Kosten-Nutzen- und Risikogesichtspunkten und spricht eine begruendete Empfehlung aus."}, {"id": "C10.vq.MCuflAXWjOU.nach0", "vid": "MCuflAXWjOU", "vq": "nach", "t": "mc", "q": "Welche Technik nennt das Video als Beispiel, um sich im ersten Schritt einen Ueberblick über den Ist-Zustand zu verschaffen?", "a": ["eine Mindmap", "eine Bilanzprüfung", "ein Aktienchart", "ein Kundenrating"], "r": 0, "e": "Das Video nennt die Mindmap als eine von mehreren Techniken, um den Ist-Zustand zu erfassen und zu strukturieren."}, {"id": "C10.vq.MCuflAXWjOU.nach1", "vid": "MCuflAXWjOU", "vq": "nach", "t": "ms", "q": "Welche zwei Wege zur Entwicklung von Lösungsansätzen nennt das Video im dritten Schritt?", "a": ["sich stark am Ist-Zustand orientieren und ihn schrittweise verbessern", "den Ist-Zustand komplett ignorieren und ihn nie wieder anschauen", "kreativ und losgelöst vom Ist-Zustand einen Idealzustand entwerfen", "sofort ohne Analyse eine Entscheidung fällen"], "r": [0, 2], "e": "Das Video nennt zwei Wege: entweder nah am Ist-Zustand ansetzen und ihn verbessern, oder ganz kreativ von einem Idealzustand aus denken."}, {"id": "C10.vq.MCuflAXWjOU.nach2", "vid": "MCuflAXWjOU", "vq": "nach", "t": "lueck", "q": "Im vierten Schritt spricht man eine ___ aus und vergleicht die Lösungsansätze nach Kosten-Nutzen- und Risikogesichtspunkten.", "r": ["empfehlung"], "e": "Das Video nennt die Empfehlung als vierten und letzten Schritt, in dem die Lösungsansätze verglichen werden."}, {"id": "C10.vq.MCuflAXWjOU.nach3", "vid": "MCuflAXWjOU", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wie du die vier Schritte aus dem Video nutzen würdest, wenn dein Chef dich bittet, ein unklares neues Thema zu übernehmen.", "m": "Zuerst würde ich mir mit einer Ist-Analyse, zum Beispiel per Mindmap, einen Ueberblick verschaffen, was das Thema überhaupt betrifft. Danach würde ich klären, welche Ziele erreicht werden sollen, ohne schon an konkrete Lösungen zu denken. Zum Schluss würde ich verschiedene Lösungswege entwickeln und eine begründete Empfehlung aussprechen, welcher Weg unter Kosten- und Risikogesichtspunkten am sinnvollsten ist."}, {"id": "C10.vq.MCuflAXWjOU.abc", "t": "abc", "abruf": 1, "vid": "MCuflAXWjOU", "vq": "nach", "m": ["Automatisierung", "Business Case", "Empfehlung", "Geschäftsanforderung", "Ist-Analyse", "Kosten-Nutzen", "Lösungsansatz", "Mindmap", "Risiko", "Soll-Zustand", "Standardisierung", "Ursachenanalyse"], "q": "ABC-Liste zu «Wie erstellt man einen Business Case?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C10.vq.MCuflAXWjOU.kawa", "t": "kawa", "abruf": 1, "vid": "MCuflAXWjOU", "vq": "nach", "wort": "URSACHE", "m": ["U: Ursachenanalyse: fragt, woran ein Problem wirklich liegt, nicht nur an den Symptomen", "R: Risikogesichtspunkte: fliessen in die Empfehlung im vierten Schritt ein", "S: Soll-Zustand: beschreibt die Ziele, noch ohne konkrete Lösung", "A: Automatisierungsgrad: eines der typischen Ziele im Soll-Zustand", "C: Case (Business Case): Oberbegriff für die vier Schritte der Auftragsklärung", "H: Handlungsempfehlung: der vierte Schritt, in dem man einen Lösungsweg empfiehlt", "E: Empfehlung: Vergleich der Optionen nach Kosten-Nutzen und Risiko"], "q": "KaWa zu «URSACHE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C10.vq.gCbXCawrT8k.vor0", "vid": "gCbXCawrT8k", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist laut Video beim Erstellen eines Business Case meistens der schwierigere Teil, die Kosten oder der Nutzen?", "a": ["Die Kosten sind viel schwieriger", "Der Nutzen ist viel schwieriger zu quantifizieren", "Beide sind gleich einfach", "Keins von beidem ist ein Problem"], "r": 1, "e": "Der Sprecher sagt, dass die Kosten meist recht klar zu erheben sind, während der Nutzen viel schwieriger zu quantifizieren ist."}, {"id": "C10.vq.gCbXCawrT8k.vor1", "vid": "gCbXCawrT8k", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woher stammt laut Video die im Beitrag genannte Pyramide der Nutzenelemente?", "a": ["Aus einem Kochbuch", "Aus dem Harvard Business Manager, erstellt von Bain and Company", "Von der Weltgesundheitsorganisation", "Aus einem Roman"], "r": 1, "e": "Der Sprecher nennt als Quelle eine Publikation aus dem Harvard Business Manager von 2016 von Bain and Company."}, {"id": "C10.v.gCbXCawrT8k", "t": "frei", "abruf": 1, "vid": "gCbXCawrT8k", "vq": "nach", "q": "Video «Auf den Punkt: der Business Case» (Christopher Schulz): Was waren die Kernaussagen?", "m": "1. Ein guter Business Case besteht aus Management Summary, Zielen, Nutzen, Kosten, einer Kosten-Nutzen-Gegenueberstellung, Risiken sowie einem Anhang mit Vorgehen und Belegen. 2. Waehrend Kosten meist klar strukturiert erfasst werden koennen, ist die Quantifizierung des Nutzens die eigentliche Herausforderung, wofuer das Video eine Nutzen-Pyramide mit funktionalen, emotionalen, lebensveraendernden und gesellschaftlichen Elementen empfiehlt. 3. Ein Business Case ist immer nur eine Momentaufnahme, die sich mit neuen Informationen im Zeitverlauf aendern kann, weshalb bei der Erstellung ein Gleichgewicht zwischen Detailtiefe und Aufwand gefunden werden muss."}, {"id": "C10.vq.gCbXCawrT8k.nach0", "vid": "gCbXCawrT8k", "vq": "nach", "t": "mc", "q": "In wie viele Abschnitte gliedert sich laut Video ein guter Business Case?", "a": ["Zwei", "Drei", "Fünf", "Sieben"], "r": 1, "e": "Das Video beschreibt neun Bestandteile, die sich auf drei Abschnitte verteilen."}, {"id": "C10.vq.gCbXCawrT8k.nach1", "vid": "gCbXCawrT8k", "vq": "nach", "t": "ms", "q": "Welche zwei Arten von Kosten nennt der Sprecher als Beispiele zur Strukturierung?", "a": ["Einmalig anfallende Kosten", "Kosten aus dem Ausland", "Wiederkehrende Kosten", "Kosten der Konkurrenz"], "r": [0, 2], "e": "Der Sprecher unterscheidet unter anderem einmalig anfallende und wiederkehrende Kosten als Strukturierungshilfe."}, {"id": "C10.vq.gCbXCawrT8k.nach2", "vid": "gCbXCawrT8k", "vq": "nach", "t": "lueck", "q": "Die Gegenüberstellung von Kosten und Nutzen nennt man im Business Case die ___.", "r": ["wirtschaftlichkeitsbetrachtung"], "e": "Das Video nennt die Gegenüberstellung von Kosten und Nutzen ausdrücklich Wirtschaftlichkeitsbetrachtung."}, {"id": "C10.vq.gCbXCawrT8k.nach3", "vid": "gCbXCawrT8k", "vq": "nach", "t": "frei", "q": "Erkläre, warum ein Business Case laut Video nur eine Momentaufnahme ist und was das für die Praxis bedeutet.", "m": "Ein Business Case wird zu einem bestimmten Zeitpunkt mit den dann verfügbaren Informationen erstellt, aber mit der Zeit kommen neue Informationen dazu, die das Ergebnis verändern können. Eine Investition, die heute attraktiv erscheint, kann dadurch später weniger attraktiv wirken oder umgekehrt. In der Praxis bedeutet das, dass man den Business Case im Projektverlauf immer wieder mit den tatsächlichen Ist-Werten vergleichen und bei Bedarf aktualisieren sollte."}, {"id": "C10.vq.gCbXCawrT8k.abc", "t": "abc", "abruf": 1, "vid": "gCbXCawrT8k", "vq": "nach", "m": ["Anhang", "Business Case", "Deckblatt", "Fixkosten", "Kosten", "Nutzenpyramide", "Risiko", "Status quo", "Variable Kosten", "Vergleichbarkeit", "Wirtschaftlichkeit", "Ziel"], "q": "ABC-Liste zu «Auf den Punkt: der Business Case»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C10.vq.gCbXCawrT8k.kawa", "t": "kawa", "abruf": 1, "vid": "gCbXCawrT8k", "vq": "nach", "wort": "NUTZEN", "m": ["N: Nutzenpyramide unterscheidet funktionale, emotionale und weitere Elemente", "U: Unterscheidung zwischen einmaligen und wiederkehrenden Kosten hilft bei der Struktur", "T: Transparenz durch Vergleich mehrerer Alternativen mit dem Status quo", "Z: Zeitersparnis ist eines der funktionalen Nutzenelemente aus der Pyramide", "E: Einmalige Momentaufnahme, ein Business Case veraltet mit der Zeit"], "q": "KaWa zu «NUTZEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C10.vq.etFmYEyu6yA.vor0", "vid": "etFmYEyu6yA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ist ein Geldbetrag, den du heute bekommst, laut Video wertvoller oder weniger wert als derselbe Betrag in 10 Jahren?", "a": ["Genau gleich viel wert", "Wertvoller, weil du ihn anlegen und verzinsen kannst", "Weniger wert, weil Geld mit der Zeit automatisch mehr wird", "Das hängt nur vom Wetter ab"], "r": 1, "e": "Der Zeitwert des Geldes besagt laut Video, dass Geld heute wertvoller ist, weil man es anlegen kann."}, {"id": "C10.vq.etFmYEyu6yA.vor1", "vid": "etFmYEyu6yA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ab welchem Wert des Nettobarwerts sollte eine Investition laut Video durchgeführt werden?", "a": ["Nur wenn er genau null ist", "Wenn er positiv ist", "Wenn er negativ ist", "Das spielt für die Entscheidung keine Rolle"], "r": 1, "e": "Das Video nennt einen positiven Nettobarwert als Entscheidungskriterium für eine Investition."}, {"id": "C10.v.etFmYEyu6yA", "t": "frei", "abruf": 1, "vid": "etFmYEyu6yA", "vq": "nach", "q": "Video «Kapitalwert berechnen, Kapitalwertmethode» (Studyflix): Was waren die Kernaussagen?", "m": "1. Die Kapitalwertmethode beruecksichtigt den Zeitwert des Geldes, indem kuenftige Zahlungen mit dem Zinssatz auf die Gegenwart abgezinst werden, weil frueher erhaltenes Geld angelegt werden und Zinsen erwirtschaften kann. 2. Der Kapitalwert (Nettobarwert) berechnet sich als Summe aller mit dem Faktor (1+i)^t abgezinsten Ein- und Auszahlungen ueber die Laufzeit der Investition, wobei die Anfangsauszahlung im Zeitpunkt t=0 nicht mehr abgezinst wird. 3. Eine Investition sollte nach der Kapitalwertmethode nur durchgefuehrt werden, wenn der Nettobarwert positiv ist, und bei mehreren Alternativen ist diejenige mit dem hoechsten positiven Kapitalwert vorzuziehen."}, {"id": "C10.vq.etFmYEyu6yA.nach0", "vid": "etFmYEyu6yA", "vq": "nach", "t": "mc", "q": "Was berücksichtigt die Kapitalwertmethode als dynamisches Verfahren, im Gegensatz zu einfacheren Verfahren?", "a": ["Nur die Anzahl der Mitarbeitenden", "Den Zeitwert des Geldes", "Die Farbe des Firmenlogos", "Die Wetterlage am Firmensitz"], "r": 1, "e": "Die Kapitalwertmethode ist laut Video dynamisch, weil sie den Zeitwert des Geldes einbezieht."}, {"id": "C10.vq.etFmYEyu6yA.nach1", "vid": "etFmYEyu6yA", "vq": "nach", "t": "ms", "q": "Welche zwei vereinfachenden Annahmen trifft die Kapitalwertmethode laut Video?", "a": ["Es werden sichere Zahlungen unterstellt", "Die Zinsen ändern sich jede Sekunde zufällig", "Es wird ein konstanter, risikofreier Zinssatz verwendet", "Steuern werden vollständig eingerechnet"], "r": [0, 2], "e": "Das Video nennt sichere Zahlungen und einen konstanten, risikofreien Zinssatz als vereinfachende Annahmen."}, {"id": "C10.vq.etFmYEyu6yA.nach2", "vid": "etFmYEyu6yA", "vq": "nach", "t": "lueck", "q": "Eine Investition sollte laut dem Entscheidungskriterium der Kapitalwertmethode nur durchgeführt werden, wenn der Nettobarwert ___ ist.", "r": ["positiv"], "e": "Ein positiver Nettobarwert ist laut Video das Entscheidungskriterium für die Durchführung."}, {"id": "C10.vq.etFmYEyu6yA.nach3", "vid": "etFmYEyu6yA", "vq": "nach", "t": "frei", "q": "Erkläre anhand des Beispiels '10 Euro heute oder ein Handy für 300 Euro in 50 Jahren', was der Zeitwert des Geldes bedeutet.", "m": "10 Euro heute kannst du sofort anlegen und über die Jahre verzinsen lassen, sodass daraus mit der Zeit ein viel grösserer Betrag wird. Deshalb kann eine kleine Summe heute wertvoller sein als eine grössere Summe erst in ferner Zukunft, weil man das Geld heute nutzen kann."}, {"id": "C10.vq.etFmYEyu6yA.abc", "t": "abc", "abruf": 1, "vid": "etFmYEyu6yA", "vq": "nach", "m": ["Abzinsung", "Barwert", "Formel", "Investition", "Kapitalwert", "Nettobarwert", "Rangfolge", "Transaktionskosten", "Zahlung", "Zeitwert", "Zinssatz"], "q": "ABC-Liste zu «Kapitalwert berechnen, Kapitalwertmethode»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C10.vq.etFmYEyu6yA.kawa", "t": "kawa", "abruf": 1, "vid": "etFmYEyu6yA", "vq": "nach", "wort": "BARWERT", "m": ["B: Barwert: der heutige Wert einer zukünftigen Zahlung ohne die Anfangszahlung", "A: Abzinsung: zukünftige Zahlungen werden mit dem Zinssatz auf heute umgerechnet", "R: Rangfolge: je höher der Nettobarwert, desto besser die Investition", "W: Wert des Geldes: heute verfügbares Geld ist wertvoller, weil man es anlegen kann", "E: Entscheidungskriterium: bei positivem Nettobarwert wird die Investition durchgeführt", "T: Transaktionskosten: werden zur Vereinfachung im Modell vernachlässigt"], "q": "KaWa zu «BARWERT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C10.vq.HJ8E8wKm5RY.vor0", "vid": "HJ8E8wKm5RY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie hoch war der ROI im Rechenbeispiel des Videos bei 50'000 Euro Investition und 60'000 Euro Umsatz?", "a": ["2 Prozent", "10 Prozent", "20 Prozent", "50 Prozent"], "r": 2, "e": "Der Gewinn betrug 10'000 Euro, daraus ergibt sich im Beispiel ein ROI von 20 Prozent."}, {"id": "C10.vq.HJ8E8wKm5RY.vor1", "vid": "HJ8E8wKm5RY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Faktoren berücksichtigt der ROI laut Video nicht?", "a": ["Nur den Gewinn", "Nur den Umsatz", "Marktlage, Image und Kundenzufriedenheit", "Nur das eingesetzte Kapital"], "r": 2, "e": "Der ROI bezieht nur monetäre, unternehmensinterne Faktoren ein, äussere Einflüsse wie Marktlage oder Kundenzufriedenheit fehlen."}, {"id": "C10.v.HJ8E8wKm5RY", "t": "frei", "abruf": 1, "vid": "HJ8E8wKm5RY", "vq": "nach", "q": "Video «ROI | Return on Investment einfach erklärt» (sevdesk): Was waren die Kernaussagen?", "m": "1. Der Return on Investment berechnet sich als Umsatzrentabilitaet (Gewinn geteilt durch Umsatz) multipliziert mit dem Kapitalumschlag (Umsatz geteilt durch eingesetztes Kapital). 2. Im Beispiel des Videos ergibt eine Investition von 50000 Euro mit 60000 Euro Umsatz und 10000 Euro Gewinn einen ROI von 20 Prozent, das heisst pro investiertem Euro werden 20 Cent Gewinn erzielt. 3. Der ROI beruecksichtigt nur monetaere, unternehmensinterne Faktoren und sollte deshalb nie als einziges Kriterium zur Bewertung einer Investition oder der Unternehmensperformance verwendet werden."}, {"id": "C10.vq.HJ8E8wKm5RY.nach0", "vid": "HJ8E8wKm5RY", "vq": "nach", "t": "mc", "q": "Wie lautet die Formel für den Return on Investment laut Video?", "a": ["Umsatzrendite mal Kapitalumschlag", "Gewinn geteilt durch Zeit", "Umsatz mal Werbekosten", "Kapital geteilt durch Gewinn"], "r": 0, "e": "ROI ergibt sich laut Video aus Umsatzrendite (Gewinn geteilt durch Umsatz) multipliziert mit dem Kapitalumschlag (Umsatz geteilt durch investiertes Kapital)."}, {"id": "C10.vq.HJ8E8wKm5RY.nach1", "vid": "HJ8E8wKm5RY", "vq": "nach", "t": "ms", "q": "Welche zwei weiteren Kennzahlen nennt das Video neben dem klassischen ROI?", "a": ["ROMI, Return on Marketing Investment", "Return on Advertising Spend, ROAS", "Amortisationsrechnung", "Stakeholderanalyse"], "r": [0, 1], "e": "Neben dem allgemeinen ROI nennt das Video speziell ROMI für Marketing und ROAS für Werbemassnahmen."}, {"id": "C10.vq.HJ8E8wKm5RY.nach2", "vid": "HJ8E8wKm5RY", "vq": "nach", "t": "lueck", "q": "Der ROI sollte laut Video niemals als einziges ___ zur Bewertung der Unternehmensperformance genutzt werden.", "r": ["analysetool"], "e": "Weil äussere Faktoren fehlen, warnt das Video davor, sich nur auf den ROI zu verlassen."}, {"id": "C10.vq.HJ8E8wKm5RY.nach3", "vid": "HJ8E8wKm5RY", "vq": "nach", "t": "frei", "q": "Erkläre anhand des Rechenbeispiels aus dem Video, was ein ROI von 20 Prozent konkret bedeutet.", "m": "Im Beispiel wurden 50'000 Euro in Werbung investiert und dabei 60'000 Euro Umsatz sowie 10'000 Euro Gewinn erzielt. Ein ROI von 20 Prozent bedeutet, dass mit jedem investierten Euro 20 Cent Gewinn erwirtschaftet wurden. Das zeigt, wie effizient das eingesetzte Kapital im Verhältnis zum Gewinn genutzt wurde."}, {"id": "C10.vq.HJ8E8wKm5RY.abc", "t": "abc", "abruf": 1, "vid": "HJ8E8wKm5RY", "vq": "nach", "m": ["Gewinn", "Investition", "Kapitalumschlag", "Kennzahl", "Marketing", "Performance", "Return on Investment", "ROAS", "ROMI", "Umsatzrendite", "Werbekosten", "Zeitraum"], "q": "ABC-Liste zu «ROI | Return on Investment einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C10.vq.HJ8E8wKm5RY.kawa", "t": "kawa", "abruf": 1, "vid": "HJ8E8wKm5RY", "vq": "nach", "wort": "RENDITE", "m": ["R: Rendite: die Umsatzrendite ist Teil der ROI-Formel", "E: Eingesetztes Kapital: Basis für den Kapitalumschlag", "N: Netto-Umsatz: wird bei der ROMI-Formel benötigt", "D: Direktmarketing-Beispiel: 50'000 Euro Investition, 60'000 Euro Umsatz", "I: Investition in Werbemassnahmen: Ausgangspunkt der Beispielrechnung", "T: Teilbereich: ROMI bezieht sich nur auf einen Teilbereich des Marketings"], "q": "KaWa zu «RENDITE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C10.0", "t": "ms", "q": "Was gehört in einen Business Case? Wähle vier.", "a": ["Ausgangslage und Problem mit Zahl", "Optionen inklusive Nichtstun", "Kosten, Nutzen, Kennzahlen, Szenarien", "Risiken und Empfehlung", "Lebenslauf des Projektleiters"], "r": [0, 1, 2, 3], "e": "C6: Gesamtbewertung strukturiert aufarbeiten und eine Empfehlung begründen. Die Null-Option gehört immer dazu."}, {"id": "C10.1", "t": "mc", "q": "Der Kapitalwert eines Projekts ist positiv. Was heisst das?", "a": ["Das Projekt macht Verlust", "Die abgezinsten Rückflüsse übersteigen die Investition, das Projekt lohnt sich beim gewählten Zinssatz", "Die Amortisation dauert über 10 Jahre", "Nichts"], "r": 1, "e": "Kapitalwert > 0 = vorteilhaft. Er berücksichtigt den Zeitwert des Geldes, anders als die statische Payback-Rechnung."}, {"id": "C10.2", "t": "num", "q": "Investition 80'000, Gewinn daraus im ersten Jahr 20'000. ROI in Prozent?", "r": 25, "tol": 0, "u": "%", "e": "ROI = Gewinn ÷ eingesetztes Kapital = 20'000 ÷ 80'000 = 25 %."}, {"id": "C10.3", "t": "ms", "q": "Welche Kostenarten nennt C5? Wähle drei.", "a": ["Entwicklungskosten", "Implementierungskosten", "Betriebskosten", "Kosten der Konkurrenz"], "r": [0, 1, 2], "e": "Dazu Risikoabschätzung und Auswirkungen auf interne und externe Faktoren. Betriebskosten (Lizenzen, API, Pflege, Monitoring) werden am häufigsten vergessen."}, {"id": "C10.4", "t": "frei", "q": "«Welche Annahmen tragen Ihren Business Case?» Wie baust du die Antwort?", "m": "Die zwei bis drei Zahlen nennen, an denen alles hängt (z.B. eingesparte Minuten pro Fall, Nutzungsquote, Fehlerquote). Sagen, welche gemessen und welche geschätzt sind. Best, Real und Worst Case zeigen und den Kipppunkt nennen: ab welchem Wert lohnt es sich nicht mehr. Dann sagen, wie ich die unsicherste Annahme im PoC überprüfe."}], "videos": [{"id": "MCuflAXWjOU", "kanal": "ibo Gruppe", "titel": "Wie erstellt man einen Business Case?", "dauer": "15:20"}, {"id": "gCbXCawrT8k", "kanal": "Christopher Schulz", "titel": "Auf den Punkt: der Business Case", "dauer": "4:47"}, {"id": "etFmYEyu6yA", "kanal": "Studyflix", "titel": "Kapitalwert berechnen, Kapitalwertmethode", "dauer": "5:31"}, {"id": "HJ8E8wKm5RY", "kanal": "sevdesk", "titel": "ROI | Return on Investment einfach erklärt", "dauer": "5:29"}], "pn": 3}, {"key": "C11", "titel": "Risiken bewerten, selber bauen oder kaufen", "warum": "C4 (Risiken identifizieren und bewerten) und C2 (Marktanalyse zu Standardlösungen).", "fragen": [{"id": "C11.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Risiken bewerten, selber bauen oder kaufen»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: C4 (Risiken identifizieren und bewerten) und C2 (Marktanalyse zu Standardlösungen). Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C11.vq.ire2x4HLDws.vor0", "vid": "ire2x4HLDws", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie wird laut Video der Risikowert berechnet?", "a": ["Eintrittswahrscheinlichkeit plus Tragweite", "Eintrittswahrscheinlichkeit mal Tragweite", "Nur die Tragweite in Euro", "Nur die Eintrittswahrscheinlichkeit in Prozent"], "r": 1, "e": "Das Video definiert den Risikowert genau als Eintrittswahrscheinlichkeit mal Tragweite."}, {"id": "C11.vq.ire2x4HLDws.vor1", "vid": "ire2x4HLDws", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Gefahr nennt das Video, die der Risikowert NICHT richtig erfasst?", "a": ["Kosten für Ersatzteile", "Gefahr für Leib und Leben bei seltenen, aber katastrophalen Ereignissen", "Die Dauer eines Meetings", "Die Farbe des Firmenlogos"], "r": 1, "e": "Das Video warnt ausdrücklich, dass Gefahr für Leib und Leben bei niedriger Wahrscheinlichkeit im Risikowert untergehen kann."}, {"id": "C11.v.ire2x4HLDws", "t": "frei", "abruf": 1, "vid": "ire2x4HLDws", "vq": "nach", "q": "Video «Risikoanalyse einfach erklärt: der Risikowert» (Projekte leicht gemacht): Was waren die Kernaussagen?", "m": "1. Der Risikowert berechnet sich als Produkt aus der geschaetzten Eintrittswahrscheinlichkeit eines Risikos in Prozent und der geschaetzten Tragweite beziehungsweise dem finanziellen Schaden in Geldeinheiten. 2. Eintrittswahrscheinlichkeiten lassen sich oft nur grob schaetzen, etwa anhand vergangener Vorfaelle, verfuegbarer Statistiken oder eines Vergleichs mehrerer Risiken untereinander als Konsistenzcheck. 3. Der Risikowert eignet sich zum Vergleichen und Priorisieren von Risiken sowie zur Bewertung von Gegenmassnahmen, versagt aber bei seltenen Risiken mit sehr hohem Schaden wie Lebensgefahr oder Umweltkatastrophen, weil eine niedrige Wahrscheinlichkeit den Risikowert faelschlich klein rechnet."}, {"id": "C11.vq.ire2x4HLDws.nach0", "vid": "ire2x4HLDws", "vq": "nach", "t": "mc", "q": "Wie hoch ist im Beispiel des Videos der Risikowert für den Ausfall der Produktionsmaschine mit 10 Prozent Wahrscheinlichkeit und 100.000 Euro Tragweite?", "a": ["1.000 Euro", "10.000 Euro", "100.000 Euro", "10 Euro"], "r": 1, "e": "0,1 mal 100.000 Euro ergibt laut Video einen Risikowert von 10.000 Euro."}, {"id": "C11.vq.ire2x4HLDws.nach1", "vid": "ire2x4HLDws", "vq": "nach", "t": "ms", "q": "Welche zwei Merkmale nennt das Video, in denen sich Risiken unterscheiden?", "a": ["Eintrittswahrscheinlichkeit", "Tragweite, also der Schaden", "Die Uhrzeit, zu der das Risiko entsteht", "Die Anzahl der Buchstaben im Risikonamen"], "r": [0, 1], "e": "Das Video nennt Eintrittswahrscheinlichkeit und Tragweite als die zwei zentralen Merkmale."}, {"id": "C11.vq.ire2x4HLDws.nach2", "vid": "ire2x4HLDws", "vq": "nach", "t": "lueck", "q": "Der Risikowert ergibt sich aus der Eintrittswahrscheinlichkeit multipliziert mit der ___.", "r": ["tragweite"], "e": "Das Video definiert den Risikowert genau als Eintrittswahrscheinlichkeit mal Tragweite."}, {"id": "C11.vq.ire2x4HLDws.nach3", "vid": "ire2x4HLDws", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel, das nicht die Produktionsmaschine ist, warum ein niedriger Risikowert trotzdem in eine Katastrophe führen kann, wenn man ihm blind vertraut.", "m": "Ein Blitzeinschlag in ein Gebäude hat eine sehr geringe Eintrittswahrscheinlichkeit, aber im schlimmsten Fall einen enormen Schaden für Menschenleben. Weil die Wahrscheinlichkeit so klein ist, bleibt der berechnete Risikowert niedrig, obwohl das Ereignis katastrophal wäre. Genau davor warnt das Video: bei Gefahr für Leib und Leben darf man sich nicht allein auf die Zahl verlassen."}, {"id": "C11.vq.ire2x4HLDws.abc", "t": "abc", "abruf": 1, "vid": "ire2x4HLDws", "vq": "nach", "m": ["Baustelle", "Eintrittswahrscheinlichkeit", "Imageschaden", "Klasseneinteilung", "Konventionalstrafe", "Massnahme", "Risikoportfolio", "Risikowert", "Schaden", "Statistik", "Tragweite", "Verzögerung"], "q": "ABC-Liste zu «Risikoanalyse einfach erklärt: der Risikowert»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C11.vq.ire2x4HLDws.kawa", "t": "kawa", "abruf": 1, "vid": "ire2x4HLDws", "vq": "nach", "wort": "WERT", "m": ["W: Wahrscheinlichkeit: der geschätzte Anteil, mit dem ein Risiko eintritt", "E: Eintrittswahrscheinlichkeit: einer der zwei Faktoren des Risikowerts", "R: Risikoportfolio: grafische Darstellung von Risiken nach Wahrscheinlichkeit und Tragweite", "T: Tragweite: der geschätzte Schaden in Euro, wenn das Risiko eintritt"], "q": "KaWa zu «WERT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C11.vq.PZgmA3llLso.vor0", "vid": "PZgmA3llLso", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Farbe hat in der Risikomatrix des Videos den Bereich, der als nicht akzeptabel gilt?", "a": ["Grün", "Rot", "Blau", "Schwarz"], "r": 1, "e": "Das Video zeigt eine Risikomatrix mit einer roten Zone für nicht akzeptable Risiken, wie zum Beispiel ein Todesfallrisiko."}, {"id": "C11.vq.PZgmA3llLso.vor1", "vid": "PZgmA3llLso", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reicht es im Beispiel des Videos aus, nur die Distanz zwischen den beiden Akteuren zu verkleinern, um ein akzeptables Risiko zu erreichen?", "a": ["Ja, das allein reicht komplett aus", "Nein, das Ausmass bleibt trotzdem zu hoch, es braucht weitere Massnahmen", "Nein, dadurch steigt das Risiko sogar", "Diese Frage wird im Video gar nicht behandelt"], "r": 1, "e": "Das Video zeigt, dass die verkürzte Distanz zwar die Wahrscheinlichkeit senkt, das Ausmass eines Treffers aber weiterhin inakzeptabel hoch bleibt."}, {"id": "C11.v.PZgmA3llLso", "t": "frei", "abruf": 1, "vid": "PZgmA3llLso", "vq": "nach", "q": "Video «Risikoanalyse einfach erklärt: Schritt für Schritt» (Swiss Safety Center): Was waren die Kernaussagen?", "m": "1. Eine Risikomatrix ordnet Risiken anhand von Eintrittswahrscheinlichkeit und Schadensausmass in eine rote (nicht akzeptable), gelbe (tolerierbare) und gruene (optimale) Zone ein. 2. Am Beispiel des Wilhelm-Tell-Szenarios zeigt das Video, dass eine einzelne Massnahme wie die Verkuerzung der Distanz oft nicht ausreicht, um ein Risiko aus der roten Zone zu bringen, sondern mehrere Massnahmen kombiniert werden muessen, etwa der Tausch der Rollen zwischen Schuetzen sowie Helm und Schutzbrille fuer die Zielperson. 3. Auch nach Absenkung des Risikos auf ein akzeptables Niveau bleiben Restrisiken bestehen, die durch begleitende Massnahmen wie Uebung unter realen Bedingungen, Wartung des Geraets, Erste-Hilfe-Bereitschaft und Versicherung weiter abgesichert werden."}, {"id": "C11.vq.PZgmA3llLso.nach0", "vid": "PZgmA3llLso", "vq": "nach", "t": "mc", "q": "Welche zwei Achsen bilden laut Video die Risikomatrix?", "a": ["Wahrscheinlichkeit und Ausmass", "Kosten und Zeit", "Farbe und Grösse", "Alter und Erfahrung"], "r": 0, "e": "Die Risikomatrix im Video wird durch die Wahrscheinlichkeits-Skala am linken Rand und die Ausmass-Skala am unteren Rand aufgespannt."}, {"id": "C11.vq.PZgmA3llLso.nach1", "vid": "PZgmA3llLso", "vq": "nach", "t": "mc", "q": "Welche Massnahme senkt im Beispiel schliesslich das Ausmass des Risikos entscheidend, sodass ein akzeptables Niveau erreicht wird?", "a": ["Nur die Distanz verkürzen", "Helm und Schutzbrille für den Akteur mit dem Apfel auf dem Kopf", "Die Armbrust komplett wegwerfen", "Ein Versicherungsvertrag ohne weitere Massnahme"], "r": 1, "e": "Erst der Schutz durch Helm und Schutzbrille bringt das Ausmass so weit runter, dass zusammen mit den Schiesskünsten ein optimales Sicherheitsniveau erreicht wird."}, {"id": "C11.vq.PZgmA3llLso.nach2", "vid": "PZgmA3llLso", "vq": "nach", "t": "ord", "q": "Bringe die im Video gezeigten Massnahmen in der Reihenfolge, in der sie umgesetzt werden.", "a": ["Distanz zwischen den Akteuren verkürzen", "Die Pfeilspitze entschärfen", "Die erfahrene und die unerfahrene Person tauschen", "Helm und Schutzbrille für den Akteur mit dem Apfel einsetzen"], "e": "Genau in dieser Reihenfolge testet der Berater im Video verschiedene Massnahmen, bis das Risiko in die grüne Zone fällt."}, {"id": "C11.vq.PZgmA3llLso.nach3", "vid": "PZgmA3llLso", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, wozu eine Risikomatrix mit Wahrscheinlichkeit und Ausmass laut Video dient, und nenne ein Beispiel aus deinem eigenen Alltag.", "m": "Eine Risikomatrix hilft dabei, systematisch zu bewerten, wie wahrscheinlich ein Schaden ist und wie schlimm er wäre, um dann gezielt Massnahmen zur Absenkung zu ergreifen. Im Video wird das am Beispiel des Apfelschusses gezeigt, bei dem verschiedene Massnahmen wie Distanz, Schutzausrüstung und Tausch der Akteure das Risiko schrittweise in einen akzeptablen Bereich bringen. Im Alltag mache ich das zum Beispiel unbewusst, wenn ich beim Überholen im Auto abwäge, wie wahrscheinlich Gegenverkehr ist und wie schlimm ein Unfall wäre."}, {"id": "C11.vq.PZgmA3llLso.abc", "t": "abc", "abruf": 1, "vid": "PZgmA3llLso", "vq": "nach", "m": ["Akzeptabel", "Ausmass", "Erste Hilfe", "Gefahr", "Massnahme", "Matrix", "Risiko", "Schutzausrüstung", "Toleranz", "Versicherung", "Wahrscheinlichkeit", "Zone"], "q": "ABC-Liste zu «Risikoanalyse einfach erklärt: Schritt für Schritt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C11.vq.PZgmA3llLso.kawa", "t": "kawa", "abruf": 1, "vid": "PZgmA3llLso", "vq": "nach", "wort": "RISIKO", "m": ["R: Risikomatrix zeigt Wahrscheinlichkeit und Ausmass gemeinsam", "I: In der roten Zone gilt ein Risiko als nicht akzeptabel", "S: Schutzausrüstung wie Helm senkt das Ausmass eines möglichen Treffers", "K: Kein Akteur soll am Ende laut Zieldefinition Schaden nehmen", "O: Ohne wiederholtes Üben unter realen Bedingungen wäre das Risiko höher"], "q": "KaWa zu «RISIKO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C11.vq.AC0m84M8VF4.vor0", "vid": "AC0m84M8VF4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert mit den Gesamtkosten, wenn ein Unternehmen ein Produkt komplett extern einkauft, also Fremdbezug, statt es selbst herzustellen?", "a": ["Es entstehen nur fixe Kosten", "Es entstehen vor allem variable Kosten, die mit der Menge steigen", "Es entstehen gar keine Kosten", "Die Kosten sind immer identisch mit der Eigenfertigung"], "r": 1, "e": "Beim Fremdbezug fallen vor allem variable Kosten an, die Gesamtkosten steigen also mit der bestellten Menge."}, {"id": "C11.vq.AC0m84M8VF4.vor1", "vid": "AC0m84M8VF4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ab welcher Produktionsmenge lohnt sich im Beispiel des Videos die Eigenfertigung des 'simple Phone' mehr als der Einkauf bei der China Company AG?", "a": ["Ab jeder beliebigen Menge", "Erst ab dem sogenannten Break-Even-Point von 625.000 Stück", "Nie, Einkauf ist immer günstiger", "Nur bei genau 100.000 Stück"], "r": 1, "e": "Ab 625.000 Stück, dem Break-Even-Point, wird die Eigenfertigung günstiger als der Fremdbezug bei der China Company AG."}, {"id": "C11.v.AC0m84M8VF4", "t": "frei", "abruf": 1, "vid": "AC0m84M8VF4", "vq": "nach", "q": "Video «Make-or-Buy-Entscheidung» (Wirtschaft - simpleclub): Was waren die Kernaussagen?", "m": "1. Bei der Make-or-Buy-Entscheidung fallen bei Eigenfertigung sowohl fixe als auch variable Kosten an, waehrend beim Fremdbezug meist nur variable, aber dafuer hoehere Stueckkosten anfallen. 2. Der Break-Even-Point ergibt sich, indem man die Kostenfunktionen von Eigenfertigung und Fremdbezug gleichsetzt; im Beispiel des Videos liegt er bei 625000 Stueck, unterhalb derer der Fremdbezug guenstiger ist. 3. Neben den reinen Kosten sprechen Kontrolle ueber den Fertigungsprozess und eigener Know-how-Aufbau fuer die Eigenfertigung, waehrend strategische Flexibilitaet ohne Fixkostenbindung und Zugang zu Lieferanten-Know-how fuer den Fremdbezug sprechen."}, {"id": "C11.vq.AC0m84M8VF4.nach0", "vid": "AC0m84M8VF4", "vq": "nach", "t": "mc", "q": "Welche Kostenart entsteht bei der Eigenfertigung zusätzlich zu den variablen Kosten, beim Fremdbezug aber nicht?", "a": ["Fixkosten für Maschinen", "Transportkosten", "Gewinnanteil des Lieferanten", "Es gibt keinen Unterschied"], "r": 0, "e": "Eigenfertigung bringt Fixkosten mit sich, zum Beispiel für Maschinen, die beim Fremdbezug entfallen."}, {"id": "C11.vq.AC0m84M8VF4.nach1", "vid": "AC0m84M8VF4", "vq": "nach", "t": "mc", "q": "Warum ents
