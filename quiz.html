 leicht gemacht", "titel": "STEP-/PEST-Analyse leicht gemacht", "dauer": "10:44"}], "pn": 9}, {"key": "C6", "titel": "KI-Einsatzmöglichkeiten finden und priorisieren", "warum": "B1 bis B3. Dünnes Feld auf YouTube, wenig gute deutsche Videos.", "fragen": [{"id": "C6.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «KI-Einsatzmöglichkeiten finden und priorisieren»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: B1 bis B3. Dünnes Feld auf YouTube, wenig gute deutsche Videos. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C6.vq.QkvrSLth3g8.vor0", "vid": "QkvrSLth3g8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Womit sollte man laut Video eine KI-Strategie beginnen, ähnlich wie beim Bau eines Hauses?", "a": ["Mit der Auswahl von Farben und Deko", "Mit einem strategischen Bauplan zu Bedarf, Budget und Zeitplan", "Mit dem teuersten verfügbaren KI-Tool", "Mit einer zufälligen Auswahl"], "r": 1, "e": "Das Video vergleicht die KI-Strategie mit einem Hausbau, der mit einem strategischen Bauplan beginnt."}, {"id": "C6.vq.QkvrSLth3g8.vor1", "vid": "QkvrSLth3g8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele grosse strategische KI-Anwendungsfälle empfiehlt das Video parallel zu verfolgen?", "a": ["So viele wie möglich gleichzeitig", "Ein bis drei plus ein paar schnelle Erfolge", "Mindestens zehn", "Keinen einzigen"], "r": 1, "e": "Das Video empfiehlt ein bis drei grosse strategische Anwendungsfälle plus einige Quick Wins."}, {"id": "C6.v.QkvrSLth3g8", "t": "frei", "abruf": 1, "vid": "QkvrSLth3g8", "vq": "nach", "q": "Video «So identifizieren Sie strategische KI-Anwendungsfälle» (Bernard Marr): Was waren die Kernaussagen?", "m": "1. KI-Anwendungsfaelle sollten zuerst an den strategischen Unternehmenszielen ausgerichtet werden, indem man fragt, welche Geschaeftsziele bestehen und wo KI dabei am meisten Wert schaffen koennte. 2. Im zweiten Schritt wird jeder Anwendungsfall im Detail definiert, inklusive benoetigter Daten, Technologie, Talente und Risiken, was der Referent als AI-Use-Case-Blueprint bezeichnet. 3. Im dritten Schritt wird rigoros priorisiert, wobei sich Unternehmen auf ein bis drei grosse strategische Anwendungsfaelle plus einige schnelle Erfolge konzentrieren sollten, statt Technologie um ihrer selbst willen einzusetzen."}, {"id": "C6.vq.QkvrSLth3g8.nach0", "vid": "QkvrSLth3g8", "vq": "nach", "t": "mc", "q": "Was ist laut Video der erste Schritt, um passende KI-Anwendungsfälle zu identifizieren?", "a": ["Sofort ein KI-Tool kaufen", "Sich an der eigenen Geschäftsstrategie und den wichtigsten Zielen ausrichten", "Alle Abteilungen unabhängig voneinander KI ausprobieren lassen", "Ein neues Büro eröffnen"], "r": 1, "e": "Der erste Schritt im Video ist die Ausrichtung an der bestehenden Geschäftsstrategie."}, {"id": "C6.vq.QkvrSLth3g8.nach1", "vid": "QkvrSLth3g8", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge sollte man laut Video prüfen, wenn man einen konkreten KI-Anwendungsfall im Detail definiert?", "a": ["Die benötigten Daten und Technologien", "Die Farbe des Firmenlogos", "Talente, Fähigkeiten und mögliche Risiken", "Die Wetterlage am Firmensitz"], "r": [0, 2], "e": "Das Video nennt Daten, Technologie, Talent und Risiken als zentrale Punkte des Anwendungsfall-Blueprints."}, {"id": "C6.vq.QkvrSLth3g8.nach2", "vid": "QkvrSLth3g8", "vq": "nach", "t": "lueck", "q": "Ein Beispiel für einen Quick Win im Video ist ein KI-___-Assistent, während personalisierte Empfehlungen wie bei Disney Plus ein strategischer Anwendungsfall sind.", "r": ["meeting"], "e": "Das Video nennt einen KI-Meeting-Assistenten als Beispiel für einen schnellen, kleinen Erfolg."}, {"id": "C6.vq.QkvrSLth3g8.nach3", "vid": "QkvrSLth3g8", "vq": "nach", "t": "frei", "q": "Erkläre, warum ein Unternehmen laut Video ohne strategische Ausrichtung am Ende einen zerstreuten Ansatz mit unverbundenen KI-Lösungen in verschiedenen Abteilungen bekommt.", "m": "Ohne gemeinsame Strategie sucht sich jede Abteilung ihre eigenen KI-Tools aus, ohne sich abzustimmen. So entstehen viele einzelne Insellösungen, die nicht miteinander verbunden sind und keinen gemeinsamen strategischen Nutzen für das ganze Unternehmen bringen."}, {"id": "C6.vq.QkvrSLth3g8.abc", "t": "abc", "abruf": 1, "vid": "QkvrSLth3g8", "vq": "nach", "m": ["Blueprint", "Budget", "Daten", "Disney Plus", "Momentum", "Prioritaet", "Quick Win", "Risiko", "Strategie", "Talent", "Technologie", "Use Case"], "q": "ABC-Liste zu «So identifizieren Sie strategische KI-Anwendungsfälle»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C6.vq.QkvrSLth3g8.kawa", "t": "kawa", "abruf": 1, "vid": "QkvrSLth3g8", "vq": "nach", "wort": "STRATEGIE", "m": ["S: Strategie: der Ausgangspunkt für jede gute Wahl von KI-Anwendungsfällen", "T: Talent: die Fähigkeiten, die für einen Anwendungsfall nötig sind", "R: Risiko: sollte bei jedem Anwendungsfall mitbedacht werden", "A: Ausrichtung: KI-Anwendungsfälle müssen zur Geschäftsstrategie passen", "E: Erfolg: kleine, schnelle Quick Wins bauen Schwung auf", "G: Geschäftsziele: der Ausgangspunkt, um zu prüfen, wo KI helfen kann", "I: Identifizieren: im ersten Schritt werden passende Anwendungsfälle identifiziert"], "q": "KaWa zu «STRATEGIE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C6.vq.gMSJutIllhc.vor0", "vid": "gMSJutIllhc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viel Prozent der Zeit bei einem KI-Projekt fliesst laut dem Gespräch typischerweise in die Datenaufbereitung statt in die eigentliche KI-Arbeit?", "a": ["20 Prozent", "50 Prozent", "80 Prozent", "100 Prozent"], "r": 2, "e": "Die klassische Formel im Gespräch lautet, dass Data Preparation 80 Prozent der Zeit braucht, der Rest sind nur 20 Prozent."}, {"id": "C6.vq.gMSJutIllhc.vor1", "vid": "gMSJutIllhc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Womit vergleicht Claudia Pohlink die Arbeit der Datenaufbereitung?", "a": ["Mit einem Handwerksberuf, der Wasserleitungen legt", "Mit einem Marathonlauf", "Mit einer Steuererklärung", "Mit einem Schachspiel"], "r": 0, "e": "Sie nennt Menschen, die Daten aufbereiten, digitale Handwerker und vergleicht das mit dem Verlegen von Wasserleitungen."}, {"id": "C6.v.gMSJutIllhc", "t": "frei", "abruf": 1, "vid": "gMSJutIllhc", "vq": "nach", "q": "Video «Warum der Mittelstand beim Thema Daten im Vorteil ist | Claudia Pohlink, FIEGE» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Claudia Pohlink empfiehlt, vor jeder Investition in eine neue KI-Anwendung zunächst einen konkreten Schwellenwert festzulegen, etwa mindestens 15 Prozent weniger Leerfahrten bei Gabelstaplern, ab dem sich die Investition lohnt. 2. Bei Fiege wurde das Beschwerdemanagement für beschädigte oder verlorene Pakete (Carrier Claims Management) mit einem Agenten automatisiert und erreichte dabei einen Automatisierungsgrad von 70 Prozent. 3. Sie beschreibt drei Datenreifegrade im firmeneigenen Datensee (Bronze-, Silber-, Gold-Layer) und betont, dass die reine Datenaufbereitung weiterhin 80 Prozent der Arbeitszeit beansprucht, während KI nur die restlichen 20 Prozent übernimmt."}, {"id": "C6.vq.gMSJutIllhc.nach0", "vid": "gMSJutIllhc", "vq": "nach", "t": "mc", "q": "In welche drei Level teilt Fiege laut Gespräch die Daten in ihrem Datensee ein?", "a": ["Bronze, Silber, Gold", "Rot, Gelb, Grün", "Klein, Mittel, Gross", "Anfang, Mitte, Ende"], "r": 0, "e": "Rohdaten liegen im Bronze-Level, aufbereitete Daten im Silber- und Gold-Level."}, {"id": "C6.vq.gMSJutIllhc.nach1", "vid": "gMSJutIllhc", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge empfiehlt Claudia Pohlink dem Mittelständler, der einfach sagt Microsoft wird schon lösen?", "a": ["Sich mit dem Thema Governance beschäftigen", "Sofort das teuerste neue Sprachmodell kaufen", "Die bestehenden Microsoft-Werkzeuge im vollen Umfang nutzen", "Alle Mitarbeitenden entlassen"], "r": [0, 2], "e": "Sie empfiehlt, Governance als Leitplanke zu verstehen und die vorhandenen Microsoft-Tools erst richtig auszuschöpfen, bevor man dem neuesten Modell hinterherläuft."}, {"id": "C6.vq.gMSJutIllhc.nach2", "vid": "gMSJutIllhc", "vq": "nach", "t": "lueck", "q": "Beim Beispiel der Gabelstapler-Leerfahrten wollte der Kollege mindestens 15 Prozent Reduktion erreichen, bevor sich die Investition in die Technologie laut Gespräch ___.", "r": ["lohnt"], "e": "Erst ab diesem Schwellenwert soll es laut dem Kollegen sinnvoll sein, weiter in die Technologie zu investieren."}, {"id": "C6.vq.gMSJutIllhc.nach3", "vid": "gMSJutIllhc", "vq": "nach", "t": "frei", "q": "Erkläre, was mit dem Excel-Symptom gemeint ist, wenn Mitarbeitende trotz eines neuen Tools weiterhin eigene Exceltabellen führen.", "m": "Wenn Mitarbeitende ein neues digitales Tool bekommen, sich aber trotzdem heimlich eine eigene Exceltabelle herunterladen und selbst ausfüllen, zeigt das, dass das Tool ihre eigentlichen Bedürfnisse nicht gut genug abdeckt. Das ist laut dem Gespräch ein Zeichen für schlechtes Produktdesign im Unternehmen. Man muss dann ehrlich zu sich selbst sein und prüfen, ob man das Tool verbessert oder abschafft."}, {"id": "C6.vq.gMSJutIllhc.abc", "t": "abc", "abruf": 1, "vid": "gMSJutIllhc", "vq": "nach", "m": ["Agent", "Bronze-Level", "Claims Management", "Datensee", "Digitale Handwerker", "Excel-Symptom", "Governance", "Guardrails", "Leerfahrten", "Mittelstand", "Schwellenwert", "Use Case"], "q": "ABC-Liste zu «Warum der Mittelstand beim Thema Daten im Vorteil ist | Claudia Pohlink, FIEGE»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C6.vq.gMSJutIllhc.kawa", "t": "kawa", "abruf": 1, "vid": "gMSJutIllhc", "vq": "nach", "wort": "GOVERNANCE", "m": ["G: Governance: gibt Leitplanken vor, klingt unsexy, ist aber nötig", "O: Ohne gute Daten keine gute KI, deshalb ist Data Preparation so wichtig", "V: Verhandlung im Unternehmen, wie Daten überhaupt gesammelt werden", "E: Excel-Symptom: Mitarbeitende umgehen ein schlechtes Tool mit eigenen Tabellen", "R: Reisekostenabrechnung: ein häufig genutzter Use Case im Büro", "N: Neugier hilft dabei, ständig Neues auszuprobieren", "A: Agent: automatisiert bei Fiege 70 Prozent des Beschwerdemanagements", "C: Claims Management: das Beschwerdemanagement bei Fiege"], "q": "KaWa zu «GOVERNANCE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C6.vq.i6Ww8zqIUiA.vor0", "vid": "i6Ww8zqIUiA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wer sollte die Gewichte der Kriterien festlegen?", "a": ["Die KI-Fachperson allein", "Der Anbieter", "Die Geschäftsleitung, vor der Bewertung, mit Datum", "Niemand, alle Kriterien zählen gleich"], "r": 2, "e": "Gewichte sind eine Führungsentscheidung. Werden sie nach den Punkten festgelegt, sind sie ein Wunschzettel mit Dezimalstellen."}, {"id": "C6.vq.i6Ww8zqIUiA.vor1", "vid": "i6Ww8zqIUiA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Das Modell findet im riskantesten Fünftel der Termine 58 % der Ausfälle. Wie gut wäre reines Raten?", "a": ["58 %", "50 %", "20 %", "5 %"], "r": 2, "e": "Wer zufällig ein Fünftel markiert, erwischt ein Fünftel der Ausfälle. 58 % ist fast dreimal so gut."}, {"id": "C6.v.i6Ww8zqIUiA", "t": "frei", "abruf": 1, "vid": "i6Ww8zqIUiA", "vq": "nach", "q": "Video «AIB 64 · Lückenfüller 3: Priorisieren und Proof of Concept» (EvoldoTV · eigenes Lernvideo (privat)): Was waren die Kernaussagen?", "m": "1. Vor der Tabelle wird ausgesiebt: Problem mit Zahl, Daten, erlaubt, Auftraggeber. Wer an einer Frage scheitert, bekommt keine Punkte. 2. Gewichte legt die Geschäftsleitung vor der Bewertung fest, jede Punktzahl hat einen Anker, und am Schluss steht der Kipppunkt: ab 60 % Gewicht auf Nutzen kippt die Reihenfolge. 3. Ein Proof of Concept hat Frage, Messgrösse, Vergleichswert und vorher festgelegte Erfolgs- und Abbruchkriterien. Er beweist Machbarkeit, erst der Pilot beweist Wirkung."}, {"id": "C6.vq.i6Ww8zqIUiA.nach0", "vid": "i6Ww8zqIUiA", "vq": "nach", "t": "mc", "q": "Warum fliegt die Röntgen-KI aus dem eigenen Versuch?", "a": ["Zu wenig Nutzen", "Software, die Diagnosen stellt, ist ein Medizinprodukt und braucht eine Zulassung", "Die Zahnärzte wollen sie nicht", "Es gibt keine Röntgenbilder"], "r": 1, "e": "K.-o.-Frage «Dürfen wir das?». So etwas kauft man zertifiziert oder gar nicht."}, {"id": "C6.vq.i6Ww8zqIUiA.nach1", "vid": "i6Ww8zqIUiA", "vq": "nach", "t": "ord", "q": "Ordne: vom Versuch zum Betrieb.", "a": ["Proof of Concept: Geht das überhaupt?", "Pilot: Wirkt es im echten Betrieb?", "Rollout: alle"], "e": "Drei Stufen, drei Fragen, drei Entscheide. Der PoC berührt keinen Patienten, der Pilot hat eine Vergleichsgruppe."}, {"id": "C6.vq.i6Ww8zqIUiA.nach2", "vid": "i6Ww8zqIUiA", "vq": "nach", "t": "ms", "q": "Welche drei Kontrollen macht Luca am PoC-Ergebnis?", "a": ["Stimmt die Zahl an jedem Standort?", "Was kostet ein Fehlalarm?", "Wen trifft es, und was ist die Folge?", "Wie teuer war die Software?", "Wie viele Folien hat der Bericht?"], "r": [0, 1, 2], "e": "Das Ergebnis ist die Zahl, ihre Streuung und der Preis ihrer Fehler."}, {"id": "C6.vq.i6Ww8zqIUiA.nach3", "vid": "i6Ww8zqIUiA", "vq": "nach", "t": "lueck", "q": "Ein PoC ohne ___ kann nicht scheitern und beweist darum auch nichts.", "r": ["abbruchkriterium"], "e": "Das Abbruchkriterium wird vor dem Test festgelegt, weil nachher jede Zahl gut aussieht."}, {"id": "C6.vq.i6Ww8zqIUiA.nach4", "vid": "i6Ww8zqIUiA", "vq": "nach", "t": "frei", "q": "Fachgespräch: «Wie hätte eine andere Gewichtung Ihr Ergebnis verändert?» Antworte für dein eigenes Projekt.", "m": "Gute Antwort: Ich habe die Gewichte variiert. Meine Empfehlung bleibt stabil, solange Kriterium X nicht mehr als Y Prozent zählt, darüber kippt es zu Alternative B. Die Gewichte hat die Geschäftsleitung am (Datum) festgelegt, vor der Bewertung. Wenn du den Kipppunkt deines Projekts noch nicht kennst: heute ausrechnen."}, {"id": "C6.vq.i6Ww8zqIUiA.abc", "t": "abc", "abruf": 1, "vid": "i6Ww8zqIUiA", "vq": "nach", "m": ["Abbruchkriterium", "Anker", "Aussieben", "Baseline", "Fehlalarm", "Gewichte", "K.-o.-Frage", "Kipppunkt", "Medizinprodukt", "Nutzwert", "Pilot", "Rückwärtstest", "Sensitivität", "Streuung", "Vergleichswert"], "q": "ABC-Liste zu «AIB 64 · Lückenfüller 3: Priorisieren und Proof of Concept»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C6.vq.i6Ww8zqIUiA.kawa", "t": "kawa", "abruf": 1, "vid": "i6Ww8zqIUiA", "vq": "nach", "wort": "PRIO", "m": ["P: Problem mit Zahl, sonst raus", "R: Reihenfolge: erst Gewichte, dann Punkte", "I: Ist es stabil? Der Kipppunkt", "O: Ohne Abbruchkriterium kein Versuch"], "q": "KaWa zu «PRIO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C6.0", "t": "ord", "q": "Von 37 Ideen zur Roadmap: richtige Reihenfolge.", "a": ["Ideen in einheitlichen Steckbriefen erfassen", "K.-o.-Kriterien anwenden und Doppelte streichen (Triage)", "Verbleibende Ideen nach gewichteten Kriterien bewerten", "Priorisierungsvorschlag und Nein-Liste der Geschäftsleitung vorlegen", "Top-Ideen als PoC starten, Rest im Portfolio führen"], "e": "Trichter statt Wunschliste. Die Nein-Liste ist genauso wichtig wie die Startliste."}, {"id": "C6.1", "t": "ms", "q": "Welche zwei Ideen scheiden in der Triage VOR der Bewertung aus?", "a": ["Idee ohne jede verfügbare Datenquelle", "Idee mit hohem Nutzen und mittlerem Aufwand", "Idee, die gegen geltendes Recht verstösst", "Idee, die zwei Abteilungen betrifft"], "r": [0, 2], "e": "K.-o.: keine Daten, rechtlich unzulässig, kein Bezug zur Strategie, kein Auftraggeber."}, {"id": "C6.2", "t": "mc", "q": "Welcher Prozess eignet sich am WENIGSTEN für einen ersten PoC in drei Monaten?", "a": ["Häufiger, regelbasierter Prozess mit guten Daten", "Seltener, hochkritischer Prozess mit schlechten Daten und vielen Ausnahmen", "Interner Prozess mit motiviertem Team", "Prozess mit klar messbarer Fehlerquote"], "r": 1, "e": "Erste PoCs: häufig, messbar, datenreich, fehlertolerant, mit willigem Team."}, {"id": "C6.3", "t": "frei", "q": "Nenne aus dem Kopf die Felder eines Ideen-Steckbriefs.", "m": "Titel und Auftraggeber. Problem und heutige Kosten (Zahl). Ziel (SOLL, messbar). Betroffene Prozesse und Anspruchsgruppen. Datenquellen und deren Zustand. Lösungsidee grob (welche Art KI). Nutzen, Aufwand, Risiken in drei Stufen. Abhängigkeiten. Strategische Passung. Nächster Schritt."}], "videos": [{"id": "QkvrSLth3g8", "kanal": "Bernard Marr", "titel": "So identifizieren Sie strategische KI-Anwendungsfälle", "dauer": "3:30"}, {"id": "gMSJutIllhc", "kanal": "Christoph Magnussen", "titel": "Warum der Mittelstand beim Thema Daten im Vorteil ist | Claudia Pohlink, FIEGE", "dauer": "1:09:06"}, {"id": "i6Ww8zqIUiA", "kanal": "EvoldoTV · eigenes Lernvideo (privat)", "titel": "AIB 64 · Lückenfüller 3: Priorisieren und Proof of Concept", "dauer": "14:42"}], "pn": 7}, {"key": "C7", "titel": "Prozesse analysieren", "warum": "B2: Wo im Ablauf steckt der Verlust, den KI beheben soll?", "fragen": [{"id": "C7.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Prozesse analysieren»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: B2: Wo im Ablauf steckt der Verlust, den KI beheben soll? Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C7.vq.hoGW1RQcebk.vor0", "vid": "hoGW1RQcebk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert laut Video, wenn man eine Prozessanalyse macht, ohne vorher klare Prozessziele festzulegen?", "a": ["Die Analyse wird automatisch billiger", "Die Analyse ist reine Selbstverschwendung, weil die Richtung fehlt", "Der Prozess verbessert sich trotzdem von alleine", "Man braucht dann gar keine Mitarbeiter mehr"], "r": 1, "e": "Das Video sagt ausdrücklich, ohne definierte Prozessziele sei die ganze Analyse Selbstverschwendung."}, {"id": "C7.vq.hoGW1RQcebk.vor1", "vid": "hoGW1RQcebk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was sollte man laut Video zuerst sicherstellen, bevor man einen Prozess beschleunigt, also effizienter macht?", "a": ["Dass der Prozess zuerst fehlerfrei läuft, also Effektivität hat", "Dass möglichst viele Mitarbeiter eingesetzt werden", "Dass der Prozess komplett automatisiert wird", "Dass der Prozess zuerst billiger wird"], "r": 0, "e": "Das Video sagt, erst muss die Effektivität stimmen, danach kommt die Effizienz."}, {"id": "C7.v.hoGW1RQcebk", "t": "frei", "abruf": 1, "vid": "hoGW1RQcebk", "vq": "nach", "q": "Video «Prozessanalyse: Verluste und Verschwendung entdecken» (Unternehmensberatung Axel Schröder): Was waren die Kernaussagen?", "m": "1. Eine Prozessanalyse beginnt mit dem qualitativen Verstaendnis des Prozesses, wie er tatsaechlich und nicht wie er idealerweise ablaeuft, inklusive aller Ruecksprünge, Schleifen und Wartezeiten, und wird durch ein quantitatives Verstaendnis mit Kennzahlen wie Durchlaufzeit und Bearbeitungszeit ergaenzt. 2. Zur Ursachenanalyse wird ein Problem wie haeufige Rueckfragen in Einzelfragen zerlegt, zum Beispiel ob sich die Rueckfrage auf die Leistungsposition, die Menge oder den Preis bezieht, um gezielt Loesungen zu finden. 3. Zuerst muss ein Prozess fehlerfrei laufen, auch wenn er dadurch langsamer wird, und erst danach wird er mit Hilfe der acht Verschwendungsarten aus dem Lean Management auf Geschwindigkeit und Effizienz optimiert."}, {"id": "C7.vq.hoGW1RQcebk.nach0", "vid": "hoGW1RQcebk", "vq": "nach", "t": "mc", "q": "Was ist laut Video der Unterschied zwischen qualitativem und quantitativem Verständnis eines Prozesses?", "a": ["Qualitativ sind die Zahlen und Daten, quantitativ die Arbeitsschritte", "Qualitativ ist die genaue Kenntnis aller Arbeitsschritte, quantitativ sind die Prozessdaten wie Durchlaufzeit", "Beide meinen genau dasselbe", "Quantitativ bezieht sich nur auf die Kosten"], "r": 1, "e": "Das Video unterscheidet genau so: qualitativ sind die Arbeitsschritte, quantitativ die messbaren Prozessdaten."}, {"id": "C7.vq.hoGW1RQcebk.nach1", "vid": "hoGW1RQcebk", "vq": "nach", "t": "ms", "q": "Welche zwei Arten von Zeiten nennt das Video als Beispiele für Prozessdaten?", "a": ["Durchlaufzeit", "Bearbeitungszeit", "Rechnungsbetrag", "Mitarbeiteralter"], "r": [0, 1], "e": "Durchlaufzeit und Bearbeitungszeit nennt das Video ausdrücklich als Prozessdaten."}, {"id": "C7.vq.hoGW1RQcebk.nach2", "vid": "hoGW1RQcebk", "vq": "nach", "t": "lueck", "q": "Bevor man eine Prozessanalyse macht, sollte man laut Video zuerst klare Prozess___ festlegen, sonst ist der Aufwand reine Verschwendung.", "r": ["ziele"], "e": "Das Video sagt ausdrücklich, ohne definierte Prozessziele sei die ganze Analyse Selbstverschwendung."}, {"id": "C7.vq.hoGW1RQcebk.nach3", "vid": "hoGW1RQcebk", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel aus deinem Alltag, wo zuerst Fehlerfreiheit und erst danach Geschwindigkeit wichtig wäre, so wie im Video beschrieben.", "m": "Beim Kochen für Gäste ist es wichtiger, dass das Essen zuerst wirklich richtig gelingt, bevor man überlegt, wie man den Ablauf schneller macht. Würde man zuerst nur auf Tempo achten, könnten Fehler entstehen, die man hinterher mühsam ausbügeln müsste. Erst wenn der Ablauf zuverlässig funktioniert, lohnt es sich, ihn zu beschleunigen."}, {"id": "C7.vq.hoGW1RQcebk.abc", "t": "abc", "abruf": 1, "vid": "hoGW1RQcebk", "vq": "nach", "m": ["Bearbeitungszeit", "Durchlaufzeit", "Effektivität", "Effizienz", "Lean Management", "Prozessanalyse", "Prozessziel", "Qualitativ", "Quantitativ", "Schwachstelle", "Verschwendung", "Wartezeit"], "q": "ABC-Liste zu «Prozessanalyse: Verluste und Verschwendung entdecken»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C7.vq.hoGW1RQcebk.kawa", "t": "kawa", "abruf": 1, "vid": "hoGW1RQcebk", "vq": "nach", "wort": "PROZESS", "m": ["P: Prozessziel: ohne klares Ziel ist die Analyse reine Verschwendung", "R: Rückfragen: kosten Herrn Müller im Beispiel viel Arbeitszeit", "O: Optimierung: das eigentliche Ziel der Prozessanalyse", "Z: Zeit: wird über Durchlaufzeit und Bearbeitungszeit gemessen", "E: Effektivität: zuerst muss der Prozess fehlerfrei laufen", "S: Schleifen: gehören zu den Arbeitsschritten, die man genau anschauen muss"], "q": "KaWa zu «PROZESS»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C7.vq.SgRfRGMSSQs.vor0", "vid": "SgRfRGMSSQs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist laut Video der Output eines Prozesses?", "a": ["Der Startpunkt eines Prozesses", "Das definierte Arbeitsergebnis, das am Ende entsteht", "Die Anzahl der beteiligten Personen", "Der Name der Abteilung"], "r": 1, "e": "Das Video definiert einen Prozess als wiederkehrende Abfolge von Aktivitäten, die ein definiertes Arbeitsergebnis erzeugen, das ist der Output."}, {"id": "C7.vq.SgRfRGMSSQs.vor1", "vid": "SgRfRGMSSQs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was legt die vordere und hintere Prozessgrenze im Beispiel des Videos fest?", "a": ["Den genauen Start- und Endpunkt des Prozesses", "Die Anzahl der Mitarbeiter im Prozess", "Das Gehalt der Beteiligten", "Die Farbe des Prozessdiagramms"], "r": 0, "e": "Prozessgrenzen legen laut Video fest, wo ein Prozess beginnt und wo er endet, im Beispiel ist das das Gespräch mit dem Vorgesetzten und der Beginn des Mutterschutzes."}, {"id": "C7.v.SgRfRGMSSQs", "t": "frei", "abruf": 1, "vid": "SgRfRGMSSQs", "vq": "nach", "q": "Video «Prozessmanagement einfach erklärt» (EasyFilmsTM): Was waren die Kernaussagen?", "m": "1. Ein Prozess ist eine wiederkehrende Abfolge von Aktivitaeten, die aus einem definierten Input einen definierten Output erzeugt. 2. Die Prozessgrenzen legen fest, wo ein Prozess beginnt und wo er endet, im Beispiel beginnt der Prozess mit dem Gespraech zwischen Mitarbeiterin und Vorgesetztem und endet mit dem Beginn des Mutterschutzes. 3. Einzelprozesse sind Teil von Hauptprozessen, die wiederum in einer Prozesslandkarte dargestellt werden und der Umsetzung der Unternehmensstrategie dienen."}, {"id": "C7.vq.SgRfRGMSSQs.nach0", "vid": "SgRfRGMSSQs", "vq": "nach", "t": "mc", "q": "Was war im Beispiel des Videos das eigentliche Problem, das zur Einführung von Prozessmanagement führte?", "a": ["Der Umgang mit werdenden Müttern war in den Einrichtungen sehr unterschiedlich geregelt", "Es gab zu wenig Personal in der Zentrale", "Die Mitarbeiterinnen wollten mehr Gehalt", "Es fehlte ein gemeinsames Mittagessen"], "r": 0, "e": "Olga und Paula stellen fest, dass der Umgang mit werdenden Müttern in ihren Einrichtungen sehr unterschiedlich abläuft, das ist der Auslöser im Video."}, {"id": "C7.vq.SgRfRGMSSQs.nach1", "vid": "SgRfRGMSSQs", "vq": "nach", "t": "mc", "q": "Was ist laut Video der Input des beschriebenen Prozesses werdende Eltern begleiten?", "a": ["Die Information über die Schwangerschaft der Mitarbeiterin", "Der Jahresumsatz der Einrichtung", "Die Anzahl der Feiertage", "Der Dienstplan des nächsten Monats"], "r": 0, "e": "Der Prozess braucht laut Video als Input die Information, dass eine Mitarbeiterin schwanger ist."}, {"id": "C7.vq.SgRfRGMSSQs.nach2", "vid": "SgRfRGMSSQs", "vq": "nach", "t": "lueck", "q": "Der Hauptprozess, zu dem das Beispiel gehört, heisst laut Video Personal zur ___ stellen.", "r": ["verfügung"], "e": "Das Video ordnet den Beispielprozess dem Hauptprozess Personal zur Verfügung stellen zu."}, {"id": "C7.vq.SgRfRGMSSQs.nach3", "vid": "SgRfRGMSSQs", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie von Prozessmanagement gehört hat, was ein Prozess laut Video ausmacht, und nenne dabei Input, Output und Prozessgrenzen.", "m": "Ein Prozess ist laut Video eine wiederkehrende Abfolge von Aktivitäten, die aus einem bestimmten Input ein definiertes Ergebnis, den Output, erzeugt. Die Prozessgrenzen legen dabei genau fest, wo der Prozess anfängt und wo er endet. Im Beispiel des Videos ist der Input die Information über eine Schwangerschaft, der Output ist der sichergestellte Gesundheitsschutz der werdenden Mutter."}, {"id": "C7.vq.SgRfRGMSSQs.abc", "t": "abc", "abruf": 1, "vid": "SgRfRGMSSQs", "vq": "nach", "m": ["Ablauf", "Checkliste", "Input", "Mitarbeiterin", "Output", "Personal", "Prozess", "Prozessgrenze", "Qualität", "Standard", "Verband", "Zentrale"], "q": "ABC-Liste zu «Prozessmanagement einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C7.vq.SgRfRGMSSQs.kawa", "t": "kawa", "abruf": 1, "vid": "SgRfRGMSSQs", "vq": "nach", "wort": "PROZESS", "m": ["P: Personal zur Verfügung stellen ist der übergeordnete Hauptprozess", "R: Regelmässige Abläufe wiederholen sich mit demselben Ergebnis", "O: Output ist das definierte Arbeitsergebnis am Ende des Prozesses", "Z: Zentrale erkennt, dass der Gesundheitsschutz einheitlich geregelt werden muss", "E: Einheitliche Standards nützen laut Video allen Beteiligten", "S: Start und Ende legen die Prozessgrenzen fest"], "q": "KaWa zu «PROZESS»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C7.vq.5g868Yujym0.vor0", "vid": "5g868Yujym0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Schritte hat die Prozessanalyse nach dem Toyota-Leitfaden im Video?", "a": ["Drei", "Vier", "Fünf", "Sieben"], "r": 2, "e": "Das Video beschreibt fünf Schritte, von der grafischen Darstellung der Ausbringung bis zur Berechnung des Kernarbeitsinhalts."}, {"id": "C7.vq.5g868Yujym0.vor1", "vid": "5g868Yujym0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man die durchschnittliche Zeit, nach der ein Kunde ein Produkt nachfragt?", "a": ["Zykluszeit", "Taktzeit", "Rüstzeit", "Pausenzeit"], "r": 1, "e": "Die Taktzeit gibt an, in welchem Rhythmus der Kunde ein Produkt nachfragt, berechnet aus verfügbarer Arbeitszeit geteilt durch Nachfrage."}, {"id": "C7.v.5g868Yujym0", "t": "frei", "abruf": 1, "vid": "5g868Yujym0", "vq": "nach", "q": "Video «Prozessanalyse: Sehen lernen bei Toyota» (So geht Toyota Kata): Was waren die Kernaussagen?", "m": "1. Die Taktzeit berechnet sich aus der verfuegbaren Arbeitszeit pro Tag geteilt durch die taeglich nachgefragte Stueckzahl und gibt an, in welchem Rhythmus der Kunde ein Produkt nachfragt. 2. Die geplante Zykluszeit ergibt sich, indem man von der verfuegbaren Arbeitszeit die Verluste wie Ruestzeiten, Ausfaelle und Nacharbeit abzieht und das Ergebnis durch die nachgefragte Stueckzahl teilt. 3. Mit einem Blockdiagramm des Prozessablaufs, gemessenen Ausbringungszyklen und einem 20-Zyklus-Check pro Mitarbeitendem lassen sich Schwankungen im Prozess sichtbar machen und der noetige Personalbedarf ueber den Kernarbeitsinhalt berechnen."}, {"id": "C7.vq.5g868Yujym0.nach0", "vid": "5g868Yujym0", "vq": "nach", "t": "mc", "q": "Wie wird die Taktzeit im Beispiel des Videos berechnet?", "a": ["Verfügbare Arbeitszeit mal Anzahl Mitarbeiter", "Verfügbare Arbeitszeit geteilt durch die tägliche Kundennachfrage", "Anzahl Maschinen geteilt durch Schichten", "Zufällig geschätzt"], "r": 1, "e": "920 Minuten verfügbare Arbeitszeit geteilt durch 1840 nachgefragte Stück ergeben 30 Sekunden Taktzeit."}, {"id": "C7.vq.5g868Yujym0.nach1", "vid": "5g868Yujym0", "vq": "nach", "t": "mc", "q": "Warum ist die geplante Zykluszeit im Beispiel kürzer als die reine Taktzeit von 30 Sekunden?", "a": ["Weil man zufällig eine kleinere Zahl gewählt hat", "Weil Verluste wie Rüstzeiten eingerechnet werden müssen, um die Taktzeit trotzdem zu erreichen", "Weil die Maschine schneller laufen soll als nötig", "Weil die Kundennachfrage sinkt"], "r": 1, "e": "Weil Verlustzeiten wie Rüstzeiten die tatsächlich verfügbare Zeit verringern, muss etwas schneller als die reine Taktzeit produziert werden, um die Nachfrage trotzdem zu erfüllen."}, {"id": "C7.vq.5g868Yujym0.nach2", "vid": "5g868Yujym0", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge misst oder notiert man laut Video im dritten Schritt der Prozessanalyse, dem Ablaufmuster?", "a": ["Die Ausgabenzyklen am Bandende", "Den Aktienkurs des Unternehmens", "Beobachtungen zu den aktuellen Ablaufmustern", "Die Meinungen der Kunden zum Produktdesign"], "r": [0, 2], "e": "Im dritten Schritt werden Ausgabenzyklen gemessen und Beobachtungen zum Ablauf notiert, ohne schon Lösungen zu entwickeln."}, {"id": "C7.vq.5g868Yujym0.nach3", "vid": "5g868Yujym0", "vq": "nach", "t": "frei", "q": "Erkläre, warum es laut Video wichtig ist, bei der Prozessanalyse zunächst nur Beobachtungen zu notieren und noch keine Lösungsansätze zu entwickeln.", "m": "Wenn man zu früh nach Lösungen sucht, läuft man Gefahr, den Ist-Zustand nicht vollständig und objektiv zu erfassen. Erst wenn alle Daten und Beobachtungen zum aktuellen Prozess vorliegen, lassen sich die tatsächlichen Ursachen von Schwankungen erkennen und sinnvolle Verbesserungen ableiten."}, {"id": "C7.vq.5g868Yujym0.abc", "t": "abc", "abruf": 1, "vid": "5g868Yujym0", "vq": "nach", "m": ["Anlagenkapazität", "Ausbringung", "Blockdiagramm", "Kernarbeitsinhalt", "Kundennachfrage", "Rüstzeit", "SAP", "Taktzeit", "Toyota", "Verlust", "Zykluscheck", "Zykluszeit"], "q": "ABC-Liste zu «Prozessanalyse: Sehen lernen bei Toyota»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C7.vq.5g868Yujym0.kawa", "t": "kawa", "abruf": 1, "vid": "5g868Yujym0", "vq": "nach", "wort": "TAKTZEIT", "m": ["T: Taktzeit wird aus verfügbarer Arbeitszeit geteilt durch Kundennachfrage berechnet.", "A: Ausbringung wird zuerst grafisch auf Tagesbasis dargestellt.", "K: Kernarbeitsinhalt zeigt, wie viele Mitarbeiter der Prozess theoretisch braucht.", "Z: Zykluszeit wird geplant, um Verluste wie Rüstzeiten auszugleichen.", "E: Ein Blockdiagramm zeigt die Abfolge der Prozessschritte.", "I: Inventarbestände lassen sich zusätzlich im Blockdiagramm vermerken."], "q": "KaWa zu «TAKTZEIT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C7.vq.BbDChKKwLIc.vor0", "vid": "BbDChKKwLIc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches Wort in einer Ausgangslage verrät am ehesten ein Datenproblem?", "a": ["modern", "teilweise", "digital", "strategisch"], "r": 1, "e": "Wörter wie teilweise, uneinheitlich, nicht systematisch oder manuell erfasst sind die Verräter. Dahinter steckt immer eine der sechs Fragen."}, {"id": "C7.vq.BbDChKKwLIc.vor1", "vid": "BbDChKKwLIc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Drei Jahre Verkaufsdaten. Wie viele Beispiele für «einen Frühling» hat das Modell?", "a": ["Rund 1'000", "90", "3", "36"], "r": 2, "e": "Eine Saison ist ein Beispiel. Drei Jahre sind drei Frühlinge, und einer war verregnet."}, {"id": "C7.v.BbDChKKwLIc", "t": "frei", "abruf": 1, "vid": "BbDChKKwLIc", "vq": "nach", "q": "Video «AIB 62 · Lückenfüller 1: Datenqualität beurteilen» (EvoldoTV · eigenes Lernvideo (privat)): Was waren die Kernaussagen?", "m": "1. Jede Datenquelle bekommt sechs Fragen: vollständig, richtig, aktuell, einheitlich, eindeutig, passend. Eine Strichliste über hundert zufällige Zeilen macht daraus eine Zahl, bei Grünwerk waren 31 von 100 Zeilen unbrauchbar. 2. Die Datenmenge zählt pro Fall, den man vorhersagen will, und die richtige Antwort muss in den Daten stehen: Verkauft (40) ist nicht gewollt (70). 3. Das Urteil ist grün, gelb oder rot mit Reparaturrechnung, und in der Prüfung heisst das Muster: Mangel mit Beleg, Folge für das Modell, Massnahme."}, {"id": "C7.vq.BbDChKKwLIc.nach0", "vid": "BbDChKKwLIc", "vq": "nach", "t": "ord", "q": "Bringe die sechs Fragen in die Reihenfolge des Videos.", "a": ["vollständig", "richtig", "aktuell", "einheitlich", "eindeutig", "passend"], "e": "Merkhilfe aus dem Anker: DATEN. Dürfen, Aktuell, Trifft es die Frage, Einheitlich und eindeutig, Nichts fehlt und nichts ist falsch."}, {"id": "C7.vq.BbDChKKwLIc.nach1", "vid": "BbDChKKwLIc", "vq": "nach", "t": "mc", "q": "Die Filiale Thun erfasst keine Abschriften. Wie sieht sie für das Modell aus?", "a": ["Wie die schlechteste Filiale", "Wie die beste Filiale, weil ihr Verlust nirgends steht", "Wie eine geschlossene Filiale", "Genau richtig"], "r": 1, "e": "Was nicht erfasst ist, existiert für das Modell nicht. Unvollständige Daten wirken wie gute Leistung."}, {"id": "C7.vq.BbDChKKwLIc.nach2", "vid": "BbDChKKwLIc", "vq": "nach", "t": "ms", "q": "Welche zwei Reparaturen lohnen sich laut Noras Rechnung?", "a": ["Doppelte Artikelnummern mit einer Zuordnungsliste zusammenführen", "Alte Aktionen aus Prospekten abtippen", "Kassen schulen und den Sammelartikel «Diverses» begrenzen", "Alle Daten löschen und neu beginnen"], "r": [0, 2], "e": "Zuordnungsliste: zwei Wochen, wirkt sofort. Schulung: wirkt ab nächster Saison. Alte Aktionen abtippen: drei Monate für lückenhafte Ergebnisse, lohnt nicht."}, {"id": "C7.vq.BbDChKKwLIc.nach3", "vid": "BbDChKKwLIc", "vq": "nach", "t": "lueck", "q": "Das Prüfungsmuster für «Beurteilen Sie die Eignung» hat drei Teile: Mangel, Folge, ___ .", "r": ["massnahme"], "e": "Mangel mit Beleg aus dem Text, Folge für das Modell, Massnahme. «Die Qualität muss sichergestellt werden» gibt null Punkte."}, {"id": "C7.vq.BbDChKKwLIc.nach4", "vid": "BbDChKKwLIc", "vq": "nach", "t": "frei", "q": "Transfer: In deinem eigenen Projekt, welche Datenquelle ist gelb, und was kostet die Reparatur? Antworte in drei Sätzen.", "m": "Selbstkontrolle: Hast du den entscheidenden Mangel mit einer der sechs Fragen benannt? Steht eine Zahl dabei (Anteil, Wochen, Franken)? Hast du gesagt, ab wann und in welchem Umfang das Projekt trotzdem starten kann? Das ist genau die Antwort, die im Fachgespräch auf «Wie haben Sie die Machbarkeit geprüft?» erwartet wird."}, {"id": "C7.vq.BbDChKKwLIc.abc", "t": "abc", "abruf": 1, "vid": "BbDChKKwLIc", "vq": "nach", "m": ["Abschriften", "Aktualität", "Bias", "Datenethik", "Diverses", "Eindeutig", "Folge", "Grün-Gelb-Rot", "Label", "Massnahme", "Passend", "Strichliste", "Vollständig", "Zielgrösse", "Zugang"], "q": "ABC-Liste zu «AIB 62 · Lückenfüller 1: Datenqualität beurteilen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C7.vq.BbDChKKwLIc.kawa", "t": "kawa", "abruf": 1, "vid": "BbDChKKwLIc", "vq": "nach", "wort": "DATEN", "m": ["D: Dürfen wir das überhaupt?", "A: Aktuell?", "T: Trifft es meine Frage?", "E: Einheitlich und eindeutig?", "N: Nichts fehlt, nichts ist falsch?"], "q": "KaWa zu «DATEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C7.0", "t": "ord", "q": "Geschäftstätigkeit untersuchen (B2): richtige Reihenfolge.", "a": ["Scope, Ziel (SOLL) und Rahmenbedingungen mit dem Auftraggeber festlegen", "IST-Zustand erheben (Dokumente, Befragung, Beobachtung, Messung)", "IST mit SOLL vergleichen, Problemstellen finden", "Datenquellen auf Eignung prüfen", "Erkenntnisse konsolidieren und dokumentieren"], "e": "Ohne Scope ufert die Analyse aus. Ohne Messung bleibt die Zahl eine Schätzung."}, {"id": "C7.1", "t": "mc", "q": "Die «7 Minuten pro Bericht» stammen aus einem Workshop. Wie sicherst du die Zahl, bevor du damit rechnest?", "a": ["Gar nicht, Workshop reicht", "Messung oder Beobachtung an einer Stichprobe echter Fälle", "Den Anbieter fragen", "Den Durchschnitt googeln"], "r": 1, "e": "Geschätzte Zahlen als Schätzung kennzeichnen und die tragenden Zahlen messen. ort neu vorkommt, hast du im Video verpasst."}, {"id": "C8.vq.ML52GvN7qVI.vor0", "vid": "ML52GvN7qVI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie oft veröffentlicht Gartner den Hype Cycle mit neuen Technologien?", "a": ["einmal im Monat", "einmal im Jahr, jeweils im August", "nur alle fünf Jahre", "nie, es ist eine einmalige Liste"], "r": 1, "e": "Das Video sagt, dass der aktuelle Hype Cycle jedes Jahr im August veröffentlicht wird."}, {"id": "C8.vq.ML52GvN7qVI.vor1", "vid": "ML52GvN7qVI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie verläuft die Erwartungskurve des Hype Cycle am Anfang einer neuen Technologie?", "a": ["sie bleibt konstant niedrig", "sie fällt sofort auf null", "sie steigt langsam und bleibt dann für immer hoch", "sie steigt sehr stark an und fällt danach ebenso stark wieder ab"], "r": 3, "e": "Das Video beschreibt die Erwartungskurve als zunächst stark ansteigend und danach ebenso stark wieder abfallend."}, {"id": "C8.v.ML52GvN7qVI", "t": "frei", "abruf": 1, "vid": "ML52GvN7qVI", "vq": "nach", "q": "Video «Was ist der Gartner Hype Cycle?» (XO Projects): Was waren die Kernaussagen?", "m": "1. Der Gartner Hype Cycle kombiniert eine Erwartungskurve, die zuerst stark steigt und wieder faellt, mit einer Verwertbarkeits- beziehungsweise Marktreifekurve, die langsam ansteigt und auf hohem Niveau bleibt. 2. Der Zyklus durchlaeuft fuenf Punkte: den Technologie-Trigger, den Erwartungsgipfel, das Tal der Enttaeuschung, den Pfad der Erleuchtung und das Plateau der Produktivitaet. 3. Gartner veroeffentlicht den aktualisierten Hype Cycle jedes Jahr im August und ordnet darin neue Technologien nach aktuellem Reifegrad und erwarteter Marktreife ein."}, {"id": "C8.vq.ML52GvN7qVI.nach0", "vid": "ML52GvN7qVI", "vq": "nach", "t": "mc", "q": "Wie heisst der Punkt im Hype Cycle, an dem die übersteigerten Erwartungen ihren Höhepunkt überschritten haben und abstürzen?", "a": ["Plateau der Produktivität", "Pfad der Erleuchtung", "das Tal der Enttäuschung folgt ammeln, Trends nach Relevanz fuer das eigene Geschaeftsmodell bewerten, sie zeitlich als kurz-, mittel- oder langfristig einordnen, ihre Auswirkung auf das Geschaeftsmodell einschaetzen und die noetige Vorlaufzeit fuer die Vorbereitung bestimmen. 2. Als Quellen fuer relevante Trends werden unter anderem Branchennachrichten, Studien, Patentanmeldungen, Startup-Aktivitaeten sowie Gartner-Trendreports und das Zukunftsinstitut genannt. 3. Ein Trendradar muss regelmaessig ueberprueft werden, weil neue Trends dazukommen und sich die Relevanz bestehender Trends veraendern kann."}, {"id": "C8.vq.Pax-HU5tZwc.nach0", "vid": "Pax-HU5tZwc", "vq": "nach", "t": "mc", "q": "Was ist laut Video der erste Schritt beim Aufbau eines Trendradars?", "a": ["Vorlaufzeit für die Vorbereitung festlegen", "Sammeln von Informationen aus verschiedenen Quellen", "Das Geschäftsmodell komplett neu erfinden", "Den Trendradar sofort veröffentlichen"], "r": 1, "e": "Das Video beginnt die fünf Schritte mit dem breiten Sammeln von Informationen aus verschiedenen Quellen."}, {"id": "C8.vq.Pax-HU5tZwc.nach1", "vid": "Pax-HU5tZwc", "vq": "nach", "t": "ms", "q": "Welche zwei Quellen zählt das Video beim Sammeln von Informationen konkret auf?", "a": ["Patentanmeldungen", "Horoskope", "Startup-Aktivitäten", "Kochrezepte"], "r": [0, 2], "e": "Das Video nennt Patentanmeldungen und Startup-Aktivitäten als Beispiele für relevante Quellen beim Sammeln von Informationen."}, {"id": "C8.vq.Pax-HU5tZwc.nach2", "vid": "Pax-HU5tZwc", "vq": "nach", "t": "lueck", "q": "Ein Trendradar muss laut Video ___ überprüft werden, damit er dauerhaft hilft.", "r": ["regelmaessig"], "e": "Das Video betont am Ende ausdrücklich, dass der Trendradar regelmässig überprüft werden muss."}, {"id": "C8.vq.Pax-HU5tZwc.nach3", "vid": "Pax-HU5tZwc", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel, wie du die fünf Schritte aus dem Video nutzen würdest, um einen neuen Trend für dein Unternehmen einzuschätzen.", "m": "Zuerst würde ich Informationen zu einem Trend wie zum Beispiel neuen KI-Werkzeugen aus Branchennachrichten und sozialen Medien sammeln. Danach würde ich bewerten, wie stark dieser Trend mein eigenes Geschäftsmodell tatsächlich beeinflusst, ob das eher kurzfristig oder erst in ein paar Jahren passiert, und wie viel Vorlaufzeit ich brauche, um mich darauf vorzubereiten. Erst danach würde ich entscheiden, wie weit aussen oder innen dieser Trend auf meinem Radar landet."}, {"id": "C8.vq.Pax-HU5tZwc.abc", "t": "abc", "abruf": 1, "vid": "Pax-HU5tZwc", "vq": "nach", "m": ["Branchennachricht", "Gartner", "Geschäftsmodell", "Patentanmeldung", "Recherche", "Relevanz", "Soziale Medien", "Startup", "Trendradar", "Vorlaufzeit", "Zeitliche Einordnung", "Zukunftsinstitut"], "q": "ABC-Liste zu «Wie erkennt man relevante Trends? Trendradar für Unternehmen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C8.vq.Pax-HU5tZwc.kawa", "t": "kawa", "abruf": 1, "vid": "Pax-HU5tZwc", "vq": "nach", "wort": "TREND", "m": ["T: Trendreports von Gartner als guten Startpunkt nutzen", "R: Recherche breit beginnen, Branchennachrichten und Patente einbeziehen", "E: Einschätzen, ob der Einfluss stark oder eher marginal ist", "N: Nach Relevanz bewerten, nicht jeder Trend betrifft das eigene Geschäft", "D: Dauerhaft nur mit regelmässiger Überprüfung, der Radar muss aktuell bleiben"], "q": "KaWa zu «TREND»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C8.vq.hCnyiU365f8.vor0", "vid": "hCnyiU365f8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Kräfte berücksichtigt das Five-Forces-Modell von Porter?", "a": ["Drei", "Vier", "Fünf", "Sieben"], "r": 2, "e": "Das Five-Forces-Modell besteht laut Video aus genau fünf Branchenkräften."}, {"id": "C8.vq.hCnyiU365f8.vor1", "vid": "hCnyiU365f8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie hoch ist lau r Branche erhöhen?", "a": ["Viele grosse Player im Markt", "Ein sehr geringes Marktwachstum", "Ein einziges kleines Unternehmen im Markt", "Unbegrenztes, stark wachsendes Marktwachstum"], "r": [0, 1], "e": "Viele grosse Konkurrenten und geringes Marktwachstum erhöhen laut Video die Rivalität in einer Branche."}, {"id": "C8.vq.hCnyiU365f8.nach2", "vid": "hCnyiU365f8", "vq": "nach", "t": "lueck", "q": "Produkte oder Dienstleistungen, die als Ersatz für das Produkt einer Branche dienen, nennt Porter ___.", "r": ["substitute", "substitutprodukte"], "e": "Solche Ersatzprodukte nennt das Modell von Porter Substitute."}, {"id": "C8.vq.hCnyiU365f8.nach3", "vid": "hCnyiU365f8", "vq": "nach", "t": "frei", "q": "Erkläre am Beispiel der Technologiebranche aus dem Video, warum die Verhandlungsmacht der Lieferanten gegenüber einem sehr grossen Unternehmen gering sein kann.", "m": "Ein sehr grosses Unternehmen kauft riesige Mengen ein und kann Lieferanten deshalb leichter unter Druck setzen. Ausserdem stehen Lieferanten oft selbst im Wettbewerb zueinander, was ihre Verhandlungsmacht gegenüber einem so grossen Kunden zusätzlich schwächt."}, {"id": "C8.vq.hCnyiU365f8.abc", "t": "abc", "abruf": 1, "vid": "hCnyiU365f8", "vq": "nach", "m": ["Abnehmer", "Branchenstrukturanalyse", "Eintrittsbarrieren", "Konkurrenten", "Kundenbindung", "Lieferanten", "Marktwachstum", "Porter", "Rivalitaet", "Substitute", "Verhandlungsmacht"], "q": "ABC-Liste zu «Five-Forces-Modell, Branchenstrukturanalyse»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C8.vq.hCnyiU365f8.kawa", "t": "kawa", "abruf": 1, "vid": "hCnyiU365f8", "vq": "nach", "wort": "PORTER", "m": ["P: Porter: Erfinder des Five-Forces-Modells", "O: Option für Kunden: viele vergleichbare Produkte geben Abnehmern Verhandlungsmacht", "R: Rivalität: steht im Zentrum des Modells", "T: Technologiebranche: Beispiel im Video mi nn ist die Verhandlungsmacht der Kunden laut Video besonders hoch?", "a": ["Bei sehr individuellen Luxusprodukten", "Bei standardisierten Produkten wie Benzin", "Wenn es nur einen Anbieter gibt", "Nie, Kunden haben immer wenig Macht"], "r": 1, "e": "Bei standardisierten Produkten wie Benzin können Kunden leicht wechseln, was ihre Verhandlungsmacht erhöht."}, {"id": "C8.vq.3MR4MwzhFXQ.nach1", "vid": "3MR4MwzhFXQ", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele für Markteintrittsbarrieren nennt das Video?", "a": ["Hohe Kapitalerfordernisse für neue Anbieter", "Ein Übermass an Lieferanten", "Erschwerter Zugang zu Vertriebskanälen", "Zu niedrige Fixkosten"], "r": [0, 2], "e": "Hohe Kapitalerfordernisse und ein erschwerter Zugang zu Vertriebskanälen wie Regalflächen sind zwei der genannten Zugangsbarrieren."}, {"id": "C8.vq.3MR4MwzhFXQ.nach2", "vid": "3MR4MwzhFXQ", "vq": "nach", "t": "lueck", "q": "Ersatzprodukte sind laut Video besonders gefährlich, wenn Kunden kaum ___ zu einem Produkt haben.", "r": ["loyalität"], "e": "Ohne Kundenloyalität wechseln Kunden leicht zu einem günstigeren oder gleichwertigen Substitut."}, {"id": "C8.vq.3MR4MwzhFXQ.nach3", "vid": "3MR4MwzhFXQ", "vq": "nach", "t": "frei", "q": "Erkläre an einem Beispiel aus dem Video, warum die Verhandlungsmacht der Lieferanten in manchen Branchen besonders gross ist.", "m": "Wenn es nur wenige Lieferanten, aber viele Nachfrager in einer Branche gibt, sitzen die Lieferanten am längeren Hebel, wie es im Video heisst. Sie können dann die Preise für ihre Produkte oder Dienstleistungen erhöhen, ohne einen Kunden zu verlieren. Besonders stark ist diese Macht, wenn ihre Produkte kaum durch andere ersetzt werden können."}, {"id": "C8.vq.3MR4MwzhFXQ.abc", "t": "abc", "abruf": 1, "vid": "3MR4MwzhFXQ", "vq": "nach", "m": ["Barriere", "Branchenstrukturanalyse", "Ersatzprodukt", "Fixkosten", "Kapitalerfordernis", "Konkurrent", "Lieferant", "Marktmacht", "Porter", "Regierung", "Rivalität", "Substitut"], "q": "ABC-Li e Claude Code und Codex ein, die eigenständig Aufträge statt nur Antworten liefern. 2. Er behauptet, Anthropic habe mit Claude Code OpenAI bei Unternehmenswert und Umsatz überholt (Aussage des Videos, nicht belegt) und dass Microsoft Copilot angepasste Modelle von OpenAI und Anthropic mit eigenen System-Prompts nutzt statt eigener Modelle. 3. Als Fazit rät er, mindestens eines der beiden Agent-Harness-Tools Claude Code oder Codex in voller Tiefe zu lernen, weil klar definierte, messbare Goals der entscheidende Hebel für zukünftige Produktivität seien."}, {"id": "C8.vq.zNuynCOm5Mc.nach0", "vid": "zNuynCOm5Mc", "vq": "nach", "t": "mc", "q": "Was ist laut Video der zentrale Unterschied zwischen einem klassischen Chatbot und einem Agent Harness wie Claude Code oder Codex?", "a": ["Ein Chatbot beantwortet nur eine Frage nach der anderen, ein Agent Harness führt einen Auftrag ziemlich autonom aus", "Ein Chatbot ist immer teurer als ein Agent Harness", "Ein Agent Harness kann nur Bilder erzeugen", "Es gibt technisch keinen Unterschied"], "r": 0, "e": "Das Video beschreibt genau diesen Unterschied: Frage-Antwort beim Chatbot gegen autonome Auftragsausführung beim Harness."}, {"id": "C8.vq.zNuynCOm5Mc.nach1", "vid": "zNuynCOm5Mc", "vq": "nach", "t": "ms", "q": "Welche zwei Eigenschaften nennt das Video für Perplexity als Spezialtool?", "a": ["Es verbindet Echtzeit-Suchdaten mit der Kraft von Sprachmodellen", "Der Gründer ist ein ehemaliger Google-Mitarbeiter", "Es ist komplett kostenlos ohne jede Einschränkung", "Es hat als einziges Tool ein eigenes Sprachmodell"], "r": [0, 1], "e": "Das Video nennt beides ausdrücklich über Perplexity."}, {"id": "C8.vq.zNuynCOm5Mc.nach2", "vid": "zNuynCOm5Mc", "vq": "nach", "t": "lueck", "q": "Ein gutes Ziel für einen KI-Agenten ist laut Video eins, bei dem der Agent selbst merken kann, dass es erreicht ist, also ein klar ___ Ziel.", "r": ["definiertes", "messbares"], "e": "Das Video betont, dass Ziele für Agenten messbar bzw. klar definiert sein müssen, sonst weiss der Agent nicht, wann er fertig ist."}, {"id": "C8.vq.zNuynCOm5Mc.nach3", "vid": "zNuynCOm5Mc", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen, warum es laut Video ein Fehler wäre, die Verantwortung komplett an ein Tool wie Copilot abzugeben.", "m": "Auch die besten KI-Tools bleiben letztlich statistische Systeme, die Fehler machen können, ohne es selbst zu merken. Wer die komplette Verantwortung abgibt, kontrolliert die Ergebnisse nicht mehr und übersieht dadurch Fehler leichter. Deshalb sollte man das Ergebnis immer noch selbst prüfen, statt dem Tool blind zu vertrauen."}, {"id": "C8.vq.zNuynCOm5Mc.abc", "t": "abc", "abruf": 1, "vid": "zNuynCOm5Mc", "vq": "nach", "m": ["Agent Harness", "Chatbot", "Claude Code", "Codex", "MCP", "Multimodalität", "NotebookLM", "Perplexity", "Reasoning", "System Prompt", "Terminal", "Token"], "q": "ABC-Liste zu «Welche KI in 2026? Chatbots, Agents, Apps im Überblick»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C8.vq.zNuynCOm5Mc.kawa", "t": "kawa", "abruf": 1, "vid": "zNuynCOm5Mc", "vq": "nach", "wort": "CHATBOT", "m": ["C: Claude: laut Video besonders stark beim Schreiben und Programmieren", "H: Harness: Oberbegriff für Tools wie Claude Code oder Codex", "A: Agent Harness: führt einen Auftrag eigenständig aus", "T: Token: kleinste Einheit, mit der Sprachmodelle rechnen", "B: Bilder: Gemini ist laut Video besonders stark bei der Bildgenerierung", "O: Open AI: Entwickler von ChatGPT, im Video der Goto für komplizierte Fragen"], "q": "KaWa zu «CHATBOT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C8.vq.mYggljgyAKs.vor0", "vid": "mYggljgyAKs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Internetnutzer gab es laut Video, als Salesforce im Jahr 2001 startete?", "a": ["Etwa 50 Millionen", "Etwa eine halbe Milliarde", "Etwa 2 Milliarden", "Etwa 100 Millionen"], "r": 1, "e": "Das Video nennt eine halbe Milliarde Internetnutzer zum Start von Salesforce im Jahr 2001."}, {"id": "C8.vq.mYggljgyAKs.vor1", "vid": "mYggljgyAKs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie vergleicht das Video die heutige Zahl der Internetnutzer mit dem Jahr 2001?", "a": ["Sie ist etwa gleich geblieben", "Sie ist auf rund 5,5 Milliarden gestiegen", "Sie ist gesunken", "Sie wurde nie gemessen"], "r": 1, "e": "Das Video stellt die halbe Milliarde von 2001 den heutigen rund 5,5 Milliarden Internetnutzern gegenüber, um das Ausmass des Wachstums zu zeigen."}, {"id": "C8.v.mYggljgyAKs", "t": "frei", "abruf": 1, "vid": "mYggljgyAKs", "vq": "nach", "q": "Video «Was Führungskräfte HEUTE über die rasante KI Entwicklung wissen müssen» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Magnussen vergleicht das Wachstum der ChatGPT-Nutzerzahlen mit der Verbreitung des frühen Internets und mit Salesforce im Jahr 2001, um zu zeigen, wie schnell KI-Adoption tatsächlich verläuft. 2. Er warnt vor Shadow AI: Mitarbeitende nutzen private Tools wie ChatGPT trotz Verbots im Job, wodurch Unternehmen ausgerechnet die Chance verpassen, rechtzeitig eigene Regeln für den datenschutzkonformen Einsatz zu setzen. 3. Als konkreten ersten Schritt für Führungskräfte schlägt er eine kleine, bereichsübergreifende KI-Gruppe von etwa fünf Mitarbeitenden mit klar verteilten Rollen vor, etwa für Datenschutz-Check, Ideensammlung und Use-Case-Sammlung je Abteilung."}, {"id": "C8.vq.mYggljgyAKs.nach0", "vid": "mYggljgyAKs", "vq": "nach", "t": "mc", "q": "Was nennt der Referent als deutschen Reflex im Umgang mit neuen KI-Tools?", "a": ["Sofortiges Ausprobieren neuer Tools ohne Bedenken", "Das ständige Sagen von geht nicht, dürfen wir nicht, können wir nicht", "Die Frage nach den Materialkosten", "Der Wunsch nach mehr Home-Office"], "r": 1, "e": "Das Video beschreibt genau diese Haltung geht nicht, dürfen wir nicht, können wir nicht als den deutschen Reflex, der Chancen verpassen lässt."}, {"id": "C8.vq.mYggljgyAKs.nach1", "vid": "mYggljgyAKs", "vq": "nach", "t": "mc", "q": "Welches Beispiel nennt der Referent für schnelle KI-Einführung in Stadtverwaltungen?", "a": ["Deutschland mit ChatGPT", "China mit DeepSeek und Influencer-Videos zur Schulung", "Die USA mit eigenen Chips", "Die Schweiz mit einem neuen Gesetz"], "r": 1, "e": "Das Video nennt chinesische Stadtverwaltungen, die DeepSeek innerhalb weniger Wochen mit unkonventionellen Trainingsmethoden wie Influencer-Videos ausgerollt haben."}, {"id": "C8.vq.mYggljgyAKs.nach2", "vid": "mYggljgyAKs", "vq": "nach", "t": "ms", "q": "Welche zwei konkreten Rollen empfiehlt der Referent für eine kleine interne KI-Gruppe in einem Unternehmen?", "a": ["Jemand, der prüft, ob die Nutzung datenschutzkonform ist", "Jemand, der Ideen sammelt, was man mit KI machen kann", "Jemand, der ausschliesslich die Kaffeemaschine wartet", "Jemand, der neue Bürostühle bestellt"], "r": [0, 1], "e": "Der Referent schlägt vor, dass in einer kleinen KI-Gruppe jemand den Datenschutz prüft und jemand Ideen für mögliche Anwendungsfälle sammelt."}, {"id": "C8.vq.mYggljgyAKs.nach3", "vid": "mYggljgyAKs", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum der Referent sagt, dass Führungskräfte gerade jetzt noch die Chance haben, aktiv zu handeln, statt KI nur zu ignorieren.", "m": "Der Referent argumentiert, dass die Verbreitung von KI-Tools exponentiell verläuft und Unternehmen, die jetzt zögern, den Anschluss verlieren könnten, so wie frühere Unternehmen bei Internet oder Cloud-Software. Wer als Führungskraft aktiv Fragen stellt und eine kleine Gruppe mit klaren Aufgaben einsetzt, kann die Entwicklung mitgestalten statt nur zu reagieren. Wartet man zu lange, sind laut Video die Chancen, die man hätte ergreifen können, bereits vorbei."}, {"id": "C8.vq.mYggljgyAKs.abc", "t": "abc", "abruf": 1, "vid": "mYggljgyAKs", "vq": "nach", "m": ["Adoption", "Chatbot", "Datenschutz", "Exponentiell", "Führungskraft", "Hype", "Innovation", "Kommune", "Shadow", "Trend", "Verantwortung", "Zahlen"], "q": "ABC-Liste zu «Was Führungskräfte HEUTE über die rasante KI Entwicklung wissen müssen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C8.vq.mYggljgyAKs.kawa", "t": "kawa", "abruf": 1, "vid": "mYggljgyAKs", "vq": "nach", "wort": "TREND", "m": ["T: Trend wird oft mit blossem Hype verwechselt, sagt der Referent", "R: Reale Zahlen wie Nutzerwachstum zeigen, ob etwas mehr als Hype ist", "E: Exponentielles Wachstum betrifft laut Video fast jeden Lebensbereich", "N: Nicht ignorieren, sondern aktiv als Führungskraft handeln, ist die Botschaft", "D: Datenschutz sollte eine kleine interne Gruppe gezielt prüfen"], "q": "KaWa zu «TREND»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C8.0", "t": "ord", "q": "Die fünf Phasen des Gartner Hype Cycle.", "a": ["Technologischer Auslöser", "Gipfel der überzogenen Erwartungen", "Tal der Enttäuschungen", "Pfad der Erleuchtung", "Plateau der Produktivität"], "e": "Nützlich für A1: Wo steht eine Technologie, und was heisst das für unseren Zeitpunkt des Einstiegs?"}, {"id": "C8.1", "t": "ms", "q": "Woran beurteilst du die Glaubwürdigkeit einer Quelle zu einem KI-Trend? Wähle drei.", "a": ["Wer ist der Absender und was will er verkaufen?", "Gibt es Daten, Methode, Datum?", "Bestätigen unabhängige Quellen dasselbe?", "Wie viele Emojis hat der Beitrag?"], "r": [0, 1, 2], "e": "A1 verlangt ausdrücklich, Qualität und Glaubwürdigkeit von Informationen zu beurteilen."}, {"id": "C8.2", "t": "lueck", "q": "Porters fünf Kräfte: Rivalität, neue Anbieter, Ersatzprodukte, Verhandlungsmacht der Lieferanten und Verhandlungsmacht der ___ .", "r": ["kunden", "abnehmer", "käufer", "kaeufer"], "e": "Branchenstrukturanalyse für A2. KI kann jede Kraft verschieben, z.B. Eintrittsbarrieren senken."}, {"id": "C8.3", "t": "frei", "q": "Transfer: Dein Chef schickt dir einen LinkedIn-Post «KI-Agenten ersetzen 2027 alle Sachbearbeiter». Wie gehst du nach A1 vor?", "m": "Quelle prüfen (Absender, Interesse, Belege). Trend einordnen (Reifegrad, Hype-Phase, echte Referenzen in unserer Branche). Auf unseren Kontext beziehen: Welche unserer Prozesse wären betroffen, welche Daten und Regeln fehlen dafür? Nach eigenen Kriterien bewerten (Relevanz, Reife, Aufwand, Risiko). Ergebnis kurz dokumentieren: beobachten, testen oder ignorieren, mit Wiedervorlage."}], "videos": [{"id": "ML52GvN7qVI", "kanal": "XO Projects", "titel": "Was ist der Gartner Hype Cycle?", "dauer": "1:50"}, {"id": "Pax-HU5tZwc", "kanal": "Digitalzentrum Berlin", "titel": "Wie erkennt man relevante Trends? Trendradar für Unternehmen", "dauer": "3:06"}, {"id": "hCnyiU365f8", "kanal": "Wirtschaft - simpleclub", "titel": "Five-Forces-Modell, Branchenstrukturanalyse", "dauer": "7:38"}, {"id": "3MR4MwzhFXQ", "kanal": "Die Merkhilfe Wirtschaft", "titel": "Branchenstrukturanalyse: Fünf-Kräfte-Modell nach Porter", "dauer": "5:41"}, {"id": "zNuynCOm5Mc", "kanal": "Christoph Magnussen", "titel": "Welche KI in 2026? Chatbots, Agents, Apps im Überblick", "dauer": "36:26"}, {"id": "mYggljgyAKs", "kanal": "Christoph Magnussen", "titel": "Was Führungskräfte HEUTE über die rasante KI Entwicklung wissen müssen", "dauer": "9:12"}], "pn": 10}, {"key": "C9", "titel": "KI-Strategie, Benchmarking, Ideen finden", "warum": "A4 (strategische Beiträge) und B1 (Benchmarking wird wörtlich genannt).", "fragen": [{"id": "C9.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «KI-Strategie, Benchmarking, Ideen finden»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: A4 (strategische Beiträge) und B1 (Benchmarking wird wörtlich genannt). Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C9.vq.X_aDxKKutm0.vor0", "vid": "X_aDxKKutm0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viel Prozent des Aufwands bei einer KI-Einführung macht laut Video die reine Technologie, also die Algorithmen, aus?", "a": ["Etwa 70%", "Etwa 50%", "Etwa 10%", "Etwa 90%"], "r": 2, "e": "Das Video nennt die Technologie als 'Spitze des Eisbergs' mit rund 10% des Gesamtaufwands."}, {"id": "C9.vq.X_aDxKKutm0.vor1", "vid": "X_aDxKKutm0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was macht laut Video rund 70% des Aufwands bei einer KI-Einführung aus?", "a": ["Die Hardware-Beschaffung", "Der kulturelle Wandel: Zusammenarbeit, Fähigkeiten, Kompetenzen", "Die Serverkosten", "Das Marketing"], "r": 1, "e": "Das Video nennt den kulturellen und organisatorischen Wandel als den grössten, oft unterschätzten Teil einer KI-Einführung."}, {"id": "C9.v.X_aDxKKutm0", "t": "frei", "abruf": 1, "vid": "X_aDxKKutm0", "vq": "nach", "q": "Video «Erfolgsfaktor KI-Strategie: Schritt für Schritt» (Digital Campus Zollverein): Was waren die Kernaussagen?", "m": "1. Hyperautomation verbindet laut dem Referenten drei Bausteine: klassische RPA-Bots, Business-Process-Automation mit Workflow-Tools und Data Science beziehungsweise generative KI, wobei letztere seit ChatGPT stark an Bedeutung gewonnen hat. 2. Das gemeinsam mit applied AI entwickelte AI-Strategy-House prueft eine KI-Strategie entlang vier Ebenen: Ambition beziehungsweise Verknuepfung mit der Unternehmensstrategie, KI-Use-Cases, technische Grundlagen und die konkrete Umsetzung (Execution). 3. Nach Erfahrung des Referenten befinden sich rund 70 bis 80 Prozent der europaeischen Unternehmen erst auf den untersten beiden Reifegrad-Stufen (Non-Starter und Experimenter), waehrend Unternehmen, die KI im grossen Stil produktiv nutzen, deutlich seltener sind."}, {"id": "C9.vq.X_aDxKKutm0.nach0", "vid": "X_aDxKKutm0", "vq": "nach", "t": "mc", "q": "Was passiert laut Video, wenn ein Unternehmen mit einem KI-Proof-of-Concept scheitert?", "a": ["Nichts, das ist völlig folgenlos", "Investitionen gehen verloren und die Technologie ist für 1-2 Jahre intern 'verbrannt'", "Das Unternehmen wird automatisch Marktführer", "Die Mitarbeitenden werden sofort entlassen"], "r": 1, "e": "Ein gescheitertes POC kostet nicht nur Geld, sondern beschädigt auch das Vertrauen in die Technologie für die nächsten ein bis zwei Jahre."}, {"id": "C9.vq.X_aDxKKutm0.nach1", "vid": "X_aDxKKutm0", "vq": "nach", "t": "mc", "q": "Auf welcher Reifegradstufe befinden sich laut den im Video zitierten Applied-AI-Daten die meisten europäischen Unternehmen?", "a": ["Shaper", "Nichtstarter oder Experimenter", "Vollständig skalierter Betrieb", "Weltmarktführer"], "r": 1, "e": "Laut Video liegen 70 bis 80% der europäischen Unternehmen auf den untersten beiden Reifegradstufen."}, {"id": "C9.vq.X_aDxKKutm0.nach2", "vid": "X_aDxKKutm0", "vq": "nach", "t": "ms", "q": "Welche zwei Bausteine gehören laut Video zur 'Hyperautomation'?", "a": ["Business Process Automation mit Workflow-Tools", "Ausschliesslich Hardware-Einkauf", "Data Science, verstärkt durch generative KI", "Nur Marketingmassnahmen"], "r": [0, 2], "e": "Hyperautomation setzt sich laut Video aus RPA- bzw. Workflow-Automatisierung und Data Science, heute stark geprägt von generativer KI, zusammen."}, {"id": "C9.vq.X_aDxKKutm0.nach3", "vid": "X_aDxKKutm0", "vq": "nach", "t": "frei", "q": "Erkläre, warum der Satz eines Kunden 'Unser Chef hat gesagt, wir sollen mal was mit KI machen' aus Sicht des Referenten problematisch ist.", "m": "Dieser Satz zeigt, dass keine echte KI-Strategie vorliegt, sondern nur ein vager Auftrag ohne klaren Bezug zur Unternehmensstrategie oder zu konkreten Use Cases. Ohne eine Ambition, die mit der Unternehmensstrategie verknüpft ist, und ohne sauber bewertete Anwendungsfälle besteht ein hohes Risiko, dass das Projekt scheitert und Investitionen verloren gehen."}, {"id": "C9.vq.X_aDxKKutm0.abc", "t": "abc", "abruf": 1, "vid": "X_aDxKKutm0", "vq": "nach", "m": ["Ambition", "Assessment", "Blueprint", "Change", "Data Science", "Eisberg", "Hyperautomation", "Investitionsschutz", "Kultureller Wandel", "Maturity", "Reifegradmodell", "Shaper", "Use Cases", "Workflow"], "q": "ABC-Liste zu «Erfolgsfaktor KI-Strategie: Schritt für Schritt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.X_aDxKKutm0.kawa", "t": "kawa", "abruf": 1, "vid": "X_aDxKKutm0", "vq": "nach", "wort": "CHANGE", "m": ["C: Change, also kultureller Wandel, macht laut Video rund 70% der KI-Einführung aus.", "H: Hyperautomation kombiniert RPA, Workflow-Tools und Data Science.", "A: Ambition ist die erste Ebene im AI Strategy House.", "N: Notstarter und Experimenter sind die häufigsten Reifegrade europäischer Unternehmen.", "G: Gescheiterte Proof-of-Concepts verbrennen Investitionen und Vertrauen in die Technologie.", "E: Eisberg-Bild zeigt, dass Technologie nur die sichtbare Spitze ist."], "q": "KaWa zu «CHANGE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.vq.jtpZIEg6nZk.vor0", "vid": "jtpZIEg6nZk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Mit wem vergleicht man sich beim Benchmarking meistens?", "a": ["mit dem schwächsten Anbieter im Markt", "mit dem Marktführer", "mit einer zufällig gewählten Firma", "man vergleicht sich nie mit anderen"], "r": 1, "e": "Das Video definiert Benchmarking als systematischen Vergleich, meist mit dem Marktführer."}, {"id": "C9.vq.jtpZIEg6nZk.vor1", "vid": "jtpZIEg6nZk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Gibt es Benchmarking nur zwischen Unternehmen oder auch in anderen Bereichen wie Familie oder Sport?", "a": ["nur zwischen Unternehmen", "nur zwischen Ländern", "auch in Familie, Fitnessstudio und Sportverein, wie das Video sagt", "Benchmarking gibt es nur im Marketing"], "r": 2, "e": "Das Video nennt ausdrücklich Fitnessstudio, Sportverein und sogar das Elternverhalten in der Familie als Beispiele für Benchmarking im Alltag."}, {"id": "C9.v.jtpZIEg6nZk", "t": "frei", "abruf": 1, "vid": "jtpZIEg6nZk", "vq": "nach", "q": "Video «Benchmarking» (ZumFachwirt): Was waren die Kernaussagen?", "m": "1. Benchmarking ist der systematische Vergleich der eigenen Produkte, Prozesse oder Mitarbeitenden mit dem Marktfuehrer oder mit anderen Bereichen, um herauszufinden, was diese besser machen. 2. Man unterscheidet internes Benchmarking, zum Beispiel den Vergleich von Krankmeldungen zwischen Abteilungen im eigenen Unternehmen, und externes Benchmarking, etwa den Vergleich mit der Konkurrenz bei Qualitaet, Service oder Kosten. 3. Ziel des Benchmarkings ist der Best-Practice-Transfer, also die Uebernahme der besten gefundenen Vorgehensweise in das eigene Unternehmen."}, {"id": "C9.vq.jtpZIEg6nZk.nach0", "vid": "jtpZIEg6nZk", "vq": "nach", "t": "mc", "q": "Was ist laut Video das Ziel von Benchmarking?", "a": ["den Marktführer zu verklagen", "der Best Practice Transfer, also das Uebernehmen dessen, was andere besser machen", "möglichst viele Mitarbeitende zu entlassen", "die eigenen Zahlen geheim zu halten"], "r": 1, "e": "Das Video nennt den Best Practice Transfer als Ziel: man schaut, was die Konkurrenz besser macht, und überführt das ins eigene Unternehmen."}, {"id": "C9.vq.jtpZIEg6nZk.nach1", "vid": "jtpZIEg6nZk", "vq": "nach", "t": "ms", "q": "Welche zwei Formen von Benchmarking unterscheidet das Video?", "a": ["internes Benchmarking innerhalb der eigenen Firma", "externes Benchmarking mit anderen Unternehmen", "verbotenes Benchmarking", "digitales Benchmarking ohne Daten"], "r": [0, 1], "e": "Das Video unterscheidet internes Benchmarking, etwa zwischen Abteilungen, und externes Benchmarking mit der Konkurrenz."}, {"id": "C9.vq.jtpZIEg6nZk.nach2", "vid": "jtpZIEg6nZk", "vq": "nach", "t": "lueck", "q": "Im Beispiel des Videos verrät ein Vergleich der Krankmeldungen zwischen Abteilungen etwas darüber, wie ___ die Mitarbeitenden sind.", "r": ["zufrieden"], "e": "Das Video erklärt, dass Krankmeldungen viel darüber aussagen, wie zufrieden Mitarbeitende in einer Abteilung sind."}, {"id": "C9.vq.jtpZIEg6nZk.nach3", "vid": "jtpZIEg6nZk", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wie ein kleines Cafe Benchmarking nutzen könnte, um sich zu verbessern.", "m": "Das Cafe könnte sich extern mit dem erfolgreichsten Cafe der Umgebung vergleichen und schauen, warum dessen Kundenbindung besser ist. Vielleicht zeigt sich, dass die Konkurrenz einen schnelleren Service oder ein besseres Treueprogramm bietet. Diese Erkenntnisse könnte das Cafe dann als Best Practice für den eigenen Betrieb übernehmen."}, {"id": "C9.vq.jtpZIEg6nZk.abc", "t": "abc", "abruf": 1, "vid": "jtpZIEg6nZk", "vq": "nach", "m": ["Benchmarking", "Best Practice", "extern", "intern", "Konkurrenz", "Kosten", "Krankmeldung", "Kundenbindung", "Marktführer", "Qualität", "Service", "Vergleich"], "q": "ABC-Liste zu «Benchmarking»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.jtpZIEg6nZk.kawa", "t": "kawa", "abruf": 1, "vid": "jtpZIEg6nZk", "vq": "nach", "wort": "MARKT", "m": ["M: Marktführer: mit ihm vergleicht man sich beim Benchmarking meistens", "A: Abteilungsvergleich: internes Benchmarking vergleicht zum Beispiel Krankmeldungen zwischen Abteilungen", "R: Rückschlüsse: aus Kennzahlen wie Krankmeldungen lassen sich Ursachen ableiten", "K: Kundenbindung: wie viele Kunden wieder beim gleichen Anbieter kaufen", "T: Transfer (Best Practice Transfer): das Ziel, Gutes von anderen zu übernehmen"], "q": "KaWa zu «MARKT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.vq.Fb7yfse1w3M.vor0", "vid": "Fb7yfse1w3M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches Land nennt das Video als Beispiel dafür, deutsche Automobilproduktion genau beobachtet und kopiert zu haben?", "a": ["USA", "China", "Japan", "Brasilien"], "r": 1, "e": "Das Video nennt ausdrücklich chinesische Unternehmen, die deutsche Marktführer in der Automobilbranche beobachtet und nachgemacht haben."}, {"id": "C9.vq.Fb7yfse1w3M.vor1", "vid": "Fb7yfse1w3M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert laut Video, wenn beim Benchmarking nur ein sehr kleines Potenzial festgestellt wird?", "a": ["Man investiert trotzdem sofort massiv", "Man wird hier meist nicht tätig, weil der Aufwand sich nicht lohnt", "Man wechselt sofort den Marktführer", "Man wiederholt das Benchmarking täglich"], "r": 1, "e": "Das Video sagt, dass bei niedrigem Potenzial kein grosser Aufwand betrieben wird, weil das Ergebnis dann nur minimal wäre."}, {"id": "C9.v.Fb7yfse1w3M", "t": "frei", "abruf": 1, "vid": "Fb7yfse1w3M", "vq": "nach", "q": "Video «Benchmarking einfach erklärt» (caesar.academy): Was waren die Kernaussagen?", "m": "1. Beim internen Benchmarking vergleicht man Abteilungen im eigenen Unternehmen, beim externen Benchmarking orientiert man sich am Marktfuehrer, um von dessen Best-Practice-Methoden zu lernen. 2. Ein Benchmarking sollte auf wenige, konzentrierte Kriterien beschraenkt werden, weil zu viele Vergleichskriterien den Prozess unnoetig aufwendig machen. 3. Die Differenz zwischen dem eigenen Ist-Zustand und dem Best-Practice-Fall des Marktfuehrers zeigt das Verbesserungspotenzial; nur bei grossem Potenzial lohnt sich der Aufwand, eine Massnahme umzusetzen."}, {"id": "C9.vq.Fb7yfse1w3M.nach0", "vid": "Fb7yfse1w3M", "vq": "nach", "t": "mc", "q": "Was ist laut Video der Unterschied zwischen internem und externem Benchmarking?", "a": ["Internes vergleicht Abteilungen im eigenen Unternehmen, externes den Marktführer", "Beide vergleichen ausschliesslich mit ausländischen Firmen", "Internes ist nur für grosse Konzerne möglich", "Externes Benchmarking betrachtet nur die eigene Abteilung"], "r": 0, "e": "Das Video erklärt internes Benchmarking als Vergleich innerhalb des eigenen Unternehmens und externes als Vergleich mit dem Marktführer."}, {"id": "C9.vq.Fb7yfse1w3M.nach1", "vid": "Fb7yfse1w3M", "vq": "nach", "t": "ms", "q": "Welche zwei Ergebnisse liefert ein Benchmarking laut Video am Ende?", "a": ["Den Best-Practice-Case des Marktführers", "Eine automatische Gehaltserhöhung", "Die eigenen Inhouse-KPIs", "Einen neuen Firmensitz"], "r": [0, 2], "e": "Das Video nennt den Best-Practice-Case des Marktführers und die eigenen Inhouse-KPIs als zentrale Ergebnisse eines Benchmarkings."}, {"id": "C9.vq.Fb7yfse1w3M.nach2", "vid": "Fb7yfse1w3M", "vq": "nach", "t": "lueck", "q": "Die Differenz zwischen dem Best-Practice-Case und dem eigenen Ist-Zustand nennt das Video das ___.", "r": ["potenzial"], "e": "Das Video definiert genau diese Differenz zwischen Best Practice und eigenem Ist-Zustand als Potenzial."}, {"id": "C9.vq.Fb7yfse1w3M.nach3", "vid": "Fb7yfse1w3M", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel, wann sich laut Video ein aufwendiges externes Benchmarking lohnt und wann eher nicht.", "m": "Ein Benchmarking lohnt sich vor allem dann, wenn die Differenz zum Marktführer, also das Potenzial, gross ist, zum Beispiel wenn ein Konkurrent viel günstiger oder viel schneller produziert. Ist der Marktführer dagegen nur minimal besser, wäre der Aufwand für eine detaillierte Analyse laut Video nicht gerechtfertigt, weil am Ende nur ein sehr kleiner Gewinn herauskommen würde. Man sollte also vorher grob abschätzen, wie gross der Abstand überhaupt sein könnte."}, {"id": "C9.vq.Fb7yfse1w3M.abc", "t": "abc", "abruf": 1, "vid": "Fb7yfse1w3M", "vq": "nach", "m": ["Automobilbranche", "Benchmarking", "Best Practice", "Externes Benchmarking", "Handlungsbedarf", "Internes Benchmarking", "KPI", "Kriterium", "Marktführer", "Paperless Office", "Potenzial", "Vergleich"], "q": "ABC-Liste zu «Benchmarking einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.Fb7yfse1w3M.kawa", "t": "kawa", "abruf": 1, "vid": "Fb7yfse1w3M", "vq": "nach", "wort": "VERGLEICH", "m": ["V: Vergleich mit dem Marktführer ist die klassischste Form", "E: Externes Benchmarking schaut über das eigene Unternehmen hinaus", "R: Realistisch bleiben: nur wenige Kriterien konzentriert vergleichen", "G: Grosses Potenzial bedeutet Handlungsbedarf, kleines Potenzial nicht", "L: Lernen vom Best-Practice-Fall des Marktführers", "I: Internes Benchmarking vergleicht Abteilungen im eigenen Haus", "C: Chinesische Unternehmen kopierten laut Video deutsche Automobilproduktion", "H: Handlungsbedarf entsteht erst bei einem grossen Unterschied zum Best Practice"], "q": "KaWa zu «VERGLEICH»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.vq.KH_zqH8EgDo.vor0", "vid": "KH_zqH8EgDo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Schritte hat der ursprüngliche Design-Thinking-Prozess aus dem Video?", "a": ["Drei", "Fünf", "Sieben", "Zehn"], "r": 2, "e": "Das Video beschreibt den ursprünglichen Prozess mit sieben Schritten."}, {"id": "C9.vq.KH_zqH8EgDo.vor1", "vid": "KH_zqH8EgDo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Dürfen im Ideenfindungs-Schritt auch abwegige, verrückte Ideen genannt werden?", "a": ["Nein, nur realistische Ideen zählen", "Ja, sie müssen sogar berücksichtigt und dürfen nicht sofort bewertet werden", "Nein, das würde den Workshop stören", "Ja, aber nur von der Führungskraft"], "r": 1, "e": "Das Video betont, dass in dieser Phase alle Ideen zugelassen und nicht sofort bewertet werden dürfen."}, {"id": "C9.v.KH_zqH8EgDo", "t": "frei", "abruf": 1, "vid": "KH_zqH8EgDo", "vq": "nach", "q": "Video «Design Thinking einfach erklärt (mit Workshop-Beispiel)» (shribe!): Was waren die Kernaussagen?", "m": "1. Der Design-Thinking-Prozess umfasst sieben nicht zwingend lineare Schritte: Define, Research, Einbeziehung der Nutzerinnen und Nutzer, Prototype, Entscheiden fuer die vielversprechendste Idee, Implement und Learn. 2. In der Ideenfindungsphase duerfen Ideen nicht sofort bewertet werden, damit auch ungewoehnliche Vorschlaege gesammelt werden koennen, etwa durch Brainstorming in Zweiergruppen oder Rollenspiele mit fiktiven Nutzerinnen. 3. Bei der Entscheidung fuer eine Idee sollen Kriterien wie Herkunft der Idee, Sympathie oder Emotionen bewusst ausgeblendet werden, damit die Auswahl auf den besten Argumenten statt auf einer Mehrheitsabstimmung beruht."}, {"id": "C9.vq.KH_zqH8EgDo.nach0", "vid": "KH_zqH8EgDo", "vq": "nach", "t": "mc", "q": "Wer steht laut Video im Mittelpunkt des Design-Thinking-Prozesses?", "a": ["Die Konkurrenz", "Der Nutzer beziehungsweise die Nutzerin", "Das Budget", "Die eingesetzte Technologie"], "r": 1, "e": "Das Video betont, dass trotz vieler Anwendungsgebiete immer der Mensch beziehungsweise die Nutzerin im Mittelpunkt steht."}, {"id": "C9.vq.KH_zqH8EgDo.nach1", "vid": "KH_zqH8EgDo", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge sollten laut Video bei der Auswahl der vielversprechendsten Idee bewusst ignoriert werden?", "a": ["Von wem die Idee stammt", "Wie gut die Idee zum Problem passt", "Welche Emotionen mit der Idee verbunden sind", "Wie viele Argumente dafür sprechen"], "r": [0, 2], "e": "Das Video nennt Herkunft der Idee, Praktikabilität und Emotionen als Faktoren, die man bewusst aussen vor lassen soll."}, {"id": "C9.vq.KH_zqH8EgDo.nach2", "vid": "KH_zqH8EgDo", "vq": "nach", "t": "ord", "q": "Bringe vier der sieben Design-Thinking-Schritte aus dem Video in die richtige Reihenfolge.", "a": ["Define: Problem und Ziel klären", "Research: bestehende Lösungsansätze recherchieren", "Ideenfindung: möglichst viele Ideen sammeln, ohne sie zu bewerten", "Implement: die gewählte Idee umsetzen"], "e": "Das Video ordnet die sieben Schritte genau in dieser Reihenfolge an."}, {"id": "C9.vq.KH_zqH8EgDo.nach3", "vid": "KH_zqH8EgDo", "vq": "nach", "t": "lueck", "q": "Der Design-Thinking-Prozess ist nicht ___, das heisst einzelne Schritte können sich überlappen und gegenseitig beeinflussen.", "r": ["linear"], "e": "Das Video betont ausdrücklich, dass der Prozess nicht linear verläuft."}, {"id": "C9.vq.KH_zqH8EgDo.nach4", "vid": "KH_zqH8EgDo", "vq": "nach", "t": "frei", "q": "Erkläre, warum es im Ideenfindungs-Schritt wichtig ist, Ideen zunächst nicht zu bewerten, sondern auch verrückte Vorschläge zuzulassen.", "m": "Wenn Ideen sofort bewertet werden, trauen sich Teilnehmende nicht mehr, ungewöhnliche Vorschläge zu äussern, aus Angst vor Kritik. Gerade abwegige Ideen können aber später zu kreativen Lösungen führen, deshalb sollen im Brainstorming zunächst alle Ideen ohne Bewertung gesammelt werden."}, {"id": "C9.vq.KH_zqH8EgDo.abc", "t": "abc", "abruf": 1, "vid": "KH_zqH8EgDo", "vq": "nach", "m": ["Brainstorming", "Define", "Erfolgsfaktoren", "Feedback", "Ideen", "Implement", "Nutzer", "Prototype", "Research", "Rollenspiele", "Workshop", "Zielgruppe"], "q": "ABC-Liste zu «Design Thinking einfach erklärt (mit Workshop-Beispiel)»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C9.vq.KH_zqH8EgDo.kawa", "t": "kawa", "abruf": 1, "vid": "KH_zqH8EgDo", "vq": "nach", "wort": "IDEEN", "m": ["I: Ideen: sollen im Brainstorming zunächst nicht bewertet werden", "D: Define: der erste Schritt, um Problem und Ziel zu klären", "E: Endnutzer: stehen im Design Thinking immer im Mittelpunkt", "N: Nicht linear: die sieben Schritte können sich gegenseitig überlappen"], "q": "KaWa zu «IDEEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C9.vq.cm7fDEqukz8.vor0", "vid": "cm7fDEqukz8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was braucht ein System laut dem Gespräch unbedingt, um wirklich Agent genannt werden zu dürfen?", "a": ["Eine grafische Oberfläche", "Autonomie", "Ein Preisschild", "Einen Cha
