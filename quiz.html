ss. 3. Ein Goal in Codex ist eine länger laufende, autonome Aufgabe mit klar messbarem Abschluss, etwa das vollständige Portieren einer iPhone-App auf iPad-Bildschirmgrössen, an der der Agent im Hintergrund arbeitet, bis sie fertig ist."}, {"id": "A8.vq.HgKf6DPOSeU.nach0", "vid": "HgKf6DPOSeU", "vq": "nach", "t": "mc", "q": "Was ist laut dem Gespräch ein 'Ziel', das man einem Codex-Agenten geben kann?", "a": ["Eine einzelne, sehr kurze Frage", "Eine längere Aufgabe, an der der Agent eigenständig weiterarbeitet, bis sie fertig ist", "Ein Passwort für den Login", "Eine Liste von Emojis"], "r": 1, "e": "Ein Ziel lässt den Agenten laut Gespräch ungestört an einer längeren Aufgabe arbeiten, bis sie abgeschlossen ist."}, {"id": "A8.vq.HgKf6DPOSeU.nach1", "vid": "HgKf6DPOSeU", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele für den Einsatz von Codex werden im Gespräch genannt?", "a": ["Eine iPhone-App in eine iPad-App portieren", "Eine tägliche Zusammenfassung aus Slack, Gmail und Kalender erstellen", "Das Frühstück für das Team kochen", "Einen Podcast live im Fernsehen ausstrahlen"], "r": [0, 1], "e": "Beide Beispiele werden im Video konkret als Anwendungsfälle für Codex vorgeführt."}, {"id": "A8.vq.HgKf6DPOSeU.nach2", "vid": "HgKf6DPOSeU", "vq": "nach", "t": "lueck", "q": "Wenn kein passendes Plugin vorhanden ist, kann Codex über ___ direkt am Bildschirm arbeiten, wie ein Mensch es tun würde.", "r": ["computer use", "computer-use"], "e": "Computer Use erlaubt es Codex, ohne Plugin direkt mit der Bedienoberfläche zu interagieren."}, {"id": "A8.vq.HgKf6DPOSeU.nach3", "vid": "HgKf6DPOSeU", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel, wofür du einem KI-Agenten ein 'Ziel' statt eines einzelnen Prompts geben würdest.", "m": "Ich würde ein Ziel geben, wenn eine Aufgabe mehrere Schritte über längere Zeit braucht, zum Beispiel eine ganze Webseite überarbeiten. Der Agent kann dann eigenständig weiterarbeiten, statt dass ich jeden einzelnen Schritt selbst anstossen muss."}, {"id": "A8.vq.HgKf6DPOSeU.abc", "t": "abc", "abruf": 1, "vid": "HgKf6DPOSeU", "vq": "nach", "m": ["Automation", "Computer Use", "Gmail", "iPad", "Kalender", "MCP", "Plugin", "Slack", "Whisper", "Ziel"], "q": "ABC-Liste zu «Wie OpenAI Codex intern wirklich nutzt! Use Cases für Agents»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A8.vq.HgKf6DPOSeU.kawa", "t": "kawa", "abruf": 1, "vid": "HgKf6DPOSeU", "vq": "nach", "wort": "PLUGIN", "m": ["P: Plugin: bündelt Fähigkeiten und Verbindungen zu Tools", "L: Live-Automation: aus einem einmaligen Prompt wird eine tägliche Automation", "U: Umwandlung: Codex kann zum Beispiel Podcast-Episoden in andere Sprachen umwandeln", "G: Gmail: eine der Verbindungen, auf die Codex per Plugin zugreift", "I: iPad: Beispielziel war das Portieren einer iPhone-App auf das iPad", "N: Nutzung ohne Programmierkenntnisse: man muss kein Entwickler sein, um Codex zu nutzen"], "q": "KaWa zu «PLUGIN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A8.0", "t": "mc", "q": "Was unterscheidet einen KI-Agenten von einem Chatbot?", "a": ["Er ist immer schneller", "Er plant mehrere Schritte und führt über Werkzeuge (APIs) selbst Aktionen aus", "Er braucht kein Sprachmodell", "Er halluziniert nie"], "r": 1, "e": "Agent = Modell + Werkzeuge + Schleife (planen, handeln, prüfen). Damit wächst Nutzen und Risiko."}, {"id": "A8.1", "t": "ms", "q": "Welche zwei Schritte eines Agenten müssen deterministisch abgesichert sein?", "a": ["Freundliche Begrüssung formulieren", "Zahlung oder Bestellung auslösen", "Berechtigung des Nutzers prüfen", "Anliegen in eigenen Worten zusammenfassen"], "r": [1, 2], "e": "Alles mit Geld, Recht, Zugriff: feste Regeln, Limiten, Freigaben. Sprache verstehen und formulieren darf das Modell."}, {"id": "A8.2", "t": "mc", "q": "Ein Agent soll einen Datenbestand abfragen, der nur als 380-MB-Datei in 60 Sekunden lieferbar ist. Was braucht die Lösung?", "a": ["Ein grösseres Sprachmodell", "Eine Zwischenschicht mit Cache/Index, die schnell und vorgefiltert antwortet", "Mehr Temperatur", "Nichts, der Nutzer wartet"], "r": 1, "e": "Brownfield-Integration: Zwischenschicht mit Cache, Aktualisierungsregel und Fehlerfall. Kern von Nullserie Challenge 03 (MedFinder)."}, {"id": "A8.3", "t": "frei", "q": "Transfer: Nenne vier Schutzmechanismen, die du von einem Agenten verlangst, der für Kunden Termine bucht.", "m": "1. Klare Grenzen, was er darf (nur buchen, nicht stornieren ab Betrag X). 2. Bestätigung durch den Menschen vor verbindlichen Aktionen. 3. Protokoll jeder Aktion (nachvollziehbar, rückgängig machbar). 4. Timeout, Wiederholungs- und Abbruchregel bei API-Fehlern sowie Übergabe an einen Menschen. Dazu Berechtigungsprüfung und Schutz vor Prompt Injection."}], "videos": [{"id": "yN2iYWbwFFs", "kanal": "Jonas Keil", "titel": "KI Agenten für Beginner: Alle Grundlagen in 9 Min", "dauer": "9:39"}, {"id": "GgYBe6I4aHQ", "kanal": "Christoph Magnussen", "titel": "KI-Agenten richtig nutzen: die Grundlagen", "dauer": "22:49"}, {"id": "BpxtgN6HMdc", "kanal": "datasolut", "titel": "Was du über KI-Agenten wissen musst!", "dauer": "5:27"}, {"id": "hiCthsCiJow", "kanal": "Christoph Magnussen", "titel": "Wer braucht noch Chatbots? SO funktionieren KI Agenten in ChatGPT und Co.", "dauer": "18:02"}, {"id": "C_sR-eLujQA", "kanal": "Christoph Magnussen", "titel": "Wie KI-Agenten bei Microsoft den Mittelstand transformieren | Oliver Gürtler", "dauer": "1:11:56"}, {"id": "HgKf6DPOSeU", "kanal": "Christoph Magnussen", "titel": "Wie OpenAI Codex intern wirklich nutzt! Use Cases für Agents", "dauer": "30:43"}], "pn": 11}, {"key": "A9", "titel": "Vom Testlauf (PoC) in den Betrieb", "warum": "C2, C4, D2: Was ein PoC beweist und was nicht.", "fragen": [{"id": "A9.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Vom Testlauf (PoC) in den Betrieb»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: C2, C4, D2: Was ein PoC beweist und was nicht. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A9.vq.mKPzzCR4Ctw.vor0", "vid": "mKPzzCR4Ctw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie lange soll ein Proof of Concept laut Video typischerweise dauern?", "a": ["1 bis 2 Tage", "3 bis 8 Wochen", "Ein ganzes Jahr", "Mehrere Jahre"], "r": 1, "e": "Das Video nennt als Faustregel 3 bis 8 Wochen für einen PoC."}, {"id": "A9.vq.mKPzzCR4Ctw.vor1", "vid": "mKPzzCR4Ctw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Ziel-Genauigkeit reicht laut Video oft schon für einen Proof of Concept, auch wenn die spätere Produktion 95 Prozent haben soll?", "a": ["50 Prozent", "75 Prozent", "99 Prozent", "100 Prozent"], "r": 1, "e": "Für den PoC nennt das Video als Beispiel ein realistisches Ziel von etwa 75 Prozent Genauigkeit."}, {"id": "A9.v.mKPzzCR4Ctw", "t": "frei", "abruf": 1, "vid": "mKPzzCR4Ctw", "vq": "nach", "q": "Video «KI für Unternehmen Nr. 5: Wie führt man KI-Experimente durch?» (Omar Maher): Was waren die Kernaussagen?", "m": "1. Ein Proof of Concept dient drei Zwecken: er testet, ob KI die Aufgabe technisch loesen kann, er holt frueh Feedback von den kuenftigen Nutzern ein, und er liefert die Grundlage fuer die Planung des Produktivbetriebs. 2. Ein guter PoC braucht zehn Elemente: Problem, Hypothese, Scope, Erfolgskriterien, Daten, Modellierung und Werkzeuge, Infrastruktur, Lieferobjekte, Team und Zeitrahmen, wobei der Scope bewusst eng gehalten werden sollte. 3. Fuer einen Proof of Concept genuegt ein tieferes Erfolgsziel als fuer den spaeteren Produktivbetrieb, zum Beispiel 75 Prozent Modellgenauigkeit statt der spaeter angestrebten 90 bis 95 Prozent, und der ganze Versuch sollte innerhalb von drei bis acht Wochen abgeschlossen sein."}, {"id": "A9.vq.mKPzzCR4Ctw.nach0", "vid": "mKPzzCR4Ctw", "vq": "nach", "t": "mc", "q": "Welche drei Hauptgründe nennt das Video für die Durchführung eines Proof of Concept?", "a": ["Testing, Feedback, Production Planning", "Marketing, Verkauf, Kundenservice", "Recruiting, Onboarding, Kündigung", "Design, Entwicklung, Support"], "r": 0, "e": "Das Video nennt genau diese drei Gründe: Testen der Idee, Feedback der Stakeholder und Planung der Produktion."}, {"id": "A9.vq.mKPzzCR4Ctw.nach1", "vid": "mKPzzCR4Ctw", "vq": "nach", "t": "ms", "q": "Welche zwei Elemente gehören laut Video zu den zehn Bausteinen eines PoC-Plans?", "a": ["Success Criteria", "Werbebudget", "Scope", "Urlaubsplanung"], "r": [0, 2], "e": "Success Criteria und Scope gehören zu den zehn Elementen, die das Video für die PoC-Planung nennt."}, {"id": "A9.vq.mKPzzCR4Ctw.nach2", "vid": "mKPzzCR4Ctw", "vq": "nach", "t": "lueck", "q": "Nach dem PoC muss man sich laut Video fragen, ob ___ überhaupt die richtige Lösung für das Problem ist.", "r": ["ki", "ai", "künstliche intelligenz"], "e": "Die erste kritische Frage nach dem PoC lautet laut Video, ob KI wirklich die richtige Lösung ist oder ob traditionelle Methoden effizienter wären."}, {"id": "A9.vq.mKPzzCR4Ctw.nach3", "vid": "mKPzzCR4Ctw", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie ein KI-Projekt gemacht hat, warum ein Proof of Concept den Scope bewusst klein halten sollte.", "m": "Ein kleiner Scope bedeutet, dass man sich zum Beispiel nur auf wenige Produktarten oder eine Region konzentriert statt auf das ganze Problem. Dadurch gibt es weniger Variablen und Komplexität, die man gleichzeitig testen muss. So lässt sich schneller und günstiger herausfinden, ob die Idee überhaupt funktioniert, bevor man viel Geld in die volle Produktion steckt."}, {"id": "A9.vq.mKPzzCR4Ctw.abc", "t": "abc", "abruf": 1, "vid": "mKPzzCR4Ctw", "vq": "nach", "m": ["Datenset", "Deliverables", "Feedback", "Genauigkeit", "Hypothese", "Infrastruktur", "Modellierung", "Prototyp", "Return on Investment", "Scope", "Success Criteria", "Team", "Zeit"], "q": "ABC-Liste zu «KI für Unternehmen Nr. 5: Wie führt man KI-Experimente durch?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A9.vq.mKPzzCR4Ctw.kawa", "t": "kawa", "abruf": 1, "vid": "mKPzzCR4Ctw", "vq": "nach", "wort": "SCOPE", "m": ["S: Scope: die Aufgabe des PoC möglichst eng eingrenzen", "C: Criteria, also Success Criteria: klare Erfolgskriterien vorher festlegen", "O: Outsourcing: eine Option neben dem eigenen Team für das Projekt", "P: Prototyp: am Ende steht oft eine einfache Web-Anwendung", "E: Evaluation: die Testdaten zeigen, wie gut das Modell wirklich ist"], "q": "KaWa zu «SCOPE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A9.vq.z3i3zAH9SAw.vor0", "vid": "z3i3zAH9SAw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie haben sich laut Video die KI-Investitionen der Unternehmen 2026 gegenüber dem Vorjahr verändert?", "a": ["Sie sind etwa gleich geblieben", "Sie haben sich verdoppelt", "Sie sind um die Hälfte gesunken", "Sie wurden komplett eingestellt"], "r": 1, "e": "Das Video nennt ausdrücklich eine Verdopplung der Investitionen gegenüber dem Vorjahr."}, {"id": "A9.vq.z3i3zAH9SAw.vor1", "vid": "z3i3zAH9SAw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum sind Sprachmodelle laut Video prinzipiell nie zu 100 Prozent korrekt?", "a": ["Weil sie absichtlich Fehler einbauen", "Weil es statistische, probabilistische Systeme sind, die Vorhersagen machen", "Weil sie zu langsam rechnen", "Weil sie kein Internet haben"], "r": 1, "e": "Das Video sagt, es handelt sich per Definition um probabilistische Systeme, die mathematisch nie ganz fehlerfrei sein können."}, {"id": "A9.v.z3i3zAH9SAw", "t": "frei", "abruf": 1, "vid": "z3i3zAH9SAw", "vq": "nach", "q": "Video «Warum Erfolg von KI nicht im POC, sondern in der Skalierung entsteht» (AI or DIE): Was waren die Kernaussagen?", "m": "1. Das Jahr des reinen Machbarkeitsnachweises ist laut den Gespraechspartnern vorbei, seit 2026 stehen Unternehmen vor der Aufgabe, den im kleinen bewiesenen Nutzen von KI tatsaechlich in die Breite zu skalieren. 2. Ein im Proof of Concept erzielter Effekt laesst sich in der Skalierung meist nicht eins zu eins wiederholen, weil dabei technische Altschulden, fehlende Datenqualitaet und mangelnde Data Governance sichtbar werden. 3. Weil KI-Sprachmodelle grundsaetzlich probabilistische Systeme sind, die nie hundert Prozent korrekt sein koennen, braucht eine Skalierung klare Regelwerke, Zugriffsbeschraenkungen und einen Human in the Loop zur Qualitaetssicherung, insbesondere bei generiertem Programmcode."}, {"id": "A9.vq.z3i3zAH9SAw.nach0", "vid": "z3i3zAH9SAw", "vq": "nach", "t": "mc", "q": "Was ist laut Video 2026 im Vergleich zum PoC-Jahr davor der Fokus?", "a": ["Weitere kleine Testläufe starten", "Skalierung und Wertschöpfung aus bereits erkannten Potenzialen", "Komplette Abschaffung von KI-Projekten", "Nur noch Studien ohne Umsetzung"], "r": 1, "e": "Das Video sagt wörtlich, das Jahr des Proof of Concepts sei vorbei, jetzt gehe es um Skalierung."}, {"id": "A9.vq.z3i3zAH9SAw.nach1", "vid": "z3i3zAH9SAw", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge werden laut Video bei der Skalierung von KI oft zum Problem?", "a": ["Technische Altschulden wie fehlende Datenqualität", "Fehlende Guardrails und unklare Zugriffsregeln", "Zu viele verfügbare Programmiersprachen", "Zu niedrige Stromkosten"], "r": [0, 1], "e": "Das Video nennt genau diese zwei Hindernisse als typische Bremsen bei der Skalierung."}, {"id": "A9.vq.z3i3zAH9SAw.nach2", "vid": "z3i3zAH9SAw", "vq": "nach", "t": "ord", "q": "Bringe die drei Perspektiven in die Reihenfolge, wie sie im Video für ein KI-Projekt genannt werden.", "a": ["Geschäftlicher Zweck: was will man erreichen", "Technologische Umsetzung: wie hebt man es technisch", "Organisation: wie profitieren Mitarbeitende und andere Stakeholder wirklich"], "e": "Das Video nennt genau diese drei Perspektiven in dieser Reihenfolge als Spannungsfeld eines KI-Projekts."}, {"id": "A9.vq.z3i3zAH9SAw.nach3", "vid": "z3i3zAH9SAw", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum ein erfolgreicher Proof of Concept laut Video nicht automatisch bedeutet, dass sich der Effekt in der ganzen Organisation wiederholen lässt.", "m": "Ein kleiner Testlauf läuft oft in einer sauberen, kontrollierten Umgebung mit wenigen Beteiligten. Sobald man die Lösung auf die ganze Organisation ausweitet, stossen Datenqualität, fehlende Guardrails und alte Prozesse als Hindernisse dazu. Deshalb ist Skalierung ein eigener, oft schwierigerer Schritt als der erste Erfolg im Kleinen."}, {"id": "A9.vq.z3i3zAH9SAw.abc", "t": "abc", "abruf": 1, "vid": "z3i3zAH9SAw", "vq": "nach", "m": ["Adoption", "Altschulden", "Data Governance", "Datenqualität", "Guardrails", "Human in the Loop", "Leadership Commitment", "Organisation", "PoC", "Probabilistic Systems", "Skalierung", "Vibe Coding"], "q": "ABC-Liste zu «Warum Erfolg von KI nicht im POC, sondern in der Skalierung entsteht»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A9.vq.z3i3zAH9SAw.kawa", "t": "kawa", "abruf": 1, "vid": "z3i3zAH9SAw", "vq": "nach", "wort": "POC", "m": ["P: Proof of Concept: der kleine Testlauf, der laut Video 2026 vorbei ist", "O: Organisation: muss mitziehen, sonst scheitert die Skalierung", "C: Commitment: Leadership Commitment ist ein Baustein der Skalierungskette"], "q": "KaWa zu «POC»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A9.0", "t": "mc", "q": "Was beweist ein Proof of Concept?", "a": ["Dass die Lösung wirtschaftlich ist", "Dass die Idee unter Testbedingungen grundsätzlich machbar ist", "Dass alle Mitarbeitenden sie akzeptieren", "Dass sie im Betrieb stabil läuft"], "r": 1, "e": "PoC = Machbarkeit im Kleinen. Pilot = echter Betrieb im begrenzten Rahmen. Rollout = alle."}, {"id": "A9.1", "t": "ms", "q": "Warum sieht ein PoC oft besser aus, als die Lösung später ist? Wähle drei.", "a": ["Saubere, ausgewählte Testdaten", "Randfälle und seltene Klassen fehlen im Test", "Der Anbieter wählt die Messgrösse selbst", "PoCs laufen immer auf schnelleren Servern", "Keine echten Nutzer mit echtem Verhalten"], "r": [0, 1, 4], "e": "Dazu: Auch die Messgrösse gehört hinterfragt. Darum Erfolgs- UND Abbruchkriterium vor dem Test festlegen."}, {"id": "A9.2", "t": "frei", "q": "Formuliere für einen Ticket-Triage-PoC je ein Erfolgs- und ein Abbruchkriterium.", "m": "Erfolg: Auf 500 echten, unsortierten Tickets aller Sprachen ordnet das Modell mindestens 90 % richtig zu, und kein einziges Störungsticket landet in einer unkritischen Kategorie. Abbruch: unter 80 % Trefferquote oder mehr als 2 übersehene Störungen. Wichtig: Zahl, Datenbasis und Frist vorher schriftlich festlegen."}, {"id": "A9.3", "t": "frei", "q": "Der Anbieter meldet «91 % Genauigkeit auf 400 Testanfragen». Welche drei Rückfragen stellst du?", "m": "1. Welche Daten: unsere echten oder ausgewählte, alle Sprachen und Kanäle? 2. Wie verteilen sich die Fehler: Was passiert in den 9 %, wie schlimm ist der schlimmste Fehler, wie gut ist die seltene, kritische Klasse? 3. Wer hat gemessen und womit wurde verglichen (menschliche Trefferquote als Referenz)?"}], "videos": [{"id": "mKPzzCR4Ctw", "kanal": "Omar Maher", "titel": "KI für Unternehmen Nr. 5: Wie führt man KI-Experimente durch?", "dauer": "24:15"}, {"id": "z3i3zAH9SAw", "kanal": "AI or DIE", "titel": "Warum Erfolg von KI nicht im POC, sondern in der Skalierung entsteht", "dauer": "36:15"}], "pn": 12}, {"key": "A10", "titel": "Drift und Überwachung", "warum": "E2 und E4: Das Modell wird schlechter, obwohl niemand etwas geändert hat.", "fragen": [{"id": "A10.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Drift und Überwachung»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: E2 und E4: Das Modell wird schlechter, obwohl niemand etwas geändert hat. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A10.vq.bmU4SLf1cjM.vor0", "vid": "bmU4SLf1cjM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum wird eine KI, die anfangs perfekt funktioniert hat, mit der Zeit plötzlich schlechter?", "a": ["Weil sich die Daten der realen Welt verändern, aber das Modell nicht mehr angepasst wurde", "Weil KI-Modelle nach einem Jahr automatisch abgeschaltet werden", "Weil die Rechenleistung mit der Zeit abnimmt", "Weil Nutzer die Software absichtlich verlangsamen"], "r": 0, "e": "Das Video nennt genau das als Ursache: die Welt ändert sich, aber das Modell bekam nie die Info davon, das heisst Data Drift."}, {"id": "A10.vq.bmU4SLf1cjM.vor1", "vid": "bmU4SLf1cjM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Auf wie viel Prozent Genauigkeit kann ein Modell im Beispiel des Videos von anfangs 95 Prozent abfallen?", "a": ["Auf ungefähr 90 Prozent", "Auf ungefähr 60 Prozent oder weniger", "Auf genau 50 Prozent", "Auf 0 Prozent"], "r": 1, "e": "Das Video zeigt einen Absturz von 95 Prozent auf 60 Prozent oder sogar tiefer, kaum besser als ein Münzwurf."}, {"id": "A10.v.bmU4SLf1cjM", "t": "frei", "abruf": 1, "vid": "bmU4SLf1cjM", "vq": "nach", "q": "Video «Datendrift-Überwachung erklärt | Warum ML-Modelle versagen» (CodeCraft Academy): Was waren die Kernaussagen?", "m": "1. Ein Machine-Learning-Modell lernt Muster aus einer Momentaufnahme vergangener Daten, und Data Drift entsteht, wenn die realen Daten im Betrieb nicht mehr dieser Momentaufnahme entsprechen. 2. Es gibt drei Arten von Drift: Covariate Drift veraendert die Eingabedaten, Label Drift veraendert die Verteilung der Zielgroesse, und Concept Drift veraendert die Beziehung zwischen Eingabe und Zielgroesse, wobei Concept Drift am schwersten zu erkennen ist. 3. Teams ueberwachen Drift, indem sie ein statistisches Profil der Trainingsdaten als Basislinie festlegen, laufend neue Daten dagegen testen und bei Ueberschreiten eines Schwellenwerts einen Alarm ausloesen, der ein Retraining des Modells anstoesst."}, {"id": "A10.vq.bmU4SLf1cjM.nach0", "vid": "bmU4SLf1cjM", "vq": "nach", "t": "mc", "q": "Welche der drei Drift-Arten beschreibt das Video als die gefährlichste?", "a": ["Covariate Drift", "Label Drift", "Concept Drift", "Kontext Drift"], "r": 2, "e": "Concept Drift bedeutet, dass sich die grundlegende Beziehung zwischen Eingaben und Ausgaben ändert, das Video nennt sie ausdrücklich am gefährlichsten."}, {"id": "A10.vq.bmU4SLf1cjM.nach1", "vid": "bmU4SLf1cjM", "vq": "nach", "t": "mc", "q": "Was beschreibt Covariate Drift laut Video am besten?", "a": ["Die Eingabedaten verändern sich, zum Beispiel das Durchschnittsalter der Nutzer", "Die Zielvariable ändert sich komplett", "Der Server fällt aus", "Das Modell wird neu trainiert"], "r": 0, "e": "Covariate Drift bedeutet laut Video, dass sich die Verteilung der Eingaben ändert, das Beispiel im Video ist das sinkende Durchschnittsalter der Nutzer."}, {"id": "A10.vq.bmU4SLf1cjM.nach2", "vid": "bmU4SLf1cjM", "vq": "nach", "t": "ord", "q": "Bringe den Ablauf der Drift-Erkennung laut Video in die richtige Reihenfolge.", "a": ["Ein statistisches Abbild der ursprünglichen Trainingsdaten als Basislinie erstellen", "Neue Live-Daten laufend mit dieser Basislinie vergleichen", "Bei zu grosser Abweichung Alarm auslösen", "Das Modell mit den neuen Daten neu trainieren"], "e": "Genau in dieser Reihenfolge beschreibt das Video, wie Teams Data Drift aufspüren und beheben."}, {"id": "A10.vq.bmU4SLf1cjM.nach3", "vid": "bmU4SLf1cjM", "vq": "nach", "t": "frei", "q": "Wo im Alltag hast du schon einmal ein Beispiel für Data Drift erlebt, etwa eine App oder ein System, das plötzlich schlechtere Empfehlungen gab? Beschreibe es in eigenen Worten.", "m": "Zum Beispiel kann eine Einkaufs-App irgendwann anfangen, unpassende Produkte vorzuschlagen, weil sich mein Kaufverhalten verändert hat, das System das aber nicht bemerkt. Genau das beschreibt das Video mit dem Beispiel der Shopping-Seite, die plötzlich zufälliges Zeug empfiehlt. Das zeigt, dass ein Modell ohne Überwachung mit der Zeit an der Realität vorbeirechnet."}, {"id": "A10.vq.bmU4SLf1cjM.abc", "t": "abc", "abruf": 1, "vid": "bmU4SLf1cjM", "vq": "nach", "m": ["Alarm", "Baseline", "Concept", "Covariate", "Datadrift", "Fraud", "Genauigkeit", "Label", "Modell", "Retraining", "Trainingsdaten", "Überwachung"], "q": "ABC-Liste zu «Datendrift-Überwachung erklärt | Warum ML-Modelle versagen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A10.vq.bmU4SLf1cjM.kawa", "t": "kawa", "abruf": 1, "vid": "bmU4SLf1cjM", "vq": "nach", "wort": "DRIFT", "m": ["D: Daten verändern sich, ohne dass jemand das Modell darüber informiert", "R: Realität entfernt sich Schritt für Schritt von den Trainingsdaten", "I: Input-Verteilung verschiebt sich beim Covariate Drift", "F: Fraud-Rate kann sich ändern und damit das Modell verwirren, das ist Label Drift", "T: Tipping Point: ab hier fällt die Genauigkeit des Modells stark ab"], "q": "KaWa zu «DRIFT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A10.vq.UdbDq4ozeME.vor0", "vid": "UdbDq4ozeME", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man es, wenn die Leistung eines KI-Modells mit der Zeit schlechter wird, obwohl niemand am Modell etwas verändert hat?", "a": ["Overfitting", "Model Drift", "Bias", "Underfitting"], "r": 1, "e": "Model Drift beschreibt genau diese schleichende Verschlechterung durch sich verändernde Daten."}, {"id": "A10.vq.UdbDq4ozeME.vor1", "vid": "UdbDq4ozeME", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele verschiedene Arten von Drift nennt das Video?", "a": ["Zwei", "Drei", "Vier", "Fünf"], "r": 1, "e": "Das Video nennt Data Drift, Concept Drift und Label Drift als drei Arten."}, {"id": "A10.v.UdbDq4ozeME", "t": "frei", "abruf": 1, "vid": "UdbDq4ozeME", "vq": "nach", "q": "Video «Model Drift Explained With Simple Examples!» (KnowlegeTuber's): Was waren die Kernaussagen?", "m": "1. Model Drift ist die schleichende Verschlechterung der Modellleistung durch Verschiebungen in der zugrundeliegenden Datenverteilung, man unterscheidet Data Drift, Concept Drift und Label Drift. 2. Statistische Tests wie der Kolmogorov-Smirnov-Test oder der Chi-Quadrat-Test koennen erkennen, ob sich die Verteilung neuer Daten signifikant von den Trainingsdaten unterscheidet. 3. Gegen Drift helfen regelmaessiges Neu-Trainieren mit aktuellen Daten, Online-Learning-Algorithmen, Ensemble-Methoden und eine robuste Validierung mittels k-Fold-Cross-Validation oder Time-Series-Split."}, {"id": "A10.vq.UdbDq4ozeME.nach0", "vid": "UdbDq4ozeME", "vq": "nach", "t": "mc", "q": "Was ist laut Video der Unterschied zwischen Data Drift und Concept Drift?", "a": ["Data Drift betrifft die Eingabedaten, Concept Drift die Beziehung zwischen Eingabe und Zielwert", "Beide meinen dasselbe", "Data Drift gibt es nur bei Bildern", "Concept Drift betrifft nur die Trainingszeit"], "r": 0, "e": "Data Drift ist eine Verschiebung der Eingabedaten, Concept Drift eine Veränderung der Beziehung zwischen Input und Zielvariable, z.B. wenn Betrüger neue Taktiken nutzen."}, {"id": "A10.vq.UdbDq4ozeME.nach1", "vid": "UdbDq4ozeME", "vq": "nach", "t": "mc", "q": "Welches Beispiel nennt das Video für Concept Drift?", "a": ["Ein Modell, das nur im Winter trainiert wurde", "Betrüger, die ihre Taktiken bei der Betrugserkennung ändern", "Ein Klassifikationsmodell mit veränderter Klassenverteilung", "Ein Modell ohne Trainingsdaten"], "r": 1, "e": "Wenn Betrüger ihre Methoden ändern, verändert sich die Beziehung zwischen Mustern und Betrug, das ist Concept Drift."}, {"id": "A10.vq.UdbDq4ozeME.nach2", "vid": "UdbDq4ozeME", "vq": "nach", "t": "ms", "q": "Welche zwei Massnahmen gegen Model Drift nennt das Video?", "a": ["Regelmässiges Retraining mit neuen Daten", "Das Modell komplett löschen", "Online Learning zur laufenden Anpassung", "Nie wieder Daten sammeln"], "r": [0, 2], "e": "Retraining und Online Learning sind zwei von mehreren im Video genannten Gegenmassnahmen."}, {"id": "A10.vq.UdbDq4ozeME.nach3", "vid": "UdbDq4ozeME", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum ein Modell, das früher gut funktioniert hat, plötzlich schlechter wird, ohne dass am Code etwas geändert wurde.", "m": "Das Modell selbst bleibt gleich, aber die Welt um es herum verändert sich. Wenn sich die Eingabedaten, die Zusammenhänge zwischen Eingabe und Ergebnis oder die Verteilung der Zielwerte verschieben, passen die gelernten Muster nicht mehr zur Realität, und die Vorhersagen werden schlechter."}, {"id": "A10.vq.UdbDq4ozeME.abc", "t": "abc", "abruf": 1, "vid": "UdbDq4ozeME", "vq": "nach", "m": ["Accuracy", "Concept Drift", "Data Drift", "Ensemble", "F1-Score", "Feature Engineering", "Kolmogorov-Smirnov-Test", "Label Drift", "Monitoring", "Online Learning", "Precision", "Recall", "Retraining", "Validation"], "q": "ABC-Liste zu «Model Drift Explained With Simple Examples!»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A10.vq.UdbDq4ozeME.kawa", "t": "kawa", "abruf": 1, "vid": "UdbDq4ozeME", "vq": "nach", "wort": "DRIFT", "m": ["D: Data Drift bedeutet, die Verteilung der Eingabedaten verändert sich.", "R: Retraining mit aktuellen Daten hilft gegen Drift.", "I: Input-Verteilung verschiebt sich, wenn sich die Umgebung ändert.", "F: F1-Score kombiniert Precision und Recall, um Drift früh zu erkennen.", "T: Tests wie der Kolmogorov-Smirnov-Test zeigen Verschiebungen in den Daten auf."], "q": "KaWa zu «DRIFT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A10.0", "t": "mc", "q": "Was ist Drift?", "a": ["Ein Programmierfehler nach einem Update", "Die Welt oder die Daten ändern sich, das Modell bleibt gleich und wird dadurch schlechter", "Ein Hackerangriff", "Zu hohe Temperatur"], "r": 1, "e": "Datendrift: Eingaben ändern sich. Konzeptdrift: Der Zusammenhang zwischen Eingabe und richtigem Ergebnis ändert sich."}, {"id": "A10.1", "t": "ord", "q": "Die Erkennungsquote sinkt in der Stichprobe von 92 auf 70 %. Bringe das Vorgehen in die richtige Reihenfolge.", "a": ["Messung prüfen: stimmt die Stichprobe, stimmt die Zählung?", "Fehlerfälle ansehen und Ursache eingrenzen (neue Art von Eingaben?)", "Sofortmassnahme: Mensch prüft die betroffene Kategorie", "Daten ergänzen, Modell oder Regeln anpassen", "Neu messen und Schwellenwert im Monitoring festhalten"], "e": "Erst die Waage prüfen, dann Diagnose, dann absichern, dann beheben, dann nachmessen."}, {"id": "A10.2", "t": "ms", "q": "Welche zwei Dinge gehören in ein Monitoring, damit Drift auffällt?", "a": ["Regelmässige Stichprobe mit menschlicher Kontrolle", "Kennzahl mit Schwellenwert und festgelegter Massnahme", "Monatliche Neuinstallation", "Höhere Auflösung der Logos"], "r": [0, 1], "e": "Ohne Referenz (Labels aus Stichprobe) sieht man nur Eingabeverschiebungen. Schwelle plus Massnahme macht die Kennzahl handlungsfähig."}, {"id": "A10.3", "t": "frei", "q": "Erkläre Drift einem Zehnjährigen.", "m": "Das Programm hat mit einer Landkarte von früher gelernt. Inzwischen wurden neue Strassen gebaut, aber die Karte ist dieselbe. Niemand hat etwas kaputt gemacht, trotzdem verfährt es sich immer öfter. Man muss regelmässig nachschauen, ob die Karte noch stimmt."}], "videos": [{"id": "bmU4SLf1cjM", "kanal": "CodeCraft Academy", "titel": "Datendrift-Überwachung erklärt | Warum ML-Modelle versagen", "dauer": "7:48"}, {"id": "UdbDq4ozeME", "kanal": "KnowlegeTuber's", "titel": "Model Drift Explained With Simple Examples!", "dauer": "3:49"}], "pn": 13}, {"key": "A11", "titel": "Bias und Fairness", "warum": "Critical Incident 04 (AICORN) und jede Frage zu Bewerbungs- oder Score-Systemen.", "fragen": [{"id": "A11.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Bias und Fairness»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Critical Incident 04 (AICORN) und jede Frage zu Bewerbungs- oder Score-Systemen. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A11.vq.77G3n3JHJPA.vor0", "vid": "77G3n3JHJPA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie hat eine Bildsoftware von Google vor einigen Jahren fälschlicherweise reagiert, als sie Fotos von Afroamerikaner*innen erkennen sollte?", "a": ["sie hat die Fotos gar nicht angezeigt", "sie hat die Personen als Gorillas bezeichnet", "sie hat automatisch alle Fotos gelöscht", "sie hat die Fotos schwarz-weiss gefärbt"], "r": 1, "e": "Das Video nennt genau diesen Fall: Googles Bildsoftware bezeichnete Afroamerikaner*innen fälschlich als Gorillas."}, {"id": "A11.vq.77G3n3JHJPA.vor1", "vid": "77G3n3JHJPA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Kann man einen diskriminierenden Algorithmus einfach reparieren, indem man alle Daten zur Hautfarbe löscht?", "a": ["ja, das reicht immer aus", "ja, aber nur bei Gesichtserkennung", "nein, weil Algorithmen oft eine Blackbox sind und andere Merkmale wie der Wohnort trotzdem diskriminieren können", "nein, weil Algorithmen dann gar nicht mehr funktionieren"], "r": 2, "e": "Das Video erklärt am Beispiel des Wohnquartiers, dass Algorithmen auch über andere Merkmale wie den Wohnort indirekt diskriminieren können, selbst ohne direkte Angabe zur Hautfarbe."}, {"id": "A11.v.77G3n3JHJPA", "t": "frei", "abruf": 1, "vid": "77G3n3JHJPA", "vq": "nach", "q": "Video «KI-Vorurteile: Warum Algorithmen diskriminieren | SRF Forward» (SRF Impact): Was waren die Kernaussagen?", "m": "1. Selbstlernende Algorithmen sind zu Beginn neutral, uebernehmen aber Vorurteile aus den Trainingsdaten, etwa wenn eine Gesichtserkennung vor allem mit Bildern weisser Personen trainiert wurde und dadurch bei dunkler Hautfarbe schlechter funktioniert. 2. Auch das Entfernen von sensiblen Merkmalen wie der Hautfarbe loest das Problem nicht zwingend, weil Algorithmen anhand von Ersatzmerkmalen wie dem Wohnquartier verallgemeinern und dadurch Einzelpersonen benachteiligen koennen, die gar nicht zur eigentlich betroffenen Gruppe gehoeren. 3. Als Gegenmassnahmen werden mehr Diversitaet in den Entwicklungsteams, mehr Transparenz ueber die Trainingsdaten und regelmaessige Fairness-Pruefungen der Ergebnisse genannt, wobei offen bleibt, wer definiert, was als fair gilt."}, {"id": "A11.vq.77G3n3JHJPA.nach0", "vid": "77G3n3JHJPA", "vq": "nach", "t": "mc", "q": "Warum lehnte die Software im Beispiel den Kreditantrag für das Elektrovelo ab, obwohl die Antragstellerin immer pünktlich zahlt?", "a": ["weil sie zu wenig verdient", "weil sie in einem Quartier wohnt, in dem die meisten Menschen ihre Rechnungen zu spät bezahlen", "weil sie noch nie einen Kredit hatte", "weil die Software keine Frauen akzeptiert"], "r": 1, "e": "Das Video zeigt, wie der Algorithmus die Antragstellerin nur aufgrund ihres Wohnquartiers benachteiligt, obwohl sie persönlich zu den pünktlichen Zahlerinnen gehört."}, {"id": "A11.vq.77G3n3JHJPA.nach1", "vid": "77G3n3JHJPA", "vq": "nach", "t": "ms", "q": "Welche zwei Lösungsansätze gegen algorithmische Diskriminierung nennt das Video?", "a": ["mehr Diversität in Teams und der Branche", "alle Algorithmen sofort verbieten", "mehr Transparenz darüber schaffen, wie Algorithmen entscheiden", "nur noch Menschen ohne Computer arbeiten lassen"], "r": [0, 2], "e": "Das Video nennt unter anderem mehr Diversität in Teams und mehr Transparenz als mögliche Lösungsansätze gegen diskriminierende Algorithmen."}, {"id": "A11.vq.77G3n3JHJPA.nach2", "vid": "77G3n3JHJPA", "vq": "nach", "t": "lueck", "q": "Ein selbstlernender Algorithmus ist am Anfang laut Video wie ein frisch geborenes ___, das noch nichts weiss und nicht von sich aus diskriminierend ist.", "r": ["baby"], "e": "Das Video vergleicht einen Algorithmus am Anfang mit einem Baby, das erst durch die Daten, mit denen es gefüttert wird, Vorurteile übernimmt."}, {"id": "A11.vq.77G3n3JHJPA.nach3", "vid": "77G3n3JHJPA", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wie ein Algorithmus laut Video überhaupt diskriminierend werden kann, obwohl er anfangs neutral ist.", "m": "Ein Algorithmus lernt aus grossen Datenmengen, die von Menschen stammen und daher schon Vorurteile enthalten können. Wenn er zum Beispiel vor allem mit Gesichtern von weissen Menschen trainiert wird, erkennt er dunkle Gesichter schlechter. Weil viele dieser Systeme wie eine Blackbox funktionieren, merkt man solche Verzerrungen oft erst, wenn schon Menschen benachteiligt wurden."}, {"id": "A11.vq.77G3n3JHJPA.abc", "t": "abc", "abruf": 1, "vid": "77G3n3JHJPA", "vq": "nach", "m": ["Algorithmus", "Bias", "Blackbox", "Diskriminierung", "Diversität", "Fairness", "Gesichtserkennung", "Kredit", "Minderheit", "Quartier", "Transparenz", "Vorurteil"], "q": "ABC-Liste zu «KI-Vorurteile: Warum Algorithmen diskriminieren | SRF Forward»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A11.vq.77G3n3JHJPA.kawa", "t": "kawa", "abruf": 1, "vid": "77G3n3JHJPA", "vq": "nach", "wort": "BIAS", "m": ["B: Blackbox: man kann oft nicht nachvollziehen, welche Regeln der Algorithmus wirklich aufgestellt hat", "I: Intransparenz: Firmen wie Facebook und Google lassen kaum in ihre Algorithmen schauen", "A: Algorithmus: entscheidet mit über Jobs, Kredite und Werbung", "S: Sexistisch: der Amazon-Algorithmus bewertete Bewerbungen von Frauen schlechter"], "q": "KaWa zu «BIAS»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A11.vq.9WPyD2BLooo.vor0", "vid": "9WPyD2BLooo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wo lag laut der im Video genannten MIT-Studie die Fehlerquote von Gesichtserkennung bei weissen Männern?", "a": ["Bis zu 35 Prozent", "Maximal 0,8 Prozent", "Genau 10 Prozent", "Über 50 Prozent"], "r": 1, "e": "Die Studie fand eine maximale Fehlerquote von 0,8 Prozent bei weissen Männern, bei schwarzen Frauen lag sie dagegen viel höher."}, {"id": "A11.vq.9WPyD2BLooo.vor1", "vid": "9WPyD2BLooo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was war laut Video das eigentliche Problem beim diskriminierenden Risikoalgorithmus in den USA?", "a": ["Ein fehlerhafter mathematischer Algorithmus", "Verzerrte Trainingsdaten aus vergangenen menschlichen Entscheidungen", "Ein Hackerangriff auf das System", "Zu wenig Rechenleistung des Computers"], "r": 1, "e": "Das Video stellt klar, dass nicht die Formel, sondern die auf menschlichen Vorurteilen basierenden Trainingsdaten das Problem waren."}, {"id": "A11.v.9WPyD2BLooo", "t": "frei", "abruf": 1, "vid": "9WPyD2BLooo", "vq": "nach", "q": "Video «Wie (und warum) Künstliche Intelligenz diskriminiert» (Doktor Whatson): Was waren die Kernaussagen?", "m": "1. Beim COMPAS-Risikosystem in den USA erhielten juengere und schwarze Angeklagte laengere Freiheitsstrafen, weil das Modell die Vorurteile menschlicher Richterinnen und Richter aus den Trainingsdaten uebernommen hat, nicht weil der Algorithmus selbst fehlerhaft programmiert war. 2. Eine MIT-Studie zeigte, dass Gesichtserkennungssoftware bei weissen Maennern nur in maximal 0,8 Prozent der Faelle irrt, bei Frauen mit dunkler Hautfarbe aber in bis zu 34 bis 47 Prozent der Faelle versagt, weil solche Gruppen in den Trainingsdaten stark unterrepraesentiert waren. 3. Selbst wenn man sensible Merkmale wie Geschlecht oder Herkunft aus den Bewerbungsdaten entfernt, findet ein Algorithmus haeufig Proxy-Merkmale wie Vorname, Wohnort oder Hobbys, die indirekt wieder auf diese Merkmale schliessen lassen, wie das Beispiel des Amazon-Bewerbungsalgorithmus zeigt."}, {"id": "A11.vq.9WPyD2BLooo.nach0", "vid": "9WPyD2BLooo", "vq": "nach", "t": "mc", "q": "Welches Unternehmen stellte 2014 einen Bewerbungsalgorithmus vor, der später wegen Diskriminierung gestoppt wurde?", "a": ["Amazon", "Netflix", "Microsoft", "Google"], "r": 0, "e": "Amazon. Das Werkzeug entstand ab 2014, wurde 2017 eingestellt und 2018 öffentlich. ACHTUNG: Belegt ist ein GESCHLECHTER-Bias, kein Hautfarben-Bias. Das System war auf zehn Jahre eingegangene Lebensläufe trainiert und stufte Lebensläufe mit dem Wort «women's» oder von reinen Frauen-Hochschulen herab."}, {"id": "A11.vq.9WPyD2BLooo.nach1", "vid": "9WPyD2BLooo", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge korrelierten laut Video mit sensiblen Merkmalen wie Geschlecht oder Herkunft, obwohl diese aus den Daten entfernt wurden?", "a": ["Der Vorname", "Das Hobby Skifahren", "Die Lieblingsfarbe", "Die Schuhgrösse"], "r": [0, 1], "e": "Das Video nennt den Vornamen und das Hobby Skifahren als Beispiele für solche Proxys, die anderen beiden werden nicht erwähnt."}, {"id": "A11.vq.9WPyD2BLooo.nach2", "vid": "9WPyD2BLooo", "vq": "nach", "t": "lueck", "q": "Wenn man einem Algorithmus schlechte Daten gibt, dann muss man sich nicht wundern, dass auch schlechte ___ herauskommen.", "r": ["ergebnisse"], "e": "Das Video fasst das Prinzip als bias in, bias out zusammen, schlechte Daten führen zu schlechten Ergebnissen."}, {"id": "A11.vq.9WPyD2BLooo.nach3", "vid": "9WPyD2BLooo", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, warum es laut Video nicht reicht, das Geschlecht oder die Herkunft einfach aus den Bewerbungsdaten zu löschen, um Diskriminierung zu verhindern.", "m": "Auch ohne direkte Angabe von Geschlecht oder Herkunft findet der Algorithmus oft versteckte Hinweise, sogenannte Proxys, wie den Vornamen oder den Geburtsort. Selbst scheinbar neutrale Angaben wie der Wohnort, das Studienfach oder ein Hobby wie Skifahren können mit Herkunft und sozialem Status zusammenhängen. Deshalb kann ein Algorithmus trotz gelöschter sensibler Daten weiterhin diskriminieren, weil er die Information auf Umwegen wiederfindet."}, {"id": "A11.vq.9WPyD2BLooo.abc", "t": "abc", "abruf": 1, "vid": "9WPyD2BLooo", "vq": "nach", "m": ["Algorithmus", "Amazon", "Bias", "Diskriminierung", "Gesichtserkennung", "Hautfarbe", "Proxy", "Skifahren", "Trainingsdaten", "Verantwortung", "Vielfalt", "Vorurteil"], "q": "ABC-Liste zu «Wie (und warum) Künstliche Intelligenz diskriminiert»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A11.vq.9WPyD2BLooo.kawa", "t": "kawa", "abruf": 1, "vid": "9WPyD2BLooo", "vq": "nach", "wort": "BIAS", "m": ["B: Bias entsteht durch verzerrte Trainingsdaten, nicht durch den Algorithmus selbst", "I: In den Trainingsdaten waren über 80 Prozent der Personen weiss", "A: Amazon stoppte 2014 einen Bewerbungsalgorithmus, der Frauen benachteiligte", "S: Skifahren als Hobby korrelierte im Beispiel mit der Hautfarbe der Bewerbenden"], "q": "KaWa zu «BIAS»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A11.vq.xRNHdB_aVI0.vor0", "vid": "xRNHdB_aVI0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Erkennt die im Video beschriebene KI schwarze und weisse Personen bei einer Flughafenkontrolle gleich gut?", "a": ["Ja, absolut gleich gut", "Nein, schwarze Personen werden schlechter erkannt", "Nein, weisse Personen werden schlechter erkannt", "Das hängt nur vom Wetter ab"], "r": 1, "e": "Im Video wird Sam an der Flughafenkontrolle abgewiesen, weil die KI schwarze Personen schlechter erkennt."}, {"id": "A11.vq.xRNHdB_aVI0.vor1", "vid": "xRNHdB_aVI0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viel Prozent der Verschwörungskommentare unter einem Video stammten im Beispiel des Videos von derselben KI?", "a": ["10 Prozent", "50 Prozent", "90 Prozent", "100 Prozent"], "r": 2, "e": "Das Video nennt 90 Prozent der Kommentare als von derselben KI verfasst."}, {"id": "A11.v.xRNHdB_aVI0", "t": "frei", "abruf": 1, "vid": "xRNHdB_aVI0", "vq": "nach", "q": "Video «kurz erklärt: Künstliche Intelligenz und Diskriminierung» (Bildungsstätte Anne Frank): Was waren die Kernaussagen?", "m": "1. KI-Systeme entscheiden bereits heute mit ueber Kreditvergabe, medizinische Behandlung oder Jobsuche, und ihre Trainingsdaten koennen Diskriminierung aus der Vergangenheit unbemerkt in die Zukunft tragen. 2. Ein KI-Bias entsteht nicht zwingend absichtlich, sondern weil Trainingsdaten verzerrt sind oder nicht alle gesellschaftlichen Gruppen repraesentieren, zum Beispiel wenn eine KI bei der Anfrage nach dem Bild einer Lehrkraft bevorzugt weisse Frauen generiert. 3. Gegen diskriminierende KI helfen sorgfaeltig ausgewaehlte Trainingsdaten, regelmaessige Fairness-Pruefungen der Ergebnisse, mehr Transparenz der Anbieter und die Regel, wichtige Entscheidungen am Ende von Menschen treffen zu lassen statt allein von der Maschine."}, {"id": "A11.vq.xRNHdB_aVI0.nach0", "vid": "xRNHdB_aVI0", "vq": "nach", "t": "mc", "q": "Warum kann eine KI diskriminieren, obwohl niemand das absichtlich programmiert hat?", "a": ["Weil KI grundsätzlich böswillig handelt", "Weil sie mit Trainingsdaten aus der realen Welt lernt, die selbst verzerrt sein können", "Weil sie zu langsam rechnet", "Weil sie kein Internet hat"], "r": 1, "e": "Laut Video übernehmen KI-Modelle Verzerrungen aus ihren realen Trainingsdaten, ohne dass das beabsichtigt ist."}, {"id": "A11.vq.xRNHdB_aVI0.nach1", "vid": "xRNHdB_aVI0", "vq": "nach", "t": "ms", "q": "Welche zwei Massnahmen nennt das Video gegen KI-Bias?", "a": ["Trainingsdaten sorgfältig auswählen", "KI vollständig verbieten", "Ergebnisse regelmässig auf Fairness überprüfen", "KI grundsätzlich nie mehr benutzen"], "r": [0, 2], "e": "Das Video nennt sorgfältige Datenauswahl und regelmässige Fairness-Prüfungen als konkrete Massnahmen."}, {"id": "A11.vq.xRNHdB_aVI0.nach2", "vid": "xRNHdB_aVI0", "vq": "nach", "t": "lueck", "q": "Wenn Diskriminierung aus der Vergangenheit durch Trainingsdaten in die Zukunft weitergetragen wird, nennt man das KI-___.", "r": ["bias"], "e": "Genau dieses Phänomen nennt das Video KI-Bias."}, {"id": "A11.vq.xRNHdB_aVI0.nach3", "vid": "xRNHdB_aVI0", "vq": "nach", "t": "frei", "q": "Erkläre an einem Beispiel aus dem Video, wie ein KI-Bias entstehen kann, ohne dass die Entwickler es beabsichtigt haben.", "m": "Wenn eine KI nach dem Bild einer Lehrkraft gefragt wird, generiert sie laut Video bevorzugt weisse Frauen, weil ihre Trainingsdaten diese Gruppe häufiger zeigen. Niemand hat das absichtlich so programmiert, es liegt an der Verteilung der Daten, aus denen die KI gelernt hat."}, {"id": "A11.vq.xRNHdB_aVI0.abc", "t": "abc", "abruf": 1, "vid": "xRNHdB_aVI0", "vq": "nach", "m": ["Bias", "Diskriminierung", "Fairness", "Filter", "Kreditvergabe", "Techbranche", "Trainingsdaten", "Transparenz", "Vielfalt", "Wachsamkeit"], "q": "ABC-Liste zu «kurz erklärt: Künstliche Intelligenz und Diskriminierung»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A11.vq.xRNHdB_aVI0.kawa", "t": "kawa", "abruf": 1, "vid": "xRNHdB_aVI0", "vq": "nach", "wort": "BIAS", "m": ["B: Bias: eine systematische Verzerrung der KI-Ergebnisse", "I: Individuelle Namen wie Sabrina stuft die KI als riskanter ein als Andreas", "A: Am Flughafen erkennt die KI schwarze Personen bei der Kontrolle schlechter", "S: Soziale Medien: KI kann massenhaft Verschwörungskommentare verfassen"], "q": "KaWa zu «BIAS»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A11.vq.4A4VN6n4ZSo.vor0", "vid": "4A4VN6n4ZSo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was meint Jeanette Wiget, wenn sie sagt, Bias in einem KI-Modell sei schwierig rauszubekommen?", "a": ["Bias lässt sich per Update sofort entfernen", "Verzerrungen aus Trainingsdaten bleiben oft im Modell stecken", "Bias betrifft nur Bilder, nie Text", "Bias ist in Europa gesetzlich verboten"], "r": 1, "e": "Sie sagt wörtlich, dass Biases nicht einfach so aus den Modellen weggehen und es schwierig ist, das rauszubekommen."}, {"id": "A11.vq.4A4VN6n4ZSo.vor1", "vid": "4A4VN6n4ZSo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches Beispiel bringt Christoph Magnussen im Gespräch, das zeigt, wie stark ein KI-Agent von seinen Trainingsdaten geprägt ist?", "a": ["Der Agent schlägt trotz gegenteiliger Anweisung immer wieder Notion als Tool vor", "Der Agent verweigert jede Antwort", "Der Agent spricht nur Englisch", "Der Agent erfindet ein neues Bundesland"], "r": 0, "e": "Obwohl er in jedem Prompt schreibt, kein Notion zu nutzen, schlägt der Agent es trotzdem ständig vor, weil es massiv in den Trainingsdaten steckt."}, {"id": "A11.v.4A4VN6n4ZSo", "t": "frei", "abruf": 1, "vid": "4A4VN6n4ZSo", "vq": "nach", "q": "Video «Souveräne KI aus Europa: Chancen, Bias & Realität | Janette Wiget von Merantix» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Janette Wiget weist darauf hin, dass grosse Sprachmodelle wie ChatGPT kein Schweizerdeutsch verstehen, und plädiert dafür, auch kleinere Sprachen und Nationen wie afrikanische Sprachräume in Trainingsdaten stärker abzubilden. 2. Sie nennt das Schweizer Sprachmodell Apertus als Beispiel dafür, wie ein Land bewusst ein eigenes, sprachlich angepasstes Modell aufbaut, weil grosse US-Modelle die eigene Sprache nicht abdecken. 3. Wiget sagt, das grösste ungelöste Problem beim KI-Einsatz in Unternehmen sei nach wie vor chaotisches, nicht digitalisiertes Datenmanagement sowie Silodenken zwischen Abteilungen, Ländern und Branchen."}, {"id": "A11.vq.4A4VN6n4ZSo.nach0", "vid": "4A4VN6n4ZSo", "vq": "nach", "t": "mc", "q": "Welche Konsequenz nennt Jeanette Wiget, wenn Menschen Angst vor KI und Arbeitsplatzverlust haben?", "a": ["Sie fordern mehr Algorithmen", "Man verliert die Kontrolle", "Sie kündigen sofort", "Sie ignorieren das Thema komplett"], "r": 1, "e": "Sie sagt, die furchterregende Konsequenz sei, dass man die Kontrolle verliert."}, {"id": "A11.vq.4A4VN6n4ZSo.nach1", "vid": "4A4VN6n4ZSo", "vq": "nach", "t": "lueck", "q": "Der wiederkehrende Notion-Vorschlag des Agenten hat laut Christoph Magnussen die ___ des gesamten Papiers erodiert.", "r": ["kredibilität", "glaubwürdigkeit"], "e": "Er sagt wörtlich, dieser eine Satz habe die Kredibilität des gesamten Papiers für ihn erodiert."}, {"id": "A11.vq.4A4VN6n4ZSo.nach2", "vid": "4A4VN6n4ZSo", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum es gefährlich sein kann, einen Bias im Modell einfach zu akzeptieren, weil er die Arbeit angeblich produktiver macht.", "m": "Wenn man einen bekannten Bias einfach hinnimmt, weil das Ergebnis trotzdem schneller oder produktiver wirkt, bleibt die Verzerrung dauerhaft im System und beeinflusst weiterhin alle Entscheidungen. Das kann zu unfairen oder falschen Ergebnissen führen, ohne dass es auffällt, weil man ja zufrieden mit der Geschwindigkeit ist. Jeanette Wiget warnt deshalb davor, Bias einfach zu behalten, nur weil es bequem ist."}, {"id": "A11.vq.4A4VN6n4ZSo.abc", "t": "abc", "abruf": 1, "vid": "4A4VN6n4ZSo", "vq": "nach", "m": ["Agent", "Apertus", "Bias", "Interdisziplinär", "Kontrolle", "Mundart", "Netzwerk", "Notion", "Schweiz", "Silodenken", "Team", "Trainingsdaten"], "q": "ABC-Liste zu «Souveräne KI aus Europa: Chancen, Bias & Realität | Janette Wiget von Merantix»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A11.vq.4A4VN6n4ZSo.kawa", "t": "kawa", "abruf": 1, "vid": "4A4VN6n4ZSo", "vq": "nach", "wort": "BIAS", "m": ["B: Bias: eine Verzerrung im Modell, die schwer wieder rauszubekommen ist", "I: Interdisziplinäre Teams: wichtig, weil man selten nur ein Machine-Learning-Problem löst", "A: Agent: braucht Autonomie, sonst ist es nur Prozessautomatisierung", "S: Silodenken: ein grosses Problem in vielen Grossunternehmen laut dem Gespräch"], "q": "KaWa zu «BIAS»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A11.0", "t": "mc", "q": "Ein Bewerbungs-Tool nutzt das Feld «Geschlecht» nicht und benachteiligt Frauen trotzdem. Warum?", "a": ["Zufall", "Stellvertreter-Merkmale (Proxys) wie Vorname, Hobbys oder Lücken im Lebenslauf verraten dasselbe", "Das Tool ist absichtlich so programmiert", "Frauen bewerben sich seltener"], "r": 1, "e": "«Wir benutzen das Merkmal nicht» beweist nichts. Fairness misst man am Ergebnis, nicht an der Absicht."}, {"id": "A11.1", "t": "ms", "q": "Wie misst man Bias? Wähle zwei.", "a": ["Auswahl- oder Fehlerquoten je Gruppe vergleichen", "Testprofile, die sich nur in einem Merkmal unterscheiden (Paar-Test)", "Den Anbieter fragen, ob das Modell fair ist", "Die Gesamtgenauigkeit ansehen"], "r": [0, 1], "e": "Gesamtgenauigkeit verdeckt Gruppenunterschiede. Faustregel aus den USA: Vier-Fünftel-Regel für Auswahlquoten."}, {"id": "A11.2", "t": "mc", "q": "Woher kommt Bias am häufigsten?", "a": ["Aus zu schnellen Servern", "Aus historischen Trainingsdaten, die alte Entscheidungen und Ungleichheiten abbilden", "Aus der Benutzeroberfläche", "Aus zu vielen Nutzern"], "r": 1, "e": "Das Modell lernt, was früher entschieden wurde, samt Vorurteilen. Weitere Quellen: Auswahl der Daten, Labels, Messgrössen."}, {"id": "A11.3", "t": "frei", "q": "Transfer: Ein Retouren-Score ist bei unter 25-Jährigen und in drei PLZ-Gebieten doppelt so hoch, die echte Betrugsquote dort aber nicht. Was heisst das, was tust du?", "m": "Das Modell benachteiligt Gruppen ohne sachlichen Grund (Proxy-Bias über Alter und Wohnort). Sofort: keine automatischen Entscheide auf Basis des Scores, Mensch prüft. Dann: Merkmale und Trainingsdaten untersuchen, Fehlalarmquote je Gruppe als Kennzahl mit Schwelle einführen, rechtlich prüfen (Diskriminierung, automatisierte Einzelentscheidung nach DSG)."}], "videos": [{"id": "77G3n3JHJPA", "kanal": "SRF Impact", "titel": "KI-Vorurteile: Warum Algorithmen diskriminieren | SRF Forward", "dauer": "8:18"}, {"id": "9WPyD2BLooo", "kanal": "Doktor Whatson", "titel": "Wie (und warum) Künstliche Intelligenz diskriminiert", "dauer": "18:00"}, {"id": "xRNHdB_aVI0", "kanal": "Bildungsstätte Anne Frank", "titel": "kurz erklärt: Künstliche Intelligenz und Diskriminierung", "dauer": "3:26"}, {"id": "4A4VN6n4ZSo", "kanal": "Christoph Magnussen", "titel": "Souveräne KI aus Europa: Chancen, Bias & Realität | Janette Wiget von Merantix", "dauer": "1:05:18"}], "pn": 15}, {"key": "A12", "titel": "Trefferquote, Präzision, Recall", "warum": "Die Rechnungen der Prüfung: «Von drei Alarmen ist wie viel echt?»", "fragen": [{"id": "A12.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Trefferquote, Präzision, Recall»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Die Rechnungen der Prüfung: «Von drei Alarmen ist wie viel echt?» Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A12.vq.Kdsp6soqA7o.vor0", "vid": "Kdsp6soqA7o", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wonach richtet sich laut Video die Grösse einer Confusion Matrix?", "a": ["Nach der Anzahl der Patienten im Datensatz", "Nach der Anzahl der Kategorien, die vorhergesagt werden sollen", "Nach der Rechenleistung des Computers", "Nach der Anzahl der verwendeten Methoden"], "r": 1, "e": "Das Video sagt ausdrücklich, die Grösse richtet sich nach der Anzahl der Dinge, die vorhergesagt werden sollen."}, {"id": "A12.vq.Kdsp6soqA7o.vor1", "vid": "Kdsp6soqA7o", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man es, wenn ein Patient tatsächlich Herzkrankheit hat, der Algorithmus aber gesund vorhersagt?", "a": ["True Positive", "True Negative", "False Positive", "False Negative"], "r": 3, "e": "Ein tatsächlich positiver Fall, der als negativ eingestuft wird, heisst False Negative."}, {"id": "A12.v.Kdsp6soqA7o", "t": "frei", "abruf": 1, "vid": "Kdsp6soqA7o", "vq": "nach", "q": "Video «Machine Learning Fundamentals: The Confusion Matrix» (StatQuest with Josh Starmer): Was waren die Kernaussagen?", "m": "1. Eine Konfusionsmatrix stellt die Vorhersagen eines Modells den tatsaechlichen Werten gegenueber und teilt die Ergebnisse bei einer Ja/Nein-Frage in vier Felder: Richtig Positiv, Richtig Negativ, Falsch Positiv und Falsch Negativ. 2. Die Werte auf der Diagonalen der Matrix zeigen die korrekt klassifizierten Faelle, alle Werte ausserhalb der Diagonalen zeigen die Fehler des Modells. 3. Um zwei Modelle miteinander zu vergleichen, vergleicht man ihre Konfusionsmatrizen direkt: In diesem Beispiel schnitt Random Forest besser ab als K-Nearest-Neighbors, weil es mehr echte Krankheitsfaelle und mehr echte Gesundfaelle korrekt erkannte."}, {"id": "A12.vq.Kdsp6soqA7o.nach0", "vid": "Kdsp6soqA7o", "vq": "nach", "t": "mc", "q": "Was zeigen laut Video die Zahlen auf der Diagonale einer Confusion Matrix?", "a": ["Alle Fälle, die der Algorithmus falsch eingeschätzt hat", "Alle Fälle, die der Algorithmus richtig eingeschätzt hat", "Nur die Fälle mit Herzkrankheit", "Die Gesamtzahl der Patienten"], "r": 1, "e": "Die grünen Felder auf der Diagonale zeigen laut Video die korrekt klassifizierten Fälle."}, {"id": "A12.vq.Kdsp6soqA7o.nach1", "vid": "Kdsp6soqA7o", "vq": "nach", "t": "ms", "q": "Welche zwei Werte lagen im Video beim Vergleich Random Forest gegen K-Nearest-Neighbors beim Random Forest höher?", "a": ["True Positives (142 statt 107)", "True Negatives (110 statt 79)", "False Positives (22 statt 29)", "Die Gesamtzahl der Patienten"], "r": [0, 1], "e": "Random Forest erkannte im Video sowohl mehr echte Kranke als auch mehr echte Gesunde korrekt."}, {"id": "A12.vq.Kdsp6soqA7o.nach2", "vid": "Kdsp6soqA7o", "vq": "nach", "t": "lueck", "q": "Ein Patient hat Herzkrankheit, der Algorithmus sagt aber, er habe keine. Das nennt man einen False ___.", "r": ["negative", "negativ"], "e": "Ein False Negative ist ein tatsächlich positiver Fall, der vom Algorithmus fälschlich als negativ eingestuft wird."}, {"id": "A12.vq.Kdsp6soqA7o.nach3", "vid": "Kdsp6soqA7o", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen an einem eigenen Beispiel, das nicht Herzkrankheit ist, was ein False Positive wäre.", "m": "Ein Spamfilter markiert eine ganz normale, wichtige E-Mail als Spam, obwohl sie keine ist. Der Algorithmus hat also fälschlich etwas als positiv, hier als Spam, eingestuft, das eigentlich negativ ist. Genau das ist ein False Positive, ein Fehlalarm."}, {"id": "A12.vq.Kdsp6soqA7o.abc", "t": "abc", "abruf": 1, "vid": "Kdsp6soqA7o", "vq": "nach", "m": ["Algorithmus", "Confusion Matrix", "Diagonale", "False Negative", "K-Nearest Neighbors", "Logistic Regression", "Random Forest", "Spalte", "Testdaten", "Trainingsdaten", "True Positive", "Vorhersage"], "q": "ABC-Liste zu «Machine Learning Fundamentals: The Confusion Matrix»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A12.vq.Kdsp6soqA7o.kawa", "t": "kawa", "abruf": 1, "vid": "Kdsp6soqA7o", "vq": "nach", "wort": "FEHLER", "m": ["F: False Positive: ein gesunder Patient wird fälschlich als krank erkannt", "E: Ecke: die vier Ecken der Matrix zeigen TP, TN, FP und FN", "H: Herzkrankheit: das Beispiel-Datenset im Video", "L: Logistic Regression: die dritte im Video verglichene Methode", "R: Random Forest: gewinnt im Beispiel gegen K-Nearest Neighbors"], "q": "KaWa zu «FEHLER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A12.vq.bFdjGIdX4m4.vor0", "vid": "bFdjGIdX4m4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wenn eine Suche vier Ergebnisse liefert und nur zwei davon relevant sind, wie hoch ist die Precision?", "a": ["100 Prozent", "75 Prozent", "50 Prozent", "25 Prozent"], "r": 2, "e": "Precision ist relevante Ergebnisse geteilt durch alle gefundenen Ergebnisse, hier zwei von vier, also 50 Prozent."}, {"id": "A12.vq.bFdjGIdX4m4.vor1", "vid": "bFdjGIdX4m4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Kann die Precision 100 Prozent betragen, auch wenn nur ein einziges relevantes Ergebnis gefunden wurde?", "a": ["Nein, das ist unmöglich", "Ja, wenn dieses eine Ergebnis auch tatsächlich relevant ist", "Nur wenn zehn Ergebnisse gefunden wurden", "Nur beim Recall, nicht bei der Precision"], "r": 1, "e": "Das Video zeigt genau dieses Beispiel: ein Treffer, der relevant ist, ergibt eins durch eins, also 100 Prozent Precision."}, {"id": "A12.v.bFdjGIdX4m4", "t": "frei", "abruf": 1, "vid": "bFdjGIdX4m4", "vq": "nach", "q": "Video «Precision und Recall in 100 Sekunden» (InSy InSy): Was waren die Kernaussagen?", "m": "1. Precision berechnet sich aus der Anzahl der relevanten gefundenen Ergebnisse geteilt durch die Gesamtzahl aller gefundenen Ergebnisse und misst, wie viele der Treffer tatsaechlich richtig sind. 2. Recall berechnet sich aus der Anzahl der gefundenen relevanten Ergebnisse geteilt durch die Anzahl aller tatsaechlich vorhandenen relevanten Ergebnisse und misst, wie viele der moeglichen Treffer man tatsaechlich gefunden hat. 3. Eine Precision von 100 Prozent ist bereits erreicht, wenn ein einziges gefundenes Ergebnis relevant ist, waehrend ein Recall von 100 Prozent erst erreicht ist, wenn wirklich alle relevanten Ergebnisse gefunden wurden, selbst wenn dabei zusaetzlich irrelevante Treffer dabei sind."}, {"id": "A12.vq.bFdjGIdX4m4.nach0", "vid": "bFdjGIdX4m4", "vq": "nach", "t": "mc", "q": "Wie berechnet man laut Video den Recall?", "a": ["Relevante gefundene Ergebnisse geteilt durch alle Ergebnisse, die gefunden wurden", "Relevante gefundene Ergebnisse geteilt durch alle relevanten Ergebnisse, die es überhaupt gibt", "Alle Ergebnisse geteilt durch die relevanten Ergebnisse", "Die Anzahl der Suchanfragen geteilt durch die Trefferzahl"], "r": 1, "e": "Recall setzt die gefundenen relevanten Ergebnisse ins Verhältnis zu allen relevanten Ergebnissen, die tatsächlich existieren."}, {"id": "A12.vq.bFdjGIdX4m4.nach1", "vid": "bFdjGIdX4m4", "vq": "nach", "t": "mc", "q": "Im Beispiel des Videos werden von drei existierenden Textmarkern nur zwei gefunden. Wie hoch ist der Recall?", "a": ["100 Prozent", "66 Prozent, also zwei Drittel", "33 Prozent", "50 Prozent"], "r": 1, "e": "Zwei von drei relevanten Textmarkern wurden gefunden, das ergibt einen Recall von zwei Dritteln."}, {"id": "A12.vq.bFdjGIdX4m4.nach2", "vid": "bFdjGIdX4m4", "vq": "nach", "t": "lueck", "q": "Wenn man fünf Ergebnisse findet, aber trotzdem alle drei relevanten Textmarker dabei sind, bleibt der Recall bei 3 durch 3, also ___ Prozent.", "r": ["100", "hundert"], "e": "Der Recall zählt nur, wie viele der relevanten Items gefunden wurden, zusätzliche irrelevante Treffer ändern daran nichts, deshalb bleibt er bei 100 Prozent."}, {"id": "A12.vq.bFdjGIdX4m4.nach3", "vid": "bFdjGIdX4m4", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der die Begriffe noch nie gehört hat, den Unterschied zwischen Precision und Recall anhand einer eigenen Suche im Internet.", "m": "Precision sagt aus, wie viele der gefundenen Ergebnisse tatsächlich zu meiner Suche passen, während Recall sagt, wie viele der insgesamt passenden Ergebnisse ich überhaupt gefunden habe. Wenn ich zum Beispiel nach einem Rezept suche und von zehn Treffern nur drei brauchbar sind, ist meine Precision niedrig. Finde ich aber alle brauchbaren Rezepte im Internet, ist mein Recall hoch, auch wenn viele unnütze Treffer dabei waren."}, {"id": "A12.vq.bFdjGIdX4m4.abc", "t": "abc", "abruf": 1, "vid": "bFdjGIdX4m4", "vq": "nach", "m": ["Anzahl", "Ergebnis", "Formel", "Genauigkeit", "Precision", "Qualität", "Recall", "Relevanz", "Suchmaschine", "Textmarker", "Trefferquote", "Wert"], "q": "ABC-Liste zu «Precision und Recall in 100 Sekunden»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A12.vq.bFdjGIdX4m4.kawa", "t": "kawa", "abruf": 1, "vid": "bFdjGIdX4m4", "vq": "nach", "wort": "TREFFER", "m": ["T: Trefferquote hoch heisst, viele relevante Ergebnisse wurden gefunden", "R: Relevanz jedes gefundenen Ergebnisses zählt bei der Precision", "E: Ergebnisse insgesamt stehen im Nenner der Precision-Formel", "F: Fehlende relevante Ergebnisse senken den Recall"], "q": "KaWa zu «TREFFER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A12.vq.NZ_1igUIcoI.vor0", "vid": "NZ_1igUIcoI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Kann ein Modell 95% Accuracy erreichen und trotzdem in der Praxis nutzlos sein?", "a": ["Nein, 95% Accuracy ist immer sehr gut", "Ja, das kann passieren, z.B. bei seltenen Ereignissen wie Betrug", "Nur wenn das Modell falsch programmiert ist", "Nein, Accuracy ist immer die beste Metrik"], "r": 1, "e": "Bei stark ungleich verteilten Daten wie Betrugsfällen kann ein Modell, das immer 'kein Betrug' vorhersagt, trotzdem 95% Accuracy erreichen."}, {"id": "A12.vq.NZ_1igUIcoI.vor1", "vid": "NZ_1igUIcoI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Von 200 Testdaten sind nur 10 tatsächlich Betrugsfälle. Welche Metrik zeigt das Problem eines schlechten Modells hier am besten?", "a": ["Accuracy", "Recall", "Bildschirmauflösung", "Ladezeit"], "r": 1, "e": "Recall zeigt, wie viele der tatsächlichen Betrugsfälle das Modell erkennt, während Accuracy hier täuschen kann."}, {"id": "A12.v.NZ_1igUIcoI", "t": "frei", "abruf": 1, "vid": "NZ_1igUIcoI", "vq": "nach", "q": "Video «Fehler-/Konfusionsmatrix einfach erklärt» (KI Kosmos | Felix): Was waren die Kernaussagen?", "m": "1. Ein Modell kann eine hohe Accuracy von 95 Prozent erreichen und trotzdem nutzlos sein, wenn die Datenklassen stark unausgeglichen sind, zum Beispiel wenn nur 5 Prozent aller Kreditkartentransaktionen Betrug sind und das Modell einfach immer kein Betrug vorhersagt. 2. Aus der Konfusionsmatrix lassen sich Recall (Anteil der erkannten echten positiven Faelle), Precision (Anteil der echten Treffer unter allen positiv vorhergesagten Faellen) und der F1-Score als harmonisches Mittel aus beiden berechnen. 3. Precision und Recall stehen in einem Tradeoff zueinander: Klassifiziert man mehr Faelle als positiv, um keinen echten Treffer zu verpassen, steigt der Recall, aber gleichzeitig steigen auch die falschen Alarme und die Precision sinkt."}, {"id": "A12.vq.NZ_1igUIcoI.nach0", "vid": "NZ_1igUIcoI", "vq": "nach", "t": "mc", "q": "Ein Betrugserkennungsmodell sagt bei 200 Testfällen immer 'kein Betrug' voraus, obwohl 10 davon echter Betrug sind. Wie hoch ist die Accuracy?", "a": ["50%", "95%", "10%", "0%"], "r": 1, "e": "190 von 200 Vorhersagen sind korrekt (alle echten Nicht-Betrugsfälle), das ergibt 95% Accuracy, obwohl das Modell nichts gelernt hat."}, {"id": "A12.vq.NZ_1igUIcoI.nach1", "vid": "NZ_1igUIcoI", "vq": "nach", "t": "mc", "q": "Wann optimiert man laut Video eher nach Precision statt nach Recall?", "a": ["Wenn man keinen positiven Fall übersehen darf, z.B. bei Krankheiten", "Wenn falsche Alarme teuer sind, z.B. bei Spam-E-Mails", "Wenn man gar keine Metrik braucht", "Wenn der Datensatz perfekt ausgeglichen ist"], "r": 1, "e": "Precision ist wichtig, wenn ein falscher Alarm, wie eine wichtige Mail im Spam, hohe Kosten verursacht."}, {"id": "A12.vq.NZ_1igUIcoI.nach2", "vid": "NZ_1igUIcoI", "vq": "nach", "t": "ms", "q": "Welche zwei Felder gehören zur Fehlermatrix (Konfusionsmatrix)?", "a": ["True Positive", "Fast Positive", "False Negative", "Medium Negative"], "r": [0, 2], "e": "Die vier echten Felder sind True Positive, True Negative, False Positive und False Negative, 'Fast Positive' und 'Medium Negative' gibt es nicht."}, {"id": "A12.vq.NZ_1igUIcoI.nach3", "vid": "NZ_1igUIcoI", "vq": "nach", "t": "lueck", "q": "Der Anteil der positiv vorhergesagten Datenpunkte, die auch wirklich positiv sind, heisst ___.", "r": ["precision", "präzision"], "e": "Das ist die Definition von Precision (Präzision) aus dem Video."}, {"id": "A12.vq.NZ_1igUIcoI.nach4", "vid": "NZ_1igUIcoI", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der es nicht kennt, warum Accuracy bei einem Datensatz mit 95% Nicht-Betrugsfällen eine irreführende Metrik sein kann.", "m": "Wenn fast alle Datenpunkte zu einer Klasse gehören, kann ein Modell einfach immer diese Mehrheitsklasse vorhersagen und trotzdem eine sehr hohe Accuracy erreichen, ohne die seltenen, aber wichtigen Fälle wie Betrug überhaupt zu erkennen. Deshalb braucht man zusätzlich Recall, Precision oder den F1-Score, die genau auf die seltene Klasse schauen."}, {"id": "A12.vq.NZ_1igUIcoI.abc", "t": "abc", "abruf": 1, "vid": "NZ_1igUIcoI", "vq": "nach", "m": ["Accuracy", "Betrug", "Confusion Matrix", "F1-Score", "Fehlertyp 1", "Klassifizierung", "Precision", "Recall", "Sensitivität", "Specificity", "Testdatensatz", "Trainingsdatensatz", "True Positive"], "q": "ABC-Liste zu «Fehler-/Konfusionsmatrix einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A12.vq.NZ_1igUIcoI.kawa", "t": "kawa", "abruf": 1, "vid": "NZ_1igUIcoI", "vq": "nach", "wort": "PRECISION", "m": ["P: Precision gibt an, wie viele der positiv vorhergesagten Fälle wirklich positiv sind.", "R: Recall (Sensitivität) misst, wie viele echte positive Fälle erkannt wurden.", "E: Ein Trade-off besteht meist zwischen Precision und Recall.", "C: Confusion Matrix ordnet Vorhersage und Realität in vier Felder.", "I: Irrtümlich positiv eingestufte Fälle heissen False Positive (Fehlertyp 1).", "S: Specificity zeigt, wie viele echte negative Fälle korrekt erkannt wurden.", "O: Optimierung auf die richtige Metrik hängt vom Ziel ab, z.B. Spam oder Krankheit.", "N: Negative Fälle korrekt zu erkennen heisst True Negative."], "q": "KaWa zu «PRECISION»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A12.0", "t": "num", "q": "Ein Modell meldet 40 Teile als defekt. 30 davon sind wirklich defekt. Wie hoch ist die Präzision in Prozent?", "r": 75, "tol": 0, "u": "%", "e": "Präzision = richtige Alarme ÷ alle Alarme = 30 ÷ 40 = 75 %. Frage dahinter: Wie vielen Alarmen kann ich trauen?"}, {"id": "A12.1", "t": "num", "q": "Im selben Test gab es insgesamt 50 wirklich defekte Teile, das Modell fand 30. Wie hoch ist der Recall in Prozent?", "r": 60, "tol": 0, "u": "%", "e": "Recall (Trefferquote, Sensitivität) = gefundene ÷ alle echten = 30 ÷ 50 = 60 %. Frage dahinter: Wie viele rutschen mir durch?"}, {"id": "A12.2", "t": "mc", "q": "Sicherheitsrelevantes Bauteil: Ein übersehener Defekt kann Menschen gefährden, ein Fehlalarm kostet 2 Franken Nachprüfung. Welche Kennzahl ist wichtiger?", "a": ["Präzision", "Recall", "Genauigkeit (Accuracy)", "Antwortzeit"], "r": 1, "e": "Wenn Übersehen teuer ist, zählt Recall. Wenn Fehlalarme teuer sind (z.B. Kunden fälschlich des Betrugs verdächtigen), zählt Präzision."}, {"id": "A12.3", "t": "mc", "q": "Nur 1 % der Teile ist defekt. Ein Modell sagt immer «gut». Wie hoch ist seine Genauigkeit?", "a": ["1 %", "50 %", "99 %", "0 %"], "r": 2, "e": "99 % richtig und völlig nutzlos. Bei seltenen Ereignissen ist Accuracy irreführend, darum Präzision und Recall."}, {"id": "A12.4", "t": "frei", "q": "Zeichne aus dem Kopf die Vier-Felder-Tafel und benenne die Felder.", "m": "Zeilen: tatsächlich positiv / tatsächlich negativ. Spalten: Modell sagt positiv / Modell sagt negativ. Felder: richtig positiv (Treffer), falsch negativ (übersehen), falsch positiv (Fehlalarm), richtig negativ. Präzision = RP ÷ (RP + FP). Recall = RP ÷ (RP + FN)."}], "videos": [{"id": "Kdsp6soqA7o", "kanal": "StatQuest with Josh Starmer", "titel": "Machine Learning Fundamentals: The Confusion Matrix", "dauer": "7:13"}, {"id": "bFdjGIdX4m4", "kanal": "InSy InSy", "titel": "Precision und Recall in 100 Sekunden", "dauer": "1:41"}, {"id": "NZ_1igUIcoI", "kanal": "KI Kosmos | Felix", "titel": "Fehler-/Konfusionsmatrix einfach erklärt", "dauer": "11:22"}], "pn": 7}, {"key": "A13", "titel": "API, REST und JSON", "warum": "Challenge 01 (Endpunkte) und 03 (JSON-Beispieldaten, Zwischenschicht).", "fragen": [{"id": "A13.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «API, REST und JSON»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Challenge 01 (Endpunkte) und 03 (JSON-Beispieldaten, Zwischenschicht). Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A13.vq.xpeQz7Hsfz0.vor0", "vid": "xpeQz7Hsfz0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Teile hat laut Video ein typischer REST-Request?", "a": ["zwei", "drei", "vier", "sieben"], "r": 2, "e": "Das Video zählt vier Teile eines Requests auf: Endpunkt, Parameter, HTTP-Methode und den Request-Body."}, {"id": "A13.vq.xpeQz7Hsfz0.vor1", "vid": "xpeQz7Hsfz0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was bedeutet ein Statuscode, der mit der Ziffer 5 beginnt, also zum Beispiel 500?", "a": ["alles war korrekt", "ein Fehler ist beim Server passiert", "ein Fehler ist beim Client, also bei uns, passiert", "die Anfrage wurde noch gar nicht bearbeitet"], "r": 1, "e": "Das Video erklärt, dass 5er-Statuscodes wie 500 einen Fehler auf der Server-Seite anzeigen, während 4er-Codes einen Fehler beim Client bedeuten."}, {"id": "A13.v.xpeQz7Hsfz0", "t": "frei", "abruf": 1, "vid": "xpeQz7Hsfz0", "vq": "nach", "q": "Video «REST API Einführung | Was ist eine REST-Schnittstelle?» (Coding Crashkurse): Was waren die Kernaussagen?", "m": "1. Eine REST-API ist eine standardisierte Schnittstelle zwischen Client und Server, bei der derselbe Input immer auf denselben Output abgebildet wird, was die Architektur gut erweiterbar und skalierbar macht. 2. Eine Anfrage besteht aus einem Endpunkt, der HTTP-Operation (Post, Get, Put oder Delete fuer die vier CRUD-Grundoperationen), einem Request Body mit den zu uebertragenden Daten und optional einem Token zur Authentifizierung. 3. Der Server antwortet mit einem Statuscode, wobei 200er-Codes Erfolg bedeuten, 400er-Codes einen Fehler beim Client anzeigen und 500er-Codes einen Fehler beim Server anzeigen."}, {"id": "A13.vq.xpeQz7Hsfz0.nach0", "vid": "xpeQz7Hsfz0", "vq": "nach", "t": "mc", "q": "Welche HTTP-Methode wird laut Video benutzt, um ein neues Produkt in den Webshop einzustellen?", "a": ["GET", "POST", "DELETE", "PUT"], "r": 1, "e": "Das Video zeigt, dass POST verwendet wird, um mit einem Request-Body neue Daten wie ein neues Produkt anzulegen."}, {"id": "A13.vq.xpeQz7Hsfz0.nach1", "vid": "xpeQz7Hsfz0", "vq": "nach", "t": "ms", "q": "Welche zwei Aussagen über eine REST-API sind laut Video richtig?", "a": ["derselbe Input führt immer zum gleichen Output", "eine REST-API speichert den Zustand des letzten Requests in einer Variable", "REST steht für Representational State Transfer", "eine REST-API kann nur von einer einzigen Instanz beantwortet werden"], "r": [0, 2], "e": "Das Video betont die Zustandslosigkeit (gleicher Input, gleicher Output) und erklärt, dass REST für Representational State Transfer steht."}, {"id": "A13.vq.xpeQz7Hsfz0.nach2", "vid": "xpeQz7Hsfz0", "vq": "nach", "t": "ord", "q": "Bringe den Ablauf eines Update-Requests (PUT) laut Video in die richtige Reihenfolge.", "a": ["Client sendet die geänderten Daten mit der Produkt-ID an den Endpunkt", "Server validiert die gesendeten Daten", "Server aktualisiert den Eintrag in der Datenbank", "Server schickt eine Antwort mit Statusmeldung zurück"], "e": "Das Video beschreibt bei Update-Requests genau diese Reihenfolge: Daten senden, validieren, in der Datenbank ändern, Antwort zurückschicken."}, {"id": "A13.vq.xpeQz7Hsfz0.nach3", "vid": "xpeQz7Hsfz0", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen jemandem ohne Vorwissen, was eine REST-API macht und wozu Statuscodes wie 200 oder 404 gut sind.", "m": "Eine REST-API ist eine standardisierte Schnittstelle, über die ein Client, zum Beispiel eine App, Daten von einem Server abrufen, anlegen, ändern oder löschen kann. Dafür schickt der Client eine Anfrage an einen bestimmten Endpunkt mit einer Methode wie GET oder POST. Der Statuscode in der Antwort zeigt sofort, ob alles geklappt hat, also 200, oder ob ein Fehler beim Client oder beim Server aufgetreten ist."}, {"id": "A13.vq.xpeQz7Hsfz0.abc", "t": "abc", "abruf": 1, "vid": "xpeQz7Hsfz0", "vq": "nach", "m": ["API", "Client", "DELETE", "Endpunkt", "GET", "Parameter", "POST", "Request Body", "REST", "Server", "Statuscode", "Token"], "q": "ABC-Liste zu «REST API Einführung | Was ist eine REST-Schnittstelle?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A13.vq.xpeQz7Hsfz0.kawa", "t": "kawa", "abruf": 1, "vid": "xpeQz7Hsfz0", "vq": "nach", "wort": "REST", "m": ["R: Request: enthält Endpunkt, Parameter, Methode und Body", "E: Endpunkt: der Teil der URL, an den die Anfrage geht", "S: Statuscode: dreistellige Zahl, die den Erfolg oder Fehler einer Anfrage zeigt", "T: Token: authentifiziert den Client gegenüber dem Server"], "q": "KaWa zu «REST»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A13.vq.unXWk2plEoc.vor0", "vid": "unXWk2plEoc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht die Abkürzung JSON?", "a": ["Java Simple Object Network", "JavaScript Object Notation", "Joint System Output Node", "Java Structured Online Notes"], "r": 1, "e": "JSON steht laut Video für JavaScript Object Notation, eine Beschreibungssprache für Informationen."}, {"id": "A13.vq.unXWk2plEoc.vor1", "vid": "unXWk2plEoc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Womit vergleicht das Video eine JSON-Datei am Anfang, um die Grundidee zu erklären?", "a": ["Mit einem Kochrezept", "Mit einer To-do-Liste am Badezimmerspiegel", "Mit einer Steuererklärung", "Mit einem Liebesbrief"], "r": 1, "e": "Das Video nutzt den Zettel mit der To-do-Liste am Spiegel als anschauliches Beispiel für strukturierte Information."}, {"id": "A13.v.unXWk2plEoc", "t": "frei", "abruf": 1, "vid": "unXWk2plEoc", "vq": "nach", "q": "Video «JSON in 5 Minuten» (Vibe Venture - KI & Code): Was waren die Kernaussagen?", "m": "1. JSON ist ein standardisiertes Textformat, um strukturierte Informationen zwischen Computern auszutauschen, und loest das Problem, dass ein selbst erfundenes Dateiformat nur vom eigenen Programm verstanden wird. 2. Ein JSON-Objekt wird mit geschweiften Klammern beschrieben und besteht aus Eigenschaften mit Werten, die durch einen Doppelpunkt getrennt sind, waehrend Listen mit eckigen Klammern dargestellt und mehrere Eintraege durch Kommas getrennt werden. 3. Die gaengigsten Programmiersprachen bringen bereits fertige Funktionen mit, um JSON zu lesen (zum Beispiel JSON.parse) und zu schreiben (zum Beispiel JSON.stringify), was JSON zum weit verbreiteten Standard fuer Programmierschnittstellen von Google, Facebook oder YouTube gemacht hat."}, {"id": "A13.vq.unXWk2plEoc.nach0", "vid": "unXWk2plEoc", "vq": "nach", "t": "mc", "q": "Womit werden Objekte in JSON laut Video beschrieben?", "a": ["Mit runden Klammern", "Mit geschweiften Klammern", "Mit eckigen Klammern", "Mit spitzen Klammern"], "r": 1, "e": "Das Video zeigt, dass Objekte in JSON mit geschweiften Klammern dargestellt werden, Listen dagegen mit eckigen Klammern."}, {"id": "A13.vq.unXWk2plEoc.nach1", "vid": "unXWk2plEoc", "vq": "nach", "t": "ms", "q": "Welche zwei Funktionen nennt das Video, um in JavaScript mit JSON zu arbeiten?", "a": ["JSON.parse", "JSON.delete", "JSON.stringify", "JSON.render"], "r": [0, 2], "e": "Das Video nennt JSON.parse zum Erstellen eines Objekts aus Text und JSON.stringify zum Schreiben eines Objekts in Text."}, {"id": "A13.vq.unXWk2plEoc.nach2", "vid": "unXWk2plEoc", "vq": "nach", "t": "lueck", "q": "Texte müssen in JSON immer in ___ gesetzt werden.", "r": ["anfuehrungszeichen", "hochkommas"], "e": "Das Video weist ausdrücklich darauf hin, dass Textwerte in Anführungszeichen beziehungsweise Hochkommas stehen müssen."}, {"id": "A13.vq.unXWk2plEoc.nach3", "vid": "unXWk2plEoc", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Programmierkenntnisse, warum ein eigenes, selbst ausgedachtes Dateiformat für eine App schlechter ist als JSON zu verwenden.", "m": "Wenn man ein eigenes Format erfindet, muss man erst selbst Funktionen programmieren, die dieses Format lesen und schreiben können, und ausserdem versteht ausser der eigenen App niemand dieses Format. JSON ist dagegen ein weltweiter Standard, den die meisten Programmiersprachen und viele Anbieter wie Google oder Facebook bereits von sich aus lesen und schreiben können, was die Arbeit deutlich einfacher macht."}, {"id": "A13.vq.unXWk2plEoc.abc", "t": "abc", "abruf": 1, "vid": "unXWk2plEoc", "vq": "nach", "m": ["Doppelpunkt", "Eigenschaft", "Google Calendar", "JSON", "Klammer", "Komma", "Liste", "Objekt", "Standardformat", "String", "Textdatei", "Wahrheitswert"], "q": "ABC-Liste zu «JSON in 5 Minuten»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A13.vq.unXWk2plEoc.kawa", "t": "kawa", "abruf": 1, "vid": "unXWk2plEoc", "vq": "nach", "wort": "JSON", "m": ["J: JavaScript Object Notation ist die volle Bezeichnung von JSON", "S: String-Werte werden in JSON immer in Anführungszeichen gesetzt", "O: Objekte werden in JSON mit geschweiften Klammern beschrieben", "N: Name und Wert werden bei jeder Eigenschaf
