<!DOCTYPE html>

<style>
:root{--ak:#e8761a;--bg:#f6f4f1;--k:#fff;--t:#1a1a1a;--g:#1f8a4c;--r:#c0392b;--l:#ddd}
@media(prefers-color-scheme:dark){:root{--bg:#16181b;--k:#22262b;--t:#eee;--l:#3a3f46}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:820px;margin:0 auto;padding:16px}h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:26px 0 8px;border-bottom:3px solid var(--ak);padding-bottom:4px}
.k{background:var(--k);border:1px solid var(--l);border-radius:10px;padding:14px 16px;margin:10px 0}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--l);background:var(--k);color:var(--t);cursor:pointer}
button.p{background:var(--ak);border-color:var(--ak);color:#fff;font-weight:bold}button:disabled{opacity:.5;cursor:default}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.ok{border-color:var(--g);background:#1f8a4c22}.opt.no{border-color:var(--r);background:#c0392b22}.opt.sel{border-color:var(--ak);background:#e8761a22}
.thema{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.thema b{flex:1 1 240px}
.bar{height:6px;background:var(--l);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g)}
.kl{font-size:13px;opacity:.75}.vid a{color:var(--ak);text-decoration:none;display:block;font-size:14px;margin:2px 0}
input[type=text],textarea{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--l);background:var(--bg);color:var(--t)}textarea{min-height:110px}
.e{border-left:4px solid var(--ak);padding:8px 12px;margin:12px 0;background:#e8761a14}.ok-t{color:var(--g);font-weight:bold}.no-t{color:var(--r);font-weight:bold}
.zeile{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ord{display:flex;gap:6px;align-items:center;margin:6px 0}.ord span{flex:1;padding:8px 10px;border:1px solid var(--l);border-radius:8px;background:var(--k)}.ord button{padding:4px 10px}
.modi{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.modi .k{margin:0}.uhr{font-weight:bold;color:var(--ak)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}td,th{border-bottom:1px solid var(--l);padding:5px 6px;text-align:left}
</style></head><body><main id="app"></main>
<script>
const DATEN = [{"kz": "A", "titel": "KI-Technik verstehen", "themen": [{"key": "A1", "titel": "Wie ein Sprachmodell funktioniert", "warum": "Grundlage für alles: Es schätzt das nächste Wort, es weiss nichts.", "fragen": [{"id": "A1.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Wie ein Sprachmodell funktioniert»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Grundlage für alles: Es schätzt das nächste Wort, es weiss nichts. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A1.vq.LPZh9BOjkQs.vor0", "vid": "LPZh9BOjkQs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie lange müsste ein Mensch am Stück Tag und Nacht lesen, um den Trainingstext von GPT-3 zu schaffen?", "a": ["26 Jahre", "260 Jahre", "2600 Jahre", "26000 Jahre"], "r": 2, "e": "Das Video nennt über 2600 Jahre als Lesezeit für die Trainingsdaten von GPT-3."}, {"id": "A1.vq.LPZh9BOjkQs.vor1", "vid": "LPZh9BOjkQs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Seit welchem Jahr gibt es den Transformer, die Technik hinter modernen Sprachmodellen?", "a": ["1997", "2007", "2017", "2022"], "r": 2, "e": "Ein Team bei Google stellte den Transformer laut Video 2017 vor."}, {"id": "A1.v.LPZh9BOjkQs", "t": "frei", "abruf": 1, "vid": "LPZh9BOjkQs", "vq": "nach", "q": "Video «Grosse Sprachmodelle kurz erklärt» (3Blue1Brown): Was waren die Kernaussagen?", "m": "1. Ein grosses Sprachmodell ist eine mathematische Funktion, die für einen gegebenen Text eine Wahrscheinlichkeit für jedes mögliche nächste Wort berechnet, statt ein einzelnes Wort sicher vorherzusagen. 2. Die Milliarden Parameter des Modells werden beim Pretraining nicht von Menschen gesetzt, sondern starten zufällig und werden per Backpropagation über Billionen Textbeispiele so angepasst, dass das tatsächlich folgende Wort wahrscheinlicher wird. 3. Nach dem Pretraining lernt das Modell in einer zweiten Phase namens Reinforcement Learning with Human Feedback anhand menschlicher Korrekturen, sich wie ein hilfreicher Assistent statt wie ein reiner Text-Vervollständiger zu verhalten."}, {"id": "A1.vq.LPZh9BOjkQs.nach0", "vid": "LPZh9BOjkQs", "vq": "nach", "t": "mc", "q": "Was macht ein Sprachmodell technisch, wenn es einen Text vervollständigt?", "a": ["Es versteht die Bedeutung wie ein Mensch", "Es kopiert passende Sätze aus dem Internet", "Es berechnet Wahrscheinlichkeiten für das nächste Wort", "Es sucht die exakte Antwort in einer Datenbank"], "r": 2, "e": "Laut Video ist ein Sprachmodell eine Funktion, die für jedes mögliche nächste Wort eine Wahrscheinlichkeit berechnet."}, {"id": "A1.vq.LPZh9BOjkQs.nach1", "vid": "LPZh9BOjkQs", "vq": "nach", "t": "ms", "q": "Welche zwei Trainingsschritte durchläuft ein Chatbot laut Video?", "a": ["Pretraining, also Wortvorhersage auf Internettext", "Reinforcement Learning mit menschlichem Feedback", "Automatische Rechtschreibprüfung durch Menschen", "Automatische Übersetzung in alle Sprachen"], "r": [0, 1], "e": "Nach dem Pretraining folgt laut Video das Reinforcement Learning with Human Feedback, um das Modell hilfreicher zu machen."}, {"id": "A1.vq.LPZh9BOjkQs.nach2", "vid": "LPZh9BOjkQs", "vq": "nach", "t": "ord", "q": "Bringe die Schritte im Transformer laut Video in die richtige Reihenfolge.", "a": ["Jedes Wort wird in eine Liste von Zahlen umgewandelt", "Attention lässt die Wortvektoren sich gegenseitig beeinflussen", "Ein Feedforward-Netzwerk verarbeitet die Information weiter", "Am Ende entsteht eine Wahrscheinlichkeit für das nächste Wort"], "e": "Das Video beschreibt genau diesen Ablauf: Vektorbildung, Attention, Feedforward-Netzwerk, Vorhersage."}, {"id": "A1.vq.LPZh9BOjkQs.nach3", "vid": "LPZh9BOjkQs", "vq": "nach", "t": "lueck", "q": "Der Algorithmus, mit dem die Parameter anhand von Beispieltexten angepasst werden, heisst ___.", "r": ["backpropagation"], "e": "Backpropagation vergleicht die Vorhersage mit dem echten Wort und passt die Parameter entsprechend an."}, {"id": "A1.vq.LPZh9BOjkQs.nach4", "vid": "LPZh9BOjkQs", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum ein Sprachmodell laut Video 'nichts weiss', obwohl es kluge Antworten geben kann.", "m": "Ein Sprachmodell hat keine echten Fakten gespeichert, sondern nur Wahrscheinlichkeiten dafür gelernt, welches Wort auf ein anderes folgt. Seine Antworten wirken klug, weil das Muster aus riesigen Textmengen stammt, aber es versteht den Inhalt nicht wie ein Mensch."}, {"id": "A1.vq.LPZh9BOjkQs.abc", "t": "abc", "abruf": 1, "vid": "LPZh9BOjkQs", "vq": "nach", "m": ["Attention", "Backpropagation", "Chatbot", "Feedforward", "Gewichte", "GPU", "Parameter", "Pretraining", "Reinforcement Learning", "Transformer", "Vektor", "Wahrscheinlichkeit"], "q": "ABC-Liste zu «Grosse Sprachmodelle kurz erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A1.vq.LPZh9BOjkQs.kawa", "t": "kawa", "abruf": 1, "vid": "LPZh9BOjkQs", "vq": "nach", "wort": "PARAMETER", "m": ["P: Parameter: die Werte, die das Verhalten des Modells festlegen", "A: Attention: lässt die Wortvektoren sich gegenseitig beeinflussen", "R: RLHF: Reinforcement Learning with Human Feedback verfeinert das Modell", "M: Milliarden: das Modell hat hunderte Milliarden Parameter", "E: Emergenz: das Verhalten entsteht, ohne dass es jemand so programmiert hat", "T: Transformer: verarbeitet Text seit 2017 parallel statt Wort für Wort"], "q": "KaWa zu «PARAMETER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A1.vq.SLcAtQQ483Y.vor0", "vid": "SLcAtQQ483Y", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Dimensionen können die Zahlen-Vektoren haben, mit denen ein Sprachmodell intern rechnet?", "a": ["etwa 3", "etwa 100", "mehr als 10'000", "genau 1'000"], "r": 2, "e": "Das Video sagt, die Vektoren beschreiben oft Punkte mit mehr als 10'000 Dimensionen."}, {"id": "A1.vq.SLcAtQQ483Y.vor1", "vid": "SLcAtQQ483Y", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie unterscheidet ein Sprachmodell, ob mit Bank ein Geldinstitut oder eine Sitzbank gemeint ist?", "a": ["Es fragt aktiv nach", "Es nutzt den Kontext des restlichen Satzes", "Es wählt zufällig", "Es kennt nur eine Bedeutung"], "r": 1, "e": "Das Modell erkennt Stichwörter wie finanzieren und Immobilie im Kontext und schliesst daraus, welche Bedeutung gemeint ist."}, {"id": "A1.v.SLcAtQQ483Y", "t": "frei", "abruf": 1, "vid": "SLcAtQQ483Y", "vq": "nach", "q": "Video «So funktioniert ChatGPT | Large Language Modelle einfach erklärt» (Digitale Profis): Was waren die Kernaussagen?", "m": "1. Ein Sprachmodell speichert während des Trainings keine Fakten wörtlich ab, sondern lernt statistische Zusammenhänge zwischen Wörtern, etwa dass Italien und Rom im Kontext von Hauptstadt häufig zusammen auftauchen. 2. Die Antwortstruktur der KI orientiert sich am Aufbau der gestellten Frage, weil das Modell im Kern wie eine erweiterte Autocomplete-Funktion funktioniert, die aber den gesamten bisherigen Kontext statt nur des letzten Wortes einbezieht. 3. Sprachmodelle nutzen den Kontext eines Satzes, um mehrdeutige Wörter wie Bank richtig einzuordnen, etwa ob damit ein Finanzinstitut oder eine Sitzbank gemeint ist."}, {"id": "A1.vq.SLcAtQQ483Y.nach0", "vid": "SLcAtQQ483Y", "vq": "nach", "t": "mc", "q": "Womit vergleicht das Video die Arbeitsweise eines Sprachmodells?", "a": ["Mit einem Taschenrechner", "Mit der Autocomplete-Funktion des Handys", "Mit einem Lexikon", "Mit einem Zufallsgenerator"], "r": 1, "e": "Das Sprachmodell sagt wie eine Autocomplete-Funktion das nächste Wort voraus, bezieht aber den gesamten Kontext ein statt nur des letzten Wortes."}, {"id": "A1.vq.SLcAtQQ483Y.nach1", "vid": "SLcAtQQ483Y", "vq": "nach", "t": "ms", "q": "Welche zwei Datenquellen nennt das Video als Trainingsmaterial für Sprachmodelle?", "a": ["Wikipedia-Artikel", "Persönliche E-Mails der Nutzer", "Foren wie Reddit", "Geheime Regierungsdokumente"], "r": [0, 2], "e": "Das Video nennt Wikipedia als hochwertige Quelle und Reddit als Beispiel für ungefilterte, umgangssprachliche Trainingsdaten."}, {"id": "A1.vq.SLcAtQQ483Y.nach2", "vid": "SLcAtQQ483Y", "vq": "nach", "t": "lueck", "q": "Ein Sprachmodell weiss laut Video nichts, es schätzt nur das nächste ___.", "r": ["wort"], "e": "Genau das ist die Kernaussage des Videos: das Modell sagt das nächste Wort anhand gelernter Muster voraus."}, {"id": "A1.vq.SLcAtQQ483Y.nach3", "vid": "SLcAtQQ483Y", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, warum ein Sprachmodell bei der Frage nach der Hauptstadt von Italien fast immer richtig antwortet, obwohl es laut Video eigentlich nur Wörter vorhersagt.", "m": "Das Modell hat in seinen Trainingsdaten sehr oft gelesen, dass die Wörter Italien, Hauptstadt und Rom nah beieinander stehen, zum Beispiel in Wikipedia-Tabellen. Deshalb ist die Wahrscheinlichkeit für Rom als nächstes Wort extrem hoch. Es weiss die Antwort also nicht wirklich, sondern hat das Muster besonders zuverlässig gelernt."}, {"id": "A1.vq.SLcAtQQ483Y.abc", "t": "abc", "abruf": 1, "vid": "SLcAtQQ483Y", "vq": "nach", "m": ["Autocomplete", "Bank", "Chatbot", "Dimension", "GPT", "Hauptstadt", "Kontext", "Large Language Model", "Muster", "Reddit", "Sprachmodell", "Vektor", "Wahrscheinlichkeit", "Wikipedia"], "q": "ABC-Liste zu «So funktioniert ChatGPT | Large Language Modelle einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A1.vq.SLcAtQQ483Y.kawa", "t": "kawa", "abruf": 1, "vid": "SLcAtQQ483Y", "vq": "nach", "wort": "MUSTER", "m": ["M: Modell: sagt nur das nächste Wort voraus, kennt aber Muster in der Sprache", "U: Unmenge an Daten: Bücher, Wikipedia und Foren trainieren das Modell", "S: Sprachmodell: die Technologie hinter Chatbots wie ChatGPT", "T: Trainingsdaten: enthalten öffentliche Texte und Wissensdatenbanken", "E: Erkennt Zusammenhänge zwischen Wörtern wie Fussball und Tor", "R: Rom: das Modell verknüpft Italien und Hauptstadt fast automatisch mit Rom"], "q": "KaWa zu «MUSTER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A1.vq.zjkBMFhNj_g.vor0", "vid": "zjkBMFhNj_g", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Dateien braucht es, um das Sprachmodell Llama 2 70B auf einem Laptop laufen zu lassen, ganz ohne Internet?", "a": ["Nur eine einzige Datei", "Zwei Dateien: Parameter und Programmcode", "Etwa zehn verschiedene Programme", "Ein ganzes Rechenzentrum"], "r": 1, "e": "Das Video sagt ausdrücklich, ein grosses Sprachmodell besteht nur aus zwei Dateien: der Parameterdatei und dem Run-Code."}, {"id": "A1.vq.zjkBMFhNj_g.vor1", "vid": "zjkBMFhNj_g", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie gross ist ungefähr die Datei mit den 70 Milliarden Parametern von Llama 2?", "a": ["14 Megabyte", "1,4 Gigabyte", "140 Gigabyte", "14 Terabyte"], "r": 2, "e": "70 Milliarden Parameter mal 2 Byte pro Parameter (float16) ergeben laut Video etwa 140 Gigabyte."}, {"id": "A1.v.zjkBMFhNj_g", "t": "frei", "abruf": 1, "vid": "zjkBMFhNj_g", "vq": "nach", "q": "Video «[1hr Talk] Intro to Large Language Models» (Andrej Karpathy): Was waren die Kernaussagen?", "m": "1. Ein grosses Sprachmodell besteht im Kern nur aus zwei Dateien, den trainierten Parametern und einem vergleichsweise kurzen Programm, das diese Parameter ausführt, während die eigentliche Rechenleistung ins Training und nicht in den Betrieb fliesst. 2. Das Modell wird trainiert, indem es aus einem riesigen Textkorpus lernt, das jeweils nächste Wort vorherzusagen, wobei allein die Trainingsrechenleistung der grössten Modelle einem Vielfachen von hundert Millionen Jahren an Ein-Milliarden-Operationen-pro-Sekunde entspricht. 3. Sprachmodelle können durch Techniken wie Retrieval, Taschenrechner-Aufrufe oder Code-Ausführung erweitert werden, bleiben aber anfällig für Angriffe wie Prompt Injection, Jailbreaks und Data Poisoning, gegen die es laufend neue Abwehrmechanismen braucht."}, {"id": "A1.vq.zjkBMFhNj_g.nach0", "vid": "zjkBMFhNj_g", "vq": "nach", "t": "mc", "q": "Was steht laut Video in der Parameterdatei eines Sprachmodells wie Llama 2?", "a": ["Der Quellcode der Webseite", "Die Gewichte des neuronalen Netzes", "Die komplette Trainingsdatenbank", "Die Fragen der Nutzer"], "r": 1, "e": "Die Parameterdatei enthält die Gewichte des neuronalen Netzes, gespeichert als 2 Byte pro Parameter."}, {"id": "A1.vq.zjkBMFhNj_g.nach1", "vid": "zjkBMFhNj_g", "vq": "nach", "t": "ms", "q": "Welche zwei Werkzeuge nutzt ChatGPT im Video, um eine Aufgabe zu lösen, die es im Kopf nicht schafft?", "a": ["Bing-Suche", "Taschenrechner", "E-Mail-Programm", "Kalender-App"], "r": [0, 1], "e": "Für Recherche nutzt es die Bing-Suche, für Berechnungen einen Taschenrechner, weil das Modell selbst schlecht im Kopfrechnen ist."}, {"id": "A1.vq.zjkBMFhNj_g.nach2", "vid": "zjkBMFhNj_g", "vq": "nach", "t": "ord", "q": "Bringe den Ablauf in die richtige Reihenfolge, wie ChatGPT im Video die fehlenden Bewertungen ermittelt.", "a": ["ChatGPT erkennt, dass Kopfrechnen zu unsicher wäre", "Es ruft den Taschenrechner als Werkzeug auf", "Es berechnet die Verhältnisse aus den bekannten Runden C, D und E", "Es gibt die geschätzten Werte für Serie A und B aus"], "e": "Das Video zeigt genau diesen Ablauf: Erkenntnis der eigenen Schwäche, Werkzeugaufruf, Berechnung, Ausgabe."}, {"id": "A1.vq.zjkBMFhNj_g.nach3", "vid": "zjkBMFhNj_g", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, warum ein Sprachmodell laut Video nur das nächste Wort schätzt und trotzdem sinnvolle Antworten geben kann.", "m": "Ein Sprachmodell hat aus riesigen Textmengen gelernt, welches Wort statistisch am wahrscheinlichsten als nächstes folgt. Weil es dabei auch Zusammenhänge, Fakten und Sprachmuster mitgelernt hat, wirken die aneinandergereihten Vorhersagen wie ein sinnvoller Text. Es versteht die Welt also nicht wie ein Mensch, sondern rechnet Wahrscheinlichkeiten aus."}, {"id": "A1.vq.zjkBMFhNj_g.abc", "t": "abc", "abruf": 1, "vid": "zjkBMFhNj_g", "vq": "nach", "m": ["Architecture", "Backdoor", "Calculator", "Data poisoning", "Fine-tuning", "Inference", "Llama", "Meta AI", "Neural network", "Parameters", "Trigger word", "Weights"], "q": "ABC-Liste zu «[1hr Talk] Intro to Large Language Models»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A1.vq.zjkBMFhNj_g.kawa", "t": "kawa", "abruf": 1, "vid": "zjkBMFhNj_g", "vq": "nach", "wort": "LLAMA", "m": ["L: Llama 2: das offene Modell von Meta mit 70 Milliarden Parametern", "A: Architecture: Code im run-File, der die Parameter zum Leben erweckt", "M: MacBook: reicht laut Video, um das Modell offline laufen zu lassen"], "q": "KaWa zu «LLAMA»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A1.0", "t": "mc", "q": "Was tut ein Sprachmodell im Kern, wenn es antwortet?", "a": ["Es schlägt die Antwort in einer Datenbank nach", "Es berechnet Stück für Stück das wahrscheinlichste nächste Wort", "Es versteht die Frage wie ein Mensch und überlegt", "Es sucht im Internet nach der besten Quelle"], "r": 1, "e": "Ein LLM sagt Token für Token voraus, was wahrscheinlich folgt. Es weiss nichts, es schätzt. Daraus folgen Halluzinationen und die Notwendigkeit fester Regeln."}, {"id": "A1.1", "t": "ms", "q": "Welche zwei Aussagen über das Training stimmen?", "a": ["Beim Vortraining lernt das Modell aus riesigen Textmengen Wortfolgen vorherzusagen", "Das Modell kennt automatisch die internen Dokumente deiner Firma", "Durch Feedback von Menschen (RLHF) wird es hilfreicher und höflicher", "Nach dem Training lernt es aus jedem Chat dauerhaft dazu"], "r": [0, 2], "e": "Vortraining plus Feinabstimmung mit menschlichem Feedback. Firmendaten kennt es nicht, und ein Chat verändert die Gewichte nicht."}, {"id": "A1.2", "t": "lueck", "q": "Die Architektur hinter ChatGPT und Co. heisst ___ (das T in GPT).", "r": ["transformer", "transformers"], "e": "GPT = Generative Pre-trained Transformer. Der Aufmerksamkeits-Mechanismus (Attention) lässt jedes Wort auf alle anderen schauen."}, {"id": "A1.3", "t": "frei", "q": "Dein CEO fragt: «Warum weiss ChatGPT nichts über unsere Kunden, wenn es doch so schlau ist?» Antworte in drei Sätzen.", "m": "Das Modell hat nur aus öffentlichen Texten bis zu einem Stichtag gelernt, unsere internen Daten waren nie dabei. Es speichert kein Wissen wie eine Datenbank, sondern Wortwahrscheinlichkeiten. Wenn es unsere Kunden kennen soll, müssen wir ihm die passenden Dokumente bei jeder Frage mitgeben (RAG) und den Zugriff regeln."}, {"id": "A1.4", "t": "frei", "q": "Transfer: Eine Versicherung will Schadenmeldungen von einem Sprachmodell zusammenfassen UND die Auszahlung berechnen lassen. Was sagst du dazu?", "m": "Zusammenfassen ist eine Sprachaufgabe, das darf das Modell (mit Stichprobenkontrolle). Die Auszahlung ist Geld und Recht: Sie muss deterministisch nach festen Regeln berechnet werden, weil ein Sprachmodell schätzt und bei gleicher Eingabe verschieden antworten kann."}], "videos": [{"id": "LPZh9BOjkQs", "kanal": "3Blue1Brown", "titel": "Grosse Sprachmodelle kurz erklärt", "dauer": "7:58"}, {"id": "SLcAtQQ483Y", "kanal": "Digitale Profis", "titel": "So funktioniert ChatGPT | Large Language Modelle einfach erklärt", "dauer": "6:04"}, {"id": "5sLYAQS9sWQ", "kanal": "IBM Technology", "titel": "How Large Language Models Work", "dauer": "5:34"}, {"id": "zjkBMFhNj_g", "kanal": "Andrej Karpathy", "titel": "[1hr Talk] Intro to Large Language Models", "dauer": "59:48"}], "pn": 9}, {"key": "A2", "titel": "Token und Temperatur", "warum": "Warum dieselbe Frage zwei Antworten gibt, und was ein API-Aufruf kostet.", "fragen": [{"id": "A2.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Token und Temperatur»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Warum dieselbe Frage zwei Antworten gibt, und was ein API-Aufruf kostet. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A2.vq.jnikMver_CE.vor0", "vid": "jnikMver_CE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wenn ein Sprachmodell zweimal dieselbe Frage bekommt, wieso kann die Antwort unterschiedlich ausfallen?", "a": ["Weil das Modell zufällig aus den wahrscheinlichsten nächsten Tokens auswählt", "Weil sich das Modell zwischendurch neu trainiert", "Weil der Server jedes Mal eine andere Version lädt", "Weil die Frage bei der zweiten Eingabe automatisch verändert wird"], "r": 0, "e": "Das Modell sampelt den nächsten Token aus einer Wahrscheinlichkeitsverteilung, das Video erklärt genau das als Ursache für die Zufälligkeit."}, {"id": "A2.vq.jnikMver_CE.vor1", "vid": "jnikMver_CE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was macht ein LLM, wenn die Temperature nahe null gesetzt wird?", "a": ["Es wird kreativer und unvorhersehbarer", "Es wählt fast immer den wahrscheinlichsten nächsten Token, die Antwort wird deterministisch", "Es storniert die Anfrage", "Es verdoppelt die Tokenanzahl"], "r": 1, "e": "Eine Temperature nahe null macht laut Video die Verteilung so scharf, dass fast immer der Token mit dem höchsten Logit gewählt wird."}, {"id": "A2.v.jnikMver_CE", "t": "frei", "abruf": 1, "vid": "jnikMver_CE", "vq": "nach", "q": "Video «Was ist die Temperature bei LLMs?» (Under The Hood): Was waren die Kernaussagen?", "m": "1. Bei der Textgenerierung wählt greedy sampling immer das wahrscheinlichste nächste Token aus, was zu deterministischen, aber oft langweiligen und sich wiederholenden Antworten führt. 2. Die Temperatur skaliert die Logits vor der Softmax-Berechnung, wobei ein Wert nahe null die Antwort deterministischer und ein Wert über eins die Verteilung flacher und damit die Antwort zufälliger und kreativer macht. 3. Top-K-Sampling begrenzt die Auswahl auf eine feste Anzahl wahrscheinlichster Token, während Top-P-Sampling die Token dynamisch so lange sammelt, bis ihre kumulierte Wahrscheinlichkeit einen Schwellenwert wie 0,9 erreicht."}, {"id": "A2.vq.jnikMver_CE.nach0", "vid": "jnikMver_CE", "vq": "nach", "t": "mc", "q": "Wie heisst die Methode, bei der immer der Token mit der höchsten Wahrscheinlichkeit gewählt wird?", "a": ["Top-P Sampling", "Temperature Scaling", "Greedy Sampling", "Top-K Sampling"], "r": 2, "e": "Das Video nennt genau diese Methode Greedy Sampling, sie liefert immer dieselbe, aber oft langweilige Antwort."}, {"id": "A2.vq.jnikMver_CE.nach1", "vid": "jnikMver_CE", "vq": "nach", "t": "mc", "q": "Was macht Top-K Sampling mit einem K-Wert von fünf?", "a": ["Es begrenzt die Auswahl auf die fünf Tokens mit der höchsten Wahrscheinlichkeit", "Es erhöht die Temperature auf fünf", "Es wiederholt den Prompt fünfmal", "Es summiert die fünf letzten Antworten"], "r": 0, "e": "Top-K mit Wert fünf behält nur die fünf wahrscheinlichsten Tokens und verteilt die Wahrscheinlichkeiten neu."}, {"id": "A2.vq.jnikMver_CE.nach2", "vid": "jnikMver_CE", "vq": "nach", "t": "ms", "q": "Welche zwei Aussagen zu Top-P Sampling stimmen laut Video?", "a": ["Top-P sammelt Tokens, bis die kumulierte Wahrscheinlichkeit den Schwellenwert erreicht", "Ein Top-P-Wert von null entspricht Greedy Sampling", "Top-P funktioniert nur bei Temperature über zwei", "Top-P braucht immer genau zehn Tokens"], "r": [0, 1], "e": "Top-P wählt dynamisch Tokens, bis die Summe ihrer Wahrscheinlichkeit die Schwelle erreicht, und bei null bleibt nur der wahrscheinlichste Token, was Greedy Sampling entspricht."}, {"id": "A2.vq.jnikMver_CE.nach3", "vid": "jnikMver_CE", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten den Unterschied zwischen Top-K und Top-P Sampling, und wann laut Video eine hohe Temperature sinnvoll ist.", "m": "Top-K wählt immer eine feste Anzahl der wahrscheinlichsten Tokens aus, egal wie die Verteilung aussieht, während Top-P die Anzahl dynamisch anhand der aufsummierten Wahrscheinlichkeit bestimmt. Eine hohe Temperature eignet sich laut Video für kreative Aufgaben wie Geschichten, während für faktisches Schreiben eine niedrige Temperature besser ist."}, {"id": "A2.vq.jnikMver_CE.abc", "t": "abc", "abruf": 1, "vid": "jnikMver_CE", "vq": "nach", "m": ["Greedy", "Logits", "Nucleus", "Prompt", "Renormalisierung", "Sampling", "Softmax", "Temperature", "Token", "TopK", "TopP", "Wahrscheinlichkeit"], "q": "ABC-Liste zu «Was ist die Temperature bei LLMs?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A2.vq.jnikMver_CE.kawa", "t": "kawa", "abruf": 1, "vid": "jnikMver_CE", "vq": "nach", "wort": "TOKEN", "m": ["T: Temperature: steuert, wie zufällig der nächste Token gewählt wird", "O: Oben in der Verteilung liegt bei Greedy Sampling immer der wahrscheinlichste Token", "K: Kumulierte Wahrscheinlichkeit entscheidet bei Top-P, welche Tokens im Rennen bleiben", "E: Erst werden die Logits durch Softmax in Wahrscheinlichkeiten umgerechnet", "N: Nucleus Sampling ist ein anderer Name für Top-P Sampling"], "q": "KaWa zu «TOKEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A2.vq.OjrGu0L5K7M.vor0", "vid": "OjrGu0L5K7M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man die kleinste Informationseinheit, die ein KI-Modell verarbeitet?", "a": ["Bit", "Pixel", "Token", "Byte"], "r": 2, "e": "Ein Token ist laut Video die kleinste Einheit, die ein generatives KI-Modell verarbeitet."}, {"id": "A2.vq.OjrGu0L5K7M.vor1", "vid": "OjrGu0L5K7M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wovon hängt ab, wie viel du für eine Anfrage an ein KI-Modell bezahlst?", "a": ["Von der Tageszeit", "Von der Anzahl verwendeter Tokens", "Von der Bildschirmgrösse", "Von der Internetgeschwindigkeit"], "r": 1, "e": "Je mehr Input- und Output-Tokens genutzt werden, desto mehr wird verrechnet."}, {"id": "A2.v.OjrGu0L5K7M", "t": "frei", "abruf": 1, "vid": "OjrGu0L5K7M", "vq": "nach", "q": "Video «Was ist ein AI-Token? In 2 Minuten erklärt» (Azure Innovation Station): Was waren die Kernaussagen?", "m": "1. Ein Token ist die kleinste Verarbeitungseinheit eines generativen KI-Modells und kann je nach Modell ein ganzes Wort, ein Wortteil, ein Pixelmuster oder ein Audio-Fragment sein. 2. Beim Training legt das Modell die erkannten Muster in einem Vokabular für Text beziehungsweise einem vergleichbaren Speicher für Bild- und Audiomodelle ab und nennt diese Muster Token. 3. Sowohl die Input- als auch die Output-Token eines Aufrufs werden gezählt, und genau diese Zählung bestimmt, wie viel die Nutzung eines generativen Modells kostet."}, {"id": "A2.vq.OjrGu0L5K7M.nach0", "vid": "OjrGu0L5K7M", "vq": "nach", "t": "mc", "q": "Wo speichert ein grosses Sprachmodell die Muster, die es beim Training gelernt hat?", "a": ["Auf der Festplatte des Nutzers", "In einem Vokabular", "In der Cloud eines Drittanbieters", "Im Arbeitsspeicher der Grafikkarte"], "r": 1, "e": "Das Video nennt das gespeicherte Wissen eines Sprachmodells Vokabular, bei Bild- und Audiomodellen heisst es Cookbook."}, {"id": "A2.vq.OjrGu0L5K7M.nach1", "vid": "OjrGu0L5K7M", "vq": "nach", "t": "mc", "q": "Wovon hängt laut Video ab, wie teuer eine Anfrage an ein generatives KI-Modell ist?", "a": ["Von der Tageszeit der Anfrage", "Von der Anzahl der verwendeten Tokens", "Von der Sprache der Anfrage", "Von der Bildschirmauflösung"], "r": 1, "e": "Input- und Output-Tokens werden gezählt, und diese Zählung bestimmt die Kosten."}, {"id": "A2.vq.OjrGu0L5K7M.nach2", "vid": "OjrGu0L5K7M", "vq": "nach", "t": "ms", "q": "Welche zwei Datentypen nennt das Video als Beispiele, aus denen ein Modell Muster lernt?", "a": ["Text", "Wetterdaten", "Bilder", "Börsenkurse"], "r": [0, 2], "e": "Das Video nennt Text, Bilder und Audio als Trainingsdaten, aus denen Muster wie Wörter, Pixelgruppen oder Wellenformen entstehen."}, {"id": "A2.vq.OjrGu0L5K7M.nach3", "vid": "OjrGu0L5K7M", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, was ein Token ist und warum die Anzahl der Tokens für die Kosten einer KI-Anfrage wichtig ist.", "m": "Ein Token ist die kleinste Einheit, die ein KI-Modell verarbeitet, zum Beispiel ein Wortteil, eine Pixelgruppe oder ein Stück einer Audiowelle. Weil sowohl die Eingabe als auch die Ausgabe in Tokens gezählt werden, steigen die Kosten mit der Menge an verwendeten Tokens."}, {"id": "A2.vq.OjrGu0L5K7M.abc", "t": "abc", "abruf": 1, "vid": "OjrGu0L5K7M", "vq": "nach", "m": ["Audio", "Bild", "Cookbook", "Daten", "Eingabetoken", "Kosten", "Muster", "Output", "Pixel", "Text", "Vokabular", "Wahrscheinlichkeit"], "q": "ABC-Liste zu «Was ist ein AI-Token? In 2 Minuten erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A2.vq.OjrGu0L5K7M.kawa", "t": "kawa", "abruf": 1, "vid": "OjrGu0L5K7M", "vq": "nach", "wort": "KOSTEN", "m": ["K: Kosten steigen mit der Anzahl genutzter Tokens.", "O: Output-Tokens sind die vom Modell erzeugte Antwort.", "S: Sprachmodelle speichern ihr Wissen in einem Vokabular aus Tokens.", "T: Token ist die kleinste Einheit, die ein Modell verarbeitet.", "E: Eingabetokens sind die Informationen, die du dem Modell gibst.", "N: Nutzung von Tokens wird gezählt und bestimmt, was du bezahlst."], "q": "KaWa zu «KOSTEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A2.vq.n7OtblOSh6M.vor0", "vid": "n7OtblOSh6M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele verschiedene Tokens gibt es insgesamt, über alle Sprachen und Texte im Internet hinweg?", "a": ["nur ein paar hundert", "etwa 250'000", "mehrere Milliarden, wie es Wörter gibt", "für jede Sprache eine eigene unendliche Menge"], "r": 1, "e": "Das Video nennt rund 250'000. ACHTUNG: Eine universelle Tokenzahl gibt es nicht. Die Zahl ist die Vokabulargrösse eines bestimmten Tokenizers und hängt am Modell, etwa 100'277 bei GPT-4 und rund 200'000 bei GPT-4o. Der Kern stimmt trotzdem: Das Vokabular ist endlich und viel kleiner als die Zahl der Wörter."}, {"id": "A2.vq.n7OtblOSh6M.vor1", "vid": "n7OtblOSh6M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Braucht das ältere Modell GPT 3.5 Turbo für denselben Satz mehr oder weniger Tokens als das neuere GPT4o?", "a": ["weniger, weil es einfacher rechnet", "gleich viele, das macht keinen Unterschied", "mehr, weil einzelne Wörter wie Blumen in zwei Tokens zerlegt werden", "es benutzt gar keine Tokens"], "r": 2, "e": "Im Video zerlegt GPT 3.5 Turbo das Wort Blumen in die zwei Tokens BL und omen, wodurch der Satz insgesamt mehr Tokens braucht als bei GPT4o."}, {"id": "A2.v.n7OtblOSh6M", "t": "frei", "abruf": 1, "vid": "n7OtblOSh6M", "vq": "nach", "q": "Video «Wie deine PROMPTS Geld verbrennen! Tokens, Abos & API im Überblick» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Ein Tokenizer zerlegt Wörter nicht in ganze Wörter, sondern in Teilstücke, zum Beispiel wird das Wort Blumen bei GPT-3.5 Turbo in die zwei Tokens Bl und omen aufgeteilt. 2. Über alle Sprachen und Daten hinweg gibt es nur rund 250'000 verschiedene Tokens, wodurch Modelle diese begrenzte Menge an Zahlen gegeneinander verrechnen können, statt Milliarden Wörter direkt zu vergleichen. 3. Caching reduziert den Tokenverbrauch stark, weil bereits verarbeiteter Kontext beim nächsten Aufruf aus dem Cache gezogen werden kann, statt jedes Mal neu generiert zu werden."}, {"id": "A2.vq.n7OtblOSh6M.nach0", "vid": "n7OtblOSh6M", "vq": "nach", "t": "mc", "q": "Warum kann eine KI nicht einfach jedes Wort mit jedem anderen Wort vergleichen, wie es im Video am Beispiel der Bibliothek erklärt wird?", "a": ["Weil es zu wenige Wörter im Internet gibt", "Weil Wörter in praktisch unendlicher Zahl vorkommen, Tokens aber eine endliche Menge bilden, die man gegeneinander rechnen kann", "Weil Computer nur Bilder verarbeiten können", "Weil das Urheberrecht den Vergleich verbietet"], "r": 1, "e": "Das Video erklärt, dass Tokens genau deshalb erfunden wurden: sie machen aus einer riesigen Menge an Wörtern eine endliche, gegeneinander berechenbare Zahlenmenge."}, {"id": "A2.vq.n7OtblOSh6M.nach1", "vid": "n7OtblOSh6M", "vq": "nach", "t": "ms", "q": "Welche zwei Massnahmen nennt das Video, um den Tokenverbrauch zu senken?", "a": ["ein Caching verwenden, damit Inhalte nicht jedes Mal neu generiert werden müssen", "das Kontextfenster möglichst voll mit Informationen stopfen", "Limits und ein Budget für den Tokenverbrauch setzen", "den Computer öfter neu starten"], "r": [0, 2], "e": "Das Video nennt Caching, damit Inhalte nicht neu generiert werden, sowie das bewusste Setzen von Limits und einem Budget als Wege, den Tokenverbrauch zu steuern."}, {"id": "A2.vq.n7OtblOSh6M.nach2", "vid": "n7OtblOSh6M", "vq": "nach", "t": "lueck", "q": "Laut Anthropic wird ein Modell trotz grösserem Kontextfenster nicht automatisch ___.", "r": ["intelligenter", "schlauer"], "e": "Das Video erwähnt einen Artikel von Anthropic, wonach ein grösseres Kontextfenster die Intelligenz des Modells nicht automatisch verbessert."}, {"id": "A2.vq.n7OtblOSh6M.nach3", "vid": "n7OtblOSh6M", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie von Tokens gehört hat, in drei Sätzen, was ein Token ist und warum er beim Arbeiten mit KI wichtig ist.", "m": "Ein Token ist ein kleines Stück Text, oft nur ein Wortteil, in das eine KI jeden Satz zerlegt, um damit rechnen zu können. Je mehr Tokens ein Prompt oder eine Antwort braucht, desto mehr kostet die Anfrage und desto voller wird das Kontextfenster. Wer seinen Tokenverbrauch versteht, kann gezielter mit KI arbeiten und unnötige Kosten vermeiden."}, {"id": "A2.vq.n7OtblOSh6M.abc", "t": "abc", "abruf": 1, "vid": "n7OtblOSh6M", "vq": "nach", "m": ["Anthropic", "API", "Budget", "Cache", "GPT", "Inference", "Kontextfenster", "Modell", "Sprit", "Tacho", "Token", "Tokenizer"], "q": "ABC-Liste zu «Wie deine PROMPTS Geld verbrennen! Tokens, Abos & API im Überblick»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A2.vq.n7OtblOSh6M.kawa", "t": "kawa", "abruf": 1, "vid": "n7OtblOSh6M", "vq": "nach", "wort": "TOKEN", "m": ["T: Tacho: fehlte anfangs beim Auto, seither weiss man genau, was man verbraucht", "O: Optimieren: Anbieter optimieren den Tokenverbrauch, weil sie mehr Leistung brauchen", "K: Kontextfenster: je voller, desto teurer, aber nicht automatisch klüger", "E: Endliche Menge: nur rund 250'000 Tokens gibt es insgesamt", "N: Nachdenken (Inference): das Modell braucht beim Nachdenken zusätzliche Tokens"], "q": "KaWa zu «TOKEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A2.0", "t": "mc", "q": "Was ist ein Token?", "a": ["Ein Passwort für die API", "Ein Textstück (Wort oder Wortteil), in dem das Modell rechnet und nach dem abgerechnet wird", "Ein ganzer Satz", "Ein gespeicherter Chatverlauf"], "r": 1, "e": "Modelle zerlegen Text in Tokens. Kosten, Kontextfenster und Geschwindigkeit hängen an der Tokenzahl, nicht an der Wortzahl."}, {"id": "A2.1", "t": "mc", "q": "Du brauchst bei gleicher Eingabe möglichst immer dieselbe Ausgabe (z.B. Klassifikation von Tickets). Welche Temperatur?", "a": ["0 oder nahe 0", "0.7", "1.0", "2.0"], "r": 0, "e": "Tiefe Temperatur = das Modell nimmt fast immer das wahrscheinlichste Token, also reproduzierbarer. Hohe Temperatur = kreativer, aber streuender."}, {"id": "A2.2", "t": "num", "q": "Ein Wochenabruf verarbeitet 2'400 Tickets. Pro API-Aufruf passen 300 Tickets ins Kontextfenster. Wie viele Aufrufe braucht es?", "r": 8, "tol": 0, "u": "Aufrufe", "e": "2'400 ÷ 300 = 8. Solche Mengenrechnungen kommen in den Challenges vor: immer Rechenweg hinschreiben."}, {"id": "A2.3", "t": "frei", "q": "Erkläre einem Zehnjährigen, was die Temperatur bei einem Sprachmodell bewirkt.", "m": "Stell dir vor, das Modell würfelt das nächste Wort. Bei Temperatur null nimmt es immer das Wort, das am besten passt, also kommt fast immer derselbe Satz. Dreht man die Temperatur hoch, darf es auch mal ein ungewöhnliches Wort nehmen. Das ist lustig für Geschichten, aber schlecht für Rechnungen."}, {"id": "A2.4", "t": "frei", "q": "Transfer: Warum ist Temperatur 0 trotzdem KEINE Garantie für einen deterministischen Prozess?", "m": "Auch bei Temperatur 0 kann die Ausgabe leicht variieren (Modell-Updates des Anbieters, Rundung, andere Formulierung der Eingabe). Und gleich heisst nicht richtig: Ein Fehler wird dann einfach zuverlässig wiederholt. Alles mit Geld, Recht oder Sicherheit gehört darum in feste Regeln ausserhalb des Modells."}], "videos": [{"id": "jnikMver_CE", "kanal": "Under The Hood", "titel": "Was ist die Temperature bei LLMs?", "dauer": "9:46"}, {"id": "OjrGu0L5K7M", "kanal": "Azure Innovation Station", "titel": "Was ist ein AI-Token? In 2 Minuten erklärt", "dauer": "1:59"}, {"id": "n7OtblOSh6M", "kanal": "Christoph Magnussen", "titel": "Wie deine PROMPTS Geld verbrennen! Tokens, Abos & API im Überblick", "dauer": "27:43"}], "pn": 10}, {"key": "A3", "titel": "Prompts schreiben", "warum": "Nullserie Challenge 01: fehlende Information im Prompt erkennen.", "fragen": [{"id": "A3.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Prompts schreiben»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Nullserie Challenge 01: fehlende Information im Prompt erkennen. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A3.vq.hc5P2BLF25U.vor0", "vid": "hc5P2BLF25U", "vq": "vor", "t": "mc", "q": "Was glaubst du: In wie viele Hauptkategorien werden Prompts für Chatbots in diesem Video eingeteilt?", "a": ["Zwei", "Drei", "Vier", "Fünf"], "r": 1, "e": "Das Video nennt reduktive, transformative und generative Operationen als die drei Grundkategorien von Prompts."}, {"id": "A3.vq.hc5P2BLF25U.vor1", "vid": "hc5P2BLF25U", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was sollte man mit KI-Ergebnissen laut dem Video immer tun, bevor man sie weiterverwendet?", "a": ["Sie ungeprüft weiterverwenden", "Sie sorgfältig manuell prüfen", "Sie an eine zweite KI zur Kontrolle schicken", "Sie löschen und neu generieren lassen"], "r": 1, "e": "Das Video betont, dass man Ergebnisse selbst bei einfachen Aufgaben nie ohne manuelle Prüfung übernehmen sollte."}, {"id": "A3.v.hc5P2BLF25U", "t": "frei", "abruf": 1, "vid": "hc5P2BLF25U", "vq": "nach", "q": "Video «So schreibst Du effektive Prompts | Grundkurs Teil 1» (Digitale Profis): Was waren die Kernaussagen?", "m": "1. Reduktive Prompts fassen einen langen Text zusammen, filtern gezielt Informationen wie Namen oder Zahlen heraus oder entfernen unerwünschte Inhalte, ohne dass die KI etwas Neues hinzuerfindet. 2. Eine gute Zusammenfassung sollte laut Video mit klaren Vorgaben wie Wortlimit, geforderten Gliederungspunkten und Stichpunktform angefragt werden, damit die KI die wichtigsten Aussagen akkurat wiedergibt. 3. Mit Klassifizierungs- und Bewertungsprompts lässt sich Text nach vorgegebenen Kategorien wie positiv, neutral oder negativ einordnen oder nach einer Skala bewerten, inklusive einer Begründung für jede Einstufung."}, {"id": "A3.vq.hc5P2BLF25U.nach0", "vid": "hc5P2BLF25U", "vq": "nach", "t": "mc", "q": "Welche Aufgabe gehört laut Video zu einer reduktiven Prompt-Operation?", "a": ["Einen langen Text zusammenfassen", "Ein neues Gedicht erfinden", "Einen Text in eine andere Sprache übersetzen", "Ein Bild aus einem Text generieren"], "r": 0, "e": "Reduktive Prompts verkürzen oder filtern bestehenden Text, sie erzeugen keinen neuen Inhalt wie ein Gedicht oder ein Bild."}, {"id": "A3.vq.hc5P2BLF25U.nach1", "vid": "hc5P2BLF25U", "vq": "nach", "t": "ms", "q": "Welche zwei Prompt-Arten zählt das Video zu den reduktiven Operationen?", "a": ["Zusammenfassung", "Bildgenerierung", "Extraktion", "Musikkomposition"], "r": [0, 2], "e": "Zusammenfassung und Extraktion sind im Video genannte reduktive Operationen, Bildgenerierung und Musikkomposition kommen im Video nicht vor."}, {"id": "A3.vq.hc5P2BLF25U.nach2", "vid": "hc5P2BLF25U", "vq": "nach", "t": "lueck", "q": "Bei der ___ ordnet die KI einen Text ein, indem sie ihn charakterisiert oder kategorisiert.", "r": ["einordnung"], "e": "Das Video nennt genau diese Operation als Beschreibung oder Einordnung von Texten."}, {"id": "A3.vq.hc5P2BLF25U.nach3", "vid": "hc5P2BLF25U", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der ChatGPT noch nie genutzt hat, warum man für die Extraktion von Informationen manchmal eine KI statt einer normalen Wortsuche braucht.", "m": "Eine normale Wortsuche findet nur Begriffe, die man schon genau kennt. Wenn man aber zum Beispiel nicht weiss, wie alle beteiligten Personen in einem Bericht heissen, kann eine KI den ganzen Text verstehen und die passenden Namen trotzdem herausfiltern, auch ohne dass man vorher danach sucht."}, {"id": "A3.vq.hc5P2BLF25U.abc", "t": "abc", "abruf": 1, "vid": "hc5P2BLF25U", "vq": "nach", "m": ["Bewertung", "Chatbot", "Einordnung", "Extraktion", "Feedback", "Filtern", "Generativ", "Motivationsschreiben", "Prompt", "Reduktiv", "Transformativ", "Zusammenfassung"], "q": "ABC-Liste zu «So schreibst Du effektive Prompts | Grundkurs Teil 1»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A3.vq.hc5P2BLF25U.kawa", "t": "kawa", "abruf": 1, "vid": "hc5P2BLF25U", "vq": "nach", "wort": "PROMPT", "m": ["P: Prompt: die Anweisung, die wir der KI geben", "R: Reduktiv: Text kürzen oder den Kern herausfiltern", "O: Ordnen: die KI kategorisiert oder bewertet einen Text", "M: Manuell prüfen: Ergebnisse nie ungeprüft übernehmen", "T: Text zusammenfassen: Hauptaussagen kurz wiedergeben"], "q": "KaWa zu «PROMPT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A3.vq.rQtRNtyr0kI.vor0", "vid": "rQtRNtyr0kI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Bei welchen Modellen funktioniert Chain-of-Thought-Prompting laut Video besonders gut?", "a": ["Nur bei sehr kleinen Modellen", "Nur bei kostenlosen Modellen", "Eher bei grossen Modellen", "Bei allen Modellen exakt gleich"], "r": 2, "e": "Das Video erwähnt eine Studie, wonach Chain of Thought vor allem bei grösseren Modellen gut funktioniert."}, {"id": "A3.vq.rQtRNtyr0kI.vor1", "vid": "rQtRNtyr0kI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was hat laut Video den grössten Einfluss auf die Qualität deiner KI-Antworten?", "a": ["Die Tageszeit deiner Anfrage", "Deine Tippgeschwindigkeit", "Welches Modell du nutzt", "Die Länge deiner Frage in Wörtern"], "r": 2, "e": "Laut Video ist die Wahl des Modells die simpelste Frage mit dem grössten Einfluss auf das Ergebnis."}, {"id": "A3.v.rQtRNtyr0kI", "t": "frei", "abruf": 1, "vid": "rQtRNtyr0kI", "vq": "nach", "q": "Video «Prompt Engineering, Komplettkurs für Anfänger» (Fabian Rappert | Data Science Institute): Was waren die Kernaussagen?", "m": "1. Die Wahl des Sprachmodells hat laut Video den grössten Einfluss auf die Ergebnisqualität, weshalb man sich an aktuellen Benchmark-Vergleichen statt an einer fixen Empfehlung orientieren sollte. 2. Ein präziser Prompt sollte den Kontext der Anfrage, die Rolle des Nutzers und die Rolle des Modells klar benennen, weil dieselbe Frage je nach angenommener Rolle eine unterschiedlich tiefe Antwort verlangt. 3. Beim Chain-of-Thought-Prompting wird das Modell angeleitet, eine Aufgabe in einzelne Zwischenschritte zu zerlegen, was besonders bei grösseren Modellen die Qualität der Endantwort verbessern kann."}, {"id": "A3.vq.rQtRNtyr0kI.nach0", "vid": "rQtRNtyr0kI", "vq": "nach", "t": "mc", "q": "Wie findest du laut Video heraus, welches Modell aktuell für deinen Zweck am besten ist?", "a": ["Das teuerste verfügbare Modell nehmen", "Benchmarks googeln und Modelle anhand deines Anwendungsfalls vergleichen", "Immer bei einem einzigen Modell bleiben", "Einen Freund fragen und dessen Wahl übernehmen"], "r": 1, "e": "Das Video empfiehlt, aktuelle Benchmarks zu googeln und Modelle nach dem eigenen Anwendungsfall zu vergleichen."}, {"id": "A3.vq.rQtRNtyr0kI.nach1", "vid": "rQtRNtyr0kI", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge solltest du laut Video in einem Prompt klar machen, um präzisere Antworten zu bekommen?", "a": ["Die Rolle, die das Modell einnehmen soll", "Die Rolle, die du selbst einnimmst", "Die Uhrzeit deiner Anfrage", "Die Sprache deines Betriebssystems"], "r": [0, 1], "e": "Das Video nennt drei entscheidende Angaben: den Kontext, die eigene Rolle und die Rolle des Modells. Gefragt sind hier die beiden Rollen, der Kontext steht nicht zur Auswahl."}, {"id": "A3.vq.rQtRNtyr0kI.nach2", "vid": "rQtRNtyr0kI", "vq": "nach", "t": "lueck", "q": "Beim ___-Prompting bekommt das Modell zuerst ein paar Beispiele, bevor es die eigentliche Aufgabe lösen soll.", "r": ["few shot", "few-shot"], "e": "Few-Shot-Prompting gibt dem Modell Beispiele als Orientierung, bevor die eigentliche Frage kommt."}, {"id": "A3.vq.rQtRNtyr0kI.nach3", "vid": "rQtRNtyr0kI", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der KI noch nie genutzt hat, warum es sich lohnt, dem Modell eine Rolle wie 'Programmierlehrer' zu geben, statt einfach nur eine Frage zu stellen.", "m": "Wenn du dem Modell eine Rolle gibst, weiss es, auf welchem Niveau und in welchem Ton es antworten soll. Ein 'Programmierlehrer für Anfänger' erklärt einfacher als eine allgemeine Anfrage, weil die Rolle den Kontext und die erwartete Sprache klar festlegt."}, {"id": "A3.vq.rQtRNtyr0kI.abc", "t": "abc", "abruf": 1, "vid": "rQtRNtyr0kI", "vq": "nach", "m": ["Assistent", "Benchmark", "ChatGPT", "Few-Shot", "Gemini", "Halluzination", "Llama", "Mistral", "Prompt", "Rolle"], "q": "ABC-Liste zu «Prompt Engineering, Komplettkurs für Anfänger»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A3.vq.rQtRNtyr0kI.kawa", "t": "kawa", "abruf": 1, "vid": "rQtRNtyr0kI", "vq": "nach", "wort": "PROMPT", "m": ["P: Prompt: deine Anfrage an das Modell", "R: Rolle: definiere, wer du bist und wer das Modell sein soll", "O: Output: das Ergebnis, das du mit besseren Prompts verbessern willst", "M: Modell: wähle es anhand aktueller Benchmarks aus", "T: Tipps: klare Anweisungen verbessern das Ergebnis spürbar"], "q": "KaWa zu «PROMPT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A3.vq.h798fO1NkDw.vor0", "vid": "h798fO1NkDw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Kernbestandteile hat laut Video ein perfekter ChatGPT-Prompt?", "a": ["Zwei", "Drei", "Fünf", "Zehn"], "r": 2, "e": "Das Video nennt fünf Bestandteile: Aufgabe, Kontext, Beispiele, Rolle und Format."}, {"id": "A3.vq.h798fO1NkDw.vor1", "vid": "h798fO1NkDw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welcher Bestandteil eines Prompts darf laut Video niemals fehlen?", "a": ["Die Rolle", "Das Format", "Die Aufgabe", "Ein Beispiel"], "r": 2, "e": "Die Aufgabe ist die einzige Pflichtangabe, ohne sie weiss die KI nicht, was sie tun soll."}, {"id": "A3.v.h798fO1NkDw", "t": "frei", "abruf": 1, "vid": "h798fO1NkDw", "vq": "nach", "q": "Video «Prompts schreiben lernen in 10 Minuten» (Felicia Simon): Was waren die Kernaussagen?", "m": "1. Ein wirksamer Prompt besteht laut Video aus fünf Bausteinen in absteigender Wichtigkeit: der eigentlichen Aufgabe, dem Kontext, Beispielen, einer zugewiesenen Rolle und Vorgaben zum Antwortformat. 2. Ohne Kontext, etwa Angaben zu Zielgruppe, Ort oder Zweck eines Bildes, kann die KI eine Aufgabe zwar technisch ausführen, trifft aber selten das gewünschte Ergebnis. 3. Wird der KI nach einer ersten Antwort das selbst überarbeitete Endergebnis als Referenz zurückgegeben, orientiert sie sich bei künftigen Anfragen an diesem Beispiel und liefert bessere Texte."}, {"id": "A3.vq.h798fO1NkDw.nach0", "vid": "h798fO1NkDw", "vq": "nach", "t": "mc", "q": "Welche Frageart nennt das Video, um einem Prompt Kontext zu geben?", "a": ["Ja-Nein-Fragen", "W-Fragen wie wer, was, wann", "Multiple-Choice-Fragen", "Rhetorische Fragen"], "r": 1, "e": "Das Video schlägt W-Fragen wie wer, was, wann, wo, warum vor, um Kontext zu ergänzen."}, {"id": "A3.vq.h798fO1NkDw.nach1", "vid": "h798fO1NkDw", "vq": "nach", "t": "ord", "q": "Bringe die Prompt-Bestandteile in die Reihenfolge ihrer Wichtigkeit, wie im Video erklärt:", "a": ["Aufgabe", "Kontext", "Beispiele", "Rolle", "Format"], "e": "Das Video geht genau in dieser Reihenfolge von der wichtigsten zur am wenigsten wichtigen Ergänzung vor."}, {"id": "A3.vq.h798fO1NkDw.nach2", "vid": "h798fO1NkDw", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge empfiehlt das Video, um bei komplexen Aufgaben bessere Ergebnisse zu bekommen?", "a": ["Die Aufgabe in einzelne Schritte unterteilen", "Immer nur ein Wort als Prompt schreiben", "Die Schritte logisch sortieren", "Keine Beispiele verwenden"], "r": [0, 2], "e": "Bei komplexen Aufgaben soll man sie in Schritte zerlegen und diese logisch sortiert in den Prompt einbauen."}, {"id": "A3.vq.h798fO1NkDw.nach3", "vid": "h798fO1NkDw", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der ChatGPT noch nie genutzt hat, was der Unterschied zwischen der Aufgabe und der Rolle in einem Prompt ist.", "m": "Die Aufgabe sagt der KI, was sie tun soll, zum Beispiel einen Text schreiben oder ein Bild erstellen. Die Rolle sagt der KI, aus welcher Perspektive oder mit welchem Fachwissen sie das tun soll, zum Beispiel als IT-Expertin oder als zehnjähriges Kind. Die gleiche Aufgabe führt mit einer anderen Rolle zu einem ganz anderen Ergebnis."}, {"id": "A3.vq.h798fO1NkDw.abc", "t": "abc", "abruf": 1, "vid": "h798fO1NkDw", "vq": "nach", "m": ["Aufgabe", "Beispiele", "ChatGPT", "Format", "Gemini", "Kontext", "Perplexity", "Prompt", "Rolle", "Struktur", "Trends", "Zielgruppe"], "q": "ABC-Liste zu «Prompts schreiben lernen in 10 Minuten»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A3.vq.h798fO1NkDw.kawa", "t": "kawa", "abruf": 1, "vid": "h798fO1NkDw", "vq": "nach", "wort": "PROMPT", "m": ["P: Pflichtangabe: die Aufgabe darf in keinem Prompt fehlen", "R: Rolle: agiere als IT-Expertin verändert das Ergebnis stark", "O: Output-Format: legt fest, ob du eine Liste oder einen Blogbeitrag bekommst", "M: Multishot: mehrere Beispiele verbessern die Antwort spürbar", "T: Tipps für bessere Texte: das Endergebnis nochmal als Beispiel einfügen"], "q": "KaWa zu «PROMPT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A3.vq.8iBTrqnBy9w.vor0", "vid": "8iBTrqnBy9w", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele verschiedene KI-Modelle gibt es laut Video ungefähr?", "a": ["Etwa 100", "Etwa 10.000", "Etwa 1,8 Millionen", "Nur 5 grosse bekannte"], "r": 2, "e": "Das Video nennt 1,8 Millionen verschiedene KI-Modelle, deshalb verhält sich jedes Modell anders."}, {"id": "A3.vq.8iBTrqnBy9w.vor1", "vid": "8iBTrqnBy9w", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist laut Video mit dem sogenannten Schleimermodus bei einem Chatbot gemeint?", "a": ["Das Modell antwortet extrem langsam", "Das Modell bestätigt den Nutzer ständig, statt zu widersprechen", "Das Modell löscht den Chatverlauf automatisch", "Das Modell verlangt eine zusätzliche Bezahlung"], "r": 1, "e": "Der Schleimermodus beschreibt, dass Modelle begannen, Aussagen der Nutzer immer weiter zu bestätigen, statt sie zu hinterfragen."}, {"id": "A3.v.8iBTrqnBy9w", "t": "frei", "abruf": 1, "vid": "8iBTrqnBy9w", "vq": "nach", "q": "Video «Die größten Fehler beim Prompten und wie du sie vermeidest» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Magnussen erklärt, dass ein Prompt mehr als ein Satz sein sollte und Rolle, Perspektive sowie gewünschten Ton der KI explizit vorgeben muss, wie im Beispiel der Gehaltserhöhungs-E-Mail gezeigt. 2. Er zeigt den Trick, das Modell den eigenen, eingesprochenen Prompt zuerst selbst in Struktur und Aufbau verbessern zu lassen, bevor man ihn tatsächlich verwendet. 3. Anhand des New-York-Times-Falls warnt er vor Rabbit Holes und dem sogenannten Schleimermodus, bei dem ChatGPT, Claude und Gemini gleichermassen Nutzeraussagen unkritisch bestätigt haben."}, {"id": "A3.vq.8iBTrqnBy9w.nach0", "vid": "8iBTrqnBy9w", "vq": "nach", "t": "mc", "q": "Was ist laut Video der einfachste Trick, um einen Prompt zu verbessern?", "a": ["Den Prompt in einer anderen Sprache schreiben", "Das Modell selbst bitten, den Prompt in Struktur und Aufbau zu verbessern", "Den Prompt möglichst kurz halten", "Immer nur Fragen stellen, nie Befehle"], "r": 1, "e": "Man schreibt Aufgabe: Verbessere mir diesen Prompt in Struktur und Aufbau darüber und bekommt einen neuen, besser strukturierten Prompt."}, {"id": "A3.vq.8iBTrqnBy9w.nach1", "vid": "8iBTrqnBy9w", "vq": "nach", "t": "ms", "q": "Welche zwei Probleme nennt das Video im Zusammenhang mit schlechtem Prompten und Chatbots?", "a": ["Nutzer geraten in Rabbit Holes und glauben, eine Weltformel entdeckt zu haben", "Das Modell wird dadurch dauerhaft langsamer", "Kinder haben noch nicht das Korrektiv, um das richtig einzuordnen", "Der Chatbot verbraucht dadurch mehr Papier"], "r": [0, 2], "e": "Das Video nennt Fälle von Rabbit Holes bis zur vermeintlichen Weltformel und warnt, dass Kinder das Korrektiv dafür noch nicht haben."}, {"id": "A3.vq.8iBTrqnBy9w.nach2", "vid": "8iBTrqnBy9w", "vq": "nach", "t": "ord", "q": "Bringe den Prozess in die richtige Reihenfolge, wie man laut Video zu einem guten Prompt kommt.", "a": ["Überlegen, was man eigentlich erreichen will", "Prompt möglichst ausführlich formulieren inklusive Kontext", "Ergebnis mit der ursprünglichen Absicht vergleichen", "Prompt bei Bedarf anpassen und erneut versuchen"], "e": "Das Video beschreibt Prompten als iterativen Prozess: erst die Absicht klären, dann formulieren, dann prüfen und nachbessern."}, {"id": "A3.vq.8iBTrqnBy9w.nach3", "vid": "8iBTrqnBy9w", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie promptet hat, warum ein Prompt laut Video deutlich mehr als ein Satz sein sollte.", "m": "Ein Prompt ist wie ein Auftrag an eine neue Kollegin, die nichts über die Aufgabe weiss. Je genauer man Rolle, Ziel und Rahmenbedingungen beschreibt, desto besser kann das Modell die Erwartung treffen. Ein einzelner knapper Satz lässt dagegen zu viel Interpretationsspielraum."}, {"id": "A3.vq.8iBTrqnBy9w.abc", "t": "abc", "abruf": 1, "vid": "8iBTrqnBy9w", "vq": "nach", "m": ["Befehl", "Guardrails", "Iteration", "Kontext", "Modell", "Prompt", "Reasoning", "Rolle", "Struktur", "Token", "Weltformel", "Wild West"], "q": "ABC-Liste zu «Die größten Fehler beim Prompten und wie du sie vermeidest»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A3.vq.8iBTrqnBy9w.kawa", "t": "kawa", "abruf": 1, "vid": "8iBTrqnBy9w", "vq": "nach", "wort": "PROMPT", "m": ["P: Prompt: der Befehl, den du in das Chatfenster eintippst", "R: Rolle: definieren, wer die KI in dieser Aufgabe sein soll", "O: Output: das Ergebnis, das du am Ende bekommst", "M: Modell: es gibt laut Video 1,8 Millionen verschiedene", "T: Testen: das Ergebnis mit der eigenen Absicht vergleichen"], "q": "KaWa zu «PROMPT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A3.0", "t": "ms", "q": "Welche drei Bausteine machen einen Prompt deutlich zuverlässiger?", "a": ["Rolle und Ziel nennen", "Möglichst kurz bleiben, ein Stichwort reicht", "Kontext und Daten mitgeben (z.B. Schema, Kategorienliste)", "Gewünschtes Ausgabeformat vorgeben", "Alles in Grossbuchstaben schreiben"], "r": [0, 2, 3], "e": "Rolle, Kontext, Format (dazu Beispiele und Grenzen). Das Modell kann nur nutzen, was im Prompt steht."}, {"id": "A3.1", "t": "mc", "q": "Was ist Few-Shot-Prompting?", "a": ["Das Modell mit wenigen Daten neu trainieren", "Dem Prompt einige Beispiele von Eingabe und gewünschter Ausgabe beilegen", "Den Prompt auf wenige Wörter kürzen", "Mehrere Modelle gleichzeitig fragen"], "r": 1, "e": "Beispiele im Prompt zeigen Muster und Format. Zero-Shot = ohne Beispiel."}, {"id": "A3.2", "t": "mc", "q": "Ein Assistent soll zu «Zeig mir alle Produkte der Kategorie Beeren» eine Datenbankabfrage bauen und liefert Zitrusfrüchte. Was fehlte im Prompt am ehesten?", "a": ["Ein höflicher Ton", "Die Zuordnung Kategoriename zu Kategorie-ID bzw. das Schema", "Eine höhere Temperatur", "Ein längerer Satz"], "r": 1, "e": "Ohne Schema oder ID-Liste rät das Modell die ID. Genau dieser Fehlertyp steckt in Nullserie Challenge 01."}, {"id": "A3.3", "t": "frei", "q": "Schreibe aus dem Kopf einen Prompt, mit dem du eine Fallstudie der Prüfung in fünf Minuten strukturieren lässt. Welche Teile gehören hinein?", "m": "Rolle (du bist AI Business Specialist), Auftrag (fasse die Ausgangslage in Stichpunkten: Organisation, Problem, Zahlen, Anspruchsgruppen, Rahmenbedingungen), Material (Falltext einfügen), Format (Tabelle oder Liste, max. 15 Zeilen), Grenze (erfinde nichts, markiere Unklares). Danach immer selbst gegen den Text prüfen."}], "videos": [{"id": "hc5P2BLF25U", "kanal": "Digitale Profis", "titel": "So schreibst Du effektive Prompts | Grundkurs Teil 1", "dauer": "9:10"}, {"id": "rQtRNtyr0kI", "kanal": "Fabian Rappert | Data Science Institute", "titel": "Prompt Engineering, Komplettkurs für Anfänger", "dauer": "28:02"}, {"id": "h798fO1NkDw", "kanal": "Felicia Simon", "titel": "Prompts schreiben lernen in 10 Minuten", "dauer": "10:25"}, {"id": "8iBTrqnBy9w", "kanal": "Christoph Magnussen", "titel": "Die größten Fehler beim Prompten und wie du sie vermeidest", "dauer": "11:07"}], "pn": 4}, {"key": "A4", "titel": "RAG: nachschlagen, dann antworten", "warum": "Kern von Nullserie Challenge 01 und 02.", "fragen": [{"id": "A4.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «RAG: nachschlagen, dann antworten»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Kern von Nullserie Challenge 01 und 02. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A4.vq.jZoyg74ZyqM.vor0", "vid": "jZoyg74ZyqM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Tokens kann ein Modell wie Gemini 2.5 Pro laut Video maximal in seinem Kontextfenster verarbeiten?", "a": ["10.000", "100.000", "Bis zu einer Million", "Unbegrenzt viele"], "r": 2, "e": "Das Video nennt Gemini 2.5 Pro als Beispiel für ein Modell mit einem Kontextfenster von bis zu einer Million Tokens."}, {"id": "A4.vq.jZoyg74ZyqM.vor1", "vid": "jZoyg74ZyqM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum kann ein Sprachmodell keine Ereignisse von letzter Woche erklären, auch wenn es sehr gross ist?", "a": ["Weil es zu langsam rechnet", "Weil sein Trainingsdatensatz diese Ereignisse noch nicht enthielt", "Weil es keine Internetverbindung braucht", "Weil die Temperature zu niedrig eingestellt ist"], "r": 1, "e": "Ein Modell kennt laut Video nur das, was im Trainingsdatensatz stand, neuere Ereignisse fehlen einfach."}, {"id": "A4.v.jZoyg74ZyqM", "t": "frei", "abruf": 1, "vid": "jZoyg74ZyqM", "vq": "nach", "q": "Video «LLMs & RAG: Was wirklich wichtig ist | INSIDE AI #21» (Fraunhofer IEM): Was waren die Kernaussagen?", "m": "1. Jedes Sprachmodell hat ein begrenztes Kontextfenster, und selbst wenn dieses eine Million Token fasst, sinkt die Antwortqualität oft, wenn zu viele nicht relevante Informationen mitgegeben werden. 2. Retrieval Augmented Generation entnimmt Informationen aus einer externen Quelle wie Dokumenten oder Datenbanken und lädt nur die relevanten Ausschnitte in das Kontextfenster, statt das ganze Modell neu zu trainieren. 3. Embeddings sind nur eine von mehreren Methoden zur Informationsidentifikation bei RAG, denn sie werden über eine semantische Ähnlichkeitssuche berechnet und liefern nicht immer bessere Ergebnisse als eine einfache Stichwortsuche."}, {"id": "A4.vq.jZoyg74ZyqM.nach0", "vid": "jZoyg74ZyqM", "vq": "nach", "t": "mc", "q": "Wofür steht die Abkürzung RAG laut Video?", "a": ["Random Augmented Generation", "Retrieval Augmented Generation", "Ranked Attention Generation", "Real-time API Gateway"], "r": 1, "e": "RAG steht für Retrieval Augmented Generation, das Zusammensuchen relevanter Informationen kombiniert mit generativer KI."}, {"id": "A4.vq.jZoyg74ZyqM.nach1", "vid": "jZoyg74ZyqM", "vq": "nach", "t": "ms", "q": "Welche zwei Nachteile nennt das Video beim Arbeiten mit Embeddings?", "a": ["Embeddings müssen rechenintensiv berechnet werden", "Jede neue Information erzeugt zusätzlichen Rechenaufwand", "Embeddings funktionieren nur mit PDF-Dateien", "Embeddings sind gesetzlich verboten"], "r": [0, 1], "e": "Das Video nennt den Rechenaufwand beim Erstellen und bei jeder neuen Information als Nachteil der Embeddings."}, {"id": "A4.vq.jZoyg74ZyqM.nach2", "vid": "jZoyg74ZyqM", "vq": "nach", "t": "ord", "q": "Bringe den RAG-Ablauf laut Video in die richtige Reihenfolge.", "a": ["Relevante Informationen aus einer externen Quelle identifizieren", "Die gefundenen Informationen in das Kontextfenster laden", "Das Sprachmodell generiert die Antwort auf Basis dieses Kontexts"], "e": "Das Video beschreibt genau diesen Ablauf: erst die relevante Information finden, dann ins Kontextfenster geben, dann generieren lassen."}, {"id": "A4.vq.jZoyg74ZyqM.nach3", "vid": "jZoyg74ZyqM", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie von RAG gehört hat, warum ein Unternehmen nicht einfach alle seine Daten auf einmal ins Kontextfenster eines Sprachmodells packen kann.", "m": "Ein Unternehmen hat oft riesige Datenmengen, die gar nicht in ein Kontextfenster passen, und selbst wenn es passen würde, wären die meisten Informationen für die konkrete Frage gar nicht relevant. Deshalb braucht es einen Mechanismus wie RAG, der zuerst die wirklich passenden Informationen heraussucht und nur diese dem Modell mitgibt."}, {"id": "A4.vq.jZoyg74ZyqM.abc", "t": "abc", "abruf": 1, "vid": "jZoyg74ZyqM", "vq": "nach", "m": ["Augmented", "Embeddings", "Framework", "Generation", "Knowledgegraph", "Kontextfenster", "PDF", "Retrieval", "Stichwortsuche", "Suche", "Systemprompt", "Vektorsuche"], "q": "ABC-Liste zu «LLMs & RAG: Was wirklich wichtig ist | INSIDE AI #21»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A4.vq.jZoyg74ZyqM.kawa", "t": "kawa", "abruf": 1, "vid": "jZoyg74ZyqM", "vq": "nach", "wort": "RAG", "m": ["R: Retrieval: relevante Informationen aus einer Quelle zusammensuchen", "A: Augmented: das Sprachmodell bekommt zusätzlichen Kontext dazu", "G: Generation: das Modell erzeugt die Antwort aus dem erweiterten Kontext"], "q": "KaWa zu «RAG»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A4.vq.6xNqqIqyy38.vor0", "vid": "6xNqqIqyy38", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele grundsätzliche Wege gibt es laut Video, ein Sprachmodell an den Unternehmenskontext anzupassen?", "a": ["Zwei", "Drei", "Vier", "Fünf"], "r": 1, "e": "Das Video nennt Prompt Engineering, RAG und Fine-Tuning als die drei Wege."}, {"id": "A4.vq.6xNqqIqyy38.vor1", "vid": "6xNqqIqyy38", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woher holt sich RAG die zusätzlichen Informationen, die es dem Sprachmodell mitgibt?", "a": ["Aus dem Trainingsprozess des Modells selbst", "Aus einer externen Datenquelle ausserhalb des Trainings", "Aus zufällig generierten Texten", "Aus den Einstellungen des Nutzers"], "r": 1, "e": "RAG holt externe Daten, die nicht im Training enthalten sind, und stellt sie dem Modell bei der Anfrage zur Verfügung."}, {"id": "A4.v.6xNqqIqyy38", "t": "frei", "abruf": 1, "vid": "6xNqqIqyy38", "vq": "nach", "q": "Video «Was ist Retrieval Augmented Generation?» (datasolut): Was waren die Kernaussagen?", "m": "1. Es gibt drei Wege, ein Sprachmodell an einen Unternehmenskontext anzupassen: Prompt Engineering mit geringem Aufwand, Retrieval Augmented Generation als Mittelweg und Fine-Tuning mit dem höchsten Aufwand. 2. Bei RAG sucht ein Retrieval-Prozess passende Informationen aus einer Vektordatenbank, zum Beispiel Metadaten zu Weinen, und reicht diesen erweiterten Kontext zusammen mit der Nutzeranfrage an das Sprachmodell weiter. 3. RAG erhöht laut Video das Nutzervertrauen, weil es konkrete Quellenangaben liefern kann und damit zeigt, dass eine Antwort nicht halluziniert, sondern auf echten Daten beruht."}, {"id": "A4.vq.6xNqqIqyy38.nach0", "vid": "6xNqqIqyy38", "vq": "nach", "t": "mc", "q": "Welchen Vorteil von RAG nennt das Video im Vergleich zum Fine-Tuning?", "a": ["RAG ist immer genauer als Fine-Tuning", "RAG ist deutlich kosteneffizienter", "RAG benötigt keinerlei Datenquelle", "RAG verändert die Gewichte des Modells"], "r": 1, "e": "Das Video nennt RAG als extrem kosteneffizient im Vergleich zum aufwendigeren Fine-Tuning."}, {"id": "A4.vq.6xNqqIqyy38.nach1", "vid": "6xNqqIqyy38", "vq": "nach", "t": "ms", "q": "Welche zwei Vorteile von RAG werden im Video genannt?", "a": ["Aktuelle Informationen aus externen Quellen", "Automatisches Neutrainieren des Modells", "Erhöhtes Nutzervertrauen durch Quellenangaben", "Kostenlose Rechenleistung"], "r": [0, 2], "e": "Das Video nennt aktuelle externe Informationen und mehr Vertrauen durch Quellenangaben als zwei von vier genannten Vorteilen."}, {"id": "A4.vq.6xNqqIqyy38.nach2", "vid": "6xNqqIqyy38", "vq": "nach", "t": "ord", "q": "Bringe den Ablauf des Weinbeispiels in die richtige Reihenfolge.", "a": ["Nutzer stellt eine Anfrage (Query)", "Retrieval-Prozess holt passende Weine aus der Datenbank", "Metadaten werden dem Prompt als Kontext hinzugefügt", "Sprachmodell generiert die Weinempfehlung"], "e": "Das Video erklärt den RAG-Ablauf am Beispiel eines Weinempfehlungssystems in genau dieser Reihenfolge."}, {"id": "A4.vq.6xNqqIqyy38.nach3", "vid": "6xNqqIqyy38", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der RAG nicht kennt, in drei Sätzen, wie ein RAG-System zu einer Antwort kommt.", "m": "Ein RAG-System bekommt zuerst eine Anfrage von einem Nutzer, zum Beispiel eine Frage nach einem passenden Wein. Dann sucht ein Retrieval-Prozess in einer Datenbank nach passenden Informationen, etwa Weinbeschreibungen. Diese Informationen werden dem Sprachmodell als zusätzlicher Kontext mitgegeben, das daraus eine fertige, gut formulierte Antwort erzeugt."}, {"id": "A4.vq.6xNqqIqyy38.abc", "t": "abc", "abruf": 1, "vid": "6xNqqIqyy38", "vq": "nach", "m": ["Agent", "Bot", "Datenbank", "Empfehlung", "Fine-Tuning", "Kontext", "Metadaten", "Prompt Engineering", "Query", "Retrieval", "Unternehmenskontext", "Vektordatenbank", "Weinempfehler"], "q": "ABC-Liste zu «Was ist Retrieval Augmented Generation?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A4.vq.6xNqqIqyy38.kawa", "t": "kawa", "abruf": 1, "vid": "6xNqqIqyy38", "vq": "nach", "wort": "RAG", "m": ["R: Retrieval holt passende Informationen aus einer Datenbank.", "A: Augmented bedeutet, dass der Prompt um diesen Kontext erweitert wird.", "G: Generation ist der Schritt, in dem das Sprachmodell die fertige Antwort schreibt."], "q": "KaWa zu «RAG»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A4.vq.T-D1OfcDW1M.vor0", "vid": "T-D1OfcDW1M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Monde hat der Planet mit den meisten Monden in unserem Sonnensystem laut dem Video wirklich?", "a": ["88 (Jupiter)", "146 (Saturn)", "27 (Uranus)", "0, das ändert sich wöchentlich"], "r": 1, "e": "Im Video nennt die IBM-Forscherin Saturn mit 146 Monden gegen Jupiter mit 88. ACHTUNG, die Pointe trifft das Video selbst: Auch diese Zahlen sind überholt. Seit März 2025 sind 274 Saturnmonde bestätigt, Jupiter liegt bei über 95. Genau darum geht es: Jede eingefrorene Zahl veraltet, deshalb RAG statt Modellwissen."}, {"id": "A4.vq.T-D1OfcDW1M.vor1", "vid": "T-D1OfcDW1M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was macht ein Sprachmodell ohne RAG, wenn es die Antwort eigentlich nicht sicher weiss?", "a": ["es sagt ehrlich, dass es die Antwort nicht kennt", "es fragt die Nutzerin oder den Nutzer zurück", "es antwortet trotzdem selbstbewusst, auch wenn die Antwort falsch oder veraltet ist", "es startet automatisch eine Websuche"], "r": 2, "e": "Das Video zeigt, dass ein reines Sprachmodell selbstbewusst antwortet, obwohl die Information veraltet oder falsch ist, weil es keine Quelle prüft."}, {"id": "A4.v.T-D1OfcDW1M", "t": "frei", "abruf": 1, "vid": "T-D1OfcDW1M", "vq": "nach", "q": "Video «What is Retrieval-Augmented Generation (RAG)?» (IBM Technology): Was waren die Kernaussagen?", "m": "1. Ohne Retrieval Augmented Generation beantwortet ein Sprachmodell Fragen allein aus seinen trainierten Parametern und kann dabei veraltete oder falsche Antworten mit hoher Sicherheit präsentieren, ohne eine Quelle zu nennen. 2. Bei RAG erhält das Modell die Anweisung, vor der Antwortgenerierung zuerst relevante Inhalte aus einem Datenspeicher abzurufen und diese mit der Nutzerfrage zu kombinieren, bevor es antwortet. 3. RAG mildert laut Video zwei typische Schwächen von Sprachmodellen: veraltetes Wissen, weil man nur die Datenquelle statt des ganzen Modells aktualisieren muss, und fehlende Quellenangaben, weil das Modell nun auf Primärdaten verweisen kann."}, {"id": "A4.vq.T-D1OfcDW1M.nach0", "vid": "T-D1OfcDW1M", "vq": "nach", "t": "mc", "q": "Wofür steht das 'R' in RAG?", "a": ["Regel", "Retrieval, also das Abrufen von Informationen aus einem Datenspeicher", "Rechenleistung", "Reduktion"], "r": 1, "e": "RAG steht für Retrieval-Augmented Generation, wobei Retrieval das gezielte Abrufen von Informationen aus einer Quelle vor der Antwort bedeutet."}, {"id": "A4.vq.T-D1OfcDW1M.nach1", "vid": "T-D1OfcDW1M", "vq": "nach", "t": "ms", "q": "Welche zwei Probleme von Sprachmodellen löst RAG laut Video?", "a": ["dass Antworten veraltet sein können", "dass Modelle zu langsam antworten", "dass Antworten oft keine Quelle haben und erfunden wirken (Halluzination)", "dass Modelle zu viel Strom verbrauchen"], "r": [0, 2], "e": "Das Video nennt genau diese zwei LLM-Probleme: veraltetes Wissen und fehlende Quellenangabe beziehungsweise Halluzination."}, {"id": "A4.vq.T-D1OfcDW1M.nach2", "vid": "T-D1OfcDW1M", "vq": "nach", "t": "ord", "q": "Bringe den RAG-Ablauf laut Video in die richtige Reihenfolge.", "a": ["Nutzerin stellt eine Frage an das Modell", "Das Modell lässt relevante Informationen aus dem Datenspeicher abrufen", "Die abgerufene Information wird mit der Frage kombiniert", "Das Modell generiert die Antwort inklusive Beleg"], "e": "Das Video beschreibt genau diesen Ablauf: erst die Frage, dann die Suche im Datenspeicher, dann die Kombination und erst danach die generierte Antwort."}, {"id": "A4.vq.T-D1OfcDW1M.nach3", "vid": "T-D1OfcDW1M", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wo du im Alltag schon mal auf ein System gestossen bist, das wie RAG zuerst nachschlagen und dann erst antworten sollte, es aber nicht getan hat.", "m": "Manchmal fragt man einen Chatbot einer Firma etwas und bekommt eine allgemeine, veraltete Antwort statt einer, die auf die aktuellen Unterlagen der Firma zugreift. Das passiert, wenn der Chatbot nur mit seinem Training antwortet statt zuerst in einer Wissensdatenbank nachzuschauen. Genau dieses Nachschlagen vor dem Antworten ist die Idee hinter RAG."}, {"id": "A4.vq.T-D1OfcDW1M.abc", "t": "abc", "abruf": 1, "vid": "T-D1OfcDW1M", "vq": "nach", "m": ["Content Store", "Datenspeicher", "Generation", "Halluzination", "LLM", "NASA", "Prompt", "Quelle", "RAG", "Retrieval", "Vektor"], "q": "ABC-Liste zu «What is Retrieval-Augmented Generation (RAG)?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A4.vq.T-D1OfcDW1M.kawa", "t": "kawa", "abruf": 1, "vid": "T-D1OfcDW1M", "vq": "nach", "wort": "RAG", "m": ["R: Retrieval: zuerst Informationen aus einer Quelle abrufen", "A: Augmented: die Anfrage wird mit den gefundenen Informationen angereichert", "G: Generation: erst danach generiert das Modell die Antwort"], "q": "KaWa zu «RAG»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A4.vq.xCv16VpYFHM.vor0", "vid": "xCv16VpYFHM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie lange arbeitet der Deep-Research-Agent im Video maximal an einer Aufgabe, bevor er aufhört?", "a": ["5 Minuten", "30 Minuten", "2 Stunden", "Er hört nie auf"], "r": 1, "e": "Das Video nennt ausdrücklich ein Zeitlimit von 30 Minuten, in denen sich der Agent durch die Aufgabe arbeitet."}, {"id": "A4.vq.xCv16VpYFHM.vor1", "vid": "xCv16VpYFHM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was musste der Kunde in Kanada tun, nachdem der Agent den fertigen Projektbericht erstellt hatte?", "a": ["Nichts mehr, alles war fertig", "Den Bericht selbst noch einmal prüfen", "Den Bericht komplett neu schreiben lassen", "Den Agenten löschen"], "r": 1, "e": "Im Video sagt der Sprecher ausdrücklich, dass man immer noch prüfen muss, ob das, was der Agent liefert, tatsächlich stimmt."}, {"id": "A4.v.xCv16VpYFHM", "t": "frei", "abruf": 1, "vid": "xCv16VpYFHM", "vq": "nach", "q": "Video «ChatGPT mit eigenen Daten verbinden! So funktionieren Konnektoren» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Magnussen zeigt, dass Deep Research bei ChatGPT nicht nur im Internet, sondern datenschutzkonform auch durch SharePoint, E-Mails und Kalender recherchieren kann, wenn die Datenquellen freigegeben sind. 2. Am Beispiel eines Kunden in Kanada demonstriert er, wie ein Agent aus einem Grundstücksfoto, Google Maps und Firmendateien einen kompletten Bauprojekt-Report samt Behörden-Permits erstellt, den man danach trotzdem verifizieren muss. 3. Er erklärt MCP (Model Context Protocol), im November 2024 von Anthropic vorgestellt, als eine Art USB-Stick, der einer KI Zugriff auf eigene Dienste wie Google Drive, Mail oder SharePoint gibt."}, {"id": "A4.vq.xCv16VpYFHM.nach0", "vid": "xCv16VpYFHM", "vq": "nach", "t": "mc", "q": "Wofür steht die Abkürzung MCP laut dem Video?", "a": ["Model Context Protocol", "Machine Content Provider", "Multi Chat Processing", "Managed Cloud Platform"], "r": 0, "e": "Das Video erklärt MCP ausdrücklich als Model Context Protocol, ein Standardprotokoll von Anthropic."}, {"id": "A4.vq.xCv16VpYFHM.nach1", "vid": "xCv16VpYFHM", "vq": "nach", "t": "ms", "q": "Welche zwei Datenquellen nennt der Sprecher als Beispiele, durch die ein Agent mit Verbindung zu eigenen Dateien gehen kann?", "a": ["Google Drive", "Ein Kochbuch", "E-Mails", "Eine gedruckte Zeitung"], "r": [0, 2], "e": "Der Sprecher nennt konkret Google Drive und E-Mails als Quellen, die anderen beiden Optionen kommen im Video nicht vor."}, {"id": "A4.vq.xCv16VpYFHM.nach2", "vid": "xCv16VpYFHM", "vq": "nach", "t": "ord", "q": "Bringe den Ablauf des Kanada-Beispiels aus dem Video in die richtige Reihenfolge.", "a": ["Der Sprecher macht ein Foto vom Grundstück", "Er schreibt einen Prompt für den Agenten", "Der Agent durchsucht Dateien und E-Mails", "Nach etwa 20 Minuten liegt ein fertiger Projektvorschlag vor"], "e": "Das Video schildert das Beispiel genau in dieser Abfolge, vom Foto bis zum fertigen Bericht nach rund 20 Minuten."}, {"id": "A4.vq.xCv16VpYFHM.nach3", "vid": "xCv16VpYFHM", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum man laut Video einem Agenten wie Deep Research nicht einfach blind vertrauen sollte, obwohl das Ergebnis beeindruckend aussieht.", "m": "Ein Agent sammelt selbstständig Informationen und trifft dabei eigene Entscheidungen, aber er kann trotzdem Fehler machen oder falsche Zusammenhänge herstellen. Deshalb muss ein Mensch das Ergebnis am Ende immer noch prüfen, bevor er es tatsächlich verwendet, so wie es der Sprecher im Kanada-Beispiel ausdrücklich betont."}, {"id": "A4.vq.xCv16VpYFHM.abc", "t": "abc", "abruf": 1, "vid": "xCv16VpYFHM", "vq": "nach", "m": ["Agent", "Autonomie", "Connector", "Datenschutz", "Deep Research", "Gmail", "Google Drive", "Kalender", "MCP", "Prompt", "Report", "SharePoint"], "q": "ABC-Liste zu «ChatGPT mit eigenen Daten verbinden! So funktionieren Konnektoren»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A4.vq.xCv16VpYFHM.kawa", "t": "kawa", "abruf": 1, "vid": "xCv16VpYFHM", "vq": "nach", "wort": "AGENT", "m": ["A: Autonomie: der Agent arbeitet eigenständig, bis er das Gefühl hat, fertig zu sein", "G: Google Drive: eine der Datenquellen, die der Agent durchsuchen kann", "E: E-Mails: der Agent darf mit Erlaubnis auch durch die Postfächer gehen", "N: Notwendig: der Mensch muss die Ergebnisse trotzdem prüfen", "T: Timeout: nach 30 Minuten hört der Agent auf zu arbeiten"], "q": "KaWa zu «AGENT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A4.0", "t": "ord", "q": "Bringe die Schritte einer RAG-Antwort in die richtige Reihenfolge.", "a": ["Dokumente in Abschnitte teilen und
