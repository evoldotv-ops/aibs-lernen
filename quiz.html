"nach", "wort": "DOMAIN", "m": ["D: Domain: das geteilte Interessengebiet einer Community of Practice", "O: Organisation von Wissen: Mitglieder entwickeln gemeinsame Lösungswege für wiederkehrende Probleme", "M: Mitgliedschaft: bedeutet ein Bekenntnis zur gemeinsamen Domain", "A: Aktivitäten: Mitglieder engagieren sich gemeinsam in Aktivitäten und Diskussionen", "I: Identität: die Domain gibt der Gruppe eine gemeinsame Identität", "N: Netzwerk aus Beziehungen allein reicht nicht, es braucht auch Praxis und Domain"], "q": "KaWa zu «DOMAIN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D5.0", "t": "ord", "q": "PDCA-Zyklus in der richtigen Reihenfolge.", "a": ["Plan: Ziel und Massnahme planen", "Do: im Kleinen umsetzen", "Check: Wirkung messen", "Act: standardisieren oder anpassen"], "e": "E4 verlangt einen kontinuierlichen Verbesserungs- und Anpassungsprozess für KI-Lösungen."}, {"id": "D5.1", "t": "ms", "q": "Aus welchen Quellen sammelst du Verbesserungsbedarf für eine laufende KI-Lösung? Wähle drei.", "a": ["Monitoring-Kennzahlen", "Rückmeldungen der Nutzenden und Betroffenen", "Incidents und Supportanfragen", "Horoskop"], "r": [0, 1, 2], "e": "E4: Erkenntnisse aus verschiedenen Quellen und Rückmeldungen strukturiert aufbereiten, mit Fachpersonen validieren."}, {"id": "D5.2", "t": "frei", "q": "Beschreibe einen schlanken Verbesserungsprozess für eine KI-Lösung im Betrieb in fünf Sätzen.", "m": "Monatlich werden Kennzahlen, Nutzerfeedback und Incidents zusammengetragen. Die Produktverantwortliche und eine Fachperson bewerten sie und halten Handlungsbedarf fest. Massnahmen werden priorisiert und als Change eingeplant. Nach Umsetzung wird an denselben Kennzahlen nachgemessen. Einmal im Jahr wird das ganze Portfolio überprüft: ausbauen, halten, ablösen."}], "videos": [{"id": "0s73-nXrnT8", "kanal": "Projekte leicht gemacht", "titel": "Der PDCA-Zyklus einfach erklärt, mit 2 Beispielen", "dauer": "12:29"}, {"id": "xuV9x5-u6nI", "kanal": "HYMER #EMPOWERMENT", "titel": "Kontinuierlicher Verbesserungsprozess | KVP einfach erklärt", "dauer": "4:01"}, {"id": "xgWPUYj6v0w", "kanal": "QualityMinds GmbH", "titel": "Was ist eine Community of Practice?", "dauer": "2:34"}, {"id": "SmqLyOLIjos", "kanal": "Skills Academia", "titel": "Communities of Practice (Etienne and Beverly Wenger-Trayner)", "dauer": "3:39"}], "pn": 4}], "pl": 3}, {"kz": "E", "titel": "Auftreten: präsentieren, antworten, Flipchart", "themen": [{"key": "E1", "titel": "Pyramidenprinzip (Minto): Antwort zuerst", "warum": "Bauform für deine 15 Minuten vor einer Geschäftsleitung.", "fragen": [{"id": "E1.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Pyramidenprinzip (Minto): Antwort zuerst»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Bauform für deine 15 Minuten vor einer Geschäftsleitung. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "E1.vq.j4Y3TdVVBCA.vor0", "vid": "j4Y3TdVVBCA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wer hat das Minto-Pyramidenprinzip entwickelt?", "a": ["Michael Porter", "Barbara Minto", "Kurt Lewin", "Peter Drucker"], "r": 1, "e": "Barbara Minto, eine Harvard-MBA-Absolventin, entwickelte das Prinzip bei McKinsey."}, {"id": "E1.vq.j4Y3TdVVBCA.vor1", "vid": "j4Y3TdVVBCA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Womit sollte man laut dem Prinzip eine Präsentation oder E-Mail top-down beginnen?", "a": ["Mit der Danksagung", "Mit der Antwort bzw. Empfehlung", "Mit den Rohdaten", "Mit einer langen Einleitung"], "r": 1, "e": "Man beginnt sofort mit der Antwort oder Empfehlung, bevor man die Begründung liefert."}, {"id": "E1.v.j4Y3TdVVBCA", "t": "frei", "abruf": 1, "vid": "j4Y3TdVVBCA", "vq": "nach", "q": "Video «Das Minto-Pyramidenprinzip erklärt anhand von Beispielen» (EPM): Was waren die Kernaussagen?", "m": "1. Nach dem Minto-Pyramidenprinzip beginnt man top-down mit der Antwort, gefolgt von den stützenden Hauptargumenten und erst danach den unterlegenden Daten, statt die Zuhörer erst durch die Argumentation zu führen. 2. Auf jeder horizontalen Ebene der Pyramide müssen die Punkte dem MECE-Prinzip folgen: mutually exclusive (überschneidungsfrei) und collectively exhaustive (die Ebene deckt alles ab). 3. Die Pyramidenstruktur macht eine Präsentation zeitlich flexibel, weil man bei Zeitdruck nur die oberste Ebene zeigen und bei Rückfragen gezielt in einen einzelnen Ast der Pyramide vertiefen kann, ohne die Kernaussage zu verlieren."}, {"id": "E1.vq.j4Y3TdVVBCA.nach0", "vid": "j4Y3TdVVBCA", "vq": "nach", "t": "mc", "q": "Wofür steht die Abkürzung MECE im Video?", "a": ["Mutually Exclusive, Collectively Exhaustive", "Most Efficient Company Example", "Multiple Exclusive Category Elements", "Main Executive Communication Example"], "r": 0, "e": "MECE bedeutet, dass sich die Punkte auf einer Ebene nicht überschneiden und zusammen alles abdecken."}, {"id": "E1.vq.j4Y3TdVVBCA.nach1", "vid": "j4Y3TdVVBCA", "vq": "nach", "t": "ms", "q": "Welche zwei Situationen nennt das Video als Vorteil der Flexibilität der Minto-Pyramide?", "a": ["Wenn die Redezeit plötzlich von 60 auf 10 Minuten gekürzt wird", "Wenn ein Geschäftsführer einem Teilargument widerspricht und mehr Details will", "Wenn der Drucker kaputt ist", "Wenn die Präsentation komplett neu geschrieben werden muss"], "r": [0, 1], "e": "Beide Szenarien zeigt das Video als Beispiele, bei denen man die Pyramide flexibel anpasst, ohne die Kernaussage zu verlieren."}, {"id": "E1.vq.j4Y3TdVVBCA.nach2", "vid": "j4Y3TdVVBCA", "vq": "nach", "t": "lueck", "q": "Beim Bottom-up-Ansatz organisiert man zuerst Daten nach MECE, zieht daraus Erkenntnisse und kombiniert alles zu einer zentralen ___.", "r": ["these"], "e": "Der Bottom-up-Ansatz endet mit einer zentralen These oder Kernaussage aus den analysierten Daten."}, {"id": "E1.vq.j4Y3TdVVBCA.nach3", "vid": "j4Y3TdVVBCA", "vq": "nach", "t": "frei", "q": "Erkläre, warum eine schlechte Datenbasis laut Video trotz einer logisch korrekt aufgebauten Minto-Pyramide zu einem falschen Ergebnis führen kann.", "m": "Die Minto-Pyramide sorgt nur dafür, dass die Argumentation logisch und überschneidungsfrei aufgebaut ist, sie prüft aber nicht, ob die zugrunde liegenden Daten selbst richtig sind. Wenn die unterste Ebene der Pyramide auf falschen oder schlechten Daten beruht, ist die daraus abgeleitete Schlussfolgerung zwar logisch stimmig, inhaltlich aber trotzdem falsch. Deshalb warnt das Video davor, sich allein auf die Struktur zu verlassen."}, {"id": "E1.vq.j4Y3TdVVBCA.abc", "t": "abc", "abruf": 1, "vid": "j4Y3TdVVBCA", "vq": "nach", "m": ["Antwort", "Bottom-up", "Empfehlung", "Encapsulation", "Flexibilität", "Hierarchie", "MECE", "Minto", "Pyramide", "Struktur", "These", "Top-down"], "q": "ABC-Liste zu «Das Minto-Pyramidenprinzip erklärt anhand von Beispielen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "E1.vq.j4Y3TdVVBCA.kawa", "t": "kawa", "abruf": 1, "vid": "j4Y3TdVVBCA", "vq": "nach", "wort": "ANTWORT", "m": ["A: Antwort zuerst: der Kern des Top-down-Ansatzes", "N: Nachvollziehbar: die Begründung folgt direkt auf die Antwort", "T: These: das Ergebnis des Bottom-up-Ansatzes", "W: Widerspruch einer Führungskraft: die Pyramide lässt sich dafür flexibel anpassen", "O: Overrun (Zeitüberschreitung): typischer Auslöser dafür, die Präsentation zu kürzen", "R: Reasoning (Begründung) folgt in der Pyramide unterhalb der Antwort"], "q": "KaWa zu «ANTWORT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "E1.vq.G88Xvr3yBLQ.vor0", "vid": "G88Xvr3yBLQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Womit sollte man laut Video eine Präsentation nach dem Pyramidenprinzip beginnen?", "a": ["Mit den kleinsten Details zuerst", "Mit der Antwort, also der Executive Summary", "Mit einer langen Einleitung über die Firma", "Mit einer Liste aller verwendeten Quellen"], "r": 1, "e": "Das Video sagt ausdrücklich, man soll beim Kommunizieren mit der Antwort beginnen."}, {"id": "E1.vq.G88Xvr3yBLQ.vor1", "vid": "G88Xvr3yBLQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: In welche Richtung baut man die Pyramide laut Video auf, wenn man ein Projekt analysiert, nicht wenn man kommuniziert?", "a": ["Von oben nach unten, von der Antwort zu den Details", "Von unten nach oben, von den Details zur Antwort", "Es gibt keine Richtung, alles gleichzeitig", "Nur von links nach rechts"], "r": 1, "e": "Beim Analysieren baut man die Pyramide laut Video von unten nach oben auf, von Details zur Antwort."}, {"id": "E1.v.G88Xvr3yBLQ", "t": "frei", "abruf": 1, "vid": "G88Xvr3yBLQ", "vq": "nach", "q": "Video «Das Pyramidenprinzip für Präsentationen und Folien» (Dan Galletta): Was waren die Kernaussagen?", "m": "1. Beim Aufbau eines Foliendecks arbeitet man analytisch von unten nach oben (Daten, dann Zusammenfassung, dann Antwort), kommuniziert dieselbe Pyramide aber von oben nach unten, beginnend mit der Executive Summary. 2. Die Executive Summary muss eigenständig verständlich sein, weil sie oft die einzige Folie ist, die Führungskräfte tatsächlich lesen. 3. Jede noch so kleine Aussage im Foliendeck muss durch Daten belegt sein, weil eine einzige unbelegte Behauptung von einer Führungskraft infrage gestellt werden und damit die Glaubwürdigkeit des ganzen Decks untergraben kann."}, {"id": "E1.vq.G88Xvr3yBLQ.nach0", "vid": "G88Xvr3yBLQ", "vq": "nach", "t": "mc", "q": "Was sollte laut Video die Executive Summary einer Präsentation leisten?", "a": ["Sie sollte nur für Insider verständlich sein", "Sie sollte das gesamte Argument zusammenfassen und auch alleine verständlich sein", "Sie sollte möglichst lang und detailliert sein", "Sie sollte am Ende der Präsentation stehen"], "r": 1, "e": "Das Video sagt, die Executive Summary muss eigenständig verständlich sein und das ganze Argument zusammenfassen."}, {"id": "E1.vq.G88Xvr3yBLQ.nach1", "vid": "G88Xvr3yBLQ", "vq": "nach", "t": "ms", "q": "Welche zwei der drei SCR-Bestandteile einer Storyline nennt das Video?", "a": ["Situation", "Complication", "Konklusion", "Einleitung"], "r": [0, 1], "e": "Das Video nennt Situation, Complication und Resolution, hier sind Situation und Complication die richtigen."}, {"id": "E1.vq.G88Xvr3yBLQ.nach2", "vid": "G88Xvr3yBLQ", "vq": "nach", "t": "ord", "q": "Bringe die drei Regeln aus dem Video für gute Slide Decks in die Reihenfolge, wie sie im Video vorgestellt werden.", "a": ["Genug Zeit in eine starke Executive Summary investieren", "Die Argumente logisch mit einer Situation-Complication-Resolution-Storyline ordnen", "Jede Behauptung mit unterstützenden Daten belegen"], "e": "Das Video stellt genau diese drei Regeln in dieser Reihenfolge vor."}, {"id": "E1.vq.G88Xvr3yBLQ.nach3", "vid": "G88Xvr3yBLQ", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen, warum eine Behauptung ohne unterstützende Daten laut Video die Glaubwürdigkeit der ganzen Präsentation gefährden kann.", "m": "Wenn eine einzelne Behauptung ohne Beleg im Raum steht, kann eine kritische Person diese Behauptung leicht anzweifeln. Laut Video reicht schon eine einzige unbelegte Aussage, damit das gesamte Slide Deck an Glaubwürdigkeit verliert. Deshalb sollte jede Aussage mit konkreten Daten oder Quellen unterlegt sein."}, {"id": "E1.vq.G88Xvr3yBLQ.abc", "t": "abc", "abruf": 1, "vid": "G88Xvr3yBLQ", "vq": "nach", "m": ["Abstract", "Argument", "Complication", "Data", "Executive Summary", "McKinsey", "Pyramid Principle", "Recommendation", "Resolution", "Situation", "Slide Deck", "Storyline"], "q": "ABC-Liste zu «Das Pyramidenprinzip für Präsentationen und Folien»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "E1.vq.G88Xvr3yBLQ.kawa", "t": "kawa", "abruf": 1, "vid": "G88Xvr3yBLQ", "vq": "nach", "wort": "SLIDE", "m": ["S: Situation: erster Teil der SCR-Storyline, beschreibt die Ausgangslage", "L: Logisch: Argumente müssen laut Regel zwei logisch geordnet werden", "I: Investieren: genug Zeit in die Executive Summary stecken, so Regel eins", "D: Daten: jede Behauptung braucht unterstützende Daten, so Regel drei", "E: Executive Summary: fasst das ganze Argument zusammen und steht ganz vorn"], "q": "KaWa zu «SLIDE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "E1.vq.1y15zjp47KQ.vor0", "vid": "1y15zjp47KQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Beginnt man beim Pyramidenprinzip in einer geschäftlichen Kommunikation zuerst mit der Antwort oder zuerst mit den Argumenten?", "a": ["Zuerst mit der Antwort, dann mit den Argumenten", "Zuerst mit den Argumenten, die Antwort kommt ganz am Schluss", "Man nennt nie eine klare Antwort", "Die Reihenfolge spielt laut Video keine Rolle"], "r": 0, "e": "Das Pyramidenprinzip beginnt laut Video mit der Antwort und stützt sie danach durch die Argumente, das gilt als überzeugender für Führungskräfte."}, {"id": "E1.vq.1y15zjp47KQ.vor1", "vid": "1y15zjp47KQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Hauptschritte braucht es laut Video, um eine Pyramide zur Problemlösung aufzubauen?", "a": ["Einen", "Drei", "Zehn", "Fünfzig"], "r": 1, "e": "Das Video beschreibt drei Schritte: die Kernfrage definieren, die Pyramide aufbauen und die Pyramide auf Vollständigkeit prüfen."}, {"id": "E1.v.1y15zjp47KQ", "t": "frei", "abruf": 1, "vid": "1y15zjp47KQ", "vq": "nach", "q": "Video «Pyramidenprinzip von Barbara Minto» (Pontema): Was waren die Kernaussagen?", "m": "1. Eine Problem-Pyramide wird in drei Schritten aufgebaut: die Schlüsselfrage aus Situation und Komplikation definieren, die Pyramide mit Haupt- und Unterpunkten bis zu den Grundursachen aufbauen, und die Pyramide auf Vollständigkeit prüfen. 2. Beim induktiven Vorgehen werden verschiedene Fakten zu einer Schlussfolgerung zusammengeführt (Bottom-up), beim deduktiven Vorgehen wird aus allgemein angenommenen Prämissen eine Schlussfolgerung abgeleitet (Top-down), Letzteres eignet sich besonders, um ein Publikum zu überzeugen. 3. Jede Ebene der Pyramide muss die darunterliegenden Ideen zusammenfassen, und alle Ideen einer Gruppierung müssen von derselben Art und logisch geordnet sein."}, {"id": "E1.vq.1y15zjp47KQ.nach0", "vid": "1y15zjp47KQ", "vq": "nach", "t": "mc", "q": "Was ist laut Video der erste Schritt beim Aufbau einer Pyramidenstruktur?", "a": ["Sofort eine E-Mail an alle Mitarbeitenden schreiben", "Die Schlüsselfrage konzipieren und definieren, die man lösen will", "Eine Präsentation mit vielen Folien gestalten", "Die Pyramide direkt mit der Lösung beenden"], "r": 1, "e": "Der erste Schritt ist laut Video, die Kernfrage zu definieren, die die gesamte Richtung der Analyse vorgibt."}, {"id": "E1.vq.1y15zjp47KQ.nach1", "vid": "1y15zjp47KQ", "vq": "nach", "t": "mc", "q": "Was unterscheidet induktive von deduktiver Argumentation laut Video?", "a": ["Induktiv kombiniert verschiedene Themen von unten nach oben zu einer Schlussfolgerung, deduktiv geht von oben nach unten aus allgemein angenommenen Aussagen", "Beide sind laut Video identisch", "Deduktiv nutzt nur Bilder, induktiv nur Zahlen", "Induktiv wird nur bei technischen Themen verwendet"], "r": 0, "e": "Induktive Argumentation ist ein Bottom-up-Ansatz, deduktive Argumentation ein Top-down-Ansatz von allgemein angenommenen Aussagen zur Schlussfolgerung."}, {"id": "E1.vq.1y15zjp47KQ.nach2", "vid": "1y15zjp47KQ", "vq": "nach", "t": "ord", "q": "Bringe die drei Schritte zum Aufbau einer Pyramide laut Video in die richtige Reihenfolge.", "a": ["Die Kernfrage des Problems definieren", "Die Pyramide mit Hauptthemen und Grundursachen aufbauen", "Prüfen, ob die Pyramide alle Anforderungen erfüllt"], "e": "Genau diese drei Schritte, in dieser Reihenfolge, beschreibt das Video als Vorgehen zum Aufbau einer Pyramidenstruktur."}, {"id": "E1.vq.1y15zjp47KQ.nach3", "vid": "1y15zjp47KQ", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie davon gehört hat, warum das Pyramidenprinzip laut Video besonders bei Gesprächen mit der Geschäftsleitung hilfreich ist.", "m": "Bei der Geschäftsleitung können Argumente jederzeit unterbrochen und hinterfragt werden, deshalb ist es laut Video sinnvoll, sofort mit der Antwort oder Kernaussage zu beginnen, statt sich erst langsam dorthin vorzuarbeiten. So zeigt man, dass man das Problem bereits durchdacht hat und die Lösung mit den wichtigsten Argumenten stützen kann. Das macht die Kommunikation schneller, klarer und überzeugender als ein klassischer Spannungsaufbau mit der Pointe am Ende."}, {"id": "E1.vq.1y15zjp47KQ.abc", "t": "abc", "abruf": 1, "vid": "1y15zjp47KQ", "vq": "nach", "m": ["Argument", "Beweis", "Deduktiv", "Geschäftsleitung", "Grundursache", "Gruppierung", "Hypothese", "Induktiv", "Kernfrage", "Pyramide", "Struktur", "Vollständigkeit"], "q": "ABC-Liste zu «Pyramidenprinzip von Barbara Minto»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "E1.vq.1y15zjp47KQ.kawa", "t": "kawa", "abruf": 1, "vid": "1y15zjp47KQ", "vq": "nach", "wort": "MINTO", "m": ["M: Minto entwickelte das Pyramidenprinzip für klare Kommunikation", "I: Induktive Argumentation baut von unten nach oben eine Schlussfolgerung auf", "N: Nach der Antwort folgen erst die stützenden Argumente", "T: Top-down nennt man die deduktive Vorgehensweise", "O: Oben in der Pyramide steht immer die zusammenfassende Kernaussage"], "q": "KaWa zu «MINTO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "E1.0", "t": "mc", "q": "Was ist der Kern des Pyramidenprinzips?", "a": ["Mit der Vorgeschichte beginnen und die Empfehlung ans Ende stellen", "Mit der Antwort beginnen, dann die stützenden Argumente, dann die Belege", "Möglichst viele Folien zeigen", "Nur Zahlen präsentieren"], "r": 1, "e": "Geschäftsleitungen wollen zuerst wissen, was sie entscheiden sollen. Die Herleitung folgt als Begründung."}, {"id": "E1.1", "t": "lueck", "q": "Argumente einer Ebene sollen überschneidungsfrei und vollständig sein. Abkürzung: ___ .", "r": ["mece"], "e": "Mutually Exclusive, Collectively Exhaustive."}, {"id": "E1.2", "t": "ord", "q": "Einleitung nach Minto (SCQA) in der richtigen Reihenfolge.", "a": ["Situation: unstrittige Ausgangslage", "Complication: was das Problem auslöst", "Question: die Frage, die sich daraus stellt", "Answer: deine Kernaussage"], "e": "Danach drei Stützen, je mit Belegen. Das trägt 15 Minuten."}, {"id": "E1.3", "t": "frei", "q": "Formuliere die Kernaussage deiner Teil-1-Präsentation in einem Satz und nenne die drei Stützen.", "m": "Selbstkontrolle: Enthält der Satz die Empfehlung (was soll die Leitung entscheiden), die Wirkung (Zahl) und den Zeitrahmen? Decken die drei Stützen die Pflichtkompetenzen ab: Auswahl der Einsatzmöglichkeit (B3), Lösung und Machbarkeit (C3, C4), Nutzen und Wirtschaftlichkeit (C5)? Wenn ein Zehnjähriger den Satz nacherzählen kann, ist er gut."}], "videos": [{"id": "j4Y3TdVVBCA", "kanal": "EPM", "titel": "Das Minto-Pyramidenprinzip erklärt anhand von Beispielen", "dauer": "7:55"}, {"id": "G88Xvr3yBLQ", "kanal": "Dan Galletta", "titel": "Das Pyramidenprinzip für Präsentationen und Folien", "dauer": "5:41"}, {"id": "1y15zjp47KQ", "kanal": "Pontema", "titel": "Pyramidenprinzip von Barbara Minto", "dauer": "8:49"}], "pn": 1}, {"key": "E2", "titel": "Einstieg, Spannung, Lampenfieber", "warum": "Anhang 1 zieht Punkte ab für fehlende Struktur und unangemessenen Auftritt.", "fragen": [{"id": "E2.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Einstieg, Spannung, Lampenfieber»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Anhang 1 zieht Punkte ab für fehlende Struktur und unangemessenen Auftritt. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "E2.vq.Nj-hdQMa3uA.vor0", "vid": "Nj-hdQMa3uA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie stark stieg der Wiederverkaufswert eines für 99 Cent gekauften Pferdekopfs, nachdem ein Autor eine Geschichte dazu geschrieben hatte?", "a": ["Er blieb gleich", "Er verdoppelte sich", "Er stieg um über 6000%", "Er sank"], "r": 2, "e": "Der Pferdekopf wurde für 99 Cent gekauft und für 62,95 Dollar verkauft, eine Steigerung von 6395%."}, {"id": "E2.vq.Nj-hdQMa3uA.vor1", "vid": "Nj-hdQMa3uA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Nach wie vielen Monaten lässt laut dem Referenten im Schnitt die 'Verliebtheit' nach und das kritische Denken kehrt zurück?", "a": ["Nach 3 Monaten", "Nach 13 Monaten", "Nach 5 Jahren", "Nie"], "r": 1, "e": "Der Referent nennt 13 Monate als durchschnittliche Dauer, bevor der Cortex, also das kritische Denken, aus der Verliebtheit zurückkehrt."}, {"id": "E2.v.Nj-hdQMa3uA", "t": "frei", "abruf": 1, "vid": "Nj-hdQMa3uA", "vq": "nach", "q": "Video «The magical science of storytelling | David JP Phillips» (TEDx Talks): Was waren die Kernaussagen?", "m": "1. Emotionale Investition in eine Geschichte senkt beim Publikum das kritische, objektive Denken, ähnlich wie beim Verliebtsein, weil Hormone wie Dopamin und Oxytocin die kritische Prüfung durch den Cortex zurückdrängen. 2. Spannung und ein Cliffhanger erzeugen beim Zuhörer erhöhte Dopaminwerte, was Fokus, Motivation und Erinnerungsvermögen verbessert. 3. Funktionales Storytelling bedeutet konkret: eigene Geschichten aufschreiben, sie danach indexieren, welche Emotion sie auslösen (z.B. Lachen für Endorphine, Mitgefühl für Oxytocin), und dann gezielt die passende Geschichte für die gewünschte Wirkung im Gespräch einsetzen."}, {"id": "E2.vq.Nj-hdQMa3uA.nach0", "vid": "Nj-hdQMa3uA", "vq": "nach", "t": "mc", "q": "Was passiert laut Referent mit unserem kritischen Denken, wenn wir emotional stark in eine Geschichte investiert sind?", "a": ["Es wird schärfer", "Es nimmt ab, wir werden weniger kritisch und objektiv", "Es bleibt komplett unverändert", "Es verschwindet für immer"], "r": 1, "e": "Je emotional investierter wir sind, desto weniger kritisch und objektiv beobachtend werden wir, so wie beim Verlieben."}, {"id": "E2.vq.Nj-hdQMa3uA.nach1", "vid": "Nj-hdQMa3uA", "vq": "nach", "t": "mc", "q": "Welche drei Schritte gehören laut Referent zum 'funktionalen Storytelling'?", "a": ["Glauben, ein guter Erzähler zu sein; Geschichten aufschreiben; Geschichten nach Wirkung indexieren", "Ein Feuer anzünden, eine tiefe Stimme aufsetzen, einen Bart wachsen lassen", "Nur berühmte Geschichten nacherzählen", "PowerPoint-Folien auswendig lernen"], "r": 0, "e": "Der Referent nennt genau diese drei Schritte: daran glauben, ein guter Storyteller zu sein, eigene Geschichten aufschreiben und sie nach der ausgelösten Emotion indexieren."}, {"id": "E2.vq.Nj-hdQMa3uA.nach2", "vid": "Nj-hdQMa3uA", "vq": "nach", "t": "ms", "q": "Welche zwei Zahlen nennt der Referent aus Rob Walkers eBay-Experiment mit Geschichten?", "a": ["Der für 99 Cent gekaufte und für 62,95 Dollar verkaufte Pferdekopf", "Ein Auto, das nach dem Kauf sofort an Wert verliert", "Die insgesamt für 129 Dollar gekauften und für 8000 Dollar verkauften eBay-Objekte", "Ein Haus, das nie verkauft wurde"], "r": [0, 2], "e": "Beide Beispiele stammen aus Rob Walkers Experiment mit eBay-Objekten und dazu geschriebenen Geschichten."}, {"id": "E2.vq.Nj-hdQMa3uA.nach3", "vid": "Nj-hdQMa3uA", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie davon gehört hat, warum eine gute Geschichte laut dem Referenten mehr bewirken kann als reine Fakten oder eine PowerPoint-Folie.", "m": "Eine gute Geschichte löst im Gehirn ähnliche Hormone und Neurotransmitter aus wie das Verlieben, zum Beispiel Dopamin, Oxytocin oder Endorphine, und macht uns dadurch emotional investiert. Weil wir dann weniger kritisch und mehr aufnahmebereit sind, bleiben Inhalte besser hängen als bei reiner Fakten- oder Folienpräsentation, die unser Gehirn evolutionär viel weniger gewohnt ist als Geschichten."}, {"id": "E2.vq.Nj-hdQMa3uA.abc", "t": "abc", "abruf": 1, "vid": "Nj-hdQMa3uA", "vq": "nach", "m": ["Cortex", "Dopamin", "Empathie", "Endorphine", "Funktionales Storytelling", "Geschichte", "Höhlenmalerei", "Investment", "Oxytocin", "PowerPoint", "Serotonin", "Vasopressin"], "q": "ABC-Liste zu «The magical science of storytelling | David JP Phillips»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "E2.vq.Nj-hdQMa3uA.kawa", "t": "kawa", "abruf": 1, "vid": "Nj-hdQMa3uA", "vq": "nach", "wort": "DOPAMIN", "m": ["D: Dopamin sorgt für mehr Fokus, Motivation und besseres Erinnern.", "O: Oxytocin wird durch Geschichten ausgelöst, die Empathie erzeugen.", "P: PQ Media beziffert die jährlichen Einnahmen durch Product Placement auf 10,5 Milliarden Dollar.", "A: Angels' Cocktail nennt der Referent die Mischung aus Dopamin, Oxytocin und Endorphinen.", "M: Menschen sind von Geburt an gute Geschichtenerzähler, man muss es nur glauben.", "I: Indexiere deine Geschichten danach, welches Gefühl sie auslösen.", "N: Neurotransmitter wie Serotonin und Vasopressin werden durch gute Geschichten freigesetzt."], "q": "KaWa zu «DOPAMIN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "E2.vq.-FOCpMAww28.vor0", "vid": "-FOCpMAww28", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ist die im Video zuerst genannte 'TED-Talk-Formel' mit rotem Teppich, Kindheitsgeschichte und Handlungsaufruf tatsächlich das Erfolgsgeheimnis grosser TED-Talks?", "a": ["ja, genau das macht jeden Talk grossartig", "nein, wer diese Elemente überstrapaziert, wirkt klischeehaft oder manipulativ", "ja, aber nur bei technischen Themen", "das Video sagt dazu nichts"], "r": 1, "e": "Chris Anderson stellt diese vermeintliche Formel zu Beginn bewusst vor, um sie dann als falsch zurückzuweisen: Ueberstrapazierte Elemente wirken klischeehaft oder manipulativ."}, {"id": "E2.vq.-FOCpMAww28.vor1", "vid": "-FOCpMAww28", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert laut Video im Gehirn der Zuhörenden während eines guten Vortrags?", "a": ["gar nichts Besonderes", "nur das Gehirn der sprechenden Person aktiviert sich", "die Gehirnwellenmuster der Zuhörenden gleichen sich in Echtzeit dem Muster der sprechenden Person an", "die Zuhörenden schlafen automatisch ein"], "r": 2, "e": "Das Video beschreibt, wie ein Ideenmuster aus dem Gehirn der Rednerin oder des Redners in Echtzeit in den Gehirnen von hunderten Zuhörenden nachgebildet wird."}, {"id": "E2.v.-FOCpMAww28", "t": "frei", "abruf": 1, "vid": "-FOCpMAww28", "vq": "nach", "q": "Video «TED's secret to great public speaking | Chris Anderson» (TED): Was waren die Kernaussagen?", "m": "1. Ein guter Vortrag beschränkt sich auf einen einzigen zentralen Gedanken (die 'Idee') und liefert genügend Kontext und Beispiele, um genau diesen einen Gedanken vollständig zu erklären. 2. Bevor man beginnt, eine Idee im Kopf des Publikums aufzubauen, muss man dessen Neugier wecken, etwa durch eine verblüffende Frage, die eine Lücke im bisherigen Weltbild aufzeigt. 3. Neue Ideen müssen Schritt für Schritt auf Konzepten aufgebaut werden, die das Publikum bereits kennt, wofür sich Metaphern besonders eignen, wie das Beispiel CRISPR als 'Textverarbeitungsprogramm für DNA' zeigt."}, {"id": "E2.vq.-FOCpMAww28.nach0", "vid": "-FOCpMAww28", "vq": "nach", "t": "mc", "q": "Was bezeichnet das Video als die eigentliche Aufgabe eines guten Redners oder einer guten Rednerin?", "a": ["möglichst viele Witze zu erzählen", "dem Publikum ein Geschenk zu übermitteln, nämlich eine Idee", "möglichst lange zu sprechen", "die eigene Firma zu bewerben"], "r": 1, "e": "Das Video nennt es die wichtigste Aufgabe eines Redners, dem Publikum eine Idee als Geschenk zu übermitteln."}, {"id": "E2.vq.-FOCpMAww28.nach1", "vid": "-FOCpMAww28", "vq": "nach", "t": "ms", "q": "Welche zwei der vier Methoden für einen guten Vortrag nennt das Video?", "a": ["den Vortrag auf eine einzige Hauptidee begrenzen", "möglichst viele verschiedene Ideen gleichzeitig präsentieren", "die Neugier des Publikums wecken, bevor man die Idee aufbaut", "möglichst viele Fremdwörter verwenden, die niemand kennt"], "r": [0, 2], "e": "Das Video nennt als zwei der vier Methoden, den Vortrag auf eine Idee zu begrenzen und zuerst die Neugier des Publikums zu wecken."}, {"id": "E2.vq.-FOCpMAww28.nach2", "vid": "-FOCpMAww28", "vq": "nach", "t": "lueck", "q": "Als Jennifer Kahn CRISPR erklärte, verglich sie es mit einem ___, mit dem man DNA ausschneiden und einfügen kann.", "r": ["textverarbeitungsprogramm"], "e": "Das Video zitiert genau diese Metapher: CRISPR sei wie ein Textverarbeitungsprogramm für DNA."}, {"id": "E2.vq.-FOCpMAww28.nach3", "vid": "-FOCpMAww28", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wie du eine komplizierte Idee aus deinem Alltag mit einer Metapher erklären würdest, die dein Gegenüber schon kennt.", "m": "Ich würde zuerst überlegen, welches Konzept meinem Gegenüber schon vertraut ist, zum Beispiel ein Kochrezept oder ein Werkzeug aus dem Alltag. Dann würde ich meine komplizierte Idee Schritt für Schritt an dieses bekannte Konzept anknüpfen, so wie im Video CRISPR mit einem Textverarbeitungsprogramm verglichen wird. Dadurch entsteht im Kopf des Gegenübers ein Aha-Moment, weil die neue Idee an etwas Bekanntes andockt."}, {"id": "E2.vq.-FOCpMAww28.abc", "t": "abc", "abruf": 1, "vid": "-FOCpMAww28", "vq": "nach", "m": ["Aha-Moment", "CRISPR", "Fokus", "Gehirnwellen", "Idee", "Kontext", "Metapher", "Neugier", "Publikum", "Verbreitung", "Vortrag", "Weltsicht"], "q": "ABC-Liste zu «TED's secret to great public speaking | Chris Anderson»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "E2.vq.-FOCpMAww28.kawa", "t": "kawa", "abruf": 1, "vid": "-FOCpMAww28", "vq": "nach", "wort": "IDEE", "m": ["I: Idee: das eigentliche Geschenk, das ein guter Vortrag dem Publikum macht", "D: DNA-Metapher: CRISPR wird im Video mit einem Textverarbeitungsprogramm für DNA erklärt", "E: Erlaubnis durch Neugier: erst wenn das Publikum neugierig ist, lässt es sich auf die Idee ein"], "q": "KaWa zu «IDEE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "E2.vq.OQECZnM9Mjo.vor0", "vid": "OQECZnM9Mjo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele verschiedene Methoden für einen guten Einstieg in einen Vortrag stellt das Video vor?", "a": ["Drei", "Fünf", "Sieben", "Zehn"], "r": 1, "e": "Das Video zeigt genau fünf Methoden, mit denen man einen Vortrag beginnen kann."}, {"id": "E2.vq.OQECZnM9Mjo.vor1", "vid": "OQECZnM9Mjo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was empfiehlt der Sprecher, nachdem man dem Publikum eine aktivierende Frage gestellt hat?", "a": ["Sofort weiterreden, ohne Pause", "Eine Pause einlegen, damit die Leute nachdenken können", "Die Frage sofort selbst beantworten", "Das Licht im Raum ausschalten"], "r": 1, "e": "Der Sprecher betont, dass man nach einer Frage eine ausreichende Pause einlegen sollte, damit das Publikum nachdenken kann."}, {"id": "E2.v.OQECZnM9Mjo", "t": "frei", "abruf": 1, "vid": "OQECZnM9Mjo", "vq": "nach", "q": "Video «Präsentation halten: 5 perfekte erste Sätze» (Martin Wehrle): Was waren die Kernaussagen?", "m": "1. Man kann einen Vortrag beginnen, indem man das Publikum aktiviert, etwa mit einer Frage, die per Handzeichen beantwortet wird, wofür man dem Publikum bewusst eine Pause zum Nachdenken lassen sollte. 2. Ein szenischer Einstieg beschreibt eine konkrete, filmisch vorstellbare Situation aus dem Alltag der Zuhörer und stellt dazu die Frage, wie sie reagieren würden, bevor der Vortrag die Antwort liefert. 3. Ein selbstironischer Einstieg, der eigene frühere Fehler oder Schwächen zeigt, wirkt sympathischer als ein Auftritt als makelloser Experte, weil sich das Publikum dann nicht klein und unbedeutend fühlt."}, {"id": "E2.vq.OQECZnM9Mjo.nach0", "vid": "OQECZnM9Mjo", "vq": "nach", "t": "mc", "q": "Was bedeutet ein szenischer Einstieg laut Video?", "a": ["Man zeigt ein Video vom Vortrag selbst", "Man beschreibt eine Situation, die man filmen könnte", "Man liest eine wissenschaftliche Studie vor", "Man beginnt mit einer Powerpoint-Folie voller Zahlen"], "r": 1, "e": "Der Sprecher erklärt szenisch als eine Situation zu beschreiben, wie man sie mit einer Kamera filmen könnte."}, {"id": "E2.vq.OQECZnM9Mjo.nach1", "vid": "OQECZnM9Mjo", "vq": "nach", "t": "ms", "q": "Welche zwei der fünf Einstiegsmethoden nennt das Video konkret?", "a": ["Mit einem Zitat beginnen", "Sofort das Fazit vorlesen", "Selbstironisch sein", "Zuerst die Rechnung zeigen"], "r": [0, 2], "e": "Das Video nennt unter anderem den Einstieg mit einem Zitat und den selbstironischen Einstieg als zwei der fünf Methoden."}, {"id": "E2.vq.OQECZnM9Mjo.nach2", "vid": "OQECZnM9Mjo", "vq": "nach", "t": "lueck", "q": "Beim fünften Einstieg kündigt man an, was am Ende des Vortrags für das Publikum ___ sein wird.", "r": ["anders"], "e": "Der Sprecher erklärt, dass man zu Beginn ankündigt, was am Ende anders sein wird, also welchen Nutzen die Zuhörenden haben."}, {"id": "E2.vq.OQECZnM9Mjo.nach3", "vid": "OQECZnM9Mjo", "vq": "nach", "t": "frei", "q": "Wähle eine der fünf Einstiegsmethoden aus dem Video aus und formuliere damit den Anfang eines eigenen kurzen Vortrags zu einem Thema deiner Wahl.", "m": "Mit der Methode Publikum aktivieren könnte ich zum Beispiel bei einem Vortrag über Prüfungsvorbereitung fragen: Bitte ein Handzeichen, wer von Ihnen schon einmal am Abend vor einer Prüfung gedacht hat, ich hätte früher anfangen sollen. Danach würde ich kurz eine Pause lassen, damit alle nachdenken können, bevor ich zum eigentlichen Thema übergehe. So wird das Publikum direkt einbezogen, genau wie es der Sprecher im Video empfiehlt."}, {"id": "E2.vq.OQECZnM9Mjo.abc", "t": "abc", "abruf": 1, "vid": "OQECZnM9Mjo", "vq": "nach", "m": ["Einstieg", "Handzeichen", "Neugier", "Nutzenversprechen", "Pause", "Präsentation", "Publikum aktivieren", "Redner", "Selbstironie", "Szenischer Einstieg", "Vortrag", "Zitat"], "q": "ABC-Liste zu «Präsentation halten: 5 perfekte erste Sätze»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "E2.vq.OQECZnM9Mjo.kawa", "t": "kawa", "abruf": 1, "vid": "OQECZnM9Mjo", "vq": "nach", "wort": "REDNER", "m": ["R: Rede mit einer aktivierenden Frage ans Publikum beginnen", "E: Ein Zitat kann zu Beginn Neugier wecken", "D: Dreiviertelstunde Nutzenversprechen ankündigen, was am Ende anders ist", "N: Nachdenken lassen durch eine Pause nach der Frage ans Publikum"], "q": "KaWa zu «REDNER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "E2.vq.mqn6yMYIi1Y.vor0", "vid": "mqn6yMYIi1Y", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wann hat das Publikum laut Video die höchste Aufmerksamkeit für die vortragende Person?", "a": ["Nur in der Mitte des Vortrags", "Am Anfang und am Ende", "Eigentlich nie wirklich", "Nur wenn Musik läuft"], "r": 1, "e": "Das Video nennt Anfang und Ende eines Vortrags als Momente höchster Aufmerksamkeit."}, {"id": "E2.vq.mqn6yMYIi1Y.vor1", "vid": "mqn6yMYIi1Y", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Ankerpersonen solltest du dir laut Video im Publikum suchen, bevor du zu sprechen beginnst?", "a": ["Eine", "Zwei", "Drei", "So viele wie möglich"], "r": 2, "e": "Das Video empfiehlt genau drei Ankerpersonen, links, mittig und rechts im Publikum."}, {"id": "E2.v.mqn6yMYIi1Y", "t": "frei", "abruf": 1, "vid": "mqn6yMYIi1Y", "vq": "nach", "q": "Video «So solltest Du Deine Präsentation beginnen» (Stefanie Voss): Was waren die Kernaussagen?", "m": "1. Man sollte am Rednerpult erst die Technik und den eigenen Stand vollständig vorbereiten und schweigen, statt schon während des Zurechtfindens zu sprechen, weil die höchste Aufmerksamkeit des Publikums genau am Anfang liegt. 2. Vor dem ersten Satz sollte man sich drei Ankerpersonen im Publikum suchen (links, Mitte, rechts) und den Blickkontakt im Vortrag immer wieder zwischen ihnen wechseln, damit sich niemand im Raum übersehen fühlt. 3. Ein Vortrag wird klarer, wenn man erst ankündigt, was man gleich erzählt, dann den Inhalt ausführt und am Ende noch einmal zusammenfasst, was man gerade erzählt hat, weil wiederholte Informationen besser hängen bleiben."}, {"id": "E2.vq.mqn6yMYIi1Y.nach0", "vid": "mqn6yMYIi1Y", "vq": "nach", "t": "mc", "q": "Was ist laut Video der klassische Fehler, den fast alle beim Beginn einer Präsentation machen?", "a": ["Sie sprechen schon, bevor sie vorne angekommen und bereit sind", "Sie sprechen viel zu leise", "Sie stehen zu lange still", "Sie schauen zu lange auf den Boden"], "r": 0, "e": "Der klassische Fehler ist laut Video, schon während des Nach-vorne-Gehens mit dem Sprechen zu beginnen."}, {"id": "E2.vq.mqn6yMYIi1Y.nach1", "vid": "mqn6yMYIi1Y", "vq": "nach", "t": "ms", "q": "Welche zwei der drei Startschritte nennt das Video?", "a": ["Nach vorne gehen und sich einrichten", "Sofort mit der lautesten Stimme beginnen", "Augenkontakt zu drei Ankerpersonen suchen", "Den Vortrag auswendig aufsagen ohne jede Pause"], "r": [0, 2], "e": "Das Video nennt Hingehen und Einrichten sowie das Suchen von Augenkontakt als zwei der drei Startschritte."}, {"id": "E2.vq.mqn6yMYIi1Y.nach2", "vid": "mqn6yMYIi1Y", "vq": "nach", "t": "ord", "q": "Bringe die drei Schritte für einen guten Präsentationsstart aus dem Video in die richtige Reihenfolge.", "a": ["Nach vorne gehen, Platz einnehmen und kurz nichts sagen", "Auf einen guten, präsenten Stand achten", "Augenkontakt zu drei Ankerpersonen im Publikum suchen"], "e": "Genau in dieser Reihenfolge empfiehlt das Video den Start einer Präsentation."}, {"id": "E2.vq.mqn6yMYIi1Y.nach3", "vid": "mqn6yMYIi1Y", "vq": "nach", "t": "lueck", "q": "Das Wiederholungsprinzip für den Aufbau lautet: sag, was du erzählen wirst, erzähl es, und sag dann noch mal, was du gerade ___ hast.", "r": ["erzaehlt"], "e": "Diese dreifache Wiederholung hilft laut Video, dass Inhalte besser im Gedächtnis bleiben."}, {"id": "E2.vq.mqn6yMYIi1Y.nach4", "vid": "mqn6yMYIi1Y", "vq": "nach", "t": "frei", "q": "Erkläre, warum es laut Video so wichtig ist, sich am Anfang bewusst Zeit zu nehmen, bevor man zu sprechen beginnt, obwohl sich das im Moment unerträglich lang anfühlt.", "m": "Am Anfang hat das Publikum die höchste Aufmerksamkeit, deshalb lohnt es sich, erst vollständig anzukommen, bevor man spricht. Wer zu früh anfängt, wirkt unsouverän und stolpert in den Vortrag hinein, obwohl sich die kurze Pause für die vortragende Person selbst viel länger anfühlt, als sie für das Publikum wirklich ist."}, {"id": "E2.vq.mqn6yMYIi1Y.abc", "t": "abc", "abruf": 1, "vid": "mqn6yMYIi1Y", "vq": "nach", "m": ["Ankerperson", "Aufmerksamkeit", "Blickkontakt", "Einatmen", "Praesentation", "Publikum", "Redner", "Stand", "Struktur", "Vortrag", "Wiederholung"], "q": "ABC-Liste zu «So solltest Du Deine Präsentation beginnen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "E2.vq.mqn6yMYIi1Y.kawa", "t": "kawa", "abruf": 1, "vid": "mqn6yMYIi1Y", "vq": "nach", "wort": "REDNER", "m": ["R: Redner beziehungsweise Rednerin: sollte am Anfang bewusst Präsenz zeigen", "E: Einatmen: nach den drei Startschritten kurz ein- und ausatmen, bevor man loslegt", "D: Drei Ankerpersonen im Publikum suchen, bevor man zu sprechen beginnt", "N: Nichts sagen: während man sich einrichtet, spricht man noch nicht"], "q": "KaWa zu «REDNER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "E2.0", "t": "ms", "q": "Welche drei Einstiege wecken Aufmerksamkeit?", "a": ["Eine konkrete Person und Szene aus dem Fall", "Eine überraschende Zahl", "Eine offene Frage, die erst später aufgelöst wird", "«Ich begrüsse Sie herzlich zu meiner Präsentation über …»", "Die Agenda vorlesen"], "r": [0, 1, 2], "e": "Geschichte mit Figur, Spannung durch offene Schleife, Relevanz durch Zahl. Dosiert einsetzen: Es ist eine Prüfung, kein TED-Talk."}, {"id": "E2.1", "t": "mc", "q": "Was hilft gegen Lampenfieber am zuverlässigsten?", "a": ["Den Text wörtlich auswendig lernen", "Den Einstieg und den Schluss sicher können, mehrmals laut vor Publikum oder Kamera proben", "Nicht daran denken", "Kurz vorher viel Kaffee"], "r": 1, "e": "Laut proben schlägt still durchlesen. Die ersten 60 Sekunden tragen den Rest."}, {"id": "E2.2", "t": "frei", "q": "Schreibe aus dem Kopf die ersten drei Sätze deiner Präsentation.", "m": "Selbstkontrolle: Kommt eine Person oder Szene vor? Steht eine Zahl drin? Weiss die Zuhörerin nach drei Sätzen, worum es geht und warum es sie kümmern sollte? Kein «Ich möchte Ihnen heute vorstellen». Sprich die drei Sätze laut und stoppe die Zeit: höchstens 25 Sekunden."}], "videos": [{"id": "Nj-hdQMa3uA", "kanal": "TEDx Talks", "titel": "The magical science of storytelling | David JP Phillips", "dauer": "16:45"}, {"id": "-FOCpMAww28", "kanal": "TED", "titel": "TED's secret to great public speaking | Chris Anderson", "dauer": "7:57"}, {"id": "OQECZnM9Mjo", "kanal": "Martin Wehrle", "titel": "Präsentation halten: 5 perfekte erste Sätze", "dauer": "6:05"}, {"id": "mqn6yMYIi1Y", "kanal": "Stefanie Voss", "titel": "So solltest Du Deine Präsentation beginnen", "dauer": "8:15"}], "pn": 3}, {"key": "E3", "titel": "Fachgespräch und mündliche Prüfung", "warum": "IHK-Videos aus Deutschland, das Format ist aber dasselbe: Experten fragen nach.", "fragen": [{"id": "E3.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Fachgespräch und mündliche Prüfung»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: IHK-Videos aus Deutschland, das Format ist aber dasselbe: Experten fragen nach. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "E3.vq.8OUQcS8Pzuc.vor0", "vid": "8OUQcS8Pzuc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was nennt der IHK-Prüfer die beste Medizin gegen Prüfungsangst?", "a": ["Kaffee trinken", "Gute Prüfungsvorbereitung", "Gar nicht erst erscheinen", "Laut Musik hören"], "r": 1, "e": "Er sagt wörtlich, die beste Medizin gegen Prüfungsangst sei die gute Prüfungsvorbereitung."}, {"id": "E3.vq.8OUQcS8Pzuc.vor1", "vid": "8OUQcS8Pzuc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert laut dem Prüfer, wenn ein Prüfling in der Prüfung schweigt statt zu reden?", "a": ["Die Zeit läuft für ihn", "Die Zeit läuft gegen ihn", "Es hat keinen Einfluss auf die Zeit", "Die Prüfung wird automatisch verlängert"], "r": 1, "e": "Sein vierter Tipp lautet agieren statt reagieren: wer redet, für den läuft die Zeit, wer schweigt, gegen den läuft sie."}, {"id": "E3.v.8OUQcS8Pzuc", "t": "frei", "abruf": 1, "vid": "8OUQcS8Pzuc", "vq": "nach", "q": "Video «5 Tipps für mündliche Prüfungen (von einem IHK-Prüfer)» (Kai Deliomini): Was waren die Kernaussagen?", "m": "1. Prüfungsangst ist eine natürliche Stressreaktion und sollte im Voraus eingeplant statt bekämpft werden, weil das Hineinsteigern in die Nervosität mehr schadet als die Nervosität selbst. 2. In der Vorbereitungszeit sollte man möglichst viele Notizen und auswendig gelernte Definitionen aufschreiben, denn das Verwenden eigener Notizen während der mündlichen Prüfung führt zu keinem Punktabzug. 3. Wer redet, für den läuft die Zeit; wer schweigt, gegen den läuft die Zeit, deshalb sollte man auch bei einer unbeantwortbaren Frage das Gespräch aktiv in ein Thema lenken, zu dem man sicheres Wissen hat, statt zu verstummen."}, {"id": "E3.vq.8OUQcS8Pzuc.nach0", "vid": "8OUQcS8Pzuc", "vq": "nach", "t": "mc", "q": "Wie nennt der Prüfer seinen dritten Tipp zum Nutzen der Vorbereitungszeit?", "a": ["Wer schreibt, der bleibt", "Wer schweigt, gewinnt", "Zeit ist Geld", "Ruhe bewahren um jeden Preis"], "r": 0, "e": "Notizen aus der Vorbereitungszeit darf man in der Prüfung nutzen, ohne dass es Punktabzug gibt."}, {"id": "E3.vq.8OUQcS8Pzuc.nach1", "vid": "8OUQcS8Pzuc", "vq": "nach", "t": "ms", "q": "Welche zwei Verhaltensweisen empfiehlt der Prüfer für den persönlichen Eindruck in der Prüfung?", "a": ["Freundlich sein und lächeln", "Dem Prüfer zeigen, dass man mehr weiss als er", "Angemessen, aber bequem gekleidet erscheinen", "Möglichst wortkarg antworten"], "r": [0, 2], "e": "Ein freundliches Auftreten und angemessene, saubere Kleidung sollen einen guten Eindruck beim Prüfungsausschuss hinterlassen."}, {"id": "E3.vq.8OUQcS8Pzuc.nach2", "vid": "8OUQcS8Pzuc", "vq": "nach", "t": "lueck", "q": "Prüfungsangst ist laut dem Prüfer etwas ganz Natürliches und sogar dein bester ___.", "r": ["freund"], "e": "Er empfiehlt, die Angst anzunehmen statt gegen sie anzukämpfen, weil sie auch Energie freisetzt."}, {"id": "E3.vq.8OUQcS8Pzuc.nach3", "vid": "8OUQcS8Pzuc", "vq": "nach", "t": "frei", "q": "Erkläre, warum es laut dem Prüfer wichtig ist, in der Vorbereitungszeit vor der mündlichen Prüfung möglichst viele Notizen zu machen.", "m": "In der Vorbereitungszeit ist man noch nicht unter dem direkten Druck, sofort auf Fragen antworten zu müssen, und kann das eigene Wissen in Ruhe abrufen. Wer sich Definitionen und Stichpunkte notiert, kann diese Notizen laut dem Prüfer in der Prüfung ohne Punktabzug verwenden. Ausserdem hilft das Aufschreiben selbst dabei, sich die Inhalte besser zu merken, ganz nach dem Motto wer schreibt, der bleibt."}, {"id": "E3.vq.8OUQcS8Pzuc.abc", "t": "abc", "abruf": 1
