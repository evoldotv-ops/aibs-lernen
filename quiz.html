0qec", "vq": "nach", "t": "lueck", "q": "Wenn eine Veränderung nicht in der Unternehmenskultur verankert wird, fällt die Organisation laut Video oft wieder in den alten ___ zurück.", "r": ["zustand"], "e": "Ohne Verankerung in der Kultur fällt eine Organisation laut Video zurück in den alten Zustand."}, {"id": "D1.vq.TNaMO6g0qec.nach4", "vid": "TNaMO6g0qec", "vq": "nach", "t": "frei", "q": "Erkläre, warum es laut Kotter riskant ist, direkt mit der Kommunikation der Vision zu beginnen, ohne vorher eine starke Führungskoalition aufgebaut zu haben.", "m": "Ohne eine glaubwürdige Führungskoalition fehlt der Vision die nötige Unterstützung und Sachkenntnis, um von den Mitarbeitenden ernst genommen zu werden. Die Koalition sorgt dafür, dass die Botschaft überzeugend vermittelt wird und die Organisation der Veränderung folgt."}, {"id": "D1.vq.TNaMO6g0qec.abc", "t": "abc", "abruf": 1, "vid": "TNaMO6g0qec", "vq": "nach", "m": ["Dringlichkeit", "Erfolge", "Fuehrungskoalition", "Kommunikation", "Kotter", "Kultur", "Mitarbeitende", "Organisation", "Veraenderung", "Vision", "Wandel"], "q": "ABC-Liste zu «Change nach John Kotter | 8 Stufen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D1.vq.TNaMO6g0qec.kawa", "t": "kawa", "abruf": 1, "vid": "TNaMO6g0qec", "vq": "nach", "wort": "WANDEL", "m": ["W: Wandel: das zentrale Thema von Kotters 8-Stufen-Modell", "A: Akzeptanz: die Mitarbeitenden müssen von der Notwendigkeit überzeugt werden", "N: Notwendigkeit: sie zu vermitteln ist Aufgabe der ersten Phase", "D: Dringlichkeit: ein Gefühl davon zu erzeugen ist Phase eins", "E: Erfolgskoalition: eine starke Führungsmannschaft mit Glaubwürdigkeit", "L: Leading Change: Titel von Kotters Buch aus dem Jahr 1996"], "q": "KaWa zu «WANDEL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D1.vq.HeNNMZnUbhE.vor0", "vid": "HeNNMZnUbhE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Phasen hat das Change-Modell von Kurt Lewin?", "a": ["Zwei", "Drei", "Fünf", "Acht"], "r": 1, "e": "Das Modell heisst explizit Dreiphasenmodell."}, {"id": "D1.vq.HeNNMZnUbhE.vor1", "vid": "HeNNMZnUbhE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert laut Video typischerweise während der mittleren Phase (Bewegung) eines Change-Prozesses?", "a": ["Alles läuft sofort besser", "Es kommt zu einem Leistungsabfall und Konflikten", "Nichts verändert sich", "Der Prozess ist bereits abgeschlossen"], "r": 1, "e": "Weil alte Routinen aufgebrochen und neue noch nicht eingeübt sind, kommt es zu Leistungsabfall, Orientierungslosigkeit und Widerstand."}, {"id": "D1.v.HeNNMZnUbhE", "t": "frei", "abruf": 1, "vid": "HeNNMZnUbhE", "vq": "nach", "q": "Video «3 Phasen nach Kurt Lewin» (OrganisationsEntfaltung): Was waren die Kernaussagen?", "m": "1. Der Ausgangszustand ist laut Lewin ein Gleichgewicht aus bewahrenden und verändernden Kräften, weshalb es viel Energie braucht, um diesen Status quo überhaupt infrage zu stellen. 2. In der Bewegungsphase (Moving) kommt es zwangsläufig zu einem Leistungsabfall, weil alte Routinen bereits aufgebrochen, neue aber noch nicht eingeübt sind, was Konflikte und Orientierungslosigkeit auslöst. 3. Die Stabilisierungsphase (Refreezing) friert den neuen Zustand als Standard ein, kann aber misslingen, wenn die Organisation bei zu hohen Erwartungen oder falschem Zeitpunkt zum Ausgangspunkt zurückstürzt."}, {"id": "D1.vq.HeNNMZnUbhE.nach0", "vid": "HeNNMZnUbhE", "vq": "nach", "t": "mc", "q": "Wie nennt Lewin die dritte Phase, in der ein neuer Zustand zum neuen Standard erhoben wird?", "a": ["Auftauen (Unfreeze)", "Bewegung (Moving)", "Stabilisierung (Refreeze)", "Rücksturz"], "r": 2, "e": "In der Stabilisierungsphase wird der neue Zustand eingefroren und als neuer Standard festgelegt."}, {"id": "D1.vq.HeNNMZnUbhE.nach1", "vid": "HeNNMZnUbhE", "vq": "nach", "t": "ms", "q": "Welche zwei Phänomene treten laut Video typischerweise in der Übergangsphase (Bewegung) auf?", "a": ["Konflikte und Widerstände", "Sofortiger Umsatzrekord", "Orientierungslosigkeit der Mitarbeiter", "Vollständige Zufriedenheit aller"], "r": [0, 2], "e": "Konflikte, Widerstände und Orientierungslosigkeit sind typische Begleiterscheinungen der Bewegungsphase."}, {"id": "D1.vq.HeNNMZnUbhE.nach2", "vid": "HeNNMZnUbhE", "vq": "nach", "t": "lueck", "q": "Der aktuelle Zustand einer Organisation ist laut Lewin ein Ausgleich von bewahrenden und ___ Kräften.", "r": ["verändernden"], "e": "Beide Kräfte halten sich laut Modell die Waage und ergeben so ein stabiles Ausgangsniveau."}, {"id": "D1.vq.HeNNMZnUbhE.nach3", "vid": "HeNNMZnUbhE", "vq": "nach", "t": "frei", "q": "Erkläre, warum ein Change-Projekt laut Video manchmal wieder zum Ausgangspunkt zurückfällt, statt in der Stabilisierungsphase zu enden.", "m": "Manchmal waren die Erwartungen an die Veränderung zu hoch angesetzt oder es wurden wichtige Rahmenbedingungen nicht berücksichtigt, zum Beispiel ein ungeeigneter Zeitpunkt. Wenn die neue Arbeitsweise dann nicht trägt, brechen Unternehmen das Projekt ab und kehren zum alten Zustand zurück. Das Video sieht darin trotzdem einen Lerneffekt für zukünftige Veränderungsprozesse."}, {"id": "D1.vq.HeNNMZnUbhE.abc", "t": "abc", "abruf": 1, "vid": "HeNNMZnUbhE", "vq": "nach", "m": ["Auftauen", "Bewegungsphase", "Change Management", "Einfrieren", "Konflikte", "Lewin", "Orientierungslosigkeit", "Refreeze", "Stabilisierung", "Unfreeze", "Verändernde Kräfte", "Widerstand"], "q": "ABC-Liste zu «3 Phasen nach Kurt Lewin»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D1.vq.HeNNMZnUbhE.kawa", "t": "kawa", "abruf": 1, "vid": "HeNNMZnUbhE", "vq": "nach", "wort": "LEWIN", "m": ["L: Leistungsabfall: typisch in der mittleren Bewegungsphase", "E: Einfrieren (Refreeze): der neue Zustand wird zum neuen Standard", "W: Widerstand: eine häufige Reaktion in der Übergangsphase", "I: Interventionsmassnahmen lösen den alten Zustand aktiv auf", "N: Neues Niveau: das Ziel der Stabilisierungsphase"], "q": "KaWa zu «LEWIN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D1.0", "t": "ord", "q": "ADKAR: die fünf Stufen in der richtigen Reihenfolge.", "a": ["Awareness: Bewusstsein, warum die Veränderung nötig ist", "Desire: Wunsch, mitzumachen", "Knowledge: Wissen, wie es geht", "Ability: Fähigkeit, es im Alltag zu tun", "Reinforcement: Verankerung, damit es bleibt"], "e": "Diagnose-Werkzeug: Auf welcher Stufe hängt die Gruppe? Schulung (Knowledge) hilft nichts, wenn Desire fehlt."}, {"id": "D1.1", "t": "mc", "q": "Kotters acht Stufen beginnen mit:", "a": ["Kurzfristige Erfolge feiern", "Ein Gefühl der Dringlichkeit erzeugen", "Die Vision kommunizieren", "Veränderung in der Kultur verankern"], "r": 1, "e": "Dann Führungskoalition, Vision, Kommunikation, Hindernisse beseitigen, schnelle Erfolge, dranbleiben, verankern."}, {"id": "D1.2", "t": "lueck", "q": "Lewins drei Phasen: Auftauen, Verändern, ___ .", "r": ["einfrieren", "wiedereinfrieren", "wieder einfrieren", "refreeze", "stabilisieren"], "e": "Unfreeze, Change, Refreeze. Das Einfrieren (Verankern) wird am häufigsten vergessen."}, {"id": "D1.3", "t": "frei", "q": "Disponenten sagen: «Ein Algorithmus versteht unseren Markt nicht.» Auf welcher ADKAR-Stufe hängen sie, und was tust du?", "m": "Bei Desire (und teils Awareness): Sie sehen den Nutzen nicht und fürchten um ihre Expertise. Schulung wäre zu früh. Massnahmen: ihr Wissen ernst nehmen und einbauen (Prognose als Vorschlag, Disponent entscheidet), Pilot mit Freiwilligen, Vergleich Prognose gegen Bauchgefühl transparent zeigen, Rolle aufwerten statt ersetzen. Erst danach Knowledge und Ability."}], "videos": [{"id": "oMiI59NMO2Q", "kanal": "EPM", "titel": "ADKAR-Änderungsmanagementmodell", "dauer": "8:49"}, {"id": "3LczBH3PXdw", "kanal": "Innovation & Kreativität", "titel": "Change Management ADKAR-Modell", "dauer": "13:10"}, {"id": "TNaMO6g0qec", "kanal": "OrganisationsEntfaltung", "titel": "Change nach John Kotter | 8 Stufen", "dauer": "13:41"}, {"id": "HeNNMZnUbhE", "kanal": "OrganisationsEntfaltung", "titel": "3 Phasen nach Kurt Lewin", "dauer": "4:33"}], "pn": 1}, {"key": "D2", "titel": "Widerstand und Ängste", "warum": "«Die Disponenten bezweifeln, dass Algorithmen den Markt verstehen.»", "fragen": [{"id": "D2.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Widerstand und Ängste»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: «Die Disponenten bezweifeln, dass Algorithmen den Markt verstehen.» Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "D2.vq.sA-emgn_bUM.vor0", "vid": "sA-emgn_bUM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Worauf konzentriert sich Change Management laut Video, im Unterschied zum klassischen Projektmanagement?", "a": ["Auf die technischen Systeme", "Auf die Menschen und ihre emotionalen Reaktionen auf Veränderung", "Auf die Buchhaltung", "Auf die Lieferanten"], "r": 1, "e": "Das Video sagt, Projektmanagement deckt die funktionale Seite ab, Change Management die emotionale Seite der Menschen."}, {"id": "D2.vq.sA-emgn_bUM.vor1", "vid": "sA-emgn_bUM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist laut Video der dritte Tipp, um Veränderungen leichter umzusetzen?", "a": ["Die Veränderung komplett geheim halten", "Die Mitarbeitenden mitmachen und mitgestalten lassen", "Alle Veränderungen auf einmal einführen, also Big Bang", "Nur die Führungskräfte informieren"], "r": 1, "e": "Der dritte Tipp im Video lautet, Mitarbeitenden Autonomie und Mitgestaltung zu geben."}, {"id": "D2.v.sA-emgn_bUM", "t": "frei", "abruf": 1, "vid": "sA-emgn_bUM", "vq": "nach", "q": "Video «Widerstand und Emotionen in Veränderungsprozessen» (OrganisationsEntfaltung): Was waren die Kernaussagen?", "m": "1. Change scheitert oft, weil Unternehmensziele funktional kommuniziert werden, während Mitarbeitende vor allem fragen, was die Veränderung persönlich für sie bedeutet, etwa in Form von Leistungs-, Beziehungs-, Komfort-, Existenz- oder Identitätsängsten. 2. Existenzängste wie Arbeitsplatzverlust oder Gehaltseinbussen unterscheiden sich von Identitätsängsten, bei denen Mitarbeitende befürchten, dass ihre eigenen Werte nicht mehr zur veränderten Unternehmenskultur passen. 3. Drei Massnahmen senken Widerstand: die persönlichen Vorteile der Veränderung sichtbar machen, die Veränderung in kleinen Dosen statt als Big Bang einführen und Mitarbeitenden echte Mitgestaltung ermöglichen."}, {"id": "D2.vq.sA-emgn_bUM.nach0", "vid": "sA-emgn_bUM", "vq": "nach", "t": "mc", "q": "Was sind laut Video Komfortängste?", "a": ["Angst vor Gehaltskürzungen", "Sorgen um Arbeitsweg, Büro oder Arbeitsplatzsituation", "Angst vor dem kompletten Verlust des Arbeitsplatzes", "Angst vor neuen gesetzlichen Vorschriften"], "r": 1, "e": "Das Video ordnet Fragen zu Arbeitsweg und Bürosituation den Komfortängsten zu."}, {"id": "D2.vq.sA-emgn_bUM.nach1", "vid": "sA-emgn_bUM", "vq": "nach", "t": "ms", "q": "Welche zwei der drei Tipps aus dem Video helfen laut Sprecher, Veränderungen leichter umzusetzen?", "a": ["Positive Aspekte der Veränderung herausstellen", "Veränderungen dosiert in kleinen Schritten einführen", "Alle Veränderungen ohne Ankündigung über Nacht umsetzen", "Nur die oberste Führungsebene informieren"], "r": [0, 1], "e": "Das Video nennt genau diese beiden Tipps als Teil der drei Lösungen."}, {"id": "D2.vq.sA-emgn_bUM.nach2", "vid": "sA-emgn_bUM", "vq": "nach", "t": "lueck", "q": "Menschen lassen sich laut Video nicht gern von aussen verändern, deshalb entsteht bei aufgezwungenen Veränderungen ___.", "r": ["widerstand"], "e": "Das Video sagt genau das: wird eine Veränderung von aussen aufgezwungen, entsteht Widerstand."}, {"id": "D2.vq.sA-emgn_bUM.nach3", "vid": "sA-emgn_bUM", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel, welche Angst-Kategorie aus dem Video, Leistung, Beziehung, Komfort, Existenz oder Identität, am ehesten zutreffen würde, wenn du selbst versetzt würdest, und warum.", "m": "Bei einer Versetzung an einen neuen Standort wäre bei mir wohl vor allem die Komfortangst betroffen, weil sich Arbeitsweg und Bürosituation ändern würden. Gleichzeitig könnte auch eine Beziehungsangst dazukommen, weil ich mit neuen Kolleginnen und Kollegen zurechtkommen müsste. Beide Ängste sind laut Video normal und kein Zeichen von Schwäche."}, {"id": "D2.vq.sA-emgn_bUM.abc", "t": "abc", "abruf": 1, "vid": "sA-emgn_bUM", "vq": "nach", "m": ["Autonomie", "Beziehungsangst", "Big Bang", "Change Management", "Degradierung", "Emotional", "Existenzangst", "Funktional", "Identitätsangst", "Komfortangst", "Leistungsangst", "Widerstand"], "q": "ABC-Liste zu «Widerstand und Emotionen in Veränderungsprozessen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D2.vq.sA-emgn_bUM.kawa", "t": "kawa", "abruf": 1, "vid": "sA-emgn_bUM", "vq": "nach", "wort": "ANGST", "m": ["A: Autonomie: Tipp drei ist, den Mitarbeitenden mehr Selbstbestimmung zu geben", "N: Neuer Vorgesetzter: Beispiel für eine Beziehungsangst im Video", "G: Grossraumbüro: Beispiel für eine Komfortangst im Video", "S: Standortwechsel: kann laut Video mehrere Ängste gleichzeitig auslösen", "T: Tipp: Veränderungen dosiert einführen, statt alles auf einmal"], "q": "KaWa zu «ANGST»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D2.vq.lIFTvndLb8M.vor0", "vid": "lIFTvndLb8M", "vq": "vor", "t": "mc", "q": "Was glaubst du: In wie viel Prozent der gescheiterten Veränderungsprojekte liegt es laut Video nicht an der fachlichen Planung, sondern am Umgang mit den Betroffenen?", "a": ["Etwa zehn Prozent", "Etwa zwei Drittel der Fälle", "Nie, es liegt immer an der Fachlichkeit", "Genau 100 Prozent"], "r": 1, "e": "Das Video nennt rund zwei Drittel der gescheiterten Projekte, bei denen der Umgang mit den Betroffenen und nicht die fachliche Planung das Problem war."}, {"id": "D2.vq.lIFTvndLb8M.vor1", "vid": "lIFTvndLb8M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reicht es laut Video aus, Menschen nur gute Informationen und Erklärungen zu geben, um jede Form von Widerstand aufzulösen?", "a": ["Ja, das reicht bei jeder Form von Widerstand", "Nein, das hilft nur beim rationalen Widerstand, nicht bei Angst oder fehlendem Vertrauen", "Nein, Informationen verstärken jeden Widerstand", "Diese Frage wird im Video nicht behandelt"], "r": 1, "e": "Erklärungen lösen laut Video nur den rationalen Widerstand auf, bei emotionalem oder persönlich begründetem Widerstand braucht es Zuhören und Vertrauensaufbau."}, {"id": "D2.v.lIFTvndLb8M", "t": "frei", "abruf": 1, "vid": "lIFTvndLb8M", "vq": "nach", "q": "Video «Widerstand im Change» (Frank Franke): Was waren die Kernaussagen?", "m": "1. Rick Maurer unterscheidet drei Formen von Widerstand: rationalen Widerstand ('ich verstehe das nicht'), emotionalen Widerstand ('ich mag das nicht') und persönlich begründeten Widerstand ('ich mag dich nicht'). 2. Rationalem Widerstand begegnet man mit Information und Erklärung, emotionalem Widerstand dagegen nur mit echtem Zuhören und Ernstnehmen der Ängste, weil Erklärungen hier als Nichtverstehen wirken. 3. In rund zwei Dritteln gescheiterter Change-Projekte liegt der Grund laut Maurer nicht an der fachlichen Planung, sondern am schlechten Umgang mit den Betroffenen."}, {"id": "D2.vq.lIFTvndLb8M.nach0", "vid": "lIFTvndLb8M", "vq": "nach", "t": "mc", "q": "Welche Aussage steht laut Video beispielhaft für den rationalen Widerstand?", "a": ["Ich mag das nicht", "Ich verstehe das nicht", "Ich mag Sie nicht", "Ich habe keine Zeit"], "r": 1, "e": "Das Video nennt Ich verstehe das nicht als typische Aussage für rationalen Widerstand, dem man mit Information begegnen kann."}, {"id": "D2.vq.lIFTvndLb8M.nach1", "vid": "lIFTvndLb8M", "vq": "nach", "t": "mc", "q": "Was steckt laut Video hinter dem persönlich begründeten Widerstand?", "a": ["Fehlendes Vertrauen", "Fehlende technische Ausstattung", "Zu viel Information", "Ein zu hohes Gehalt"], "r": 0, "e": "Beim persönlich begründeten Widerstand, ausgedrückt durch Ich mag Sie nicht, steckt laut Video fehlendes Vertrauen dahinter."}, {"id": "D2.vq.lIFTvndLb8M.nach2", "vid": "lIFTvndLb8M", "vq": "nach", "t": "ms", "q": "Welche zwei Risiken nennt das Video, wenn man mit Widerstand falsch umgeht?", "a": ["Der Widerstand kann sich steigern und in Angst übergehen", "Es kann zu Vertrauensverlust kommen", "Die Aktienkurse steigen automatisch", "Der Change-Prozess wird automatisch schneller"], "r": [0, 1], "e": "Das Video warnt, dass falscher Umgang mit rationalem Widerstand zu mehr Angst führt und falscher Umgang mit Sorgen zu Vertrauensverlust."}, {"id": "D2.vq.lIFTvndLb8M.nach3", "vid": "lIFTvndLb8M", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der gerade ein Veränderungsprojekt leitet, was er laut Video anders machen sollte, wenn jemand sagt Ich mag das nicht, statt nur mit Erklärungen zu reagieren.", "m": "Wenn jemand sagt Ich mag das nicht, steckt laut Video meist emotionaler Widerstand wie Sorgen oder Ängste dahinter, und reine Erklärungen würden die Person dann unverstanden fühlen lassen. Stattdessen sollte man laut Video echten Dialog führen, zuhören und die Ängste ernst nehmen, statt nur Fakten zu wiederholen. So zeigt man Verständnis, was bei dieser Form von Widerstand viel wichtiger ist als zusätzliche Informationen."}, {"id": "D2.vq.lIFTvndLb8M.abc", "t": "abc", "abruf": 1, "vid": "lIFTvndLb8M", "vq": "nach", "m": ["Angst", "Change", "Cycle", "Dialog", "Emotion", "Glaubwürdigkeit", "Information", "Persönlich", "Rational", "Verständnis", "Vertrauen", "Widerstand"], "q": "ABC-Liste zu «Widerstand im Change»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D2.vq.lIFTvndLb8M.kawa", "t": "kawa", "abruf": 1, "vid": "lIFTvndLb8M", "vq": "nach", "wort": "CHANGE", "m": ["C: Cycle of Change zeigt, in welcher Phase sich jemand gerade befindet", "H: Hinter jedem Widerstand steckt entweder Information, Emotion oder Vertrauen", "A: Aussagen wie Ich verstehe das nicht zeigen rationalen Widerstand", "N: Nicht mit reinen Erklärungen auf Sorgen und Ängste reagieren", "G: Glaubwürdigkeit und Nähe braucht der Aufbau von Vertrauen", "E: Erklärungen helfen nur beim rationalen Widerstand"], "q": "KaWa zu «CHANGE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D2.vq.iDrA_BpDzeU.vor0", "vid": "iDrA_BpDzeU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woher kommen laut der Expertin über 90% der Sicherheitsvorfälle im Zusammenhang mit Sprachmodellen in Unternehmen?", "a": ["Von Hackerangriffen auf Rechenzentren", "Davon, dass Mitarbeitende unangemeldet die kostenlose Version nutzen und Originaldaten eingeben", "Von fehlerhafter Software der Anbieter", "Von zu langsamen Internetverbindungen"], "r": 1, "e": "Die Expertin nennt als Hauptursache, dass Mitarbeitende die kostenlose, unangemeldete Version eines Chatbots nutzen und dabei echte, sensible Originaldaten eingeben."}, {"id": "D2.vq.iDrA_BpDzeU.vor1", "vid": "iDrA_BpDzeU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Empfiehlt die Expertin, heute schon eigene Finanz- oder Gesundheitsdaten mit einem Sprachmodell zu teilen?", "a": ["Ja, das sei völlig unproblematisch", "Nein, sie rät ausdrücklich davon ab, Stand heute", "Nur bei bezahlten Versionen uneingeschränkt", "Nur wenn man ein Passwort setzt"], "r": 1, "e": "Ihr allererster Rat ist, aktuell keine Finanzdaten, Kreditkarteninformationen oder tiefe Gesundheitsdaten mit einem Large Language Model zu teilen."}, {"id": "D2.v.iDrA_BpDzeU", "t": "frei", "abruf": 1, "vid": "iDrA_BpDzeU", "vq": "nach", "q": "Video «Zwischen KI-Angst und Aufbruch: Warum wir Ambiguitätstoleranz lernen müssen | Sarah Rojewski» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Sarah Rojewski verweist auf eine Statistik, wonach über 90 Prozent der Sicherheitsvorfälle im Bereich Sprachmodelle dadurch entstehen, dass Mitarbeitende unangemeldet kostenlose Chatbot-Versionen mit Originaldaten nutzen. 2. Sie rät, auf individueller Ebene grundsätzlich keine Finanzdaten, Kreditkarteninformationen oder tiefen Gesundheitsdaten in Chatbots einzugeben, auch wenn sich die Interaktion sehr persönlich und vertrauenswürdig anfühlt. 3. Sie plädiert für Ambiguitätstoleranz als Schlüsselkompetenz im Umgang mit KI, also gleichzeitig positive Effekte anzuerkennen und Kritik zu äussern, ohne ins Lager von KI-Euphorie oder KI-Ablehnung zu kippen."}, {"id": "D2.vq.iDrA_BpDzeU.nach0", "vid": "iDrA_BpDzeU", "vq": "nach", "t": "mc", "q": "Was versteht die Expertin unter 'Ambiguitätstoleranz' im Zusammenhang mit KI?", "a": ["Die Fähigkeit, KI komplett zu ignorieren", "Gleichzeitig Begeisterung und Kritik gegenüber KI aushalten zu können, ohne zum KI-Hasser zu werden", "Nur noch positive Dinge über KI zu sagen", "Alle Entscheidungen komplett der KI zu überlassen"], "r": 1, "e": "Sie beschreibt Ambiguitätstoleranz als die Fähigkeit, positive Effekte und berechtigte Kritik an KI gleichzeitig zuzulassen, ohne in eine extreme Position zu kippen."}, {"id": "D2.vq.iDrA_BpDzeU.nach1", "vid": "iDrA_BpDzeU", "vq": "nach", "t": "mc", "q": "Wie beschreibt die Expertin Europas Position im globalen KI-Wettbewerb?", "a": ["Europa ist klarer Marktführer", "Europa kann bestenfalls 'Fast Mover' sein, nicht 'First Mover'", "Europa hat keinerlei Rückstand", "Europa führt bei der Finanzierung von KI-Firmen"], "r": 1, "e": "Sie sagt, angesichts der jahrzehntelangen Finanzierungsvorsprünge der USA könne Europa bestenfalls schnell nachziehen, aber nicht führend sein."}, {"id": "D2.vq.iDrA_BpDzeU.nach2", "vid": "iDrA_BpDzeU", "vq": "nach", "t": "ms", "q": "Welche zwei Empfehlungen gibt die Expertin für den persönlichen Umgang mit KI-Sicherheit?", "a": ["Keine Finanz- oder Kreditkartendaten mit einem Chatbot teilen", "Alle privaten Daten bedenkenlos in die Gratisversion eingeben", "Bezahlte Versionen bevorzugen, wenn Vertraulichkeit wichtig ist", "Nie wieder ein Sprachmodell benutzen"], "r": [0, 2], "e": "Sie rät, keine sensiblen Finanzdaten zu teilen und eher bezahlte Versionen mit Datenschutz-Agreement zu nutzen."}, {"id": "D2.vq.iDrA_BpDzeU.nach3", "vid": "iDrA_BpDzeU", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, was die Expertin mit 'Ambiguitätstoleranz' meint und wo du selbst schon einmal beide Gefühle, Begeisterung und Skepsis gegenüber einer neuen Technologie, gleichzeitig hattest.", "m": "Ambiguitätstoleranz bedeutet, widersprüchliche Gefühle gegenüber einer Sache gleichzeitig zulassen zu können, zum Beispiel Faszination für die Möglichkeiten einer neuen Technologie und gleichzeitig berechtigte Sorge über ihre Risiken, ohne sich sofort für ein Lager entscheiden zu müssen. Das kann zum Beispiel bei der Nutzung von KI im Alltag der Fall sein, wenn man den Nutzen schätzt, aber gleichzeitig beim Datenschutz vorsichtig bleibt."}, {"id": "D2.vq.iDrA_BpDzeU.abc", "t": "abc", "abruf": 1, "vid": "iDrA_BpDzeU", "vq": "nach", "m": ["Ambiguitätstoleranz", "Chatbot", "Datenschutz", "Fast Mover", "Finanzdaten", "Frontier Labs", "Gesundheitsdaten", "Integration Manager", "KI-Bubble", "Mindset", "Originaldaten", "Sicherheitsvorfälle", "Telefonica"], "q": "ABC-Liste zu «Zwischen KI-Angst und Aufbruch: Warum wir Ambiguitätstoleranz lernen müssen | Sarah Rojewski»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D2.vq.iDrA_BpDzeU.kawa", "t": "kawa", "abruf": 1, "vid": "iDrA_BpDzeU", "vq": "nach", "wort": "MINDSET", "m": ["M: Mindset-Frage: Verstehe ich die Symbiose zwischen Mensch und Maschine?", "I: Integration Manager ist eine Weiterbildung, die die Expertin selbst gerade macht.", "N: Nur bei bezahlten Versionen gibt es oft die Zusage, dass Daten nicht fürs Training genutzt werden.", "D: Datenschutz beginnt für sie schon beim Verzicht auf Finanz- und Gesundheitsdaten in Gratisversionen.", "S: Sicherheitsvorfälle entstehen laut Expertin meist durch unbedachte Nutzung der Gratisversion.", "E: Europa sei bestenfalls 'Fast Mover', nicht 'First Mover', bei der KI-Entwicklung.", "T: Toleranz für Ambiguität heisst, Begeisterung und Kritik gegenüber KI gleichzeitig auszuhalten."], "q": "KaWa zu «MINDSET»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D2.0", "t": "ms", "q": "Welche drei Ängste stecken typischerweise hinter Widerstand gegen KI?", "a": ["Jobverlust oder Entwertung der eigenen Erfahrung", "Kontrollverlust und Überwachung", "Überforderung durch neue Technik", "Zu wenig Parkplätze"], "r": [0, 1, 2], "e": "Widerstand ist Information, kein Störfall. F2: hindernde und fördernde Faktoren der Akzeptanz identifizieren."}, {"id": "D2.1", "t": "mc", "q": "Was ist die schwächste erste Reaktion auf Widerstand?", "a": ["Zuhören und Gründe erfragen", "Mit besseren Folien die Vorteile noch einmal erklären", "Betroffene am Pilot beteiligen", "Offen sagen, was sich ändert und was nicht"], "r": 1, "e": "Mehr Argumente gegen Gefühle wirken nicht. Erst verstehen, dann beteiligen, dann informieren."}, {"id": "D2.2", "t": "mc", "q": "Der CEO sagt an der Betriebsversammlung: «KI macht uns 20 % effizienter.» Was hört die Belegschaft?", "a": ["Wir bekommen bessere Werkzeuge", "Jede fünfte Stelle ist in Gefahr", "Nichts Besonderes", "Mehr Lohn"], "r": 1, "e": "Kommunikation aus Sicht der Empfänger prüfen. Aussagen zu Stellen, Rollen und Zeitplan gehören ehrlich und früh auf den Tisch."}, {"id": "D2.3", "t": "frei", "q": "Wie misst du Akzeptanz, statt sie zu behaupten?", "m": "Nutzungsquote (wie oft wird der Vorschlag der KI übernommen, wie oft umgangen). Kurze Pulsbefragung vor und nach dem Pilot. Anzahl und Art der Supportanfragen und Beschwerden. Freiwillige Anmeldungen für Schulungen oder Multiplikatoren-Rollen. Qualitative Rückmeldungen aus Sprechstunden. Je mit Zielwert und Zeitpunkt."}], "videos": [{"id": "sA-emgn_bUM", "kanal": "OrganisationsEntfaltung", "titel": "Widerstand und Emotionen in Veränderungsprozessen", "dauer": "12:22"}, {"id": "lIFTvndLb8M", "kanal": "Frank Franke", "titel": "Widerstand im Change", "dauer": "4:22"}, {"id": "iDrA_BpDzeU", "kanal": "Christoph Magnussen", "titel": "Zwischen KI-Angst und Aufbruch: Warum wir Ambiguitätstoleranz lernen müssen | Sarah Rojewski", "dauer": "1:13:09"}], "pn": 2}, {"key": "D3", "titel": "Wissensmanagement", "warum": "F6, Critical Incident 05 (Lernhausen).", "fragen": [{"id": "D3.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Wissensmanagement»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: F6, Critical Incident 05 (Lernhausen). Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "D3.vq.W6Eqj8LwFO4.vor0", "vid": "W6Eqj8LwFO4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert im Beispiel des Videos mit dem Wissen über ein Produkt, wenn der einzige zuständige Mitarbeiter in Rente geht, ohne dass es Wissensmanagement gibt?", "a": ["das Wissen bleibt automatisch im System erhalten", "niemand kann die Fragen dazu mehr beantworten, weil es niemand sonst in der Tiefe weiss", "ein anderes Unternehmen übernimmt automatisch das Wissen", "das Produkt wird sofort eingestellt"], "r": 1, "e": "Im Video kann Nina viele Fragen zum Produkt ihres in Rente gegangenen Vorgängers nicht beantwortet bekommen, weil niemand sonst das Wissen in dieser Tiefe hat."}, {"id": "D3.vq.W6Eqj8LwFO4.vor1", "vid": "W6Eqj8LwFO4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wo findet Paul im Szenario MIT Wissensmanagement die aktuelle Agenda für das nächste Meeting?", "a": ["er muss dutzende E-Mails durchsuchen", "er ruft jeden Kollegen einzeln an", "in einem gemeinsam geteilten Wiki, das alle Projektmitglieder bearbeiten können", "es gibt gar keine Agenda mehr"], "r": 2, "e": "Im Szenario mit Wissensmanagement legt Paul die Agenda in einem Wiki an, das alle Projektmitarbeitenden einsehen und kommentieren können, statt E-Mail-Chaos zu erzeugen."}, {"id": "D3.v.W6Eqj8LwFO4", "t": "frei", "abruf": 1, "vid": "W6Eqj8LwFO4", "vq": "nach", "q": "Video «Wissensmanagement im Unternehmen» (Communardo GmbH): Was waren die Kernaussagen?", "m": "1. Ohne dokumentiertes Wissen in Wiki oder Server muss bei Ausfall einer Person (Krankheit, Ruhestand) das Wissen über zeitraubende E-Mail- und Rückfrage-Ketten mühsam rekonstruiert werden. 2. Ein zentrales Wiki mit geteilten Agenden und Kommentarfunktion verhindert, dass bei Projektmeetings widersprüchliche Versionen kursieren und wichtige Punkte wie der Treffpunkt vergessen werden. 3. Gutes Wissensmanagement beschleunigt die Einarbeitung neuer Mitarbeitender, weil sie über das Intranet gezielt auf die für sie relevanten, bereits dokumentierten Wissensbereiche und Expertinnen zugreifen können."}, {"id": "D3.vq.W6Eqj8LwFO4.nach0", "vid": "W6Eqj8LwFO4", "vq": "nach", "t": "mc", "q": "Warum verliert Vera im Szenario OHNE Wissensmanagement Zeit, als Marc krank wird?", "a": ["weil sie nicht weiss, wo die bisherigen Entwürfe der Postkampagne liegen und das erst per Mail klären muss", "weil sie selbst krank wird", "weil das Marketingteam aufgelöst wird", "weil der Kunde absagt"], "r": 0, "e": "Im Video muss Vera erst umständlich per Mail klären, wo die Entwürfe liegen und wer woran weiterarbeitet, weil es kein zentrales Wiki gibt."}, {"id": "D3.vq.W6Eqj8LwFO4.nach1", "vid": "W6Eqj8LwFO4", "vq": "nach", "t": "ms", "q": "Welche zwei Vorteile bringt das Wiki im Szenario MIT Wissensmanagement laut Video?", "a": ["alle sehen dieselbe, aktuelle Version der Agenda", "neue Mitarbeitende wie Nina finden Informationen und Ansprechpersonen leichter", "die Firma braucht keine Mitarbeitenden mehr", "Krankheiten werden dadurch verhindert"], "r": [0, 1], "e": "Das Video zeigt, dass das Wiki eine gemeinsame, aktuelle Informationsquelle bietet und Nina dank Wiki und Expertenverzeichnis schneller Antworten findet."}, {"id": "D3.vq.W6Eqj8LwFO4.nach2", "vid": "W6Eqj8LwFO4", "vq": "nach", "t": "lueck", "q": "Bevor der Vorgänger von Nina in Rente ging, hat er sein Produktwissen im Szenario mit Wissensmanagement detailliert im ___ festgehalten.", "r": ["wiki"], "e": "Das Video zeigt, dass das Produktwissen des Vorgängers im Wiki detailliert dokumentiert wurde, bevor er in Rente ging."}, {"id": "D3.vq.W6Eqj8LwFO4.nach3", "vid": "W6Eqj8LwFO4", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wie ein einfaches Wiki in einem kleinen Team das Problem lösen könnte, das Vera im Video mit den fehlenden Entwürfen hat.", "m": "Ein Wiki würde allen Teammitgliedern jederzeit Zugriff auf denselben aktuellen Stand geben, ohne dass jemand extra danach fragen muss. Wird jemand krank, können die anderen sofort im Wiki nachschauen, statt erst mehrere E-Mails zu schreiben. So bleibt das Wissen im Team erhalten, selbst wenn eine einzelne Person kurzfristig ausfällt."}, {"id": "D3.vq.W6Eqj8LwFO4.abc", "t": "abc", "abruf": 1, "vid": "W6Eqj8LwFO4", "vq": "nach", "m": ["Dokumentation", "Einarbeitung", "Expertenverzeichnis", "Intranet", "Kommentar", "Kompetenz", "Onboarding", "Produktwissen", "Server", "Wiki", "Wissensmanagement", "Zusammenarbeit"], "q": "ABC-Liste zu «Wissensmanagement im Unternehmen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D3.vq.W6Eqj8LwFO4.kawa", "t": "kawa", "abruf": 1, "vid": "W6Eqj8LwFO4", "vq": "nach", "wort": "WISSEN", "m": ["W: Wiki: zentraler Ort, an dem Entwürfe und Wissen für alle sichtbar liegen", "I: Intranet: erklärt Nina schon am ersten Tag per Video, wie es funktioniert", "S: Server: sortiert Inhalte zentral und macht sie für Berechtigte zugänglich", "E: Expertinnen und Experten: im Profibereich findbar, wenn man selbst nicht weiterkommt", "N: Neueinsteiger wie Nina: profitieren am meisten von dokumentiertem Wissen"], "q": "KaWa zu «WISSEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D3.vq.FTq8JTccT_8.vor0", "vid": "FTq8JTccT_8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie heisst der Wissenschaftler, von dem das im Video vorgestellte Bausteinmodell stammt?", "a": ["Probst", "Kotter", "Hyatt", "Lewin"], "r": 0, "e": "Das Video stellt das Bausteinmodell von Probst vor, das im Wissensmanagement weit verbreitet ist."}, {"id": "D3.vq.FTq8JTccT_8.vor1", "vid": "FTq8JTccT_8", "vq": "vor", "t": "mc", "q": "Was glaubst du: In wie viele Ebenen ist das Bausteinmodell laut Video unterteilt?", "a": ["In eine einzige Ebene", "In eine strategische und eine operative Ebene", "In drei gleichwertige Ebenen", "In fünf Ebenen"], "r": 1, "e": "Das Video unterteilt das Modell in eine strategische Ebene und eine Ebene des operativen Umgangs mit Wissen."}, {"id": "D3.v.FTq8JTccT_8", "t": "frei", "abruf": 1, "vid": "FTq8JTccT_8", "vq": "nach", "q": "Video «Bausteine-Modell im Wissensmanagement» (Gabriele Vollmar): Was waren die Kernaussagen?", "m": "1. Das Bausteinemodell von Probst gliedert Wissensmanagement in eine strategische Ebene (Wissensziele, Wissensbewertung) und eine operative Ebene mit den Bausteinen Identifikation, Erwerb, Entwicklung, Verteilung, Nutzung und Bewahrung. 2. Wissen zu erwerben (z.B. über Berater) muss immer mit eigener Wissensentwicklung verknüpft werden, sonst verschwindet das Wissen wieder, sobald der externe Träger die Organisation verlässt. 3. Die grösste Schwäche des Modells in der Praxis ist, dass Organisationen die strategische Ebene und die Anbindung an die Unternehmensstrategie oft weglassen und den Kreislauf fälschlich als einfachen linearen statt als vernetzten Prozess verstehen."}, {"id": "D3.vq.FTq8JTccT_8.nach0", "vid": "FTq8JTccT_8", "vq": "nach", "t": "mc", "q": "Was passiert laut Video, wenn ein Unternehmen fehlendes Wissen nur von aussen einkauft, ohne es intern weiterzuentwickeln?", "a": ["Das Wissen bleibt automatisch für immer im Unternehmen", "Das Unternehmen ist so schlau wie vorher, wenn der Berater geht", "Die Kosten sinken automatisch", "Es entstehen keinerlei Risiken"], "r": 1, "e": "Das Video warnt davor, dass die Organisation so dumm wie vorher bleibt, wenn eingekauftes Wissen nicht an eine eigene Wissensentwicklung angeknüpft wird."}, {"id": "D3.vq.FTq8JTccT_8.nach1", "vid": "FTq8JTccT_8", "vq": "nach", "t": "ms", "q": "Welche zwei Bausteine nennt das Video auf der operativen Ebene des Wissensmanagements?", "a": ["Wissen identifizieren", "Den Aktienkurs prüfen", "Wissen bewahren", "Ein neues Firmenlogo entwerfen"], "r": [0, 2], "e": "Wissen identifizieren und Wissen bewahren sind zwei der operativen Bausteine, die das Video im Modell von Probst beschreibt."}, {"id": "D3.vq.FTq8JTccT_8.nach2", "vid": "FTq8JTccT_8", "vq": "nach", "t": "lueck", "q": "Damit die richtige Information zur richtigen Zeit bei der richtigen Person ist, muss Wissen im Unternehmen geteilt und ___ werden.", "r": ["verteilt"], "e": "Das Video nennt genau diese Formulierung, Wissen muss geteilt und verteilt werden, damit es dort ankommt, wo es gebraucht wird."}, {"id": "D3.vq.FTq8JTccT_8.nach3", "vid": "FTq8JTccT_8", "vq": "nach", "t": "frei", "q": "Erkläre, warum das Bausteinmodell laut Video trotz seiner einfachen Struktur auch ein Risiko birgt.", "m": "Das Modell ist bewusst einfach und leicht verständlich aufgebaut, damit Organisationen es praktisch nutzen können. Genau diese Einfachheit führt aber dazu, dass viele Unternehmen die strategische Ebene, also die Anbindung an die eigentliche Unternehmensstrategie, vernachlässigen. Ausserdem wird der Kreislauf oft zu starr als lineare Abfolge verstanden, obwohl die einzelnen Wissensprozesse laut Video eigentlich eng miteinander vernetzt sind."}, {"id": "D3.vq.FTq8JTccT_8.abc", "t": "abc", "abruf": 1, "vid": "FTq8JTccT_8", "vq": "nach", "m": ["Bausteinmodell", "Bewahren", "Entwickeln", "Erwerben", "Identifizieren", "Nutzen", "Probst", "Rad neu erfinden", "Strategische Ebene", "Teilen", "Wissensmanagement", "Wissensziele"], "q": "ABC-Liste zu «Bausteine-Modell im Wissensmanagement»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D3.vq.FTq8JTccT_8.kawa", "t": "kawa", "abruf": 1, "vid": "FTq8JTccT_8", "vq": "nach", "wort": "WISSEN", "m": ["W: Wissensziele auf der strategischen Ebene zuerst definieren", "I: Identifizieren, wo im Unternehmen welches Wissen schon vorhanden ist", "S: Schützen vor Verlust, zum Beispiel wenn Mitarbeitende das Unternehmen verlassen", "E: Erwerben von aussen oder selbst entwickeln, wenn Wissen fehlt", "N: Nutzen des vorhandenen Wissens, sonst wird das Rad immer wieder neu erfunden"], "q": "KaWa zu «WISSEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D3.vq.0WK6iNRX9oE.vor0", "vid": "0WK6iNRX9oE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viel Prozent ihrer täglichen Arbeitszeit verbringen Mitarbeitende laut Video mit der Suche nach Informationen?", "a": ["Etwa 5 Prozent", "Etwa 20 Prozent", "Etwa 50 Prozent", "Etwa 80 Prozent"], "r": 1, "e": "Das Video nennt fast 20 Prozent der täglichen Arbeitszeit für die Informationssuche."}, {"id": "D3.vq.0WK6iNRX9oE.vor1", "vid": "0WK6iNRX9oE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist der Nachteil von einfachen Custom-GPT-Chatbots gegenüber RAG-Modellen?", "a": ["Sie sind laut Video viel teurer", "Sie basieren auf einem festen Datensatz und müssen manuell aktualisiert werden", "Sie funktionieren nur auf Englisch", "Es gibt laut Video gar keinen Unterschied"], "r": 1, "e": "Custom GPTs arbeiten laut Video mit einem festen Datensatz, der manuell aktuell gehalten werden muss."}, {"id": "D3.v.0WK6iNRX9oE", "t": "frei", "abruf": 1, "vid": "0WK6iNRX9oE", "vq": "nach", "q": "Video «KI-Tools für smartes Wissensmanagement: Custom GPTs & RAG» (Digitalzentrum Berlin): Was waren die Kernaussagen?", "m": "1. Personalisierte Chatbots wie Custom GPTs oder NotebookLM eignen sich für kleine bis mittlere, weitgehend statische Wissensbestände, müssen aber manuell aktualisiert werden. 2. RAG-Modelle (Retrieval Augmented Generation) zerlegen Dokumente in kleinere Teile, machen sie über Vektor-Repräsentationen durchsuchbar und können so in Echtzeit auf dynamische, wachsende Datenquellen zugreifen. 3. Beide Ansätze erfordern bei sensiblen Daten eine genaue Prüfung von Speicherort und Datenschutz, besonders bei cloudbasierten Lösungen."}, {"id": "D3.vq.0WK6iNRX9oE.nach0", "vid": "0WK6iNRX9oE", "vq": "nach", "t": "mc", "q": "Wofür steht die Abkürzung RAG laut Video?", "a": ["Random Access Generation", "Retrieval Augmented Generation", "Rapid AI Growth", "Real-time Automated Grouping"], "r": 1, "e": "Das Video erklärt RAG ausdrücklich als Retrieval Augmented Generation."}, {"id": "D3.vq.0WK6iNRX9oE.nach1", "vid": "0WK6iNRX9oE", "vq": "nach", "t": "ms", "q": "Welche zwei Grenzen nennt das Video für den Custom-GPT-Ansatz?", "a": ["Maximal 10 Dateien", "Unbegrenzte Dateigrösse", "Eine Gesamtgrösse von 100 MB", "Eine unbegrenzte Anzahl an Dateien"], "r": [0, 2], "e": "Custom GPTs erlauben laut Video bis zu 10 Dateien mit einer Gesamtgrösse von 100 MB."}, {"id": "D3.vq.0WK6iNRX9oE.nach2", "vid": "0WK6iNRX9oE", "vq": "nach", "t": "lueck", "q": "Bei einem RAG-Modell werden Dokumente in kleinere Teile aufgeteilt und dann als ___ suchbar gemacht, damit relevante Passagen schnell gefunden werden.", "r": ["vektorrepraesentation", "vektor"], "e": "Die kleinen Textteile werden laut Video als Vektorrepräsentation suchbar gemacht."}, {"id": "D3.vq.0WK6iNRX9oE.nach3", "vid": "0WK6iNRX9oE", "vq": "nach", "t": "frei", "q": "Erkläre, wann sich laut Video eher ein einfacher Custom-GPT-Chatbot eignet und wann eher ein RAG-Modell sinnvoller ist.", "m": "Ein Custom-GPT-Chatbot eignet sich laut Video für kleine bis mittlere, eher statische Wissensbestände mit häufig gestellten Fragen. Bei grossen, dynamischen Datenmengen, die sich laufend ändern, ist dagegen ein RAG-Modell sinnvoller, weil es in Echtzeit auf aktuelle Datenquellen zugreift."}, {"id": "D3.vq.0WK6iNRX9oE.abc", "t": "abc", "abruf": 1, "vid": "0WK6iNRX9oE", "vq": "nach", "m": ["Chatbot", "Custom GPT", "Datenbank", "Datenschutz", "Infrastruktur", "Laufwerke", "NotebookLM", "Podcast", "RAG", "Suche", "Vektorrepraesentation", "Wissensmanagement"], "q": "ABC-Liste zu «KI-Tools für smartes Wissensmanagement: Custom GPTs & RAG»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D3.vq.0WK6iNRX9oE.kawa", "t": "kawa", "abruf": 1, "vid": "0WK6iNRX9oE", "vq": "nach", "wort": "CHATBOT", "m": ["C: Chatbot: personalisierter Assistent, der auf hochgeladene Dokumente antwortet", "H: Hochladen: eigene Dokumente werden für den Chatbot hochgeladen", "A: Aktualisierung: bei einfachen Tools muss der Datensatz manuell aktualisiert werden", "T: Teile: Dokumente werden für RAG in kleinere Teile aufgeteilt", "B: Begrenzung: Custom GPTs erlauben nur bis zu 10 Dateien und 100 MB", "O: Option: RAG-Modelle sind die bessere Option bei grossen, dynamischen Datenmengen"], "q": "KaWa zu «CHATBOT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D3.0", "t": "ms", "q": "Welche gehören zu den Bausteinen des Wissensmanagements nach Probst? Wähle vier.", "a": ["Wissensziele", "Wissensidentifikation", "Wissens(ver)teilung", "Wissensbewahrung", "Wissenssteuer"], "r": [0, 1, 2, 3], "e": "Alle acht: Ziele, Identifikation, Erwerb, Entwicklung, Verteilung, Nutzung, Bewahrung, Bewertung."}, {"id": "D3.1", "t": "mc", "q": "Was ist eine Community of Practice?", "a": ["Ein Pflichtkurs", "Eine freiwillige Gruppe von Praktikerinnen und Praktikern, die regelmässig Erfahrungen zu einem Thema austauscht", "Eine Abteilung", "Ein Wiki"], "r": 1, "e": "F6 nennt sie wörtlich, zusammen mit Key Usern. Sie hält Wissen lebendig, das in keinem Handbuch steht."}, {"id": "D3.2", "t": "mc", "q": "Mitarbeitende haben 40 eigene KI-Agenten gebaut, niemand hat den Überblick. Beste Reaktion?", "a": ["Alle stoppen", "Registrieren statt stoppen: Inventar, einfache Regeln, gute Beispiele sichtbar machen, Riskantes absichern", "Ignorieren", "Einen Wettbewerb ausrufen"], "r": 1, "e": "So bleibt die Energie erhalten, und Wissen wird geteilt statt versteckt. Kern von Critical Incident 05."}, {"id": "D3.3", "t": "frei", "q": "Skizziere eine Strategie, um KI-Wissen langfristig zu verankern (F6). Vier Elemente.", "m": "1. Lernpfade je Rolle (Grundlagen für alle, Vertiefung für Key User). 2. Community of Practice mit festen Terminen und Sprechstunde. 3. Bibliothek: geprüfte Prompts, Anwendungsfälle, Regeln, gepflegt mit klarer Zuständigkeit. 4. Rollen mit Zeitanteil (Multiplikatoren) und Kennzahlen (Teilnahme, Nutzung, Beiträge). Verankerung in Onboarding und Zielvereinbarung."}], "videos": [{"id": "W6Eqj8LwFO4", "kanal": "Communardo GmbH", "titel": "Wissensmanagement im Unternehmen", "dauer": "7:12"}, {"id": "FTq8JTccT_8", "kanal": "Gabriele Vollmar", "titel": "Bausteine-Modell im Wissensmanagement", "dauer": "6:04"}, {"id": "0WK6iNRX9oE", "kanal": "Digitalzentrum Berlin", "titel": "KI-Tools für smartes Wissensmanagement: Custom GPTs & RAG", "dauer": "4:57"}], "pn": 3}, {"key": "D4", "titel": "IT-Betrieb: Incident, Problem, Change", "warum": "E1 und E2: Was passiert, wenn die KI-Lösung im Betrieb ausfällt.", "fragen": [{"id": "D4.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «IT-Betrieb: Incident, Problem, Change»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: E1 und E2: Was passiert, wenn die KI-Lösung im Betrieb ausfällt. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "D4.vq.uFsgTIxn8eo.vor0", "vid": "uFsgTIxn8eo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woraus setzt sich der Begriff Schwachstelle laut Video zusammen?", "a": ["Aus Ursache und Wirkung", "Aus Kosten und Nutzen", "Aus Zeit und Geld", "Aus Software und Hardware"], "r": 0, "e": "Das Video definiert Schwachstelle als Ursache plus Wirkung."}, {"id": "D4.vq.uFsgTIxn8eo.vor1", "vid": "uFsgTIxn8eo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist ein Workaround laut Video?", "a": ["Ein neuer Mitarbeiter", "Eine Umgehungslösung für eine Störung", "Ein Softwareupdate", "Ein Vertragsdokument"], "r": 1, "e": "Ein Workaround ist eine Umgehungslösung, die genutzt wird, bis die eigentliche Ursache behoben ist."}, {"id": "D4.v.uFsgTIxn8eo", "t": "frei", "abruf": 1, "vid": "uFsgTIxn8eo", "vq": "nach", "q": "Video «Unterschied zwischen Incident Management und Problem Management» (Thomas Grosser): Was waren die Kernaussagen?", "m": "1. Eine Schwachstelle besteht aus Ursache (Fehler) und Wirkung (spürbarer Defekt); der Anwender meldet immer die Wirkung, nicht die Ursache. 2. Das Incident Management behebt Störungen möglichst schnell, notfalls mit einem Workaround, während das Problem Management erst dann eingeschaltet wird, wenn die Ursache einer Störung unbekannt ist. 3. Ist die Ursache gefunden, entsteht ein Request for Change (RFC), der an das Change Management weitergeleitet wird, während in der Zwischenzeit ein Workaround weitere Anwender mit derselben Störung versorgt."}, {"id": "D4.vq.uFsgTIxn8eo.nach0", "vid": "uFsgTIxn8eo", "vq": "nach", "t": "mc", "q": "Wer ist laut Video für die rasche Behebung einer gemeldeten Störung (Wirkung) zuständig?", "a": ["Das Change Management", "Das Incident Management", "Das Problem Management", "Der Anwender selbst"], "r": 1, "e": "Das Incident Management kümmert sich um die schnelle Abwicklung der gemeldeten Störungen."}, {"id": "D4.vq.uFsgTIxn8eo.nach1", "vid": "uFsgTIxn8eo", "vq": "nach", "t": "ms", "q": "Welche zwei Schritte folgen laut Video, wenn das Problem Management die Ursache einer Softwarestörung gefunden hat?", "a": ["Ein Request for Change (RFC) wird erstellt", "Der Computer wird sofort ausgetauscht", "Ein Workaround wird in der Zwischenzeit definiert", "Der Anwender wird entlassen"], "r": [0, 2], "e": "Nach dem Finden der Ursache wird ein RFC ans Change Management weitergeleitet, während zwischenzeitlich ein Workaround hilft."}, {"id": "D4.vq.uFsgTIxn8eo.nach2", "vid": "uFsgTIxn8eo", "vq": "nach", "t": "frei", "q": "Erkläre am Beispiel eines Computers ohne Stromanschluss, wie Incident Management und Problem Management laut Video zusammenspielen.", "m": "Meldet ein Anwender, dass sein Computer nicht angeht, prüft das Incident Management zuerst einfache Ursachen wie den Stromanschluss. Ist das die Ursache, ist die Störung sofort durch das Incident Management behoben, ohne dass das Problem Management eingeschaltet werden muss. Erst wenn die Ursache unklar bleibt, etwa bei einer Softwarestörung, übernimmt das Problem Management die tiefere Ursachensuche."}, {"id": "D4.vq.uFsgTIxn8eo.abc", "t": "abc", "abruf": 1, "vid": "uFsgTIxn8eo", "vq": "nach", "m": ["Anwender", "Change Management", "Fehler", "Incident Management", "Problem Management", "Request for Change", "RFC", "Schwachstelle", "Störung", "Ursache", "Wirkung", "Workaround"], "q": "ABC-Liste zu «Unterschied zwischen Incident Management und Problem Management»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D4.vq.uFsgTIxn8eo.kawa", "t": "kawa", "abruf": 1, "vid": "uFsgTIxn8eo", "vq": "nach", "wort": "URSACHE", "m": ["U: Ursache: der Grund für eine negative Wirkung", "R: RFC (Request for Change): wird erstellt, sobald die Ursache gefunden ist", "S: Störung: eine andere Bezeichnung für die Wirkung beim Anwender", "A: Anwender: meldet sich zuerst beim Incident Management", "C: Change Management: erhält den RFC zur weiteren Bearbeitung", "H: Hilfslösung (Workaround): überbrückt die Zeit bis zur echten Lösung", "E: Effektiv beendet eine gefundene Ursache, zum Beispiel der fehlende Stromanschluss, die Störung sofort"], "q": "KaWa zu «URSACHE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D4.vq.XmeiCoWD8Jc.vor0", "vid": "XmeiCoWD8Jc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht die Abkürzung ITIL?", "a": ["Internet Technology Information Line", "IT Infrastructure Library", "International Technical Incident List", "Interactive Task and Issue Log"], "r": 1, "e": "Das Video sagt ausdrücklich, ITIL steht für IT Infrastructure Library."}, {"id": "D4.vq.XmeiCoWD8Jc.vor1", "vid": "XmeiCoWD8Jc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert laut Video zuerst, wenn ein Benutzer beim Servicedesk anruft, weil sein Drucker nicht funktioniert?", "a": ["Sofort wird ein komplett neues Gerät bestellt", "Der Servicedesk prüft im Incident Management, ob die Ursache schon bekannt ist", "Der Fall geht direkt an das Change Management", "Der Benutzer muss selbst die Software neu installieren"], "r": 1, "e": "Der Servicedesk führt laut Video zuerst das Incident Management aus und prüft auf bekannte Ursachen."}, {"id": "D4.v.XmeiCoWD8Jc", "t": "frei", "abruf": 1, "vid": "XmeiCoWD8Jc", "vq": "nach", "q": "Video «Kleiner Überblick Servicemanagement (ITIL)» (Thomas Grosser): Was waren die Kernaussagen?", "m": "1. Der Servicedesk ist die zentrale Anlaufstelle, die bekannte Fehler (known errors) direkt im Incident Management löst, unbekannte Ursachen aber an das Problem Management weiterreicht. 2. Ein Request for Change (RFC) landet je nach Fehlergrösse entweder direkt bei der Entwicklung oder wird zu einem eigenen Projekt mit Vorstudie, Hauptstudie, Detailstudie, Realisierung und Einführung. 3. Nach dem Testen sichert das Release Management die Software in der Definitive Media Library (DML), während das Configuration Management den aktuellen Software-Status in der CMDB dokumentiert."}, {"id": "D4.vq.XmeiCoWD8Jc.nach0", "vid": "XmeiCoWD8Jc", "vq": "nach", "t": "mc", "q": "Wohin wird ein Problem laut Video weitergeleitet, wenn die Ursache eines Fehlers noch unbekannt ist?", "a": ["An das Release Management", "An das Problem Management", "Direkt an die CMDB", "An den Benutzer zurück"], "r": 1, "e": "Ist die Ursache unbekannt, wird das Problem laut Video an das Problem Management weitergeleitet."}, {"id": "D4.vq.XmeiCoWD8Jc.nach1", "vid": "XmeiCoWD8Jc", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge werden laut Video im Release Management beziehungsweise Configuration Management gespeichert?", "a": ["Die komplette Software in der DML, der Definitive Media Library", "Der Status der Software in der CMDB, der Configuration Management Database", "Die privaten Telefonnummern der Benutzer", "Die Gehaltsdaten der IT-Mitarbeitenden"], "r": [0, 1], "e": "Das Video nennt DML und CMDB ausdrücklich als diese zwei Speicherorte."}, {"id": "D4.vq.XmeiCoWD8Jc.nach2", "vid": "XmeiCoWD8Jc", "vq": "nach", "t": "lueck", "q": "Ein RFC ist laut Video ein request for ___ und wird an das Change Management weitergeleitet.", "r": ["change"], "e": "RFC steht laut Video für request for change, also die Anfrage, eine Änderung durchzuführen."}, {"id": "D4.vq.XmeiCoWD8Jc.nach3", "vid": "XmeiCoWD8Jc", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen an einem eigenen Beispiel, was der Unterschied zwischen einem Incident und einem Problem im Sinne des Videos wäre.", "m": "Ein Incident ist die konkrete Störung, die ein Benutzer gerade meldet, zum Beispiel ein Drucker, der nicht druckt. Ein Problem ist dagegen die dahinterliegende Ursache, die gesucht werden muss, wenn diese Störung immer wieder auftritt und noch unklar ist. Erst wenn die Ursache gefunden ist, kann über das Change Management eine dauerhafte Lösung eingeführt werden."}, {"id": "D4.vq.XmeiCoWD8Jc.abc", "t": "abc", "abruf": 1, "vid": "XmeiCoWD8Jc", "vq": "nach", "m": ["Change Management", "CMDB", "DML", "Incident Management", "ITIL", "Known Error", "Matrixorganisation", "Problem Management", "Release Management", "RFC", "Servicedesk", "Workaround"], "q": "ABC-Liste zu «Kleiner Überblick Servicemanagement (ITIL)»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D4.vq.XmeiCoWD8Jc.kawa", "t": "kawa", "abruf": 1, "vid": "XmeiCoWD8Jc", "vq": "nach", "wort": "ITIL", "m": ["I: Incident Management: der erste Prozess, den der Servicedesk ausführt", "T: Testen: nach der Entwicklung wird ein behobener Fehler getestet", "L: Library: ITIL steht für IT Infrastructure Library"], "q": "KaWa zu «ITIL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D4.vq.mw7CC1dddrY.vor0", "vid": "mw7CC1dddrY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele feste Prozesse definiert ITIL 4 laut Video, im Gegensatz zu den 26 Prozessen von ITIL v3?", "a": ["Genau 34 feste Prozesse", "Keine festen Prozesse mehr, sondern Practices und einen ganzheitlichen Ansatz", "Genau 10 feste Prozesse", "Doppelt so viele wie ITIL v3"], "r": 1, "e": "Laut Video definiert ITIL 4 keine spezifischen Prozesse mehr, sondern verfolgt einen ganzheitlichen Ansatz mit Practices."}, {"id": "D4.vq.mw7CC1dddrY.vor1", "vid": "mw7CC1dddrY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ist Organizational Change Management in ITIL 4 laut Video ein klassischer Prozess?", "a": ["Ja, ganz klar ein Prozess", "Nein, es stellt den Menschen in den Mittelpunkt und ist eher keine klassische Prozess-Practice", "Es kommt in ITIL 4 gar nicht vor", "Es ersetzt alle anderen Practices komplett"], "r": 1, "e": "Das Video nennt Organizational Change Management als Beispiel für eine Practice, die die meisten Organisationen nicht als klassischen Prozess verstehen würden."}, {"id": "D4.v.mw7CC1dddrY", "t": "frei", "abruf": 1, "vid": "mw7CC1dddrY", "vq": "nach", "q": "Video «ITIL 4 Prozessmodell» (ITIL-Prozesslandkarte): Was waren die Kernaussagen?", "m": "1. ITIL 4 schreibt anders als ITIL v3 (26 feste Prozesse) keine festen Prozesse mehr vor, sondern definiert Practices innerhalb eines ganzheitlichen Service Value Systems. 2. Organizational Change Management ist in ITIL 4 zwar als Practice enthalten, wird von den meisten Organisationen aber nicht als klassischer Prozess verstanden, weil es die menschliche statt die technische Seite von Veränderung behandelt. 3. Bekannte ITIL-v3-Prozesse wie Incident Management bleiben unter ITIL 4 als bewährte Praktiken weiter nutzbar; Organisationen müssen ihre eigenen Prozesse trotzdem selbst definieren, weil ITIL 4 dafür keine feste Vorlage mehr liefert."}, {"id": "D4.vq.mw7CC1dddrY.nach0", "vid": "mw7CC1dddrY", "vq": "nach", "t": "mc", "q": "Woraus besteht das ITIL Service Value System laut Video unter anderem?", "a": ["Leitprinzipien, Governance, Service-Wertschöpfungskette, Practices und kontinuierliche Verbesserung", "Nur aus einer einzigen Checkliste", "Ausschliesslich aus Kundenbewertungen", "Aus 26 nummerierten Prozessen"], "r": 0, "e": "Das Video zählt Leitprinzipien, Governance, die Service-Wertschöpfungskette, Practices und kontinuierliche Verbesserung als Bestandteile des Service Value Systems auf."}, {"id": "D4.vq.mw7CC1dddrY.nach1", "vid": "mw7CC1dddrY", "vq": "nach", "t": "mc", "q": "Nach welchem internationalen Standard richtet sich das im Video vorgestellte Jasmin-Prozessmodell besonders?", "a": ["ISO 20000", "ISO 9001", "DIN EN 12345", "RFC 2549"], "r": 0, "e": "Das Video nennt ISO 20000 als internationalen Standard für Service Management, an dem sich das schlankere Prozessmodell orientiert."}, {"id": "D4.vq.mw7CC1dddrY.nach2", "vid": "mw7CC1dddrY", "vq": "nach", "t": "lueck", "q": "Beim Incident Management durchsucht der First Level Support laut Video zuerst die ___, bevor der Vorfall einem bestehenden Problem zugeordnet wird.", "r": ["knowledge base", "wissensdatenbank"], "e": "Das Video beschreibt, dass nach der ersten Analyse zuerst die Knowledge Base durchsucht wird, bevor der Incident einem bestehenden Problem zugeordnet wird."}, {"id": "D4.vq.mw7CC1dddrY.nach3", "vid": "mw7CC1dddrY", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der ITIL v3 kennt, in eigenen Worten, was sich laut Video mit ITIL 4 grundlegend verändert hat.", "m": "Während ITIL v3 noch 26 klar definierte Prozesse entlang eines Service Lifecycle vorgab, verfolgt ITIL 4 laut Video einen ganzheitlichen Ansatz ohne feste Prozessvorgaben, dafür mit Practices und einem Service Value System. Das bedeutet nicht, dass Organisationen keine Prozesse mehr brauchen, sie müssen ihre Prozesse aber selbst definieren, orientiert an den Practices. Deshalb bietet das Video mit dem Jasmin-Modell eine pragmatische, schlankere Umsetzung an, die sich an ISO 20000 orientiert."}, {"id": "D4.vq.mw7CC1dddrY.abc", "t": "abc", "abruf": 1, "vid": "mw7CC1dddrY", "vq": "nach", "m": ["Design", "Governance", "Incident", "ITIL", "Knowledgebase", "Lifecycle", "Practice", "Prozess", "Service", "Standard", "Verbesserung", "Wertschöpfung"], "q": "ABC-Liste zu «ITIL 4 Prozessmodell»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D4.vq.mw7CC1dddrY.kawa", "t": "kawa", "abruf": 1, "vid": "mw7CC1dddrY", "vq": "nach", "wort": "SERVICE", "m": ["S: Service Value System bündelt alle Kernkomponenten von ITIL 4", "E: Ein ganzheitlicher Ansatz ersetzt die 26 festen Prozesse von ITIL v3", "R: Richtlinien wie ISO 20000 sind Massstab für schlanke Prozessmodelle", "V: Verbesserung läuft bei ITIL 4 kontinuierlich statt einmalig ab", "I: Incident Management durchsucht zuerst die Knowledge Base", "C: Change Management stellt in ITIL 4 den Menschen in den Mittelpunkt"], "q": "KaWa zu «SERVICE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D4.0", "t": "mc", "q": "Der KI-Dienst ist ausgefallen, der Support stellt ihn per Neustart wieder her. Welcher ITIL-Prozess war das?", "a": ["Problem Management", "Incident Management", "Change Enablement", "Capacity Management"], "r": 1, "e": "Incident = Störung so schnell wie möglich beheben. Die Ursache ist damit noch nicht gefunden."}, {"id": "D4.1", "t": "mc", "q": "Derselbe Ausfall kommt jede Woche. Welcher Prozess sucht die Ursache?", "a": ["Incident Management", "Problem Management", "Service Desk", "Release Management"], "r": 1, "e": "Problem = Ursache wiederkehrender Incidents finden und dauerhaft beseitigen."}, {"id": "D4.2", "t": "mc", "q": "Das Modell soll durch eine neue Version ersetzt werden. Welcher Prozess stellt sicher, dass das kontrolliert geschieht?", "a": ["Incident Management", "Problem Management", "Change Enablement (Change Management)", "Keiner"], "r": 2, "e": "Change = Änderungen bewerten, freigeben, planen, mit Rückfallplan. Bei KI: vorher gegen Referenzdaten testen (Champion/Challenger)."}, {"id": "D4.3", "t": "frei", "q": "Was pflegst du in einem KI-Portfolio (E1), und warum interessiert das den IT-Betrieb?", "m": "Je Lösung: Zweck, Produktverantwortliche, Anbieter und Modell, genutzte Daten und Schutzstufe, Schnittstellen und Abhängigkeiten, Risikoklasse, Kennzahlen, Status. Der IT-Betrieb braucht das für Incidents (wen anrufen), Changes (was hängt dran) und Compliance-Prüfungen. Ohne Inventar merkt niemand, wenn ein Modell-Update drei andere Lösungen bricht."}], "videos": [{"id": "uFsgTIxn8eo", "kanal": "Thomas Grosser", "titel": "Unterschied zwischen Incident Management und Problem Management", "dauer": "2:20"}, {"id": "XmeiCoWD8Jc", "kanal": "Thomas Grosser", "titel": "Kleiner Überblick Servicemanagement (ITIL)", "dauer": "3:02"}, {"id": "mw7CC1dddrY", "kanal": "ITIL-Prozesslandkarte", "titel": "ITIL 4 Prozessmodell", "dauer": "7:48"}], "pn": 5}, {"key": "D5", "titel": "Laufend verbessern, Wissen teilen", "warum": "E4 (kontinuierlicher Verbesserungsprozess) und F6 (Communities of Practice, Key User).", "fragen": [{"id": "D5.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Laufend verbessern, Wissen teilen»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: E4 (kontinuierlicher Verbesserungsprozess) und F6 (Communities of Practice, Key User). Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "D5.vq.0s73-nXrnT8.vor0", "vid": "0s73-nXrnT8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür stehen die vier Buchstaben PDCA?", "a": ["Plan, Design, Check, Act", "Plan, Do, Check, Act", "Prepare, Do, Control, Analyse", "Process, Data, Cost, Analysis"], "r": 1, "e": "PDCA steht für Plan, Do, Check, Act, die vier Schritte des Zyklus."}, {"id": "D5.vq.0s73-nXrnT8.vor1", "vid": "0s73-nXrnT8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Sollte man eine neue Massnahme im PDCA-Zyklus zuerst im ganz grossen Stil ausrollen oder erst im Kleinen testen?", "a": ["Sofort im ganz grossen Stil ausrollen", "Erst im kleinen Stil testen, z.B. an einer einzigen Produktvariante", "Gar nicht testen, nur planen reicht", "Nur am Wochenende testen"], "r": 1, "e": "In der Do-Phase wird die Massnahme laut Video zunächst im kleinen Stil getestet, damit es im Fehlerfall nicht so teuer wird."}, {"id": "D5.v.0s73-nXrnT8", "t": "frei", "abruf": 1, "vid": "0s73-nXrnT8", "vq": "nach", "q": "Video «Der PDCA-Zyklus einfach erklärt, mit 2 Beispielen» (Projekte leicht gemacht): Was waren die Kernaussagen?", "m": "1. Im PDCA-Zyklus (Plan, Do, Check, Act) sollten neue Massnahmen in der Do-Phase zunächst im kleinen Rahmen getestet werden, etwa an einem Wochentag oder einem einzelnen Produkt, bevor sie im grossen Stil ausgerollt werden. 2. Auch wenn beim Check die Zielwerte nicht voll erreicht werden, aber die Richtung stimmt, kann die Änderung trotzdem freigegeben werden, um sie im nächsten Durchlauf weiter zu verbessern. 3. Der heute bekannte PDCA-Zyklus geht auf Shewharts dreistufiges Konzept der 1930er-Jahre zurück, wurde von Deming zum vierstufigen Deming-Rad weiterentwickelt und über Seminare in Japan zu PDCA umbenannt."}, {"id": "D5.vq.0s73-nXrnT8.nach0", "vid": "0s73-nXrnT8", "vq": "nach", "t": "mc", "q": "Was passiert in der 'Do'-Phase des PDCA-Zyklus laut Video?", "a": ["Der Ist-Zustand wird zum ersten Mal analysiert", "Die geplante Massnahme wird im kleinen, überschaubaren Stil getestet", "Die Massnahme wird sofort unternehmensweit eingeführt", "Es wird nichts getan, nur beobachtet"], "r": 1, "e": "In der Do-Phase wird die Massnahme zunächst im kleinen Stil ausprobiert, zum Beispiel nur bei einer Tortensorte."}, {"id": "D5.vq.0s73-nXrnT8.nach1", "vid": "0s73-nXrnT8", "vq": "nach", "t": "mc", "q": "Was macht man laut Video, wenn die Ziele beim Check nicht ganz erreicht wurden, aber die Richtung stimmt?", "a": ["Man verwirft die Änderung komplett", "Man kann die Änderung trotzdem einführen und im nächsten Zyklus weiter verbessern", "Man muss von vorne mit einer neuen Firma beginnen", "Man wartet ein ganzes Jahr ab, ohne etwas zu tun"], "r": 1, "e": "Auch eine Teilverbesserung lohnt sich laut Video sofort umzusetzen, den Rest kann man im nächsten PDCA-Durchlauf angehen."}, {"id": "D5.vq.0s73-nXrnT8.nach2", "vid": "0s73-nXrnT8", "vq": "nach", "t": "ms", "q": "Welche zwei historischen Personen werden im Video mit der Entwicklung des PDCA-Zyklus in Verbindung gebracht?", "a": ["Walter Shewhart", "Albert Einstein", "William Edwards Deming", "Isaac Newton"], "r": [0, 2], "e": "Shewhart entwickelte die Grundidee, Deming machte sie populär und brachte sie später nach Japan, wo daraus PDCA wurde."}, {"id": "D5.vq.0s73-nXrnT8.nach3", "vid": "0s73-nXrnT8", "vq": "nach", "t": "lueck", "q": "Deming selbst bevorzugte später eine eigene Variante namens PDSA, bei der das 'Check' durch das Wort ___ ersetzt wurde, weil es mehr als nur Datenabgleich bedeutet.", "r": ["study"], "e": "Deming wollte mit 'Study' betonen, dass man die Ergebnisse wirklich analytisch versteht, statt nur Messwerte abzugleichen."}, {"id": "D5.vq.0s73-nXrnT8.nach4", "vid": "0s73-nXrnT8", "vq": "nach", "t": "frei", "q": "Erkläre am Beispiel des Biskuitbodens aus dem Video, wie ein kompletter PDCA-Durchlauf ablaufen könnte.", "m": "Im Plan-Schritt stellt der Konditor fest, dass Kunden sich über einen zu kompakten Biskuitboden beschweren, und plant eine neue Rezeptur. Im Do-Schritt testet er die neue Rezeptur zunächst nur bei der Erdbeertorte statt beim ganzen Sortiment. Im Check-Schritt prüft er, ob den Kunden der neue Boden schmeckt, und im Act-Schritt übernimmt er die Rezeptur bei Erfolg für alle Tortensorten als neuen Standard."}, {"id": "D5.vq.0s73-nXrnT8.abc", "t": "abc", "abruf": 1, "vid": "0s73-nXrnT8", "vq": "nach", "m": ["Act", "Check", "Deming", "Do", "Kontinuierlicher Verbesserungsprozess", "Konzept", "PDSA", "Pilotproduktion", "Plan", "Qualitätsmanagement", "Shewhart", "Standard", "Ziel"], "q": "ABC-Liste zu «Der PDCA-Zyklus einfach erklärt, mit 2 Beispielen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D5.vq.0s73-nXrnT8.kawa", "t": "kawa", "abruf": 1, "vid": "0s73-nXrnT8", "vq": "nach", "wort": "PDCA", "m": ["P: Plan ist die erste Phase, in der der Ist-Zustand analysiert und Ziele festgelegt werden.", "D: Do bedeutet, die geplanten Massnahmen zuerst im kleinen Stil zu testen.", "C: Check vergleicht die Ergebnisse des Tests mit den erwarteten Zielen.", "A: Act bedeutet, bei Erfolg die Änderung im grossen Stil zum neuen Standard zu machen."], "q": "KaWa zu «PDCA»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D5.vq.xuV9x5-u6nI.vor0", "vid": "xuV9x5-u6nI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Auf wie vielen Ebenen einer Organisation findet KVP laut Video statt?", "a": ["nur in der Führungsetage", "nur an der Basis", "auf allen Ebenen, von der Führung bis zur Basis", "KVP betrifft nur die IT-Abteilung"], "r": 2, "e": "Das Video sagt ausdrücklich, KVP finde auf allen Ebenen der Organisation statt, von der Führungsetage bis zur Basis."}, {"id": "D5.vq.xuV9x5-u6nI.vor1", "vid": "xuV9x5-u6nI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reicht es beim dritten Schritt des KVP, nur zu prüfen, ob die geplante Arbeit erledigt wurde?", "a": ["ja, das reicht vollständig aus", "nein, man soll unbedingt auch die Wirksamkeit prüfen, nicht nur die geleistete Arbeit", "nein, man darf überhaupt nichts prüfen", "das Video sagt dazu nichts"], "r": 1, "e": "Das Video betont ausdrücklich, man solle bei der Umsetzung die Wirksamkeit prüfen und nicht nur, ob die Arbeit geleistet wurde."}, {"id": "D5.v.xuV9x5-u6nI", "t": "frei", "abruf": 1, "vid": "xuV9x5-u6nI", "vq": "nach", "q": "Video «Kontinuierlicher Verbesserungsprozess | KVP einfach erklärt» (HYMER #EMPOWERMENT): Was waren die Kernaussagen?", "m": "1. KVP ist eine unternehmensweite Philosophie, die auf allen Hierarchieebenen ständig und proaktiv Prozesse, Produkte und Dienstleistungen verbessern soll. 2. Ein wirksamer KVP braucht Mitarbeiterbeteiligung, klare Verbesserungsziele und regelmässiges Feedback als Schlüsselelemente. 3. Der KVP-Ablauf folgt vier Schritten: Fokus und Ist-Analyse festlegen, Verbesserungsaktivitäten planen, die Wirksamkeit prüfen und daraus für den nächsten Durchlauf lernen."}, {"id": "D5.vq.xuV9x5-u6nI.nach0", "vid": "xuV9x5-u6nI", "vq": "nach", "t": "mc", "q": "Was ist laut Video das oberste Ziel des kontinuierlichen Verbesserungsprozesses?", "a": ["die Maximierung der Kundenzufriedenheit", "die schnellstmögliche Schliessung des Unternehmens", "die Abschaffung aller Prozesse", "die Reduktion der Mitarbeiterzahl auf null"], "r": 0, "e": "Das Video nennt die Maximierung der Kundenzufriedenheit als oberstes Prinzip des KVP, neben Effizienz und Qualität."}, {"id": "D5.vq.xuV9x5-u6nI.nach1", "vid": "xuV9x5-u6nI", "vq": "nach", "t": "ms", "q": "Welche zwei Schlüsselelemente für einen wirksamen KVP nennt das Video?", "a": ["Mitarbeiterbeteiligung", "klare Verbesserungsziele", "das vollständige Verbot von Feedback", "eine einmalige Massnahme ohne Wiederholung"], "r": [0, 1], "e": "Das Video nennt Mitarbeiterbeteiligung und klare Verbesserungsziele als zwei der Schlüsselelemente für einen wirksamen KVP."}, {"id": "D5.vq.xuV9x5-u6nI.nach2", "vid": "xuV9x5-u6nI", "vq": "nach", "t": "ord", "q": "Bringe die vier Schritte der KVP-Umsetzung laut Video in die richtige Reihenfolge.", "a": ["Fokus und Ziel definieren, bestehende Prozesse analysieren", "Verbesserungsaktivitäten planen, zum Beispiel Workshops", "Umsetzung durchführen und Wirksamkeit prüfen", "reflektieren, was gelernt wurde, und den Prozess weiterentwickeln"], "e": "Das Video beschreibt genau diese vier Schritte in dieser Reihenfolge als zyklischen Ablauf des KVP."}, {"id": "D5.vq.xuV9x5-u6nI.nach3", "vid": "xuV9x5-u6nI", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wieso KVP laut Video eher eine Denkweise als nur ein einmaliges Projekt ist.", "m": "KVP soll laut Video nicht einmal durchgeführt und dann abgehakt werden, sondern ständig und auf allen Ebenen weiterlaufen. Nach jeder Verbesserung folgt wieder eine Analyse, eine Planung, eine Umsetzung und eine Reflexion, wodurch ein sich wiederholender Zyklus entsteht. Deshalb beschreibt das Video KVP als eine Denkweise, die Unternehmen aktiv mitgestalten lässt, statt als abgeschlossenes Projekt."}, {"id": "D5.vq.xuV9x5-u6nI.abc", "t": "abc", "abruf": 1, "vid": "xuV9x5-u6nI", "vq": "nach", "m": ["Effizienz", "Feedback", "Kundenzufriedenheit", "KVP", "Methodensammlung", "Mitarbeiterbeteiligung", "Qualität", "Ressourcen", "Verbesserungsprozess", "Wirksamkeitsprüfung", "Workshop", "Zyklus"], "q": "ABC-Liste zu «Kontinuierlicher Verbesserungsprozess | KVP einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D5.vq.xuV9x5-u6nI.kawa", "t": "kawa", "abruf": 1, "vid": "xuV9x5-u6nI", "vq": "nach", "wort": "PROZESS", "m": ["P: Planung der Verbesserungsaktivitäten: zweiter Schritt der Umsetzung", "R: Ressourcen: müssen für Workshops bereitgestellt werden", "O: Optimierung: ständiges Ziel des kontinuierlichen Verbesserungsprozesses", "Z: Zyklischer Ansatz: nach jeder Verbesserung beginnt der Prozess von neuem", "E: Effizienzsteigerung: eines der klar definierten Ziele des KVP", "S: Stillstand: wird im Video als gleichbedeutend mit Rückschritt beschrieben"], "q": "KaWa zu «PROZESS»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D5.vq.xgWPUYj6v0w.vor0", "vid": "xgWPUYj6v0w", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht die Abkürzung CoP im Video?", "a": ["Chief of Product", "Community of Practice", "Circle of Peers", "Center of Performance"], "r": 1, "e": "Das Video erklärt CoP als Community of Practice, eine Gruppe mit gemeinsamem Anliegen."}, {"id": "D5.vq.xgWPUYj6v0w.vor1", "vid": "xgWPUYj6v0w", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welchen Vorteil nennt das Video besonders im Zusammenhang mit vermehrtem Remote-Arbeiten?", "a": ["Höhere Reisebudgets", "Ein konstruktives soziales Umfeld für Austausch", "Weniger Meetings insgesamt", "Automatische Gehaltserhöhungen"], "r": 1, "e": "Das Video nennt, dass Cops in Zeiten von Remote-Arbeiten ein konstruktives soziales Umfeld für professionellen Austausch bieten können."}, {"id": "D5.v.xgWPUYj6v0w", "t": "frei", "abruf": 1, "vid": "xgWPUYj6v0w", "vq": "nach", "q": "Video «Was ist eine Community of Practice?» (QualityMinds GmbH): Was waren die Kernaussagen?", "m": "1. Eine Community of Practice ist eine Gruppe von Menschen mit einem gemeinsamen fachlichen Anliegen, die durch regelmässige Zusammenarbeit gemeinsam lernt, wie sie etwas besser machen kann. 2. Communities of Practice machen implizites Wissen aus den Köpfen einzelner Mitarbeitender explizit und sichern es dauerhaft im Wissensnetzwerk der Organisation. 3. Über den Austausch in Communities of Practice lassen sich fehlende Fertigkeiten im Team identifizieren, was Stellenausschreibungen und Rekrutierung gezielter macht."}, {"id": "D5.vq.xgWPUYj6v0w.nach0", "vid": "xgWPUYj6v0w", "vq": "nach", "t": "mc", "q": "Wie hilft eine Community of Practice laut Video bei der Rekrutierung?", "a": ["Sie ersetzt komplett die Personalabteilung", "Sie hilft, fehlende Fertigkeiten im Team zu identifizieren", "Sie garantiert automatisch mehr Bewerbungen", "Sie senkt die Gehaltskosten direkt"], "r": 1, "e": "Das Video sagt, dass eine Cop hilft, fehlende Fertigkeiten im Team zu erkennen, wodurch Stellenausschreibungen gezielter werden."}, {"id": "D5.vq.xgWPUYj6v0w.nach1", "vid": "xgWPUYj6v0w", "vq": "nach", "t": "ms", "q": "Welche zwei Vorteile einer Community of Practice nennt das Video?", "a": ["Implizites Wissen wird explizit gemacht", "Automatische Umsatzsteigerung", "Ein konstruktives soziales Umfeld", "Kostenlose Firmenwagen"], "r": [0, 2], "e": "Das Video nennt sowohl das Sichtbarmachen von implizitem Wissen als auch ein konstruktives soziales Umfeld als Vorteile."}, {"id": "D5.vq.xgWPUYj6v0w.nach2", "vid": "xgWPUYj6v0w", "vq": "nach", "t": "lueck", "q": "In einer Cop wird implizites Wissen einzelner Mitarbeitender durch Austausch ___ gemacht.", "r": ["explizit"], "e": "Das Video sagt wörtlich, dass implizites Wissen durch den Austausch in der Cop explizit gemacht werden kann."}, {"id": "D5.vq.xgWPUYj6v0w.nach3", "vid": "xgWPUYj6v0w", "vq": "nach", "t": "frei", "q": "Erkläre, wo du schon einmal eine Situation erlebt hast, die einer Community of Practice aus dem Video ähnelt, also eine Gruppe, die regelmässig zusammenkommt, um gemeinsam besser zu werden.", "m": "Zum Beispiel in einem Sportverein oder einer Lerngruppe treffen sich Menschen regelmässig, tauschen Erfahrungen aus und geben sich gegenseitig Tipps, wie sie etwas besser machen können. Genau wie bei einer Cop im Video wird dabei Wissen sichtbar gemacht, das vorher nur bei einzelnen Personen im Kopf war, und die ganze Gruppe profitiert davon. Auch das Gefühl von sozialem Zusammenhalt, das das Video erwähnt, entsteht dabei ganz nebenbei."}, {"id": "D5.vq.xgWPUYj6v0w.abc", "t": "abc", "abruf": 1, "vid": "xgWPUYj6v0w", "vq": "nach", "m": ["Austausch", "Community of Practice", "Erfahrung", "Fertigkeit", "Implizites Wissen", "Rekrutierung", "Remote-Arbeiten", "Resilienz", "Silo", "Wissensnetzwerk", "Wohlbefinden", "Workshop"], "q": "ABC-Liste zu «Was ist eine Community of Practice?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D5.vq.xgWPUYj6v0w.kawa", "t": "kawa", "abruf": 1, "vid": "xgWPUYj6v0w", "vq": "nach", "wort": "AUSTAUSCH", "m": ["A: Austausch mit Menschen aus anderen Bereichen bricht Wissenssilos auf", "U: Umfeld, sozial und konstruktiv, besonders wichtig beim Remote-Arbeiten", "S: Sichtbar machen von implizitem Wissen durch regelmässigen Austausch", "T: Team-übergreifendes Lernen macht die Rekrutierung zielgerichteter", "C: Cop steht als Abkürzung für Community of Practice", "H: Hilft dabei, fehlende Fertigkeiten im Team zu identifizieren"], "q": "KaWa zu «AUSTAUSCH»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D5.vq.SmqLyOLIjos.vor0", "vid": "SmqLyOLIjos", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ist jede Nachbarschaft automatisch eine Community of Practice?", "a": ["Ja, immer", "Nein, meistens nicht, weil dafür geteiltes Lernen und eine gemeinsame Praxis fehlen", "Ja, aber nur in Städten", "Nein, Nachbarschaften existieren laut Video gar nicht"], "r": 1, "e": "Das Video nennt eine Nachbarschaft ausdrücklich als Beispiel, das meist keine Community of Practice ist."}, {"id": "D5.vq.SmqLyOLIjos.vor1", "vid": "SmqLyOLIjos", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reicht es für eine Community of Practice, dass alle Mitglieder denselben Job oder Titel haben?", "a": ["Ja, das allein reicht", "Nein, sie müssen zusätzlich miteinander interagieren und gemeinsam lernen", "Nein, sie dürfen nicht denselben Job haben", "Ja, aber nur bei Ingenieuren"], "r": 1, "e": "Laut Video reicht derselbe Titel nicht, es braucht echte Interaktion und gemeinsames Lernen."}, {"id": "D5.v.SmqLyOLIjos", "t": "frei", "abruf": 1, "vid": "SmqLyOLIjos", "vq": "nach", "q": "Video «Communities of Practice (Etienne and Beverly Wenger-Trayner)» (Skills Academia): Was waren die Kernaussagen?", "m": "1. Eine Community of Practice entsteht erst durch das Zusammenspiel von drei Merkmalen: einem gemeinsamen Interessensgebiet (Domain), einer aktiv interagierenden Gemeinschaft (Community) und einer geteilten Praxis (Practice). 2. Eine Nachbarschaft oder eine Webseite allein ist keine Community of Practice, solange die Mitglieder nicht regelmässig gemeinsam interagieren und voneinander lernen. 3. Mitglieder einer Community of Practice entwickeln ein geteiltes Repertoire aus Erfahrungen, Geschichten, Werkzeugen und Lösungswegen für wiederkehrende Probleme."}, {"id": "D5.vq.SmqLyOLIjos.nach0", "vid": "SmqLyOLIjos", "vq": "nach", "t": "mc", "q": "Was ist mit dem Merkmal 'The Domain' bei einer Community of Practice gemeint?", "a": ["Ein zufälliges Treffen ohne gemeinsames Thema", "Ein geteiltes Interessengebiet, das Identität und gemeinsame Kompetenz schafft", "Eine physische Adresse", "Eine Mitgliedskarte"], "r": 1, "e": "The Domain beschreibt laut Video das gemeinsame Interessengebiet, das der Gruppe eine Identität gibt."}, {"id": "D5.vq.SmqLyOLIjos.nach1", "vid": "SmqLyOLIjos", "vq": "nach", "t": "ms", "q": "Welche zwei weiteren Merkmale nennt das Video neben The Domain?", "a": ["The Community", "The Practice", "The Budget", "The Logo"], "r": [0, 1], "e": "Das Video nennt genau drei Merkmale: Domain, Community und Practice."}, {"id": "D5.vq.SmqLyOLIjos.nach2", "vid": "SmqLyOLIjos", "vq": "nach", "t": "lueck", "q": "Mitglieder einer Community of Practice entwickeln ein gemeinsames ___ an Ressourcen wie Erfahrungen, Geschichten und Werkzeugen.", "r": ["repertoire"], "e": "Dieses gemeinsame Repertoire an Ressourcen nennt das Video als Kern der dritten Eigenschaft, der Praxis."}, {"id": "D5.vq.SmqLyOLIjos.nach3", "vid": "SmqLyOLIjos", "vq": "nach", "t": "frei", "q": "Erkläre anhand eines eigenen Beispiels, Team, Verein oder Hobbygruppe, ob es sich dabei um eine echte Community of Practice nach den drei Merkmalen handelt.", "m": "Eine echte Community of Practice bräuchte ein gemeinsames Interessengebiet, regelmässige gemeinsame Aktivitäten und geteilte Erfahrungen oder Werkzeuge. Ein Verein, in dem sich Mitglieder nur einmal im Jahr treffen und sonst nicht austauschen, würde diese drei Merkmale nicht vollständig erfüllen."}, {"id": "D5.vq.SmqLyOLIjos.abc", "t": "abc", "abruf": 1, "vid": "SmqLyOLIjos", "vq": "nach", "m": ["Community", "Competence", "Domain", "Engineers", "Identity", "Learning", "Membership", "Practice", "Relationships", "Repertoire", "Surgeons"], "q": "ABC-Liste zu «Communities of Practice (Etienne and Beverly Wenger-Trayner)»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D5.vq.SmqLyOLIjos.kawa", "t": "kawa", "abruf": 1, "vid": "SmqLyOLIjos", "vq":
