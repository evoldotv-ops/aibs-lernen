cht verlassen."}, {"id": "B1.vq.QX3UxUm09Sg.vor1", "vid": "QX3UxUm09Sg", "vq": "vor", "t": "mc", "q": "Was glaubst du: Sind lokale KI-Modelle auf dem Smartphone meist genauso leistungsfähig wie grosse Online-Modelle?", "a": ["Ja, immer gleich stark", "Nein, sie sind meist kleiner und schwächer, weil sie keine Cloud-Infrastruktur nutzen", "Ja, aber nur nachts", "Nein, sie funktionieren technisch gar nicht"], "r": 1, "e": "Lokale Modelle greifen laut Video nicht auf die riesige Infrastruktur der Hyperscaler zu und sind daher kleiner."}, {"id": "B1.v.QX3UxUm09Sg", "t": "frei", "abruf": 1, "vid": "QX3UxUm09Sg", "vq": "nach", "q": "Video «KI lokal nutzen - volle Kontrolle & Datenschutz auf DEINEM Gerät» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Magnussen zeigt, dass sich mit Apps wie PocketPal und Modellen von Hugging Face Sprachmodelle direkt lokal auf Smartphone oder Rechner betreiben lassen, sodass keine Daten das Gerät verlassen. 2. Lokale Modelle sind kleiner und schwächer als Cloud-Modelle, eignen sich laut ihm aber gut für vertrauliche Daten, etwa bei einer Beispiel-App, die Fotodaten für die Ukraine komplett offline ausliest. 3. Er ordnet ein, dass Apples Strategie, KI mit eigenen Chips wie dem A17 direkt auf dem Gerät laufen zu lassen, genau auf diesen lokalen Ansatz zielt, technisch aber noch spürbar langsamer ist als Cloud-Lösungen."}, {"id": "B1.vq.QX3UxUm09Sg.nach0", "vid": "QX3UxUm09Sg", "vq": "nach", "t": "mc", "q": "Was ist laut Video Hugging Face?", "a": ["Ein Hersteller von Smartphones", "Eine Plattform, auf der viele KI-Modelle veröffentlicht werden", "Ein Chatbot von Apple", "Ein Bezahldienst für Apps"], "r": 1, "e": "Das Video bezeichnet Hugging Face als so etwas wie das GitHub für KI-Modelle."}, {"id": "B1.vq.QX3UxUm09Sg.nach1", "vid": "QX3UxUm09Sg", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge braucht man laut dem Vergleich im Video, um ein KI-Modell lokal laufen zu lassen?", "a": ["Eine App als Chassis", "Ein heruntergelade läuft komplett auf deinem Smartphone oder Rechner"], "q": "KaWa zu «MODELL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B1.vq.z-r2XXkndnk.vor0", "vid": "z-r2XXkndnk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wen trifft in der Schweiz eine Datenschutz-Busse bis 250'000 Franken?", "a": ["Die Firma", "Die verantwortliche Person", "Den Softwareanbieter", "Niemanden, es gibt keine Bussen"], "r": 1, "e": "Anders als in der EU trifft die Busse bis 250'000 Franken grundsätzlich die verantwortliche natürliche Person. ACHTUNG, eine Ausnahme fehlt in dieser Zuspitzung: Nach Art. 64 Abs. 2 DSG kann bis 50'000 Franken das Unternehmen gebüsst werden, wenn die Ermittlung der strafbaren Person unverhältnismässig wäre."}, {"id": "B1.vq.z-r2XXkndnk.vor1", "vid": "z-r2XXkndnk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Jobwerk hat sein Bewerbungssystem eingekauft. In welcher Rolle ist die Firma nach EU-Verordnung?", "a": ["Anbieter", "Betreiber", "Händler", "Gar keine Rolle"], "r": 1, "e": "Wer ein eingekauftes System einsetzt, ist Betreiber. Wer es wesentlich verändert oder unter eigenem Namen anbietet, wird zum Anbieter."}, {"id": "B1.v.z-r2XXkndnk", "t": "frei", "abruf": 1, "vid": "z-r2XXkndnk", "vq": "nach", "q": "Video «AIB 66 · Lückenfüller 5: KI-Regulierung Schweiz, was gilt ohne KI-Gesetz?» (EvoldoTV · eigenes Lernvideo (privat)): Was waren die Kernaussagen?", "m": "1. Die Schweiz hat kein KI-Gesetz, aber vier Schichten gelten heute schon für jede KI: Datenschutz, Gleichbehandlung, Arbeitsrecht sowie Branchen- und allgemeines Recht. 2. Die EU-Verordnung gilt auch für Schweizer Firmen, wenn das System in der EU angeboten oder sein Ergebnis dort verwendet wird. Entscheidend sind Rolle (Anbieter oder Betreiber) und Risikoklasse. Die Hochrisiko-Pflichten wurden 2026 auf Dezember 2027 und August 2028 verschoben. 3. Der Bundesrat hat im Februar 2025 entschieden: Europarats-Konvention ratifizieren, gezielt Branche für Branche regeln, Vorlage bis Ende 2026. Dazu gehört als Routine nach E3: erkennen, zuordnen, bewerten, dokumentieren."}, {"id": "B1.vq.z-r2XXkndnk.nach0", "vid": "z-r2XXkndnk", "vq": "nach", "t": "ms", "q": "Welche vier Schweizer Schichten gelten heute schon für KI?", "a": ["Datenschutz", "Gleichbehandlung", "Arbeitsrecht", "Branchen- und allgemeines Recht", "Ein eigenes KI-Gesetz", "Eine KI-Steuer"], "r": [0, 1, 2, 3], "e": "Kein KI-Gesetz heisst nicht: keine Regeln. Die fünfte Schicht kommt aus Brüssel."}, {"id": "B1.vq.z-r2XXkndnk.nach1", "vid": "z-r2XXkndnk", "vq": "nach", "t": "mc", "q": "Wann gilt die EU-KI-Verordnung für eine Firma mit Sitz in Zürich?", "a": ["Nie", "Nur mit einer Tochterfirma in der EU", "Wenn das System in der EU angeboten wird oder sein Ergebnis dort verwendet wird", "Nur für Bundesbetriebe"], "r": 2, "e": "Marktortprinzip: Es zählt, wo das Ergebnis wirkt, nicht wo die Firma sitzt."}, {"id": "B1.vq.z-r2XXkndnk.nach2", "vid": "z-r2XXkndnk", "vq": "nach", "t": "ord", "q": "Bringe die Routine nach E3 in die richtige Reihenfolge.", "a": ["Erkennen: Quellen beobachten", "Zuordnen: Liste aller Lösungen mit Daten, Rolle, Klasse, EU-Bezug", "Bewerten: mit Produktverantwortlicher und Juristin", "Dokumentieren: eine Seite mit Ampel und nächstem Termin"], "e": "Ohne Liste aller Lösungen ist jede Gesetzesänderung ein Rätselraten."}, {"id": "B1.vq.z-r2XXkndnk.nach3", "vid": "z-r2XXkndnk", "vq": "nach", "t": "lueck", "q": "Ein AI Business Specialist ist kein Anwalt. Er ist derjenige, der weiss, wann man einen ___ .", "r": ["braucht"], "e": "Im Profil steht «unter Beizug von Fachpersonen». In der Prüfung zählt der Satz, wen du bis wann beiziehst."}, {"id": "B1.vq.z-r2XXkndnk.nach4", "vid": "z-r2XXkndnk", "vq": "nach", "t": "frei", "q": "Prüfungsaufgabe: «Bewerten Sie die rechtlichen und regulatorischen Risiken.» Skizziere dein Gerüst in fünf Zeilen.", "m": "Datenschutz: welche Personendaten, wird automatisch entschieden, wissen es die Betroffenen. Gleichbehandlung: kann eine Gruppe benachteiligt werden, woran merkt man es. Arbeitsrecht, falls Mitarbeitende betroffen sind. Branche: gibt es eine Aufsicht. Europa: wirkt das Ergebnis in der EU, welche Rolle, welche Klasse. Dazu: Pflicht und Folge nennen statt Artikelnummern, dringend von später trennen, sagen, wen man beizieht."}, {"id": "B1.vq.z-r2XXkndnk.abc", "t": "abc", "abruf": 1, "vid": "z-r2XXkndnk", "vq": "nach", "m": ["Anbieter", "Arbeitsrecht", "Aufsicht", "Betreiber", "Bundesrat", "Datenschutz", "Europarat", "Folgenabschätzung", "Gleichstellung", "Hochrisiko", "Konvention", "Marktortprinzip", "Routine", "Transparenz", "Vernehmlassung"], "q": "ABC-Liste zu «AIB 66 · Lückenfüller 5: KI-Regulierung Schweiz, was gilt ohne KI-Gesetz?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B1.vq.z-r2XXkndnk.kawa", "t": "kawa", "abruf": 1, "vid": "z-r2XXkndnk", "vq": "nach", "wort": "KARTE", "m": ["K: Kein KI-Gesetz heisst nicht: keine Regeln", "A: Anbieter oder Betreiber? Rolle klären", "R: Reichweite: der Ort, an dem das Ergebnis wirkt", "T: Termine an der Quelle prüfen", "E: Erkennen, zuordnen, bewerten, dokumentieren"], "q": "KaWa zu «KARTE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B1.0", "t": "ms", "q": "Welche drei Angaben sind nach Schweizer DSG besonders schützenswerte Personendaten?", "a": ["Gesundheitsdaten", "E-Mail-Adresse", "Religiöse oder politische Ansichten", "Biometrische Daten, die eine Person eindeutig identifizieren", "Postadresse"], "r": [0, 2, 3], "e": "Dazu gehören auch Intimsphäre, Ethnie, genetische Daten, Strafverfolgung und Sozialhilfe (Art. 5 lit. c DSG). Adresse und E-Mail sind gewöhnliche Personendaten."}, {"id": "B1.1", "t": "mc", "q": "Seit wann gilt das revidierte Schweizer Datenschutzgesetz?", "a": ["25. Mai 2018", "1. September 2023", "1. Januar 2025", "Es ist noch nicht in Kraft"], "r": 1, "e": "1.9.2023. Der 25.5.2018 ist die DSGVO der EU."}, {"id": "B1.2", "t": "mc", "q": "Eine KI lehnt Kreditanträge vollautomatisch ab. Was verlangt das DSG (Art. 21)?", "a": ["Nichts, solange die KI genau ist", "Die Person muss informiert werden und kann verlangen, dass ein Mensch den Entscheid überprüft", "Ein Verbot jeder Automatisierung", "Eine Bewilligung des Bundesrats"], "r": 1, "e": "Automatisierte Einzelentscheidung mit Rechtsfolge oder erheblicher Beeinträchtigung: Informationspflicht, Recht auf Darlegung des Standpunkts und menschliche Überprüfung."}, {"id": "B1.3", "t": "mc", "q": "Mitarbeitende laden Kundendaten in ein Gratis-KI-Tool in den USA, das Eingaben zum Training nutzt. Was ist das Hauptproblem?", "a": ["Das Tool ist zu langsam", "Bekanntgabe ins Ausland ohne gesicherte Grundlage, kein Auftragsbearbeitungsvertrag, Zweckänderung durch Training", "Die Daten sind zu gross", "Es fehlt ein Logo"], "r": 1, "e": "Auftragsbearbeitung braucht einen Vertrag (Art. 9), Auslandtransfer ein angemessenes Schutzniveau oder Garantien (Art. 16 f.). Bei Berufsgeheimnis kommt das Strafrecht dazu."}, {"id": "B1.4", "t": "frei", "q": "Die Dreierfrage aus dem Kopf: Gesprächsnotizen einer Spitex mit Diagnosen. Datentyp, Schutzstufe, Speicherort, je mit Begründung.", "m": "Datentyp: unstrukturierter Freitext mit Personendaten. Schutzstufe: besonders schützenswert, weil Gesundheitsdaten (DSG Art. 5 lit. c), dazu Berufsgeheimnis. Speicherort: eigene oder vertraglich gebundene Infrastruktur in der Schweiz bzw. in einem Staat mit angemessenem Schutz, mit Auftragsbearbeitungsvertrag, Zugriffsbeschränkung und Protokollierung. Keine öffentlichen KI-Dienste. Vor dem Start Datenschutz-Folgenabschätzung prüfen (Art. 22)."}], "videos": [{"id": "wFSIEwa5BA8", "kanal": "Elovade", "titel": "Schweizer Fachanwalt erklärt: Das müssen Sie zum neuen Datenschutzgesetz wissen", "dauer": "7:41"}, {"id": "E9QKj7Qkc9k", "kanal": "Swisscom B2B", "titel": "Experts: Wie KMU das neue Datenschutzgesetz rechtssicher umsetzen", "dauer": "1:00:03"}, {"id": "g6lUrCUqgL0", "kanal": "Christoph Magnussen", "titel": "Datenschutz ist kein KI-Verhinderer: Warum die DSGVO ein Verbündeter ist | Dr. Sebastian Kraska", "dauer": "1:11:42"}, {"id": "aI1GMBWeySw", "kanal": "Christoph Magnussen", "titel": "Datenschutz & KI: Was muss ich im beruflichen KI-Einsatz WIRKLICH beachten?", "dauer": "15:56"}, {"id": "QX3UxUm09Sg", "kanal": "Christoph Magnussen", "titel": "KI lokal nutzen - volle Kontrolle & Datenschutz auf DEINEM Gerät", "dauer": "12:46"}, {"id": "z-r2XXkndnk", "kanal": "EvoldoTV · eigenes Lernvideo (privat)", "titel": "AIB 66 · Lückenfüller 5: KI-Regulierung Schweiz, was gilt ohne KI-Gesetz?", "dauer": "14:24"}], "pn": 3}, {"key": "B2", "titel": "EU AI Act", "warum": "Risikoklassen, Hochrisiko, Rollen. Achtung: Fristen haben sich seit den Videos verschoben, Daten selbst nachprüfen.", "fragen": [{"id": "B2.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «EU AI Act»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Risikoklassen, Hochrisiko, Rollen. Achtung: Fristen haben sich seit den Videos verschoben, Daten selbst nachprüfen. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "B2.vq.alodAVKwxBA.vor0", "vid": "alodAVKwxBA", "vq": "vor", "t": "mc", "q": "Was glaubst du: In wie viele Risikostufen teilt der EU AI Act KI-Systeme ein?", "a": ["Zwei", "Drei", "Vier", "Sechs"], "r": 2, "e": "Das Video beschreibt eine Pyramide mit vier Risikostufen."}, {"id": "B2.vq.alodAVKwxBA.vor1", "vid": "alodAVKwxBA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Anwendung zählt laut Video zu den komplett verbotenen KI-Systemen?", "a": ["Spamfilter", "Soziale Bewertungssysteme wie in Science-Fiction-Serien", "Gesichtsentsperrung am Smartphone", "Chatbots im Kundenservice"], "r": 1, "e": "Soziale Bewertungssysteme (Social Scoring) zählen zum unannehmbaren Risiko. ACHTUNG: Diese Verbote gelten seit 2.2.2025, nicht erst künftig. Und die biometrische Echtzeit-Fernidentifizierung im öffentlichen Raum ist nach Art. 5 Abs. 1 Bst. h nicht pauschal verboten, sondern nur mit engen Ausnahmen für die Strafverfolgung erlaubt."}, {"id": "B2.v.alodAVKwxBA", "t": "frei", "abruf": 1, "vid": "alodAVKwxBA", "vq": "nach", "q": "Video «Was ist der EU-AI Act? Das europäische KI-Gesetz einfach erklärt» (Digitale Profis): Was waren die Kernaussagen?", "m": "1. Der EU AI Act teilt KI-Systeme nach Risiko in vier Stufen ein: inakzeptables Risiko (verboten, z.B. soziales Scoring und Live-Gesichtserkennung im öffentlichen Raum), Hochrisiko (geprüfte Qualitätsanforderungen, z.B. bei Jobauswahl oder medizinischer Diagnose), begrenztes Risiko mit Transparenzpflichten (z.B. Kennzeichnung von Chatbots und KI-generierten Inhalten) und minimales Risiko ohne Pflichten. 2. Bei Hochrisiko-Anwendungen wie Bewerbungsverfahren oder Behördenentscheiden darf die KI nur unterstützend eingesetzt werden, die endgültige Entscheidung muss weiterhin ein Mensch treffen. 3. Die EU stellt bis 2027 rund 4 Milliarden Euro im Rahmen des AI Innovation Package bereit, um kleine und mittlere Unternehmen sowie Startups bei der KI-Entwicklung zu unterstützen."}, {"id": "B2.vq.alodAVKwxBA.nach0", "vid": "alodAVKwxBA", "vq": "nach", "t": "mc", "q": "Welche Kategorie beschreibt Systeme, die zwar erlaubt sind, aber bestimmte Qualitätsanforderungen erfüllen und geprüft werden müssen?", "a": ["Minimales Risiko", "Transparenzrisiko", "Hochrisiko", "Inakzeptables Risiko"], "r": 2, "e": "Hochrisiko-Systeme, etwa bei Bewerbungen oder medizinischen Diagnosen, müssen geprüft werden, sind aber nicht verboten."}, {"id": "B2.vq.alodAVKwxBA.nach1", "vid": "alodAVKwxBA", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele nennt das Video für Hochrisiko-KI-Anwendungen?", "a": ["Ein System, das über Studienplätze mitentscheidet", "Ein Spamfilter im E-Mail-Postfach", "Ein System, das Diagnosen in einem Krankenhaus vorschlägt", "Ein Videospiel mit KI-Gegnern"], "r": [0, 2], "e": "Studienplatz- bzw. Job-Entscheidungen und medizinische Diagnosen zählen laut Video zu den Hochrisiko-Bereichen."}, {"id": "B2.vq.alodAVKwxBA.nach2", "vid": "alodAVKwxBA", "vq": "nach", "t": "lueck", "q": "Chatbots müssen laut Video kennzeichnen, dass man gerade mit einer ___ spricht.", "r": ["ki", "künstlichen intelligenz"], "e": "Bei der Kategorie Transparenzrisiko reicht oft schon der Hinweis, dass man mit einer KI kommuniziert."}, {"id": "B2.vq.alodAVKwxBA.nach3", "vid": "alodAVKwxBA", "vq": "nach", "t": "frei", "q": "Erkläre an einem Beispiel aus dem Video, warum eine KI bei einer Bewerbung nicht allein entscheiden darf.", "m": "Der EU AI Act verlangt, dass Menschen die Kontrolle über wichtige Entscheidungen behalten. Eine KI darf laut Video bei der Vorauswahl von Bewerbungen unterstützend eingesetzt werden, weil sie zum Beispiel schnell viele Unterlagen sichten kann. Die endgültige Entscheidung, ob jemand zum Vorstellungsgespräch eingeladen wird, muss aber weiterhin ein Mensch treffen, damit niemand allein durch einen Algorithmus benachteiligt wird."}, {"id": "B2.vq.alodAVKwxBA.abc", "t": "abc", "abruf": 1, "vid": "alodAVKwxBA", "vq": "nach", "m": ["Bewerbung", "Chatbot", "Code of Conduct", "Deep Fake", "Gesichtserkennung", "Hochrisiko", "Innovation Package", "Kennzeichnungspflicht", "Massenüberwachung", "Risikostufe", "Social Scoring", "Transparenzrisiko"], "q": "ABC-Liste zu «Was ist der EU-AI Act? Das europäische KI-Gesetz einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B2.vq.alodAVKwxBA.kawa", "t": "kawa", "abruf": 1, "vid": "alodAVKwxBA", "vq": "nach", "wort": "RISIKO", "m": ["R: Risikostufen: der AI Act teilt Systeme in vier Kategorien ein", "I: Inakzeptables Risiko: komplett verbotene Anwendungen wie Social Scoring", "S: Social Scoring: eine soziale Bewertung von Bürgern, verboten", "K: Kennzeichnungspflicht: KI-generierte Inhalte müssen als solche markiert werden", "O: Ohne Prüfung: Systeme mit minimalem Risiko wie Spamfilter brauchen keine Zulassung"], "q": "KaWa zu «RISIKO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B2.vq.LW78-Tr1zq4.vor0", "vid": "LW78-Tr1zq4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reguliert der EU AI Act laut Video die einzelnen KI-Modelle oder etwas anderes?", "a": ["Er reguliert die Modelle selbst, zum Beispiel ChatGPT direkt", "Er reguliert die konkreten Anwendungsfälle, für die ein Modell genutzt wird", "Er reguliert nur Hardware wie Grafikkarten", "Er reguliert ausschliesslich staatliche Behörden"], "r": 1, "e": "Das Video sagt, nicht die Modelle, sondern die Anwendungsfälle würden reguliert. ACHTUNG, das galt nur für den Entwurf von 2021: Kapitel V (Art. 51 bis 56) regelt seit 2.8.2025 auch die Modelle mit allgemeinem Verwendungszweck (GPAI) direkt. Richtig ist heute: beides."}, {"id": "B2.vq.LW78-Tr1zq4.vor1", "vid": "LW78-Tr1zq4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche der folgenden Nutzungen zählt laut Video zu den vollständig verbotenen, prohibited Fällen?", "a": ["Ein einfacher Chatbot für Kundenfragen auf einer Website", "Die Nutzung von KI, um Menschen gezielt zu täuschen", "Automatisierte Rechtschreibprüfung", "KI-gestützte Wetterprognosen"], "r": 1, "e": "Das Video nennt Täuschung ausdrücklich als Beispiel für eine vollständig verbotene Nutzung."}, {"id": "B2.v.LW78-Tr1zq4", "t": "frei", "abruf": 1, "vid": "LW78-Tr1zq4", "vq": "nach", "q": "Video «Der EU-AI Act: Alles was ihr wissen müsst in unter 10 Minuten (fast)» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Der EU AI Act reguliert laut Video nicht die Modelle selbst, sondern die konkreten Anwendungsfälle (ACHTUNG, überholt: Kapitel V, Art. 51 bis 56, regelt seit 2.8.2025 auch die GPAI-Modelle direkt); Unternehmen müssen in einer sogenannten Model Card festlegen, für welchen Einsatzzweck ein Modell gedacht ist, um die Risikokategorie zu bestimmen. 2. Das Video nennt vier Risikostufen (ACHTUNG, die amtlichen Namen lauten minimales Risiko, begrenztes Risiko mit Transparenzpflicht nach Art. 50, hohes Risiko, unannehmbares Risiko; «Low Risk» und «Model Card» stehen nicht im Gesetz): Minimal Risk (z.B. einfache Chatbots), Low Risk, High Risk (z.B. Kreditvergabe, Bewerbungsauswahl, kritische Infrastruktur) und Prohibited Cases (z.B. biometrische Daten zur Überwachung oder gezielte Täuschung), wobei Prohibited Cases vollständig verboten sind. 3. Der AI Act gilt für alle Modelle, die europäische Nutzerinnen und Nutzer betreffen, unabhängig davon, wo das Modell entwickelt wurde, und Endanwender haben Anspruch auf Transparenz darüber, wie das Modell arbeitet und welche Daten es nutzt."}, {"id": "B2.vq.LW78-Tr1zq4.nach0", "vid": "LW78-Tr1zq4", "vq": "nach", "t": "mc", "q": "Was muss ein Entwickler laut Video für ein KI-Modell erstellen, um festzulegen, wofür es gedacht ist?", "a": ["Eine Model Card", "Einen Werbeflyer", "Eine Rechnung", "Ein Patent"], "r": 0, "e": "Das Video nennt die Model Card als das Dokument, in dem der Anwendungszweck festgelegt wird."}, {"id": "B2.vq.LW78-Tr1zq4.nach1", "vid": "LW78-Tr1zq4", "vq": "nach", "t": "ms", "q": "Welche zwei Bereiche nennt das Video als Beispiele für High-Risk-Fälle?", "a": ["Kritische Infrastruktur wie das Stromnetz", "Entscheidungen auf Basis von Gesundheits- oder Bildungsdaten", "Ein einfacher FAQ-Chatbot auf einer Firmenwebsite", "Die private Nutzung eines Übersetzungstools im Urlaub"], "r": [0, 1], "e": "Das Video nennt genau diese beiden Bereiche als Beispiele für High-Risk-Fälle."}, {"id": "B2.vq.LW78-Tr1zq4.nach2", "vid": "LW78-Tr1zq4", "vq": "nach", "t": "ord", "q": "Bringe die vier Risikostufen des EU AI Act von wenig zu viel Risiko in die richtige Reihenfolge.", "a": ["Minimales Risiko", "Begrenztes Risiko (Transparenzpflicht)", "Hohes Risiko", "Unannehmbares Risiko (verboten)"], "e": "So heissen die Stufen im Gesetzestext. ACHTUNG: Das Video sagt «Low Risk», dieser Begriff steht nicht in der Verordnung. Die zweite Stufe heisst begrenztes Risiko und bringt Transparenzpflichten nach Art. 50, etwa die Kennzeichnung von Chatbots."}, {"id": "B2.vq.LW78-Tr1zq4.nach3", "vid": "LW78-Tr1zq4", "vq": "nach", "t": "frei", "q": "Wo könntest du dir vorstellen, dass ein Unternehmen aus deinem Umfeld ungewollt einen High-Risk-Case im Sinne des EU AI Act nutzt?", "m": "Ein Unternehmen könnte KI zur Vorauswahl von Bewerbungen einsetzen, ohne sich bewusst zu sein, dass das ein High-Risk-Fall ist. Weil dabei Entscheidungen mit grosser Tragweite für Menschen getroffen werden, gelten hier strenge Transparenz- und Dokumentationspflichten. Ohne Model Card und Risikoeinordnung wäre das Unternehmen nicht compliant."}, {"id": "B2.vq.LW78-Tr1zq4.abc", "t": "abc", "abruf": 1, "vid": "LW78-Tr1zq4", "vq": "nach", "m": ["AI Act", "Anwendungsfall", "Biometrisch", "Endanwender", "Hochrisiko", "Model Card", "Modell", "Prohibited", "Pyramide", "Risikokategorie", "Transparenz", "Täuschung"], "q": "ABC-Liste zu «Der EU-AI Act: Alles was ihr wissen müsst in unter 10 Minuten (fast)»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B2.vq.LW78-Tr1zq4.kawa", "t": "kawa", "abruf": 1, "vid": "LW78-Tr1zq4", "vq": "nach", "wort": "RISIKO", "m": ["R: Risikokategorie: der AI Act teilt Anwendungen in vier Stufen ein", "I: Infrastruktur: kritische Infrastruktur zählt zu den High-Risk-Fällen", "S: Sicherheitsbehörden: sie haben laut Video eigene Ausnahmen bei verbotenen Fällen", "K: Kritisch: kritische Anwendungsfälle werden stärker reguliert", "O: Open AI: ein Modellanbieter, der laut Video nicht allein ausschlaggebend ist"], "q": "KaWa zu «RISIKO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B2.vq.eLaqIGCfCwY.vor0", "vid": "eLaqIGCfCwY", "vq": "vor", "t": "mc", "q": "In wie viele Risikoklassen teilt der EU AI Act KI-Systeme ein?", "a": ["Zwei", "Drei", "Vier", "Fünf"], "r": 2, "e": "Vier Stufen: unannehmbares Risiko (verboten), hohes Risiko (strenge Pflichten), begrenztes Risiko (Transparenzpflicht, etwa Chatbots kennzeichnen) und minimales Risiko (keine besonderen Pflichten). ACHTUNG: Dieses Video ist älter und nennt nur drei Stufen, weil es begrenztes und minimales Risiko zusammenfasst. In der Prüfung gilt die Vierteilung."}, {"id": "B2.vq.eLaqIGCfCwY.vor1", "vid": "eLaqIGCfCwY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was müssen Anbieter von Chatbots laut Video den Nutzern gegenüber offenlegen?", "a": ["Den Quellcode des Chatbots", "Dass es sich um eine KI und nicht um einen echten Menschen handelt", "Die Herstellungskosten des Systems", "Den Namen aller Programmierer"], "r": 1, "e": "Bei Systemen mit geringem Risiko wie Chatbots verlangt der AI Act laut Video vor allem Transparenz, Nutzer sollen wissen, dass sie mit einer KI sprechen."}, {"id": "B2.v.eLaqIGCfCwY", "t": "frei", "abruf": 1, "vid": "eLaqIGCfCwY", "vq": "nach", "q": "Video «AI Act: EU-Verordnung zu KI in 3 Minuten erklärt» (Menold Bezler): Was waren die Kernaussagen?", "m": "1. Der AI Act unterteilt KI-Systeme in Risikoklassen. ACHTUNG, dieses Video ist älter und nennt nur drei Stufen: In der Prüfung gelten VIER, nämlich unannehmbares Risiko (Art. 5, verboten), hohes Risiko (Kap. III), begrenztes Risiko mit Transparenzpflicht (Art. 50) und minimales Risiko. 2. Systeme mit unannehmbarem Risiko, etwa solche, die Menschen unterschwellig manipulieren oder Schwächen schutzbedürftiger Gruppen wie Kindern ausnutzen, SIND verboten. Das Video spricht im Futur, weil es vor dem Inkrafttreten entstand: Die Verbote nach Art. 5 gelten seit 2.2.2025. 3. Hochrisiko-Systeme, zum Beispiel im Strassenverkehr oder bei Entscheidungen über Kreditwürdigkeit und Bewerbungen, unterliegen Dokumentations- und Kontrollpflichten sowie der Pflicht zu menschlicher Aufsicht."}, {"id": "B2.vq.eLaqIGCfCwY.nach0", "vid": "eLaqIGCfCwY", "vq": "nach", "t": "mc", "q": "Welche KI-Systeme sollen laut Video grundsätzlich verboten werden?", "a": ["Systeme mit geringem Risiko", "Systeme, die Menschen unterschwellig manipulieren oder Schwächen schutzbedürftiger Gruppen ausnutzen", "Alle Chatbots ohne Ausnahme", "Systeme im Bereich Kreditwürdigkeit"], "r": 1, "e": "Das Video nennt diese manipulativen und ausnutzenden Systeme als Klasse mit unannehmbarem Risiko. ACHTUNG: Das Video spricht im Futur, weil es vor dem Inkrafttreten entstand. Die Verbote nach Art. 5 AI Act gelten seit 2.2.2025."}, {"id": "B2.vq.eLaqIGCfCwY.nach1", "vid": "eLaqIGCfCwY", "vq": "nach", "t": "mc", "q": "Welche Anforderungen gehören laut Video zum Herzstück der Verordnung bei Hochrisiko-Systemen?", "a": ["Dokumentations- und Kontrollpflichten sowie menschliche Aufsicht", "Kostenlose Nutzung für alle Bürger", "Automatische Löschung nach einem Jahr", "Verbot jeglicher kommerziellen Nutzung"], "r": 0, "e": "Das Video nennt Dokumentations- und Kontrollpflichten sowie die Gewährleistung menschlicher Aufsicht als zentrale Anforderungen an Hochrisiko-Systeme."}, {"id": "B2.vq.eLaqIGCfCwY.nach2", "vid": "eLaqIGCfCwY", "vq": "nach", "t": "ms", "q": "An welche zwei Gruppen richtet sich der AI Act laut Video vor allem?", "a": ["Anbieter, die KI-Systeme in der EU in Verkehr bringen", "Betreiber, die KI-Systeme in der EU einsetzen (im Video noch «Nutzer»)", "Nur Regierungen ausserhalb der EU", "Nur Privatpersonen ohne Unternehmen"], "r": [0, 1], "e": "Anbieter und Betreiber. ACHTUNG, Begriff veraltet: Die geltende Verordnung (EU) 2024/1689 sagt Betreiber (englisch deployer, Art. 3 Nr. 4), also wer ein KI-System in eigener Verantwortung einsetzt. Im Entwurf hiess das noch Nutzer. In der Prüfung «Betreiber» schreiben."}, {"id": "B2.vq.eLaqIGCfCwY.nach3", "vid": "eLaqIGCfCwY", "vq": "nach", "t": "frei", "q": "Nenne ein Beispiel aus dem Video für ein Hochrisiko-System und erkläre in eigenen Worten, warum es in diese Klasse fällt.", "m": "Ein Beispiel aus dem Video sind KI-Systeme, die über Kreditwürdigkeit oder Bewerbungsverfahren entscheiden. Sie fallen in die Hochrisiko-Klasse, weil eine falsche Entscheidung dort direkt die Chancen und Grundrechte eines Menschen beeinflussen kann, etwa ob jemand einen Kredit oder eine Stelle bekommt. Deshalb verlangt der AI Act hier besondere Dokumentations- und Kontrollpflichten."}, {"id": "B2.vq.eLaqIGCfCwY.abc", "t": "abc", "abruf": 1, "vid": "eLaqIGCfCwY", "vq": "nach", "m": ["AI Act", "Anbieter", "Aufsicht", "Chatbot", "Dokumentation", "Grundrechte", "Hochrisiko", "Katalog", "Risikoklasse", "Sanktion", "Transparenz", "Verordnung"], "q": "ABC-Liste zu «AI Act: EU-Verordnung zu KI in 3 Minuten erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B2.vq.eLaqIGCfCwY.kawa", "t": "kawa", "abruf": 1, "vid": "eLaqIGCfCwY", "vq": "nach", "wort": "RISIKO", "m": ["R: Risikoklassen teilen KI-Systeme in vier Stufen ein (dieses Video nennt nur drei)", "I: In Verkehr bringen dürfen Anbieter nur AI-Act-konforme Systeme", "S: Sanktionen drohen bei Verstössen gegen die Regelungen", "K: Kreditwürdigkeit gehört zu den Beispielen für Hochrisiko-Systeme", "O: Ohne menschliche Aufsicht darf ein Hochrisiko-System nicht laufen"], "q": "KaWa zu «RISIKO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B2.vq.WvtydI5-fDs.vor0", "vid": "WvtydI5-fDs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Muss ein Chatbot, der mit Kunden schreibt, sagen, dass er eine Maschine ist und kein Mensch?", "a": ["Nein, das ist freiwillig", "Ja, laut AI Act muss das transparent gemacht werden", "Nur wenn der Kunde danach fragt", "Nur bei medizinischen Chatbots"], "r": 1, "e": "Wer keinen Menschen, sondern eine Maschine anbietet, muss das dem Nutzer laut AI Act transparent machen."}, {"id": "B2.vq.WvtydI5-fDs.vor1", "vid": "WvtydI5-fDs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reicht es bei einem KI-gestützten Telefonanruf, einmal zu Beginn zu sagen 'Hier spricht die KI', oder muss das während des ganzen Gesprächs wiederholt werden?", "a": ["Einmal am Anfang reicht laut dem Experten im Video", "Es muss nach jedem Satz wiederholt werden", "Es darf gar nicht gesagt werden", "Nur am Ende des Gesprächs"], "r": 0, "e": "Der Experte im Video sagt, dass ein einmaliger Hinweis zu Beginn des Gesprächs ausreicht."}, {"id": "B2.v.WvtydI5-fDs", "t": "frei", "abruf": 1, "vid": "WvtydI5-fDs", "vq": "nach", "q": "Video «KI-Kennzeichnung ab SOFORT? Was der AI Act WIRKLICH verlangt» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Seit August 2026 gelten Teile des AI Act, die keine Verbote sind, sondern Kennzeichnungs- und Transparenzpflichten für KI-generierte Inhalte und KI-Interaktionen vorschreiben. 2. Der AI Act unterscheidet zwischen Anbietern, die zum Beispiel Deepfakes als KI-generiert erkennbar machen müssen, und Betreibern, die ihren Nutzern klar sagen müssen, ob sie mit einem Menschen oder einer Maschine sprechen. 3. Die Kennzeichnungspflichten gelten für die geschäftliche Nutzung von KI, nicht für die rein private Nutzung, und Wasserzeichen in KI-Texten nennt das Video als freiwillige Selbstverpflichtung. ACHTUNG, Stand überholt: Art. 50 Abs. 2 AI Act macht die maschinenlesbare Kennzeichnung synthetischer Inhalte inklusive Text seit 2.8.2026 zur Anbieterpflicht."}, {"id": "B2.vq.WvtydI5-fDs.nach0", "vid": "WvtydI5-fDs", "vq": "nach", "t": "mc", "q": "Für wen gelten die im Video besprochenen Kennzeichnungspflichten in erster Linie?", "a": ["Nur für private Nutzung", "Für die geschäftliche Nutzung von KI-Systemen", "Nur für Behörden", "Für niemanden mehr, seit das Gesetz gilt"], "r": 1, "e": "Der Experte im Video betont, dass sich die Vorgaben an die geschäftliche Nutzung richten, nicht an private Nutzung."}, {"id": "B2.vq.WvtydI5-fDs.nach1", "vid": "WvtydI5-fDs", "vq": "nach", "t": "mc", "q": "Welchen Unterschied macht das Video zwischen Anbieter und Betreiber eines KI-Systems?", "a": ["Es gibt keinen Unterschied", "Anbieter stellen das System bereit, Betreiber setzen es beim Endnutzer ein", "Nur Anbieter haben Pflichten", "Nur Betreiber dürfen KI nutzen"], "r": 1, "e": "Anbieter sind jene, die KI-Systeme bereitstellen, Betreiber jene, die diese Systeme konkret einsetzen und dem Nutzer gegenüber offenlegen müssen."}, {"id": "B2.vq.WvtydI5-fDs.nach2", "vid": "WvtydI5-fDs", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele für freiwillige Selbstverpflichtung, also nicht gesetzlich vorgeschrieben, nennt das Video?", "a": ["Wasserzeichen in KI-generierten Texten", "Die Kennzeichnungspflicht des AI Act selbst", "Kennzeichnung von KI-Beiträgen auf LinkedIn", "Die Grundrechte-Charta der EU"], "r": [0, 2], "e": "Wasserzeichen bei Texten und Kennzeichnungen auf LinkedIn nennt das Video als Selbstverpflichtungen. ACHTUNG, das ist überholt: Art. 50 Abs. 2 AI Act verlangt seit 2.8.2026 auch für synthetischen TEXT eine maschinenlesbare Kennzeichnung. Freiwillig bleibt nur die Kennzeichnung auf LinkedIn."}, {"id": "B2.vq.WvtydI5-fDs.nach3", "vid": "WvtydI5-fDs", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, welches Grundproblem der Gesetzgeber laut Video mit der Kennzeichnungspflicht lösen will.", "m": "Der Gesetzgeber will, dass Menschen wissen, ob sie gerade mit einem echten Menschen oder mit einer Maschine kommunizieren, um Vertrauen in digitale Kommunikation zu schaffen. Deshalb müssen Anbieter und Betreiber von KI-Systemen offenlegen, wenn Inhalte oder Gespräche komplett KI-generiert sind."}, {"id": "B2.vq.WvtydI5-fDs.abc", "t": "abc", "abruf": 1, "vid": "WvtydI5-fDs", "vq": "nach", "m": ["Anbieter", "Betreiber", "Chatbot", "Deepfake", "Kennzeichnung", "KI-Verordnung", "LinkedIn", "Selbstverpflichtung", "Transparenz", "Vertrauen", "Wasserzeichen", "Zusammenfassung"], "q": "ABC-Liste zu «KI-Kennzeichnung ab SOFORT? Was der AI Act WIRKLICH verlangt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B2.vq.WvtydI5-fDs.kawa", "t": "kawa", "abruf": 1, "vid": "WvtydI5-fDs", "vq": "nach", "wort": "BETREIBER", "m": ["B: Betreiber müssen sagen, ob man mit einem Menschen oder einer Maschine spricht.", "E: Ein einmaliger Hinweis zu Gesprächsbeginn reicht laut Video aus.", "T: Transparenz ist das erklärte Ziel des Gesetzgebers.", "R: Rollenteilung zwischen Anbieter und Betreiber ist im AI Act zentral.", "I: Im Chatbot-Beispiel muss klar sein, dass keine echte Person antwortet."], "q": "KaWa zu «BETREIBER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B2.0", "t": "ord", "q": "Ordne die vier Risikoklassen des EU AI Act von der strengsten zur mildesten.", "a": ["Unannehmbares Risiko (verboten)", "Hohes Risiko (strenge Pflichten)", "Begrenztes Risiko (Transparenzpflichten)", "Minimales Risiko (keine besonderen Pflichten)"], "e": "Je höher das Risiko für Menschen, desto strenger. Beispiel verboten: Social Scoring. Begrenzt: Chatbots müssen sich als KI zu erkennen geben."}, {"id": "B2.1", "t": "ms", "q": "Welche zwei Anwendungen gelten als Hochrisiko?", "a": ["KI zur Vorauswahl von Bewerbungen", "Spamfilter", "KI zur Kreditwürdigkeitsprüfung von Privatpersonen", "Rechtschreibkorrektur"], "r": [0, 2], "e": "Anhang III: u.a. Beschäftigung, Bildung, Kreditwürdigkeit, kritische Infrastruktur, Strafverfolgung."}, {"id": "B2.2", "t": "mc", "q": "Warum betrifft der EU AI Act auch Schweizer Firmen?", "a": ["Gar nicht, die Schweiz ist nicht in der EU", "Er gilt, wenn das KI-System in der EU angeboten wird oder sein Ergebnis in der EU verwendet wird", "Nur wenn die Firma eine EU-Tochter hat", "Nur für Bundesbetriebe"], "r": 1, "e": "Marktortprinzip wie bei der DSGVO. Wer in die EU liefert oder EU-Kunden bedient, ist betroffen."}, {"id": "B2.3", "t": "frei", "q": "Eine neue Regel tritt in Kraft (oder ein Frist wird verschoben). Was tust du als AI Business Specialist zuerst, was danach? (E3)", "m": "Zuerst an der Primärquelle prüfen, was genau gilt und ab wann (Videos und Blogs veralten). Dann das Portfolio durchgehen: Welche unserer Lösungen sind betroffen, in welcher Rolle (Anbieter oder Betreiber), welche Risikoklasse. Mit Produktverantwortlichen und Rechtsdienst die Auswirkungen bewerten, Massnahmen und Fristen festhalten, Ergebnis empfängergerecht dokumentieren."}], "videos": [{"id": "alodAVKwxBA", "kanal": "Digitale Profis", "titel": "Was ist der EU-AI Act? Das europäische KI-Gesetz einfach erklärt", "dauer": "7:25"}, {"id": "LW78-Tr1zq4", "kanal": "Christoph Magnussen", "titel": "Der EU-AI Act: Alles was ihr wissen müsst in unter 10 Minuten (fast)", "dauer": "11:28"}, {"id": "eLaqIGCfCwY", "kanal": "Menold Bezler", "titel": "AI Act: EU-Verordnung zu KI in 3 Minuten erklärt", "dauer": "3:21"}, {"id": "WvtydI5-fDs", "kanal": "Christoph Magnussen", "titel": "KI-Kennzeichnung ab SOFORT? Was der AI Act WIRKLICH verlangt", "dauer": "23:20"}], "pn": 1}, {"key": "B3", "titel": "KI-Governance und KI-Richtlinie", "warum": "A5: Wer darf was, mit welchen Daten, wer entscheidet.", "fragen": [{"id": "B3.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «KI-Governance und KI-Richtlinie»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: A5: Wer darf was, mit welchen Daten, wer entscheidet. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "B3.vq.NJNaG2JrKAE.vor0", "vid": "NJNaG2JrKAE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Muss man immer erkennen können, ob man gerade mit einer KI spricht oder einen KI-generierten Inhalt konsumiert?", "a": ["nein, das ist rein freiwillig", "ja, das gehört laut Video zur Kennzeichnungspflicht und Transparenz", "nur bei Videos, nicht bei Texten", "nur wenn die KI das selbst anbietet"], "r": 1, "e": "Das Video nennt die Kennzeichnungspflicht und Transparenz von KI-generierten Inhalten ausdrücklich als Teil der KI-Compliance."}, {"id": "B3.vq.NJNaG2JrKAE.vor1", "vid": "NJNaG2JrKAE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist laut Video die erste Massnahme im technischen Setup, bevor ein Unternehmen KI-Nutzung kontrollierbar machen kann?", "a": ["ein KI-Verzeichnis aller eingesetzten Tools anlegen", "alle Mitarbeitenden entlassen, die KI nutzen", "sofort ein neues ISMS komplett neu aufbauen", "ein Verbot aller KI-Tools aussprechen"], "r": 0, "e": "Das Video nennt ein KI-Verzeichnis, also eine Uebersicht aller eingesetzten Tools mit Zweck, Daten und Verantwortlichkeit, als Startpunkt des technischen Setups."}, {"id": "B3.v.NJNaG2JrKAE", "t": "frei", "abruf": 1, "vid": "NJNaG2JrKAE", "vq": "nach", "q": "Video «Wie baue ich KI-Governance auf?» (BUCS IT GmbH): Was waren die Kernaussagen?", "m": "1. KI-Governance umfasst Regeln (KI-Compliance nach EU AI Act, DSGVO, Urheberrecht), eine grundlegende Haltung mit unternehmensweitem Rahmen und Richtlinien sowie ein technisches Setup mit KI-Verzeichnis, Datenstruktur und Freigabeprozess. 2. Ein KI-Verzeichnis listet alle eingesetzten Tools auf, wofür sie genutzt werden, welche Daten sie verarbeiten und wer dafür verantwortlich ist. 3. Bevor neue KI-Tools eingeführt werden, braucht es einen Freigabeprozess, der Datenschutz, Sicherheit und Zweckbindung prüft, sowie ein Monitoring, das die Nutzung und Konformität laufend protokolliert."}, {"id": "B3.vq.NJNaG2JrKAE.nach0", "vid": "NJNaG2JrKAE", "vq": "nach", "t": "mc", "q": "Was ist laut Video das Ziel von KI Governance?", "a": ["möglichst viele KI-Tools gleichzeitig einzusetzen", "durch verantwortungsvollen Umgang mit KI intern und extern Vertrauen zu schaffen", "die Kosten für KI auf null zu senken", "KI komplett aus dem Unternehmen zu verbannen"], "r": 1, "e": "Das Video definiert als Ziel von KI Governance, durch verantwortungsvollen Umgang mit KI Vertrauen zu schaffen, sowohl intern als auch extern."}, {"id": "B3.vq.NJNaG2JrKAE.nach1", "vid": "NJNaG2JrKAE", "vq": "nach", "t": "ms", "q": "Welche zwei Elemente gehören laut Video zur KI Compliance?", "a": ["das Einhalten von EU AI Act und DSGVO", "die Kennzeichnungspflicht für KI-generierte Inhalte", "die automatische Kündigung von Mitarbeitenden", "ein Verbot jeglicher Datenverarbeitung"], "r": [0, 1], "e": "Das Video nennt die Einhaltung gesetzlicher Rahmenbedingungen wie EU AI Act und DSGVO sowie die Kennzeichnungspflicht als Teile der KI Compliance."}, {"id": "B3.vq.NJNaG2JrKAE.nach2", "vid": "NJNaG2JrKAE", "vq": "nach", "t": "lueck", "q": "Bevor ein neues KI-Tool eingeführt wird, braucht es laut Video einen ___, der Datenschutz, Sicherheit und Zweckbindung prüft.", "r": ["freigabeprozess"], "e": "Das Video verlangt einen Freigabeprozess vor der Einführung neuer KI-Tools, der genau diese drei Punkte prüft."}, {"id": "B3.vq.NJNaG2JrKAE.nach3", "vid": "NJNaG2JrKAE", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, was ein Unternehmen konkret einrichten müsste, wenn es mit dem Aufbau von KI Governance beginnen wollte.", "m": "Zuerst braucht es klare Regeln und Verantwortlichkeiten, also wer welche KI-Tools mit welchen Daten nutzen darf. Dann sollte ein KI-Verzeichnis entstehen, das alle eingesetzten Tools, ihren Zweck und die verarbeiteten Daten dokumentiert. Zusätzlich braucht es ein Monitoring und einen Freigabeprozess, damit neue Tools erst nach einer Prüfung von Datenschutz und Sicherheit eingeführt werden."}, {"id": "B3.vq.NJNaG2JrKAE.abc", "t": "abc", "abruf": 1, "vid": "NJNaG2JrKAE", "vq": "nach", "m": ["Compliance", "Datenschutz", "DSGVO", "EU AI Act", "Freigabeprozess", "ISMS", "Kennzeichnungspflicht", "KI-Governance", "KI-Verzeichnis", "Leitplanken", "Monitoring", "Risikomanagement"], "q": "ABC-Liste zu «Wie baue ich KI-Governance auf?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B3.vq.NJNaG2JrKAE.kawa", "t": "kawa", "abruf": 1, "vid": "NJNaG2JrKAE", "vq": "nach", "wort": "REGEL", "m": ["R: Risikomanagement: Teil des KI-Qualitätsmanagements", "E: EU AI Act: gehört zu den gesetzlichen Rahmenbedingungen der KI Compliance", "G: Governance: der Rahmen aus Regeln, Prozessen und Werten für den KI-Einsatz", "L: Leitplanken: helfen, KI mutig auszuprobieren, ohne in Fallen zu tappen"], "q": "KaWa zu «REGEL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B3.vq.2HWhHNhWFfY.vor0", "vid": "2HWhHNhWFfY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Datenkategorie dürfen Mitarbeitende laut Video unter keinen Umständen in eine KI eingeben?", "a": ["Den eigenen Namen", "Artikel-9-Daten wie biometrische oder religiöse Angaben", "Die Büroadresse", "Den Firmennamen"], "r": 1, "e": "Das Video nennt die harten Grenzen der Artikel-9-Daten. Zwei Präzisierungen: Art. 9 DSGVO verbietet solche Daten nur im Grundsatz, Abs. 2 kennt zehn Ausnahmen, etwa die ausdrückliche Einwilligung. Und für eine Schweizer Prüfung heisst der Begriff «besonders schützenswerte Personendaten» nach Art. 5 Bst. c DSG."}, {"id": "B3.vq.2HWhHNhWFfY.vor1", "vid": "2HWhHNhWFfY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert laut Video, wenn Copilot Zugriff auf SharePoint und OneDrive bekommt?", "a": ["Copilot kann nur öffentliche Webseiten durchsuchen", "Copilot kann auch vergessene, freigegebene Dateien in Unterordnern finden", "Copilot löscht automatisch alte Dateien", "Copilot fragt jedes Mal um Erlaubnis"], "r": 1, "e": "Die Gäste erklären, dass die semantische Suche von Copilot auch Dateien in vergessenen, freigegebenen Unterordnern plötzlich auffindbar macht."}, {"id": "B3.v.2HWhHNhWFfY", "t": "frei", "abruf": 1, "vid": "2HWhHNhWFfY", "vq": "nach", "q": "Video «KI-Richtlinien im Unternehmen: So setzt du sie richtig auf» (121WATT): Was waren die Kernaussagen?", "m": "1. KI-Richtlinien sollten nicht als reine Verbote formuliert werden, sondern Mitarbeitende befähigen, verantwortungsvoll mit Daten umzugehen, sonst entsteht Frust statt Nutzung. 2. Bestimmte Datenkategorien wie Artikel-9-Daten (biometrische Daten, Religions- oder Gewerkschaftszugehörigkeit) dürfen grundsätzlich nicht in KI-Systeme eingegeben werden. 3. Tools wie Copilot übernehmen die bestehenden Zugriffsrechte auf Cloud-Speicher wie SharePoint, wodurch die semantische KI-Suche auch bislang unbemerkte Dateien in falsch freigegebenen Ordnern auffindbar macht, weshalb saubere Zugriffsrechte-Pflege zur Voraussetzung für sichere KI-Nutzung wird."}, {"id": "B3.vq.2HWhHNhWFfY.nach0", "vid": "2HWhHNhWFfY", "vq": "nach", "t": "mc", "q": "Wie reagieren Mitarbeitende laut Video oft auf KI-Richtlinien, die von IT oder Rechtsabteilung allein erstellt wurden?", "a": ["Mit Begeisterung und mehr Tempo", "Mit Frust, weil es die Geschwindigkeit bremst", "Mit völliger Gleichgültigkeit", "Mit sofortiger Kündigung"], "r": 1, "e": "Die Gäste berichten, dass rein von IT oder Recht erstellte Regeln oft eher zu Frust als zu Begeisterung führen."}, {"id": "B3.vq.2HWhHNhWFfY.nach1", "vid": "2HWhHNhWFfY", "vq": "nach", "t": "ms", "q": "Welche zwei Ziele sollen KI-Richtlinien laut Video gleichzeitig erreichen?", "a": ["Sicherheit schaffen", "Alle KI-Nutzung verbieten", "Innovation nicht ausbremsen", "Nur der IT-Abteilung Zugriff geben"], "r": [0, 2], "e": "Die Folge betont, dass Richtlinien Sicherheit bieten sollen, ohne die Nutzung und Innovation zu blockieren."}, {"id": "B3.vq.2HWhHNhWFfY.nach2", "vid": "2HWhHNhWFfY", "vq": "nach", "t": "lueck", "q": "Copilot kann bei Nutzenden nur auf die Daten zugreifen, für die sie bereits ein ___ haben.", "r": ["zugriffsrecht"], "e": "Ein Gast erklärt, dass Copilot die bestehenden Zugriffsrechte einer Person übernimmt und keine zusätzlichen Daten zeigt."}, {"id": "B3.vq.2HWhHNhWFfY.nach3", "vid": "2HWhHNhWFfY", "vq": "nach", "t": "frei", "q": "Erkläre jemandem aus der Geschäftsleitung in eigenen Worten, warum eine gute KI-Richtlinie kein reines Verbot sein sollte.", "m": "Ein reines Verbot bremst die Mitarbeitenden aus und führt oft nur zu Frust, ohne dass die eigentlichen Risiken wirklich kleiner werden, weil Leute Wege drumherum suchen. Eine gute Richtlinie erklärt stattdessen klar, was erlaubt ist und was nicht, etwa bei Artikel-9-Daten, und zeigt gleichzeitig, wie man KI sicher und produktiv nutzen kann. So bleiben Tempo und Innovation erhalten, während echte Datenschutzrisiken trotzdem vermieden werden."}, {"id": "B3.vq.2HWhHNhWFfY.abc", "t": "abc", "abruf": 1, "vid": "2HWhHNhWFfY", "vq": "nach", "m": ["Artikel 9", "Copilot", "Datenschutz", "Enablement", "Frust", "Governance", "Lokale KI", "OneDrive", "Richtlinie", "Semantische Suche", "SharePoint", "Zugriffsrecht"], "q": "ABC-Liste zu «KI-Richtlinien im Unternehmen: So setzt du sie richtig auf»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B3.vq.2HWhHNhWFfY.kawa", "t": "kawa", "abruf": 1, "vid": "2HWhHNhWFfY", "vq": "nach", "wort": "REGELN", "m": ["R: Rechte-Hygiene: nur wer Zugriff haben darf, sollte ihn auch behalten", "E: Enablement statt Verbot ist das Ziel guter KI-Richtlinien", "G: Grenzen wie Artikel-9-Daten dürfen nie in eine KI eingegeben werden", "L: Lokale KI-Lösung als Alternative, wenn Firmen volle Kontrolle wollen", "N: Nutzungsrichtlinie statt reinem Verbot nennen die Gäste es lieber"], "q": "KaWa zu «REGELN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B3.vq.fFkQoZVeMOs.vor0", "vid": "fFkQoZVeMOs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Worauf verschiebt sich laut dem Panel das Sicherheitsrisiko, wenn KI-Agenten nicht nur antworten, sondern auch selbst Aktionen ausführen können?", "a": ["Von Action Risk zu Output Risk", "Von Output Risk zu Action Risk", "Es gibt gar kein neues Risiko", "Nur auf Datenschutzfragen"], "r": 1, "e": "Das Panel beschreibt eine Verschiebung von reinem Output Risk hin zu Action Risk, wenn Agenten selbst handeln."}, {"id": "B3.vq.fFkQoZVeMOs.vor1", "vid": "fFkQoZVeMOs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ist SQL Injection ein brandneues Sicherheitsproblem, das erst durch KI entstanden ist?", "a": ["Ja, komplett neu durch KI", "Nein, das gibt es schon seit den 1990er Jahren", "Ja, aber nur bei Chatbots", "Nein, das betrifft nur Smartphones"], "r": 1, "e": "Laut Panel gibt es SQL Injections schon seit den 90er Jahren, Prompt Injections sind das eigentlich neue Thema."}, {"id": "B3.v.fFkQoZVeMOs", "t": "frei", "abruf": 1, "vid": "fFkQoZVeMOs", "vq": "nach", "q": "Video «Governance, Security & Responsible AI | No Hype KI Folge 5» (brutkasten): Was waren die Kernaussagen?", "m": "1. Seit Dezember 2024 gibt es die EU-Produkthaftungsrichtlinie (EU) 2024/2853, die zusammen mit dem AI Act entlang der Lieferkette klärt, wer haftet. ACHTUNG, Datum präzisieren: Sie ist seit 8.12.2024 in Kraft, die Mitgliedstaaten müssen sie aber erst bis 9.12.2026 umsetzen, und sie gilt nur für Produkte, die danach in Verkehr kommen. 2. Bei KI-Agenten verschiebt sich das Risiko von reinem Output-Risiko (die KI sagt etwas Falsches) zu Action-Risiko, weil Agenten selbstständig Handlungen wie E-Mail-Versand oder Käufe ausführen können. 3. Neue Angriffsformen wie Prompt Injection treffen auf altbekannte wie SQL Injection, weshalb Unternehmen KI-Projekte aktiv bewerten und in geschützten Testumgebungen (Safe Spaces) ausprobieren sollten, bevor sie produktiv gehen."}, {"id": "B3.vq.fFkQoZVeMOs.nach0", "vid": "fFkQoZVeMOs", "vq": "nach", "t": "mc", "q": "Was ändert sich laut EU AI Act und Produkthaftungsrichtlinie für Unternehmen, die KI einsetzen?", "a": ["Es wird klargestellt, wer haftet, wenn ein KI-System einen Fehler verursacht", "KI-Systeme dürfen ab sofort gar nicht mehr genutzt werden", "Haftungsfragen spielen keine Rolle mehr", "Nur der Hersteller der Hardware haftet"], "r": 0, "e": "Die Produkthaftungsrichtlinie klärt laut Panel entlang der ganzen Lieferkette, wer bei einem KI-Fehler haftet."}, {"id": "B3.vq.fFkQoZVeMOs.nach1", "vid": "fFkQoZVeMOs", "vq": "nach", "t": "ms", "q": "Welche zwei Sicherheitsthemen im Zusammenhang mit KI werden im Video genannt?", "a": ["Prompt Injections", "Zeitzonenprobleme", "SQL Injections", "Fehlende Akkulaufzeit"], "r": [0, 2], "e": "Das Panel nennt Prompt Injections als neues und SQL Injections als altes Sicherheitsthema."}, {"id": "B3.vq.fFkQoZVeMOs.nach2", "vid": "fFkQoZVeMOs", "vq": "nach", "t": "lueck", "q": "Beim Umgang mit hochsensiblen Daten wie in der Sozialversicherung wird KI zuerst in einem sicheren, geschützten Umfeld getestet, bevor es ins ___ geht.", "r": ["rollout"], "e": "Die ITSV testet laut Video KI zuerst sicher und im geschützten Umfeld, bevor der Rollout erfolgt."}, {"id": "B3.vq.fFkQoZVeMOs.nach3", "vid": "fFkQoZVeMOs", "vq": "nach", "t": "frei", "q": "Erkläre den Unterschied zwischen Output Risk und Action Risk bei KI-Agenten an einem eigenen Beispiel.", "m": "Bei Output Risk gibt die KI nur eine falsche oder problematische Antwort, ohne dass etwas passiert, zum Beispiel eine falsche Zahl in einem Text. Bei Action Risk führt ein Agent tatsächlich eine Handlung aus, etwa eine E-Mail zu verschicken oder etwas zu kaufen, was viel grössere Folgen haben kann."}, {"id": "B3.vq.fFkQoZVeMOs.abc", "t": "abc", "abruf": 1, "vid": "fFkQoZVeMOs", "vq": "nach", "m": ["Action Risk", "Datenschutz", "EU AI Act", "Governance", "Haftung", "Innovation Space", "Output Risk", "Produkthaftung", "Prompt Injection", "Responsible AI", "Rollout", "Sicherheit", "SQL Injection"], "q": "ABC-Liste zu «Governance, Security & Responsible AI | No Hype KI Folge 5»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B3.vq.fFkQoZVeMOs.kawa", "t": "kawa", "abruf": 1, "vid": "fFkQoZVeMOs", "vq": "nach", "wort": "AGENT", "m": ["A: Action Risk: die Gefahr, dass ein Agent selbstständig Aktionen ausführt", "G: Governance: Regeln und Zuständigkeiten für den Einsatz von KI", "E: EU AI Act: regelt unter anderem die Haftung bei KI-Fehlern", "N: Neue Angriffsvektoren wie Prompt Injections entstehen durch Agenten", "T: Testumgebung: sensible Daten werden zuerst in einem sicheren Umfeld getestet"], "q": "KaWa zu «AGENT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B3.0", "t": "ms", "q": "Was gehört zwingend in eine einseitige KI-Richtlinie für Mitarbeitende? Wähle drei.", "a": ["Welche Tools erlaubt sind", "Welche Daten nie in ein KI-Tool dürfen", "Wer für das Ergebnis verantwortlich bleibt (der Mensch)", "Die mathematische Funktionsweise von Transformern", "Die Aktienkurse der Anbieter"], "r": [0, 1, 2], "e": "Dazu: Kennzeichnung, Meldeweg bei Vorfällen, Ansprechperson. Kurz und ohne Verbotston, sonst nutzt man die Tools heimlich."}, {"id": "B3.1", "t": "mc", "q": "Was ist KI-Governance?", "a": ["Ein Softwareprodukt", "Regeln, Rollen und Prozesse, die festlegen, wie KI in der Organisation ausgewählt, eingesetzt und kontrolliert wird", "Die Rechtsabteilung", "Ein Gesetz"], "r": 1, "e": "A5: Bedarf und Umfang empfehlen, Richtlinien zu Ethik, Ökologie und Datensicherheit entwerfen, Feedback einholen."}, {"id": "B3.2", "t": "ord", "q": "Du führst eine KI-Richtlinie ein. Bringe die Schritte in die richtige Reihenfolge.", "a": ["Ist-Zustand erheben: Wer nutzt heute was?", "Entwurf mit Fachbereichen, IT und Recht erarbeiten", "Geschäftsleitung entscheidet und steht sichtbar dahinter", "Schulen und kommunizieren, Fragenkanal einrichten", "Einhaltung prüfen und Richtlinie regelmässig anpassen"], "e": "Erst verstehen, dann mit den Betroffenen entwerfen, dann beschliessen, dann befähigen, dann nachhalten."}, {"id": "B3.3", "t": "frei", "q": "Transfer: Zwei Abteilungen haben ohne Absprache KI-Pilotversuche gestartet. Löschen, verbieten, laufen lassen? Deine Empfehlung.", "m": "Weder verbieten noch laufen lassen, sondern registrieren und einordnen: Inventar erstellen (wer, welches Tool, welche Daten, welcher Nutzen), Sofortrisiken stoppen (Personendaten in unsicheren Tools), die Piloten in einen leichten Freigabeprozess überführen. So bleibt die Initiative erhalten, und die Organisation gewinnt Übersicht. Grundlage für das Portfolio (E1)."}], "videos": [{"id": "NJNaG2JrKAE", "kanal": "BUCS IT GmbH", "titel": "Wie baue ich KI-Governance auf?", "dauer": "4:23"}, {"id": "2HWhHNhWFfY", "kanal": "121WATT", "titel": "KI-Richtlinien im Unternehmen: So setzt du sie richtig auf", "dauer": "34:39"}, {"id": "fFkQoZVeMOs", "kanal": "brutkasten", "titel": "Governance, Security & Responsible AI | No Hype KI Folge 5", "dauer": "45:29"}], "pn": 2}, {"key": "B4", "titel": "KI-Ethik, Sicherheit, Nachhaltigkeit", "warum": "A5 nennt wörtlich ethische, ökologische und datensicherheitsbezogene Richtlinien, F4 die Sensibilisierung dafür.", "fragen": [{"id": "B4.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «KI-Ethik, Sicherheit, Nachhaltigkeit»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: A5 nennt wörtlich ethische, ökologische und datensicherheitsbezogene Richtlinien, F4 die Sensibilisierung dafür. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "B4.vq.DTk4vpHs6eA.vor0", "vid": "DTk4vpHs6eA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Kann eine KI laut Video von sich aus ethisch entscheiden?", "a": ["Ja, immer", "Nein, es kann keinen Ethik-Algorithmus geben, der das berechnet", "Nur bei einfachen Fragen", "Nur wenn sie besonders gross trainiert wurde"], "r": 1, "e": "Das Video sagt klar, es kann keinen Ethik-Algorithmus geben, die finale Kontrolle muss beim Menschen bleiben."}, {"id": "B4.vq.DTk4vpHs6eA.vor1", "vid": "DTk4vpHs6eA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woher kommt laut Video das Diskriminierungspotential mancher KI-Systeme?", "a": ["Aus fehlerhafter Hardware", "Aus der einseitigen Zusammensetzung der Entwicklerszene und der Trainingsdaten", "Aus zu langsamen Internetverbindungen", "Aus zu wenig Speicherplatz"], "r": 1, "e": "Weil in der Entwicklerszene deutlich mehr weisse Männer als andere Gruppen vertreten sind, spiegeln Algorithmen bestehende gesellschaftliche Ungleichheiten wider."}, {"id": "B4.v.DTk4vpHs6eA", "t": "frei", "abruf": 1, "vid": "DTk4vpHs6eA", "vq": "nach", "q": "Video «Künstliche Intelligenz: Wo liegen die ethischen Grenzen?» (IU Internationale Hochschule): Was waren die Kernaussagen?", "m": "1. Die ethische Kontrolle über KI-Systeme muss beim Menschen bleiben, da es keinen Algorithmus geben kann, der selbst entscheidet, was ethisch ist. 2. KI-Systeme können strukturelle Diskriminierung reproduzieren, weil sie mit Daten trainiert werden, die von einer wenig diversen Entwicklerszene erstellt und aus einem Internet mit bestehenden Vorurteilen gespeist werden. 3. Chatbots wie ChatGPT erzeugen grammatikalisch korrekte Texte, können aber Zusammenhänge nicht wirklich verstehen oder kritisch hinterfragen, weshalb ihre Trainingsdaten unreflektierte oder diskriminierende Inhalte aus dem Internet widerspiegeln können."}, {"id": "B4.vq.DTk4vpHs6eA.nach0", "vid": "DTk4vpHs6eA", "vq": "nach", "t": "mc", "q": "Was kann ChatGPT laut Video nicht besonders gut, obwohl es grammatikalisch korrekte Texte erzeugt?", "a": ["Wörter zählen", "Zusammenhänge verstehen und kritisch hinterfragen", "Texte auf Deutsch schreiben", "Eine Länge für den Text festlegen"], "r": 1, "e": "Das Video betont, dass der Chatbot Texte generieren kann, aber Zusammenhänge nicht wirklich versteht und nicht kritisch hinterfragt."}, {"id": "B4.vq.DTk4vpHs6eA.nach1", "vid": "DTk4vpHs6eA", "vq": "nach", "t": "ms", "q": "Welche zwei Alltagsbeispiele für KI nennt das Video?", "a": ["Personalisierte Produktempfehlungen im Handel", "Der Facebook-Algorithmus im Newsfeed", "Ein Amortisationsplan für Maschinen", "Eine Stakeholder-Analyse im Projekt"], "r": [0, 1], "e": "Das Video nennt personalisierte Empfehlungen im Handel und den Facebook-Newsfeed-Algorithmus als alltägliche KI-Beispiele."}, {"id": "B4.vq.DTk4vpHs6eA.nach2", "vid": "DTk4vpHs6eA", "vq": "nach", "t": "lueck", "q": "Eine goldene Regel der Ethik lautet laut Video: Rechtfertigt der Zweck die ___?", "r": ["mittel"], "e": "Diese Frage soll laut Video immer wieder aufs Neue geprüft werden."}, {"id": "B4.vq.DTk4vpHs6eA.nach3", "vid": "DTk4vpHs6eA", "vq": "nach", "t": "frei", "q": "Erkläre, warum Trainingsdaten aus dem Internet laut Video ein ethisches Risiko für Chatbots wie ChatGPT darstellen.", "m": "Ein grosser Teil der Trainingsdaten stammt aus dem Internet, wo oft ein rauer und nicht immer respektvoller Umgangston herrscht. Weil die Gesellschaft Diskriminierung und Vorurteile kennt, tauchen diese auch in den Onlinetexten auf, mit denen die KI trainiert wird. Dadurch kann sich diese Diskriminierung unkontrolliert auch in den Antworten des Chatbots wiederfinden."}, {"id": "B4.vq.DTk4vpHs6eA.abc", "t": "abc", "abruf": 1, "vid": "DTk4vpHs6eA", "vq": "nach", "m": ["Algorithmus", "Bevormundung", "Chatbot", "Diskriminierung", "Ethik-Algorithmus", "Facebook", "Gleichberechtigung", "Handel", "Kontrolle", "Missbrauch", "Rassismus", "Trainingsdaten"], "q": "ABC-Liste zu «Künstliche Intelligenz: Wo liegen die ethischen Grenzen?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B4.vq.DTk4vpHs6eA.kawa", "t": "kawa", "abruf": 1, "vid": "DTk4vpHs6eA", "vq": "nach", "wort": "ETHIK", "m": ["E: Ethik-Algorithmus: kann es laut Video nicht geben, Menschen müssen entscheiden", "T: Trainingsdaten: stammen oft aus dem Internet mit rauem Umgangston", "H: Handel: nutzt KI für personalisierte Produktempfehlungen", "I: Imitieren: KI ahmt menschliche Fähigkeiten wie Kreativität nach", "K: Kontrolle: die finale Entscheidung muss beim Menschen bleiben"], "q": "KaWa zu «ETHIK»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B4.vq.FjsZm01HW_w.vor0", "vid": "FjsZm01HW_w", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wo verstecken Hacker laut Video den bösen Befehl bei einer Prompt Injection, wenn nicht in deiner eigenen Eingabe?", "a": ["Im Betriebssystem des Computers", "In Dokumenten wie PDFs, die man der KI zur Verarbeitung gibt", "Im Passwort des Nutzers", "In der Grafikkarte des Servers"], "r": 1, "e": "Das Video sagt ausdrücklich, Hacker manipulieren die Dokumente, die man der KI weitergibt, nicht die eigene Eingabe."}, {"id": "B4.vq.FjsZm01HW_w.vor1", "vid": "FjsZm01HW_w", "vq": "vor", "t": "mc", "q": "Was glaubst du: Auf welchem Platz steht Prompt Injection laut Video in der neuen OWASP-Top-10-Liste der KI-Risiken?", "a": ["Platz 10, also am wenigsten gefährlich", "Platz 5", "Platz 1", "Sie steht gar nicht auf der Liste"], "r": 2, "e": "Das Video nennt Platz 1 als aktuelle Position von Prompt Injection in der OWASP-Liste."}, {"id": "B4.v.FjsZm01HW_w", "t": "frei", "abruf": 1, "vid": "FjsZm01HW_w", "vq": "nach", "q": "Video «Die neue Gefahr im Web: Prompt Injection» (Jörg Schieb | Superkraft KI): Was waren die Kernaussagen?", "m": "1. Prompt Injection gilt laut OWASP als Risiko Nummer eins bei KI-Sicherheit und funktioniert nicht über die eigene Eingabe, sondern über manipulierte Dokumente, die der KI zur Verarbeitung übergeben werden. 2. Ein Angreifer kann in einem PDF oder Lebenslauf einen unsichtbaren Befehl verstecken, etwa die Anweisung, einen Bewerber immer positiv zu bewerten oder vertrauliche Daten zu versenden, den die KI dann tatsächlich ausführt. 3. Eine neue Gefahrenform ist die unsichtbare Prompt Injection mit unsichtbaren Zeichen, bei der Menschen normalen Text sehen, während die KI zusätzliche versteckte Befehle liest."}, {"id": "B4.vq.FjsZm01HW_w.nach0", "vid": "FjsZm01HW_w", "vq": "nach", "t": "mc", "q": "Was macht laut Video eine Prompt Injection so gefährlich, im Unterschied zu dem, was viele denken?", "a": ["Der Nutzer tippt absichtlich einen bösen Befehl ein", "Nicht die eigene Eingabe wird manipuliert, sondern das Dokument, das man der KI gibt", "Die KI stürzt dabei technisch komplett ab", "Es betrifft nur sehr grosse Konzerne"], "r": 1, "e": "Das Video stellt genau diesen Denkfehler klar: manipuliert wird das Dokument, nicht die eigene Eingabe."}, {"id": "B4.vq.FjsZm01HW_w.nach1", "vid": "FjsZm01HW_w", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele für Prompt Injection nennt das Video?", "a": ["Ein PDF mit unsichtbarem Befehl, alle Firmen-E-Mails zu versenden", "Ein Lebenslauf mit verstecktem Text, den Kandidaten immer positiv zu bewerten", "Ein Passwort, das zu einfach gewählt wurde", "Ein Virus, der die Festplatte löscht"], "r": [0, 1], "e": "Das Video nennt genau diese zwei Beispiele für versteckte Befehle in Dokumenten."}, {"id": "B4.vq.FjsZm01HW_w.nach2", "vid": "FjsZm01HW_w", "vq": "nach", "t": "lueck", "q": "Bei der Invisible Prompt Injection sieht der Mensch normalen Text, aber die KI liest darin geheime ___.", "r": ["befehle"], "e": "Das Video beschreibt genau das: für Menschen unsichtbare Zeichen enthalten Befehle, die die KI trotzdem ausliest."}, {"id": "B4.vq.FjsZm01HW_w.nach3", "vid": "FjsZm01HW_w", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie davon gehört hat, warum ein HR-Bot durch einen manipulierten Lebenslauf getäuscht werden kann.", "m": "Im Lebenslauf kann ein für Menschen unsichtbarer Text versteckt sein, der die KI direkt anweist, den Kandidaten positiv zu bewerten. Der HR-Bot liest diesen Text mit und befolgt die Anweisung, ohne dass eine Person das im normalen Dokument sieht. So wird die eigentliche Bewertungsaufgabe der KI unbemerkt manipuliert."}, {"id": "B4.vq.FjsZm01HW_w.abc", "t": "abc", "abruf": 1, "vid": "FjsZm01HW_w", "vq": "nach", "m": ["Befehl", "Chatbot", "Dokument", "Hacker", "HR-Bot", "Lebenslauf", "Manipulation", "OWASP", "PDF", "Prompt Injection", "Unsichtbar", "Zeichen"], "q": "ABC-Liste zu «Die neue Gefahr im Web: Prompt Injection»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B4.vq.FjsZm01HW_w.kawa", "t": "kawa", "abruf": 1, "vid": "FjsZm01HW_w", "vq": "nach", "wort": "BEFEHL", "m": ["B: Befehl: versteckt sich unsichtbar im Dokument", "E: E-Mail: der Köder, mit dem Hacker das PDF verschicken", "F: Firma: jedes Unternehmen mit KI ist laut Video betroffen", "H: HR-Bot: soll Bewerbungen prüfen, wird aber manipuliert", "L: Lebenslauf: enthält im Beispiel den versteckten Befehl"], "q": "KaWa zu «BEFEHL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B4.vq.6ofXXH90--I.vor0", "vid": "6ofXXH90--I", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert bei einem Prompt-Injection-Angriff mit einer KI wie ChatGPT?", "a": ["Der Server der KI wird physisch zerstört", "Ein Angreifer schleust versteckte Befehle in die Eingabe ein, die die KI von ihren eigentlichen Anweisungen abbringen", "Die KI schaltet sich automatisch ab", "Der Angreifer ändert den Quellcode des Modells direkt"], "r": 1, "e": "Prompt Injection bedeutet laut Video, dass jemand mit einer speziell gebauten Eingabe die KI dazu bringt, von ihren ursprünglichen Anweisungen abzuweichen."}, {"id": "B4.vq.6ofXXH90--I.vor1", "vid": "6ofXXH90--I", "vq": "vor", "t": "mc", "q": "Was glaubst du: Für wie viel Geld konnte ein Angreifer im realen Beispiel des Videos per Prompt Injection ein Auto von einem Autohaus kaufen?", "a": ["Für den vollen Preis", "Für nur einen Dollar", "Kostenlos ganz ohne Bezahlung", "Für die Hälfte des Preises"], "r": 1, "e": "Das Video nennt das reale Beispiel eines Angreifers, der ein Auto für nur einen Dollar kaufen konnte, indem er das Sprachmodell manipuliert hat."}, {"id": "B4.v.6ofXXH90--I", "t": "frei", "abruf": 1, "vid": "6ofXXH90--I", "vq": "nach", "q": "Video «Prompt Injection Attack Explained For Beginners» (Whiteboard Security): Was waren die Kernaussagen?", "m": "1. Prompt Injection is an attack where a specially crafted input causes an AI model to override its original instructions and follow the attacker's hidden commands instead. 2. Real-world exploits have used tricks such as embedding hidden instructions or emojis to make an AI ignore its rules, including a documented case where an attacker got a chatbot to agree to sell a car for one dollar. 3. Mitigation strategies include filtering prompts for malicious intent before processing, avoiding training language models on highly sensitive data in the first place, and conducting deliberate red-team testing by injecting malicious prompts to find vulnerabilities."}, {"id": "B4.vq.6ofXXH90--I.nach0", "vid": "6ofXXH90--I", "vq": "nach", "t": "mc", "q": "Was ist laut Video die einfachste Massnahme, um das Risiko von Prompt Injection zu senken?", "a": ["Prompts vor der Verarbeitung auf bösartige Absichten prüfen und filtern", "Das Sprachmodell komplett abschalten", "Nur noch Bilder statt Text verwenden", "Die Internetverbindung des Servers kappen"], "r": 0, "e": "Das Video nennt das Filtern und Scannen von Prompts vor der Verarbeitung als einfachste Massnahme gegen Prompt Injection."}, {"id": "B4.vq.6ofXXH90--I.nach1", "vid": "6ofXXH90--I", "vq": "nach", "t": "mc", "q": "Warum sollte man ein Sprachmodell laut Video gar nicht erst auf hochsensiblen Daten trainieren?", "a": ["Weil sonst Prompt Injection diese Daten später offenlegen könnte", "Weil das Training dann zu schnell abgeschlossen ist", "Weil sensible Daten das Modell kreativer machen", "Weil das gesetzlich überhaupt nicht erlaubt ist"], "r": 0, "e": "Ein Modell kann nur Daten preisgeben, mit denen es trainiert wurde, deshalb rät das Video, sensible Daten gar nicht erst ins Training zu geben."}, {"id": "B4.vq.6ofXXH90--I.nach2", "vid": "6ofXXH90--I", "vq": "nach", "t": "lueck", "q": "Beim absichtlichen Testen eines Systems mit bösartigen Prompts, um Schwachstellen zu finden, spricht das Video von LLM-___.", "r": ["testing", "test"], "e": "Das Video nennt gezieltes LLM-Testing mit eingeschleusten bösartigen Prompts als wichtige Massnahme, um Schwachstellen zu finden."}, {"id": "B4.vq.6ofXXH90--I.nach3", "vid": "6ofXXH90--I", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen an einem eigenen Beispiel, wie ein Angreifer einen freundlichen Kundenservice-Chatbot per Prompt Injection dazu bringen könnte, sich falsch zu verhalten.", "m": "Ein Angreifer könnte dem Chatbot zum Beispiel schreiben, er solle alle bisherigen Anweisungen ignorieren und stattdessen beleidigend antworten. Wenn der Chatbot nicht gut genug abgesichert ist, folgt er dieser versteckten Anweisung statt seiner eigentlichen Aufgabe, freundlich zu antworten. Genau das beschreibt das Video als typisches Beispiel für eine Prompt-Injection-Attacke."}, {"id": "B4.vq.6ofXXH90--I.abc", "t": "abc", "abruf": 1, "vid": "6ofXXH90--I", "vq": "nach", "m": ["Angriff", "Anweisung", "Emoji", "Filterung", "Injection", "Prompt", "Reputation", "Schwachstelle", "Sicherheit", "Testing", "Training", "Vertraulichkeit"], "q": "ABC-Liste zu «Prompt Injection Attack Explained For Beginners»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B4.vq.6ofXXH90--I.kawa", "t": "kawa", "abruf": 1, "vid": "6ofXXH90--I", "vq": "nach", "wort": "PROMPT", "m": ["P: Prompt ist die Eingabe oder Anweisung an ein Sprachmodell", "R: Riskant wird es, wenn versteckte Befehle in die Eingabe sauberer ist. 3. Wichtiger als der aktuelle Stromverbrauch ist laut einer Prognose des Öko-Instituts der erwartete Anstieg, wonach sich der Strombedarf von KI-Rechenzentren zwischen 2023 und 2030 verelffachen könnte."}, {"id": "B4.vq.ej-_4gP2fr8.nach0", "vid": "ej-_4gP2fr8", "vq": "nach", "t": "mc", "q": "Warum verursachte das Training des Modells Bloom laut Video viel weniger CO2 als GPT-3, obwohl es ähnlich gross ist?", "a": ["Weil es in Frankreich mit saubererem Strommix trainiert wurde", "Weil es viel kleiner ist", "Weil es gar nicht trainiert wurde", "Weil es nachts trainiert wurde"], "r": 0, "e": "Bloom wurde in Frankreich trainiert, wo der Strommix deutlich sauberer ist, deshalb war der CO2-Ausstoss trotz ähnlicher Modellgrösse rund 20-mal niedriger."}, {"id": "B4.vq.ej-_4gP2fr8.nach1", "vid": "ej-_4gP2fr8", "vq": "nach", "t": "mc", "q": "Was kritisiert das Video an der oft verbreiteten Zahl, eine ChatGPT-Anfrage verbrauche zehnmal so viel Energie wie eine Google-Suche?", "a": ["Sie ist zu niedrig angesetzt", "Sie basiert auf veralteten und unpassend übertragenen Quellen", "Sie stammt direkt von OpenAI", "Sie wurde nie irgendwo veröffentlicht"], "r": 1, "e": "Die Zahl stützt sich auf eine veraltete Google-Zahl von 2009 und eine Jahre alte Aussage zu einem anderen Modell, die nicht einfach auf ChatGPT übertragen werden kann."}, {"id": "B4.vq.ej-_4gP2fr8.nach2", "vid": "ej-_4gP2fr8", "vq": "nach", "t": "ms", "q": "Welche zwei Grössen bestimmen laut Video, wie klimaschädlich das Training eines KI-Modells ist?", "a": ["Die Menge des verbrauchten Stroms", "Die Anzahl der Buchstaben im Modellnamen", "Die Sauberkeit des genutzten Strommixes", "Die Farbe des Rechenzentrums"], "r": [0, 2], "e": "Sowohl die verbrauchte Strommenge als auch die Herkunft des Stroms, sauber oder fossil, bestimmen die CO2-Bilanz."}, {"id": "B4.vq.ej-_4gP2fr8.nach3", "vid": "ej-_4gP2fr8", "vq": "nach", "t": "frei", "q": "Der Autor des Videos sagt, es sei 'Quatsch', bei der eigenen Klimabilan Im Betrieb summiert sich die Nutzung (Inferenz)."}, {"id": "B4.3", "t": "frei", "q": "Nenne aus dem Kopf fünf ethische Prinzipien für KI-Einsatz und je ein Stichwort zur Umsetzung.", "m": "Fairness (Ergebnis je Gruppe messen). Transparenz (Nutzer wissen, dass KI beteiligt ist, Entscheid ist erklärbar). Menschliche Aufsicht (Mensch entscheidet bei Folgen für Personen). Datenschutz und Sicherheit (Datensparsamkeit, Zugriff). Verantwortlichkeit (benannte Person haftet, nicht «die KI»). Dazu Nachhaltigkeit (angemessene Modellgrösse)."}], "videos": [{"id": "DTk4vpHs6eA", "kanal": "IU Internationale Hochschule", "titel": "Künstliche Intelligenz: Wo liegen die ethischen Grenzen?", "dauer": "5:00"}, {"id": "FjsZm01HW_w", "kanal": "Jörg Schieb | Superkraft KI", "titel": "Die neue Gefahr im Web: Prompt Injection", "dauer": "2:20"}, {"id": "6ofXXH90--I", "kanal": "Whiteboard Security", "titel": "Prompt Injection Attack Explained For Beginners", "dauer": "3:59"}, {"id": "ej-_4gP2fr8", "kanal": "Doktor Whatson", "titel": "Wie umweltschädlich ist ChatGPT wirklich?", "dauer": "16:08"}, {"id": "tk7QrQGP3HA", "kanal": "ARTEde", "titel": "KI: Rechenzentren vs Klimaschutz?", "dauer": "10:26"}], "pn": 4}], "pl": 6}, {"kz": "C", "titel": "Analysieren, bewerten, rechnen", "themen": [{"key": "C1", "titel": "Anforderungen schreiben", "warum": "Die Muss-Anforderung nach Muster aus Challenge 03. Das Video zu Satzschablonen ist genau diese Technik.", "fragen": [{"id": "C1.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Anforderungen schreiben»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Die Muss-Anforderung nach Muster aus Challenge 03. Das Video zu Satzschablonen ist genau diese Technik. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C1.vq.12GcEFXoM-s.vor0", "vid": "12GcEFXoM-s", "vq": "vor", "t": "mc", "q": "Was glaubst du: Womit beginnt die Satzschablone für eine funktionale Anforderung laut Video immer?", "a": ["Mit der Funktion", "Mit dem System", "Mit dem Datum", "Mit dem Kundennamen"], "r": 1, "e": "Die Schablone startet laut Video immer mit der Festlegung des Systems, zum Beispiel dem Bankomaten."}, {"id": "C1.vq.12GcEFXoM-s.vor1", "vid": "12GcEFXoM-s", "vq": "vor", "t": "mc", "q": "Was glaubst du: Mit welchem Wort beginnen Schablonen mit einer zeitlichen Bedingung laut Video?", "a": ["Falls", "Sobald", "Wenn", "Nachdem"], "r": 1, "e": "Das Video nennt Sobald als Beispiel für eine zeitliche Bedingung, während Falls für logische Bedingungen steht."}, {"id": "C1.v.12GcEFXoM-s", "t": "frei", "abruf": 1, "vid": "12GcEFXoM-s", "vq": "nach", "q": "Video «Anforderungen mit Satzschablonen definieren» (Thomas Grosser): Was waren die Kernaussagen?", "m": "1. Die Satzschablone fuer eine funktionale Anforderung besteht aus vier Bausteinen: System, Muss- oder Soll-Einstufung, Benutzeraktion oder selbststaendige Systemaktivitaet, und die eigentliche Funktion. 2. Am Beispiel des Bankomaten lautet die fertige Muss-Anforderung so: Der Bankomat muss dem Kunden die Moeglichkeit bieten, sich mittels Code anzumelden. 3. Bei Anforderungen mit Bedingungen wird vorne eine logische Bedingung mit falls oder eine zeitliche Bedingung mit sobald ergaenzt, etwa Falls der Code korrekt eingegeben wurde, muss der Bankomat selbststaendig das Hauptmenue laden und anzeigen."}, {"id": "C1.vq.12GcEFXoM-s.nach0", "vid": "12GcEFXoM-s", "vq": "nach", "t": "mc", "q": "Was ist laut Video eine funktionale Anforderung?", "a": ["Eine Beschreibung, wie schön ein System aussieht", "Eine Aussage darüber, was ein System macht", "Eine Liste von Programmiersprachen", "Ein Budgetplan für das Projekt"], "r": 1, "e": "Das Video definiert eine funktionale Anforderung als Aussage darüber, was ein System tut."}, {"id": "C1.vq.12GcEFXoM-s.nach1", "vid": "12GcEFXoM-s", "vq": "nach", "t": "ms", "q": "Welche zwei Entscheidungen muss man laut Video beim Ausfüllen der Schablone treffen, bevor man die Funktion formuliert?", "a": ["Muss- oder Soll-Anforderung", "Farbe der Benutzeroberfläche", "Benutzeraktion oder selbstständige Aktivität", "Preis der Software"], "r": [0, 2], "e": "Die Schablone verlangt zuerst die Entscheidung Muss oder Soll und danach, ob eine Benutzeraktion oder eine selbstständige Systemaktivität vorliegt."}, {"id": "C1.vq.12GcEFXoM-s.nach2", "vid": "12GcEFXoM-s", "vq": "nach", "t": "ord", "q": "Bringe die Bestandteile der Satzschablone ohne Bedingung in die richtige Reihenfolge.", "a": ["System festlegen", "Muss oder Soll entscheiden", "Benutzeraktion oder Systemaktivität festlegen", "Funktion formulieren"], "e": "Das Video baut die Schablone genau in dieser Reihenfolge auf, vom System bis zur konkreten Funktion."}, {"id": "C1.vq.12GcEFXoM-s.nach3", "vid": "12GcEFXoM-s", "vq": "nach", "t": "frei", "q": "Formuliere mit der Satzschablone aus dem Video eine eigene Muss-Anforderung für ein System deiner Wahl und erkläre kurz, welche vier Bausteine du verwendet hast.", "m": "Für eine Wetter-App könnte die Anforderung lauten: Die App muss dem Nutzer die Möglichkeit bieten, den aktuellen Standort automatisch zu erkennen. Die vier Bausteine sind hier das System, also die App, die Muss-Entscheidung, die Benutzeraktion beziehungsweise hier eher die selbstständige Aktivität der App, und zum Schluss die konkrete Funktion, den Standort zu erkennen."}, {"id": "C1.vq.12GcEFXoM-s.abc", "t": "abc", "abruf": 1, "vid": "12GcEFXoM-s", "vq": "nach", "m": ["Anforderung", "Bankomat", "Bedingung", "Benutzeraktion", "Code", "Funktion", "Hauptmenü", "Login", "Muss-Anforderung", "Schablone", "Soll-Anforderung", "System"], "q": "ABC-Liste zu «Anforderungen mit Satzschablonen definieren»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C1.vq.12GcEFXoM-s.kawa", "t": "kawa", "abruf": 1, "vid": "12GcEFXoM-s", "vq": "nach", "wort": "AKTION", "m": ["A: Aktion des Kunden, zum Beispiel sich anmelden", "K: Kunde möchte sich am Bankomaten einloggen, das Ausgangsbeispiel", "T: Trennung zwischen Muss- und Soll-Anforderung am Anfang der Schablone", "I: In Bedingungssätzen beginnt man mit Falls oder Sobald", "O: Ohne Benutzeraktion handelt das System manchmal selbstständig", "N: Nach der Entscheidung folgt die eigentliche Funktion"], "q": "KaWa zu «AKTION»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C1.vq.lEc1D5mjleA.vor0", "vid": "lEc1D5mjleA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Von wem stammt der Satz, dass Software das ist, was Entwicklerinnen und Entwickler verstanden haben, nicht was man weiss?", "a": ["Von einem Kunden", "Von Alberto Brandolini, dem Erfinder von Event Storming", "Von einem KI-Chatbot", "Von einer ISO-Norm"], "r": 1, "e": "Das Video nennt Alberto Brandolini als Urheber dieses Zitats."}, {"id": "C1.vq.lEc1D5mjleA.vor1", "vid": "lEc1D5mjleA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Sektionen soll eine gute Anforderung laut Video ungefähr haben?", "a": ["Eine einzige, sehr lange", "Zwei", "Vier: Titel, Kontext, Schritte, Sonstiges", "Zehn"], "r": 2, "e": "Das Video nennt genau vier Sektionen: Titel, Kontext, konkrete Schritte und Sonstiges."}, {"id": "C1.v.lEc1D5mjleA", "t": "frei", "abruf": 1, "vid": "lEc1D5mjleA", "vq": "nach", "q": "Video «Gute Anforderungen schreiben» (the native web GmbH): Was waren die Kernaussagen?", "m": "1. Anforderungen werden in drei Grundarten unterteilt: Feature Requests mit direktem Business Value, technische Tasks ohne direkten Kundennutzen wie Refactoring, und Bug-Reports fuer gefundene Fehler. 2. Eine gute Anforderung besteht aus vier Abschnitten: einem Titel als Wiedererkennungspunkt, dem Kontext mit Problem und Loesungsidee, konkreten Schritten fuer Normalfall und Sonderfaelle sowie sonstigen Informationen wie Zustaendigkeiten. 3. Bug-Reports brauchen zusaetzlich genaue Schritte zur Reproduktion des Fehlers sowie die Angabe von tatsaechlichem und erwartetem Ergebnis, damit Entwicklerinnen und Entwickler den Fehler nachvollziehen koennen."}, {"id": "C1.vq.lEc1D5mjleA.nach0", "vid": "lEc1D5mjleA", "vq": "nach", "t": "mc", "q": "Was ist ein Feature Request laut Video?", "a": ["Eine rein technische Aufgabe ohne Nutzen", "Eine funktionale Anforderung mit Business Value für die Kundschaft", "Ein reiner Fehlerbericht", "Ein Testprotokoll"], "r": 1, "e": "Feature Requests repräsentieren laut Video fachliche Belange mit direktem Nutzen für die Kundschaft."}, {"id": "C1.vq.lEc1D5mjleA.nach1", "vid": "lEc1D5mjleA", "vq": "nach", "t": "ms", "q": "Welche zwei zusätzlichen Angaben braucht ein Bug Report im Vergleich zum normalen Feature Request?", "a": ["Schritte zur Reproduktion des Fehlers", "Ein Foto der Person, die den Fehler meldet", "Das tatsächliche im Vergleich zum erwarteten Ergebnis", "Die Lieblingsfarbe der Kundschaft"], "r": [0, 2], "e": "Ein Bug Report braucht laut Video zusätzlich die Reproduktionsschritte sowie tatsächliches und erwartetes Ergebnis."}, {"id": "C1.vq.lEc1D5mjleA.nach2", "vid": "lEc1D5mjleA", "vq": "nach", "t": "ord", "q": "Bringe die vier Sektionen einer guten Anforderung nach dem Video in eine sinnvolle Reihenfolge.", "a": ["Titel als Aufhänger", "Kontext: Situation und Problem", "Konkrete Schritte", "Sonstiges, also what else"], "e": "Genau in dieser Reihenfolge baut das Video seine Feature Requests auf."}, {"id": "C1.vq.lEc1D5mjleA.nach3", "vid": "lEc1D5mjleA", "vq": "nach", "t": "lueck", "q": "Eine Aufgabe mit technischem Charakter ohne direkten Business Value, wie zum Beispiel Refactoring, nennt das Video einen ___.", "r": ["task"], "e": "Solche technischen Aufgaben ohne direkten Kundennutzen nennt das Video Task."}, {"id": "C1.vq.lEc1D5mjleA.nach4", "vid": "lEc1D5mjleA", "vq": "nach", "t": "frei", "q": "Erkläre, warum ein sehr einfaches Tool mit nur Titel und Textfeld laut Vide
