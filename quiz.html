1, "vid": "s2dfIFduxes", "vq": "nach", "q": "Video «Projektmanagement in 10 Minuten: Definition, Ablauf, magisches Dreieck» (Projektmanagement Einfach Erklärt): Was waren die Kernaussagen?", "m": "1. Ein Projekt definiert sich über Einmaligkeit, Umfang (Teamarbeit statt Einzelarbeit), ein klar messbares Ziel, klare Abgrenzung von Umfang, Zeit und Ressourcen sowie Neuartigkeit und ein damit verbundenes Risiko. 2. Der Projektlebenszyklus gliedert sich in Startphase, Organisations- und Planungsphase, Durchführungsphase und Abschlussphase, wobei der Projektauftrag zu Beginn und die Projektdokumentation am Ende die zentralen Dokumente sind. 3. Das magische Dreieck aus Leistung, Zeit und Ressourcen steht in ständiger Wechselwirkung: Verkürzt sich die Zeit, muss entweder die Leistung sinken oder es müssen mehr Ressourcen eingesetzt werden."}, {"id": "F1.vq.s2dfIFduxes.nach0", "vid": "s2dfIFduxes", "vq": "nach", "t": "mc", "q": "In welcher Projektphase werden laut Video die meisten Ressourcen verbraucht?", "a": ["In der Startphase", "In der Durchführungsphase", "In der Abschlussphase", "In jeder Phase gleich viel"], "r": 1, "e": "Laut Video steigt der Ressourcenverbrauch bis zur Durchführungsphase an und sinkt danach wieder."}, {"id": "F1.vq.s2dfIFduxes.nach1", "vid": "s2dfIFduxes", "vq": "nach", "t": "ms", "q": "Welche zwei Gründe für eine gute Projektdokumentation nennt das Video?", "a": ["Neue Teammitglieder finden sich schneller ein", "Sie macht das Projekt automatisch billiger", "Man kann aus Fehlern lernen", "Sie ersetzt den Projektauftrag komplett"], "r": [0, 2], "e": "Das Video nennt schnellere Einarbeitung und das Lernen aus Fehlern als Gründe für gute Dokumentation."}, {"id": "F1.vq.s2dfIFduxes.nach2", "vid": "s2dfIFduxes", "vq": "nach", "t": "ord", "q": "Bringe die vier Projektphasen aus dem Video in die richtige Reihenfolge.", "a": ["Startphase mit Initiierung und Projektauftrag", "Organisations- und Planungsphase", "Durchführungsphase", "Abschlussphase mit Projektdokumentation"], "e": "Genau in dieser Reihenfolge durchläuft ein Projekt laut Video seinen Lebenszyklus."}, {"id": "F1.vq.s2dfIFduxes.nach3", "vid": "s2dfIFduxes", "vq": "nach", "t": "lueck", "q": "Das Dokument, das am Anfang eines Projekts das gemeinsame Verständnis von Projektleitung und Auftraggeber festhält, heisst der ___.", "r": ["projektauftrag"], "e": "Dieses zentrale Dokument nennt das Video den Projektauftrag."}, {"id": "F1.vq.s2dfIFduxes.nach4", "vid": "s2dfIFduxes", "vq": "nach", "t": "frei", "q": "Erkläre anhand des magischen Dreiecks, was passiert, wenn dein Chef die Projektlaufzeit verkürzt, ohne mehr Ressourcen bereitzustellen.", "m": "Weil Leistung, Zeit und Ressourcen laut Video in Wechselwirkung stehen, muss bei kürzerer Zeit und gleichen Ressourcen entweder die Leistung sinken oder das Projekt schafft nicht mehr alles wie geplant. Ohne zusätzliche Ressourcen lässt sich die kürzere Zeit nicht ohne Qualitäts- oder Umfangsverlust ausgleichen."}, {"id": "F1.vq.s2dfIFduxes.abc", "t": "abc", "abruf": 1, "vid": "s2dfIFduxes", "vq": "nach", "m": ["Abgrenzung", "Auftraggeber", "Durchfuehrungsphase", "Einmaligkeit", "Gantt-Diagramm", "Magisches Dreieck", "Projektauftrag", "Projektleiter", "Ressourcen", "Risiko", "SMART-Methode", "Teamarbeit", "Zielorientierung"], "q": "ABC-Liste zu «Projektmanagement in 10 Minuten: Definition, Ablauf, magisches Dreieck»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F1.vq.s2dfIFduxes.kawa", "t": "kawa", "abruf": 1, "vid": "s2dfIFduxes", "vq": "nach", "wort": "TEAMARBEIT", "m": ["T: Teamarbeit: ein Projekt braucht mehr als eine einzelne Person", "E: Einmaligkeit: ein Projekt wird nicht wiederholt", "A: Abgrenzung: klar definierter Umfang, Zeit und Ressourcen", "M: Magisches Dreieck: Leistung, Zeit und Ressourcen wirken zusammen", "R: Risiko: ein Projekt ist per se risikoreich", "B: Betreten von unbekanntem Terrain: ein Projekt befasst sich immer mit etwas Neuem", "I: Initiierung: der Auftraggeber gibt den Anstoss für das Projekt"], "q": "KaWa zu «TEAMARBEIT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F1.vq.HnQM6bVyGf0.vor0", "vid": "HnQM6bVyGf0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist laut Video der Unterschied zwischen Zielen und Randbedingungen in einem Projektauftrag?", "a": ["Es gibt keinen Unterschied", "Ziele schränken das Projekt absichtlich ein, Randbedingungen unabsichtlich", "Randbedingungen sind wichtiger als Ziele", "Ziele werden nie schriftlich festgehalten"], "r": 1, "e": "Ziele werden bewusst gesetzt, während Randbedingungen sich unabsichtlich aus Umständen wie Ressourcenmangel ergeben."}, {"id": "F1.vq.HnQM6bVyGf0.vor1", "vid": "HnQM6bVyGf0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist für den Projekterfolg laut Video oft wichtiger als die reinen Zahlen und erreichten Ziele?", "a": ["Die Farbe der Präsentation", "Die subjektive Zufriedenheit der wichtigsten Stakeholder", "Die Anzahl der Meetings", "Das Alter des Projektmanagers"], "r": 1, "e": "Wenn die tatsächliche Motivation der Stakeholder erfüllt wurde, sehen sie laut Video über viele Kritikpunkte hinweg."}, {"id": "F1.v.HnQM6bVyGf0", "t": "frei", "abruf": 1, "vid": "HnQM6bVyGf0", "vq": "nach", "q": "Video «Projektauftrag erstellen | Best Practices» (Projektmanagement Einfach Erklärt): Was waren die Kernaussagen?", "m": "1. Ein guter Projektauftrag enthält neben den Zielen auch Randbedingungen (unabsichtliche Einschränkungen wie Lieferantenvorgaben), eine Begründung über den Business Case, Angaben zur Projektorganisation und Entscheidungsbefugnissen sowie eine Analyse der Ausgangssituation. 2. Ziele im Projektauftrag müssen so spezifisch und praxisnah wie möglich formuliert werden, damit alle Beteiligten nach dem Lesen genau verstehen, was sich am Ende verändert haben muss, damit das Projekt als abgeschlossen gilt. 3. Der Projektauftrag hält auch den Grad an Transparenz gegenüber externen Kunden fest, weil ein hohes Mass an Transparenz zwar die Zusammenarbeit erleichtert, aber auch das geistige Eigentum des Unternehmens gefährden kann."}, {"id": "F1.vq.HnQM6bVyGf0.nach0", "vid": "HnQM6bVyGf0", "vq": "nach", "t": "mc", "q": "Wer trägt laut Video letztlich die Verantwortung für den Inhalt des Projektauftrags?", "a": ["Der Projektauftraggeber", "Der Praktikant", "Die IT-Abteilung", "Niemand konkret"], "r": 0, "e": "Der Projektauftraggeber ist laut Video letztlich für den Projektauftrag verantwortlich, auch wenn der Projektleiter mitgestaltet."}, {"id": "F1.vq.HnQM6bVyGf0.nach1", "vid": "HnQM6bVyGf0", "vq": "nach", "t": "ms", "q": "Welche zwei Elemente sollten laut Video unbedingt im Projektauftrag enthalten sein?", "a": ["Eine Begründung wie ein Business Case", "Die Lieblingsfarbe des Kunden", "Informationen zur Projektorganisation", "Ein Foto des Projektteams"], "r": [0, 2], "e": "Eine Begründung für das Projekt und klare Angaben zur Projektorganisation gehören laut Video zu den essentiellen Elementen."}, {"id": "F1.vq.HnQM6bVyGf0.nach2", "vid": "HnQM6bVyGf0", "vq": "nach", "t": "lueck", "q": "Ziele sollten laut Video möglichst spezifisch, praxisnah und ___ formuliert werden.", "r": ["kurz"], "e": "Kurze, verständliche Formulierungen minimieren laut Video Missverständnisse."}, {"id": "F1.vq.HnQM6bVyGf0.nach3", "vid": "HnQM6bVyGf0", "vq": "nach", "t": "frei", "q": "Erkläre, warum der Projektmanager die Kernaussage bzw. Vision des Projekts laut Video immer wieder wiederholen sollte.", "m": "Wenn das Projektteam im Alltag mit vielen Einzelaufgaben beschäftigt ist, kann der Blick fürs grosse Ziel verloren gehen. Wiederholt man die Kernaussage oder Vision des Projekts regelmässig, erinnert das Team sich daran, warum die Arbeit wichtig ist. Das stiftet Sinn, stärkt die Motivation und hält den Fokus auf das Wesentliche."}, {"id": "F1.vq.HnQM6bVyGf0.abc", "t": "abc", "abruf": 1, "vid": "HnQM6bVyGf0", "vq": "nach", "m": ["Anforderung", "Business Case", "Ergebnis", "Kernaussage", "Lastenheft", "Management Summary", "Motivation", "Projektauftraggeber", "Randbedingung", "Stakeholder", "Transparenz", "Vision"], "q": "ABC-Liste zu «Projektauftrag erstellen | Best Practices»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F1.vq.HnQM6bVyGf0.kawa", "t": "kawa", "abruf": 1, "vid": "HnQM6bVyGf0", "vq": "nach", "wort": "VISION", "m": ["V: Vision: sollte wiederholt kommuniziert werden, um das Team zu motivieren", "I: Interne Erkenntnisse: aus vergangenen Projektdokumentationen lernen", "S: Stakeholder-Zufriedenheit: oft wichtiger als objektive Zahlen", "O: Organisation: klärt Rollen und Befugnisse im Projekt", "N: Notizen zur Ausgangssituation: Basis für eine professionelle Planung"], "q": "KaWa zu «VISION»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F1.0", "t": "ms", "q": "Das magische Dreieck des Projektmanagements besteht aus:", "a": ["Zeit", "Kosten", "Leistung/Qualität (Umfang)", "Motivation", "Technologie"], "r": [0, 1, 2], "e": "Wer an einer Ecke zieht, bewegt die anderen. Bei fixem Budget und fixer Frist bleibt nur der Umfang als Stellschraube."}, {"id": "F1.1", "t": "ms", "q": "Was gehört in einen Projektauftrag (D1)? Wähle vier.", "a": ["Ziel und Erfolgskriterien", "Abgrenzung: was nicht dazugehört", "Ressourcen, Rollen, grober Zeitplan", "Risiken und Rahmenbedingungen", "Der fertige Programmcode"], "r": [0, 1, 2, 3], "e": "Der Auftrag wird MIT dem Auftraggeber ausgearbeitet und von ihm unterschrieben."}, {"id": "F1.2", "t": "mc", "q": "Budget 50'000, knappe Ressourcen, unsichere Daten. Wie strukturierst du das Projekt?", "a": ["Alles in einem Schritt umsetzen", "In Etappen mit messbarem Ergebnis und Entscheidungspunkt (weiter, anpassen, stoppen) nach jeder Etappe", "Erst in zwei Jahren starten", "Das Budget verdoppeln"], "r": 1, "e": "Etappierung mit Toren begrenzt das Risiko: Geld wird erst freigegeben, wenn die vorherige Etappe ihre Zahl erreicht hat. Kern von Critical Incident 02."}, {"id": "F1.3", "t": "frei", "q": "Baue aus dem Kopf eine Drei-Etappen-Struktur für ein KI-Prognoseprojekt, je mit Ziel, Zahl am Tor und den drei Ausgängen.", "m": "Etappe 1 Datencheck (4 Wochen, kleines Budget): Sind Stammdaten und Historie brauchbar? Tor: mind. 80 % der Artikel mit vollständiger Historie. Etappe 2 PoC auf einer Warengruppe: schlägt die Prognose den Disponenten? Tor: Prognosefehler mind. 10 % tiefer. Etappe 3 Pilot an einem Standort mit Schulung: Tor: Lagerbestand sinkt messbar, Akzeptanz in Befragung. An jedem Tor: weiter, anpassen oder stoppen."}], "videos": [{"id": "2t4h6t4r0jc", "kanal": "Projekte leicht gemacht", "titel": "Projektmanagement Grundlagen einfach erklärt", "dauer": "7:13"}, {"id": "s2dfIFduxes", "kanal": "Projektmanagement Einfach Erklärt", "titel": "Projektmanagement in 10 Minuten: Definition, Ablauf, magisches Dreieck", "dauer": "10:49"}, {"id": "HnQM6bVyGf0", "kanal": "Projektmanagement Einfach Erklärt", "titel": "Projektauftrag erstellen | Best Practices", "dauer": "14:00"}], "pn": 3}, {"key": "F2", "titel": "Agil arbeiten (Scrum)", "warum": "C3 spricht von iterativem Vorgehen bis zum Prototyp.", "fragen": [{"id": "F2.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Agil arbeiten (Scrum)»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: C3 spricht von iterativem Vorgehen bis zum Prototyp. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "F2.vq.Ibz9STVjtzI.vor0", "vid": "Ibz9STVjtzI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie lang dauert ein Sprint in Scrum laut Video ungefähr?", "a": ["Ein bis vier Tage", "Ein bis vier Wochen", "Ein bis vier Monate", "Genau ein Jahr"], "r": 1, "e": "Das Video nennt einen Sprint als Zeitabschnitt von einer bis vier Wochen."}, {"id": "F2.vq.Ibz9STVjtzI.vor1", "vid": "Ibz9STVjtzI", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wer ist laut Video für das Product Backlog verantwortlich?", "a": ["Der Scrum Master", "Der Product Owner", "Jedes Teammitglied gleichermassen", "Der Kunde direkt"], "r": 1, "e": "Das Video sagt ausdrücklich, der Product Owner ist für das Produkt und das Product Backlog verantwortlich."}, {"id": "F2.v.Ibz9STVjtzI", "t": "frei", "abruf": 1, "vid": "Ibz9STVjtzI", "vq": "nach", "q": "Video «Scrum einfach erklärt» (Sebastian Schneider): Was waren die Kernaussagen?", "m": "1. Ein Sprint ist ein Zeitabschnitt zwischen einer und vier Wochen, innerhalb dessen alle Aktivitäten zur Produktentwicklung ablaufen; geplant wird er im Sprint Planning anhand des priorisierten Product Backlogs. 2. Im täglichen Daily Scrum synchronisiert sich das Entwicklungsteam anhand von drei Fragen: was wurde gestern getan, was wird heute getan, und wo ist das Sprintziel gefährdet. 3. Am Ende des Sprints stellt das Team das entstandene Produktinkrement im Sprint Review vor, während in der anschliessenden Retrospektive unter Leitung des Scrum Masters der Arbeitsprozess selbst reflektiert und verbessert wird."}, {"id": "F2.vq.Ibz9STVjtzI.nach0", "vid": "Ibz9STVjtzI", "vq": "nach", "t": "mc", "q": "Wozu dient laut Video das tägliche Daily-Scrum-Treffen?", "a": ["Um neue Anforderungen ins Product Backlog aufzunehmen", "Um sich über Fortschritt und Hindernisse im Sprint auszutauschen", "Um das fertige Produkt den Kunden zu präsentieren", "Um den nächsten Sprint komplett zu planen"], "r": 1, "e": "Das Video beschreibt das Daily Scrum genau so: täglicher Austausch über Fortschritt und Hindernisse."}, {"id": "F2.vq.Ibz9STVjtzI.nach1", "vid": "Ibz9STVjtzI", "vq": "nach", "t": "ms", "q": "Welche zwei Events aus dem Video gehören zum Ende eines Sprints?", "a": ["Sprint Review", "Sprint Retrospective", "Sprint Planning", "Daily Scrum"], "r": [0, 1], "e": "Sprint Review und Sprint Retrospective finden laut Video am Ende eines Sprints statt."}, {"id": "F2.vq.Ibz9STVjtzI.nach2", "vid": "Ibz9STVjtzI", "vq": "nach", "t": "ord", "q": "Bringe die Scrum-Events eines Sprints in die richtige Reihenfolge, so wie im Video beschrieben.", "a": ["Sprint Planning", "Tägliches Daily Scrum während des Sprints", "Sprint Review mit dem fertigen Produktinkrement", "Sprint Retrospective zum Prozess"], "e": "Das Video beschreibt genau diese Reihenfolge der Events innerhalb eines Sprints."}, {"id": "F2.vq.Ibz9STVjtzI.nach3", "vid": "Ibz9STVjtzI", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen, warum der Product Owner die Anforderungen im Product Backlog nach Priorität sortiert, statt sie in beliebiger Reihenfolge zu lassen.", "m": "Wenn die wichtigsten und klarsten Anforderungen ganz vorne stehen, weiss das Entwicklungsteam sofort, was als nächstes umgesetzt werden soll. Vage oder unwichtige Punkte können weiter hinten bleiben, bis sie genauer ausgearbeitet sind. So verschwendet das Team keine Zeit mit der Suche nach der nächsten sinnvollen Aufgabe."}, {"id": "F2.vq.Ibz9STVjtzI.abc", "t": "abc", "abruf": 1, "vid": "Ibz9STVjtzI", "vq": "nach", "m": ["Anforderung", "Backlog", "Daily Scrum", "Entwicklungsteam", "Hindernis", "Increment", "Kunde", "Product Owner", "Review", "Scrum Master", "Sprint", "Ziel"], "q": "ABC-Liste zu «Scrum einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F2.vq.Ibz9STVjtzI.kawa", "t": "kawa", "abruf": 1, "vid": "Ibz9STVjtzI", "vq": "nach", "wort": "SPRINT", "m": ["S: Sprint: Zeitabschnitt zwischen einer und vier Wochen", "P: Product Owner: verantwortlich für das Product Backlog", "R: Review: das Entwicklungsteam zeigt das fertige Produktinkrement", "I: Increment: das Teilprodukt am Ende eines Sprints", "N: Nächster Sprint: beginnt direkt im Anschluss an die Retrospective", "T: Tag: beim Daily Scrum trifft sich das Team jeden Tag zur gleichen Zeit"], "q": "KaWa zu «SPRINT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F2.vq.CQPffJMb1hE.vor0", "vid": "CQPffJMb1hE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Personen umfasst das Scrum-Team laut Video üblicherweise?", "a": ["Genau eine Person", "Drei bis neun Fachexperten", "Mindestens zwanzig Personen", "Immer genau fünf Personen"], "r": 1, "e": "Das Video nennt drei bis neun Fachexperten als typische Grösse eines selbstorganisierten Scrum-Teams."}, {"id": "F2.vq.CQPffJMb1hE.vor1", "vid": "CQPffJMb1hE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie lange dauert ein Sprint laut Video typischerweise?", "a": ["Ein Tag", "Zwei bis vier Wochen", "Ein ganzes Jahr", "Sechs Monate"], "r": 1, "e": "Das Video beschreibt Sprints als zeitlich auf zwei bis vier Wochen limitierte Bauabschnitte."}, {"id": "F2.v.CQPffJMb1hE", "t": "frei", "abruf": 1, "vid": "CQPffJMb1hE", "vq": "nach", "q": "Video «Agiles Projektmanagement mit SCRUM erklärt» (TÜV SÜD AG): Was waren die Kernaussagen?", "m": "1. Im Scrum-Team gibt es drei zentrale Rollen: Der Product Owner verantwortet Produktvision und Wirtschaftlichkeit, der Scrum Master sorgt für die Einhaltung der Scrum-Regeln und die Beseitigung von Hindernissen, und das selbstorganisierte, interdisziplinäre Entwicklungsteam setzt die Arbeit um. 2. Alle Anforderungen der Stakeholder werden priorisiert im Product Backlog gesammelt, aus dem für jeden zeitlich begrenzten Sprint ein Sprint Backlog mit den auszuführenden Aufgaben abgeleitet wird. 3. Jeder Sprint endet mit einem Sprint Review, bei dem das Ergebnis den Auftraggebern vorgestellt wird, und einer Sprint Retrospektive, in der das Team seine eigene Arbeitsweise für die kommenden Sprints verbessert."}, {"id": "F2.vq.CQPffJMb1hE.nach0", "vid": "CQPffJMb1hE", "vq": "nach", "t": "mc", "q": "Wer sammelt laut Video alle Anforderungen der Stakeholder im Product Backlog?", "a": ["Der Scrum Master", "Der Product Owner", "Die Stakeholder selbst direkt im Sprint", "Der Bürgermeister"], "r": 1, "e": "Der Product Owner ist laut Video verantwortlich dafür, alle Anforderungen im Product Backlog zu sammeln und zu priorisieren."}, {"id": "F2.vq.CQPffJMb1hE.nach1", "vid": "CQPffJMb1hE", "vq": "nach", "t": "mc", "q": "Welche Aufgabe hat der Scrum Master laut Video?", "a": ["Er priorisiert die Produktvision und die Wirtschaftlichkeit", "Er sorgt für die Einhaltung der Scrum-Regeln und beseitigt Hindernisse", "Er baut den Spielplatz eigenhändig", "Er vertritt die Bürger der Stadt"], "r": 1, "e": "Frau Huber als Scrum Master sorgt laut Video für die Einhaltung der Scrum-Regeln und -Werte und beseitigt auftretende Hindernisse."}, {"id": "F2.vq.CQPffJMb1hE.nach2", "vid": "CQPffJMb1hE", "vq": "nach", "t": "lueck", "q": "Das tägliche, maximal 15-minütige Treffen des Entwicklungsteams heisst laut Video Daily ___.", "r": ["scrum"], "e": "Das Video nennt das tägliche Treffen ausdrücklich Daily Scrum, es dauert maximal 15 Minuten."}, {"id": "F2.vq.CQPffJMb1hE.nach3", "vid": "CQPffJMb1hE", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der Scrum nicht kennt, anhand des Beispiels aus dem Video, wie ein Sprint Review und die Sprint Retrospektive zusammenspielen.", "m": "Im Sprint Review zeigt das Team den Auftraggebern und Interessenvertretern das Ergebnis des Sprints, in dem Beispiel des Videos einen Teil des Abenteuerspielplatzes, und es werden neue Anforderungen für das Product Backlog gesammelt. In der anschliessenden Sprint Retrospektive schaut das Team dagegen nach innen und überlegt, wie es seine eigene Arbeitsweise für die kommenden Sprints verbessern kann. So verbindet Scrum laut Video die Sicht der Auftraggeber mit der eigenen Weiterentwicklung des Teams."}, {"id": "F2.vq.CQPffJMb1hE.abc", "t": "abc", "abruf": 1, "vid": "CQPffJMb1hE", "vq": "nach", "m": ["Anforderung", "Backlog", "Daily", "Iteration", "Product Owner", "Retrospektive", "Review", "Scrum", "Scrum Master", "Sprint", "Stakeholder", "Team"], "q": "ABC-Liste zu «Agiles Projektmanagement mit SCRUM erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F2.vq.CQPffJMb1hE.kawa", "t": "kawa", "abruf": 1, "vid": "CQPffJMb1hE", "vq": "nach", "wort": "SPRINT", "m": ["S: Sprint dauert zwischen zwei und vier Wochen", "P: Product Backlog sammelt alle priorisierten Anforderungen", "R: Review zeigt am Sprintende das Ergebnis den Auftraggebern", "I: In der Retrospektive verbessert das Team seine eigene Arbeitsweise", "N: Neue Anforderungen können jederzeit ins Product Backlog aufgenommen werden", "T: Täglich trifft sich das Team maximal 15 Minuten im Daily Scrum"], "q": "KaWa zu «SPRINT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F2.0", "t": "ms", "q": "Die drei Rollen (Verantwortlichkeiten) in Scrum:", "a": ["Product Owner", "Scrum Master", "Developers (Entwicklungsteam)", "Projektleiter", "Lenkungsausschuss"], "r": [0, 1, 2], "e": "Product Owner = was und in welcher Reihenfolge. Scrum Master = Prozess und Hindernisse. Developers = wie."}, {"id": "F2.1", "t": "mc", "q": "Was ist ein Sprint?", "a": ["Eine Überstundenphase vor dem Termin", "Ein fester Zeitraum von höchstens einem Monat, an dessen Ende ein nutzbares Ergebnis steht", "Ein Meeting", "Ein Dokument"], "r": 1, "e": "Kurze Zyklen mit Review und Retrospektive. Passt zu KI-Lösungen, weil man erst am Ergebnis sieht, was die Daten hergeben."}, {"id": "F2.2", "t": "mc", "q": "Warum passt iteratives Vorgehen gut zur Entwicklung von KI-Lösungen (C3)?", "a": ["Weil es moderner klingt", "Weil die Qualität stark von den Daten abhängt und sich erst im Versuch zeigt: früh testen, Feedback einholen, anpassen", "Weil es keine Planung braucht", "Weil es billiger ist"], "r": 1, "e": "C3 spricht von iterativem Prozess bis zum Prototyp und von Feedback der Anspruchsgruppen."}, {"id": "F2.3", "t": "frei", "q": "Wann würdest du trotzdem klassisch (Phasen, Wasserfall) planen?", "m": "Wenn Anforderungen stabil und vertraglich fixiert sind, bei Beschaffung einer Standardlösung mit festem Lieferumfang, bei regulatorischen Abnahmen oder wenn die Organisation keine agilen Rollen stellen kann. Oft hybrid: klassische Etappen mit Toren aussen, iterative Entwicklung innen."}], "videos": [{"id": "Ibz9STVjtzI", "kanal": "Sebastian Schneider", "titel": "Scrum einfach erklärt", "dauer": "3:34"}, {"id": "CQPffJMb1hE", "kanal": "TÜV SÜD AG", "titel": "Agiles Projektmanagement mit SCRUM erklärt", "dauer": "4:32"}], "pn": 5}, {"key": "F3", "titel": "Erfolgskriterien und Kennzahlen", "warum": "D1 (Erfolgskriterien vorschlagen), E2 (Kriterien für die Überwachung). Prüfungsfrage: Kennzahl mit Schwelle und Massnahme.", "fragen": [{"id": "F3.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Erfolgskriterien und Kennzahlen»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: D1 (Erfolgskriterien vorschlagen), E2 (Kriterien für die Überwachung). Prüfungsfrage: Kennzahl mit Schwelle und Massnahme. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "F3.vq.7qs1Gm1FpMo.vor0", "vid": "7qs1Gm1FpMo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht die Abkürzung KPI?", "a": ["Key Performance Indicator", "Kritischer Prozess Index", "Kunden Präferenz Indikator", "Keine Panik Index"], "r": 0, "e": "KPI steht für Key Performance Indicator, auf Deutsch Leistungskennzahl."}, {"id": "F3.vq.7qs1Gm1FpMo.vor1", "vid": "7qs1Gm1FpMo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Im Beispiel des Videos kosten 1000 Euro Facebook-Werbung 10 neue Kunden und 1000 Euro Instagram-Werbung 100 neue Kunden. Welcher Kanal hat die günstigeren Kosten pro Kunde?", "a": ["Facebook, mit 100 Euro pro Kunde", "Instagram, mit 10 Euro pro Kunde", "Beide sind exakt gleich teuer", "Keiner der beiden Kanäle funktioniert"], "r": 1, "e": "Instagram bringt mit 10 Euro pro gewonnenem Kunden deutlich günstigere Customer Acquisition Costs als Facebook mit 100 Euro."}, {"id": "F3.v.7qs1Gm1FpMo", "t": "frei", "abruf": 1, "vid": "7qs1Gm1FpMo", "vq": "nach", "q": "Video «Was sind KPIs? Wichtige Kennzahlen für dein Unternehmen» (STARTUP TEENS): Was waren die Kernaussagen?", "m": "1. KPIs (Key Performance Indicators) sollten nach der SMART-Methode definiert werden: spezifisch, messbar, erreichbar, relevant und zeitlich gebunden. 2. Anhand eines Online-Shop-Beispiels wird gezeigt, wie man die Customer Acquisition Cost (CAC) berechnet, indem man die Werbeausgaben eines Kanals durch die Anzahl der dadurch gewonnenen Kunden teilt, um den effektivsten Akquisekanal zu finden. 3. Vanity Metrics wie Website-Klicks, App-Downloads oder Social-Media-Follower suggerieren Erfolg, sagen aber wenig aus; wichtiger sind tatsächliche Kennzahlen wie zahlende Kunden, aktive Nutzer oder echte Interaktion."}, {"id": "F3.vq.7qs1Gm1FpMo.nach0", "vid": "7qs1Gm1FpMo", "vq": "nach", "t": "mc", "q": "Was bedeutet die Kennzahl CAC, Customer Acquisition Cost?", "a": ["Die Kosten, um einen neuen Kunden zu gewinnen", "Die Anzahl der Klicks auf der Website", "Die Anzahl der Follower auf Social Media", "Der Umsatz pro Sekunde"], "r": 0, "e": "CAC beschreibt, wie viel Geld im Schnitt nötig ist, um über einen bestimmten Kanal einen neuen Kunden zu gewinnen."}, {"id": "F3.vq.7qs1Gm1FpMo.nach1", "vid": "7qs1Gm1FpMo", "vq": "nach", "t": "mc", "q": "Warum warnt das Video vor sogenannten Vanity Metrics wie Website-Klicks oder Followerzahlen?", "a": ["Weil sie zu teuer in der Erhebung sind", "Weil sie einen Erfolg suggerieren, aber keine echte Aussagekraft für das Geschäft haben", "Weil sie gesetzlich verboten sind", "Weil sie nur bei kleinen Unternehmen vorkommen"], "r": 1, "e": "Vanity Metrics wie Klicks oder Follower wirken beeindruckend, sagen aber nichts über echten Erfolg wie zahlende Kunden oder echte Interaktion aus."}, {"id": "F3.vq.7qs1Gm1FpMo.nach2", "vid": "7qs1Gm1FpMo", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele für KPIs nennt das Video konkret?", "a": ["Customer Acquisition Cost (CAC)", "Aktienkurs des Unternehmens", "Conversion Rate", "Wetterbericht"], "r": [0, 2], "e": "Das Video stellt CAC und die Conversion Rate als zwei typische Beispiele für Leistungskennzahlen vor."}, {"id": "F3.vq.7qs1Gm1FpMo.nach3", "vid": "7qs1Gm1FpMo", "vq": "nach", "t": "lueck", "q": "Die fünf Buchstaben, nach denen gute Kennzahlen laut Video aufgestellt werden sollten, ergeben das Wort ___.", "r": ["smart"], "e": "SMART steht für specific, measurable, achievable, relevant und time-bound."}, {"id": "F3.vq.7qs1Gm1FpMo.nach4", "vid": "7qs1Gm1FpMo", "vq": "nach", "t": "frei", "q": "Erkläre, warum die Anzahl der Follower auf Social Media eine 'Vanity Metric' sein kann, während die Interaktion eine bessere Kennzahl ist.", "m": "Viele Follower zu haben, sieht zwar beeindruckend aus, sagt aber nichts darüber aus, ob diese Menschen sich wirklich für das Angebot interessieren oder etwas kaufen. Die Interaktion, also Kommentare oder Klicks im Verhältnis zu den Followern, zeigt viel genauer, ob Inhalte wirklich ankommen und Wirkung erzielen."}, {"id": "F3.vq.7qs1Gm1FpMo.abc", "t": "abc", "abruf": 1, "vid": "7qs1Gm1FpMo", "vq": "nach", "m": ["Achievable", "CAC", "Conversion Rate", "Kennzahl", "Measurable", "Onlineshop", "Relevant", "Specific", "Time-bound", "Vanity Metrics", "Werbekampagne", "Zahlende Kunden"], "q": "ABC-Liste zu «Was sind KPIs? Wichtige Kennzahlen für dein Unternehmen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F3.vq.7qs1Gm1FpMo.kawa", "t": "kawa", "abruf": 1, "vid": "7qs1Gm1FpMo", "vq": "nach", "wort": "SMART", "m": ["S: Specific bedeutet, die Kennzahl muss konkret und auf das Vorhaben bezogen sein.", "M: Measurable heisst, die Kennzahl muss in Zahlen messbar sein.", "A: Achievable heisst, die gesetzten Ziele sollten realistisch erreichbar sein.", "R: Relevant und ergebnisorientiert sollte eine gute Kennzahl sein.", "T: Time-bound bedeutet, die Kennzahl ist zeitlich gebunden."], "q": "KaWa zu «SMART»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F3.vq.z8ZKplsiLKM.vor0", "vid": "z8ZKplsiLKM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht die Abkürzung KPI?", "a": ["Key Performance Indicator", "Kunden Profit Index", "Kosten Preis Information", "Kritischer Prozess Indikator"], "r": 0, "e": "Das Video erklärt, dass KPI für Key Performance Indicator steht, auf Deutsch auch Leistungskennzahl genannt."}, {"id": "F3.vq.z8ZKplsiLKM.vor1", "vid": "z8ZKplsiLKM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man im Online-Marketing die Kennzahl, die zeigt, wie viele Seitenbesucher tatsächlich etwas kaufen?", "a": ["Absprungrate", "Sichtbarkeit", "Conversion Rate", "Verweildauer"], "r": 2, "e": "Das Video nennt die Conversion Rate als die Kennzahl, die zeigt, wie viele Besucher einer Seite tatsächlich etwas kaufen oder eine Transaktion auslösen."}, {"id": "F3.v.z8ZKplsiLKM", "t": "frei", "abruf": 1, "vid": "z8ZKplsiLKM", "vq": "nach", "q": "Video «KPI: Kennzahlen einfach erklärt» (BusinessLikeProfessionals): Was waren die Kernaussagen?", "m": "1. KPIs (Key Performance Indicators) sind betriebswirtschaftliche Kennzahlen, die der Messung und Kontrolle von Fortschritt oder Erfüllungsgrad von Prozessen, Projekten oder Abteilungen dienen. 2. Je nach Unternehmensbereich werden unterschiedliche KPI-Arten genutzt, etwa Kundenbeziehungs- und Kommunikationskennzahlen im Marketing, Projekt- und Qualitätskennzahlen im Management oder Rentabilitäts- und Cashflow-Kennzahlen im Rechnungswesen. 3. Im Online-Marketing zählen Seitenaufrufe, Verweildauer, Conversion-Rate, Absprungrate und durchschnittlicher Bestellwert zu den gängigsten Kennzahlen, mit denen man das Verhalten von Website-Besuchern auswertet."}, {"id": "F3.vq.z8ZKplsiLKM.nach0", "vid": "z8ZKplsiLKM", "vq": "nach", "t": "mc", "q": "Wozu dienen KPIs laut Video ganz allgemein?", "a": ["nur der Unterhaltung des Managements", "der Messung und Kontrolle von Fortschritt oder Erfüllungsgrad", "der automatischen Preisfestlegung", "der Ersetzung aller Mitarbeitenden"], "r": 1, "e": "Das Video definiert den Zweck von KPIs als Messung und Kontrolle von Fortschritt beziehungsweise Erfüllungsgrad."}, {"id": "F3.vq.z8ZKplsiLKM.nach1", "vid": "z8ZKplsiLKM", "vq": "nach", "t": "ms", "q": "Welche zwei Kennzahlen nennt das Video als Beispiele im Online-Marketing?", "a": ["Verweildauer", "Absprungrate", "Kartellrecht", "Umweltauflagen"], "r": [0, 1], "e": "Das Video nennt Verweildauer und Absprungrate ausdrücklich als typische Online-Marketing-KPIs."}, {"id": "F3.vq.z8ZKplsiLKM.nach2", "vid": "z8ZKplsiLKM", "vq": "nach", "t": "lueck", "q": "Wenn jemand eine Seite besucht und sofort wieder verlässt, nennt das Video das eine ___.", "r": ["absprungrate", "bounce rate"], "e": "Das Video beschreibt genau dieses Verhalten, sofortiges Verlassen der Seite, als Absprungrate oder Bounce Rate."}, {"id": "F3.vq.z8ZKplsiLKM.nach3", "vid": "z8ZKplsiLKM", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, welche KPI du für einen kleinen Onlineshop zuerst beobachten würdest und warum.", "m": "Ich würde zuerst die Conversion Rate beobachten, weil sie zeigt, wie viele Besucherinnen und Besucher tatsächlich etwas kaufen. Eine niedrige Conversion Rate trotz vieler Seitenaufrufe würde mir zeigen, dass etwas im Bestellprozess nicht funktioniert. So kann ich gezielt nachschauen, ob zum Beispiel die Absprungrate an einer bestimmten Stelle im Shop besonders hoch ist."}, {"id": "F3.vq.z8ZKplsiLKM.abc", "t": "abc", "abruf": 1, "vid": "z8ZKplsiLKM", "vq": "nach", "m": ["Absprungrate", "Bestellwert", "Cashflow", "Conversion Rate", "KPI", "Leistungskennzahl", "Online-Marketing", "Qualität", "Rentabilität", "Seitenaufrufe", "Sichtbarkeit", "Verweildauer"], "q": "ABC-Liste zu «KPI: Kennzahlen einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F3.vq.z8ZKplsiLKM.kawa", "t": "kawa", "abruf": 1, "vid": "z8ZKplsiLKM", "vq": "nach", "wort": "KENNZAHL", "m": ["K: KPI: betriebswirtschaftliche Kennzahl zur Messung von Fortschritt", "E: Ergebniskennzahlen: Beispiel aus dem internen Rechnungswesen", "N: Nutzung in Abteilungen: Marketing, Management und Rechnungswesen nutzen je eigene KPIs", "Z: Zufriedenheit der Kunden: lässt sich indirekt über KPIs wie Conversion Rate ablesen", "A: Absprungrate: zeigt, wie viele Besucher die Seite sofort wieder verlassen", "H: Häufige KPIs im Online-Marketing: Seitenaufrufe, Verweildauer, Conversion Rate", "L: Liquiditätskennzahlen: Beispiel aus dem internen Rechnungswesen"], "q": "KaWa zu «KENNZAHL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F3.vq.MbR9I06lEOM.vor0", "vid": "MbR9I06lEOM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht das zweite A in manchen Varianten von SMART neben attraktiv?", "a": ["Aktuell", "Akzeptiert", "Automatisch", "Aggressiv"], "r": 1, "e": "Das Video erklärt das A auch als akzeptiert, also die Frage, ob man die Konsequenzen des Ziels wirklich mitträgt."}, {"id": "F3.vq.MbR9I06lEOM.vor1", "vid": "MbR9I06lEOM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Kilometer pro Woche müsste man laut dem Rechenbeispiel im Video joggen, um 200 Kilometer in 52 Wochen zu schaffen?", "a": ["Etwa 1 Kilometer", "Etwa 4 Kilometer", "Etwa 10 Kilometer", "Etwa 20 Kilometer"], "r": 1, "e": "Das Video rechnet vor, dass man bei 200 Kilometern auf 52 Wochen verteilt knapp vier Kilometer pro Woche laufen müsste."}, {"id": "F3.v.MbR9I06lEOM", "t": "frei", "abruf": 1, "vid": "MbR9I06lEOM", "vq": "nach", "q": "Video «Warum SMART-Ziele nicht funktionieren» (Erfolgreich-Projekte-Leiten): Was waren die Kernaussagen?", "m": "1. Die SMART-Formel scheitert in der Praxis oft, weil die Dimensionen A (attraktiv/akzeptiert) und R (realistisch/ressourcenorientiert) unterschätzt werden, obwohl gerade sie über Motivation und Durchhaltevermögen entscheiden. 2. Ein Ziel ist erst dann spezifisch, messbar und terminiert, wenn klar ist, woran und bis wann die Zielerreichung erkennbar ist, zum Beispiel '200 Kilometer in den nächsten 12 Monaten' statt 'mehr Sport machen'. 3. Bei der Zielformulierung sollte man vorab prüfen, ob man bereit ist, die Konsequenzen des Ziels zu akzeptieren, und einen realistischen Weg mit Puffer für Störungen wie Krankheit oder Urlaub einplanen, statt die Zielgrösse einfach gleichmässig auf die Zeit herunterzurechnen."}, {"id": "F3.vq.MbR9I06lEOM.nach0", "vid": "MbR9I06lEOM", "vq": "nach", "t": "mc", "q": "Warum funktioniert das Ziel Ich mache mehr Sport laut Video nicht gut?", "a": ["Weil Sport ungesund ist", "Weil es kein smartes Ziel ist und zu unspezifisch bleibt", "Weil es zu teuer ist", "Weil es verboten ist"], "r": 1, "e": "Das Video erklärt, dass mehr Sport machen kein smartes Ziel ist, weil es unter anderem nicht spezifisch genug formuliert ist."}, {"id": "F3.vq.MbR9I06lEOM.nach1", "vid": "MbR9I06lEOM", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge gehören laut Video zur Ressourcenorientierung eines Ziels?", "a": ["Die Frage, wer einen unterstützen kann", "Die Farbe der Laufschuhe", "Die eigenen Fähigkeiten für das Ziel", "Der Name des Fitnessstudios"], "r": [0, 2], "e": "Das Video nennt Unterstützung durch andere und die eigenen Fähigkeiten als Teil der Ressourcenorientierung."}, {"id": "F3.vq.MbR9I06lEOM.nach2", "vid": "MbR9I06lEOM", "vq": "nach", "t": "lueck", "q": "Ein Ziel sollte laut Video einen zeitlichen Puffer haben, damit man es trotz Hindernissen ___ erreichen kann.", "r": ["trotzdem"], "e": "Das Video empfiehlt einen Puffer von einigen Wochen, damit man das Ziel trotz Krankheit oder Urlaub noch erreicht."}, {"id": "F3.vq.MbR9I06lEOM.nach3", "vid": "MbR9I06lEOM", "vq": "nach", "t": "frei", "q": "Formuliere mit der SMART-Formel aus dem Video ein eigenes kleines Ziel und erkläre, welche der fünf Dimensionen du berücksichtigt hast.", "m": "Ein Beispiel wäre: In den nächsten drei Monaten lese ich jede Woche mindestens ein Fachkapitel zur Prüfungsvorbereitung, jeweils sonntags für eine Stunde. Das Ziel ist spezifisch, weil klar ist was und wann, messbar durch die Anzahl Kapitel, realistisch durch die feste Wochenstunde, und terminiert durch die drei Monate. Attraktiv ist es für mich, weil ich die Prüfung wirklich bestehen möchte."}, {"id": "F3.vq.MbR9I06lEOM.abc", "t": "abc", "abruf": 1, "vid": "MbR9I06lEOM", "vq": "nach", "m": ["Akzeptiert", "Attraktiv", "Konsequenz", "Messbar", "Motivation", "Puffer", "Realistisch", "Ressourcen", "SMART", "Spezifisch", "Terminiert", "Ziel"], "q": "ABC-Liste zu «Warum SMART-Ziele nicht funktionieren»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F3.vq.MbR9I06lEOM.kawa", "t": "kawa", "abruf": 1, "vid": "MbR9I06lEOM", "vq": "nach", "wort": "SMART", "m": ["S: Spezifisch formulieren, statt einfach mehr Sport machen ganz genau sagen was", "M: Messbar machen, zum Beispiel mindestens 200 Kilometer als Zahl festlegen", "A: Attraktiv und akzeptiert muss das Ziel für die Person selbst sein", "R: Realistisch und ressourcenorientiert, zum Beispiel ausreichend Puffer einplanen", "T: Terminiert, ein klarer Zeitpunkt wie 12 Monate gehört dazu"], "q": "KaWa zu «SMART»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F3.0", "t": "mc", "q": "Welche Kennzahl ist handlungsfähig formuliert?", "a": ["Die Qualität soll gut sein", "Fehlalarmquote pro Monat, Schwelle 15 %, darüber prüft ein Mensch alle Fälle und das Modell wird untersucht", "Wir beobachten die Lage", "Kunden sollen zufrieden sein"], "r": 1, "e": "Prüfungsmuster: Kennzahl + Schwellenwert + Massnahme bei Überschreitung."}, {"id": "F3.1", "t": "lueck", "q": "SMART: spezifisch, messbar, attraktiv (akzeptiert), realistisch, ___ .", "r": ["terminiert", "terminierbar", "termin"], "e": "Ein Ziel ohne Termin ist ein Wunsch."}, {"id": "F3.2", "t": "ms", "q": "Welche Dimensionen nennt E2 für die Überwachung von KI-Lösungen? Wähle vier.", "a": ["Betrieb und Sicherheit", "Qualität", "Wirtschaftlichkeit", "Ethik und Nachhaltigkeit", "Bürobeleuchtung"], "r": [0, 1, 2, 3], "e": "Wörtlich: Betrieb, Sicherheit, Qualität, Wirtschaftlichkeit, Nachhaltigkeit, Risiken, Ethik. Häufige Prüfungsfrage: Welche Dimension fehlt im Kennzahlenset?"}, {"id": "F3.3", "t": "frei", "q": "Definiere drei Monatskennzahlen für einen Ticket-Klassifikator, je mit Schwelle und Massnahme.", "m": "1. Trefferquote in 50er-Stichprobe, Schwelle 90 %, darunter Fehleranalyse und Mensch prüft betroffene Kategorien. 2. Anteil übersehener Störungstickets, Schwelle 0, bei jedem Fall sofortige Ursachenanalyse. 3. Kosten pro Ticket (API plus Nacharbeit), Schwelle Budgetwert, darüber Modellgrösse und Aufrufzahl prüfen. Optional: Nutzungsquote als Akzeptanzsignal."}], "videos": [{"id": "7qs1Gm1FpMo", "kanal": "STARTUP TEENS", "titel": "Was sind KPIs? Wichtige Kennzahlen für dein Unternehmen", "dauer": "5:29"}, {"id": "z8ZKplsiLKM", "kanal": "BusinessLikeProfessionals", "titel": "KPI: Kennzahlen einfach erklärt", "dauer": "4:08"}, {"id": "MbR9I06lEOM", "kanal": "Erfolgreich-Projekte-Leiten", "titel": "Warum SMART-Ziele nicht funktionieren", "dauer": "9:02"}], "pn": 2}, {"key": "F4", "titel": "Einführen und schulen", "warum": "D3: Einführungszeitplan, Informations- und Schulungskonzept. Schwaches Feld auf YouTube.", "fragen": [{"id": "F4.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Einführen und schulen»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: D3: Einführungszeitplan, Informations- und Schulungskonzept. Schwaches Feld auf YouTube. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "F4.vq.CVV3wgik2RQ.vor0", "vid": "CVV3wgik2RQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Phasen umfasst der ERP-Einführungsplan im Video?", "a": ["Drei", "Vier", "Sechs", "Zehn"], "r": 2, "e": "Das Video beschreibt genau sechs Phasen für eine ERP-Einführung."}, {"id": "F4.vq.CVV3wgik2RQ.vor1", "vid": "CVV3wgik2RQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: In welcher Phase beginnt laut Video schon die erste Schulung der Endnutzenden?", "a": ["In der ersten Phase Discovery", "In der Testphase", "Erst ganz am Schluss nach dem Go-Live", "Nie, das übernimmt allein der Softwarehersteller"], "r": 1, "e": "Laut Video beginnt schon in der Testphase eine erste, einführende Schulung der Endnutzenden."}, {"id": "F4.v.CVV3wgik2RQ", "t": "frei", "abruf": 1, "vid": "CVV3wgik2RQ", "vq": "nach", "q": "Video «ERP-Einführungsplan: 6 entscheidende Phasen» (NetSuite): Was waren die Kernaussagen?", "m": "1. Eine ERP-Einführung lässt sich in sechs Phasen gliedern: Discovery and Planning, Design, Development, Testing, Deployment (Go-Live) und Support and Updates. 2. In der Design-Phase werden bestehende Arbeitsabläufe, Geschäftsprozesse und Daten analysiert, um die Auswirkungen des neuen ERP-Systems zu bestimmen, bevor in der Development-Phase Konfiguration, Datenmigration und Integrationen umgesetzt werden. 3. Bereits während der Testing-Phase soll mit einführendem Endnutzer-Training begonnen werden, damit die Anwender beim Go-Live in der Deployment-Phase auf das neue System vorbereitet sind."}, {"id": "F4.vq.CVV3wgik2RQ.nach0", "vid": "CVV3wgik2RQ", "vq": "nach", "t": "mc", "q": "Was passiert in der allerersten Phase Discovery and Planning laut Video?", "a": ["Das System geht bereits live", "Es werden Systemanforderungen definiert und die Lösung recherchiert und ausgewählt", "Die Nutzenden werden abschliessend geschult", "Das System wird endgültig abgeschaltet"], "r": 1, "e": "In der ersten Phase werden laut Video Anforderungen definiert und eine passende Lösung ausgewählt."}, {"id": "F4.vq.CVV3wgik2RQ.nach1", "vid": "CVV3wgik2RQ", "vq": "nach", "t": "ms", "q": "Welche zwei Tätigkeiten gehören laut Video zur Entwicklungsphase, also Phase drei?", "a": ["Softwarekonfiguration", "Das Go-Live-Fest planen", "Datenmigration", "Den Softwarevertrag kündigen"], "r": [0, 2], "e": "Softwarekonfiguration und Datenmigration nennt das Video als Teil der Entwicklungsphase."}, {"id": "F4.vq.CVV3wgik2RQ.nach2", "vid": "CVV3wgik2RQ", "vq": "nach", "t": "ord", "q": "Bringe die sechs ERP-Phasen aus dem Video in die richtige Reihenfolge.", "a": ["Discovery and Planning", "Design", "Development", "Testing", "Deployment, also Go-Live", "Support and Updates"], "e": "Das Video nennt die Phasen genau in dieser Reihenfolge."}, {"id": "F4.vq.CVV3wgik2RQ.nach3", "vid": "CVV3wgik2RQ", "vq": "nach", "t": "lueck", "q": "In der Deployment-Phase, also dem Go-Live, sollte man bereit sein, aufkommende Probleme zu ___ und Nutzenden bei der Umstellung zu helfen.", "r": ["beheben", "loesen", "troubleshooten"], "e": "Das Video verlangt, in dieser Phase auftretende Probleme sofort zu beheben."}, {"id": "F4.vq.CVV3wgik2RQ.nach4", "vid": "CVV3wgik2RQ", "vq": "nach", "t": "frei", "q": "Erkläre, warum es laut Video sinnvoll ist, eine ERP-Einführung in sechs klar getrennte Phasen statt in einen einzigen grossen Schritt aufzuteilen.", "m": "Jede Phase hat ein klares Ziel, etwa Anforderungen klären, entwickeln, testen oder live gehen, wodurch Probleme früher auffallen. So lässt sich das Projekt besser steuern und die Beteiligten wissen jederzeit, was als Nächstes ansteht, statt alles auf einmal zu riskieren."}, {"id": "F4.vq.CVV3wgik2RQ.abc", "t": "abc", "abruf": 1, "vid": "CVV3wgik2RQ", "vq": "nach", "m": ["Customization", "Datenmigration", "Deployment", "Design", "Development", "Discovery", "Feedback", "Go-Live", "Support", "Systemanforderungen", "Testing", "Workflows"], "q": "ABC-Liste zu «ERP-Einführungsplan: 6 entscheidende Phasen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F4.vq.CVV3wgik2RQ.kawa", "t": "kawa", "abruf": 1, "vid": "CVV3wgik2RQ", "vq": "nach", "wort": "DESIGN", "m": ["D: Design: Phase zwei, in der bestehende Arbeitsabläufe analysiert werden", "E: Entwicklung: Phase drei mit Softwarekonfiguration und Datenmigration", "S: Support: die letzte Phase mit Nutzerfeedback und Anpassungen", "I: Integration: die Verbindung mit anderen Business-Anwendungen in Phase drei", "G: Go-Live: der Start des neuen Systems in Phase fünf", "N: Nutzerschulung: beginnt laut Video schon während der Testphase"], "q": "KaWa zu «DESIGN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F4.vq.UtKH-a4s5rY.vor0", "vid": "UtKH-a4s5rY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie lange dauert der Pilotbetrieb für neue Franchise-Partner laut Video typischerweise?", "a": ["Ein paar Stunden", "Ein paar Tage bis eine Woche", "Ein ganzes Jahr", "Mehrere Jahre"], "r": 1, "e": "Das Video nennt ein paar Tage oder auch eine Woche im Pilotbetrieb des Franchisegebers."}, {"id": "F4.vq.UtKH-a4s5rY.vor1", "vid": "UtKH-a4s5rY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum werden kaufmännische Grundlagen wie Handelsspanne und Deckungsbeitrag extra geschult?", "a": ["Weil das gesetzlich verboten ist", "Weil nicht jeder Franchise-Partner eine kaufmännische Vorbildung hat", "Weil das nur für grosse Unternehmen gilt", "Weil es sonst zu teuer wäre"], "r": 1, "e": "Das Video betont, dass man nicht voraussetzen sollte, dass jeder Partner diese Grundlagen bereits kennt."}, {"id": "F4.v.UtKH-a4s5rY", "t": "frei", "abruf": 1, "vid": "UtKH-a4s5rY", "vq": "nach", "q": "Video «Was ist ein Schulungskonzept?» (FranchisePORTAL): Was waren die Kernaussagen?", "m": "1. Ein Schulungskonzept beginnt häufig mit einer praktischen Einarbeitungsphase im Pilotbetrieb, bevor ergänzende Schulungen zu Themen wie Qualitätsmanagement, Produkten und Mitarbeiterführung folgen. 2. Weil nicht jeder Teilnehmer kaufmännische Vorkenntnisse mitbringt, sollte das Schulungskonzept auch Grundlagen wie Handelsspanne, Deckungsbeitrag und Steuerthemen abdecken statt sie vorauszusetzen. 3. Schulung endet nicht mit der Einführung, sondern es besteht eine fortlaufende Pflicht zu Weiterbildungen, wenn sich Konzept, Produkte oder Dienstleistungen weiterentwickeln."}, {"id": "F4.vq.UtKH-a4s5rY.nach0", "vid": "UtKH-a4s5rY", "vq": "nach", "t": "mc", "q": "Welche Themen gehören laut Video zu den ersten Schulungen für neue Franchise-Partner?", "a": ["Nur Marketing", "Qualitätsmanagement, Produkt- und Mitarbeiterschulung", "Nur Buchhaltung", "Nur Standortsuche"], "r": 1, "e": "Das Video nennt Qualitätsmanagement, Produktschulung und Mitarbeiterschulung als direkt zum Konzept gehörende Themen."}, {"id": "F4.vq.UtKH-a4s5rY.nach1", "vid": "UtKH-a4s5rY", "vq": "nach", "t": "lueck", "q": "Der Franchisegeber hat laut Video eine ___-Pflicht, das heisst, er muss bestehende Partner immer wieder weiterschulen.", "r": ["innovations"], "e": "Das Video nennt wörtlich die Innovationspflicht des Franchisegebers gegenüber seinen Partnern."}, {"id": "F4.vq.UtKH-a4s5rY.nach2", "vid": "UtKH-a4s5rY", "vq": "nach", "t": "frei", "q": "Erkläre, warum die Ersteinschulung laut Video meist kostenlos oder in einer Schutzgebühr enthalten ist, während spätere Schulungen oft extra bezahlt werden.", "m": "Die Ersteinschulung vermittelt die Grundlagen, die jeder Franchise-Partner braucht, um überhaupt starten zu können, und ist deshalb Teil des ursprünglichen Vertrags. Weiterführende Schulungen wie Zeitmanagement bauen erst später auf diesem Grundwissen auf und werden freiwillig zusätzlich gebucht. Deshalb behandelt das Video beide Arten unterschiedlich in der Bepreisung."}, {"id": "F4.vq.UtKH-a4s5rY.abc", "t": "abc", "abruf": 1, "vid": "UtKH-a4s5rY", "vq": "nach", "m": ["Arbeitsrecht", "Buchhaltung", "Deckungsbeitrag", "Franchisepartner", "Handelsspanne", "Innovationspflicht", "Mitarbeiterschulung", "Pilotbetrieb", "Produktschulung", "Qualitätsmanagement", "Steuerberatung", "Zeitmanagement"], "q": "ABC-Liste zu «Was ist ein Schulungskonzept?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F4.vq.UtKH-a4s5rY.kawa", "t": "kawa", "abruf": 1, "vid": "UtKH-a4s5rY", "vq": "nach", "wort": "SCHULUNG", "m": ["S: Schutzgebühr: deckt oft schon die Ersteinschulung ab", "C: Chance für neue Partner: gemeinsamer Start im Pilotbetrieb", "H: Handelsspanne: eine kaufmännische Grundlage, die geschult wird", "U: Unternehmerpflicht: der Franchisegeber muss ständig weiterschulen", "L: Lernen im Pilotbetrieb: der Partner erlebt die Praxis direkt mit", "N: Neue Franchise-Partner durchlaufen zuerst die Einschulung", "G: Grundlagen wie Deckungsbeitrag werden nicht vorausgesetzt, sondern geschult"], "q": "KaWa zu «SCHULUNG»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F4.vq.MFn66CifD7E.vor0", "vid": "MFn66CifD7E", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was war laut Video der grösste Aufwand bei der Einführung von KI im Unternehmen, mehr als die Technik selbst?", "a": ["Die Server einzurichten", "Alle Mitarbeitenden von der Idee zu überzeugen", "Einen neuen Firmennamen zu finden", "Ein neues Bürogebäude zu bauen"], "r": 1, "e": "Das Video sagt ausdrücklich, der grösste Aufwand war, alle von der Idee zu überzeugen."}, {"id": "F4.vq.MFn66CifD7E.vor1", "vid": "MFn66CifD7E", "vq": "vor", "t": "mc", «TEAM»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F4.vq.qkIOm5O6nWE.vor0", "vid": "qkIOm5O6nWE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist ein Rückfallplan wert, den nie jemand ausprobiert hat?", "a": ["Er ist trotzdem ausreichend", "Er ist eine Hoffnung mit Überschrift", "Er ist gesetzlich vorgeschrieben", "Er ersetzt die Schulung"], "r": 1, "e": "Der Schalter auf den alten Ablauf wird vor dem Start einmal wirklich umgelegt, zur Probe."}, {"id": "F4.vq.qkIOm5O6nWE.vor1", "vid": "qkIOm5O6nWE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Messung zeigt Akzeptanz am ehrlichsten?", "a": ["Die Zufriedenheitsumfrage", "Die Zahl der besuchten Schulungen", "Der Anteil KI-Entwürfe, die gar nicht geöffnet werden", "Das Lob der Geschäftsleitung"], "r": 2, "e": "Wer das Werkzeug umgeht, sagt es in keiner Umfrage. Ungeöffnete Entwürfe sind die ehrlichste Zahl."}, {"id": "F4.v.qkIOm5O6nWE", "t": "frei", "abruf": 1, "vid": "qkIOm5O6nWE", "vq": "nach", "q": "Video «AIB 63 · Lückenfüller 2: Einführungskonzept und Rollout» (EvoldoTV · eigenes Lernvideo (privat)): Was waren die Kernaussagen?", "m": "1. Ein Einführungskonzept hat vier Bausteine, wörtlich aus D3: organisatorisch integrieren, technisch integrieren mit Fachpersonen, Informations- und Schulungskonzept, Einführungs-Zeitplan. 2. Informieren ist nicht schulen, und geschult werden vor allem die Grenzen: Das Team übt an zwanzig echten Mails, von denen fünf absichtlich falsche Entwürfe haben. 3. Ausgerollt wird stufenweise nach dem Satz «grösstes Volumen bei kleinstem Schaden zuerst», gestartet wird erst, wenn fünf Kriterien mit Zahl erfüllt sind und der Rückfall-Schalter getestet ist."}, {"id": "F4.vq.qkIOm5O6nWE.nach0", "vid": "qkIOm5O6nWE", "vq": "nach", "t": "ms", "q": "Welche vier Bausteine nennt D3 für das Einführungskonzept?", "a": ["Organisatorische Integration", "Technische Integration", "Informations- und Schulungskonzept", "Einführungs-Zeitplan", "Marketingkampagne", "Lieferantenbewertung"], "r": [0, 1, 2, 3], "e": "Vier Sätze im Qualifikationsprofil, vier Kästen am Flipchart."}, {"id": "F4.vq.qkIOm5O6nWE.nach1", "vid": "qkIOm5O6nWE", "vq": "nach", "t": "ord", "q": "Ordne die vier Rollout-Wege von «trifft bei einem Fehler sofort alle» bis «null Risiko, aber auch null Entlastung».", "a": ["Alle auf einmal (Big Bang)", "Stufenweise", "Pilotgruppe mit Freiwilligen", "Im Schatten mitlaufen"], "e": "Je weniger Leute betroffen sind, desto kleiner das Risiko und desto kleiner der Nutzen."}, {"id": "F4.vq.qkIOm5O6nWE.nach2", "vid": "qkIOm5O6nWE", "vq": "nach", "t": "mc", "q": "Hochsaison beginnt Mitte Dezember. Warum startet Selina am 3. November?", "a": ["Weil der Anbieter dann Zeit hat", "Weil das Team vor der Spitze vier Wochen Routine braucht", "Weil im November das Budget verfällt", "Weil der Direktor es so wollte"], "r": 1, "e": "Ein Datum ist ein Wunsch. Ein Zeitplan rechnet rückwärts von der Spitze und kennt Ferien, Schulungstage und eine Pufferwoche."}, {"id": "F4.vq.qkIOm5O6nWE.nach3", "vid": "qkIOm5O6nWE", "vq": "nach", "t": "frei", "q": "Nenne aus dem Kopf die fünf Startkriterien und sage, was passiert, wenn eines rot ist.", "m": "Training besucht (11 von 12), Abschlusstest bestanden (45 von 50 Entwürfen brauchbar), Rückfall-Schalter getestet, Wissensbasis aktuell mit eingeteilter Person, Key User und Support anwesend. Ist eines rot, wird verschoben, nicht diskutiert. Dafür gibt es die Pufferwoche. Entscheiden tut die Produktverantwortliche auf Vorschlag."}, {"id": "F4.vq.qkIOm5O6nWE.abc", "t": "abc", "abruf": 1, "vid": "qkIOm5O6nWE", "vq": "nach", "m": ["Anlaufstelle", "Big Bang", "Demo", "Freeze", "Go/No-Go", "Grenzen", "Hochsaison", "Key User", "Pilot", "Produktverantwortliche", "Rückfall", "Schatten", "Sprechstunde", "Stufenweise", "Wissensbasis", "Zeitplan"], "q": "ABC-Liste zu «AIB 63 · Lückenfüller 2: Einführungskonzept und Rollout»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem was vorher und nachher. 2. Verantwortung: Wer ist Produktverantwortliche, wer entscheidet im Zweifel. 3. Support: Wohin meldet man Fehler, wer reagiert in welcher Zeit. 4. Spezifische Regeln: was die KI darf, Freigaben, Rückfallprozess bei Ausfall."}], "videos": [{"id": "CVV3wgik2RQ", "kanal": "NetSuite", "titel": "ERP-Einführungsplan: 6 entscheidende Phasen", "dauer": "1:52"}, {"id": "UtKH-a4s5rY", "kanal": "FranchisePORTAL", "titel": "Was ist ein Schulungskonzept?", "dauer": "2:33"}, {"id": "MFn66CifD7E", "kanal": "Christoph Magnussen", "titel": "KI erfolgreich im Unternehmen ausrollen | AI Experience Day bei Leonhard Weiss", "dauer": "4:17"}, {"id": "qkIOm5O6nWE", "kanal": "EvoldoTV · eigenes Lernvideo (privat)", "titel": "AIB 63 · Lückenfüller 2: Einführungskonzept und Rollout", "dauer": "13:50"}], "pn": 1}, {"key": "F5", "titel": "Team führen, Konflikte klären", "warum": "C3 nennt wörtlich: Konflikte im Team identifizieren und Massnahmen einleiten.", "fragen": [{"id": "F5.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Team führen, Konflikte klären»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: C3 nennt wörtlich: Konflikte im Team identifizieren und Massnahmen einleiten. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "F5.vq.tJgkHsZv9F4.vor0", "vid": "tJgkHsZv9F4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele grundlegende Konfliktlösungsmöglichkeiten stellt das Video vor?", "a": ["Drei", "Fünf", "Sieben", "Zehn"], "r": 1, "e": "Das Video zeigt genau fünf Konfliktlösungsmöglichkeiten: Flucht, Kampf, Delegation, Kompromiss und Konsens."}, {"id": "F5.vq.tJgkHsZv9F4.vor1", "vid": "tJgkHsZv9F4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Konfliktlösung führt laut Video am ehesten zu einer echten Win-Win-Situation?", "a": ["Der Kampf", "Der Konsens", "Die Flucht", "Die Delegation"], "r": 1, "e": "Das Video beschreibt den Konsens als Lösung, bei der beide Parteien zufrieden sind und die persönliche Bindung wächst, also eine echte Win-Win-Situation."}, {"id": "F5.v.tJgkHsZv9F4", "t": "frei", "abruf": 1, "vid": "tJgkHsZv9F4", "vq": "nach", "q": "Video «Konflikte lösen: die 5 Wege» (Smart Leadership): Was waren die Kernaussagen?", "m": "1. Es gibt fünf grundlegende Konfliktlösungsmöglichkeiten: Flucht, Kampf, Delegation an Dritte, Kompromiss und Konsens, die jeweils unterschiedliche Vor- und Nachteile haben. 2. Flucht und Kampf eignen sich nur für die letzten, stark eskalierten Konfliktstufen nach Glasl, während der Kompromiss vor allem in den ersten beiden, noch wenig eskalierten Stufen sinnvoll ist. 3. Der Konsens gilt als Win-Win-Lösung, weil beide Parteien ihre ursprünglichen Positionen loslassen und stattdessen die dahinterliegenden Interessen in den Fokus rücken, erfordert aber mehr Mut, Offenheit und Zeit als die anderen Methoden."}, {"id": "F5.vq.tJgkHsZv9F4.nach0", "vid": "tJgkHsZv9F4", "vq": "nach", "t": "mc", "q": "Was passiert laut Video bei der Konfliktlösung Kampf?", "a": ["Der Konfliktpartner wird vernichtet oder man unterwirft sich ihm", "Beide Parteien einigen sich auf halbem Weg", "Ein Dritter entscheidet den Konflikt", "Der Konflikt wird einfach ignoriert"], "r": 0, "e": "Beim Kampf gibt es laut Video nur zwei Ergebnisse: der Konfliktpartner wird vernichtet, oder man unterwirft sich ihm."}, {"id": "F5.vq.tJgkHsZv9F4.nach1", "vid": "tJgkHsZv9F4", "vq": "nach", "t": "mc", "q": "Für welche Eskalationsstufen eignet sich der Kompromiss laut Video besonders?", "a": ["Nur für die letzten drei Eskalationsstufen", "Für die erste und zweite Ebene, vom Aufkommen des Konflikts bis zu verbalen Drohungen", "Ausschliesslich für bewaffnete Konflikte", "Für gar keine Eskalationsstufe"], "r": 1, "e": "Das Video ordnet den Kompromiss der ersten und zweiten Eskalationsebene zu, also frühen Konfliktphasen."}, {"id": "F5.vq.tJgkHsZv9F4.nach2", "vid": "tJgkHsZv9F4", "vq": "nach", "t": "ms", "q": "Welche zwei Nachteile nennt das Video für die Konfliktlösung Flucht?", "a": ["Der Konflikt kann jederzeit wieder aufbrechen", "Es gibt keine wirkliche Lösung des Konflikts", "Es gibt immer einen klaren Verlierer", "Sie dauert länger als alle anderen Methoden"], "r": [0, 1], "e": "Das Video nennt als Nachteile der Flucht, dass der Konflikt jederzeit wieder aufbrechen kann und keine echte Lösung entsteht."}, {"id": "F5.vq.tJgkHsZv9F4.nach3", "vid": "tJgkHsZv9F4", "vq": "nach", "t": "frei", "q": "Erkläre anhand einer eigenen Erfahrung, wann du schon einmal einen Kompromiss statt eines Konsenses gefunden hast, und was laut Video der Unterschied zwischen beiden ist.", "m": "Ein Kompromiss bedeutet laut Video, dass jede Seite einen Teil ihrer Position aufgibt, um zu einer Teileinigung zu kommen, während beim Konsens eine ganz neue Lösung gesucht wird, die beide Seiten wirklich zufriedenstellt. Ich habe zum Beispiel mit einem Freund einen Kompromiss gefunden, als wir uns nicht einigen konnten, welchen Film wir schauen, und wir abwechselnd unsere Wünsche umgesetzt haben. Ein Konsens hätte bedeutet, gemeinsam eine ganz neue Aktivität zu finden, die uns beiden sogar noch besser gefällt."}, {"id": "F5.vq.tJgkHsZv9F4.abc", "t": "abc", "abruf": 1, "vid": "tJgkHsZv9F4", "vq": "nach", "m": ["Bindung", "Delegation", "Eskalationsstufe", "Flucht", "Kampf", "Kompromiss", "Konfliktpartner", "Konsens", "Lösung", "Offenheit", "Vertrauen", "Zufriedenheit"], "q": "ABC-Liste zu «Konflikte lösen: die 5 Wege»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F5.vq.tJgkHsZv9F4.kawa", "t": "kawa", "abruf": 1, "vid": "tJgkHsZv9F4", "vq": "nach", "wort": "KONFLIKT", "m": ["K: Kompromiss bedeutet, dass beide Seiten einen Teil ihrer Position aufgeben", "O: Offenheit braucht es für den anspruchsvollen Weg zum Konsens", "N: Neue Lösungen jenseits der Ausgangsforderungen sucht der Konsens", "F: Flucht löst den Konflikt nicht wirklich, er kann wieder aufbrechen", "L: Lösungen per Delegation überlässt man einer dritten Partei", "I: In den letzten Eskalationsstufen passen Flucht und Kampf am besten", "T: Teileinigung nennt man das Ergebnis eines Kompromisses"], "q": "KaWa zu «KONFLIKT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F5.vq.1vuYtTabWkc.vor0", "vid": "1vuYtTabWkc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Eskalationsstufen unterscheidet das Konfliktmodell von Friedrich Glasl?", "a": ["Drei", "Fünf", "Sieben", "Neun"], "r": 3, "e": "Glasl unterteilt Konflikte in neun Eskalationsstufen, die wiederum in drei Hauptphasen gegliedert sind."}, {"id": "F5.vq.1vuYtTabWkc.vor1", "vid": "1vuYtTabWkc", "vq": "vor", "t": "mc", "q": "Was glaubst du: In welcher Phase kann noch eine für beide Seiten vorteilhafte Lösung gefunden werden?", "a": ["Nur in der letzten Phase 'gemeinsam in den Abgrund'", "In der ersten Phase 'win-win'", "In keiner Phase mehr", "Nur bei Stufe 9"], "r": 1, "e": "In der ersten Phase, win-win, ist der Konflikt noch konstruktiv und eine für beide Seiten gute Lösung ist möglich."}, {"id": "F5.v.1vuYtTabWkc", "t": "frei", "abruf": 1, "vid": "1vuYtTabWkc", "vq": "nach", "q": "Video «9 Stufen der Konflikteskalation nach Glasl» (Erzieherkanal): Was waren die Kernaussagen?", "m": "1. Die Konflikteskalationstheorie nach Glasl unterteilt Konflikte in neun Stufen, die in drei Hauptphasen gruppiert sind: Win-win (Stufen 1-3), Win-lose (Stufen 4-6) und Lose-lose (Stufen 7-9). 2. In der frühen Win-win-Phase (Verhärtung, Polarisation, Taten statt Worte) sind Mediation und Moderation geeignete Methoden, während in der Win-lose-Phase (Images und Koalitionen, Gesichtsverlust, Drohstrategien) Verfahren und Machteingriffe durch Vorgesetzte nötig werden können. 3. In der eskaliertesten Lose-lose-Phase (begrenzte Vernichtungsschläge, Zersplitterung, gemeinsam in den Abgrund) sind nur noch Zwangsmassnahmen oder eine Trennung der Konfliktparteien sinnvoll, um den Schaden zu begrenzen."}, {"id": "F5.vq.1vuYtTabWkc.nach0", "vid": "1vuYtTabWkc", "vq": "nach", "t": "mc", "q": "Welche drei Stufen gehören zur ersten Phase 'win-win' nach Glasl?", "a": ["Verhärtung, Polarisation und Debatte, Taten statt Worte", "Images und Koalition, Gesichtsverlust, Drohstrategien", "Vernichtungsschläge, Zersplitterung, gemeinsam in den Abgrund", "Mediation, Moderation, Schlichtung"], "r": 0, "e": "Die ersten drei Stufen 1 bis 3 bilden die Phase win-win: Verhärtung, Polarisation/Debatte und Taten statt Worte."}, {"id": "F5.vq.1vuYtTabWkc.nach1", "vid": "1vuYtTabWkc", "vq": "nach", "t": "mc", "q": "Welche Konfliktlösungsmethode empfiehlt das Video für die Phase win-lose, Stufen 4 bis 6?", "a": ["Nur noch Trennung der Parteien", "Verfahren und Machteingriffe, z.B. durch Vorgesetzte", "Gar keine Intervention mehr nötig", "Ausschliesslich Mediation"], "r": 1, "e": "In der Phase win-lose sind Verfahren und Machteingriffe sinnvoll, etwa wenn ein Vorgesetzter eingreifen muss."}, {"id": "F5.vq.1vuYtTabWkc.nach2", "vid": "1vuYtTabWkc", "vq": "nach", "t": "ord", "q": "Bringe die drei Hauptphasen nach Glasl in die richtige Reihenfolge der Eskalation.", "a": ["Win-win", "Win-lose", "Lose-lose"], "e": "Ein Konflikt eskaliert laut Glasl von win-win über win-lose bis hin zu lose-lose."}, {"id": "F5.vq.1vuYtTabWkc.nach3", "vid": "1vuYtTabWkc", "vq": "nach", "t": "frei", "q": "Erkläre, warum es laut Video wichtig ist, einen Konflikt möglichst früh, also in der Phase win-win, zu erkennen und einzugreifen.", "m": "Je früher ein Konflikt erkannt wird, desto eher lässt er sich noch mit Gesprächen, Mediation oder Moderation lösen, ohne dass eine Seite verliert. Je weiter der Konflikt eskaliert, desto mehr geht es nur noch darum, den Schaden zu begrenzen, weil in den späteren Phasen keine für beide Seiten gute Lösung mehr möglich ist."}, {"id": "F5.vq.1vuYtTabWkc.abc", "t": "abc", "abruf": 1, "vid": "1vuYtTabWkc", "vq": "nach", "m": ["Debatte", "Drohstrategien", "Eskalationsstufen", "Gesichtsverlust", "Glasl", "Images und Koalitionen", "Konflikt", "Machteingriffe", "Mediation", "Polarisation", "Trennung", "Verhärtung", "Win-Win", "Zersplitterung"], "q": "ABC-Liste zu «9 Stufen der Konflikteskalation nach Glasl»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "F5.vq.1vuYtTabWkc.kawa", "t": "kawa", "abruf": 1, "vid": "1vuYtTabWkc", "vq": "nach", "wort": "GLASL", "m": ["G: Gesichtsverlust ist Stufe 5, hier wird der Konflikt persönlich.", "L: Lose-Lose ist die letzte Phase, in der beide Seiten verlieren.", "A: Auf Stufe 4 bilden die Parteien negative Bilder voneinander und suchen Koalitionen.", "S: Stufe 1 heisst Verhärtung, hier beginnen sich die Positionen zu verfestigen."], "q": "KaWa zu «GLASL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "F5.0", "t": "mc", "q": "Glasl unterscheidet neun Eskalationsstufen in drei Ebenen. Was gilt in der ersten Ebene (Stufen 1 bis 3)?", "a": ["Beide können noch gewinnen (Win-Win), die Parteien können es selbst oder mit Moderation lösen", "Einer verliert sicher", "Beide verlieren", "Es braucht einen Machteingriff"], "r": 0, "e": "Ebene 2: Win-Lose, braucht externe Hilfe (Mediation). Ebene 3: Lose-Lose, braucht Machteingriff."}, {"id": "F5.1", "t": "mc", "q": "Im PoC-Team streiten Data Scientist und Fachexpertin über die Zielgrösse. Was tust du als fachliche Leitung ZUERST?", "a": ["Selbst entscheiden und weitermachen", "Beide Positionen und die dahinterliegenden Interessen sichtbar machen und auf die vereinbarte Anforderung zurückführen", "Den Konflikt der Geschäftsleitung melden", "Eine Person aus dem Team nehmen"], "r": 1, "e": "Sachkonflikt früh klären, bevor er zum Beziehungskonflikt wird. C3 nennt Konfliktbewältigung wörtlich."}, {"id": "F5.2", "t": "frei", "q": "Was heisst «ein Team in fachlicher Hinsicht führen», und was heisst es nicht?", "m": "Fachlich führen heisst: Ziele und Anforderungen klären, Aufgaben koordinieren, Ergebnisse gegen die Anforderungen prüfen, Entscheidungen vorbereiten, Hindernisse wegräumen, Konflikte ansprechen. Es heisst nicht: Personalverantwortung, Lohn, Beurteilung. Darum führt man über Klarheit, Überzeugung und Beziehungen, nicht über Weisung."}], "videos": [{"id": "tJgkHsZv9F4", "kanal": "Smart Leadership", "titel": "Konflikte lösen: die 5 Wege", "dauer": "3:39"}, {"id": "1vuYtTabWkc", "kanal": "Erzieherkanal", "titel": "9 Stufen der Konflikteskalation nach Glasl", "dauer": "6:04"}], "pn": 4}], "pl": 5}, {"kz": "D", "titel": "Menschen mitnehmen und Betrieb steuern", "themen": [{"key": "D1", "titel": "Change Management: ADKAR, Kotter, Lewin", "warum": "F2 und F3. Critical Incident 02 und 03 sind Change-Fälle.", "fragen": [{"id": "D1.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Change Management: ADKAR, Kotter, Lewin»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: F2 und F3. Critical Incident 02 und 03 sind Change-Fälle. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "D1.vq.oMiI59NMO2Q.vor0", "vid": "oMiI59NMO2Q", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wer hat das ADKAR-Modell in den 1990er Jahren entwickelt?", "a": ["Jeff Hiatt", "John Kotter", "Kurt Lewin", "Peter Drucker"], "r": 0, "e": "Das Video nennt Jeff Hiatt als Entwickler des ADKAR-Modells in den 1990er Jahren."}, {"id": "D1.vq.oMiI59NMO2Q.vor1", "vid": "oMiI59NMO2Q", "vq": "vor", "t": "mc", "q": "Was glaubst du: Setzt das ADKAR-Modell den Fokus eher auf die ganze Organisation oder auf jede einzelne Person?", "a": ["nur auf die gesamte Organisation als Ganzes", "auf jede einzelne Person, denn nur wenn Einzelne sich ändern, ändert sich die Organisation", "nur auf die oberste Führungsebene", "auf gar niemanden, es ist rein technisch"], "r": 1, "e": "Das Video betont, dass ADKAR anders als die meisten Modelle auf der individuellen Ebene ansetzt: nur wenn jede Person sich ändert, ändert sich am Ende die ganze Organisation."}, {"id": "D1.v.oMiI59NMO2Q", "t": "frei", "abruf": 1, "vid": "oMiI59NMO2Q", "vq": "nach", "q": "Video «ADKAR-Änderungsmanagementmodell» (EPM): Was waren die Kernaussagen?", "m": "1. Das ADKAR-Modell von Jeff Hiatt setzt beim einzelnen Menschen an, nicht bei der Organisation, weil sich eine Organisation nur verändert, wenn sich jedes Individuum in ihr verändert. 2. Die fünf Schritte Awareness, Desire, Knowledge, Ability und Reinforcement bauen aufeinander auf, sodass Wissen erst dann nützt, wenn Bewusstsein und Wunsch zur Veränderung bereits vorhanden sind. 3. Der letzte Schritt Reinforcement gilt als der schwierigste, weil Organisationen nach dem Go-Live sofort zum nächsten Projekt weiterziehen, statt neuen Verhaltensweisen Zeit zum Festigen zu geben."}, {"id": "D1.vq.oMiI59NMO2Q.nach0", "vid": "oMiI59NMO2Q", "vq": "nach", "t": "mc", "q": "Was ist laut Video der Kernunterschied zwischen dem dritten Schritt Knowledge und dem vierten Schritt Ability?", "a": ["Knowledge ist Theorie, wie man sich ändern soll, Ability ist die tatsächlich gezeigte Fähigkeit dazu", "beide Schritte bedeuten genau dasselbe", "Ability kommt vor Knowledge", "Knowledge betrifft nur das Management, Ability nur die Mitarbeitenden"], "r": 0, "e": "Das Video unterscheidet Wissen (Knowledge), also die Theorie, wie man sich verändern soll, von der praktisch gezeigten Fähigkeit (Ability), die neuen Verhaltensweisen umzusetzen."}, {"id": "D1.vq.oMiI59NMO2Q.nach1", "vid": "oMiI59NMO2Q", "vq": "nach", "t": "ms", "q": "Welche zwei Methoden nennt das Video, um die letzte Stufe Reinforcement zu erreichen?", "a": ["schnelle Korrekturmassnahmen, wenn etwas schiefgeht", "positive Verstärkung und Feedback", "das Thema danach sofort vergessen", "keine Rückmeldung mehr geben"], "r": [0, 1], "e": "Das Video nennt schnelle Korrekturmassnahmen sowie positive Verstärkung und Feedback als Methoden, um neue Verhaltensweisen dauerhaft zu verankern."}, {"id": "D1.vq.oMiI59NMO2Q.nach2", "vid": "oMiI59NMO2Q", "vq": "nach", "t": "ord", "q": "Bringe die fünf ADKAR-Schritte in die richtige Reihenfolge.", "a": ["Awareness: Bewusstsein für die Notwendigkeit der Veränderung", "Desire: der Wunsch, an der Veränderung teilzunehmen", "Knowledge: Wissen, wie man sich verändern soll", "Ability: die Fähigkeit, das neue Verhalten zu zeigen", "Reinforcement: die Verstärkung, damit die Veränderung bleibt"], "e": "Das Video erklärt, dass die fünf Schritte aufeinander aufbauen und deshalb in genau dieser Reihenfolge durchlaufen werden müssen."}, {"id": "D1.vq.oMiI59NMO2Q.nach3", "vid": "oMiI59NMO2Q", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen an einem Beispiel aus deinem Umfeld, warum eine Veränderung trotz guter Idee scheitern kann, wenn ein ADKAR-Schritt fehlt.", "m": "Wenn zum Beispiel ein neues IT-System eingeführt wird, aber niemand erklärt wurde, warum es nötig ist, fehlt schon die Stufe Awareness und die Akzeptanz bleibt gering. Selbst wenn alle wissen, wie das System funktioniert, kann die Einführung scheitern, wenn nach dem Start niemand mehr das neue Verhalten belohnt oder Fehler korrigiert, also die Stufe Reinforcement fehlt. Ohne diese letzte Verstärkung fallen viele Mitarbeitende schnell wieder in die alten Gewohnheiten zurück, wie das Video erklärt."}, {"id": "D1.vq.oMiI59NMO2Q.abc", "t": "abc", "abruf": 1, "vid": "oMiI59NMO2Q", "vq": "nach", "m": ["Ability", "ADKAR", "Awareness", "Desire", "Feedback", "Jeff Hiatt", "Knowledge", "Kotter", "Reinforcement", "Verhalten", "Veränderung", "Widerstand"], "q": "ABC-Liste zu «ADKAR-Änderungsmanagementmodell»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D1.vq.oMiI59NMO2Q.kawa", "t": "kawa", "abruf": 1, "vid": "oMiI59NMO2Q", "vq": "nach", "wort": "ADKAR", "m": ["A: Awareness: das Bewusstsein, warum die Veränderung nötig ist", "D: Desire: der Wunsch, bei der Veränderung mitzumachen", "K: Knowledge: das Wissen, wie man sich konkret verändern soll", "R: Reinforcement: die Verstärkung, damit die neue Verhaltensweise bleibt"], "q": "KaWa zu «ADKAR»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D1.vq.3LczBH3PXdw.vor0", "vid": "3LczBH3PXdw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Phasen hat das ADKAR-Modell laut Video?", "a": ["Drei", "Vier", "Fünf", "Sieben"], "r": 2, "e": "ADKAR ist ein Akronym aus fünf Buchstaben und damit fünf Phasen, Awareness, Desire, Knowledge, Ability und Reinforcement."}, {"id": "D1.vq.3LczBH3PXdw.vor1", "vid": "3LczBH3PXdw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wer hat das ADKAR-Modell laut Video entwickelt?", "a": ["John Kotter", "Jeff Hyatt", "Kurt Lewin", "Peter Drucker"], "r": 1, "e": "Das Video nennt den US-amerikanischen Wissenschaftler und Unternehmer Jeff Hyatt als Entwickler des ADKAR-Modells."}, {"id": "D1.v.3LczBH3PXdw", "t": "frei", "abruf": 1, "vid": "3LczBH3PXdw", "vq": "nach", "q": "Video «Change Management ADKAR-Modell» (Innovation & Kreativität): Was waren die Kernaussagen?", "m": "1. Awareness bedeutet nicht nur zu wissen, dass ein Wandel stattfindet, sondern zu verstehen, warum er wirklich notwendig ist, sonst entsteht keine Bereitschaft mitzumachen. 2. Der Wunsch mitzumachen ist laut Hiatt eine persönliche Entscheidung, die von Motivation, persönlicher Situation, organisationalem Kontext und der Art des Wandels abhängt, zusammengefasst in der Frage 'What's in it for me'. 3. Das ADKAR-Modell wurde ursprünglich als streng lineare Abfolge verstanden, gilt heute aber als Modell mit möglichen Vor- und Rücksprüngen zwischen den Phasen."}, {"id": "D1.vq.3LczBH3PXdw.nach0", "vid": "3LczBH3PXdw", "vq": "nach", "t": "mc", "q": "Worauf stellt das ADKAR-Modell laut Video den Fokus?", "a": ["Auf die Finanzierung des Projekts", "Auf den einzelnen Menschen und seinen individuellen Wandel", "Auf die IT-Infrastruktur des Unternehmens", "Auf die Konkurrenzanalyse"], "r": 1, "e": "Das Video betont, dass ADKAR ein Modell für den individuellen Wandel ist und die einzelne Person in den Fokus stellt."}, {"id": "D1.vq.3LczBH3PXdw.nach1", "vid": "3LczBH3PXdw", "vq": "nach", "t": "ms", "q": "Welche zwei Phasen des ADKAR-Modells beschäftigen sich laut Video mit Wissen und praktischer Umsetzung?", "a": ["Knowledge", "Awareness", "Ability", "Desire"], "r": [0, 2], "e": "Knowledge steht für das Wissen über den Wandel, Ability für die tatsächliche praktische Umsetzung dieses Wissens."}, {"id": "D1.vq.3LczBH3PXdw.nach2", "vid": "3LczBH3PXdw", "vq": "nach", "t": "lueck", "q": "Die Frage what is in it for me beschreibt laut Video, was die Phase ___ bei einer Person beeinflusst.", "r": ["desire"], "e": "Das Video erklärt die WIFM-Frage als einen Einflussfaktor auf die Desire-Phase, den persönlichen Wunsch nach Veränderung."}, {"id": "D1.vq.3LczBH3PXdw.nach3", "vid": "3LczBH3PXdw", "vq": "nach", "t": "frei", "q": "Erkläre anhand des ADKAR-Modells, warum es nicht reicht, Mitarbeitenden nur zu sagen, dass sich etwas ändert, ohne die weiteren Phasen zu durchlaufen.", "m": "Wenn Mitarbeitende nur erfahren, dass sich etwas ändert, entsteht zwar vielleicht Awareness, aber ohne einen persönlichen Wunsch in der Desire-Phase fehlt die Motivation mitzumachen. Selbst mit Wunsch braucht es noch das Wissen aus der Knowledge-Phase, wie der Wandel konkret umgesetzt wird, und die tatsächliche Fähigkeit in der Ability-Phase, es auch zu tun. Erst wenn alle Phasen bis zur Reinforcement-Phase durchlaufen sind, bleibt der Wandel laut Video dauerhaft bestehen."}, {"id": "D1.vq.3LczBH3PXdw.abc", "t": "abc", "abruf": 1, "vid": "3LczBH3PXdw", "vq": "nach", "m": ["Ability", "ADKAR", "Awareness", "Desire", "Jeff Hyatt", "Knowledge", "Kotter", "Prosci", "Reinforcement", "Vision", "Wandel", "Widerstand"], "q": "ABC-Liste zu «Change Management ADKAR-Modell»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "D1.vq.3LczBH3PXdw.kawa", "t": "kawa", "abruf": 1, "vid": "3LczBH3PXdw", "vq": "nach", "wort": "ADKAR", "m": ["A: Awareness ist die erste Phase, das Bewusstsein für die Notwendigkeit des Wandels", "D: Desire, der persönliche Wunsch, sich am Wandel zu beteiligen", "K: Knowledge bedeutet Wissen darüber, wie der Wandel umgesetzt wird", "R: Reinforcement festigt den Wandel, damit er dauerhaft bleibt"], "q": "KaWa zu «ADKAR»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "D1.vq.TNaMO6g0qec.vor0", "vid": "TNaMO6g0qec", "vq": "vor", "t": "mc", "q": "Was glaubst du: Darf man bei Kotters 8-Stufen-Modell einzelne Phasen überspringen, um schneller voranzukommen?", "a": ["Ja, das ist sogar empfohlen", "Nein, laut Kotter erhöht das die Wahrscheinlichkeit des Scheiterns", "Ja, aber nur die letzten zwei Phasen", "Das Modell hat gar keine feste Reihenfolge"], "r": 1, "e": "Kotter geht laut Video davon aus, dass übersprungene Phasen die Erfolgswahrscheinlichkeit deutlich senken."}, {"id": "D1.vq.TNaMO6g0qec.vor1", "vid": "TNaMO6g0qec", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist die allererste Phase in Kotters Modell für erfolgreichen Wandel?", "a": ["Die Veränderung in der Kultur verankern", "Ein Gefühl der Dringlichkeit erzeugen", "Sofort neue Software einführen", "Alle Mitarbeitenden entlassen"], "r": 1, "e": "Kotters erste Phase besteht laut Video darin, ein Gefühl der Dringlichkeit zu erzeugen."}, {"id": "D1.v.TNaMO6g0qec", "t": "frei", "abruf": 1, "vid": "TNaMO6g0qec", "vq": "nach", "q": "Video «Change nach John Kotter | 8 Stufen» (OrganisationsEntfaltung): Was waren die Kernaussagen?", "m": "1. Kotter gruppiert seine acht Stufen in drei Spannungsbögen: Klima für Veränderung schaffen (Stufen 1-3), die Organisation einbinden und befähigen (Stufen 4-6) und den Wandel nachhaltig verankern (Stufen 7-8). 2. Keine der acht Stufen darf übersprungen werden, weil laut Kotter jede ausgelassene Stufe die Wahrscheinlichkeit erhöht, dass das Veränderungsprojekt scheitert. 3. Die Vision dient laut Kotter als Entscheidungsgrundlage, als Motivationsanker und als Orientierung, weshalb sie zuerst von einer Führungskoalition entwickelt und danach über alle verfügbaren Kanäle wiederholt kommuniziert werden muss."}, {"id": "D1.vq.TNaMO6g0qec.nach0", "vid": "TNaMO6g0qec", "vq": "nach", "t": "mc", "q": "Wozu dient laut Kotter eine gemeinsame Vision des Wandels?", "a": ["Nur zur Dekoration von Präsentationen", "Als Entscheidungsgrundlage und um die Mitarbeitenden zu motivieren", "Um die Führungskraft zu ersetzen", "Um Kosten zu sparen"], "r": 1, "e": "Die Vision dient laut Video als Entscheidungsgrundlage und motiviert die Mitarbeitenden im Projektverlauf."}, {"id": "D1.vq.TNaMO6g0qec.nach1", "vid": "TNaMO6g0qec", "vq": "nach", "t": "ms", "q": "Welche zwei Massnahmen gehören laut Video zu den letzten Phasen sieben und acht des Modells?", "a": ["Erste Erfolge konsolidieren", "Sofort mit dem Projekt aufhören", "Die Veränderung in der Unternehmenskultur verankern", "Alle bisherigen Ergebnisse löschen"], "r": [0, 2], "e": "Die letzten beiden Phasen sorgen laut Video für Konsolidierung der Erfolge und Verankerung in der Kultur."}, {"id": "D1.vq.TNaMO6g0qec.nach2", "vid": "TNaMO6g0qec", "vq": "nach", "t": "ord", "q": "Bringe die ersten vier Phasen von Kotters Modell in die richtige Reihenfolge.", "a": ["Ein Gefühl der Dringlichkeit erzeugen", "Eine Führungskoalition aufbauen", "Eine Vision des Wandels entwickeln", "Die Vision des Wandels kommunizieren"], "e": "Genau in dieser Reihenfolge beginnt Kotters 8-Stufen-Modell laut Video."}, {"id": "D1.vq.TNaMO6g0qec.nach3", "vid": "TNaMO6g
