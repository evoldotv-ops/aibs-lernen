t durch einen Doppelpunkt getrennt"], "q": "KaWa zu «JSON»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A13.0", "t": "mc", "q": "Was ist eine API?", "a": ["Eine Benutzeroberfläche für Menschen", "Eine definierte Schnittstelle, über die Programme Daten und Funktionen austauschen", "Eine Datenbank", "Ein Sprachmodell"], "r": 1, "e": "Bild: der Kellner zwischen Gast und Küche. REST-APIs arbeiten über HTTP mit Endpunkten (URLs)."}, {"id": "A13.1", "t": "mc", "q": "Welche HTTP-Methode liest Daten, ohne etwas zu verändern?", "a": ["POST", "GET", "DELETE", "PUT"], "r": 1, "e": "GET lesen, POST anlegen, PUT/PATCH ändern, DELETE löschen. Ein GET-Endpunkt ohne Modell dahinter ist deterministisch."}, {"id": "A13.2", "t": "mc", "q": "Die API antwortet mit Status 200, aber der Inhalt ist fachlich falsch (Orangen statt Beeren). Was gilt?", "a": ["200 beweist, dass die Antwort stimmt", "200 heisst nur: technisch erfolgreich. Die fachliche Richtigkeit muss man separat prüfen", "Das ist ein Netzwerkfehler", "Die API ist offline"], "r": 1, "e": "Technisch ok ist nicht fachlich richtig. 4xx = Fehler des Aufrufers (404 nicht gefunden, 401 nicht berechtigt), 5xx = Serverfehler."}, {"id": "A13.3", "t": "lueck", "q": "Ein Datensatz wie {\"name\": \"Mimi\", \"alter\": 3, \"tags\": [\"scheu\"]} ist im Format ___ .", "r": ["json"], "e": "JSON: Schlüssel-Wert-Paare, verschachtelbar. Gilt als semi-strukturiert."}, {"id": "A13.4", "t": "frei", "q": "Transfer: Welche vier Dinge klärst du, bevor ein Agent eine fremde API im Betrieb nutzt?", "m": "1. Antwortzeit und Limiten (Latenzbudget, Aufrufe pro Minute). 2. Fehlerfälle: Timeout, Wiederholung, Abbruch, was sieht der Nutzer. 3. Berechtigung und Datenschutz: welche Daten fliessen wohin. 4. Stabilität: Versionierung, Änderungen des Anbieters, Protokollierung."}], "videos": [{"id": "xpeQz7Hsfz0", "kanal": "Coding Crashkurse", "titel": "REST API Einführung | Was ist eine REST-Schnittstelle?", "dauer": "4:15"}, {"id": "unXWk2plEoc", "kanal": "Vibe Venture - KI & Code", "titel": "JSON in 5 Minuten", "dauer": "6:24"}], "pn": 5}, {"key": "A14", "titel": "Klassisches Machine Learning (nicht nur ChatGPT)", "warum": "C3 verlangt «geeignete KI-Modelle». Bilderkennung, Prognose und Scoring sind kein Sprachmodell.", "fragen": [{"id": "A14.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Klassisches Machine Learning (nicht nur ChatGPT)»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: C3 verlangt «geeignete KI-Modelle». Bilderkennung, Prognose und Scoring sind kein Sprachmodell. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A14.vq.Ip1a2JHdt3E.vor0", "vid": "Ip1a2JHdt3E", "vq": "vor", "t": "mc", "q": "Was glaubst du: In welchem Jahr besiegte ein Schachcomputer erstmals den amtierenden Schachweltmeister?", "a": ["1986", "1996", "1997", "2006"], "r": 2, "e": "1997. ACHTUNG: 1996 in Philadelphia gewann Deep Blue nur die erste Partie und verlor das Match 2:4 gegen Garri Kasparow. Erst im Rückkampf im Mai 1997 gewann die Maschine den ganzen Wettkampf 3,5:2,5."}, {"id": "A14.vq.Ip1a2JHdt3E.vor1", "vid": "Ip1a2JHdt3E", "vq": "vor", "t": "mc", "q": "Was glaubst du: Kann der Schachcomputer Deep Blue auch ein Sudoku lösen?", "a": ["Ja, jede KI kann automatisch alles", "Nein, er ist nur auf sein eines Problem trainiert", "Nur wenn er Internetzugang hat", "Nur an Wochenenden"], "r": 1, "e": "Deep Blue ist laut Video ein Beispiel für schwache KI, die nur ein bestimmtes Problem lösen kann."}, {"id": "A14.v.Ip1a2JHdt3E", "t": "frei", "abruf": 1, "vid": "Ip1a2JHdt3E", "vq": "nach", "q": "Video «Künstliche Intelligenz vs. Machine Learning vs. Deep Learning» (Florian Dalwigk): Was waren die Kernaussagen?", "m": "1. Kuenstliche Intelligenz ist der Oberbegriff fuer die Automatisierung von intelligentem Verhalten, Machine Learning ist ein Teilgebiet davon, und Deep Learning ist wiederum eine Auspraegung des Machine Learnings, die mit mehrschichtigen kuenstlichen neuronalen Netzen arbeitet. 2. Beim ueberwachten Lernen bekommt der Algorithmus Trainingsdaten mit bekanntem Ergebnis, etwa Bilder, die bereits als Katze gelabelt sind, beim unueberwachten Lernen fehlen solche Labels und der Algorithmus muss selbststaendig Cluster in den Daten finden, und beim bestaerkenden Lernen lernt ein System durch Belohnung und Bestrafung aus den Folgen seiner eigenen Aktionen. 3. Man unterscheidet schwache KI, die nur ein eng begrenztes Problem wie Schach oder Go loesen kann, von starker KI, die menschliche Intelligenz auf allen Gebieten erreichen wuerde, wobei starke KI nach heutigem Forschungsstand weiterhin reine Zukunftsvision ist."}, {"id": "A14.vq.Ip1a2JHdt3E.nach0", "vid": "Ip1a2JHdt3E", "vq": "nach", "t": "mc", "q": "Was ist der Zusammenhang zwischen KI, Machine Learning und Deep Learning laut Video?", "a": ["Es sind drei komplett unabhängige Begriffe ohne Zusammenhang", "Deep Learning ist ein Teilgebiet von Machine Learning, das wiederum ein Teilgebiet von KI ist", "KI ist ein Teilgebiet von Deep Learning", "Alle drei Begriffe bedeuten exakt dasselbe"], "r": 1, "e": "Das Video zeigt eine Verschachtelung: KI umfasst Machine Learning, und Deep Learning ist ein Teilgebiet davon."}, {"id": "A14.vq.Ip1a2JHdt3E.nach1", "vid": "Ip1a2JHdt3E", "vq": "nach", "t": "ms", "q": "Welche zwei Lernarten des Machine Learning werden im Video genannt?", "a": ["Überwachtes Lernen mit gelabelten Trainingsdaten", "Zufallslernen ohne jede Regel", "Unüberwachtes Lernen ohne Label", "Auswendiglernen wie in der Schule"], "r": [0, 2], "e": "Das Video erklärt überwachtes, unüberwachtes und verstärkendes Lernen als die drei ML-Lernarten."}, {"id": "A14.vq.Ip1a2JHdt3E.nach2", "vid": "Ip1a2JHdt3E", "vq": "nach", "t": "lueck", "q": "Ein neuronales Netz mit mehr als einer verdeckten Schicht wird als ___ neuronales Netz bezeichnet.", "r": ["tiefes", "deep"], "e": "Genau daher kommt der Name Deep Learning, wörtlich tiefes Lernen."}, {"id": "A14.vq.Ip1a2JHdt3E.nach3", "vid": "Ip1a2JHdt3E", "vq": "nach", "t": "frei", "q": "Erkläre an einem Beispiel den Unterschied zwischen starker und schwacher künstlicher Intelligenz.", "m": "Schwache KI kann nur ein einzelnes, klar begrenztes Problem lösen, wie Schach spielen oder Go spielen, aber nichts anderes. Starke KI wäre in der Lage, beliebige schwierige Aufgaben auf menschlichem Niveau zu bewältigen, existiert laut Video aber bis heute nur als Science-Fiction."}, {"id": "A14.vq.Ip1a2JHdt3E.abc", "t": "abc", "abruf": 1, "vid": "Ip1a2JHdt3E", "vq": "nach", "m": ["Algorithmus", "AlphaGo", "Cluster", "Deep Learning", "Gewichtung", "Hidden Layer", "Input", "Machine Learning", "Neuronales Netz", "Output", "Reinforcement Learning"], "q": "ABC-Liste zu «Künstliche Intelligenz vs. Machine Learning vs. Deep Learning»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A14.vq.Ip1a2JHdt3E.kawa", "t": "kawa", "abruf": 1, "vid": "Ip1a2JHdt3E", "vq": "nach", "wort": "CLUSTER", "m": ["C: Cluster: Gruppen ähnlicher Datenpunkte, die der Algorithmus selbst findet", "L: Lernprozess: die Maschine passt ihre Funktion anhand von Trainingsdaten an", "U: Unüberwachtes Lernen: nur Eingangsdaten ohne Label, das Muster wird selbst gesucht", "S: Schachcomputer: Deep Blue schlug 1996 den Schachweltmeister", "T: Trainingsdaten: enthalten Eingangswerte und das gewünschte Ergebnis", "E: Erfolgsquote: wird im Lernprozess mit Testdaten überprüft", "R: Reinforcement Learning: Lernen durch Belohnung und Bestrafung"], "q": "KaWa zu «CLUSTER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A14.vq.BkDUDi6YDaU.vor0", "vid": "BkDUDi6YDaU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert, wenn ein Modell die Trainingsdaten zu perfekt lernt?", "a": ["Es wird schneller", "Es nennt sich Overfitting und funktioniert in der Praxis schlecht", "Es braucht weniger Daten", "Es wird automatisch generalisierbar"], "r": 1, "e": "Overfitting bedeutet, dass das Modell die Trainingsdaten perfekt gelernt hat, aber auf neuen Daten schlecht funktioniert."}, {"id": "A14.vq.BkDUDi6YDaU.vor1", "vid": "BkDUDi6YDaU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man das Lernverfahren, bei dem es keine klare Zielvariable gibt und der Algorithmus selbst Strukturen erkennt?", "a": ["Supervised Learning", "Unsupervised Learning", "Reinforcement Learning", "Deep Learning"], "r": 1, "e": "Das Video nennt dies unsupervised learning, den Gegenpart zu supervised learning."}, {"id": "A14.v.BkDUDi6YDaU", "t": "frei", "abruf": 1, "vid": "BkDUDi6YDaU", "vq": "nach", "q": "Video «Überwachtes Lernen (Supervised Learning) einfach erklärt» (datasolut): Was waren die Kernaussagen?", "m": "1. Supervised Learning erkennt anhand von gelabelten Beispieldaten mit bekannter Zielvariable Muster und Zusammenhaenge, die anschliessend auf neue, unbekannte Daten angewendet werden, um Prognosen zu treffen, etwa ob eine Person auf eine Marketingkampagne reagiert. 2. Der Datensatz wird immer in Trainingsdaten und Testdaten aufgeteilt, damit man prueft, wie gut das Modell auf Daten funktioniert, die es beim Training nicht gesehen hat, statt nur die Trainingsdaten auswendig zu lernen. 3. Overfitting bedeutet, dass ein Modell die Trainingsdaten fast perfekt trennt, dabei aber zu stark an diese eine Datenmenge angepasst und dadurch auf neuen Daten schlecht generalisierbar ist."}, {"id": "A14.vq.BkDUDi6YDaU.nach0", "vid": "BkDUDi6YDaU", "vq": "nach", "t": "mc", "q": "Welche Beispiele für supervised learning nennt das Video?", "a": ["Betrugserkennung, Bilderkennung, Umsatzprognose", "Textübersetzung, Musikkomposition, Spracherkennung", "Nur Bilderkennung", "Nur Schach spielen"], "r": 0, "e": "Das Video nennt konkret Betrugserkennung, Bilderkennung und die Vorhersage numerischer Werte wie eine Umsatzprognose."}, {"id": "A14.vq.BkDUDi6YDaU.nach1", "vid": "BkDUDi6YDaU", "vq": "nach", "t": "ms", "q": "Welche zwei Algorithmen nennt das Video als Beispiele für supervised learning?", "a": ["Random Forest", "Logistische Regression", "Stakeholderanalyse", "Amortisationsrechnung"], "r": [0, 1], "e": "Random Forest und logistische Regression werden im Video als Beispiele für trainierbare Algorithmen genannt."}, {"id": "A14.vq.BkDUDi6YDaU.nach2", "vid": "BkDUDi6YDaU", "vq": "nach", "t": "lueck", "q": "Um Overfitting zu erkennen, teilt man den Datensatz in ein Trainingsdatenset und ein ___.", "r": ["testdatenset", "testdaten"], "e": "Nur mit einem separaten Testdatenset kann man objektiv prüfen, wie gut das Modell auf unbekannten Daten funktioniert."}, {"id": "A14.vq.BkDUDi6YDaU.nach3", "vid": "BkDUDi6YDaU", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen, warum ein Modell, das im Training perfekt abschneidet, in der Praxis trotzdem schlecht sein kann.", "m": "Ein Modell, das im Training perfekt abschneidet, hat die Trainingsdaten oft einfach auswendig gelernt statt allgemeine Muster zu erkennen. Das nennt man Overfitting. Sobald es mit neuen, unbekannten Daten konfrontiert wird, kann es die Ergebnisse nicht mehr richtig vorhersagen, weil es zu stark auf die alten Daten zugeschnitten war."}, {"id": "A14.vq.BkDUDi6YDaU.abc", "t": "abc", "abruf": 1, "vid": "BkDUDi6YDaU", "vq": "nach", "m": ["Algorithmus", "Betrugserkennung", "Datensatz", "Fitting", "Klassifikation", "Modell", "Overfitting", "Prognose", "Random Forest", "Supervised Learning", "Testdatenset", "Zielvariable"], "q": "ABC-Liste zu «Überwachtes Lernen (Supervised Learning) einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A14.vq.BkDUDi6YDaU.kawa", "t": "kawa", "abruf": 1, "vid": "BkDUDi6YDaU", "vq": "nach", "wort": "MODELL", "m": ["M: Modell: entsteht durch Training mit Beispieldaten", "O: Overfitting: das Modell lernt die Trainingsdaten zu perfekt auswendig", "D: Datensatz: enthält Prädiktoren wie Alter, Job und Familienstand", "E: Ergebnis: eine Wahrscheinlichkeit, wie eine Person reagieren wird", "L: Logistische Regression: ein einfacher Algorithmus für die Klassifikation"], "q": "KaWa zu «MODELL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A14.vq.XSOi9MKfEHQ.vor0", "vid": "XSOi9MKfEHQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was braucht ein Algorithmus beim unüberwachten Lernen im Gegensatz zum überwachten Lernen NICHT?", "a": ["Eine grosse Datenmenge", "Eine klare Zielvariable", "Einen Computer", "Eine Programmiersprache"], "r": 1, "e": "Der Hauptunterschied laut Video ist, dass beim unüberwachten Lernen keine Zielvariable vorgegeben wird."}, {"id": "A14.vq.XSOi9MKfEHQ.vor1", "vid": "XSOi9MKfEHQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür wird laut Video die Assoziationsanalyse häufig eingesetzt?", "a": ["Für Warenkorbanalysen", "Für die Gehaltsabrechnung", "Für die Wettervorhersage", "Für die Rechtschreibprüfung"], "r": 0, "e": "Das Video nennt Warenkorbanalysen ausdrücklich als typisches Beispiel."}, {"id": "A14.v.XSOi9MKfEHQ", "t": "frei", "abruf": 1, "vid": "XSOi9MKfEHQ", "vq": "nach", "q": "Video «Unüberwachtes Lernen (Unsupervised Learning) einfach erklärt» (datasolut): Was waren die Kernaussagen?", "m": "1. Beim unueberwachten Lernen gibt es keine vorgegebene Zielvariable, der Algorithmus wird direkt auf die Daten losgelassen und soll eigenstaendig Muster, Gruppen und Strukturen erkennen. 2. Ein typisches Verfahren ist die Clusteranalyse, bei der man dem Algorithmus vorgibt, wie viele Segmente er bilden soll, und er die Datensaetze dann eigenstaendig in moeglichst trennscharfe Gruppen einteilt. 3. Die gefundenen Cluster lassen sich im Nachhinein explorativ interpretieren, zum Beispiel anhand von Umsatz und Alter, und fuer Marketingkampagnen oder Produktentwicklung nutzen."}, {"id": "A14.vq.XSOi9MKfEHQ.nach0", "vid": "XSOi9MKfEHQ", "vq": "nach", "t": "mc", "q": "Was macht ein Clusteranalyse-Algorithmus laut Video, wenn man ihm vorgibt, drei Cluster zu finden?", "a": ["Er ignoriert die Vorgabe und bildet immer nur zwei Cluster", "Er teilt die Datensätze eigenständig möglichst trennscharf in drei Gruppen ein", "Er löscht ein Drittel der Daten", "Er fragt bei jeder Zuordnung den Nutzer"], "r": 1, "e": "Der Algorithmus versucht laut Video eigenständig, möglichst trennscharfe Cluster in der vorgegebenen Anzahl zu bilden."}, {"id": "A14.vq.XSOi9MKfEHQ.nach1", "vid": "XSOi9MKfEHQ", "vq": "nach", "t": "ms", "q": "Welche zwei Anwendungen für unüberwachtes Lernen nennt das Video?", "a": ["Clusteranalyse zur Bildung von Segmenten und Gruppen", "Dimensionsreduktion, um Big Data visualisierbar zu machen", "Automatisches Beantworten von E-Mails", "Verschlüsseln von Firmendaten"], "r": [0, 1], "e": "Das Video nennt beides ausdrücklich als Beispiele für unüberwachtes Lernen."}, {"id": "A14.vq.XSOi9MKfEHQ.nach2", "vid": "XSOi9MKfEHQ", "vq": "nach", "t": "lueck", "q": "Beim unüberwachten Lernen gibt es im Gegensatz zum überwachten Lernen keine vorgegebene ___.", "r": ["zielvariable"], "e": "Das Video sagt ausdrücklich, der Hauptunterschied sei, dass keine Zielvariable vorgegeben wird."}, {"id": "A14.vq.XSOi9MKfEHQ.nach3", "vid": "XSOi9MKfEHQ", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel, das nicht Bankkunden betrifft, wie eine Clusteranalyse ohne Zielvariable trotzdem sinnvolle Gruppen finden könnte.", "m": "Ein Streaming-Dienst könnte Nutzende allein anhand von Wiedergabezeiten und genutzten Kategorien in Gruppen einteilen, ohne vorher festzulegen, wonach gesucht wird. Der Algorithmus findet dabei von selbst Muster, etwa eine Gruppe, die vor allem nachts Serien schaut. Diese Gruppen kann man dann im Nachhinein interpretieren und für Empfehlungen nutzen."}, {"id": "A14.vq.XSOi9MKfEHQ.abc", "t": "abc", "abruf": 1, "vid": "XSOi9MKfEHQ", "vq": "nach", "m": ["Algorithmus", "Assoziationsanalyse", "Bankdatensatz", "Big Data", "Cluster", "Dimensionsreduktion", "Muster", "Segment", "Supervised Learning", "Unsupervised Learning", "Warenkorbanalyse", "Zielvariable"], "q": "ABC-Liste zu «Unüberwachtes Lernen (Unsupervised Learning) einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A14.vq.XSOi9MKfEHQ.kawa", "t": "kawa", "abruf": 1, "vid": "XSOi9MKfEHQ", "vq": "nach", "wort": "DATEN", "m": ["D: Dimensionsreduktion: macht grosse Datenmengen sichtbar", "A: Assoziationsanalyse: findet Zusammenhänge, zum Beispiel für Warenkorbanalysen", "T: Trennscharf: Ziel der Clusterbildung, möglichst klare Grenzen", "E: Eigenständig: der Algorithmus erkennt Strukturen ganz von selbst", "N: Nutzen: gefundene Cluster können genutzt werden, um Prozesse zu optimieren"], "q": "KaWa zu «DATEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A14.vq.HJZN4iLQA6I.vor0", "vid": "HJZN4iLQA6I", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum sollten Krankenhäuser ihre Patientendaten für ein gemeinsames KI-Modell nicht einfach an eine zentrale Stelle schicken?", "a": ["Weil das technisch unmöglich ist", "Weil sensible Daten oft nicht einfach weitergegeben werden dürfen, aber trotzdem gemeinsam trainiert werden soll", "Weil Krankenhäuser kein Interesse an KI haben", "Weil es dafür noch keine Computer gibt"], "r": 1, "e": "Das Video erklärt, dass Daten wie im Gesundheitswesen oft nicht weitergegeben werden können, Federated Learning löst das, indem die Daten vor Ort bleiben."}, {"id": "A14.vq.HJZN4iLQA6I.vor1", "vid": "HJZN4iLQA6I", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was bedeutet eine zentralisierte KI-Architektur laut Video für die Daten eines Unternehmens?", "a": ["Die Daten bleiben komplett beim Unternehmen", "Alle Prompts und Daten landen letztlich auf den Servern des KI-Anbieters", "Es gibt in dem Fall gar keine Daten", "Die Daten werden automatisch gelöscht"], "r": 1, "e": "Bei einer zentralisierten Architektur landen laut Video alle Daten, Prompts und Kontexte am Ende auf den Servern des Anbieters."}, {"id": "A14.v.HJZN4iLQA6I", "t": "frei", "abruf": 1, "vid": "HJZN4iLQA6I", "vq": "nach", "q": "Video «Federated Learning: Wie Krankenhäuser gemeinsam ein KI-Modell trainieren, ohne Daten zu teilen» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Daniel Beutel von Flower Labs erklärt Federated Learning am Beispiel von Krankenhäusern, die ihre Daten jeweils selbst behalten und trotzdem gemeinsam ein Modell trainieren, weil bei der dezentralen Architektur nur Modellparameter statt Rohdaten ausgetauscht werden. 2. Er warnt, dass man bei jedem Prompt an ein zentrales Modell wie GPT oder Claude ein Stück des eigenen geistigen Eigentums an den Anbieter weitergibt, mit dem Bild man verkauft die Kuh, um die Milch zurückzukaufen. 3. Beutel unterscheidet AI assisted, bei dem ein Chatbot jeden Mitarbeitenden nur etwas produktiver macht ohne Prozesse zu verändern, von AI Native, bei dem komplette Workflows mit KI-Agenten neu gedacht werden."}, {"id": "A14.vq.HJZN4iLQA6I.nach0", "vid": "HJZN4iLQA6I", "vq": "nach", "t": "mc", "q": "Was ist laut Video der Kerngedanke von Federated Learning?", "a": ["KI-Modelle werden an verschiedenen Standorten trainiert, ohne dass die Daten den Ort verlassen", "Alle Daten werden in einer einzigen riesigen Cloud gesammelt", "Jedes Unternehmen bekommt ein identisches, unveränderbares Modell", "Die Daten werden verschlüsselt an ein KI-Lab verkauft"], "r": 0, "e": "Federated Learning trainiert Modelle dezentral an verschiedenen Standorten, die Daten bleiben laut Video dort, wo sie sind."}, {"id": "A14.vq.HJZN4iLQA6I.nach1", "vid": "HJZN4iLQA6I", "vq": "nach", "t": "mc", "q": "Wie beschreibt der Gast die zentrale Architektur der grossen KI-Labs?", "a": ["Ein KI-Modell wird trainiert und ist nur hinter einer API verfügbar, Nutzer schicken ihre Daten dorthin", "Jedes Unternehmen betreibt sein eigenes Rechenzentrum ohne API", "Es gibt keine Trainingsdaten, nur Zufallsgeneratoren", "Die Modelle laufen ausschliesslich offline auf einzelnen Laptops"], "r": 0, "e": "Bei der zentralen Architektur trainiert ein KI-Lab sein Modell, das nur über eine API zugänglich ist, alle Daten wandern dorthin."}, {"id": "A14.vq.HJZN4iLQA6I.nach2", "vid": "HJZN4iLQA6I", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge muss laut Video jedes Unternehmen selbst entscheiden können, wenn es eine dezentrale Architektur nutzt?", "a": ["Auf welcher eigenen Infrastruktur der Stack läuft", "Für welche Aufgaben es trotzdem ein Modell hinter einer API nutzt", "Wie viele Sterne das Restaurant um die Ecke hat", "Welche Schriftart im Chat verwendet wird"], "r": [0, 1], "e": "Das Video betont die Selbstbestimmung: wo die Infrastruktur läuft und für welche Fälle man doch ein externes Modell nutzt."}, {"id": "A14.vq.HJZN4iLQA6I.nach3", "vid": "HJZN4iLQA6I", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten die Aussage aus dem Video, man verkaufe mit jedem Prompt ein kleines Stück seiner eigenen Kuh, um später die Milch zurückzukaufen. Was ist damit gemeint?", "m": "Damit ist gemeint, dass ein Unternehmen bei jedem Prompt an ein fremdes KI-Modell ein Stück seines eigenen Wissens und seiner Daten weitergibt, also seinen Wettbewerbsvorteil. Später muss man dann für genau dieses veredelte Wissen wieder bezahlen, obwohl man es ursprünglich selbst besessen hat. Das Video warnt davor, dass Unternehmen dadurch langfristig ihre eigene IP verlieren könnten."}, {"id": "A14.vq.HJZN4iLQA6I.abc", "t": "abc", "abruf": 1, "vid": "HJZN4iLQA6I", "vq": "nach", "m": ["API", "Daten", "Dezentral", "Enterprise", "Federated Learning", "Infrastruktur", "Krankenhaus", "Modell", "Policy", "Sicherheit", "Souveränität", "Zentral"], "q": "ABC-Liste zu «Federated Learning: Wie Krankenhäuser gemeinsam ein KI-Modell trainieren, ohne Daten zu teilen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A14.vq.HJZN4iLQA6I.kawa", "t": "kawa", "abruf": 1, "vid": "HJZN4iLQA6I", "vq": "nach", "wort": "MODELL", "m": ["M: Modelle trainieren mehrere Standorte gemeinsam, ohne Daten zu tauschen", "O: Ohne die Daten zu teilen bleibt jedes Krankenhaus autonom", "D: Dezentrale Architektur lässt die Daten beim jeweiligen Unternehmen", "E: Enterprise-Kunden erwarten klare Sicherheits- und Zugriffsregeln", "L: Lokale Infrastruktur kann das Modell direkt bei sich betreiben"], "q": "KaWa zu «MODELL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A14.0", "t": "mc", "q": "Überwachtes Lernen heisst:", "a": ["Ein Mensch schaut dem Modell beim Arbeiten zu", "Das Modell lernt aus Beispielen, bei denen die richtige Antwort (Label) bekannt ist", "Das Modell sucht selbst Gruppen in unbeschrifteten Daten", "Das Modell lernt durch Belohnung"], "r": 1, "e": "Überwacht = mit Labels (Klassifikation, Regression). Unüberwacht = ohne Labels (Clustering). Bestärkend = Belohnung."}, {"id": "A14.1", "t": "mc", "q": "Kunden ohne Vorgabe in ähnliche Gruppen einteilen ist ein Fall von:", "a": ["Klassifikation", "Regression", "Clustering (unüberwacht)", "Generativer KI"], "r": 2, "e": "Keine vorgegebenen Klassen, also unüberwacht."}, {"id": "A14.2", "t": "ms", "q": "Welche zwei Aufgaben sind KEIN Fall für ein Sprachmodell, sondern für klassisches ML?", "a": ["Absatz der nächsten Woche aus Verkaufszahlen vorhersagen", "E-Mail höflich umformulieren", "Kratzer auf Bauteilfotos erkennen", "Sitzungsprotokoll zusammenfassen"], "r": [0, 2], "e": "Prognose = Regression/Zeitreihe, Bilderkennung = Computer Vision. C3 verlangt, das passende KI-Modell zu wählen."}, {"id": "A14.3", "t": "ord", "q": "Ordne vom Oberbegriff zum Spezialfall.", "a": ["Künstliche Intelligenz", "Machine Learning", "Deep Learning", "Grosse Sprachmodelle (LLM)"], "e": "KI ⊃ ML ⊃ Deep Learning ⊃ LLM."}, {"id": "A14.4", "t": "frei", "q": "Transfer: Warum ist die Frage «Haben wir gelabelte Daten?» bei der Machbarkeitsprüfung (C4) so wichtig?", "m": "Überwachte Modelle lernen nur aus Beispielen mit bekannter richtiger Antwort. Fehlen Labels, müssen Menschen sie erst erstellen: teuer, langsam, fehleranfällig, und es braucht genug Beispiele auch für seltene Fälle. Ohne Labels lässt sich zudem die Qualität nicht messen. Das entscheidet über Aufwand, Zeitplan und oft über Make or Buy."}], "videos": [{"id": "Ip1a2JHdt3E", "kanal": "Florian Dalwigk", "titel": "Künstliche Intelligenz vs. Machine Learning vs. Deep Learning", "dauer": "8:28"}, {"id": "BkDUDi6YDaU", "kanal": "datasolut", "titel": "Überwachtes Lernen (Supervised Learning) einfach erklärt", "dauer": "6:21"}, {"id": "XSOi9MKfEHQ", "kanal": "datasolut", "titel": "Unüberwachtes Lernen (Unsupervised Learning) einfach erklärt", "dauer": "3:26"}, {"id": "HJZN4iLQA6I", "kanal": "Christoph Magnussen", "titel": "Federated Learning: Wie Krankenhäuser gemeinsam ein KI-Modell trainieren, ohne Daten zu teilen", "dauer": "1:21:37"}], "pn": 16}, {"key": "A15", "titel": "Bilderkennung und Prognosen", "warum": "Typische Fallstudien: Qualitätskontrolle mit Kamera, Absatzprognose (Critical Incident 02).", "fragen": [{"id": "A15.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Bilderkennung und Prognosen»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Typische Fallstudien: Qualitätskontrolle mit Kamera, Absatzprognose (Critical Incident 02). Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A15.vq.yoAXyc1Lwuo.vor0", "vid": "yoAXyc1Lwuo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum reicht klassische Farberkennung nicht aus, um zwei Hunderassen auf einem Bild zu unterscheiden?", "a": ["Weil Farberkennung zu langsam ist", "Weil Hintergrund und Hund oft ähnliche Farben haben", "Weil Hunde keine Farbe haben", "Weil das Bild zu klein ist"], "r": 1, "e": "Ein brauner Hund vor einem braunen Wald oder ein schwarzer Hund vor dunklem Hintergrund lässt sich mit reiner Farbsegmentierung nicht vom Hintergrund trennen."}, {"id": "A15.vq.yoAXyc1Lwuo.vor1", "vid": "yoAXyc1Lwuo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woher weiss man, dass ein CNN wirklich gelernt hat, auf Hunde zu achten, statt Bilder nur auswendig zu lernen?", "a": ["Wenn es auf Trainingsbildern gut abschneidet", "Wenn es auf nie zuvor gesehenen Testbildern gut abschneidet", "Wenn es besonders schnell rechnet", "Wenn es keine Fehler beim ersten Bild macht"], "r": 1, "e": "Nur eine gute Erkennungsgenauigkeit auf dem Testdatensatz zeigt, dass das CNN echte Muster gelernt hat und nicht nur die Trainingsbilder auswendig kennt."}, {"id": "A15.v.yoAXyc1Lwuo", "t": "frei", "abruf": 1, "vid": "yoAXyc1Lwuo", "vq": "nach", "q": "Video «Bilderkennung: Verwendung eines CNNs» (heise academy): Was waren die Kernaussagen?", "m": "1. Klassische Bildverarbeitung mit Farb- oder Formmerkmalen scheitert oft an Bilderkennungsaufgaben, weil sich Merkmale wie Farbe oder Ohrenform je nach Hintergrund und Perspektive stark unterscheiden koennen. 2. Ein CNN wird als trainierbare Blackbox verwendet, die anhand vieler gelabelter Bilder lernt, ihre Vorhersage schrittweise zu verbessern, ohne dass man ihr vorher feste Merkmale vorgeben muss. 3. Die Aufteilung in Trainings- und Testdaten dient dazu zu pruefen, ob das CNN wirklich gelernt hat, auf die relevanten Bildinhalte zu achten, statt sich nur einzelne Pixel der Trainingsbilder gemerkt zu haben."}, {"id": "A15.vq.yoAXyc1Lwuo.nach0", "vid": "yoAXyc1Lwuo", "vq": "nach", "t": "mc", "q": "Warum scheitert eine Methode, die Hunderassen nur anhand der Ohrenlänge unterscheidet?", "a": ["Weil alle Hunde gleich lange Ohren haben", "Weil die Ohren auf manchen Bildern nicht zu sehen sind", "Weil Ohren nie zur Rasse passen", "Weil Ohren zu klein zum Messen sind"], "r": 1, "e": "Wenn die Ohren auf einem Bild nicht sichtbar sind, kann ein Programm, das nur auf Ohren trainiert wurde, die Rasse nicht mehr erkennen, ein Mensch aber schon."}, {"id": "A15.vq.yoAXyc1Lwuo.nach1", "vid": "yoAXyc1Lwuo", "vq": "nach", "t": "mc", "q": "Wozu dient die Aufteilung der Bilder in Trainings- und Testdatensatz?", "a": ["Um Speicherplatz zu sparen", "Um zu prüfen, ob das CNN auch unbekannte Bilder richtig einordnet", "Um die Bilder zu sortieren", "Um die Trainingszeit zu verkürzen"], "r": 1, "e": "Nur mit ungesehenen Testbildern lässt sich prüfen, ob das CNN wirklich gelernt hat und nicht nur auswendig kennt."}, {"id": "A15.vq.yoAXyc1Lwuo.nach2", "vid": "yoAXyc1Lwuo", "vq": "nach", "t": "ord", "q": "Bringe den Trainingsablauf eines CNN in die richtige Reihenfolge.", "a": ["Ein Bild aus dem Trainingsdatensatz wird eingegeben", "Das CNN macht eine Vorhersage, die zunächst oft falsch ist", "Das CNN wird angepasst, damit die Vorhersage besser wird", "Nach vielen Wiederholungen wird die Genauigkeit auf Testdaten geprüft"], "e": "Das Video beschreibt genau diesen Kreislauf aus Eingabe, Vorhersage, Anpassung und abschliessender Testprüfung."}, {"id": "A15.vq.yoAXyc1Lwuo.nach3", "vid": "yoAXyc1Lwuo", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum ein Mensch einen Cockerspaniel und einen Pudel auch ohne sichtbare Ohren unterscheiden kann, ein einfaches Ohren-Programm aber nicht.", "m": "Ein Mensch nutzt viele verschiedene Merkmale gleichzeitig und kann flexibel zwischen ihnen wechseln, wenn ein Merkmal fehlt. Ein Programm, das fest auf ein einzelnes Merkmal wie die Ohrenlänge programmiert wurde, hat keine Alternative und scheitert, sobald dieses Merkmal nicht sichtbar ist. Ein CNN umgeht das, weil es selbst lernt, welche Muster wichtig sind."}, {"id": "A15.vq.yoAXyc1Lwuo.abc", "t": "abc", "abruf": 1, "vid": "yoAXyc1Lwuo", "vq": "nach", "m": ["CNN", "Cockerspaniel", "Datensatz", "Farbsegmentierung", "Hunderasse", "Merkmale", "Ohren", "Pudel", "Stanford Dogs", "Testdatensatz", "Trainingsdatensatz", "Vorhersage"], "q": "ABC-Liste zu «Bilderkennung: Verwendung eines CNNs»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A15.vq.yoAXyc1Lwuo.kawa", "t": "kawa", "abruf": 1, "vid": "yoAXyc1Lwuo", "vq": "nach", "wort": "PUDEL", "m": ["P: Pudel ist eine der Hunderassen im Stanford-Dogs-Datensatz.", "U: Unterscheidung von Rassen anhand fester Merkmale wie Ohren funktioniert oft nicht.", "D: Datensatz wird vor dem Training in Trainings- und Testdaten aufgeteilt.", "E: Erkennungsgenauigkeit wird am Ende auf den Testdaten geprüft.", "L: Lernen passiert durch viele Wiederholungen, bis die Vorhersage stimmt."], "q": "KaWa zu «PUDEL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A15.vq.aOm-R_UoD8o.vor0", "vid": "aOm-R_UoD8o", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woher kamen Vorhersagen über Maschinenausfälle früher, bevor es predictive Analytics gab?", "a": ["von automatischen Sensoren", "von der Intuition einzelner Manager", "von staatlichen Vorschriften", "von reinem Zufall"], "r": 1, "e": "Das Video sagt, dass solche Vorhersagen früher von der Intuition einzelner Manager für Trends kamen."}, {"id": "A15.vq.aOm-R_UoD8o.vor1", "vid": "aOm-R_UoD8o", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welcher Film wird im Video als Beispiel für erfolgreiche statistische Vorhersage genannt?", "a": ["Moneyball", "The Social Network", "Terminator", "Matrix"], "r": 0, "e": "Das Video nennt den auf einer wahren Geschichte basierenden Film Moneyball, in dem ein Baseballteam mit statistischer Analyse zusammengestellt wird."}, {"id": "A15.v.aOm-R_UoD8o", "t": "frei", "abruf": 1, "vid": "aOm-R_UoD8o", "vq": "nach", "q": "Video «Warum nutzen Unternehmen Predictive Analytics?» (Frankfurt School of Finance & Management): Was waren die Kernaussagen?", "m": "1. Predictive Analytics nutzt Vergangenheitsdaten und statistische Modelle wie Regressionsanalysen, um zukuenftige Entwicklungen vorherzusagen, statt sich wie frueher allein auf die Intuition von Managern zu verlassen. 2. Der Ansatz funktioniert nur, wenn die Vergangenheitsdaten tatsaechlich das Potenzial haben, zukuenftige Entwicklungen zu beschreiben, weshalb grundlegende Branchenumbrueche oder veraendertes Kundenverhalten die Vorhersagen in die Irre fuehren koennen. 3. Unternehmerische Intuition und eine vorausschauende Marktanalyse bleiben deshalb auch neben Predictive Analytics weiterhin wichtig."}, {"id": "A15.vq.aOm-R_UoD8o.nach0", "vid": "aOm-R_UoD8o", "vq": "nach", "t": "mc", "q": "Welche Methode nennt das Video als Beispiel für ein statistisches Modell zur Vorhersage künftiger Entwicklungen?", "a": ["Regressionsanalyse", "Blockchain", "Verschlüsselung", "3D-Druck"], "r": 0, "e": "Das Video nennt Regressionsanalysen als Beispiel für statistische Modelle, mit denen Firmen Vergangenheitsdaten für Vorhersagen nutzen."}, {"id": "A15.vq.aOm-R_UoD8o.nach1", "vid": "aOm-R_UoD8o", "vq": "nach", "t": "ms", "q": "Welche zwei Risiken von predictive Analytics nennt das Video?", "a": ["Vergangenheitsdaten können bei grundlegenden Branchenumbrüchen irreführend sein", "die Berechnung ist immer zu teuer", "ändern Kunden ihre Gewohnheiten, kann das die Vorhersage verfälschen", "predictive Analytics braucht keine Daten"], "r": [0, 2], "e": "Das Video warnt, dass Vergangenheitsdaten bei grundlegenden Wandlungen und bei geänderten Kundengewohnheiten irreführend sein können."}, {"id": "A15.vq.aOm-R_UoD8o.nach2", "vid": "aOm-R_UoD8o", "vq": "nach", "t": "lueck", "q": "Predictive Analytics funktioniert laut Video nur, wenn die ___ tatsächlich das Potenzial haben, zukünftige Entwicklungen zu beschreiben.", "r": ["vergangenheitsdaten"], "e": "Das Video betont, dass predictive Analytics auf der Annahme beruht, dass Vergangenheitsdaten die Zukunft widerspiegeln können."}, {"id": "A15.vq.aOm-R_UoD8o.nach3", "vid": "aOm-R_UoD8o", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen ein Beispiel aus deinem Alltag oder Umfeld, wo Vergangenheitsdaten für eine Vorhersage genutzt werden könnten, und wo das schiefgehen könnte.", "m": "Ein Onlineshop könnte aus den bisherigen Bestellungen vorhersagen, wie viel von einem Produkt nächsten Monat verkauft wird. Wenn sich aber plötzlich der Geschmack der Kundschaft ändert oder ein Trend abbricht, stimmen die alten Daten nicht mehr mit der Zukunft überein. Deshalb braucht es trotz Vorhersage weiterhin unternehmerische Intuition, wie es im Video auch für predictive Analytics gesagt wird."}, {"id": "A15.vq.aOm-R_UoD8o.abc", "t": "abc", "abruf": 1, "vid": "aOm-R_UoD8o", "vq": "nach", "m": ["Absolventen", "Baseball", "Echtzeit", "Intuition", "Marktanalyse", "Moneyball", "Predictive Analytics", "Regressionsanalyse", "Risiko", "Statistik", "Trend", "Vergangenheitsdaten"], "q": "ABC-Liste zu «Warum nutzen Unternehmen Predictive Analytics?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A15.vq.aOm-R_UoD8o.kawa", "t": "kawa", "abruf": 1, "vid": "aOm-R_UoD8o", "vq": "nach", "wort": "TREND", "m": ["T: Trend: Firmen nutzen predictive Analytics, um Trends frühzeitig zu erkennen", "R: Regressionsanalyse: statistisches Modell für Vorhersagen", "E: Echtzeit: Daten können heute in Echtzeit erlangt und ausgewertet werden", "N: Nutzung früherer Daten: Basis jeder predictive Analyse", "D: Datenquellen: Firmen sammeln heute Daten aus deutlich mehr Quellen als früher"], "q": "KaWa zu «TREND»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A15.vq.qW4YD1ac0Ao.vor0", "vid": "qW4YD1ac0Ao", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches Unternehmen nutzt das Beispiel im Video, um einen Entscheidungsbaum zu erklären?", "a": ["Amazon", "Netflix", "Spotify", "Disney Plus"], "r": 1, "e": "Das Beispiel im Video dreht sich um einen Netflix-Kunden und die Frage, ob er kündigt."}, {"id": "A15.vq.qW4YD1ac0Ao.vor1", "vid": "qW4YD1ac0Ao", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche der drei Variablen im Beispiel ist eine metrische Variable, für die ein Grenzwert gesucht wird?", "a": ["Nutzung abgenommen", "Supportanfrage", "Stunden pro Woche", "Kundenname"], "r": 2, "e": "Stunden pro Woche ist ein Zahlenwert, deshalb sucht der Entscheidungsbaum hier nach einem passenden Grenzwert statt nach Kategorien."}, {"id": "A15.v.qW4YD1ac0Ao", "t": "frei", "abruf": 1, "vid": "qW4YD1ac0Ao", "vq": "nach", "q": "Video «Entscheidungsbaum einfach erklärt, Predictive Analytics mit Beispiel» (numiqo - Deutsch): Was waren die Kernaussagen?", "m": "1. Ein Entscheidungsbaum nutzt vorhandene, gelabelte Daten, um Kunden anhand einzelner Variablen wie Nutzungsrueckgang oder Supportanfragen so aufzuteilen, dass sich die Kuendigungswahrscheinlichkeit in den entstehenden Gruppen moeglichst stark unterscheidet. 2. Bei metrischen Variablen wie Stunden pro Woche sucht der Algorithmus selbststaendig den Trennwert, der die Gruppen am besten aufteilt, und baut daraus Schritt fuer Schritt einen vollstaendigen Baum mit mehreren Verzweigungen. 3. Der grosse Vorteil eines Entscheidungsbaums gegenueber vielen anderen Predictive-Analytics-Methoden ist seine Nachvollziehbarkeit, weil man fuer jede Vorhersage exakt sehen kann, welche Regeln in welcher Reihenfolge zu ihr gefuehrt haben."}, {"id": "A15.vq.qW4YD1ac0Ao.nach0", "vid": "qW4YD1ac0Ao", "vq": "nach", "t": "mc", "q": "Warum sind Entscheidungsbäume laut Video im Vergleich zu vielen anderen Predictive-Analytics-Methoden beliebt?", "a": ["Sie sind immer die genaueste Methode", "Man kann die Entscheidungen Schritt für Schritt nachvollziehen", "Sie brauchen keine Daten", "Sie funktionieren nur mit Bildern"], "r": 1, "e": "Das Video hebt als grossen Vorteil hervor, dass man beim Entscheidungsbaum jede Regel und jeden Schritt nachvollziehen kann."}, {"id": "A15.vq.qW4YD1ac0Ao.nach1", "vid": "qW4YD1ac0Ao", "vq": "nach", "t": "ms", "q": "Welche zwei Themen kündigt das Video für die nächsten Folgen an?", "a": ["Random Forest", "Blockchain", "Gradient Boosting", "Quantencomputer"], "r": [0, 2], "e": "Am Ende des Videos werden Random Forest und Gradient Boosting als nächste Themen angekündigt."}, {"id": "A15.vq.qW4YD1ac0Ao.nach2", "vid": "qW4YD1ac0Ao", "vq": "nach", "t": "lueck", "q": "Bei einer metrischen Variable wie Stunden pro Woche sucht der Entscheidungsbaum nach einem passenden ___.", "r": ["grenzwert"], "e": "Das Video erklärt, dass bei Zahlenwerten statt Kategorien ein Grenzwert gesucht wird, der die Kunden am besten aufteilt."}, {"id": "A15.vq.qW4YD1ac0Ao.nach3", "vid": "qW4YD1ac0Ao", "vq": "nach", "t": "frei", "q": "Erkläre anhand des Netflix-Beispiels, wie ein Entscheidungsbaum eine erste Schätzung von 50 Prozent Kündigungswahrscheinlichkeit verbessern kann.", "m": "Ohne weitere Information liegt die Kündigungswahrscheinlichkeit im Beispiel bei etwa 50 Prozent, weil die Hälfte der Kunden im Datensatz gekündigt hat. Teilt man die Kunden aber nach der Variable Nutzung abgenommen auf, zeigt sich, dass in der Gruppe mit abnehmender Nutzung fast 67 Prozent kündigen, während in der anderen Gruppe niemand kündigt. Durch diese Aufteilung wird die Vorhersage für jede einzelne Gruppe deutlich präziser als der reine Gesamtdurchschnitt."}, {"id": "A15.vq.qW4YD1ac0Ao.abc", "t": "abc", "abruf": 1, "vid": "qW4YD1ac0Ao", "vq": "nach", "m": ["Aufteilung", "Entscheidungsbaum", "Grenzwert", "Kündigung", "Netflix", "Nutzung", "Predictive Analytics", "Random Forest", "Support", "Training", "Variable", "Vorhersage"], "q": "ABC-Liste zu «Entscheidungsbaum einfach erklärt, Predictive Analytics mit Beispiel»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A15.vq.qW4YD1ac0Ao.kawa", "t": "kawa", "abruf": 1, "vid": "qW4YD1ac0Ao", "vq": "nach", "wort": "BAUM", "m": ["B: Beispiel Netflix: kündigt ein Kunde oder bleibt er?", "A: Aufteilung der Kunden in Gruppen nach einer Variablen", "U: Und man kann jeden Schritt nachvollziehen, das ist der grosse Vorteil eines Entscheidungsbaums", "M: Metrische Variable wie Stunden pro Woche braucht einen Grenzwert"], "q": "KaWa zu «BAUM»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A15.0", "t": "mc", "q": "Welche Modellart steckt typischerweise hinter Bilderkennung?", "a": ["Entscheidungstabelle", "Neuronales Faltungsnetz (CNN) bzw. Deep Learning", "Lineare Regression", "Stichwortsuche"], "r": 1, "e": "CNNs lernen Bildmerkmale selbst. Sie brauchen viele beschriftete Bilder unter realen Bedingungen."}, {"id": "A15.1", "t": "mc", "q": "Ein Modell meldet in der Nachtschicht unter Kunstlicht Schatten als Risse. Ursache?", "a": ["Hardwaredefekt", "Die Trainingsbilder entstanden bei anderem Licht: Einsatzbedingungen weichen von den Trainingsdaten ab", "Zu wenig Speicher", "Die Kamera ist zu teuer"], "r": 1, "e": "Trainingsdaten müssen die Einsatzbedingungen abdecken (Licht, Winkel, Varianten). Sonst Fehlalarme trotz hoher Konfidenz."}, {"id": "A15.2", "t": "num", "q": "Der Linientakt beträgt 12 Sekunden pro Teil. Das Modell braucht 4 Sekunden pro Bild, pro Teil sind 2 Bilder nötig. Wie viele Sekunden Reserve bleiben pro Teil?", "r": 4, "tol": 0, "u": "Sekunden", "e": "2 × 4 = 8 Sekunden, 12 − 8 = 4. Nicht-funktionale Anforderung: Die Lösung muss den Takt einhalten."}, {"id": "A15.3", "t": "frei", "q": "Eine Absatzprognose lernt nur aus vergangenen Verkäufen. Nenne drei Dinge, die sie nicht wissen kann, und was du daraus ableitest.", "m": "Aktionen und Preisänderungen, die nie dokumentiert wurden. Einmalige Ereignisse (Wetter, Feiertage, Lieferengpass, neuer Konkurrent). Neue Produkte ohne Historie. Ableitung: Datenqualität zuerst prüfen, Disponenten-Wissen als Korrektur einbauen (Mensch entscheidet, Modell schlägt vor), Erwartungen des Managements an realistische Zahlen binden."}], "videos": [{"id": "yoAXyc1Lwuo", "kanal": "heise academy", "titel": "Bilderkennung: Verwendung eines CNNs", "dauer": "6:11"}, {"id": "aOm-R_UoD8o", "kanal": "Frankfurt School of Finance & Management", "titel": "Warum nutzen Unternehmen Predictive Analytics?", "dauer": "2:00"}, {"id": "qW4YD1ac0Ao", "kanal": "numiqo - Deutsch", "titel": "Entscheidungsbaum einfach erklärt, Predictive Analytics mit Beispiel", "dauer": "6:43"}], "pn": 14}, {"key": "A16", "titel": "Datenarten und Datenbanken", "warum": "Challenge 03 fragt den Datentyp (strukturiert, semi-strukturiert, unstrukturiert), Challenge 01 zeigt ein Datenbankschema.", "fragen": [{"id": "A16.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Datenarten und Datenbanken»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Challenge 03 fragt den Datentyp (strukturiert, semi-strukturiert, unstrukturiert), Challenge 01 zeigt ein Datenbankschema. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A16.vq.Ju8Cyj0LQ6U.vor0", "vid": "Ju8Cyj0LQ6U", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist ein typisches Beispiel für strukturierte Daten laut Video?", "a": ["Eine E-Mail", "Ein Kundenbrief", "Eine Tabelle mit klaren Spalten", "Ein handgeschriebener Zettel"], "r": 2, "e": "Das Video nennt Tabellen mit klarer Spaltenbezeichnung als typisches Beispiel für strukturierte Daten."}, {"id": "A16.vq.Ju8Cyj0LQ6U.vor1", "vid": "Ju8Cyj0LQ6U", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wo stehen semi-strukturierte Daten wie XML im Vergleich zu den anderen beiden Datenarten?", "a": ["Genau dazwischen", "Sie sind identisch mit strukturierten Daten", "Sie sind identisch mit unstrukturierten Daten", "Es gibt sie laut Video gar nicht"], "r": 0, "e": "Semi-strukturierte Daten enthalten laut Video nur einen Teil der Strukturinformation, also dazwischen."}, {"id": "A16.v.Ju8Cyj0LQ6U", "t": "frei", "abruf": 1, "vid": "Ju8Cyj0LQ6U", "vq": "nach", "q": "Video «Strukturierte, semistrukturierte und unstrukturierte Daten» (Thomas Grosser): Was waren die Kernaussagen?", "m": "1. Strukturierte Daten haben eine feste Form mit klar benannten Spalten, wie es zum Beispiel bei Tabellen der Fall ist. 2. Unstrukturierte Daten besitzen keine feste Struktur, typische Beispiele sind Kundenbriefe oder E-Mails. 3. Semistrukturierte Daten liegen dazwischen und tragen einen Teil ihrer Strukturinformation bereits in sich, wie es zum Beispiel bei XML-Dateien der Fall ist."}, {"id": "A16.vq.Ju8Cyj0LQ6U.nach0", "vid": "Ju8Cyj0LQ6U", "vq": "nach", "t": "mc", "q": "Was zeichnet strukturierte Daten laut Video aus?", "a": ["Keine feste Struktur", "Eine feste Struktur mit klar bezeichneten Spalten", "Ausschliesslich Bilder", "Ausschliesslich Sprachaufnahmen"], "r": 1, "e": "Strukturierte Daten haben laut Video eine feste Struktur und eine klare Bezeichnung der Spalten."}, {"id": "A16.vq.Ju8Cyj0LQ6U.nach1", "vid": "Ju8Cyj0LQ6U", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele für unstrukturierte Daten nennt das Video?", "a": ["Kundenbriefe", "Tabellen", "E-Mails", "XML-Dateien"], "r": [0, 2], "e": "Kundenbriefe und E-Mails nennt das Video als typische Beispiele für unstrukturierte Daten."}, {"id": "A16.vq.Ju8Cyj0LQ6U.nach2", "vid": "Ju8Cyj0LQ6U", "vq": "nach", "t": "lueck", "q": "Daten, die nur einen Teil der Strukturinformation enthalten, wie zum Beispiel XML, nennt man ___ Daten.", "r": ["semi-strukturierte", "semistrukturierte"], "e": "Das Video nennt diese Zwischenform semi-strukturierte Daten."}, {"id": "A16.vq.Ju8Cyj0LQ6U.nach3", "vid": "Ju8Cyj0LQ6U", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel aus deinem Alltag, was strukturierte, semi-strukturierte und unstrukturierte Daten unterscheidet.", "m": "Eine Excel-Tabelle mit festen Spalten für Name und Betrag wäre strukturiert. Eine XML-Datei mit Tags, aber ohne feste Tabellenform, wäre semi-strukturiert. Eine private E-Mail ohne jede feste Form wäre unstrukturiert, weil der Inhalt frei formuliert ist."}, {"id": "A16.vq.Ju8Cyj0LQ6U.abc", "t": "abc", "abruf": 1, "vid": "Ju8Cyj0LQ6U", "vq": "nach", "m": ["Bezeichnung", "E-Mail", "Informationen", "Kundenbrief", "Semi-strukturiert", "Spalte", "Struktur", "Tabelle", "Unstrukturiert", "XML"], "q": "ABC-Liste zu «Strukturierte, semistrukturierte und unstrukturierte Daten»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A16.vq.Ju8Cyj0LQ6U.kawa", "t": "kawa", "abruf": 1, "vid": "Ju8Cyj0LQ6U", "vq": "nach", "wort": "DATEN", "m": ["D: Daten: Informationen, die in unterschiedlichen Formen vorliegen können", "A: Aufbau: strukturierte Daten haben einen klaren, festen Aufbau mit Spalten", "T: Tabelle: typisches Beispiel für strukturierte Daten", "E: E-Mail: typisches Beispiel für unstrukturierte Daten", "N: Nicht standardisiert: unstrukturierte Daten wie Kundenbriefe haben keine feste Form"], "q": "KaWa zu «DATEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A16.vq.-LJYaXfR2X4.vor0", "vid": "-LJYaXfR2X4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man eine einzelne Zeile in einer Datenbanktabelle?", "a": ["Attribut", "Datenfeld", "Datensatz (Tupel)", "Primärschlüssel"], "r": 2, "e": "Eine Zeile in einer Tabelle wird Datensatz oder Tupel genannt."}, {"id": "A16.vq.-LJYaXfR2X4.vor1", "vid": "-LJYaXfR2X4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum bekommen Kunden in einer Datenbank meist eine Kundennummer statt nur einen Namen?", "a": ["Weil Namen zu lang sind", "Um Redundanz und Verwechslungen bei gleichen Namen zu vermeiden", "Weil das gesetzlich vorgeschrieben ist", "Weil Zahlen schneller getippt werden"], "r": 1, "e": "Bei gleichen Namen wie Thomas Müller braucht es eine eindeutige Nummer, um die Datensätze redundanzfrei zu halten."}, {"id": "A16.v.-LJYaXfR2X4", "t": "frei", "abruf": 1, "vid": "-LJYaXfR2X4", "vq": "nach", "q": "Video «Datenbanken Grundlagen einfach erklärt» (IT & Medien einfach erklärt): Was waren die Kernaussagen?", "m": "1. Konsistenz bedeutet, dass gespeicherte Daten unter allen Umstaenden korrekt bleiben, waehrend Redundanzfreiheit bedeutet, dass jeder Datensatz eindeutig ist, weshalb Datenbanken eindeutige Nummern wie Kunden- oder Rechnungsnummern statt Namen zur Identifikation verwenden. 2. Eine Tabelle besteht aus Datensaetzen (Tupeln), die als Zeilen dargestellt werden, aus Attributen als Spalten und aus einzelnen Datenfeldern als Zellen, mehrere solche Tabellen koennen ueber Relationen miteinander verknuepft sein. 3. Der Primaerschluessel identifiziert einen Datensatz eindeutig innerhalb seiner eigenen Tabelle, waehrend ein Fremdschluessel ein Attribut ist, das in einer anderen Tabelle Primaerschluessel ist und so zwei Tabellen miteinander verbindet."}, {"id": "A16.vq.-LJYaXfR2X4.nach0", "vid": "-LJYaXfR2X4", "vq": "nach", "t": "mc", "q": "Wie nennt man das Attribut, das einen Datensatz in seiner eigenen Tabelle eindeutig identifiziert?", "a": ["Fremdschlüssel", "Primärschlüssel", "Datenfeld", "Relation"], "r": 1, "e": "Der Primärschlüssel macht einen Datensatz innerhalb seiner Tabelle eindeutig identifizierbar."}, {"id": "A16.vq.-LJYaXfR2X4.nach1", "vid": "-LJYaXfR2X4", "vq": "nach", "t": "ms", "q": "Welche zwei Begriffe beschreiben laut Video wichtige Grundprinzipien von Datenbanken?", "a": ["Konsistenz", "Redundanzfreiheit", "Amortisation", "Stakeholder-Analyse"], "r": [0, 1], "e": "Konsistenz und Redundanzfreiheit sind die im Video genannten zentralen Begriffe für gute Datenbanken."}, {"id": "A16.vq.-LJYaXfR2X4.nach2", "vid": "-LJYaXfR2X4", "vq": "nach", "t": "lueck", "q": "Nutzt eine Tabelle den Primärschlüssel einer anderen Tabelle, um Daten zuzuordnen, spricht man von einem ___.", "r": ["fremdschlüssel"], "e": "Die Kundennummer wird in der Bestelltabelle zum Fremdschlüssel, weil sie dort nicht der eigene Primärschlüssel ist."}, {"id": "A16.vq.-LJYaXfR2X4.nach3", "vid": "-LJYaXfR2X4", "vq": "nach", "t": "frei", "q": "Erkläre an einem Beispiel aus dem Video den Unterschied zwischen Primärschlüssel und Fremdschlüssel.", "m": "Die Kundennummer ist in der Kundentabelle der Primärschlüssel, weil sie dort jeden Kunden eindeutig identifiziert. Wird dieselbe Kundennummer aber in der Bestelltabelle verwendet, um eine Bestellung einem Kunden zuzuordnen, ist sie dort nur der Fremdschlüssel, denn der eigentliche Primärschlüssel der Bestelltabelle ist die Bestellnummer."}, {"id": "A16.vq.-LJYaXfR2X4.abc", "t": "abc", "abruf": 1, "vid": "-LJYaXfR2X4", "vq": "nach", "m": ["Attribut", "Datenbanksystem", "Datenfeld", "Datensatz", "Fremdschlüssel", "Konsistenz", "Primärschlüssel", "Redundanzfreiheit", "Relation", "Sekundärschlüssel", "Tabelle", "Tupel"], "q": "ABC-Liste zu «Datenbanken Grundlagen einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A16.vq.-LJYaXfR2X4.kawa", "t": "kawa", "abruf": 1, "vid": "-LJYaXfR2X4", "vq": "nach", "wort": "TABELLE", "m": ["T: Tupel: die Bezeichnung für einen einzelnen Datensatz, also eine Zeile", "A: Attribut: eine Spalte wie Nachname oder Postleitzahl", "B: Bestellnummer: der Primärschlüssel der Bestelltabelle", "E: Eindeutigkeit: der Primärschlüssel darf nur einmal vergeben sein", "L: Lieferung: eine falsche Postleitzahl kann hier zu Problemen führen"], "q": "KaWa zu «TABELLE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A16.vq.2EKhpqqp9Fo.vor0", "vid": "2EKhpqqp9Fo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht die Abkürzung SQL?", "a": ["Simple Query List", "Structured Query Language", "System Quality Level", "Standard Question Logic"], "r": 1, "e": "SQL steht laut Video für Structured Query Language."}, {"id": "A16.vq.2EKhpqqp9Fo.vor1", "vid": "2EKhpqqp9Fo", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was braucht man laut Video, um herauszufinden, wie viel Geld ein Kunde insgesamt ausgegeben hat, wenn Kunden- und Produktdaten in zwei getrennten Tabellen liegen?", "a": ["Nur die Kundentabelle reicht aus", "Man muss beide Tabellen miteinander verknüpfen", "Man braucht eine dritte, komplett neue Datenbank", "Das ist mit SQL grundsätzlich nicht möglich"], "r": 1, "e": "Das Video zeigt genau dieses Beispiel: nur durch Verknüpfung beider Tabellen lässt sich der Betrag ermitteln."}, {"id": "A16.v.2EKhpqqp9Fo", "t": "frei", "abruf": 1, "vid": "2EKhpqqp9Fo", "vq": "nach", "q": "Video «Was ist SQL? (3 Minuten Erklärung für Anfänger)» (Fabian Rappert | Data Science Institute): Was waren die Kernaussagen?", "m": "1. SQL steht fuer Structured Query Language und ist die Sprache, mit der man mit relationalen Datenbanken kommuniziert, also mit Datenbanken, deren Tabellen ueber gemeinsame Werte miteinander in Verbindung stehen. 2. Um zum Beispiel herauszufinden, wie viel Geld eine Kundin ausgegeben hat, muss man oft zwei verknuepfte Tabellen gleichzeitig nutzen, etwa eine Kundentabelle und eine Produkttabelle, weil die noetige Information erst aus der Kombination beider entsteht. 3. Zur Verwaltung relationaler Datenbanken nutzt man ein relationales Datenbank-Managementsystem (RDBMS), zu den bekanntesten zaehlen PostgreSQL, Microsoft SQL Server und MySQL."}, {"id": "A16.vq.2EKhpqqp9Fo.nach0", "vid": "2EKhpqqp9Fo", "vq": "nach", "t": "mc", "q": "Was ist laut Video eine relationale Datenbank?", "a": ["Eine Datenbank, die nur ein einziges Feld speichert", "Mehrere Tabellen, die über gemeinsame Daten miteinander in Verbindung stehen", "Eine Datenbank ganz ohne Struktur", "Eine Datenbank, die nur Bilder speichert"], "r": 1, "e": "Das Video definiert eine relationale Datenbank genau so: Tabellen, die über gemeinsame Daten verbunden sind."}, {"id": "A16.vq.2EKhpqqp9Fo.nach1", "vid": "2EKhpqqp9Fo", "vq": "nach", "t": "ms", "q": "Welche zwei RDBMS werden im Video als Beispiele genannt?", "a": ["MySQL", "PostgreSQL", "Excel", "Google Docs"], "r": [0, 1], "e": "Das Video nennt MySQL und PostgreSQL ausdrücklich als Beispiele für RDBMS."}, {"id": "A16.vq.2EKhpqqp9Fo.nach2", "vid": "2EKhpqqp9Fo", "vq": "nach", "t": "lueck", "q": "SQL ist die Sprache, mit der man Daten in relationalen ___ abfragt, ändert, hinzufügt oder löscht.", "r": ["datenbanken"], "e": "Das Video erklärt SQL genau als die Sprache für den Umgang mit relationalen Datenbanken."}, {"id": "A16.vq.2EKhpqqp9Fo.nach3", "vid": "2EKhpqqp9Fo", "vq": "nach", "t": "frei", "q": "Erkläre an deinem eigenen Beispiel, das nicht Kunde und Produkt ist, warum zwei getrennte Tabellen manchmal sinnvoller sind als eine grosse Tabelle.", "m": "Eine Schule könnte Schüler und Klassenräume in zwei getrennten Tabellen führen, statt jede Schülerzeile mit allen Rauminformationen zu wiederholen. So müssen Rauminformationen nur einmal gepflegt werden und ändern sich nicht in hundert Zeilen gleichzeitig. Über eine Verknüpfung findet man trotzdem heraus, wer in welchem Raum sitzt."}, {"id": "A16.vq.2EKhpqqp9Fo.abc", "t": "abc", "abruf": 1, "vid": "2EKhpqqp9Fo", "vq": "nach", "m": ["Abfrage", "Datenbank", "Einkaufsliste", "Kundentabelle", "MySQL", "PostgreSQL", "Produkttabelle", "RDBMS", "Relational", "SQL", "Structured Query Language", "Tabelle"], "q": "ABC-Liste zu «Was ist SQL? (3 Minuten Erklärung für Anfänger)»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A16.vq.2EKhpqqp9Fo.kawa", "t": "kawa", "abruf": 1, "vid": "2EKhpqqp9Fo", "vq": "nach", "wort": "TABELLE", "m": ["T: Tabelle: digitale Form einer Datenbank, zum Beispiel für Kunden", "A: Abfrage: mit SQL fragt man Daten aus der Datenbank ab", "B: Beziehung: zwei Tabellen stehen über gemeinsame Daten in Verbindung", "E: Einkaufsliste: das einfachste Beispiel einer Datenbank im Video", "L: Löschen: eine der vier Dinge, die man mit SQL tun kann"], "q": "KaWa zu «TABELLE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A16.vq.2goPVJOvJVY.vor0", "vid": "2goPVJOvJVY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht die Abkürzung SQL?", "a": ["Simple Question Language", "Structured Query Language", "System Quality Level", "Server Query Logic"], "r": 1, "e": "Das Video erklärt SQL ausdrücklich als Structured Query Language."}, {"id": "A16.vq.2goPVJOvJVY.vor1", "vid": "2goPVJOvJVY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man eine komplette Zeile einer Datenbanktabelle, die alle Infos zu einem Eintrag enthält?", "a": ["Attribut", "Tupel", "Query", "Schema"], "r": 1, "e": "Das Video nennt eine ganze Zeile mit allen Informationen ein Tupel."}, {"id": "A16.v.2goPVJOvJVY", "t": "frei", "abruf": 1, "vid": "2goPVJOvJVY", "vq": "nach", "q": "Video «SQL Einführung» (Informatik - simpleclub): Was waren die Kernaussagen?", "m": "1. Mit SQL lassen sich grundsaetzlich drei Dinge tun: Datenbanktabellen erzeugen, ihre Eintraege bearbeiten (einfuegen, aendern, loeschen) und Abfragen an die Datenbank stellen, um bestimmte Informationen auszugeben. 2. Eine Tabellenspalte wird als Attribut bezeichnet, eine einzelne Zeile mit allen Werten zu einem Eintrag als Tupel, und der Wert in einem einzelnen Feld als Attributwert. 3. SQL ist an die englische Sprache angelehnt und wird von den meisten Datenbanksystemen unterstuetzt, wodurch man mit denselben Grundbefehlen sowohl Tabellen erstellen als auch gezielt gefilterte Ergebnisse abfragen kann."}, {"id": "A16.vq.2goPVJOvJVY.nach0", "vid": "2goPVJOvJVY", "vq": "nach", "t": "mc", "q": "Welche drei Grundfunktionen kann man laut Video mit SQL ausführen, neben dem Erstellen von Tabellen?", "a": ["Tabellen bearbeiten und Abfragen stellen", "Bilder bearbeiten und drucken", "E-Mails versenden und empfangen", "Videos schneiden und exportieren"], "r": 0, "e": "Laut Video kann man mit SQL Tabellen erzeugen, bearbeiten und Abfragen an sie stellen."}, {"id": "A16.vq.2goPVJOvJVY.nach1", "vid": "2goPVJOvJVY", "vq": "nach", "t": "mc", "q": "Wie werden die Spalten einer Datenbanktabelle laut Video genannt?", "a": ["Tupel", "Attribute", "Prompts", "Indizes"], "r": 1, "e": "Die Spalten einer Tabelle, also zum Beispiel Filmname oder Kosten, heissen laut Video Attribute."}, {"id": "A16.vq.2goPVJOvJVY.nach2", "vid": "2goPVJOvJVY", "vq": "nach", "t": "lueck", "q": "Eine ganze Tabelle kann laut Video aus mehreren ___ bestehen, also aus mehreren Zeilen mit vollständigen Datensätzen.", "r": ["tupeln", "tupel"], "e": "Das Video sagt, dass eine Tabelle aus mehreren Tupeln bestehen kann, jedes Tupel ist eine vollständige Zeile."}, {"id": "A16.vq.2goPVJOvJVY.nach3", "vid": "2goPVJOvJVY", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie mit Datenbanken gearbeitet hat, was der Unterschied zwischen einer Tabelle erstellen, Daten hinzufügen und einer Abfrage stellen ist.", "m": "Eine Tabelle erstellen bedeutet, das leere Grundgerüst mit Spalten wie Name oder Kosten anzulegen. Daten hinzufügen heisst, konkrete Werte wie einen Filmnamen in dieses Gerüst einzutragen, sodass eine neue Zeile entsteht. Eine Abfrage stellen bedeutet dagegen, die Datenbank nach bestimmten Einträgen zu fragen, zum Beispiel nach allen Filmen eines bestimmten Genres."}, {"id": "A16.vq.2goPVJOvJVY.abc", "t": "abc", "abruf": 1, "vid": "2goPVJOvJVY", "vq": "nach", "m": ["Abfrage", "Attribut", "Bearbeiten", "Datenbank", "Genre", "Löschen", "Spalte", "SQL", "Tabelle", "Tupel", "Wert", "Zeile"], "q": "ABC-Liste zu «SQL Einführung»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A16.vq.2goPVJOvJVY.kawa", "t": "kawa", "abruf": 1, "vid": "2goPVJOvJVY", "vq": "nach", "wort": "TABELLE", "m": ["T: Tupel ist eine vollständige Zeile mit allen Werten", "A: Attribute sind die Spalten einer Tabelle", "B: Bearbeiten kann man Einträge jederzeit mit SQL, zum Beispiel die Kosten ändern", "E: Erzeugen einer neuen Tabelle ist die erste Grundfunktion von SQL", "L: Löschen eines Eintrags entfernt ihn komplett aus der Tabelle"], "q": "KaWa zu «TABELLE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A16.0", "t": "mc", "q": "Ein JSON-Eintrag mit verschachtelten Feldern (Adresse, Liste von Fachgebieten) ist:", "a": ["strukturiert", "semi-strukturiert", "unstrukturiert", "binär"], "r": 1, "e": "Strukturiert = feste Tabellen (SQL). Semi-strukturiert = JSON, XML. Unstrukturiert = Freitext, Bilder, Audio."}, {"id": "A16.1", "t": "ms", "q": "Welche zwei sind unstrukturierte Daten?", "a": ["Kundentabelle im ERP", "E-Mail-Texte", "Aufgezeichnete Telefongespräche", "CSV-Export der Bestellungen"], "r": [1, 2], "e": "Gerade für unstrukturierte Daten ist KI stark, aber Datenschutz und Qualität sind dort schwerer zu kontrollieren."}, {"id": "A16.2", "t": "lueck", "q": "Ergänze die SQL-Abfrage: ___ name, preis FROM produkte WHERE kategorie_id = 3;", "r": ["select"], "e": "SELECT Spalten FROM Tabelle WHERE Bedingung. Mehr SQL brauchst du nicht, aber lesen können musst du es."}, {"id": "A16.3", "t": "mc", "q": "Wofür steht ein Fremdschlüssel (z.B. produkte.kategorie_id)?", "a": ["Er verschlüsselt die Tabelle", "Er verweist auf den Datensatz einer anderen Tabelle (kategorien.id)", "Er ist das Passwort der Datenbank", "Er zählt die Zeilen"], "r": 1, "e": "So hängen Tabellen zusammen. Wer das Schema lesen kann, erkennt, welche Tabelle ein Modell erfunden hat."}, {"id": "A16.4", "t": "frei", "q": "Die Dreierfrage der Prüfung: Bauteilbilder ohne Personen, aber unter Geheimhaltungsvertrag. Datentyp, Schutzstufe, Speicherort?", "m": "Datentyp: unstrukturiert (Bilder), keine Personendaten. Schutzstufe: vertraulich, weil Geschäftsgeheimnis und vertragliche Geheimhaltung (nicht DSG, sondern Vertrag). Speicherort: eigene Infrastruktur oder vertraglich gesicherter Anbieter mit Zugriffsbeschränkung, keine öffentlichen KI-Dienste, die Eingaben zum Training nutzen."}], "videos": [{"id": "Ju8Cyj0LQ6U", "kanal": "Thomas Grosser", "titel": "Strukturierte, semistrukturierte und unstrukturierte Daten", "dauer": "0:48"}, {"id": "-LJYaXfR2X4", "kanal": "IT & Medien einfach erklärt", "titel": "Datenbanken Grundlagen einfach erklärt", "dauer": "5:34"}, {"id": "2EKhpqqp9Fo", "kanal": "Fabian Rappert | Data Science Institute", "titel": "Was ist SQL? (3 Minuten Erklärung für Anfänger)", "dauer": "3:01"}, {"id": "2goPVJOvJVY", "kanal": "Informatik - simpleclub", "titel": "SQL Einführung", "dauer": "5:37"}], "pn": 6}], "pl": 2}, {"kz": "B", "titel": "Recht und Governance", "themen": [{"key": "B1", "titel": "Schweizer Datenschutzgesetz (DSG)", "warum": "Personendaten, besonders schützenswerte Daten, Auslandtransfer.", "fragen": [{"id": "B1.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Schweizer Datenschutzgesetz (DSG)»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Personendaten, besonders schützenswerte Daten, Auslandtransfer. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "B1.vq.wFSIEwa5BA8.vor0", "vid": "wFSIEwa5BA8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wer kann bei einer Datenschutzverletzung in der Schweiz persönlich bestraft werden?", "a": ["Nur das Unternehmen als Ganzes", "Auch einzelne Mitarbeitende persönlich", "Niemand, es gibt keine Strafen", "Nur der Staat"], "r": 1, "e": "Im Unterschied zur EU-DSGVO, die vor allem Unternehmen mit Bussen belegt, können in der Schweiz auch einzelne Personen persönlich bestraft werden."}, {"id": "B1.vq.wFSIEwa5BA8.vor1", "vid": "wFSIEwa5BA8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Zählt das Verschicken eines Geburtstagsgeschenks mit Adressdaten schon als Datenbearbeitung im Sinne des Datenschutzgesetzes?", "a": ["Nein, das ist viel zu banal", "Ja, sobald man mit Personendaten hantiert, ist es Datenbearbeitung", "Nur wenn es ein Geschäftskunde ist", "Nur bei mehr als 100 Geschenken"], "r": 1, "e": "Das Video betont, dass Datenbearbeitung fast alles umfasst, was man mit Daten macht, selbst ein einfaches Geburtstagsgeschenk."}, {"id": "B1.v.wFSIEwa5BA8", "t": "frei", "abruf": 1, "vid": "wFSIEwa5BA8", "vq": "nach", "q": "Video «Schweizer Fachanwalt erklärt: Das müssen Sie zum neuen Datenschutzgesetz wissen» (Elovade): Was waren die Kernaussagen?", "m": "1. Das Schweizer Datenschutzgesetz verlangt ein Bearbeitungsverzeichnis, das festhält, mit wem und wozu Personendaten bearbeitet werden. ACHTUNG, das Video nennt die Ausnahme nicht: Nach Art. 12 Abs. 5 DSG und Art. 24 DSV sind Unternehmen mit weniger als 250 Mitarbeitenden befreit, sofern die Bearbeitung ein geringes Risiko für die Persönlichkeit birgt. Beliebte Prüfungsfalle. 2. Anders als bei der EU-DSGVO drohen im Schweizer DSG keine Bussen in Prozent des Unternehmensumsatzes, sondern eine strafrechtliche Verantwortung trifft einzelne Mitarbeitende persönlich, wogegen man sich nicht versichern kann. 3. Datensicherheit gilt als eigenständiger Pflichtbereich neben den rechtlichen Vorgaben, für den die Geschäftsleitung Verantwortung trägt."}, {"id": "B1.vq.wFSIEwa5BA8.nach0", "vid": "wFSIEwa5BA8", "vq": "nach", "t": "mc", "q": "Was unterscheidet die Schweizer Regelung von der EU-DSGVO laut Video besonders?", "a": ["Die Schweiz kennt gar keine Strafen", "In der Schweiz können auch einzelne Mitarbeitende persönlich bestraft werden", "Die EU-DSGVO bestraft nur Einzelpersonen", "Es gibt keinen Unterschied"], "r": 1, "e": "Das Video hebt hervor, dass in der Schweiz Einzelpersonen bestraft werden können, während sich die EU-DSGVO vor allem an Unternehmen richtet."}, {"id": "B1.vq.wFSIEwa5BA8.nach1", "vid": "wFSIEwa5BA8", "vq": "nach", "t": "mc", "q": "Kann man sich in der Schweiz gegen eine persönliche Datenschutz-Busse versichern?", "a": ["Ja, das ist Standard", "Nein, laut Video gibt es dafür keine Versicherung", "Nur bei grossen Unternehmen", "Nur wenn man vorher zahlt"], "r": 1, "e": "Das Video sagt ausdrücklich, dass man sich dagegen nicht versichern kann."}, {"id": "B1.vq.wFSIEwa5BA8.nach2", "vid": "wFSIEwa5BA8", "vq": "nach", "t": "lueck", "q": "Datenschutz ist laut Video kein Sprint, sondern ein ___.", "r": ["marathon"], "e": "Das Video vergleicht Datenschutzarbeit mit einem Marathon, also einer dauerhaften Aufgabe."}, {"id": "B1.vq.wFSIEwa5BA8.nach3", "vid": "wFSIEwa5BA8", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der denkt, Datenschutz betreffe nur grosse Konzerne, warum auch ein einfacher Vorgang wie ein Geburtstagsgeschenk-Versand relevant sein kann.", "m": "Sobald man Personendaten wie Namen oder Adressen verwendet, um zum Beispiel ein Geschenk zu verschicken, bearbeitet man bereits Personendaten im Sinne des Gesetzes. Der Begriff Datenbearbeitung ist sehr weit gefasst und betrifft nicht nur grosse, systematische Datenverarbeitung, sondern auch kleine Alltagsvorgänge."}, {"id": "B1.vq.wFSIEwa5BA8.abc", "t": "abc", "abruf": 1, "vid": "wFSIEwa5BA8", "vq": "nach", "m": ["Bearbeitungsverzeichnis", "Datenschutz", "Datenschutzbeauftragte", "Datensicherheit", "Einzelperson", "Geburtstagsgeschenk", "Mitarbeiter", "Personendaten", "Risiko", "Strafe", "Verpflichtungserklärung", "Versicherung"], "q": "ABC-Liste zu «Schweizer Fachanwalt erklärt: Das müssen Sie zum neuen Datenschutzgesetz wissen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B1.vq.wFSIEwa5BA8.kawa", "t": "kawa", "abruf": 1, "vid": "wFSIEwa5BA8", "vq": "nach", "wort": "STRAFE", "m": ["S: Strafen können in der Schweiz auch Einzelpersonen treffen.", "T: Trennung von EU-DSGVO und Schweizer Recht zeigt sich bei den Bussen.", "R: Risiko einer Verletzung kann man in der Schweiz nicht versichern.", "A: Aufwand für Datenschutz ist ein Marathon, kein Sprint, laut Video.", "F: Fehlverhalten Einzelner kann persönlich bestraft werden.", "E: Einzelpersonen, nicht nur Unternehmen, tragen laut Video eine Verantwortung."], "q": "KaWa zu «STRAFE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B1.vq.g6lUrCUqgL0.vor0", "vid": "g6lUrCUqgL0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Reicht ein einfacher Vertrag mit einem externen Dienstleister aus, damit ein Unternehmen dessen Daten rechtlich verarbeiten lassen darf?", "a": ["nein, Datenverarbeitung durch Dritte ist grundsätzlich verboten", "ja, mit einem Auftragsverarbeitungsvertrag (DPA) darf ein anderer die Daten im eigenen Auftrag verarbeiten", "nur wenn der Dienstleister in der Schweiz sitzt", "nein, das geht nur mit einer eigenen KI-Verordnung"], "r": 1, "e": "Das Video erklärt, dass Auftragsverarbeitung mit einem entsprechenden Vertrag (DPA) im Datenschutzrecht schon lange vorgesehen ist und die Verarbeitung durch Dritte erlaubt."}, {"id": "B1.vq.g6lUrCUqgL0.vor1", "vid": "g6lUrCUqgL0", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woher stammt ursprünglich die Idee des Artikels 22 DSGVO, dass niemand allein von einer automatisierten Maschinenentscheidung betroffen sein darf?", "a": ["aus einer EU-Verordnung der 2000er Jahre", "aus einem US-Gerichtsurteil", "aus der Science-Fiction-Literatur der 1970er Jahre aus Frankreich", "aus der Informatikforschung des IBM-Konzerns"], "r": 2, "e": "So erzählt es der Gast im Video. ACHTUNG, in der Prüfung nicht so antworten: Belegt ist Art. 2 der französischen Loi 78-17 von 1978 (Informatique et Libertés). Von dort kam das Verbot rein automatisierter Einzelentscheidungen über die Datenschutzrichtlinie 95/46/EG in Art. 22 DSGVO."}, {"id": "B1.v.g6lUrCUqgL0", "t": "frei", "abruf": 1, "vid": "g6lUrCUqgL0", "vq": "nach", "q": "Video «Datenschutz ist kein KI-Verhinderer: Warum die DSGVO ein Verbündeter ist | Dr. Sebastian Kraska» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Dr. Sebastian Kraska erklärt die Auftragsverarbeitung, bei der ein Anbieter Daten im Auftrag und auf Weisung verarbeitet, während die rechtliche Verantwortung beim Unternehmen bleibt, als zentrales Konstrukt für den datenschutzkonformen KI-Einsatz. 2. Er erläutert Artikel 22 DSGVO zur automatisierten Einzelentscheidung: Menschen dürfen nicht allein einer vollautomatisierten Maschinenentscheidung unterworfen werden, etwa bei einer automatisierten Bewerbervorauswahl, ohne dass ein Korrektiv besteht. 3. Kraska vergleicht Verantwortliche mit Fluglotsen und Schiffslotsen: Wer KI-Agenten autonom entscheiden lässt und damit wie ein Schiffslotse volle Verantwortung übernimmt, braucht deutlich mehr rechtliches Verständnis als jemand, der nur einzelne Prozesse automatisiert."}, {"id": "B1.vq.g6lUrCUqgL0.nach0", "vid": "g6lUrCUqgL0", "vq": "nach", "t": "mc", "q": "Welches Argument bezeichnet Sebastian Kraska im Video als 'gefährliches Halbwissen'?", "a": ["dass man mit Cloud oder ChatGPT gar nichts machen könne, weil die Server in den USA seien", "dass man alle KI-Systeme sofort abschalten müsse", "dass Microsoft niemals genutzt werden dürfe", "dass die DSGVO für KI gar nicht gilt"], "r": 0, "e": "Er kritisiert den pauschalen Satz, mit Claude oder Google gehe wegen der US-Server gar nichts, als typisches Beispiel für gefährliches Halbwissen."}, {"id": "B1.vq.g6lUrCUqgL0.nach1", "vid": "g6lUrCUqgL0", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge sollen laut dem Gespräch immer beim Menschen bleiben, auch wenn Agenten viele Aufgaben übernehmen?", "a": ["die Entscheidungshoheit", "die Rechtschreibprüfung", "die Haftung für die Entscheidung", "das Anlegen von Kalendereinträgen"], "r": [0, 2], "e": "Sebastian Kraska nennt Intent, Entscheidungshoheit und Haftung als Punkte, die seiner Meinung nach immer beim Menschen bleiben sollten."}, {"id": "B1.vq.g6lUrCUqgL0.nach2", "vid": "g6lUrCUqgL0", "vq": "nach", "t": "lueck", "q": "Die EU reguliert laut dem Gespräch vorab mit Grundsätzen, während die USA erst laufen lassen und dann ___ regulieren.", "r": ["sektorspezifisch", "branchenspezifisch", "applikationsspezifisch"], "e": "Das Gespräch beschreibt den amerikanischen Ansatz, zuerst laufen zu lassen und erst dort zu regulieren, wo tatsächlich Schäden entstehen, also sektor- oder applikationsspezifisch."}, {"id": "B1.vq.g6lUrCUqgL0.nach3", "vid": "g6lUrCUqgL0", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, warum es laut dem Video nicht automatisch datenschutzwidrig ist, ein KI-Tool eines US-Anbieters im Unternehmen einzusetzen.", "m": "Das Datenschutzrecht kennt Auftragsverarbeitung schon lange, auch wenn dabei ein anderer Anbieter im eigenen Auftrag Daten verarbeitet. Mit einem entsprechenden Vertrag, dem Auftragsverarbeitungsvertrag, darf ein Unternehmen einem US-Anbieter Daten geben, solange die vertraglichen und rechtlichen Anforderungen erfüllt sind. Das pauschale Argument, mit US-Cloud-Diensten gehe grundsätzlich gar nichts, bezeichnet der Datenschutzexperte im Video deshalb als gefährliches Halbwissen."}, {"id": "B1.vq.g6lUrCUqgL0.abc", "t": "abc", "abruf": 1, "vid": "g6lUrCUqgL0", "vq": "nach", "m": ["Artikel 22", "Auftragsverarbeitung", "Automatisierte Entscheidung", "Cloud", "Datenschutz", "DPA", "DSGVO", "Entscheidungshoheit", "Haftung", "Halbwissen", "KI-Verordnung", "Risikosteuerung"], "q": "ABC-Liste zu «Datenschutz ist kein KI-Verhinderer: Warum die DSGVO ein Verbündeter ist | Dr. Sebastian Kraska»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B1.vq.g6lUrCUqgL0.kawa", "t": "kawa", "abruf": 1, "vid": "g6lUrCUqgL0", "vq": "nach", "wort": "RISIKO", "m": ["R: Risikosteuerung: das Thema Datenverarbeitung im Ausland sollte man eher unter Risikosteuerung sehen, sagt Kraska", "I: Intent: die Richtung eines Agents bestimmt zuerst der Mensch mit seinem Prompt", "S: Souveränität: die europäische Diskussion dreht sich stark um digitale Souveränität", "K: KI-Verordnung: wurde unter hohem Zeitdruck vor den EU-Wahlen durchgebracht", "O: Open Source: Schleswig-Holstein steigt aus Kostengründen auf Open Source um"], "q": "KaWa zu «RISIKO»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B1.vq.aI1GMBWeySw.vor0", "vid": "aI1GMBWeySw", "vq": "vor", "t": "mc", "q": "Was glaubst du: In wie viele Phasen unterteilt der Datenschutzexperte im Video den Umgang mit KI-Anwendungen?", "a": ["Zwei", "Drei", "Vier", "Fünf"], "r": 1, "e": "Er unterscheidet drei Phasen: das Antrainieren, das ruhende LLM und die konkrete Implementierung in Anwendungsfälle."}, {"id": "B1.vq.aI1GMBWeySw.vor1", "vid": "aI1GMBWeySw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was empfiehlt der Sprecher persönlich für den geschäftlichen Einsatz von KI-Tools?", "a": ["Immer die kostenlose private Version nutzen", "Nur bezahlte Tools mit Vertrag verwenden", "Gar keine KI im Unternehmen einsetzen", "Nur firmeneigene Tools ohne jeden Anbieter"], "r": 1, "e": "Der Sprecher sagt ausdrücklich, dass er persönlich nie kostenlose private Tools nutzt, sondern immer bezahlte Tools mit Vertrag."}, {"id": "B1.v.aI1GMBWeySw", "t": "frei", "abruf": 1, "vid": "aI1GMBWeySw", "vq": "nach", "q": "Video «Datenschutz & KI: Was muss ich im beruflichen KI-Einsatz WIRKLICH beachten?» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Dr. Sebastian Kraska rät, bei jedem Datenschutz-Einwand zu prüfen, ob es ein echter rechtlicher Einwand oder nur ein emotionaler Vorwand ist, und verweist als Beleg auf die plötzliche Cloud-Akzeptanz während Corona. 2. Er empfiehlt, für geschäftliche KI-Nutzung nie kostenlose Privat-Accounts zu verwenden, sondern nur bezahlte Verträge mit vertraglich geregelten Datenschutz-Mindeststandards. 3. Kraska schlägt vor, eine private KI zunächst nach der gewünschten Aufbereitung von Antworten zu befragen und dieses Prompting-Wissen für die geschäftliche KI wiederzuverwenden, weil Daten nicht einfach zwischen Accounts übertragen werden dürfen."}, {"id": "B1.vq.aI1GMBWeySw.nach0", "vid": "aI1GMBWeySw", "vq": "nach", "t": "mc", "q": "Warum musste die Firma im Video ihre Server früher in die Cloud verlagern?", "a": ["Weil die Cloud billiger war als Strom", "Weil das Büro in einem Hochwassergebiet lag", "Weil der Vermieter es verlangte", "Weil es gesetzlich vorgeschrieben war"], "r": 1, "e": "Der Sprecher erzählt, dass sein Büro in einem Hochwassergebiet lag und die Server deshalb gefährdet waren."}, {"id": "B1.vq.aI1GMBWeySw.nach1", "vid": "aI1GMBWeySw", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge nennt der Sprecher als Kriterien, bevor er einem KI-Anbieter vertraut?", "a": ["Ein Mindeststandard beim Anbieter", "Ein möglichst niedriger Preis", "Ein Vertrag mit dem Anbieter", "Ein bekannter Prominenter als Werbeträger"], "r": [0, 2], "e": "Er nennt Mindeststandard und Vertrag als seine persönlichen Kriterien, Preis und Werbung spielen im Video keine Rolle."}, {"id": "B1.vq.aI1GMBWeySw.nach2", "vid": "aI1GMBWeySw", "vq": "nach", "t": "lueck", "q": "Der Sprecher empfiehlt, die private KI zu fragen, wie man am besten für die ___ KI im Unternehmen promptet.", "r": ["neue", "geschaeftliche"], "e": "Er beschreibt die Idee, die alte private KI nach gutem Prompting zu fragen und das Ergebnis für die neue geschäftliche KI zu nutzen."}, {"id": "B1.vq.aI1GMBWeySw.nach3", "vid": "aI1GMBWeySw", "vq": "nach", "t": "frei", "q": "Erkläre, warum laut Video viele Ängste vor Datenschutz beim KI-Einsatz eher emotional als inhaltlich begründet sind.", "m": "Der Datenschutzexperte sagt, dass viele Bedenken eher aus Unsicherheit oder Angst vor Veränderung entstehen als aus echten rechtlichen Problemen. Als Beispiel nennt er die Coronazeit, in der plötzlich alle ohne grosse Diskussion in der Cloud arbeiteten, obwohl das vorher jahrelang als Problem galt. Es lohnt sich also, bei jedem Einwand zu prüfen, ob es ein echter rechtlicher Grund ist oder nur ein Vorwand aus Unsicherheit."}, {"id": "B1.vq.aI1GMBWeySw.abc", "t": "abc", "abruf": 1, "vid": "aI1GMBWeySw", "vq": "nach", "m": ["Anbieter", "Angst", "Cloud", "Datenschutzbeauftragter", "Datensicherheit", "Hochwassergebiet", "Implementierung", "LLM", "Mindeststandard", "Prompt", "Server", "Vertrag"], "q": "ABC-Liste zu «Datenschutz & KI: Was muss ich im beruflichen KI-Einsatz WIRKLICH beachten?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "B1.vq.aI1GMBWeySw.kawa", "t": "kawa", "abruf": 1, "vid": "aI1GMBWeySw", "vq": "nach", "wort": "CLOUD", "m": ["C: Cloud-Nutzung stieg während Corona plötzlich stark an", "L: Lösung nur mit Vertrag und Mindeststandard beim Anbieter wählen", "O: Ohne Vertrag keine privaten Gratis-Tools fürs Unternehmen nutzen", "U: Unternehmen sollten prüfen, ob ein Anbieter Mindeststandards einhält", "D: Datenschutzbeauftragter begleitet die Firma bei diesen Entscheidungen"], "q": "KaWa zu «CLOUD»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "B1.vq.QX3UxUm09Sg.vor0", "vid": "QX3UxUm09Sg", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist der Hauptvorteil, wenn ein KI-Modell lokal auf deinem Gerät läuft statt in der Cloud?", "a": ["Es ist immer stärker als Cloud-Modelle", "Vertrauliche Daten bleiben auf dem eigenen Gerät", "Es kostet garantiert nie etwas", "Es braucht kein Smartphone"], "r": 1, "e": "Laut Video ist der grosse Vorteil lokaler Modelle, dass vertrauliche Daten das Gerät ni
