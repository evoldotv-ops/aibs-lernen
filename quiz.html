o besser funktioniert als ein Tool mit vielen Pflichtfeldern.", "m": "Wenn ein Tool zu viele Pflichtfelder hat, wird das Ausfüllen mühsam und die Leute lassen es irgendwann bleiben, gerade bei Bug Reports. Ein einfaches Tool mit Titel und Textfeld wird dagegen wirklich benutzt, weil es schnell geht und trotzdem die wichtigsten Informationen festhält."}, {"id": "C1.vq.lEc1D5mjleA.abc", "t": "abc", "abruf": 1, "vid": "lEc1D5mjleA", "vq": "nach", "m": ["Bug Report", "Business Value", "Event Storming", "Feature Request", "GitHub", "Kontext", "Refactoring", "Reproduktion", "Schritte", "Sonstiges", "Task", "Titel"], "q": "ABC-Liste zu «Gute Anforderungen schreiben»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C1.vq.lEc1D5mjleA.kawa", "t": "kawa", "abruf": 1, "vid": "lEc1D5mjleA", "vq": "nach", "wort": "FEATURE", "m": ["F: Feature Request: eine funktionale Anforderung mit Nutzen für die Kundschaft", "E: Event Storming: Workshop-Format von Alberto Brandolini", "A: Aufhänger: der Titel gibt der Anforderung einen Wiedererkennungspunkt", "T: Task: eine technische Aufgabe ohne direkten Business Value", "U: Unkompliziertes Tool: nur Titel und Textfeld reichen, damit es gerne genutzt wird", "R: Reproduktionsschritte: zeigen, wie ein Fehler im Bug Report entsteht"], "q": "KaWa zu «FEATURE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C1.vq.NCtn4Wjs0lk.vor0", "vid": "NCtn4Wjs0lk", "vq": "vor", "t": "mc", "q": "Was glaubst du: In einem Workshop schätzen zehn Leute eine Zahl. Wessen Schätzung gewinnt meistens?", "a": ["Die genaueste", "Der Durchschnitt", "Die lauteste, oft die des Ranghöchsten", "Die der jüngsten Person"], "r": 2, "e": "Der Workshop ist gut für Ideen und Beteiligung, als Messinstrument ist er miserabel."}, {"id": "C1.vq.NCtn4Wjs0lk.vor1", "vid": "NCtn4Wjs0lk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie fragt man im Interview am besten?", "a": ["«Hätten Sie gern eine KI?»", "«Erzählen Sie mir von gestern Nachmittag. Was hat Sie aufgehalten?»", "«Wie finden Sie unsere Prozesse?»", "«Was wünschen Sie sich für die Zukunft?»"], "r": 1, "e": "Konkrete Vergangenheit statt Wünsche an die Zukunft."}, {"id": "C1.v.NCtn4Wjs0lk", "t": "frei", "abruf": 1, "vid": "NCtn4Wjs0lk", "vq": "nach", "q": "Video «AIB 65 · Lückenfüller 4: Erhebungsmethoden, woher weisst du das?» (EvoldoTV · eigenes Lernvideo (privat)): Was waren die Kernaussagen?", "m": "1. Fünf Werkzeuge, und das Fragewort entscheidet: Was ist aufgezeichnet (Dokumente), warum (Interview), wie viele (Befragung), was geschieht wirklich (Beobachtung), wie lange und wie oft (Messung). 2. Drei Fehlerquellen: Menschen sagen, was sie glauben, Beobachtete verhalten sich anders, und gefragt werden die Falschen. Dagegen hilft die Regel: Jede tragende Zahl braucht zwei Beine. 3. Die Erhebung prüft auch, ob es das richtige Problem ist: Bei der Garage Frei war nicht das Telefon das Problem, sondern die doppelte Erfassung, vier Stunden pro Tag und Standort."}, {"id": "C1.vq.NCtn4Wjs0lk.nach0", "vid": "NCtn4Wjs0lk", "vq": "nach", "t": "ord", "q": "In welcher Reihenfolge setzt Mira die Werkzeuge ein?", "a": ["Dokumente und vorhandene Daten", "Wenige Interviews", "Beobachtung", "Befragung oder Messung"], "e": "Von offen zu geschlossen, von wenigen zu vielen, von Worten zu Zahlen. Der Fragebogen kommt erst, wenn man weiss, wonach man fragen muss."}, {"id": "C1.vq.NCtn4Wjs0lk.nach1", "vid": "NCtn4Wjs0lk", "vq": "nach", "t": "mc", "q": "Was unterscheidet eine Erhebung von einer Überwachung der Mitarbeitenden?", "a": ["Nichts", "Vorher sagen, was und wozu, ohne Namen auswerten, Rohdaten löschen, Personalvertretung einbeziehen", "Die Erhebung dauert kürzer", "Die Überwachung ist genauer"], "r": 1, "e": "Das Schweizer Arbeitsrecht erlaubt keine Systeme zur Verhaltensüberwachung. Und ohne Vertrauen stimmen die Zahlen nicht."}, {"id": "C1.vq.NCtn4Wjs0lk.nach2", "vid": "NCtn4Wjs0lk", "vq": "nach", "t": "ms", "q": "Welche zwei Aussagen zur Regel der zwei Beine stimmen?", "a": ["Jede Zahl, auf der der Vorschlag steht, wird mit zwei verschiedenen Methoden belegt", "Zwei Beine heisst: zwei Workshops", "Telefonzeit: Anlage 2,0 Stunden, Strichliste 1,9 Stunden", "Sie gilt nur für Finanzzahlen"], "r": [0, 2], "e": "Zwei unabhängige Methoden, die dasselbe sagen. Dann überlebt die Zahl die Nachfrage «Woher wissen Sie das?»."}, {"id": "C1.vq.NCtn4Wjs0lk.nach3", "vid": "NCtn4Wjs0lk", "vq": "nach", "t": "frei", "q": "Geh in Gedanken durch deine Projektarbeit: Nenne die wichtigste Zahl und sage, ob sie gemessen, aus dem System, befragt oder geschätzt ist.", "m": "Selbstkontrolle: Bei «geschätzt» gibt es bis zur Prüfung zwei Wege. Nachmessen (Stichprobe, Strichliste, Systemauszug), oder offen sagen, dass es eine Schätzung ist, mit Bandbreite und der Rechnung, was passiert, wenn sie nur halb so gut ausfällt. Beides gibt Punkte. Verschweigen kostet sie."}, {"id": "C1.vq.NCtn4Wjs0lk.abc", "t": "abc", "abruf": 1, "vid": "NCtn4Wjs0lk", "vq": "nach", "m": ["Anforderung", "Bedürfniskatalog", "Befragung", "Beobachtung", "Dokumentenanalyse", "Doppelerfassung", "Hypothese", "Interview", "Leitfaden", "Messung", "Personalvertretung", "Scope", "Stichprobe", "Strichliste", "Validieren", "Workshop"], "q": "ABC-Liste zu «AIB 65 · Lückenfüller 4: Erhebungsmethoden, woher weisst du das?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C1.vq.NCtn4Wjs0lk.kawa", "t": "kawa", "abruf": 1, "vid": "NCtn4Wjs0lk", "vq": "nach", "wort": "FRAGEN", "m": ["F: Fragewort entscheidet das Werkzeug", "R: Reihenfolge: von offen zu geschlossen", "A: Aufgezeichnetes zuerst", "G: Gestern statt Wünsche", "E: Erheben ist nicht überwachen", "N: Nachmessen: zwei Beine"], "q": "KaWa zu «FRAGEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C1.0", "t": "mc", "q": "Welche Anforderung ist prüfbar formuliert?", "a": ["Das System muss schnell sein", "Das System muss benutzerfreundlich sein", "Das System muss 95 % der Anfragen in unter 3 Sekunden beantworten", "Das System soll modern wirken"], "r": 2, "e": "Prüfbar = mit Zahl oder klarer Grenze. «Schnell» und «benutzerfreundlich» kann niemand abnehmen."}, {"id": "C1.1", "t": "mc", "q": "«Das System muss vor jeder Antwort die Berechtigung des Nutzers prüfen.» Was für eine Anforderung ist das?", "a": ["Funktional", "Nicht-funktional (Qualität)", "Randbedingung", "Wunsch"], "r": 0, "e": "Funktional = was das System tut. Nicht-funktional = wie gut (Zeit, Verfügbarkeit, Sicherheit als Qualitätsmass). Randbedingung = Vorgabe von aussen (Budget, Gesetz)."}, {"id": "C1.2", "t": "ord", "q": "Vom Bedürfnis zur Anforderung (C1): richtige Reihenfolge.", "a": ["Anspruchsgruppen identifizieren und klassifizieren", "Erhebungsmethode wählen (Interview, Beobachtung, Befragung)", "Bedürfnisse aufnehmen und in einem Katalog ordnen", "Anforderungen ableiten und prüfbar formulieren", "Anforderungen mit den Anspruchsgruppen validieren"], "e": "Ein Bedürfnis ist ein Wunsch in der Sprache der Person («ich will nicht alles doppelt tippen»), die Anforderung ist die prüfbare Übersetzung."}, {"id": "C1.3", "t": "frei", "q": "Leite aus dem Zitat eine Muss-Anforderung nach Prüfungsmuster ab: «Wenn das Ding am Morgen nicht läuft, stehen bei uns zwölf Touren still.»", "m": "Betrieb/Verfügbarkeit: Die Lösung muss an Werktagen zwischen 06:00 und 09:00 Uhr zu 99,5 % verfügbar sein und bei Ausfall innert 5 Minuten auf den manuellen Ablauf umschalten lassen, weil sonst zwölf Touren nicht starten können (Bezug zum Zitat). Muster: Dimension, «muss», Zahl oder Grenze, «weil» mit Fallbezug."}], "videos": [{"id": "12GcEFXoM-s", "kanal": "Thomas Grosser", "titel": "Anforderungen mit Satzschablonen definieren", "dauer": "2:50"}, {"id": "lEc1D5mjleA", "kanal": "the native web GmbH", "titel": "Gute Anforderungen schreiben", "dauer": "11:38"}, {"id": "NCtn4Wjs0lk", "kanal": "EvoldoTV · eigenes Lernvideo (privat)", "titel": "AIB 65 · Lückenfüller 4: Erhebungsmethoden, woher weisst du das?", "dauer": "13:59"}], "pn": 5}, {"key": "C2", "titel": "Anspruchsgruppen (Stakeholder)", "warum": "Kommt in jedem Critical Incident vor und in C1.", "fragen": [{"id": "C2.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Anspruchsgruppen (Stakeholder)»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Kommt in jedem Critical Incident vor und in C1. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C2.vq.YYgGeJ6KL1A.vor0", "vid": "YYgGeJ6KL1A", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Dimensionen nutzt man laut Video meistens, um Stakeholder zu bewerten?", "a": ["Eine", "Zwei", "Vier", "Sechs"], "r": 1, "e": "Die zwei zentralen Dimensionen sind Macht bzw. Einfluss und Wohlwollen."}, {"id": "C2.vq.YYgGeJ6KL1A.vor1", "vid": "YYgGeJ6KL1A", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was sollte man mit einem Stakeholder tun, der viel Macht hat, dem Projekt aber negativ gegenübersteht?", "a": ["Ihn ignorieren", "Ihn nur per Newsletter informieren", "Vorsichtig und direkt mit ihm kommunizieren", "Das Projekt sofort abbrechen"], "r": 2, "e": "Solche Stakeholder können den Projekterfolg gefährden, deshalb empfiehlt das Video direkten Kontakt und Verständnis für ihre Bedenken."}, {"id": "C2.v.YYgGeJ6KL1A", "t": "frei", "abruf": 1, "vid": "YYgGeJ6KL1A", "vq": "nach", "q": "Video «Stakeholderanalyse im Projektmanagement» (Projektmanagement Einfach Erklärt): Was waren die Kernaussagen?", "m": "1. Stakeholder werden zuerst in interne (z.B. Auftraggeber, Lenkungsausschuss, Projektteam) und externe (z.B. Anwohner, Behoerden, Medien) Gruppen unterteilt und im Rahmen eines Brainstormings oder Kick-off-Workshops gesammelt. 2. Jeder Stakeholder wird anhand zweier Dimensionen bewertet, naemlich Macht beziehungsweise Einfluss auf das Projekt und Wohlwollen gegenueber dem Projekt, was sich in einem Portfolio mit vier Quadranten darstellen laesst. 3. Maechtige und wohlwollende Stakeholder wie der Auftraggeber muessen eng gefuehrt werden mit staendigen Statusberichten, waehrend maechtige, aber ablehnende Stakeholder direkt angesprochen werden sollten, um ihre Bedenken zu verstehen und den Projekterfolg nicht zu gefaehrden."}, {"id": "C2.vq.YYgGeJ6KL1A.nach0", "vid": "YYgGeJ6KL1A", "vq": "nach", "t": "mc", "q": "Welche zwei Dimensionen nutzt die Stakeholder-Bewertung laut Video?", "a": ["Macht und Wohlwollen", "Kosten und Nutzen", "Zeit und Budget", "Risiko und Ertrag"], "r": 0, "e": "Die Stakeholder werden nach Macht bzw. Einfluss und nach Wohlwollen gegenüber dem Projekt bewertet."}, {"id": "C2.vq.YYgGeJ6KL1A.nach1", "vid": "YYgGeJ6KL1A", "vq": "nach", "t": "ms", "q": "Welche zwei Massnahmen empfiehlt das Video für Stakeholder mit viel Macht und positiver Einstellung?", "a": ["Regelmässig über Fortschritte informieren", "Komplett ignorieren", "Grössere Veränderungen mit ihnen absprechen", "Nur einmal am Projektende kontaktieren"], "r": [0, 2], "e": "Optimale Unterstützer müssen eng gemanagt werden, mit ständigen Statusberichten und Absprachen bei grösseren Änderungen."}, {"id": "C2.vq.YYgGeJ6KL1A.nach2", "vid": "YYgGeJ6KL1A", "vq": "nach", "t": "lueck", "q": "Stakeholder mit wenig Macht, aber positiver Einstellung, sollte man laut Video vor allem ___.", "r": ["informieren"], "e": "Für diese Gruppe reicht es, sie über Newsletter und Statusberichte auf dem Laufenden zu halten."}, {"id": "C2.vq.YYgGeJ6KL1A.nach3", "vid": "YYgGeJ6KL1A", "vq": "nach", "t": "frei", "q": "Erkläre, warum eine Stakeholder-Analyse laut Video niemals wirklich fertig ist.", "m": "Stakeholder können im Laufe eines Projekts an Macht gewinnen oder verlieren, und ihre Einstellung zum Projekt kann sich von positiv zu negativ oder umgekehrt ändern. Ausserdem können anfängliche Einschätzungen einfach falsch gewesen sein. Deshalb muss die Analyse regelmässig aktualisiert werden, damit man rechtzeitig auf Veränderungen reagieren kann."}, {"id": "C2.vq.YYgGeJ6KL1A.abc", "t": "abc", "abruf": 1, "vid": "YYgGeJ6KL1A", "vq": "nach", "m": ["Brainstorming", "Einfluss", "Externe Stakeholder", "Interne Stakeholder", "Kickoff", "Kommunikationsplan", "Lenkungsausschuss", "Macht", "Newsletter", "Post-it", "Quadrant", "Wohlwollen"], "q": "ABC-Liste zu «Stakeholderanalyse im Projektmanagement»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C2.vq.YYgGeJ6KL1A.kawa", "t": "kawa", "abruf": 1, "vid": "YYgGeJ6KL1A", "vq": "nach", "wort": "MACHT", "m": ["M: Macht: eine der zwei Dimensionen zur Bewertung von Stakeholdern", "A: Auftraggeber: oft der optimale Unterstützer mit viel Macht", "C: Controlling: ein typischer interner Stakeholder neben dem Projektteam", "H: Hilfreiche Massnahme bei negativen Stakeholdern: das direkte Gespräch suchen", "T: Team: kann die Stakeholderanalyse beim Kickoff gemeinsam durchführen"], "q": "KaWa zu «MACHT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C2.vq.RnSusvUczXY.vor0", "vid": "RnSusvUczXY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Achsen nutzt das Video, um Stakeholder in einem Portfolio einzuordnen?", "a": ["Eine Achse", "Zwei Achsen", "Drei Achsen", "Vier Achsen"], "r": 1, "e": "Das Video nutzt genau zwei Achsen: Wohlwollen und Macht bzw. Einfluss."}, {"id": "C2.vq.RnSusvUczXY.vor1", "vid": "RnSusvUczXY", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt das Video die Strategie für Gegner mit viel Macht und Einfluss?", "a": ["Partizipativ", "Restriktiv", "Diskursiv", "Repressiv"], "r": 2, "e": "Für mächtige Gegner empfiehlt das Video die diskursive Strategie, also Verhandeln und Überzeugen."}, {"id": "C2.v.RnSusvUczXY", "t": "frei", "abruf": 1, "vid": "RnSusvUczXY", "vq": "nach", "q": "Video «Stakeholder richtig managen» (Projekte leicht gemacht): Was waren die Kernaussagen?", "m": "1. Die Stakeholder-Analyse ordnet jeden Stakeholder in ein Portfolio mit den Achsen Wohlwollen (Unterstuetzer bis Gegner) und Macht beziehungsweise Einfluss ein und leitet daraus vier Grundstrategien ab. 2. Fuer maechtige Unterstuetzer gilt die partizipative Strategie mit aktiver Einbindung ins Projekt, fuer maechtige Gegner die diskursive Strategie mit Verhandlung und Zuhoeren. 3. Schwache Unterstuetzer werden restriktiv, also nur informierend, behandelt, waehrend schwache Gegner repressiv behandelt werden, das heisst mit selektiver Information und wenig Aufwand."}, {"id": "C2.vq.RnSusvUczXY.nach0", "vid": "RnSusvUczXY", "vq": "nach", "t": "mc", "q": "Was passiert laut Video mit Stakeholdern in der Strategie partizipativ?", "a": ["Sie werden komplett ignoriert", "Sie werden aktiv eingebunden und können mitbestimmen", "Sie bekommen nur selektive Informationen", "Man verhandelt hart mit ihnen"], "r": 1, "e": "Partizipativ bedeutet laut Video, mächtige Unterstützer aktiv als Partner einzubinden."}, {"id": "C2.vq.RnSusvUczXY.nach1", "vid": "RnSusvUczXY", "vq": "nach", "t": "ms", "q": "Welche zwei Achsen bilden laut Video das Stakeholder-Portfolio?", "a": ["Wie wohlgesonnen der Stakeholder dem Projekt ist", "Wie viel Macht und Einfluss der Stakeholder hat", "Wie alt der Stakeholder ist", "Wie lange der Stakeholder schon im Unternehmen ist"], "r": [0, 1], "e": "Das Video nennt genau diese beiden Achsen: Wohlwollen und Macht bzw. Einfluss."}, {"id": "C2.vq.RnSusvUczXY.nach2", "vid": "RnSusvUczXY", "vq": "nach", "t": "ord", "q": "Bringe die Schritte in die Reihenfolge, wie man laut Video ein Stakeholder-Portfolio aufbaut.", "a": ["Alle Stakeholder auflisten", "Für jeden Stakeholder Wohlwollen und Macht einschätzen", "Die Stakeholder als Punkte ins Portfolio eintragen", "Für jeden der vier Bereiche eine passende Strategie festlegen"], "e": "Das Video beschreibt genau diese vier Schritte in dieser Reihenfolge zum Aufbau des Portfolios."}, {"id": "C2.vq.RnSusvUczXY.nach3", "vid": "RnSusvUczXY", "vq": "nach", "t": "frei", "q": "Wo hast du selbst schon einmal jemanden erlebt, der zwar wenig Macht hatte, aber trotzdem sehr wohlgesonnen war, so wie im restriktiven Feld des Videos beschrieben? Erkläre, wie du mit dieser Person umgegangen bist oder umgehen würdest.", "m": "Zum Beispiel eine Praktikantin, die dem Projekt sehr positiv gegenübersteht, aber kaum Entscheidungsmacht hat. Nach der restriktiven Strategie würde man sie regelmässig informieren und bei Laune halten, ohne sie stark in Entscheidungen einzubinden. So bleibt ihre positive Haltung erhalten, ohne dass man dafür viel Arbeit investieren muss."}, {"id": "C2.vq.RnSusvUczXY.abc", "t": "abc", "abruf": 1, "vid": "RnSusvUczXY", "vq": "nach", "m": ["Auftraggeber", "Betriebsrat", "Diskursiv", "Einfluss", "Gegner", "Macht", "Partizipativ", "Portfolio", "Repressiv", "Restriktiv", "Stakeholder", "Unterstützer"], "q": "ABC-Liste zu «Stakeholder richtig managen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C2.vq.RnSusvUczXY.kawa", "t": "kawa", "abruf": 1, "vid": "RnSusvUczXY", "vq": "nach", "wort": "MACHT", "m": ["M: Macht: eine der zwei Achsen im Stakeholder-Portfolio", "A: Auftraggeber: Beispiel für einen wichtigen Unterstützer mit viel Macht", "C: CEO: im Video ein Beispiel für einen mächtigen Gegner", "H: Hochrangig: ein hochrangiger Unterstützer kann das Projekt gegen Angriffe verteidigen", "T: Tipp: wer selbst wenig Macht hat, sollte sich mächtige Unterstützer suchen"], "q": "KaWa zu «MACHT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C2.vq.R6mzivjcwXA.vor0", "vid": "R6mzivjcwXA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Zählen Kunden und Lieferanten laut Video zu den Stakeholdern eines Unternehmens?", "a": ["Nein, nur Mitarbeiter zählen dazu", "Ja, sie gehören zu den externen Anspruchsgruppen", "Nur wenn sie Aktien besitzen", "Nein, das sind reine Konkurrenten"], "r": 1, "e": "Das Video zählt Kunden und Lieferanten ausdrücklich zu den unternehmensexternen Stakeholdern."}, {"id": "C2.vq.R6mzivjcwXA.vor1", "vid": "R6mzivjcwXA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Sind Aktionäre laut Video eine eigene Gruppe neben den Stakeholdern oder Teil davon?", "a": ["Sie sind eine völlig andere Gruppe ohne jeden Bezug", "Sie sind als Shareholder ein Teil der internen Stakeholder", "Sie zählen nur bei kleinen Unternehmen dazu", "Sie werden im Video gar nicht erwähnt"], "r": 1, "e": "Das Video stellt klar, dass die Shareholder ein Teil der internen Stakeholder sind."}, {"id": "C2.v.R6mzivjcwXA", "t": "frei", "abruf": 1, "vid": "R6mzivjcwXA", "vq": "nach", "q": "Video «Stakeholder, Grundbegriffe der Wirtschaft» (Wirtschaft - simpleclub): Was waren die Kernaussagen?", "m": "1. Stakeholder sind alle Interessens- oder Anspruchsgruppen, die heute oder in Zukunft von der Taetigkeit eines Unternehmens betroffen sind, und werden in unternehmensinterne (Eigentuemer, Management, Mitarbeitende) und unternehmensexterne (Fremdkapitalgeber, Kunden, Lieferanten, Konkurrenten, Staat und Gesellschaft) Gruppen unterteilt. 2. Shareholder, also Eigentuemer und Aktionaere, sind eine Teilmenge der Stakeholder und verfolgen vor allem das Ziel, das eingesetzte Kapital zu vermehren. 3. Der Stakeholderansatz ist der Gegenentwurf zum Shareholderansatz, weil er nicht nur die Interessen der Anteilseigner, sondern die Interessen aller Anspruchsgruppen bei Unternehmensentscheidungen beruecksichtigt."}, {"id": "C2.vq.R6mzivjcwXA.nach0", "vid": "R6mzivjcwXA", "vq": "nach", "t": "mc", "q": "Welche zwei Hauptgruppen von Anspruchsgruppen unterscheidet das Video?", "a": ["Unternehmensinterne und unternehmensexterne", "Nationale und internationale", "Reiche und arme", "Digitale und analoge"], "r": 0, "e": "Das Video unterscheidet zwischen unternehmensinternen (zum Beispiel Mitarbeiter, Eigentümer) und unternehmensexternen Anspruchsgruppen (zum Beispiel Kunden, Lieferanten)."}, {"id": "C2.vq.R6mzivjcwXA.nach1", "vid": "R6mzivjcwXA", "vq": "nach", "t": "mc", "q": "Woran orientieren sich Eigentümer und Management laut Video vor allem?", "a": ["Am Gewinn und am Vermehren des investierten Kapitals", "Ausschliesslich am Umweltschutz", "An der Meinung der Konkurrenz", "An der Anzahl der Mitarbeiter"], "r": 0, "e": "Eigentümer, Aktionäre und Management orientieren sich laut Video am Gewinn und wollen ihr investiertes Kapital vermehren."}, {"id": "C2.vq.R6mzivjcwXA.nach2", "vid": "R6mzivjcwXA", "vq": "nach", "t": "ms", "q": "Welche zwei Interessen nennt das Video für Staat und Gesellschaft als externe Anspruchsgruppe?", "a": ["Zahlung von Steuern", "Sicherung von Arbeitsplätzen", "Erhöhung der Aktienkurse", "Verkürzung der Lieferzeiten"], "r": [0, 1], "e": "Das Video nennt Steuerzahlungen und die Sicherung von Arbeitsplätzen als Interessen von Staat und Gesellschaft."}, {"id": "C2.vq.R6mzivjcwXA.nach3", "vid": "R6mzivjcwXA", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten den Unterschied zwischen dem Shareholder-Ansatz und dem Stakeholder-Ansatz, den das Video beschreibt.", "m": "Beim Shareholder-Ansatz richtet die Unternehmensführung ihre Entscheidungen vor allem an den Interessen der Anteilseigner aus, also am Gewinn. Beim Stakeholder-Ansatz werden dagegen die Interessen aller Gruppen berücksichtigt, also auch von Mitarbeitern, Kunden und der Gesellschaft. Das Video beschreibt den Stakeholder-Ansatz als Gegenentwurf, bei dem alle zufrieden sein sollen, nicht nur die Eigentümer."}, {"id": "C2.vq.R6mzivjcwXA.abc", "t": "abc", "abruf": 1, "vid": "R6mzivjcwXA", "vq": "nach", "m": ["Anspruchsgruppe", "Gesellschaft", "Gewinn", "Interesse", "Kapital", "Konkurrent", "Kunde", "Lieferant", "Mitarbeiter", "Shareholder", "Staat", "Stakeholder"], "q": "ABC-Liste zu «Stakeholder, Grundbegriffe der Wirtschaft»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C2.vq.R6mzivjcwXA.kawa", "t": "kawa", "abruf": 1, "vid": "R6mzivjcwXA", "vq": "nach", "wort": "KUNDE", "m": ["K: Kunden wollen ein gutes Produkt zu einem fairen Preis", "U: Unternehmensextern sind zum Beispiel Kunden und Lieferanten", "N: Nicht nur Eigentümer zählen zu den Anspruchsgruppen, auch Kunden", "D: Der Stakeholderansatz berücksichtigt auch die Interessen der Kunden", "E: Externe Anspruchsgruppen wie Kunden stehen ausserhalb des Unternehmens"], "q": "KaWa zu «KUNDE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C2.0", "t": "mc", "q": "Stakeholder-Matrix: hoher Einfluss, geringes Interesse. Was tun?", "a": ["Eng einbinden und gemeinsam entscheiden", "Zufriedenstellen: gezielt informieren, Anliegen abholen, nicht überfrachten", "Ignorieren", "Nur per Newsletter informieren"], "r": 1, "e": "Hoch/hoch = eng managen. Hoher Einfluss/wenig Interesse = zufrieden halten. Wenig Einfluss/hohes Interesse = informiert halten. Wenig/wenig = beobachten."}, {"id": "C2.1", "t": "ms", "q": "KI-Prognose in der Disposition: Welche zwei Gruppen befragst du ZUERST zu ihren Bedürfnissen?", "a": ["Die Disponenten, die täglich damit arbeiten sollen", "Den externen Anbieter", "Die Bereichsleitung Einkauf/Logistik, die das Ergebnis verantwortet", "Die Lokalpresse"], "r": [0, 2], "e": "Zuerst Nutzende und Ergebnisverantwortliche. Der Anbieter hat Interessen, aber keine Bedürfnisse, die das Projekt erfüllen muss."}, {"id": "C2.2", "t": "mc", "q": "Was ist der Unterschied zwischen Betroffenen und Beteiligten?", "a": ["Keiner", "Beteiligte wirken am Vorhaben mit, Betroffene spüren die Folgen, oft ohne mitzureden", "Betroffene sind immer extern", "Beteiligte sind immer Gegner"], "r": 1, "e": "Vergessene Betroffene (z.B. Kundinnen, Personalvertretung) werden später zu Widerstand."}, {"id": "C2.3", "t": "frei", "q": "Nenne für die Einführung eines KI-Bewerbungsfilters sechs Anspruchsgruppen und je ein Bedürfnis.", "m": "Bewerbende (faire, nachvollziehbare Behandlung). HR-Fachleute (Entlastung, aber Entscheidhoheit). Linienvorgesetzte (passende Kandidaten, schnell). Geschäftsleitung (Rechtssicherheit, Ruf). Datenschutz/Recht (Compliance, Dokumentation). IT (Integration, Betrieb). Dazu Personalkommission und Öffentlichkeit/Medien."}], "videos": [{"id": "YYgGeJ6KL1A", "kanal": "Projektmanagement Einfach Erklärt", "titel": "Stakeholderanalyse im Projektmanagement", "dauer": "7:48"}, {"id": "RnSusvUczXY", "kanal": "Projekte leicht gemacht", "titel": "Stakeholder richtig managen", "dauer": "10:14"}, {"id": "R6mzivjcwXA", "kanal": "Wirtschaft - simpleclub", "titel": "Stakeholder, Grundbegriffe der Wirtschaft", "dauer": "3:11"}], "pn": 6}, {"key": "C3", "titel": "Nutzwertanalyse (gewichtete Bewertung)", "warum": "B3 ist Pflicht: Ideen mit Kriterien und Gewichten vergleichen.", "fragen": [{"id": "C3.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Nutzwertanalyse (gewichtete Bewertung)»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: B3 ist Pflicht: Ideen mit Kriterien und Gewichten vergleichen. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C3.vq.z5vHgIIEars.vor0", "vid": "z5vHgIIEars", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Schritte hat die Nutzwertanalyse laut Video?", "a": ["Drei", "Vier", "Sechs", "Acht"], "r": 2, "e": "Das Video beschreibt die Nutzwertanalyse in sechs Schritten."}, {"id": "C3.vq.z5vHgIIEars.vor1", "vid": "z5vHgIIEars", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches Produkt gewinnt im Beispiel des Fitness-Armband-Herstellers, das innovative Ruder-Armband oder das breite Allround-Armband?", "a": ["Das innovative Ruder-Armband Rowing Extreme XCS", "Das Allround-Armband Multi Sport 100", "Beide erreichen exakt gleich viele Punkte", "Keines von beiden wird bewertet"], "r": 1, "e": "Trotz höherem Innovationsgrad verliert das Rowing Extreme XCS, weil es bei Time-to-Market, Kosten und vor allem Massentauglichkeit schlechter abschneidet."}, {"id": "C3.v.z5vHgIIEars", "t": "frei", "abruf": 1, "vid": "z5vHgIIEars", "vq": "nach", "q": "Video «Nutzwertanalyse einfach erklärt | Beispiel | Vorlage» (Projekte leicht gemacht): Was waren die Kernaussagen?", "m": "1. Die Nutzwertanalyse laeuft in sechs Schritten ab: Alternativen festlegen, Bewertungskriterien definieren, Kriterien gewichten, einen Bewertungsmassstab wie eine Skala von 1 bis 5 festlegen, die Alternativen je Kriterium bepunkten und schliesslich die gewichteten Punkte pro Alternative aufsummieren. 2. Im Beispiel der zwei Fitnessarmbaender gewinnt der Multi Sport 100 mit 3.65 gewichteten Punkten gegenueber dem Rowing Extreme XCS mit 2.25 Punkten, weil fehlende Massentauglichkeit und laengere Time-to-Market den Vorsprung beim Innovationsgrad zunichtemachen. 3. Die Kriterien duerfen sich in ihrer Wirkung nicht ueberlappen, zum Beispiel Entwicklungskosten und Entwicklungskomplexitaet, weil sonst derselbe Aspekt doppelt gezaehlt und das Ergebnis verfaelscht wird."}, {"id": "C3.vq.z5vHgIIEars.nach0", "vid": "z5vHgIIEars", "vq": "nach", "t": "mc", "q": "Was ist der erste Schritt der Nutzwertanalyse laut Video?", "a": ["Die Bewertung der Alternativen", "Die Festlegung der Alternativen", "Die Gewichtung der Kriterien", "Die Auswertung der Ergebnisse"], "r": 1, "e": "Der erste Schritt ist, alle sinnvollen Alternativen zu sammeln und aufzuschreiben."}, {"id": "C3.vq.z5vHgIIEars.nach1", "vid": "z5vHgIIEars", "vq": "nach", "t": "mc", "q": "Warum warnt das Video davor, Kriterien wie 'Entwicklungskosten' und 'Komplexität der Entwicklung' beide gleichzeitig zu verwenden?", "a": ["Weil das zu wenig Kriterien ergibt", "Weil beide im Endeffekt dasselbe meinen und damit doppelt zählen", "Weil Komplexität nicht messbar ist", "Weil Entwicklungskosten nie wichtig sind"], "r": 1, "e": "Überlappende Kriterien verfälschen das Ergebnis, weil derselbe Aspekt doppelt in die Bewertung einfliesst."}, {"id": "C3.vq.z5vHgIIEars.nach2", "vid": "z5vHgIIEars", "vq": "nach", "t": "ord", "q": "Bringe die Schritte der Nutzwertanalyse in die richtige Reihenfolge.", "a": ["Alternativen festlegen", "Bewertungskriterien definieren", "Kriterien gewichten", "Bewertungsmassstab festlegen", "Alternativen bewerten", "Auswertung und Auswahl"], "e": "Das Video erklärt die Nutzwertanalyse genau in dieser Reihenfolge aus sechs Schritten."}, {"id": "C3.vq.z5vHgIIEars.nach3", "vid": "z5vHgIIEars", "vq": "nach", "t": "frei", "q": "Erkläre an einem eigenen Beispiel, wie eine Nutzwertanalyse dir bei einer Entscheidung helfen könnte, bei der eine einfache Pro-Contra-Liste nicht ausreicht.", "m": "Bei einer wichtigen Entscheidung mit mehreren Kriterien unterschiedlicher Wichtigkeit, zum Beispiel der Wahl eines Studienorts, reicht eine Pro-Contra-Liste nicht, weil sie nicht zeigt, wie wichtig die einzelnen Punkte sind. Mit einer Nutzwertanalyse könnte ich Kriterien wie Miete, Studienqualität und Entfernung zur Familie unterschiedlich gewichten und pro Ort bewerten, sodass am Ende eine begründete Rangfolge entsteht."}, {"id": "C3.vq.z5vHgIIEars.abc", "t": "abc", "abruf": 1, "vid": "z5vHgIIEars", "vq": "nach", "m": ["Alternative", "Bewertungsmassstab", "Excel-Vorlage", "Gewichtung", "Herstellkosten", "Innovationsgrad", "Kriterium", "Massentauglichkeit", "Punktwert", "Skala", "Time-to-Market", "Vorlage"], "q": "ABC-Liste zu «Nutzwertanalyse einfach erklärt | Beispiel | Vorlage»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C3.vq.z5vHgIIEars.kawa", "t": "kawa", "abruf": 1, "vid": "z5vHgIIEars", "vq": "nach", "wort": "SKALA", "m": ["S: Skala von 1 bis 5 reicht für die Bewertung völlig aus.", "K: Kriterien sollten sich nicht in ihrer Aussage überlappen.", "A: Alternativen ohne Sinn sollte man von Anfang an weglassen.", "L: Lösung wird durch die höchste gewichtete Punktsumme bestimmt."], "q": "KaWa zu «SKALA»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C3.vq.rSL_5YOEsvE.vor0", "vid": "rSL_5YOEsvE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele verschiedene Bewertungskriterien nutzt Frau F im Beispiel des Videos, um ihre drei Kandidaten zu vergleichen?", "a": ["drei", "fünf", "acht", "zwölf"], "r": 2, "e": "Das Video zählt acht Kriterien auf: Alter, Aussehen, Charakter, Humor, Familienstand, Vermögen, Heiratswilligkeit und Kinderwunsch."}, {"id": "C3.vq.rSL_5YOEsvE.vor1", "vid": "rSL_5YOEsvE", "vq": "vor", "t": "mc", "q": "Was glaubst du: Auf wie viel Prozent müssen sich bei einer Nutzwertanalyse alle Gewichtungen der Kriterien zusammen addieren?", "a": ["auf 50 Prozent", "auf 100 Prozent", "auf 10 Prozent", "es gibt keine feste Grenze"], "r": 1, "e": "Das Video sagt ausdrücklich, dass die Summe aller Kriteriengewichte immer 100 Prozent ergeben muss."}, {"id": "C3.v.rSL_5YOEsvE", "t": "frei", "abruf": 1, "vid": "rSL_5YOEsvE", "vq": "nach", "q": "Video «Nutzwertanalyse einfach erklärt» (EasyFilmsTM): Was waren die Kernaussagen?", "m": "1. Zur Gewichtung der Bewertungskriterien wird eine Praeferenzmatrix erstellt, in der jedes Kriterium paarweise mit jedem anderen verglichen wird, was bei acht Kriterien 28 Einzelvergleiche ergibt. 2. Die Summe aller Gewichtungen in der Praeferenzmatrix muss auf 100 Prozent kommen, danach werden pro Kriterium und Option Punkte von 1 (schlechte Voraussetzung) bis 10 (ideale Voraussetzung) vergeben. 3. Der Nutzwert jeder Option ergibt sich, indem die Punktzahl je Kriterium mit dessen Gewichtung multipliziert und die Ergebnisse pro Option aufsummiert werden, sodass am Ende die Option mit der hoechsten Gesamtpunktzahl gewinnt."}, {"id": "C3.vq.rSL_5YOEsvE.nach0", "vid": "rSL_5YOEsvE", "vq": "nach", "t": "mc", "q": "Wie berechnet man laut Video die gewichtete Punktzahl für ein Kriterium?", "a": ["man addiert Punktzahl und Prozentzahl", "man multipliziert die Punktzahl mit der Prozentzahl des Kriteriums", "man zieht die Prozentzahl von der Punktzahl ab", "man teilt die Prozentzahl durch die Punktzahl"], "r": 1, "e": "Das Video erklärt, dass man die vergebene Punktzahl pro Kriterium mit dessen Gewichtung in Prozent multipliziert, um die gewichtete Bewertung zu erhalten."}, {"id": "C3.vq.rSL_5YOEsvE.nach1", "vid": "rSL_5YOEsvE", "vq": "nach", "t": "ms", "q": "Welche zwei Schritte gehören laut Video zum Ablauf einer Nutzwertanalyse?", "a": ["alle relevanten Kriterien auflisten", "die Kriterien nach Wichtigkeit gewichten", "die Konkurrenz komplett ignorieren", "nur ein einziges Kriterium verwenden"], "r": [0, 1], "e": "Das Video beschreibt als erste Schritte das Auflisten der Kriterien und danach deren Gewichtung entsprechend ihrer Wichtigkeit."}, {"id": "C3.vq.rSL_5YOEsvE.nach2", "vid": "rSL_5YOEsvE", "vq": "nach", "t": "lueck", "q": "Für jedes Kriterium vergibt man pro Option eine Punktzahl von 1 bis ___, wobei die höchste Zahl die ideale Voraussetzung bedeutet.", "r": ["10", "zehn"], "e": "Das Video legt eine Skala von 1 (schlechte Voraussetzung) bis 10 (ideale Voraussetzung) fest, mit der jede Option pro Kriterium bewertet wird."}, {"id": "C3.vq.rSL_5YOEsvE.nach3", "vid": "rSL_5YOEsvE", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen, wie du eine Nutzwertanalyse nutzen würdest, um zwischen zwei sehr unterschiedlichen Jobangeboten zu entscheiden.", "m": "Ich würde zuerst Kriterien festlegen, die mir wichtig sind, zum Beispiel Gehalt, Arbeitsweg, Team und Entwicklungsmöglichkeiten. Dann würde ich jedes Kriterium gewichten, je nachdem wie wichtig es mir persönlich ist, sodass die Gewichte zusammen 100 Prozent ergeben. Am Ende bewerte ich beide Jobs pro Kriterium mit Punkten, multipliziere mit der Gewichtung und sehe rechnerisch, welches Angebot insgesamt besser abschneidet."}, {"id": "C3.vq.rSL_5YOEsvE.abc", "t": "abc", "abruf": 1, "vid": "rSL_5YOEsvE", "vq": "nach", "m": ["Alter", "Bauchgefühl", "Charakter", "Entscheidung", "Familienstand", "Gewichtung", "Kriterium", "Nutzwertanalyse", "Option", "Präferenzmatrix", "Punktzahl", "Vermögen"], "q": "ABC-Liste zu «Nutzwertanalyse einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C3.vq.rSL_5YOEsvE.kawa", "t": "kawa", "abruf": 1, "vid": "rSL_5YOEsvE", "vq": "nach", "wort": "NUTZEN", "m": ["N: Nutzwertanalyse: vergleicht Optionen anhand gewichteter Kriterien", "U: Unvergleichbares vergleichbar machen: das Verfahren hilft bei Apfel-Birnen-Vergleichen", "T: Tabelle (Präferenzmatrix): zeigt alle Kriterien und ihre Gewichtung", "Z: Zehn Punkte: höchste Bewertung für eine ideale Voraussetzung", "E: Entscheidung: am Ende steht eine rechnerisch begründete Wahl"], "q": "KaWa zu «NUTZEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C3.vq.VwfePU95czg.vor0", "vid": "VwfePU95czg", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was muss am Ende herauskommen, wenn man alle berechneten Gewichtungsfaktoren zusammenzählt?", "a": ["Null", "Hundert", "Eins", "Es ist beliebig"], "r": 2, "e": "Das Video sagt, dass man kontrollieren kann, ob man richtig gerechnet hat, weil die Summe aller Faktoren am Ende Eins ergeben muss."}, {"id": "C3.vq.VwfePU95czg.vor1", "vid": "VwfePU95czg", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche drei Zahlen vergibt man beim paarweisen Vergleich zweier Kriterien in der Matrix?", "a": ["0, 1 und 2", "1, 2 und 3", "Minus 1, 0 und plus 1", "Nur 0 oder 1"], "r": 0, "e": "Im Video wird für wichtiger eine 2, für gleich wichtig eine 1 und für unwichtiger eine 0 vergeben."}, {"id": "C3.v.VwfePU95czg", "t": "frei", "abruf": 1, "vid": "VwfePU95czg", "vq": "nach", "q": "Video «Gewichtungsfaktoren berechnen (Nutzwertanalyse)» (Alles Andy): Was waren die Kernaussagen?", "m": "1. Zur objektiven Ermittlung von Gewichtungsfaktoren wird eine Kriteriumsmatrix gebildet, in der fuer jedes Kriterienpaar im oberen Bereich eingetragen wird, ob es wichtiger (2), gleich wichtig (1) oder unwichtiger (0) ist als das Vergleichskriterium. 2. Der untere, gespiegelte Bereich der Matrix wird automatisch mit dem jeweiligen Gegenteil befuellt, sodass aus einer 2 oben eine 0 unten wird und aus einer 1 oben wieder eine 1 unten. 3. Der Gewichtungsfaktor eines Kriteriums ergibt sich, indem die Zeilensumme des Kriteriums durch die Gesamtsumme aller Zeilensummen geteilt wird, wobei die Summe aller Gewichtungsfaktoren am Ende exakt 1 ergeben muss."}, {"id": "C3.vq.VwfePU95czg.nach0", "vid": "VwfePU95czg", "vq": "nach", "t": "mc", "q": "Was macht man laut Video mit den Feldern der Matrix, in denen ein Kriterium mit sich selbst verglichen würde?", "a": ["Man trägt dort automatisch eine 2 ein", "Man streicht oder graut diese Felder aus", "Man trägt dort eine 1 ein", "Man lässt die ganze Zeile leer"], "r": 1, "e": "Das Video zeigt, dass die Diagonale, wo ein Kriterium mit sich selbst verglichen würde, ausgekreuzt oder leer gelassen wird."}, {"id": "C3.vq.VwfePU95czg.nach1", "vid": "VwfePU95czg", "vq": "nach", "t": "ms", "q": "Welche zwei Schritte gehören laut Video zur Berechnung des Gewichtungsfaktors, nachdem die Matrix ausgefüllt ist?", "a": ["Die Zeile zusammenzählen", "Die Kriterien alphabetisch sortieren", "Die Zeilensumme durch die Gesamtsumme teilen", "Die Matrix drucken und laminieren"], "r": [0, 2], "e": "Nach dem Ausfüllen wird zuerst jede Zeile summiert und dann die Zeilensumme durch die Gesamtsumme aller Zeilen geteilt."}, {"id": "C3.vq.VwfePU95czg.nach2", "vid": "VwfePU95czg", "vq": "nach", "t": "lueck", "q": "Im oberen Teil der Matrix trägt man immer das ___ von dem ein, was im unteren Teil steht.", "r": ["gegenteil"], "e": "Das Video erklärt, dass man die obere Hälfte spiegelverkehrt zur unteren Hälfte ausfüllt, also jeweils das Gegenteil einträgt."}, {"id": "C3.vq.VwfePU95czg.nach3", "vid": "VwfePU95czg", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum die im Video gezeigte Matrixmethode objektiver sein soll als einfach aus dem Bauch heraus Prozentzahlen zu verteilen.", "m": "Beim Bauchgefühl verteilt man Gewichte oft spontan und ohne System, wodurch persönliche Vorlieben stark durchschlagen können. Bei der Matrixmethode vergleicht man dagegen jedes Kriterium einzeln und systematisch mit jedem anderen Kriterium und rechnet die Gewichtungsfaktoren erst am Ende aus den Vergleichen aus. Dadurch beruht das Ergebnis auf vielen kleinen, klaren Einzelentscheidungen statt auf einer einzigen groben Schätzung."}, {"id": "C3.vq.VwfePU95czg.abc", "t": "abc", "abruf": 1, "vid": "VwfePU95czg", "vq": "nach", "m": ["Bezugspreis", "Gewichtungsfaktor", "Kriterium", "Lieferzeit", "Matrix", "Nutzwertanalyse", "Objektivität", "Punktzahl", "Qualität", "Summe", "Vergleich", "Ökologischer Aspekt"], "q": "ABC-Liste zu «Gewichtungsfaktoren berechnen (Nutzwertanalyse)»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C3.vq.VwfePU95czg.kawa", "t": "kawa", "abruf": 1, "vid": "VwfePU95czg", "vq": "nach", "wort": "FAKTOR", "m": ["F: Faktor entsteht, wenn man die Zeilensumme durch die Gesamtsumme teilt", "A: Ausgekreuzt werden die Felder, in denen ein Kriterium sich selbst vergleicht", "K: Kriterium für Kriterium in einer Matrix gegenüberstellen", "T: Teilen der Summe ist der letzte Rechenschritt der Methode", "O: Objektiver als der reine Bauchentscheid soll das Verfahren sein", "R: Reihe mal Reihe die Frage stellen, was wichtiger ist"], "q": "KaWa zu «FAKTOR»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C3.0", "t": "num", "q": "Nutzwertanalyse: Nutzen 50 %, Machbarkeit 30 %, Risiko 20 %. Idee X bekommt 8, 6 und 5 Punkte. Gesamtwert?", "r": 6.8, "tol": 0.01, "u": "Punkte", "e": "0,5×8 + 0,3×6 + 0,2×5 = 4,0 + 1,8 + 1,0 = 6,8."}, {"id": "C3.1", "t": "ord", "q": "Schritte einer Nutzwertanalyse in der richtigen Reihenfolge.", "a": ["Kriterien festlegen", "Kriterien gewichten (Summe 100 %)", "Alternativen je Kriterium bepunkten", "Punkte mit Gewichten multiplizieren und addieren", "Ergebnis prüfen: Sensitivität, K.-o.-Kriterien, Plausibilität"], "e": "Wichtig: Gewichte VOR der Bewertung festlegen, sonst rechnet man sich das Wunschergebnis zurecht."}, {"id": "C3.2", "t": "ms", "q": "Welche Kriterien nennt das Qualifikationsprofil für die Priorisierung von Einsatzmöglichkeiten (B3)? Wähle drei.", "a": ["Realisierbarkeit", "Datenverfügbarkeit und -qualität", "Wirtschaftlichkeit", "Farbe des Logos", "Anzahl Folien"], "r": [0, 1, 2], "e": "Dazu Auswirkungen und strategische Passung. Unter Beizug von Fachpersonen bewerten."}, {"id": "C3.3", "t": "frei", "q": "Eine Expertin fragt: «Wie hätte eine andere Gewichtung Ihr Ergebnis verändert?» Wie antwortest du gut?", "m": "Mit einer Sensitivitätsaussage: Ich habe die Gewichte variiert (z.B. Nutzen 40 statt 50 %). Idee A bleibt vorn, solange Machbarkeit mindestens X % zählt, erst bei Y kippt es zu B. Dann begründen, warum meine Gewichtung zur Strategie der Firma passt, und offenlegen, wer die Gewichte festgelegt hat. Das zeigt Reflexionsfähigkeit."}], "videos": [{"id": "z5vHgIIEars", "kanal": "Projekte leicht gemacht", "titel": "Nutzwertanalyse einfach erklärt | Beispiel | Vorlage", "dauer": "10:27"}, {"id": "rSL_5YOEsvE", "kanal": "EasyFilmsTM", "titel": "Nutzwertanalyse einfach erklärt", "dauer": "2:40"}, {"id": "VwfePU95czg", "kanal": "Alles Andy", "titel": "Gewichtungsfaktoren berechnen (Nutzwertanalyse)", "dauer": "4:37"}], "pn": 1}, {"key": "C4", "titel": "Payback und Wirtschaftlichkeit", "warum": "C5 ist Pflicht: Kosten, Nutzen, Amortisation, Szenarien.", "fragen": [{"id": "C4.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Payback und Wirtschaftlichkeit»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: C5 ist Pflicht: Kosten, Nutzen, Amortisation, Szenarien. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C4.vq.saXirtILGkk.vor0", "vid": "saXirtILGkk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie berechnet man die Amortisationsdauer einer Investition laut Video?", "a": ["Erträge mal Investitionskosten", "Investitionskosten geteilt durch die jährlichen Erträge", "Investitionskosten minus Erträge", "Es gibt dafür keine feste Formel"], "r": 1, "e": "Die Amortisationsdauer ergibt sich laut Video, indem man die Investitionskosten durch die jährlichen Erträge teilt."}, {"id": "C4.vq.saXirtILGkk.vor1", "vid": "saXirtILGkk", "vq": "vor", "t": "mc", "q": "Was glaubst du: Nach wie vielen Jahren hat sich im Beispiel des Videos eine Sanierung für 40000 Euro mit 5500 Euro Mieteinnahmen pro Jahr amortisiert?", "a": ["Etwa 2 Jahre", "Etwa 4 Jahre", "Etwa 7 Jahre", "Etwa 15 Jahre"], "r": 2, "e": "Das Video rechnet 40000 geteilt durch 5500 und kommt auf rund 7,27 Jahre."}, {"id": "C4.v.saXirtILGkk", "t": "frei", "abruf": 1, "vid": "saXirtILGkk", "vq": "nach", "q": "Video «Amortisation: Wann lohnen sich Investitionen?» (Wirtschaft - simpleclub): Was waren die Kernaussagen?", "m": "1. Eine Investition hat sich amortisiert, sobald die Ertraege die Investitionskosten uebersteigen, und die Amortisationsdauer ist die Zeit bis zu diesem Zeitpunkt. 2. Die Amortisationsdauer wird berechnet, indem der Investitionsbetrag durch die jaehrlichen Ertraege geteilt wird, im Beispiel 40000 Euro geteilt durch 5500 Euro ergibt 7.27 Jahre. 3. Beim Vergleich zweier Sanierungsvarianten mit 40000 versus 80000 Euro Investition entscheidet man sich nach der Amortisationsrechnung fuer die Variante mit der kuerzeren Amortisationsdauer, hier fuer die 40000-Euro-Variante mit 7.27 statt 8.89 Jahren (80000 geteilt durch 9000 ergibt 8.889)."}, {"id": "C4.vq.saXirtILGkk.nach0", "vid": "saXirtILGkk", "vq": "nach", "t": "mc", "q": "Wann gilt eine Investition laut Video als amortisiert?", "a": ["Wenn die Kosten die Erträge übersteigen", "Wenn die Erträge die Investitionskosten übertreffen", "Wenn ein Jahr vergangen ist", "Wenn ein Kredit abbezahlt ist"], "r": 1, "e": "Eine Investition ist laut Video amortisiert, sobald die Erträge die Investitionskosten übertreffen."}, {"id": "C4.vq.saXirtILGkk.nach1", "vid": "saXirtILGkk", "vq": "nach", "t": "lueck", "q": "Die Zeit, bis die Erträge die Anschaffungskosten übertreffen, nennt man die ___.", "r": ["amortisationsdauer"], "e": "Diese Kennzahl heisst laut Video Amortisationsdauer."}, {"id": "C4.vq.saXirtILGkk.nach2", "vid": "saXirtILGkk", "vq": "nach", "t": "ord", "q": "Bringe die Schritte zur Berechnung der Amortisationsdauer im Beispiel des Videos in die richtige Reihenfolge.", "a": ["Investitionskosten der Sanierung ermitteln, zum Beispiel 40000 Euro", "Jährliche Mieteinnahmen ermitteln, zum Beispiel 5500 Euro", "Investitionskosten durch jährliche Erträge teilen", "Ergebnis als Amortisationsdauer in Jahren interpretieren"], "e": "Genau in dieser Reihenfolge rechnet das Video sein Beispiel durch."}, {"id": "C4.vq.saXirtILGkk.nach3", "vid": "saXirtILGkk", "vq": "nach", "t": "frei", "q": "Erkläre anhand der zwei Sanierungsalternativen aus dem Video, warum die günstigere Variante mit den kleineren Mieteinnahmen trotzdem die bessere Amortisationsdauer haben kann.", "m": "Bei 40000 Euro Kosten und 5500 Euro Mieteinnahmen ergibt sich eine Amortisationsdauer von 7,27 Jahren. Bei 80000 Euro Kosten und 9000 Euro Mieteinnahmen sind es 8,89 Jahre (80000 geteilt durch 9000). Obwohl die teurere Variante mehr Miete bringt, dauert es dort länger, bis sich das eingesetzte Geld wieder rechnet."}, {"id": "C4.vq.saXirtILGkk.abc", "t": "abc", "abruf": 1, "vid": "saXirtILGkk", "vq": "nach", "m": ["Alternative", "Amortisation", "Amortisationsdauer", "Ertraege", "Investition", "Investitionskosten", "Mieteinnahmen", "Renovierung", "Sanierung", "Wohnung"], "q": "ABC-Liste zu «Amortisation: Wann lohnen sich Investitionen?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C4.vq.saXirtILGkk.kawa", "t": "kawa", "abruf": 1, "vid": "saXirtILGkk", "vq": "nach", "wort": "DAUER", "m": ["D: Dauer: die Amortisationsdauer zeigt, wie lange man auf sein Geld wartet", "A: Alternative: das Video vergleicht zwei Investitionsalternativen", "U: Und wenn die Erträge die Investitionskosten übertreffen, gilt die Investition als amortisiert", "E: Erträge: die jährlichen Einnahmen aus der Investition, zum Beispiel Miete", "R: Rechnung: Investitionskosten geteilt durch jährliche Erträge ergibt die Amortisationsdauer"], "q": "KaWa zu «DAUER»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C4.vq.AgCnoMBOMU4.vor0", "vid": "AgCnoMBOMU4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man die Amortisationsrechnung im Englischen laut Video auch?", "a": ["Investment Return", "Payback-Methode", "Cash Only Method", "Profit Split"], "r": 1, "e": "Das Video nennt auch die englischen Bezeichnungen Payoff-, Payback- und Payout-Methode."}, {"id": "C4.vq.AgCnoMBOMU4.vor1", "vid": "AgCnoMBOMU4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welchen wichtigen Faktor berücksichtigt die Amortisationsrechnung laut Video nicht?", "a": ["Den Kapitaleinsatz", "Den Zeitwert des Geldes", "Die Rückflüsse", "Die Investitionshöhe"], "r": 1, "e": "Als Nachteil nennt das Video, dass der Zeitwert des Geldes nicht berücksichtigt wird."}, {"id": "C4.v.AgCnoMBOMU4", "t": "frei", "abruf": 1, "vid": "AgCnoMBOMU4", "vq": "nach", "q": "Video «Amortisationsrechnung | dynamisch & statisch» (sevdesk): Was waren die Kernaussagen?", "m": "1. Die Amortisationsrechnung ist ein statisches Investitionsrechnungsverfahren, das den Zeitpunkt ermittelt, an dem das eingesetzte Kapital durch Rueckfluesse vollstaendig ins Unternehmen zurueckgeflossen ist, und wird auch Kapitalrueckflussrechnung oder Payback-Methode genannt. 2. Bei der Durchschnittsmethode wird die Amortisationsdauer berechnet, indem der anfaengliche Kapitaleinsatz durch den durchschnittlichen Rueckfluss pro Periode (Periodengewinn plus durchschnittliche Abschreibung) geteilt wird. 3. Bei der Kumulationsmethode werden die jaehrlichen Rueckfluesse Periode fuer Periode aufaddiert, bis die kumulierten Rueckfluesse den Kapitaleinsatz uebersteigen, was bei unterschiedlich hohen jaehrlichen Rueckfluessen genauere Ergebnisse liefert als die Durchschnittsmethode."}, {"id": "C4.vq.AgCnoMBOMU4.nach0", "vid": "AgCnoMBOMU4", "vq": "nach", "t": "mc", "q": "Wie berechnet man die Amortisationsdauer nach der Durchschnittsmethode laut Video?", "a": ["Kapitaleinsatz geteilt durch Rückfluss pro Periode", "Umsatz mal Gewinn", "Rückfluss minus Kapitaleinsatz", "Kapitaleinsatz mal Zinssatz"], "r": 0, "e": "Die Formel lautet Amortisationsdauer in Jahren gleich anfänglicher Kapitaleinsatz geteilt durch Rückfluss pro Periode."}, {"id": "C4.vq.AgCnoMBOMU4.nach1", "vid": "AgCnoMBOMU4", "vq": "nach", "t": "ms", "q": "Welche zwei Verfahren zur Berechnung der Amortisationsdauer nennt das Video?", "a": ["Durchschnittsmethode", "Kumulationsmethode", "Stakeholderanalyse", "Fünf-Kräfte-Modell"], "r": [0, 1], "e": "Das Video unterscheidet die Durchschnittsmethode und die Kumulationsmethode."}, {"id": "C4.vq.AgCnoMBOMU4.nach2", "vid": "AgCnoMBOMU4", "vq": "nach", "t": "lueck", "q": "Bei der Kumulationsmethode werden die Rückflüsse Periode für Periode ___, bis sie den Kapitaleinsatz übersteigen.", "r": ["addiert"], "e": "Genau das ist der Kern der Kumulationsmethode, im Gegensatz zur Durchschnittsmethode mit einem festen Durchschnittswert."}, {"id": "C4.vq.AgCnoMBOMU4.nach3", "vid": "AgCnoMBOMU4", "vq": "nach", "t": "frei", "q": "Erkläre, warum die Amortisationsrechnung bei einer Investition in Maschinen laut Video wichtig ist.", "m": "Eine Investition in Maschinen lohnt sich vor allem dann, wenn die Amortisationsdauer kürzer ist als die tatsächliche Lebensdauer der Maschine. Die Amortisationsrechnung hilft dabei, dieses Risiko im Vorfeld abzuschätzen, auch wenn Abweichungen wie Zinsentwicklungen oder Gewinneinbrüche das Ergebnis noch verändern können. So kann ein Unternehmen besser einschätzen, wie sicher und liquide die Investition ist."}, {"id": "C4.vq.AgCnoMBOMU4.abc", "t": "abc", "abruf": 1, "vid": "AgCnoMBOMU4", "vq": "nach", "m": ["Abschreibung", "Cashflow", "Durchschnittsmethode", "Investitionsrechnung", "Kapitaleinsatz", "Kumulationsmethode", "Leasing", "Payback", "Rentabilität", "Restwert", "Teilamortisation", "Zinssatz"], "q": "ABC-Liste zu «Amortisationsrechnung | dynamisch & statisch»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C4.vq.AgCnoMBOMU4.kawa", "t": "kawa", "abruf": 1, "vid": "AgCnoMBOMU4", "vq": "nach", "wort": "LEASING", "m": ["L: Leasing: hier spielt Amortisation eine besonders grosse Rolle", "E: Eingesetztes Kapital: die Basis für jede Amortisationsrechnung", "A: Abschreibung: fliesst mit in den Investitions-Cashflow ein", "S: Statisches Verfahren: die klassische Amortisationsrechnung beruht darauf", "I: Investitionsrechnung: die Amortisationsrechnung ist ein Teil davon", "N: Nachteil: der Zeitwert des Geldes wird nicht berücksichtigt", "G: Gewinn pro Periode: Grundlage für den Rückfluss"], "q": "KaWa zu «LEASING»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C4.vq.bfTczf12NBc.vor0", "vid": "bfTczf12NBc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was braucht man zuerst, bevor man eine Gewinnvergleichsrechnung machen kann?", "a": ["Eine fertige Rentabilitätsrechnung", "Eine Kostenvergleichsrechnung", "Eine Amortisationsrechnung", "Gar nichts, der Gewinn steht immer schon fest"], "r": 1, "e": "Das Video sagt, man braucht zuerst die Kosten aus der Kostenvergleichsrechnung, um den Gewinn zu berechnen."}, {"id": "C4.vq.bfTczf12NBc.vor1", "vid": "bfTczf12NBc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was bedeutet statisch bei der statischen Investitionsrechnung laut Video?", "a": ["Man rechnet mit durchschnittlichen Kosten und Erlösen, nicht hundertprozentig genau", "Die Maschine darf sich während der Rechnung nicht bewegen", "Man rechnet nur mit Zahlen aus der Vergangenheit", "Es wird nur eine einzige Zahl für die ganze Firma berechnet"], "r": 0, "e": "Das Video erklärt statisch genau so: man rechnet mit Durchschnittswerten statt exakter Genauigkeit."}, {"id": "C4.v.bfTczf12NBc", "t": "frei", "abruf": 1, "vid": "bfTczf12NBc", "vq": "nach", "q": "Video «Kosten-, Gewinn-, Rentabilitäts- und Amortisationsvergleich» (EconomicsTeacher): Was waren die Kernaussagen?", "m": "1. Bei der Kostenvergleichsrechnung werden fixe Kosten wie kalkulatorische Abschreibungen (Anschaffungskosten minus Restwert, geteilt durch Nutzungsdauer) und kalkulatorische Zinsen (durchschnittlich gebundenes Kapital mal Zinssatz) den variablen Kosten wie Material und Fertigungsloehnen gegenuebergestellt. 2. Die Gewinnvergleichsrechnung zieht von den Erloesen (Preis mal Menge) die zuvor ermittelten Gesamtkosten ab, sodass im Beispiel Maschine B trotz hoeherer Kosten wegen hoeherer Erloese den groesseren Gewinn erzielt. 3. Bei der Amortisationsvergleichsrechnung liefert die Kumulationsmethode ein anderes Ergebnis als die Durchschnittsmethode, wenn die jaehrlichen Rueckfluesse ungleich verteilt sind, weil dabei erkennbar wird, welcher Standort sein Kapital tatsaechlich frueher zurueckerhaelt."}, {"id": "C4.vq.bfTczf12NBc.nach0", "vid": "bfTczf12NBc", "vq": "nach", "t": "mc", "q": "Wie berechnet man laut Video die kalkulatorischen Abschreibungen einer Maschine?", "a": ["Anschaffungskosten geteilt durch den Kalkulationszinssatz", "Anschaffungskosten minus Restwert, geteilt durch die Nutzungsdauer", "Nur die Anschaffungskosten ohne weitere Rechnung", "Restwert mal Nutzungsdauer"], "r": 1, "e": "Das Video nennt genau diese Formel für die kalkulatorischen Abschreibungen."}, {"id": "C4.vq.bfTczf12NBc.nach1", "vid": "bfTczf12NBc", "vq": "nach", "t": "ms", "q": "Welche zwei Kostenarten gehören laut Video zu den fixen Kosten einer Maschine?", "a": ["Kalkulatorische Abschreibungen", "Gehälter", "Materialkosten", "Fertigungslöhne"], "r": [0, 1], "e": "Abschreibungen und Gehälter zählt das Video zu den fixen Kosten, Material und Fertigungslöhne dagegen zu den variablen."}, {"id": "C4.vq.bfTczf12NBc.nach2", "vid": "bfTczf12NBc", "vq": "nach", "t": "lueck", "q": "Der Gewinn ergibt sich laut Video aus Erlöse minus ___.", "r": ["kosten"], "e": "Das Video definiert den Gewinn ausdrücklich als Erlöse minus Kosten."}, {"id": "C4.vq.bfTczf12NBc.nach3", "vid": "bfTczf12NBc", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, warum eine Maschine mit höheren Anschaffungskosten trotzdem am Ende die günstigere Wahl sein kann, so wie im Video bei Maschine B gezeigt.", "m": "Auch wenn die Anschaffung teurer ist, kann eine Maschine über die Jahre niedrigere laufende Kosten oder höhere Erlöse pro Stück haben. Werden alle Kosten und Erlöse über die Nutzungsdauer zusammengerechnet, kann die anfangs teurere Maschine insgesamt günstiger und gewinnbringender sein. Deshalb reicht ein Blick auf die Anschaffungskosten allein nicht aus."}, {"id": "C4.vq.bfTczf12NBc.abc", "t": "abc", "abruf": 1, "vid": "bfTczf12NBc", "vq": "nach", "m": ["Abschreibung", "Amortisationsvergleichsrechnung", "Erlöse", "Fixkosten", "Gewinnvergleichsrechnung", "Kalkulationszinssatz", "Kostenvergleichsrechnung", "Kumulationsrechnung", "Nutzungsdauer", "Rentabilitätsvergleichsrechnung", "Restwert", "Variable Kosten"], "q": "ABC-Liste zu «Kosten-, Gewinn-, Rentabilitäts- und Amortisationsvergleich»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C4.vq.bfTczf12NBc.kawa", "t": "kawa", "abruf": 1, "vid": "bfTczf12NBc", "vq": "nach", "wort": "ZINSEN", "m": ["Z: Zinssatz: 8 Prozent im Beispiel für die kalkulatorischen Zinsen", "I: Investitionsrechnung: der Oberbegriff für alle vier Verfahren im Video", "N: Nutzungsdauer: 6 Jahre im Beispiel, teilt die Abschreibung", "S: Standort: im Amortisationsbeispiel wird Standort a mit Standort b verglichen", "E: Erlöse: fliessen in die Gewinnvergleichsrechnung ein"], "q": "KaWa zu «ZINSEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C4.0", "t": "num", "q": "Einmalige Kosten 90'000, Betrieb 15'000 pro Jahr, Nutzen 60'000 pro Jahr. Payback in Jahren?", "r": 2, "tol": 0, "u": "Jahre", "e": "Nettonutzen pro Jahr = 60'000 − 15'000 = 45'000. 90'000 ÷ 45'000 = 2 Jahre. Laufende Kosten nicht vergessen."}, {"id": "C4.1", "t": "num", "q": "Gleiches Projekt, Worst Case: Nutzen nur 35'000 pro Jahr. Kumuliertes Ergebnis nach 3 Jahren (in Franken, Minus mit Vorzeichen)?", "r": -30000, "tol": 0, "u": "CHF", "e": "(35'000 − 15'000) × 3 = 60'000. 60'000 − 90'000 = −30'000. Szenarien zeigen, wie robust der Entscheid ist (C5)."}, {"id": "C4.2", "t": "mc", "q": "Was ist die Schwäche der statischen Payback-Rechnung?", "a": ["Sie ist zu kompliziert", "Sie ignoriert, was nach der Amortisation passiert, und den Zeitwert des Geldes", "Sie braucht zu viele Daten", "Sie ist verboten"], "r": 1, "e": "Darum ergänzend Kapitalwert oder mindestens eine Mehrjahressicht mit Szenarien."}, {"id": "C4.3", "t": "ms", "q": "Welche zwei sind INDIREKTER Nutzen?", "a": ["Eingesparte Arbeitsstunden", "Höhere Mitarbeiterzufriedenheit", "Weniger Nacharbeitskosten", "Besserer Ruf als Arbeitgeber"], "r": [1, 3], "e": "Direkter Nutzen lässt sich in Franken rechnen. Indirekten Nutzen nennen und wenn möglich über Hilfsgrössen (Fluktuation, Kundenzufriedenheit) greifbar machen."}], "videos": [{"id": "saXirtILGkk", "kanal": "Wirtschaft - simpleclub", "titel": "Amortisation: Wann lohnen sich Investitionen?", "dauer": "1:48"}, {"id": "AgCnoMBOMU4", "kanal": "sevdesk", "titel": "Amortisationsrechnung | dynamisch & statisch", "dauer": "8:01"}, {"id": "bfTczf12NBc", "kanal": "EconomicsTeacher", "titel": "Kosten-, Gewinn-, Rentabilitäts- und Amortisationsvergleich", "dauer": "12:44"}], "pn": 2}, {"key": "C5", "titel": "SWOT und PESTEL", "warum": "A2 und A3: Umfeld- und Unternehmensanalyse.", "fragen": [{"id": "C5.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «SWOT und PESTEL»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: A2 und A3: Umfeld- und Unternehmensanalyse. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "C5.vq.HU-xRXnhzow.vor0", "vid": "HU-xRXnhzow", "vq": "vor", "t": "mc", "q": "Was glaubst du: In welchem Jahrzehnt wurde die SWOT-Analyse laut Video an der Harvard Business School entwickelt?", "a": ["In den 1960ern", "In den 1980ern", "In den 2000ern", "In den 1930ern"], "r": 0, "e": "Das Video sagt, die SWOT-Analyse wurde in den 60ern an der Harvard Business School entwickelt."}, {"id": "C5.vq.HU-xRXnhzow.vor1", "vid": "HU-xRXnhzow", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht das O in SWOT?", "a": ["Organisation", "Opportunities, also Chancen", "Objectives", "Overview"], "r": 1, "e": "Das Video erklärt SWOT als Strengths, Weaknesses, Opportunities und Threats, das O steht für Opportunities."}, {"id": "C5.v.HU-xRXnhzow", "t": "frei", "abruf": 1, "vid": "HU-xRXnhzow", "vq": "nach", "q": "Video «SWOT-Analyse einfach erklärt» (Wirtschaft - simpleclub): Was waren die Kernaussagen?", "m": "1. Die SWOT-Analyse kombiniert eine interne Unternehmensanalyse (Staerken und Schwaechen) mit einer externen Umweltanalyse (Chancen und Risiken) in einer gemeinsamen Matrix. 2. Aus der Kombination der vier Felder leiten sich Strategien ab: Staerken sollen genutzt werden, um Chancen zu realisieren, waehrend Risiken und Schwaechen umgewandelt oder neutralisiert werden sollen. 3. Am Beispiel eines Premium-Autoherstellers zeigt das Video, wie aus dem Zusammentreffen von Marktchance (wachsender Markt fuer alternative Antriebe) und eigener Staerke (Antriebstechnik-Kompetenz) eine konkrete Massnahme wie die Entwicklung neuer Antriebe abgeleitet wird."}, {"id": "C5.vq.HU-xRXnhzow.nach0", "vid": "HU-xRXnhzow", "vq": "nach", "t": "mc", "q": "Welche zwei Analysen kombiniert die SWOT-Analyse laut Video?", "a": ["Eine interne Unternehmensanalyse und eine externe Umweltanalyse", "Eine Finanzanalyse und eine Wetteranalyse", "Zwei identische interne Analysen", "Eine Kundenanalyse und eine Standortanalyse"], "r": 0, "e": "Die SWOT-Analyse verbindet laut Video eine interne Analyse der Stärken und Schwächen mit einer externen Analyse von Chancen und Risiken."}, {"id": "C5.vq.HU-xRXnhzow.nach1", "vid": "HU-xRXnhzow", "vq": "nach", "t": "mc", "q": "Im Beispiel des Videos gibt es für den Autohersteller eine wachsende Nachfrage nach Sportwagen, aber ein schwaches Sportwagenangebot. In welches Feld der Matrix gehört das?", "a": ["Stärke trifft Chance", "Schwäche trifft Chance", "Stärke trifft Risiko", "Schwäche trifft Risiko"], "r": 1, "e": "Eine Marktchance, die auf eine eigene Schwäche trifft, gehört laut Video ins Feld Chance-Schwäche, dort empfiehlt das Video eine Umwandlungsstrategie."}, {"id": "C5.vq.HU-xRXnhzow.nach2", "vid": "HU-xRXnhzow", "vq": "nach", "t": "ord", "q": "Bringe die Schritte des Beispiels aus dem Video in die richtige Reihenfolge.", "a": ["Die eigenen Stärken und Schwächen intern analysieren", "Den Markt extern nach Chancen und Risiken untersuchen", "Beide Analysen in einer Matrix zusammenführen", "Aus jedem Matrixfeld eine passende Strategie ableiten"], "e": "Genau in dieser Reihenfolge baut das Video sein Beispiel des Autoherstellers auf, von der Analyse bis zur Strategieableitung."}, {"id": "C5.vq.HU-xRXnhzow.nach3", "vid": "HU-xRXnhzow", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der die SWOT-Analyse nicht kennt, wie man laut Video mit dem gefährlichsten Feld umgeht, wenn ein Marktrisiko auf eine eigene Schwäche trifft.", "m": "Wenn ein Risiko auf eine eigene Schwäche trifft, spricht man vom gefährlichsten Feld der SWOT-Matrix, weil hier der Erfolg und das Image des Unternehmens am stärksten gefährdet sind. Das Video zeigt das Beispiel sinkender Servicequalität als Schwäche, die durch das Risiko empfindlicherer Kunden verstärkt wird. Die empfohlene Strategie ist, diese Schwäche gezielt zu neutralisieren, etwa durch besser geschultes Personal."}, {"id": "C5.vq.HU-xRXnhzow.abc", "t": "abc", "abruf": 1, "vid": "HU-xRXnhzow", "vq": "nach", "m": ["Chance", "Markt", "Matrix", "Positionierung", "Risiko", "Schwäche", "Strategie", "Stärke", "SWOT", "Umweltanalyse", "Unternehmensanalyse", "Wettbewerb"], "q": "ABC-Liste zu «SWOT-Analyse einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C5.vq.HU-xRXnhzow.kawa", "t": "kawa", "abruf": 1, "vid": "HU-xRXnhzow", "vq": "nach", "wort": "CHANCE", "m": ["C: Chancen am Markt sollte ein Unternehmen aktiv ergreifen", "H: Harvard Business School hat die SWOT-Analyse in den 60ern entwickelt", "A: Analyse von Stärken und Schwächen bildet die interne Seite der Matrix", "N: Neutralisieren sollte man Risiken, die auf eigene Schwächen treffen", "E: Externe Umweltanalyse untersucht Wettbewerb, Trends und Politik"], "q": "KaWa zu «CHANCE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C5.vq.m73BIC2cS-U.vor0", "vid": "m73BIC2cS-U", "vq": "vor", "t": "mc", "q": "Was glaubst du: Bezieht sich die Unternehmensanalyse bei SWOT auf interne oder externe Faktoren?", "a": ["Externe Faktoren wie den Markt", "Interne Faktoren wie Stärken und Schwächen", "Weder noch, sie betrachtet nur Konkurrenten", "Nur die Finanzen"], "r": 1, "e": "Die Unternehmensanalyse beschäftigt sich mit den internen Stärken und Schwächen, während die Umweltanalyse die externen Chancen und Risiken betrachtet."}, {"id": "C5.vq.m73BIC2cS-U.vor1", "vid": "m73BIC2cS-U", "vq": "vor", "t": "mc", "q": "Was glaubst du: Beschreibt eine SWOT-Analyse laut Video bereits fertige Strategien oder erst einen Ist-Zustand?", "a": ["Fertige Strategien", "Einen Ist-Zustand, aus dem später Strategien abgeleitet werden", "Nur die Zukunftsprognose", "Nur die Konkurrenzanalyse"], "r": 1, "e": "Das Video betont ausdrücklich, dass eine SWOT-Analyse Zustände beschreibt und Strategien erst danach aus der Matrix abgeleitet werden."}, {"id": "C5.v.m73BIC2cS-U", "t": "frei", "abruf": 1, "vid": "m73BIC2cS-U", "vq": "nach", "q": "Video «SWOT-Analyse mit Beispiel» (Studyflix): Was waren die Kernaussagen?", "m": "1. Aus der SWOT-Matrix lassen sich vier Strategietypen ableiten: SO-Strategien nutzen Staerken fuer Chancen, ST-Strategien nutzen Staerken gegen Risiken, WO-Strategien nutzen Chancen zum Ausgleich von Schwaechen, und WT-Strategien dienen als Verteidigungsplan gegen Risiken bei vorhandenen Schwaechen. 2. Am Beispiel einer Bibliothek zeigt das Video, wie eine geringe Strahlkraft als Schwaeche durch die externe Chance der positiven Wahrnehmung als Lernort ausgeglichen werden kann, etwa durch verbessertes Marketing mit Fachpersonal. 3. Wichtig ist die strikte Trennung von internen Staerken/Schwaechen und externen Chancen/Risiken, weil hier laut Video die haeufigsten Fehler bei der Durchfuehrung einer SWOT-Analyse entstehen, und die Analyse beschreibt nur Zustaende, waehrend Strategien erst danach abgeleitet werden."}, {"id": "C5.vq.m73BIC2cS-U.nach0", "vid": "m73BIC2cS-U", "vq": "nach", "t": "mc", "q": "Welchen häufigen Fehler nennt das Video bei der Durchführung einer SWOT-Analyse?", "a": ["Zu viele Alternativen zu sammeln", "Interne Stärken und externe Chancen zu vermischen", "Zu wenige Farben in der Grafik zu verwenden", "Die Analyse zu oft zu wiederholen"], "r": 1, "e": "Das Video warnt ausdrücklich davor, interne Stärken/Schwächen mit externen Chancen/Risiken zu vermischen, das sei der häufigste Fehler."}, {"id": "C5.vq.m73BIC2cS-U.nach1", "vid": "m73BIC2cS-U", "vq": "nach", "t": "mc", "q": "Welche Strategieart entsteht aus der Kombination von Stärken und Chancen?", "a": ["WT-Strategie", "SO-Strategie (Stärken-Chancen)", "Nur eine Risikoanalyse", "Gar keine, das wird nicht kombiniert"], "r": 1, "e": "SO-Strategien zeigen, wie sich Chancen mithilfe der eigenen Stärken nutzen lassen, im Beispiel eine Gratis-Probemitgliedschaft für Senioren."}, {"id": "C5.vq.m73BIC2cS-U.nach2", "vid": "m73BIC2cS-U", "vq": "nach", "t": "ms", "q": "Welche zwei Schwächen der Bibliothek nennt das Beispiel im Video?", "a": ["Mangelnder Innovationswille", "Zu viele Besucher", "Geringe Strahlkraft wegen altmodischem Image", "Zu hohe Eintrittspreise"], "r": [0, 2], "e": "Das Video nennt unter anderem mangelnden Innovationswillen und die geringe Strahlkraft als Schwächen der Bibliothek."}, {"id": "C5.vq.m73BIC2cS-U.nach3", "vid": "m73BIC2cS-U", "vq": "nach", "t": "frei", "q": "Wo hast du selbst schon eine Situation erlebt, in der eine eigene Stärke geholfen hat, eine externe Chance zu nutzen, also eine SO-Situation?", "m": "Zum Beispiel wenn eine eigene Stärke wie gute Sprachkenntnisse genutzt wurde, um eine sich bietende Chance wie ein Auslandspraktikum oder einen internationalen Kundenkontakt erfolgreich zu nutzen, ähnlich wie die Bibliothek ihre Medienkompetenz nutzt, um die Chance des lebenslangen Lernens zu bedienen."}, {"id": "C5.vq.m73BIC2cS-U.abc", "t": "abc", "abruf": 1, "vid": "m73BIC2cS-U", "vq": "nach", "m": ["Bibliothek", "Chancen", "E-Books", "Innovationswille", "Kultureinrichtung", "Leseinteresse", "Marketing", "Opportunities", "Risiken", "Schwächen", "Strahlkraft", "Stärken", "Threats", "Umweltanalyse"], "q": "ABC-Liste zu «SWOT-Analyse mit Beispiel»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C5.vq.m73BIC2cS-U.kawa", "t": "kawa", "abruf": 1, "vid": "m73BIC2cS-U", "vq": "nach", "wort": "SWOT", "m": ["S: Stärken sind interne Vorteile wie die Medienkompetenz der Bibliothek.", "W: Weaknesses wie die geringe Strahlkraft schwächen das Image.", "O: Opportunities wie das lebenslange Lernen bieten neue Chancen.", "T: Threats wie Budgetkürzungen bedrohen die Bibliothek von aussen."], "q": "KaWa zu «SWOT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C5.vq._PhCNC-1pyU.vor0", "vid": "_PhCNC-1pyU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Faktoren umfasst die PESTEL-Analyse insgesamt?", "a": ["vier", "fünf", "sechs", "acht"], "r": 2, "e": "PESTEL steht für sechs Faktoren: politisch, ökonomisch, soziokulturell, technologisch, ökologisch und rechtlich."}, {"id": "C5.vq._PhCNC-1pyU.vor1", "vid": "_PhCNC-1pyU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Analysiert die PESTEL-Analyse die internen Abläufe eines Unternehmens oder sein äusseres Umfeld?", "a": ["nur die internen Abläufe", "das äussere Umfeld des Unternehmens", "nur die Konkurrenz direkt", "nur die eigenen Mitarbeitenden"], "r": 1, "e": "Das Video bezeichnet PESTEL als Makroanalyse der externen Umweltfaktoren eines Unternehmens, also dessen äusseres Umfeld."}, {"id": "C5.v._PhCNC-1pyU", "t": "frei", "abruf": 1, "vid": "_PhCNC-1pyU", "vq": "nach", "q": "Video «PESTEL-Analyse einfach erklärt» (Mission Bachelor): Was waren die Kernaussagen?", "m": "1. Die PESTEL-Analyse ist eine Makroanalyse der externen Umweltfaktoren eines Unternehmens und gliedert sich in sechs Faktoren: politisch, oekonomisch, soziokulturell, technologisch, oekologisch und rechtlich. 2. Politische Faktoren umfassen zum Beispiel politische Stabilitaet, staatliche Subventionen und Handelsrestriktionen, waehrend oekonomische Faktoren Zinsniveau, Inflationsrate und Arbeitslosigkeit betreffen. 3. Oekologische Faktoren wie Umweltauflagen und die Verfuegbarkeit von Rohstoffquellen sowie rechtliche Faktoren wie Arbeits-, Steuer- und Wettbewerbsrecht runden die Analyse ab und helfen bei der Standortentscheidung."}, {"id": "C5.vq._PhCNC-1pyU.nach0", "vid": "_PhCNC-1pyU", "vq": "nach", "t": "mc", "q": "Zu welchem PESTEL-Faktor gehören laut Video Zinsniveau, Inflationsrate und Arbeitslosigkeit?", "a": ["politischer Faktor", "ökonomischer Faktor", "soziokultureller Faktor", "technologischer Faktor"], "r": 1, "e": "Das Video ordnet Zinsniveau, Inflationsrate und Arbeitslosigkeit dem ökonomischen Faktor zu."}, {"id": "C5.vq._PhCNC-1pyU.nach1", "vid": "_PhCNC-1pyU", "vq": "nach", "t": "ms", "q": "Welche zwei Beispiele nennt das Video für den ökologischen Faktor?", "a": ["Umweltauflagen", "Verfügbarkeit von Rohstoffquellen", "Zinsniveau", "Bevölkerungsstruktur"], "r": [0, 1], "e": "Das Video nennt Umweltauflagen und die Verfügbarkeit von Rohstoffquellen als Beispiele für den ökologischen Faktor."}, {"id": "C5.vq._PhCNC-1pyU.nach2", "vid": "_PhCNC-1pyU", "vq": "nach", "t": "ord", "q": "Bringe die sechs PESTEL-Faktoren in der Reihenfolge, wie sie im Video vorgestellt werden.", "a": ["politischer Faktor", "ökonomischer Faktor", "soziokultureller Faktor", "technologischer Faktor", "ökologischer Faktor", "rechtlicher Faktor"], "e": "Das Video stellt die Faktoren genau in dieser Reihenfolge vor: politisch, ökonomisch, soziokulturell, technologisch, ökologisch, rechtlich."}, {"id": "C5.vq._PhCNC-1pyU.nach3", "vid": "_PhCNC-1pyU", "vq": "nach", "t": "frei", "q": "Erkläre in drei Sätzen an einem selbst gewählten Beispielunternehmen, wie ein einzelner PESTEL-Faktor dessen Geschäft beeinflussen könnte.", "m": "Ein Solarpanel-Hersteller hängt zum Beispiel stark vom politischen Faktor ab, weil staatliche Subventionen für erneuerbare Energien seine Nachfrage direkt beeinflussen. Fallen diese Subventionen weg, kann das Geschäft trotz guter Produkte einbrechen. Deshalb muss das Unternehmen die politische Lage genauso beobachten wie seine eigenen Kosten und Kunden."}, {"id": "C5.vq._PhCNC-1pyU.abc", "t": "abc", "abruf": 1, "vid": "_PhCNC-1pyU", "vq": "nach", "m": ["Inflation", "Infrastruktur", "PESTEL", "politisch", "rechtlich", "Rohstoffquelle", "soziokulturell", "Subvention", "technologisch", "Wettbewerbsrecht", "ökologisch", "ökonomisch"], "q": "ABC-Liste zu «PESTEL-Analyse einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C5.vq._PhCNC-1pyU.kawa", "t": "kawa", "abruf": 1, "vid": "_PhCNC-1pyU", "vq": "nach", "wort": "PESTEL", "m": ["P: Politischer Faktor: fragt nach Stabilität, Subventionen und Handelsrestriktionen", "E: Ergebnis: am Ende hilft die Analyse, den passenden Standort zu wählen", "S: Soziokultureller Faktor: betrachtet Bevölkerungsstruktur, Bildung und kulturelle Werte", "T: Technologischer Faktor: fragt nach Fortschritt und Infrastruktur eines Landes", "L: Legal, also rechtlicher Faktor: umfasst Arbeits-, Steuer- und Wettbewerbsrecht"], "q": "KaWa zu «PESTEL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C5.vq.TNLLyS0nrM8.vor0", "vid": "TNLLyS0nrM8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wofür steht das S in der STEP-Analyse laut Video?", "a": ["Strategie", "Soziokulturelle Faktoren", "Sicherheit", "Statistik"], "r": 1, "e": "Das Video erklärt das S als soziokulturelle Faktoren, etwa Alters- und Kundenstruktur oder Trends."}, {"id": "C5.vq.TNLLyS0nrM8.vor1", "vid": "TNLLyS0nrM8", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches Beispiel nutzt der Sprecher, um externe Einflussfaktoren zu veranschaulichen?", "a": ["Deutsche Bratwurst in Paris verkaufen", "Französischen Wein in Berlin verkaufen", "Schweizer Schokolade in Rom verkaufen", "Italienische Pizza in Madrid verkaufen"], "r": 0, "e": "Der Sprecher nutzt das Beispiel, deutsche Bratwurst in Paris zu verkaufen, um externe Einflussfaktoren zu veranschaulichen."}, {"id": "C5.v.TNLLyS0nrM8", "t": "frei", "abruf": 1, "vid": "TNLLyS0nrM8", "vq": "nach", "q": "Video «STEP-/PEST-Analyse leicht gemacht» (Projekte leicht gemacht): Was waren die Kernaussagen?", "m": "1. STEP beziehungsweise PEST steht fuer die vier Kategorien soziokulturell, technisch, oekonomisch und politisch, mit denen externe Einflussfaktoren auf Unternehmen oder Projekte systematisch erfasst werden. 2. Die Methode laesst sich auf einzelne Projekte anwenden, etwa durch die Frage, wie sich Arbeits- und Fuehrungskultur zwischen Laendern wie den USA, China oder Schweden unterscheiden und welche technologischen Abhaengigkeiten ein Projekt hat. 3. Es gibt zahlreiche Erweiterungen von STEP wie PESTEL (zusaetzlich environmental und legal), STEEPLE oder LoNG PESTEL, die dieselbe Systematik jeweils um zusaetzliche Kategorien wie Umwelt, Recht oder Demografie ergaenzen."}, {"id": "C5.vq.TNLLyS0nrM8.nach0", "vid": "TNLLyS0nrM8", "vq": "nach", "t": "mc", "q": "Was bedeutet PESTEL im Vergleich zu STEP zusätzlich?", "a": ["Nur eine andere Reihenfolge der gleichen vier Buchstaben", "Environment und Legal als zusätzliche Kategorien", "Ersatz aller vier ursprünglichen Kategorien", "Eine rein interne statt externe Analyse"], "r": 1, "e": "PESTEL ergänzt die vier STEP-Kategorien um Environment, also Umwelt, und Legal, also rechtliche Faktoren."}, {"id": "C5.vq.TNLLyS0nrM8.nach1", "vid": "TNLLyS0nrM8", "vq": "nach", "t": "ms", "q": "Welche zwei Zwecke nennt das Video für den Einsatz einer STEP-Analyse?", "a": ["Chancen für neue Projekte erkennen", "Die Buchhaltung automatisieren", "Risiken im Rahmen der Risikoanalyse sammeln", "Mitarbeitende automatisch einstellen"], "r": [0, 2], "e": "Das Video nennt das Erkennen von Chancen und das Sammeln von Risiken als Zwecke der Analyse."}, {"id": "C5.vq.TNLLyS0nrM8.nach2", "vid": "TNLLyS0nrM8", "vq": "nach", "t": "lueck", "q": "STEP und PEST haben laut Video denselben Zweck, nur die Reihenfolge der ___ ist unterschiedlich sortiert.", "r": ["buchstaben"], "e": "Das Video sagt wörtlich, dass bei PEST einfach die Buchstabenreihenfolge von STEP anders sortiert ist."}, {"id": "C5.vq.TNLLyS0nrM8.nach3", "vid": "TNLLyS0nrM8", "vq": "nach", "t": "frei", "q": "Erkläre anhand des Bratwurst-Beispiels aus dem Video, wie ein soziokultureller und ein politischer Faktor eine Geschäftsidee im Ausland beeinflussen könnten.", "m": "Ein soziokultureller Faktor wäre zum Beispiel, ob der Geschmack der Bratwurst überhaupt zu den Vorlieben der Menschen in Paris passt, das Video nennt das ausdrücklich als Frage. Ein politischer Faktor wäre, wie die Lebensmittelgesetze in Frankreich aussehen und wie strikt sie kontrolliert werden. Ohne diese externen Faktoren zu prüfen, könnte das Geschäft trotz gutem Produkt am fremden Umfeld scheitern."}, {"id": "C5.vq.TNLLyS0nrM8.abc", "t": "abc", "abruf": 1, "vid": "TNLLyS0nrM8", "vq": "nach", "m": ["Chance", "PEST", "PESTEL", "Politisch", "Risiko", "Soziokulturell", "STEP-Analyse", "Strafzoll", "Technologisch", "Trend", "Umfeldanalyse", "Ökonomisch"], "q": "ABC-Liste zu «STEP-/PEST-Analyse leicht gemacht»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "C5.vq.TNLLyS0nrM8.kawa", "t": "kawa", "abruf": 1, "vid": "TNLLyS0nrM8", "vq": "nach", "wort": "PESTEL", "m": ["P: Politische Faktoren wie neue Gesetze oder Strafzölle beachten", "E: Erweiterung um Environment und Legal ergibt PESTEL", "S: Soziokulturelle Faktoren wie Alters- und Kundenstruktur prüfen", "T: Technologische Faktoren wie neue Produktionsverfahren beobachten", "L: Legal, also rechtliche Faktoren, wird bei PESTEL eigens aufgeführt"], "q": "KaWa zu «PESTEL»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "C5.0", "t": "ms", "q": "SWOT: Welche zwei Felder schauen nach INNEN?", "a": ["Stärken", "Chancen", "Schwächen", "Risiken"], "r": [0, 2], "e": "Stärken/Schwächen = intern. Chancen/Risiken = extern."}, {"id": "C5.1", "t": "lueck", "q": "PESTEL: Political, Economic, Social, Technological, ___ , Legal.", "r": ["ecological", "ökologisch", "oekologisch", "environmental", "umwelt"], "e": "Das Qualifikationsprofil A2 zählt genau diese sechs auf: politisch, wirtschaftlich, gesellschaftlich, technologisch, ökologisch, rechtlich."}, {"id": "C5.2", "t": "mc", "q": "«Neues Datenschutzgesetz verschärft die Auflagen» gehört in der SWOT wohin?", "a": ["Stärke", "Schwäche", "Chance oder Risiko (extern)", "Gar nicht"], "r": 2, "e": "Externer Faktor. Häufiger Fehler: externe Entwicklungen als Schwäche eintragen."}, {"id": "C5.3", "t": "frei", "q": "Wie kommst du von einer SWOT zu einem strategischen Beitrag (A4)? Beschreibe den Schritt, den viele weglassen.", "m": "Die Felder kombinieren statt nur auflisten: Stärken × Chancen (ausbauen), Schwächen × Chancen (aufholen), Stärken × Risiken (absichern), Schwächen × Risiken (vermeiden). Daraus zwei bis drei konkrete Stossrichtungen für den KI-Einsatz ableiten, mit Bezug zur Unternehmensstrategie, und zielgruppengerecht präsentieren."}], "videos": [{"id": "HU-xRXnhzow", "kanal": "Wirtschaft - simpleclub", "titel": "SWOT-Analyse einfach erklärt", "dauer": "6:28"}, {"id": "m73BIC2cS-U", "kanal": "Studyflix", "titel": "SWOT-Analyse mit Beispiel", "dauer": "7:34"}, {"id": "_PhCNC-1pyU", "kanal": "Mission Bachelor", "titel": "PESTEL-Analyse einfach erklärt", "dauer": "3:29"}, {"id": "TNLLyS0nrM8", "kanal": "Projekte
