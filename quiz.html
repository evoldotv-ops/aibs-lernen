 als Vektoren ablegen", "Frage des Nutzers in einen Vektor umwandeln", "Die ähnlichsten Abschnitte heraussuchen (Retrieval)", "Abschnitte plus Frage an das Sprachmodell geben", "Antwort mit Quellenangabe ausgeben"], "e": "Erst indexieren, dann suchen, dann generieren. Das Modell antwortet aus den mitgegebenen Stellen, nicht aus dem Gedächtnis."}, {"id": "A4.1", "t": "mc", "q": "Welches Problem löst RAG NICHT von selbst?", "a": ["Das Modell kennt interne Dokumente nicht", "Antworten sollen auf Quellen verweisen", "Wer welches Dokument sehen darf", "Das Wissen soll aktuell bleiben, ohne neu zu trainieren"], "r": 2, "e": "Berechtigungen muss man deterministisch vor dem Retrieval bzw. vor der Ausgabe prüfen. Das war die Schwachstelle E3 in Nullserie Challenge 02."}, {"id": "A4.2", "t": "lueck", "q": "Das R in RAG steht für ___ .", "r": ["retrieval", "abruf"], "e": "Retrieval-Augmented Generation: erst abrufen, dann damit angereichert generieren."}, {"id": "A4.3", "t": "frei", "q": "Erkläre RAG mit einem Bild aus dem Schulalltag.", "m": "Prüfung mit offenem Buch: Das Modell ist der Schüler, der gut formulieren kann, aber nicht alles weiss. Vor jeder Antwort schlägt er im richtigen Buch nach, liest die Stelle und antwortet dann mit Seitenangabe. Findet er nichts, muss er sagen «weiss ich nicht», statt zu raten."}, {"id": "A4.4", "t": "frei", "q": "Transfer: Ein Anbieter schlägt vor, interne Richtlinien UND offene Webquellen in denselben RAG-Wissenspool zu laden. Zwei Einwände?", "m": "Erstens Qualität und Verbindlichkeit: Webquellen sind ungeprüft und können internen Richtlinien widersprechen, die Antwort wird unzuverlässig. Zweitens Scope und Compliance: Wenn der Pilot nur freigegebene interne Dokumente vorsieht, verletzt das die Anforderung. Dazu kommt das Risiko von Prompt Injection über fremde Texte."}], "videos": [{"id": "jZoyg74ZyqM", "kanal": "Fraunhofer IEM", "titel": "LLMs & RAG: Was wirklich wichtig ist | INSIDE AI #21", "dauer": "13:30"}, {"id": "6xNqqIqyy38", "kanal": "datasolut", "titel": "Was ist Retrieval Augmented Generation?", "dauer": "8:57"}, {"id": "T-D1OfcDW1M", "kanal": "IBM Technology", "titel": "What is Retrieval-Augmented Generation (RAG)?", "dauer": "6:35"}, {"id": "xCv16VpYFHM", "kanal": "Christoph Magnussen", "titel": "ChatGPT mit eigenen Daten verbinden! So funktionieren Konnektoren", "dauer": "8:59"}], "pn": 1}, {"key": "A5", "titel": "Embeddings und Vektorsuche", "warum": "Challenge 02, Aufgabe 2: Stichwort-, Vektor- und Hybrid-Suche ordnen.", "fragen": [{"id": "A5.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Embeddings und Vektorsuche»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Challenge 02, Aufgabe 2: Stichwort-, Vektor- und Hybrid-Suche ordnen. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A5.vq.18Np1pjkE3E.vor0", "vid": "18Np1pjkE3E", "vq": "vor", "t": "mc", "q": "Was glaubst du: Muss ein Sprachmodell bei RAG alle deine Dokumente vorher auswendig gelernt haben?", "a": ["Ja, sonst funktioniert RAG nicht", "Nein, es sucht die passenden Infos erst beim Fragen", "Nur bei PDF-Dateien", "Nur wenn die Dokumente kurz sind"], "r": 1, "e": "RAG sucht laut Video die relevanten Abschnitte erst zum Zeitpunkt der Frage und liest nicht vorher alles auswendig."}, {"id": "A5.vq.18Np1pjkE3E.vor1", "vid": "18Np1pjkE3E", "vq": "vor", "t": "mc", "q": "Was glaubst du: Woran erkennt eine auf Embeddings basierte Suche, dass 'kaputtes Produkt' und 'defektes Produkt' dasselbe meinen?", "a": ["An identischen Buchstaben in beiden Sätzen", "An der Dateiendung des Dokuments", "An der Bedeutung, weil ähnliche Vektoren nah beieinander liegen", "Am Erstellungsdatum des Dokuments"], "r": 2, "e": "Embeddings bilden die Bedeutung von Text ab, deshalb liegen sinnverwandte Begriffe im Vektorraum nah beieinander."}, {"id": "A5.v.18Np1pjkE3E", "t": "frei", "abruf": 1, "vid": "18Np1pjkE3E", "vq": "nach", "q": "Video «RAG, Embeddings & Vektordatenbanken einfach erklärt für 5-Jährige» (Cloud X Berry): Was waren die Kernaussagen?", "m": "1. Eine RAG-Pipeline zerlegt Dokumente zuerst in kleinere Abschnitte, sogenannte Chunks, damit bei einer Anfrage nicht das gesamte Dokument, sondern nur die relevanten Abschnitte verarbeitet werden müssen. 2. Ein Einbettungsmodell wandelt jeden Textabschnitt in einen Vektor aus Zahlen um, wobei Textabschnitte mit ähnlicher Bedeutung wie defekte Produkte und kaputter Artikel nahe beieinander liegende Vektoren erhalten, auch wenn die Wörter unterschiedlich sind. 3. Der Unterschied zwischen Fine-Tuning und RAG lässt sich laut Video so merken: Fine-Tuning verändert das Modell selbst, RAG verändert nur die Informationen, die dem Modell bei der Anfrage zur Verfügung gestellt werden."}, {"id": "A5.vq.18Np1pjkE3E.nach0", "vid": "18Np1pjkE3E", "vq": "nach", "t": "mc", "q": "Was ist laut Video ein Embedding?", "a": ["Ein Vektor, der die Bedeutung von Text als Zahlen darstellt", "Ein Sicherheitsfilter für KI-Antworten", "Ein Vergrösserungsfaktor für PDF-Dateien", "Ein Übersetzungsprogramm für fremde Sprachen"], "r": 0, "e": "Ein Embedding wandelt Text in eine Liste von Zahlen um, die die Bedeutung des Textes repräsentiert."}, {"id": "A5.vq.18Np1pjkE3E.nach1", "vid": "18Np1pjkE3E", "vq": "nach", "t": "ms", "q": "Welche zwei Vorteile von RAG nennt das Video?", "a": ["Informationen bleiben aktuell, ohne das Modell neu zu trainieren", "Das Modell wird dadurch automatisch mehrsprachig", "Halluzinationen können reduziert werden", "RAG macht Antworten immer zu 100 Prozent korrekt"], "r": [0, 2], "e": "Das Video nennt Aktualität ohne Neu-Training und weniger Halluzinationen als zentrale Vorteile von RAG."}, {"id": "A5.vq.18Np1pjkE3E.nach2", "vid": "18Np1pjkE3E", "vq": "nach", "t": "ord", "q": "Bringe die RAG-Pipeline aus dem Video in die richtige Reihenfolge.", "a": ["Ein Dokument wird in Chunks unterteilt", "Jeder Chunk wird in einen Vektor umgewandelt", "Die Vektoren werden in einer Vektordatenbank gespeichert", "Die Frage des Nutzers wird ebenfalls in einen Vektor umgewandelt", "Die ähnlichsten Chunks werden abgerufen und ans Sprachmodell gegeben"], "e": "Genau in dieser Reihenfolge beschreibt das Video den Ablauf einer RAG-Pipeline."}, {"id": "A5.vq.18Np1pjkE3E.nach3", "vid": "18Np1pjkE3E", "vq": "nach", "t": "lueck", "q": "Im Unterschied zu RAG ändert sich bei der ___ das Verhalten des Modells selbst, zum Beispiel Stil oder Format.", "r": ["feinabstimmung", "fine-tuning", "finetuning"], "e": "Fine-Tuning verändert das Modell selbst, während RAG nur die verfügbaren Informationen ergänzt."}, {"id": "A5.vq.18Np1pjkE3E.nach4", "vid": "18Np1pjkE3E", "vq": "nach", "t": "frei", "q": "Erkläre anhand des Beispiels 'Rückerstattung', warum eine reine Stichwortsuche an ihre Grenzen stösst, eine Embedding-Suche aber nicht.", "m": "Eine Stichwortsuche findet 'defektes Produkt' nicht, wenn im Dokument 'kaputter Artikel' steht, weil die Wörter unterschiedlich sind. Eine Embedding-Suche vergleicht dagegen die Bedeutung als Vektor und erkennt, dass beide Formulierungen inhaltlich dasselbe meinen."}, {"id": "A5.vq.18Np1pjkE3E.abc", "t": "abc", "abruf": 1, "vid": "18Np1pjkE3E", "vq": "nach", "m": ["Chunk", "Datenbank", "Embedding", "Feinabstimmung", "Generation", "Halluzination", "Pipeline", "Retrieval", "Stichwortsuche", "Vektor", "Zitat"], "q": "ABC-Liste zu «RAG, Embeddings & Vektordatenbanken einfach erklärt für 5-Jährige»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A5.vq.18Np1pjkE3E.kawa", "t": "kawa", "abruf": 1, "vid": "18Np1pjkE3E", "vq": "nach", "wort": "VEKTOR", "m": ["V: Vektor: eine Liste von Zahlen, die die Bedeutung eines Textes darstellt", "E: Embedding: wandelt Text in einen solchen Vektor um", "K: Kontext: die abgerufenen Chunks werden dem Modell als Kontext mitgegeben", "T: Training: RAG erspart dir das Neu-Training des Modells bei Änderungen", "O: Originalquelle: gute RAG-Systeme zeigen Zitate zur Überprüfung", "R: Retrieval: das Abrufen der passendsten Textabschnitte zu einer Frage"], "q": "KaWa zu «VEKTOR»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A5.vq.fXVqH4F0qL4.vor0", "vid": "fXVqH4F0qL4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert, wenn du in einer klassischen Datenbank nach ähnlichen Farbstimmungen in Bildern suchst?", "a": ["Das funktioniert einwandfrei", "Es gibt dafür keine passende Spalte, die Suche scheitert", "Die Datenbank sortiert automatisch nach Farbe", "Man braucht dafür keine Tags"], "r": 1, "e": "Laut Video fehlt in klassischen Datenbanken eine Spalte für Bedeutung, das nennt man die semantische Lücke."}, {"id": "A5.vq.fXVqH4F0qL4.vor1", "vid": "fXVqH4F0qL4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Dimensionen haben Vektor-Embeddings in der Praxis wirklich?", "a": ["Genau zwei", "Genau drei", "Hunderte bis Tausende", "Immer genau zehn"], "r": 2, "e": "Das Beispiel im Video nutzt nur drei Zahlen zur Erklärung, in der Realität sind es Hunderte oder Tausende Dimensionen."}, {"id": "A5.v.fXVqH4F0qL4", "t": "frei", "abruf": 1, "vid": "fXVqH4F0qL4", "vq": "nach", "q": "Video «Vektordatenbanken einfach erklärt» (datasolut): Was waren die Kernaussagen?", "m": "1. Relationale Datenbanken scheitern bei unstrukturierten Inhalten wie Bildern an der sogenannten semantischen Lücke, weil ein Tag wie orange sowohl einen Sonnenuntergang als auch einen Basketball beschreiben kann. 2. Ein Embedding-Modell übersetzt Bilder, Texte oder Audiodateien automatisch in Zahlenvektoren mit Hunderten bis Tausenden Dimensionen, wobei inhaltlich ähnliche Objekte nahe beieinanderliegende Vektoren erhalten. 3. Da ein Vergleich jeder Anfrage mit Millionen Vektoren zu langsam wäre, sortiert ein Vector Index die Daten vorab so vor, dass eine Suche mit geringem Genauigkeitsverlust deutlich schneller wird."}, {"id": "A5.vq.fXVqH4F0qL4.nach0", "vid": "fXVqH4F0qL4", "vq": "nach", "t": "mc", "q": "Wie nennt das Video die Kluft zwischen dem, was der Computer speichert, und dem, was Menschen unter einem Bild verstehen?", "a": ["Datenlücke", "Semantische Lücke", "Indexfehler", "Vektorverlust"], "r": 1, "e": "Das Video nennt dieses Problem explizit die semantische Lücke."}, {"id": "A5.vq.fXVqH4F0qL4.nach1", "vid": "fXVqH4F0qL4", "vq": "nach", "t": "ms", "q": "Welche zwei Aussagen über Vektor-Embeddings stimmen laut Video?", "a": ["Ähnliche Inhalte haben ähnliche Zahlen und liegen nah beieinander", "Jedes Objekt wird von Hand getaggt", "Ein Embedding-Modell erzeugt die Zahlen automatisch", "Vektoren haben immer nur eine Dimension"], "r": [0, 2], "e": "Ähnliche Inhalte liegen im Vektorraum nah beieinander, und ein trainiertes Embedding-Modell erzeugt die Zahlen automatisch, ohne dass man von Hand taggen muss."}, {"id": "A5.vq.fXVqH4F0qL4.nach2", "vid": "fXVqH4F0qL4", "vq": "nach", "t": "lueck", "q": "Der Fachbegriff für das schnelle Auffinden ähnlicher Vektoren mit Hilfe eines cleveren Suchsystems heisst Vector ___.", "r": ["indexing", "index"], "e": "Vector Indexing funktioniert wie ein Bibliothekar, der sofort weiss, wo er suchen muss, statt jeden Vektor einzeln zu vergleichen."}, {"id": "A5.vq.fXVqH4F0qL4.nach3", "vid": "fXVqH4F0qL4", "vq": "nach", "t": "frei", "q": "Erkläre in eigenen Worten, wie RAG (Retrieval Augmented Generation) laut Video funktioniert und wozu es gebraucht wird.", "m": "Bei RAG werden Firmendokumente vorher in kleine Textstücke zerlegt und als Embeddings in einer Vektordatenbank gespeichert. Stellt ein Nutzer eine Frage, sucht das System die passenden Textstücke in der Datenbank und gibt sie dem KI-Agenten mit. Der Agent nutzt diese echten Dokumente, um eine Antwort zu generieren, statt nur zu raten."}, {"id": "A5.vq.fXVqH4F0qL4.abc", "t": "abc", "abruf": 1, "vid": "fXVqH4F0qL4", "vq": "nach", "m": ["Bedeutung", "Bibliothekar", "Dimension", "Embedding", "Farbe", "Indexing", "Produktsuche", "RAG", "Sonnenuntergang", "Suche", "Tags", "Vektor", "Wissensdatenbank"], "q": "ABC-Liste zu «Vektordatenbanken einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A5.vq.fXVqH4F0qL4.kawa", "t": "kawa", "abruf": 1, "vid": "fXVqH4F0qL4", "vq": "nach", "wort": "VEKTOR", "m": ["V: Vektor: jedes Bild oder jeder Text wird als Reihe von Zahlen dargestellt", "E: Embedding-Modell: erzeugt automatisch die Zahlen für den Inhalt", "K: Klassische Datenbank: scheitert an semantischen Suchen wie Farbstimmung", "T: Trick des Verfahrens: ähnliche Inhalte haben ähnliche Zahlen und liegen nah beieinander", "O: Orange: sowohl Sonnenuntergang als auch Basketball sind orange, aber inhaltlich verschieden", "R: RAG: Retrieval Augmented Generation nutzt die Vektordatenbank für KI-Agenten"], "q": "KaWa zu «VEKTOR»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A5.vq.dN0lsF2cvm4.vor0", "vid": "dN0lsF2cvm4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viel Prozent der Daten in der Welt sind laut Video unstrukturiert, also Texte, Bilder oder Audio?", "a": ["Etwa 20 Prozent", "Etwa 50 Prozent", "Über 80 Prozent", "Nur 5 Prozent"], "r": 2, "e": "Das Video nennt ausdrücklich, dass über 80 Prozent der Daten unstrukturiert sind."}, {"id": "A5.vq.dN0lsF2cvm4.vor1", "vid": "dN0lsF2cvm4", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was ist eine Vektor-Einbettung, ein Embedding, laut Video?", "a": ["Ein verschlüsseltes Passwort", "Eine Liste von Zahlen, die Daten wie Text oder Bild repräsentiert", "Ein Backup der Datenbank", "Ein Tag, das ein Mensch manuell vergibt"], "r": 1, "e": "Das Video definiert ein Embedding genau so: eine Liste von Zahlen, die Daten in anderer Form darstellt."}, {"id": "A5.v.dN0lsF2cvm4", "t": "frei", "abruf": 1, "vid": "dN0lsF2cvm4", "vq": "nach", "q": "Video «Vector Databases simply explained! (Embeddings & Indexes)» (AssemblyAI): Was waren die Kernaussagen?", "m": "1. Über achtzig Prozent der vorhandenen Daten sind unstrukturiert, etwa Bilder oder Audiodateien, die sich ohne manuelle Tags kaum in einer klassischen relationalen Datenbank durchsuchen lassen. 2. Eine Vektordatenbank speichert und indiziert Vektor-Embeddings, damit eine Ähnlichkeitssuche über Distanzmessung statt über exakte Stichwortsuche möglich wird. 3. Vektordatenbanken werden unter anderem eingesetzt, um Sprachmodellen ein Langzeitgedächtnis zu geben, für semantische Suche nach Bedeutung statt exakter Wörter und für Empfehlungssysteme auf Basis ähnlicher früherer Käufe."}, {"id": "A5.vq.dN0lsF2cvm4.nach0", "vid": "dN0lsF2cvm4", "vq": "nach", "t": "mc", "q": "Warum reicht es laut Video nicht, Embeddings nur zu speichern?", "a": ["Weil die Suche über tausende Vektoren ohne Index viel zu langsam wäre", "Weil Embeddings sich ständig von selbst verändern", "Weil Embeddings nicht in Zahlen umgewandelt werden können", "Weil jede Datenbank nur einen Vektor speichern darf"], "r": 0, "e": "Ohne Index wäre eine Suche über tausende Vektoren nach Distanz viel zu langsam, deshalb braucht es die Indexierung."}, {"id": "A5.vq.dN0lsF2cvm4.nach1", "vid": "dN0lsF2cvm4", "vq": "nach", "t": "ms", "q": "Welche zwei Anwendungsfälle für Vektordatenbanken nennt das Video?", "a": ["Langzeitgedächtnis für Sprachmodelle", "Semantische Suche nach Bedeutung statt exakten Wörtern", "Automatisches Versenden von E-Mails", "Verschlüsselung von Passwörtern"], "r": [0, 1], "e": "Das Video nennt beides ausdrücklich als Anwendungsfälle für Vektordatenbanken."}, {"id": "A5.vq.dN0lsF2cvm4.nach2", "vid": "dN0lsF2cvm4", "vq": "nach", "t": "lueck", "q": "Eine Vektordatenbank speichert und indexiert Vektor-___ für schnellen Abruf und Ähnlichkeitssuche.", "r": ["embeddings"], "e": "Das Video definiert die Vektordatenbank genau so: sie indexiert und speichert Vektor-Embeddings für schnelle Suche."}, {"id": "A5.vq.dN0lsF2cvm4.nach3", "vid": "dN0lsF2cvm4", "vq": "nach", "t": "frei", "q": "Erkläre jemandem ohne Vorwissen, wie eine Bildersuche über Embeddings funktioniert, ohne dass man Stichwörter zum Bild eingeben muss.", "m": "Ein Modell rechnet jedem Bild eine Liste von Zahlen zu, die den Bildinhalt in einem Zahlenraum darstellt. Zwei ähnliche Bilder bekommen dabei ähnliche Zahlenlisten, deren Abstand zueinander klein ist. Die Suche findet dann einfach die Bilder mit dem kleinsten Abstand zum gesuchten Bild."}, {"id": "A5.vq.dN0lsF2cvm4.abc", "t": "abc", "abruf": 1, "vid": "dN0lsF2cvm4", "vq": "nach", "m": ["Chroma", "Embedding", "Index", "Milvus", "Nearest Neighbor", "Pinecone", "Recommendation", "Redis", "Semantische Suche", "Unstrukturiert", "Vektor", "Vespa"], "q": "ABC-Liste zu «Vector Databases simply explained! (Embeddings & Indexes)»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A5.vq.dN0lsF2cvm4.kawa", "t": "kawa", "abruf": 1, "vid": "dN0lsF2cvm4", "vq": "nach", "wort": "SUCHE", "m": ["S: Semantische Suche: nach Bedeutung statt exakten Wörtern suchen", "U: Unstrukturierte Daten: über 80 Prozent aller Daten, zum Beispiel Bilder oder Audio", "C: Chroma: eine der im Video genannten Vektordatenbanken", "H: Hunderte Dimensionen: reale Vektoren haben oft hunderte Zahlen", "E: Embedding: eine Liste von Zahlen für die Daten"], "q": "KaWa zu «SUCHE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A5.0", "t": "mc", "q": "Was ist ein Embedding?", "a": ["Eine verschlüsselte Kopie des Dokuments", "Eine Zahlenreihe (Vektor), die die Bedeutung eines Textes abbildet", "Ein Stichwortverzeichnis", "Eine Zusammenfassung in einem Satz"], "r": 1, "e": "Texte mit ähnlicher Bedeutung liegen als Vektoren nahe beieinander. So findet «Malrechnen» auch «Multiplikation»."}, {"id": "A5.1", "t": "ord", "q": "Mitarbeitende suchen mit anderen Wörtern als in den Dokumenttiteln stehen, brauchen aber auch exakte Treffer (Formularnummern). Ordne von am besten bis am wenigsten geeignet.", "a": ["Hybrid-Suche", "Vektorsuche", "Stichwortsuche"], "e": "Hybrid kombiniert Bedeutung und exakte Begriffe. Reine Stichwortsuche scheitert an abweichenden Wörtern. So gefragt in Nullserie Challenge 02."}, {"id": "A5.2", "t": "ms", "q": "Wo ist reine Vektorsuche schwach? Wähle zwei.", "a": ["Bei exakten Kennungen wie Artikelnummern oder Paragraphen", "Bei Synonymen", "Bei der Nachvollziehbarkeit, warum ein Treffer kam", "Bei umgangssprachlichen Fragen"], "r": [0, 2], "e": "Ähnlichkeit ist unscharf: exakte IDs gehen unter, und die Trefferbegründung ist schwer erklärbar. Darum Quellenbeleg und Hybrid-Suche."}, {"id": "A5.3", "t": "frei", "q": "Erkläre den Unterschied zwischen Stichwortsuche und Vektorsuche so, dass ihn die Bereichsleitung versteht.", "m": "Die Stichwortsuche findet nur, was buchstäblich gleich geschrieben ist. Die Vektorsuche findet, was dasselbe meint, auch wenn andere Wörter benutzt werden. Für unsere uneinheitlich betitelten Dokumente brauchen wir beides zusammen: Bedeutung für die Alltagsfragen, exakte Suche für Nummern und Namen."}], "videos": [{"id": "18Np1pjkE3E", "kanal": "Cloud X Berry", "titel": "RAG, Embeddings & Vektordatenbanken einfach erklärt für 5-Jährige", "dauer": "4:46"}, {"id": "fXVqH4F0qL4", "kanal": "datasolut", "titel": "Vektordatenbanken einfach erklärt", "dauer": "6:27"}, {"id": "dN0lsF2cvm4", "kanal": "AssemblyAI", "titel": "Vector Databases simply explained! (Embeddings & Indexes)", "dauer": "4:23"}], "pn": 2}, {"key": "A6", "titel": "Fine-Tuning oder RAG?", "warum": "Klassische Entscheidfrage: zwei Lösungsansätze vergleichen (C3).", "fragen": [{"id": "A6.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Fine-Tuning oder RAG?»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Klassische Entscheidfrage: zwei Lösungsansätze vergleichen (C3). Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A6.vq.q9LW0LCL-Zw.vor0", "vid": "q9LW0LCL-Zw", "vq": "vor", "t": "mc", "q": "Was glaubst du: In der Metapher des Videos nimmt ein Student in die Klausur seine Unterlagen mit und lernt vorher nichts. Für welches Verfahren steht das?", "a": ["Fine-Tuning", "Retrieval Augmented Generation", "Prompt Engineering", "Greedy Sampling"], "r": 1, "e": "Der Student mit Unterlagen, aber ohne Vorbereitung steht im Video für RAG, das Modell holt sich die Infos erst bei der Anfrage."}, {"id": "A6.vq.q9LW0LCL-Zw.vor1", "vid": "q9LW0LCL-Zw", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches der beiden Verfahren ist laut dem im Video zitierten Microsoft-Paper meistens teurer?", "a": ["Fine-Tuning", "RAG", "Beide sind gleich teuer", "Keins von beiden kostet etwas"], "r": 0, "e": "Fine-Tuning braucht teure Rechenleistung und viele hochwertige Trainingsdaten, das macht es laut Video deutlich teurer als RAG."}, {"id": "A6.v.q9LW0LCL-Zw", "t": "frei", "abruf": 1, "vid": "q9LW0LCL-Zw", "vq": "nach", "q": "Video «Fine Tuning vs RAG: Was ist besser?» (datasolut): Was waren die Kernaussagen?", "m": "1. Eine Microsoft-Studie von Januar 2024 verglich an drei Open-Source-Modellen Fine-Tuning gegen RAG und stellte fest, dass der reine RAG-Prozess in fast allen Fällen besser abschnitt als reines Fine-Tuning. 2. RAG lässt sich mit einem Studenten vergleichen, der sich nicht vorbereitet, aber Unterlagen mit in die Prüfung nehmen darf, während Fine-Tuning einem Studenten entspricht, der sich intensiv vorbereitet, aber ohne Unterlagen antreten muss. 3. RAG eignet sich laut Video vor allem für Frage-Antwort-Anwendungen wie Hilfe-Chatbots mit wechselndem Wissen, während Fine-Tuning bei Themen mit sehr spezifischem, stabilem Fachwissen und höherem Budget sinnvoller sein kann."}, {"id": "A6.vq.q9LW0LCL-Zw.nach0", "vid": "q9LW0LCL-Zw", "vq": "nach", "t": "mc", "q": "Welchen Vorteil von RAG nennt das Video als ersten Punkt?", "a": ["RAG reduziert die Halluzination des Sprachmodells", "RAG macht das Modell schneller als eine direkte Anfrage", "RAG braucht überhaupt keine Trainingsdaten mehr", "RAG ersetzt die Softmax-Funktion"], "r": 0, "e": "Das Video nennt die Reduktion von Halluzinationen als einen Vorteil von RAG, weil das Modell echte Dokumente als Grundlage bekommt."}, {"id": "A6.vq.q9LW0LCL-Zw.nach1", "vid": "q9LW0LCL-Zw", "vq": "nach", "t": "mc", "q": "Was ist laut Video ein Nachteil von RAG?", "a": ["Es kann das Sprachmodell gar nicht mehr nutzen", "Es hat eine erhöhte Latenz, weil zuerst Dokumente gesucht werden müssen", "Es funktioniert nur mit Bildern", "Es macht das Modell kreativer als gewünscht"], "r": 1, "e": "Weil zwischen Anfrage und Antwort ein zusätzlicher Suchschritt liegt, ist RAG laut Video langsamer als die direkte Kommunikation mit dem Modell."}, {"id": "A6.vq.q9LW0LCL-Zw.nach2", "vid": "q9LW0LCL-Zw", "vq": "nach", "t": "lueck", "q": "Beim Fine-Tuning bekommt das Sprachmodell vorbereitete ___, damit es die passenden Antworten lernt.", "r": ["trainingsdaten"], "e": "Das Video sagt ausdrücklich, dass man beim Fine-Tuning dem Modell Trainingsdaten gibt, damit es lernt, Fragen richtig zu beantworten."}, {"id": "A6.vq.q9LW0LCL-Zw.nach3", "vid": "q9LW0LCL-Zw", "vq": "nach", "t": "frei", "q": "Wo würdest du RAG statt Fine-Tuning einsetzen, wenn du selbst einen Hilfe-Chatbot für ein Unternehmen bauen musstest? Begründe in drei Sätzen.", "m": "Ich würde RAG wählen, weil sich Hilfe-Inhalte ständig ändern und RAG neue Informationen schnell und günstig einbinden kann. Fine-Tuning wäre hier zu teuer und zu langsam, weil jede Änderung ein neues Training bräuchte. Ausserdem zeigt das Video, dass RAG bei Fragen ohne tiefes Spezialwissen die günstigere und schnellere Lösung ist."}, {"id": "A6.vq.q9LW0LCL-Zw.abc", "t": "abc", "abruf": 1, "vid": "q9LW0LCL-Zw", "vq": "nach", "m": ["Chatbot", "Domänenwissen", "Finetuning", "Halluzination", "Interpretierbarkeit", "Kontext", "Kosten", "Latenz", "Paper", "Retrieval", "Trainingsdaten", "Vectorsearch"], "q": "ABC-Liste zu «Fine Tuning vs RAG: Was ist besser?»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A6.vq.q9LW0LCL-Zw.kawa", "t": "kawa", "abruf": 1, "vid": "q9LW0LCL-Zw", "vq": "nach", "wort": "FINETUNE", "m": ["F: Fine-Tuning: das Modell wird mit eigenen Trainingsdaten neu angepasst", "I: Interpretierbarkeit ist bei RAG einfacher als beim direkten Fine-Tuning", "N: Nachteil von Fine-Tuning: es ist extrem teuer und datenhungrig", "E: Enorme Rechenleistung braucht das Anpassen eines grossen Sprachmodells", "T: Trainingsdaten müssen qualitativ hochwertig und von Menschen vorbereitet sein", "U: Unternehmen nutzen Fine-Tuning vor allem für sehr spezialisiertes Wissen"], "q": "KaWa zu «FINETUNE»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A6.vq.00Q0G84kq3M.vor0", "vid": "00Q0G84kq3M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welches der beiden Verfahren, RAG oder Fine-Tuning, verändert die eigentlichen Gewichte des Sprachmodells?", "a": ["RAG", "Fine-Tuning", "Beide gleichermassen", "Keines von beiden"], "r": 1, "e": "Beim Fine-Tuning wird der Kontext direkt in die Gewichte des Modells eingebacken, bei RAG bleibt das Basismodell unverändert."}, {"id": "A6.vq.00Q0G84kq3M.vor1", "vid": "00Q0G84kq3M", "vq": "vor", "t": "mc", "q": "Was glaubst du: Warum konnte das Sprachmodell im Video die Frage nach dem Gewinner der Euro 2024 nicht beantworten?", "a": ["Weil die Frage zu kompliziert war", "Weil das Modell nicht auf diese aktuelle Information trainiert wurde", "Weil Fussball nicht erlaubt ist", "Weil die Frage auf Englisch gestellt wurde"], "r": 1, "e": "Das Modell kennt nur Informationen bis zu seinem Trainingsstichtag und wusste deshalb nichts vom Ergebnis."}, {"id": "A6.v.00Q0G84kq3M", "t": "frei", "abruf": 1, "vid": "00Q0G84kq3M", "vq": "nach", "q": "Video «RAG vs. Fine Tuning» (IBM Technology): Was waren die Kernaussagen?", "m": "1. RAG eignet sich besonders für dynamische Datenquellen wie Datenbanken, bei denen Informationen laufend aktualisiert werden müssen, verursacht aber zusätzliche Latenz durch den Retrieval-Schritt. 2. Fine-Tuning verändert die Gewichte des Modells direkt durch überwachtes Lernen mit Eingabe-Ausgabe-Paaren und ist dadurch bei der Anfrage schneller, weil keine externe Suche nötig ist. 3. Die stärkste Lösung ist laut Video oft eine Kombination aus beidem, etwa ein auf eine Branche fein abgestimmtes Modell, das zusätzlich per RAG aktuelle Quellen einbindet."}, {"id": "A6.vq.00Q0G84kq3M.nach0", "vid": "00Q0G84kq3M", "vq": "nach", "t": "mc", "q": "Wofür eignet sich RAG laut Video besonders gut?", "a": ["Für sich schnell ändernde, dynamische Datenquellen", "Für das Erlernen eines bestimmten Schreibstils", "Für kleinere Kontextfenster", "Für das vollständige Ersetzen des Basismodells"], "r": 0, "e": "RAG passt gut zu dynamischen Datenquellen wie Datenbanken, die laufend aktualisiert werden."}, {"id": "A6.vq.00Q0G84kq3M.nach1", "vid": "00Q0G84kq3M", "vq": "nach", "t": "mc", "q": "Wofür eignet sich Fine-Tuning laut Video besonders gut?", "a": ["Für tagesaktuelle Nachrichten", "Für Branchen mit eigenem Sprachstil und Fachbegriffen", "Für das Zitieren von Quellen", "Für sehr grosse Kontextfenster"], "r": 1, "e": "Fine-Tuning bringt Ton, Stil und Fachvokabular einer Branche in die Gewichte des Modells ein."}, {"id": "A6.vq.00Q0G84kq3M.nach2", "vid": "00Q0G84kq3M", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge nennt das Video als Beispiel für eine Kombination aus RAG und Fine-Tuning bei einem Finanznachrichtendienst?", "a": ["Fine-Tuning auf Finanzfachsprache", "Löschen aller alten Trainingsdaten", "RAG für aktuelle Nachrichtenquellen", "Verzicht auf jegliches Training"], "r": [0, 2], "e": "Das Video schlägt vor, das Modell auf Finanzvokabular zu trainieren und gleichzeitig per RAG aktuelle Quellen einzubinden."}, {"id": "A6.vq.00Q0G84kq3M.nach3", "vid": "00Q0G84kq3M", "vq": "nach", "t": "frei", "q": "Wo hast du selbst schon einmal ein Beispiel für veraltetes Wissen bei einem Chatbot erlebt, wie es das Video mit der Euro-2024-Frage zeigt?", "m": "Zum Beispiel wenn ein Chatbot nach aktuellen Ereignissen, Preisen oder Ergebnissen gefragt wird, die nach seinem Trainingsstichtag passiert sind, und er dann eine falsche oder ausweichende Antwort gibt, weil ihm die aktuellen Informationen fehlen."}, {"id": "A6.vq.00Q0G84kq3M.abc", "t": "abc", "abruf": 1, "vid": "00Q0G84kq3M", "vq": "nach", "m": ["Chatbot", "Domäne", "Fine-Tuning", "Gewichte", "Halluzination", "Inferenzkosten", "Kontextfenster", "Korpus", "Prompt", "Quellen", "RAG", "Retriever", "Trainingsdaten", "Vertrauen"], "q": "ABC-Liste zu «RAG vs. Fine Tuning»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A6.vq.00Q0G84kq3M.kawa", "t": "kawa", "abruf": 1, "vid": "00Q0G84kq3M", "vq": "nach", "wort": "RAG", "m": ["R: Retriever holt aktuelle Informationen aus einem Korpus in Echtzeit.", "A: Aktualität ist die grosse Stärke von RAG bei sich schnell ändernden Daten.", "G: Generierte Antwort nennt zusätzlich die Quelle, aus der sie stammt."], "q": "KaWa zu «RAG»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A6.vq.zYGDpG-pTho.vor0", "vid": "zYGDpG-pTho", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche der drei Methoden ändert tatsächlich die inneren Gewichte eines Sprachmodells?", "a": ["Prompt Engineering", "Retrieval Augmented Generation (RAG)", "Fine-Tuning", "keine von allen"], "r": 2, "e": "Nur beim Fine-Tuning werden die Gewichte des Modells durch zusätzliches Training tatsächlich verändert, RAG und Prompt Engineering lassen das Modell unverändert."}, {"id": "A6.vq.zYGDpG-pTho.vor1", "vid": "zYGDpG-pTho", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man den Effekt, wenn ein feingetuntes Modell beim Lernen neuer Spezialkenntnisse sein allgemeines Wissen wieder verliert?", "a": ["Vektor-Drift", "katastrophales Vergessen", "Halluzination", "Kontext-Kollaps"], "r": 1, "e": "Das Video nennt diesen Nachteil des Fine-Tunings ausdrücklich catastrophic forgetting, auf Deutsch katastrophales Vergessen."}, {"id": "A6.v.zYGDpG-pTho", "t": "frei", "abruf": 1, "vid": "zYGDpG-pTho", "vq": "nach", "q": "Video «RAG vs Fine-Tuning vs Prompt Engineering» (IBM Technology): Was waren die Kernaussagen?", "m": "1. Prompt Engineering kann die Ausgabe eines Modells verbessern, ohne neue Daten oder Training hinzuzufügen, ist aber auf das bereits im Modell vorhandene Wissen beschränkt. 2. Fine-Tuning passt die internen Gewichte eines Modells über zusätzliches überwachtes Training an einen speziellen Anwendungsfall an, birgt dabei aber das Risiko des sogenannten catastrophic forgetting, bei dem das Modell allgemeine Fähigkeiten verliert. 3. RAG wandelt sowohl die Anfrage als auch die Dokumente in Vektor-Embeddings um und findet so semantisch passende Inhalte, selbst wenn diese nicht dieselben Schlüsselwörter wie die Frage enthalten."}, {"id": "A6.vq.zYGDpG-pTho.nach0", "vid": "zYGDpG-pTho", "vq": "nach", "t": "mc", "q": "Warum braucht RAG bei jeder Anfrage etwas länger als ein einfacher Prompt an das Modell?", "a": ["weil das Modell erst neu trainiert werden muss", "weil zuerst ein Retrieval-Schritt durch die Dokumente nötig ist, bevor geantwortet wird", "weil RAG immer mehrere Sprachen gleichzeitig übersetzt", "weil RAG keine Vektoren verwendet"], "r": 1, "e": "Das Video nennt den zusätzlichen Retrieval-Schritt als Grund für die höhere Latenz von RAG im Vergleich zu einem einfachen Prompt."}, {"id": "A6.vq.zYGDpG-pTho.nach1", "vid": "zYGDpG-pTho", "vq": "nach", "t": "ms", "q": "Welche zwei Vorteile nennt das Video für Prompt Engineering?", "a": ["es braucht keine Aenderung an der Infrastruktur", "es kann dem Modell komplett neues Wissen beibringen", "man sieht die Ergebnisse sofort", "es macht eine eigene Vektordatenbank überflüssig, weil keine gebraucht wird"], "r": [0, 2], "e": "Das Video nennt als Vorteile von Prompt Engineering, dass keine Infrastrukturänderung nötig ist und man sofort Ergebnisse sieht. Neues Wissen beibringen kann es dagegen nicht."}, {"id": "A6.vq.zYGDpG-pTho.nach2", "vid": "zYGDpG-pTho", "vq": "nach", "t": "lueck", "q": "Bei RAG werden Dokumente und Anfragen in sogenannte ___ umgewandelt, um Bedeutungsähnlichkeit statt nur Stichworte zu vergleichen.", "r": ["vektor embeddings", "vektoren", "embeddings"], "e": "Das Video erklärt, dass RAG Text in Vektor-Embeddings umwandelt, damit auch inhaltlich ähnliche, aber anders formulierte Dokumente gefunden werden."}, {"id": "A6.vq.zYGDpG-pTho.nach3", "vid": "zYGDpG-pTho", "vq": "nach", "t": "frei", "q": "Stell dir vor, eine Kanzlei will eine KI für juristische Anfragen bauen. Erkläre anhand des Videos, welche der drei Methoden du wofür einsetzen würdest.", "m": "Für aktuelle Gerichtsentscheide und Fallakten würde ich RAG nutzen, damit die KI immer die neuesten Dokumente findet. Mit Prompt Engineering würde ich dafür sorgen, dass die Antworten im richtigen juristischen Format kommen. Und mit Fine-Tuning würde ich dem Modell die internen Richtlinien und den Sprachstil der Kanzlei beibringen, wie es im Video als Beispiel genannt wird."}, {"id": "A6.vq.zYGDpG-pTho.abc", "t": "abc", "abruf": 1, "vid": "zYGDpG-pTho", "vq": "nach", "m": ["Backpropagation", "Catastrophic Forgetting", "Corpus", "Domänenwissen", "Embeddings", "Fine-Tuning", "Gewichte", "Infrastruktur", "Latenz", "Prompt Engineering", "RAG", "Vektor"], "q": "ABC-Liste zu «RAG vs Fine-Tuning vs Prompt Engineering»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A6.vq.zYGDpG-pTho.kawa", "t": "kawa", "abruf": 1, "vid": "zYGDpG-pTho", "vq": "nach", "wort": "PROMPT", "m": ["P: Prompt Engineering: bessere Formulierung ohne neues Training", "R: Reasoning: Schritt-für-Schritt-Anweisungen aktivieren gelerntes methodisches Denken", "O: Output: ein gut formulierter Prompt verändert das Ergebnis ganz ohne neue Daten", "M: Modellgewichte: werden nur beim Fine-Tuning verändert, nicht beim Prompten", "T: Trial and Error: gute Prompts zu finden ist eher Kunst als Wissenschaft, viel Ausprobieren"], "q": "KaWa zu «PROMPT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A6.0", "t": "mc", "q": "Die Preislisten ändern wöchentlich, und jede Antwort muss die Quelle nennen. Was passt?", "a": ["Fine-Tuning", "RAG", "Höhere Temperatur", "Grösseres Modell"], "r": 1, "e": "Aktuelles, wechselndes Wissen mit Quellenbeleg = RAG. Fine-Tuning müsste man bei jeder Änderung wiederholen und liefert keine Quellen."}, {"id": "A6.1", "t": "mc", "q": "Wann ist Fine-Tuning die bessere Wahl?", "a": ["Wenn sich Fakten häufig ändern", "Wenn das Modell einen festen Stil, ein Format oder eine Fachsprache zuverlässig treffen soll", "Wenn Quellen zitiert werden müssen", "Wenn kaum Beispieldaten vorhanden sind"], "r": 1, "e": "Fine-Tuning ändert das Verhalten (Ton, Format, Spezialaufgabe), RAG liefert Wissen. Es braucht viele gute Beispiele."}, {"id": "A6.2", "t": "ms", "q": "Welche zwei Nachteile hat Fine-Tuning gegenüber RAG?", "a": ["Aufwand und Kosten bei jeder Aktualisierung", "Keine Quellenangabe möglich, Wissen ist im Modell «eingebacken»", "Es funktioniert nur auf Englisch", "Es braucht keine Daten"], "r": [0, 1], "e": "Dazu kommt: falsch Gelerntes lässt sich kaum gezielt löschen (Datenschutz)."}, {"id": "A6.3", "t": "frei", "q": "Transfer: Skizziere zwei technisch klar unterscheidbare Lösungsansätze für einen Support-Assistenten und nenne je einen Kipppunkt.", "m": "Ansatz A: Basismodell mit RAG auf der Wissensdatenbank, schnell, aktuell, mit Quellen. Kippt, wenn die Dokumente schlecht gepflegt sind. Ansatz B: feinabgestimmtes eigenes Modell auf historischen Tickets, trifft Ton und Kategorien besser. Kippt bei wenig oder verzerrten Trainingsdaten und bei häufigen Produktänderungen. Oft Kombination: Fine-Tuning für Format, RAG für Fakten."}], "videos": [{"id": "q9LW0LCL-Zw", "kanal": "datasolut", "titel": "Fine Tuning vs RAG: Was ist besser?", "dauer": "7:38"}, {"id": "00Q0G84kq3M", "kanal": "IBM Technology", "titel": "RAG vs. Fine Tuning", "dauer": "8:57"}, {"id": "zYGDpG-pTho", "kanal": "IBM Technology", "titel": "RAG vs Fine-Tuning vs Prompt Engineering", "dauer": "13:10"}], "pn": 8}, {"key": "A7", "titel": "Halluzinationen", "warum": "Challenge 01: die erfundene Datenbanktabelle finden und erklären.", "fragen": [{"id": "A7.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «Halluzinationen»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Challenge 01: die erfundene Datenbanktabelle finden und erklären. Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A7.vq.-ttJuqi8Rho.vor0", "vid": "-ttJuqi8Rho", "vq": "vor", "t": "mc", "q": "Was glaubst du: Welche Stadt nennt die KI im Beispiel des Videos fälschlicherweise als Hauptstadt Australiens?", "a": ["Melbourne", "Sydney", "Canberra", "Perth"], "r": 1, "e": "Im Beispiel behauptet die KI, die Hauptstadt sei Sydney, richtig wäre Canberra gewesen."}, {"id": "A7.vq.-ttJuqi8Rho.vor1", "vid": "-ttJuqi8Rho", "vq": "vor", "t": "mc", "q": "Was glaubst du: Worauf basieren Sprachmodelle wie ChatGPT laut dem Video, wenn sie antworten?", "a": ["Auf überprüften Fakten aus Behörden", "Auf Wahrscheinlichkeiten aus riesigen Datenmengen", "Auf einer täglich aktualisierten Datenbank", "Auf einem festen Regelwerk von Experten"], "r": 1, "e": "Das Video erklärt, dass Sprachmodelle Wahrscheinlichkeiten berechnen und nicht zwingend das sagen, was tatsächlich wahr ist."}, {"id": "A7.v.-ttJuqi8Rho", "t": "frei", "abruf": 1, "vid": "-ttJuqi8Rho", "vq": "nach", "q": "Video «Lügt ChatGPT? 4 Wege, um KI-Fehler zu vermeiden» (Digitalzentrum Berlin): Was waren die Kernaussagen?", "m": "1. Sprachmodelle geben nicht zwingend die Wahrheit wieder, sondern die statistisch wahrscheinlichste Antwort, was zu Halluzinationen wie einer falsch genannten Hauptstadt führen kann. 2. Eine Konsistenzprüfung, bei der dieselbe Frage mehrmals gestellt wird, deckt Unsicherheiten der KI auf, wenn die Antworten dabei voneinander abweichen. 3. Für Themen wie Recht, Gesundheit oder Finanzen sollte die KI laut Video nur als Ergänzung und nicht als alleinige Quelle genutzt werden, weil die Verantwortung für die Richtigkeit weiterhin beim Menschen liegt."}, {"id": "A7.vq.-ttJuqi8Rho.nach0", "vid": "-ttJuqi8Rho", "vq": "nach", "t": "mc", "q": "Wie nennt man laut Video Antworten, die plausibel klingen, aber frei erfunden sind?", "a": ["Simulationen", "Halluzinationen", "Extrapolationen", "Variationen"], "r": 1, "e": "Das Video definiert genau diese erfundenen, aber plausibel klingenden Antworten als Halluzinationen."}, {"id": "A7.vq.-ttJuqi8Rho.nach1", "vid": "-ttJuqi8Rho", "vq": "nach", "t": "ms", "q": "Welche zwei der vier Möglichkeiten nennt das Video, um KI-Antworten auf Richtigkeit zu prüfen?", "a": ["Die gleiche Frage mehrfach stellen", "Die Antwort ignorieren", "Nach Quellen fragen und diese prüfen", "Immer die erste Antwort glauben"], "r": [0, 2], "e": "Konsistenzprüfung durch mehrfaches Fragen und das Einfordern von belegbaren Quellen sind zwei der vier im Video genannten Möglichkeiten."}, {"id": "A7.vq.-ttJuqi8Rho.nach2", "vid": "-ttJuqi8Rho", "vq": "nach", "t": "lueck", "q": "Laut Video sollte man bei Themen wie Recht, Gesundheit oder Finanzen die KI nur als ___ und nicht als alleinige Quelle nutzen.", "r": ["ergaenzung"], "e": "Das Video sagt wörtlich, die KI solle als Ergänzung und nicht als alleinige Quelle dienen."}, {"id": "A7.vq.-ttJuqi8Rho.nach3", "vid": "-ttJuqi8Rho", "vq": "nach", "t": "frei", "q": "Wo könntest du im Alltag oder in der Prüfung selbst prüfen, ob eine KI-Antwort eine Halluzination sein könnte, so wie es das Video vorschlägt?", "m": "Zum Beispiel könnte ich dieselbe Frage der KI zwei- oder dreimal in leicht unterschiedlicher Formulierung stellen und schauen, ob die Antworten übereinstimmen. Wenn die KI angeblich aus einem Fachbuch zitiert, würde ich mir das Zitat zusätzlich von der KI belegen lassen und dann selbst nachschauen, ob die Quelle wirklich existiert."}, {"id": "A7.vq.-ttJuqi8Rho.abc", "t": "abc", "abruf": 1, "vid": "-ttJuqi8Rho", "vq": "nach", "m": ["EU-AI-Act", "Expertin", "Fachbereich", "Halluzination", "Konsistenzprüfung", "Kritisch", "PubMed", "Quelle", "Recherche", "Sprachmodell", "Themenspezifisch", "Wahrscheinlichkeit"], "q": "ABC-Liste zu «Lügt ChatGPT? 4 Wege, um KI-Fehler zu vermeiden»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A7.vq.-ttJuqi8Rho.kawa", "t": "kawa", "abruf": 1, "vid": "-ttJuqi8Rho", "vq": "nach", "wort": "FAKTEN", "m": ["F: Fragen Sie präzise, das ergibt eine genauere Antwort", "A: Antwort mehrfach stellen zur Konsistenzprüfung", "K: Kritisch hinterfragen, auch bei angeblichen Quellenangaben", "T: Themenspezifische KI wie PubMed ist oft verlässlicher", "E: EU AI Act verlangt Kennzeichnung von KI-Texten", "N: Nicht als alleinige Quelle nutzen, bei Recht, Gesundheit, Finanzen"], "q": "KaWa zu «FAKTEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A7.vq.W1Dv2snvuJM.vor0", "vid": "W1Dv2snvuJM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Ist eine KI wie ChatGPT eine Suchmaschine, die echte Fakten nachschlägt?", "a": ["Ja, immer", "Nein, sie berechnet nur das statistisch wahrscheinlichste nächste Wort", "Nur bei Bildanfragen", "Nur wenn Internetzugriff aktiviert ist"], "r": 1, "e": "Laut Video sind Sprachmodelle keine Suchmaschinen, sondern berechnen Wahrscheinlichkeiten für das nächste Wort."}, {"id": "A7.vq.W1Dv2snvuJM.vor1", "vid": "W1Dv2snvuJM", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passierte einem Anwalt in New York, der ChatGPT für eine Gerichtsrecherche nutzte?", "a": ["Er gewann den Prozess dank der KI", "Die KI erfand Gerichtsfälle, die er ungeprüft einreichte", "Die KI korrigierte ihn rechtzeitig selbst", "Es gab keinerlei Probleme"], "r": 1, "e": "Der Anwalt reichte von der KI erfundene Präzedenzfälle ein, ohne sie zu prüfen, und geriet dadurch in grosse Schwierigkeiten."}, {"id": "A7.v.W1Dv2snvuJM", "t": "frei", "abruf": 1, "vid": "W1Dv2snvuJM", "vq": "nach", "q": "Video «Warum deine KI lügt» (KI Kompass): Was waren die Kernaussagen?", "m": "1. Eine KI erfindet bei Wissenslücken keine bewusste Lüge, sondern berechnet die statistisch wahrscheinlichste Fortsetzung des Textes, die dann plausibel, aber falsch klingen kann. 2. Im New Yorker Anwaltsfall reichte ein Jurist von ChatGPT erfundene Gerichtsurteile samt Aktenzeichen ohne Prüfung ein, was zu einer öffentlichen Blamage und einem Karriererisiko führte. 3. Das Video empfiehlt, KI wie einen unerfahrenen Praktikanten zu behandeln: immer Quellen einfordern und verifizieren, Gegenfragen stellen, mehrere Modelle im Quervergleich nutzen und ihr keine Aufgaben mit hohem Fehlerrisiko allein überlassen."}, {"id": "A7.vq.W1Dv2snvuJM.nach0", "vid": "W1Dv2snvuJM", "vq": "nach", "t": "mc", "q": "Warum halluziniert eine KI laut Video, wenn sie eine Antwort nicht sicher weiss?", "a": ["Sie gibt ehrlich zu, es nicht zu wissen", "Sie sucht live im Internet nach der Antwort", "Sie generiert die statistisch wahrscheinlichste Fortsetzung, auch wenn diese erfunden ist", "Sie fragt automatisch eine andere KI um Rat"], "r": 2, "e": "Wie ein Prüfling ohne Antwort füllt die KI die Lücke mit einer plausibel klingenden, aber erfundenen Fortsetzung."}, {"id": "A7.vq.W1Dv2snvuJM.nach1", "vid": "W1Dv2snvuJM", "vq": "nach", "t": "ms", "q": "Welche zwei Massnahmen empfiehlt das Video, um Halluzinationen zu erkennen?", "a": ["Quellen einfordern und selbst überprüfen", "Der ersten KI-Antwort immer sofort vertrauen", "Mehrere KI-Modelle quervergleichen", "Möglichst lange Prompts schreiben"], "r": [0, 2], "e": "Das Video empfiehlt, Quellen zu verlangen und mehrere Modelle wie ChatGPT und Claude zu vergleichen."}, {"id": "A7.vq.W1Dv2snvuJM.nach2", "vid": "W1Dv2snvuJM", "vq": "nach", "t": "lueck", "q": "Das Phänomen, dass eine KI mit voller Sicherheit erfundene Fakten präsentiert, nennt man ___.", "r": ["halluzinieren", "halluzination"], "e": "Genau dieses Verhalten nennt das Video Halluzination."}, {"id": "A7.vq.W1Dv2snvuJM.nach3", "vid": "W1Dv2snvuJM", "vq": "nach", "t": "frei", "q": "Stell dir vor, dein Praktikant bringt dir eine Statistik, die zu gut klingt, um wahr zu sein. Erkläre, was du laut Video als Nächstes tun solltest und warum dasselbe Vorgehen bei einer KI-Antwort gilt.", "m": "Du solltest nach der genauen Quelle fragen und den Link selbst öffnen, um zu prüfen, ob die Zahlen dort wirklich stehen. Genauso solltest du eine KI immer nach Quellen fragen und diese selbst kontrollieren, statt der Antwort blind zu vertrauen."}, {"id": "A7.vq.W1Dv2snvuJM.abc", "t": "abc", "abruf": 1, "vid": "W1Dv2snvuJM", "vq": "nach", "m": ["Fakten", "Gegenfrage", "Halluzination", "Modell", "Praktikant", "Quelle", "Quervergleich", "Recherche", "Vertrauen", "Warnsignal"], "q": "ABC-Liste zu «Warum deine KI lügt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A7.vq.W1Dv2snvuJM.kawa", "t": "kawa", "abruf": 1, "vid": "W1Dv2snvuJM", "vq": "nach", "wort": "FAKTEN", "m": ["F: Fakten: Dinge, die du bei einer KI-Antwort immer überprüfen solltest", "A: Anwalt: reichte von der KI erfundene, ungeprüfte Gerichtsfälle ein", "K: KI: berechnet nur Wahrscheinlichkeiten und weiss selbst nichts wirklich", "T: Trainiert: das Modell wurde mit riesigen Mengen an Text trainiert", "E: Experte: bleib in der Expertenrolle und nutze KI nur als Assistent", "N: Nachfragen: stelle der KI gezielt Gegenfragen, um Schwachstellen zu finden"], "q": "KaWa zu «FAKTEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A7.vq.cumYLnkXJ-I.vor0", "vid": "cumYLnkXJ-I", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie nennt man es, wenn eine KI Fakten erfindet, die es gar nicht gibt?", "a": ["Bug", "Halluzination", "Overfitting", "Bias"], "r": 1, "e": "Das Video nennt erfundene Fakten explizit Halluzinationen."}, {"id": "A7.vq.cumYLnkXJ-I.vor1", "vid": "cumYLnkXJ-I", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Haupttypen von Halluzinationen unterscheidet das Video?", "a": ["Einen", "Zwei", "Vier", "Sechs"], "r": 1, "e": "Das Video unterscheidet erfundene Inhalte und falsche Kombinationen, also zwei Haupttypen."}, {"id": "A7.v.cumYLnkXJ-I", "t": "frei", "abruf": 1, "vid": "cumYLnkXJ-I", "vq": "nach", "q": "Video «Warum KI dich anlügt: Halluzinationen einfach erklärt» (cloudstrive): Was waren die Kernaussagen?", "m": "1. Das Video unterscheidet zwei Arten von Halluzinationen: komplett erfundene Inhalte wie nicht existierende Personen oder Links, und falsche Kombinationen, bei denen zwei richtige Fakten zu einer falschen Schlussfolgerung verknüpft werden. 2. Der Wissensstand eines Modells endet an seinem Knowledge Cutoff, ab dem es keine neuen Ereignisse mehr kennt, wobei sich dieser Zeitpunkt je nach Modellversion unterscheidet und die Selbstauskunft des Modells dazu nicht zuverlässig ist. 3. Klare, präzise Prompts sowie das Vorgeben von Beispielen für das gewünschte Ergebnis, sogenanntes Few-Shot-Prompting, reduzieren laut Video das Risiko, dass die KI Lücken mit erfundenen Details füllt."}, {"id": "A7.vq.cumYLnkXJ-I.nach0", "vid": "cumYLnkXJ-I", "vq": "nach", "t": "mc", "q": "Welches Beispiel nennt das Video für eine Halluzination mit realen Konsequenzen?", "a": ["Ein Chatbot empfahl das falsche Restaurant", "Erfundene Gerichtsurteile brachten Anwälte in Schwierigkeiten", "Eine KI gewann ein Schachspiel", "Ein Übersetzungsfehler in einer E-Mail"], "r": 1, "e": "Das Video nennt fiktive Gerichtsurteile, die Anwälte in eine teure und brenzlige Lage gebracht haben."}, {"id": "A7.vq.cumYLnkXJ-I.nach1", "vid": "cumYLnkXJ-I", "vq": "nach", "t": "ms", "q": "Welche zwei Haupttypen von Halluzinationen nennt das Video?", "a": ["Erfundene Inhalte, die gar nicht existieren", "Übersetzungsfehler zwischen Sprachen", "Falsche Kombinationen aus zwei korrekten Fakten", "Zu langsame Antwortzeiten"], "r": [0, 2], "e": "Typ 1 sind komplett erfundene Dinge, Typ 2 sind falsch kombinierte, eigentlich korrekte Fakten."}, {"id": "A7.vq.cumYLnkXJ-I.nach2", "vid": "cumYLnkXJ-I", "vq": "nach", "t": "ord", "q": "Bringe die drei Strategien gegen Halluzinationen in die Reihenfolge, wie sie im Video zusammengefasst werden:", "a": ["Klare Eingaben formulieren", "Kreativitätseinstellungen nutzen", "Multishot-Prompting mit mehreren Beispielen"], "e": "Im Zusammenfassungsteil nennt das Video genau diese drei Strategien in dieser Reihenfolge."}, {"id": "A7.vq.cumYLnkXJ-I.nach3", "vid": "cumYLnkXJ-I", "vq": "nach", "t": "frei", "q": "Erkläre anhand des Beispiels Bild aufhängen in der alten Wohnung aus dem Video, warum KI manchmal falsche Verbindungen herstellt.", "m": "Die KI versucht, Gelerntes aus einer Situation auf eine neue zu übertragen, so wie ein Mensch einen Hammer benutzt, der in der alten Wohnung funktioniert hat. Das klappt oft, aber nicht immer, weil die neue Situation anders sein kann. Genauso vermischt die KI manchmal ähnliche Muster und zieht daraus falsche Schlüsse."}, {"id": "A7.vq.cumYLnkXJ-I.abc", "t": "abc", "abruf": 1, "vid": "cumYLnkXJ-I", "vq": "nach", "m": ["Anwalt", "Datenqualität", "Erfundene Inhalte", "Falsche Kombination", "Gerichtsurteil", "Halluzination", "Knowledge Cutoff", "LLM", "Multishot", "Trainingsdaten", "Verallgemeinerung", "Wissenslücke"], "q": "ABC-Liste zu «Warum KI dich anlügt: Halluzinationen einfach erklärt»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A7.vq.cumYLnkXJ-I.kawa", "t": "kawa", "abruf": 1, "vid": "cumYLnkXJ-I", "vq": "nach", "wort": "GRENZEN", "m": ["G: Grenzen der Trainingsdaten: die KI weiss nicht alles und füllt Lücken mit erfundenen Details", "R: Redet drauflos: wenn Informationen fehlen, füllt die KI die Lücke mit erfundenen Details", "E: Erfundene Fakten: Personen, Zahlen oder Dokumente, die es nicht gibt", "N: Nicht deterministisch: dieselbe Frage kann unterschiedliche Antworten liefern", "Z: Zwei Anwälte gerieten wegen erfundener Gerichtsurteile in Schwierigkeiten"], "q": "KaWa zu «GRENZEN»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A7.0", "t": "mc", "q": "Was ist eine Halluzination?", "a": ["Ein Absturz des Modells", "Eine flüssig formulierte, aber erfundene oder falsche Aussage", "Eine absichtliche Lüge des Anbieters", "Eine zu langsame Antwort"], "r": 1, "e": "Das Modell optimiert auf plausible Wortfolgen, nicht auf Wahrheit. Ohne Information rät es, statt «weiss ich nicht» zu sagen."}, {"id": "A7.1", "t": "ms", "q": "Welche drei Massnahmen senken das Halluzinationsrisiko?", "a": ["Quellen mitgeben (RAG) und Quellenbeleg verlangen", "Antworten ohne belastbare Quelle blockieren oder kennzeichnen", "Temperatur auf 2 erhöhen", "Ausgabe gegen feste Regeln oder Schema prüfen", "Dem Modell drohen"], "r": [0, 1, 3], "e": "Grounding, Sperre bei fehlender Quelle, deterministische Validierung. Ganz auf null bringt man es nicht."}, {"id": "A7.2", "t": "mc", "q": "Ein Assistent erzeugt eine SQL-Abfrage auf die Tabelle «suppliers_i18n». Die Datenbank meldet: Tabelle existiert nicht. Was ist passiert?", "a": ["Die Datenbank ist defekt", "Das Modell hat aus dem Namensmuster anderer Tabellen eine plausible, aber nicht existierende Tabelle erfunden", "Der Nutzer hat sich vertippt", "Die API war überlastet"], "r": 1, "e": "Klassische Halluzination aus Mustern (andere Tabellen haben _i18n). Gegenmittel: echtes Schema in den Prompt, Abfrage vor Ausführung validieren."}, {"id": "A7.3", "t": "frei", "q": "Erkläre, warum ein Sprachmodell nicht von selbst «Das weiss ich nicht» sagt.", "m": "Es wurde darauf trainiert, immer das wahrscheinlichste nächste Wort zu liefern, und fast immer gibt es ein plausibles. Es hat keinen eingebauten Abgleich mit der Wirklichkeit. «Weiss ich nicht» muss man erzwingen: durch Anweisung, durch Pflicht zum Quellenbeleg und durch eine Regel, die Antworten ohne Quelle sperrt."}], "videos": [{"id": "-ttJuqi8Rho", "kanal": "Digitalzentrum Berlin", "titel": "Lügt ChatGPT? 4 Wege, um KI-Fehler zu vermeiden", "dauer": "5:21"}, {"id": "W1Dv2snvuJM", "kanal": "KI Kompass", "titel": "Warum deine KI lügt", "dauer": "7:42"}, {"id": "cumYLnkXJ-I", "kanal": "cloudstrive", "titel": "Warum KI dich anlügt: Halluzinationen einfach erklärt", "dauer": "12:10"}], "pn": 3}, {"key": "A8", "titel": "KI-Agenten", "warum": "Nullserie Challenge 03 heisst «KI-Agent bei MedFinder».", "fragen": [{"id": "A8.abruf", "t": "frei", "abruf": 1, "q": "Freier Abruf nach dem Video zu «KI-Agenten»: Schreib aus dem Kopf die drei wichtigsten Aussagen auf und wo das in der Prüfung vorkommt.", "m": "Wofür in der Prüfung: Nullserie Challenge 03 heisst «KI-Agent bei MedFinder». Vergleiche deine drei Aussagen mit den folgenden Karten. Was dir dort neu vorkommt, hast du im Video verpasst."}, {"id": "A8.vq.yN2iYWbwFFs.vor0", "vid": "yN2iYWbwFFs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was unterscheidet laut Video einen KI-Workflow von einem KI-Agenten?", "a": ["Ein Agent braucht kein Internet", "Ein Agent plant selbstständig und iteriert selbst über das Ergebnis, ein Workflow folgt nur vorgegebenen Schritten", "Ein Agent ist immer teurer als ein Workflow", "Es gibt technisch keinen Unterschied"], "r": 1, "e": "Das Video sagt genau das: Planung und Iteration selbst zu übernehmen, macht aus einem Workflow einen Agenten."}, {"id": "A8.vq.yN2iYWbwFFs.vor1", "vid": "yN2iYWbwFFs", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert, wenn du ChatGPT direkt bittest, ein Meeting in deinem Kalender einzutragen?", "a": ["Es klappt sofort ohne Probleme", "Es scheitert, weil das Modell ohne Tool keinen Zugriff auf den Kalender hat", "Es löscht versehentlich den Kalender", "Es fragt automatisch bei Google Calendar nach Zugang"], "r": 1, "e": "Das Video zeigt genau dieses Beispiel: ohne angebundenes Tool hat das reine LLM keinen Kalenderzugriff."}, {"id": "A8.v.yN2iYWbwFFs", "t": "frei", "abruf": 1, "vid": "yN2iYWbwFFs", "vq": "nach", "q": "Video «KI Agenten für Beginner: Alle Grundlagen in 9 Min» (Jonas Keil): Was waren die Kernaussagen?", "m": "1. Ein einfaches Sprachmodell erzeugt nur eine Ausgabe zu einer Eingabe, kann aber keine Werkzeuge wie einen Kalender bedienen, liefert keine konsistenten Ergebnisse und wird nie von selbst aktiv. 2. Ein KI-Workflow verbindet ein Sprachmodell fest mit Werkzeugen wie E-Mail oder Kalender entlang einer vorher festgelegten Steuerlogik, liefert dadurch vorhersehbare Ergebnisse, kann aber nicht von diesem Pfad abweichen. 3. Ein KI-Agent unterscheidet sich vom Workflow dadurch, dass er selbst plant, welche Werkzeuge er wann einsetzt, und über das eigene Ergebnis iteriert, statt dass ein Mensch diese Schritte vorab fest verdrahtet."}, {"id": "A8.vq.yN2iYWbwFFs.nach0", "vid": "yN2iYWbwFFs", "vq": "nach", "t": "mc", "q": "Was ist laut Video ein KI-Workflow?", "a": ["Ein Sprachmodell, das komplett ohne Werkzeuge arbeitet", "Ein Sprachmodell, das über Tools verfügt und einer fest vorgegebenen Steuerlogik folgt", "Ein Agent, der komplett eigenständig plant", "Eine Datenbank für Prompts"], "r": 1, "e": "Das Video definiert den Workflow als LLM plus Tools plus fest vorgegebener Steuerlogik."}, {"id": "A8.vq.yN2iYWbwFFs.nach1", "vid": "yN2iYWbwFFs", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge macht ein KI-Agent laut Video zusätzlich zum Workflow selbstständig?", "a": ["Er plant selbst, wie er ein Problem angeht", "Er iteriert selbst über das Ergebnis, statt dass der Mensch den Prompt anpasst", "Er braucht nie ein Sprachmodell", "Er kann keine Tools benutzen"], "r": [0, 1], "e": "Genau diese zwei Punkte, Planung und Iteration, unterscheiden laut Video den Agenten vom Workflow."}, {"id": "A8.vq.yN2iYWbwFFs.nach2", "vid": "yN2iYWbwFFs", "vq": "nach", "t": "ord", "q": "Bringe den Aufbau in die richtige Reihenfolge, wie das Video vom LLM zum Agenten kommt.", "a": ["LLM: Eingabe erzeugt Ausgabe, aber ohne Werkzeuge", "KI-Workflow: Tools werden eingebunden, ein fester Ablauf ist vorgegeben", "KI-Agent: Planung und Iteration werden zusätzlich an das Modell selbst übergeben"], "e": "Das Video baut diese drei Stufen genau in dieser Reihenfolge auf: LLM, Workflow, Agent."}, {"id": "A8.vq.yN2iYWbwFFs.nach3", "vid": "yN2iYWbwFFs", "vq": "nach", "t": "frei", "q": "Wo hast du im Job schon mal etwas erlebt, das eher einem starren KI-Workflow als einem KI-Agenten entsprach, so wie im Video beschrieben?", "m": "Zum Beispiel eine automatische Weiterleitung von Kundenmails an eine feste Ablage, die immer denselben Schritten folgt. Der Mensch muss dabei jede Anpassung selbst planen, das Programm entscheidet nichts eigenständig. Genau das entspricht dem starren Workflow ohne eigene Planung."}, {"id": "A8.vq.yN2iYWbwFFs.abc", "t": "abc", "abruf": 1, "vid": "yN2iYWbwFFs", "vq": "nach", "m": ["Agent", "Blogpost", "Claude Code", "Halluzination", "Iteration", "Kalender", "Modul", "Planung", "Reproduzierbar", "Steuerlogik", "Tool", "Workflow"], "q": "ABC-Liste zu «KI Agenten für Beginner: Alle Grundlagen in 9 Min»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A8.vq.yN2iYWbwFFs.kawa", "t": "kawa", "abruf": 1, "vid": "yN2iYWbwFFs", "vq": "nach", "wort": "AGENT", "m": ["A: Agent: plant und iteriert selbstständig über das Ergebnis", "G: Google Sheets: Ausgangspunkt der Automatisierung im Beispiel", "E: E-Mail: Beispielaufgabe, die ein LLM allein nicht im Kalender eintragen kann", "N: Notion: ein Tool, das mit dem LLM verknüpft werden kann", "T: Tool: fehlt dem reinen LLM, macht daraus erst einen Workflow"], "q": "KaWa zu «AGENT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A8.vq.GgYBe6I4aHQ.vor0", "vid": "GgYBe6I4aHQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was unterscheidet laut Video einen KI-Agenten von einem einfachen Chatbot?", "a": ["Der Agent hat Zugriff auf Tools und kann echte Dinge auf dem Rechner tun", "Der Agent kann nur Text ausgeben, sonst nichts", "Der Agent braucht kein Sprachmodell", "Der Agent ist immer langsamer als ein Chatbot"], "r": 0, "e": "Laut Video bekommt ein Agent Tools, um Aufgaben wiederholt selbstständig auszuführen, das macht ihn autonomer als einen Chatbot."}, {"id": "A8.vq.GgYBe6I4aHQ.vor1", "vid": "GgYBe6I4aHQ", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wozu dient die globale Memory-Datei zum Beispiel Cloud.md laut Video?", "a": ["Sie speichert dauerhaftes Wissen über dich und das Projekt, das der Agent im Kontext behält", "Sie speichert nur Passwörter", "Sie ersetzt das Sprachmodell komplett", "Sie wird nach jeder Sitzung automatisch gelöscht"], "r": 0, "e": "Die Memory-Datei ist laut Video eine Textdatei, die Wissen über dich und dein Projekt dauerhaft im Kontext des Agenten hält."}, {"id": "A8.v.GgYBe6I4aHQ", "t": "frei", "abruf": 1, "vid": "GgYBe6I4aHQ", "vq": "nach", "q": "Video «KI-Agenten richtig nutzen: die Grundlagen» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Der Unterschied zwischen einem Chatbot und einem Agenten liegt laut Video darin, dass der Agent einen Auftrag wiederholt selbstständig weiterverfolgt und dabei über Tools auf dem Rechner tatsächliche Handlungen ausführen kann. 2. Eine globale Memory-Datei speichert dauerhaftes Wissen über Nutzer und Projekt, das der Agent bei jeder Anfrage automatisch im Kontext hat, ohne dass es jedes Mal neu eingegeben werden muss. 3. Das Model Context Protocol, kurz MCP, ist ein Standard, der einem Agenten erklärt, wie er ein bestimmtes externes Werkzeug technisch bedienen kann, ähnlich einem Handbuch für ein Gerät."}, {"id": "A8.vq.GgYBe6I4aHQ.nach0", "vid": "GgYBe6I4aHQ", "vq": "nach", "t": "mc", "q": "Wofür steht MCP laut Video?", "a": ["Multi Chat Protocol", "Model Context Protocol", "Managed Cloud Platform", "Machine Control Program"], "r": 1, "e": "MCP steht laut Video für Model Context Protocol, es ist quasi das Handbuch, das dem Agenten sagt, wie er ein Tool benutzt."}, {"id": "A8.vq.GgYBe6I4aHQ.nach1", "vid": "GgYBe6I4aHQ", "vq": "nach", "t": "mc", "q": "Wie beschreibt das Video einen Skill?", "a": ["Als eine Textdatei, die erklärt, wie eine Aufgabe auszuführen ist", "Als ein physisches Bauteil im Rechner", "Als eine Grafikkarte", "Als eine Art Passwortmanager"], "r": 0, "e": "Ein Skill ist laut Video letztlich nur eine Textdatei in einem bestimmten Format, die dem Agenten eine Anleitung gibt."}, {"id": "A8.vq.GgYBe6I4aHQ.nach2", "vid": "GgYBe6I4aHQ", "vq": "nach", "t": "ms", "q": "Welche zwei Dinge nennt das Video als Beispiele dafür, was in einer Agent-Datei stehen sollte?", "a": ["Wie man mit Subagents arbeiten möchte", "Persönliche Informationen wie der eigene Name", "Die IP-Adresse des Firmenservers", "Das Passwort des E-Mail-Kontos"], "r": [0, 1], "e": "Das Video nennt als Beispiele, dass in der Agent-Datei stehen kann, wie man mit Subagents arbeiten möchte, und persönliche Erinnerungen wie den eigenen Namen."}, {"id": "A8.vq.GgYBe6I4aHQ.nach3", "vid": "GgYBe6I4aHQ", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie einen KI-Agenten benutzt hat, wozu Hooks laut Video gut sind.", "m": "Hooks sind laut Video dafür da, echte Sicherheitsgrenzen zu setzen, damit ein Agent keine schlimmen Dinge auf dem Rechner anrichtet. Während ein Skill dem Agenten nur freiwillig sagt, was er tun soll, können Hooks bestimmte Aktionen technisch verhindern oder erzwingen. Das ist wichtig, weil sich ein Agent laut Video nur freiwillig an Anweisungen wie Geschwindigkeitsbegrenzungen hält."}, {"id": "A8.vq.GgYBe6I4aHQ.abc", "t": "abc", "abruf": 1, "vid": "GgYBe6I4aHQ", "vq": "nach", "m": ["Agent", "Autonomie", "Harness", "Hook", "Kontext", "Loop", "MCP", "Memory", "Plugin", "Prompt", "Skill", "Tool"], "q": "ABC-Liste zu «KI-Agenten richtig nutzen: die Grundlagen»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A8.vq.GgYBe6I4aHQ.kawa", "t": "kawa", "abruf": 1, "vid": "GgYBe6I4aHQ", "vq": "nach", "wort": "AGENT", "m": ["A: Autonomie: der Agent handelt selbstständig über mehrere Schritte", "G: Globale Memory-Datei speichert dauerhaftes Wissen über dich", "E: Erinnerungen legt man in der Memory-Datei ab, damit der Agent sie behält", "N: Nutzt Tools, um wirklich etwas auf dem Rechner zu verändern", "T: Tools verbindet der Agent über das Model Context Protocol"], "q": "KaWa zu «AGENT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A8.vq.BpxtgN6HMdc.vor0", "vid": "BpxtgN6HMdc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was kann ein normales Sprachmodell mit RAG im Kundenservice NICHT leisten?", "a": ["Einfache Anfragen beantworten", "Ein Ticket für eine komplexe Anfrage erstellen", "Auf interne Daten zugreifen", "Text verstehen"], "r": 1, "e": "Sobald ein Ticket erstellt oder eine Aktion ausgelöst werden muss, reicht ein einfaches Sprachmodell nicht mehr, dafür braucht es einen Agenten."}, {"id": "A8.vq.BpxtgN6HMdc.vor1", "vid": "BpxtgN6HMdc", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele zusätzliche Funktionalitäten unterscheiden laut Video einen LLM-Agenten von einem einfachen Sprachmodell?", "a": ["Eine", "Zwei", "Drei", "Vier"], "r": 2, "e": "Das Video nennt Tools, Memory und Planning als die drei zusätzlichen Funktionalitäten."}, {"id": "A8.v.BpxtgN6HMdc", "t": "frei", "abruf": 1, "vid": "BpxtgN6HMdc", "vq": "nach", "q": "Video «Was du über KI-Agenten wissen musst!» (datasolut): Was waren die Kernaussagen?", "m": "1. Ein einfaches Sprachmodell kann einfache Kundenanfragen beantworten, scheitert aber bei komplexeren Aufgaben wie dem Erstellen eines Support-Tickets, weil ihm Werkzeuge und Handlungsfähigkeit fehlen. 2. Ein LLM-Agent verfügt zusätzlich über Zugriff auf Tools wie Ticketsysteme, eine Memory-Funktion für frühere Konversationen und eine Planning-Funktion, mit der er die nötigen Schritte zur Lösung einer Aufgabe selbst bestimmt. 3. Anthropic unterscheidet laut Video zwischen statischen KI-Workflows mit festem Regelwerk und autonomeren Agentensystemen mit mehr Entscheidungsfreiheit, wobei Agenten dadurch weniger vorhersehbare, aber flexiblere Ergebnisse liefern."}, {"id": "A8.vq.BpxtgN6HMdc.nach0", "vid": "BpxtgN6HMdc", "vq": "nach", "t": "mc", "q": "Welche drei Funktionalitäten unterscheiden laut Video einen LLM-Agenten von einem einfachen Sprachmodell?", "a": ["Tools, Memory, Planning", "Training, Testing, Deployment", "Prompt, Kontext, Antwort", "Login, Passwort, Sicherheit"], "r": 0, "e": "Das Video nennt Zugriff auf Tools, eine Memory-Funktion und Planning als die drei zusätzlichen Fähigkeiten eines Agenten."}, {"id": "A8.vq.BpxtgN6HMdc.nach1", "vid": "BpxtgN6HMdc", "vq": "nach", "t": "mc", "q": "Wie unterscheidet Anthropic laut Video KI-Workflows von KI-Agenten?", "a": ["Workflows sind autonomer als Agenten", "Workflows sind statisch und regelbasiert, Agenten sind autonomer", "Beide sind identisch definiert", "Agenten haben keinen Zugriff auf Tools"], "r": 1, "e": "Workflows laufen nach festen Regeln ab, Agenten handeln autonomer mit weniger Einschränkungen."}, {"id": "A8.vq.BpxtgN6HMdc.nach2", "vid": "BpxtgN6HMdc", "vq": "nach", "t": "ms", "q": "Welche zwei Einsatzbereiche für LLM-Agenten nennt das Video?", "a": ["Kundenservice", "Wettervorhersage", "Code-Entwicklung", "Steuererklärung"], "r": [0, 2], "e": "Das Video nennt Kundenservice und Code-Entwicklung als zwei von mehreren Einsatzbereichen für Agenten."}, {"id": "A8.vq.BpxtgN6HMdc.nach3", "vid": "BpxtgN6HMdc", "vq": "nach", "t": "frei", "q": "Erkläre an einem Beispiel aus deinem Alltag, wann eine einfache Automatisierung reicht und wann ein autonomer Agent nötig wäre.", "m": "Eine einfache Automatisierung reicht, wenn immer dieselben festen Schritte ablaufen, zum Beispiel eine automatische Antwort-E-Mail nach einer Bestellung. Ein Agent wird nötig, wenn die Anfrage unterschiedlich ausfallen kann und selbst entschieden werden muss, welche Werkzeuge oder Schritte nötig sind, zum Beispiel bei einer komplexen Kundenbeschwerde, die klassifiziert, beantwortet oder weitergeleitet werden muss."}, {"id": "A8.vq.BpxtgN6HMdc.abc", "t": "abc", "abruf": 1, "vid": "BpxtgN6HMdc", "vq": "nach", "m": ["Agent", "Anthropic", "API", "Autonom", "Classifier", "Datenanalyse", "Kundenservice", "Memory", "Planning", "Ticketsystem", "Tools", "Workflow"], "q": "ABC-Liste zu «Was du über KI-Agenten wissen musst!»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A8.vq.BpxtgN6HMdc.kawa", "t": "kawa", "abruf": 1, "vid": "BpxtgN6HMdc", "vq": "nach", "wort": "AGENT", "m": ["A: Autonom handelt der Agent mit weniger festen Regeln als ein Workflow.", "G: Geschäftsprozesse werden im Kundenservice mit Agenten automatisiert.", "E: Erinnerung (Memory) hilft dem Agenten, vorherige Gespräche zu nutzen.", "N: Nutzung von Tools wie einem Klassifikator oder Ticketsystem gehört dazu.", "T: Tools geben dem Agenten Zugriff auf Systeme wie ein Ticketsystem."], "q": "KaWa zu «AGENT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A8.vq.hiCthsCiJow.vor0", "vid": "hiCthsCiJow", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wer hat den Begriff 'Autonomy Slider' geprägt, um den Unterschied zwischen Chatbot und Agent zu beschreiben?", "a": ["Sam Altman", "Andrej Karpathy", "Bill Gates", "Anthropic als Firma"], "r": 1, "e": "Im Video wird Andrej Karpathy als einer der Köpfe der KI-Szene genannt, der den Begriff Autonomy Slider geprägt hat."}, {"id": "A8.vq.hiCthsCiJow.vor1", "vid": "hiCthsCiJow", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was braucht ein Unternehmen laut Video zwingend, bevor ein Agent auf Firmendaten wie Kalender oder Mails zugreifen darf?", "a": ["ein besonders teures Abo", "gar nichts, das ist automatisch erlaubt", "einen Auftragsverarbeitungsvertrag (DPA)", "eine eigene Programmiersprache"], "r": 2, "e": "Das Video betont, dass für den Zugriff auf Firmendaten ein Business-Account mit einer vertraglichen Grundlage, dem DPA, nötig ist."}, {"id": "A8.v.hiCthsCiJow", "t": "frei", "abruf": 1, "vid": "hiCthsCiJow", "vq": "nach", "q": "Video «Wer braucht noch Chatbots? SO funktionieren KI Agenten in ChatGPT und Co.» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Der Autonomy Slider (Begriff von Andrej Karpathy) beschreibt die Skala zwischen einem Chatbot, der auf jede Frage manuell eine Antwort gibt, und einem Agent, der selbstständig entscheidet, welche Tools er für eine Aufgabe braucht. 2. Ein KI-Agent bekommt über angebundene Apps wie Kalender oder Gmail zusätzlichen Kontext, für die geschäftliche Nutzung ist dafür aber ein Business-Account mit einer Datenschutz-Vereinbarung (DPA) nötig, die es beim privaten Account nicht gibt. 3. MCP (Model Context Protocol), von Anthropic bereitgestellt, ist ein Standardprotokoll, nach dem ein Agent auf externe Werkzeuge wie E-Mail oder Kalender zugreifen kann; alternativ gibt es den direkteren CLI-Zugriff mit minimalerem Datenumfang."}, {"id": "A8.vq.hiCthsCiJow.nach0", "vid": "hiCthsCiJow", "vq": "nach", "t": "mc", "q": "Was unterscheidet einen Agent laut Video am stärksten von einem klassischen Chatbot?", "a": ["ein Agent kann nur Text ausgeben, kein Bild", "ein Agent entscheidet selbstständig, welche Tools und Schritte er für eine Aufgabe braucht", "ein Agent ist immer kostenlos", "ein Agent kann keine E-Mails lesen"], "r": 1, "e": "Das Video beschreibt den Agent als deutlich autonomer: er entscheidet selbst, welches Tool er für eine Aufgabe braucht, statt nur auf einzelne Fragen zu antworten."}, {"id": "A8.vq.hiCthsCiJow.nach1", "vid": "hiCthsCiJow", "vq": "nach", "t": "ms", "q": "Welche Bestandteile gehören laut Video zum 'Gen Dreieck', mit dem man Agenten steuert?", "a": ["Modell", "Kontext", "Lautstärke", "Prompt"], "r": [0, 1, 3], "e": "Das Video nennt das Gen Dreieck aus Modell, Context und Prompt als Steuerungsgrössen für einen Agenten."}, {"id": "A8.vq.hiCthsCiJow.nach2", "vid": "hiCthsCiJow", "vq": "nach", "t": "lueck", "q": "Das Standardprotokoll, mit dem ein Agent zum Beispiel Gmail oder den Kalender lesen kann, heisst ___.", "r": ["mcp", "model context protocol"], "e": "Das Video erklärt, dass MCP (Model Context Protocol) die geschriebene Anleitung ist, der Agents folgen, um auf Apps zuzugreifen."}, {"id": "A8.vq.hiCthsCiJow.nach3", "vid": "hiCthsCiJow", "vq": "nach", "t": "frei", "q": "Erkläre jemandem, der noch nie einen KI-Agenten benutzt hat, in drei Sätzen den Unterschied zwischen einem Chatbot und einem Agenten.", "m": "Ein Chatbot beantwortet einzelne Fragen, man muss also jeden Schritt selbst vorgeben und die Antwort abholen. Ein Agent bekommt stattdessen eine ganze Aufgabe und entscheidet selbstständig, welche Werkzeuge wie Kalender, Mail oder Websuche er dafür braucht. Dadurch kann ein Agent zum Beispiel selbstständig eine E-Mail als Entwurf vorbereiten, während ein Chatbot nur einen Textvorschlag liefert."}, {"id": "A8.vq.hiCthsCiJow.abc", "t": "abc", "abruf": 1, "vid": "hiCthsCiJow", "vq": "nach", "m": ["Agent", "Autonomy Slider", "Chatbot", "CLI", "DPA", "Kalender", "Kontext", "MCP", "Prompt", "Skill", "Tool", "Workflow"], "q": "ABC-Liste zu «Wer braucht noch Chatbots? SO funktionieren KI Agenten in ChatGPT und Co.»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A8.vq.hiCthsCiJow.kawa", "t": "kawa", "abruf": 1, "vid": "hiCthsCiJow", "vq": "nach", "wort": "AGENT", "m": ["A: Autonomy Slider: zeigt, wie manuell oder autonom ein Werkzeug arbeitet", "G: Gen Dreieck: Modell, Kontext und Prompt steuern den Agenten", "E: E-Mail-Entwurf: der Agent legt selbstständig ein Draft in Gmail an", "N: Nutzung von Apps: Kalender und Mail geben dem Agent mehr Kontext", "T: Tool: der Agent entscheidet selbst, welches Tool er für eine Aufgabe nutzt"], "q": "KaWa zu «AGENT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A8.vq.C_sR-eLujQA.vor0", "vid": "C_sR-eLujQA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wie viele Agenten wird es laut dem im Video zitierten Microsoft-CEO in Zukunft pro Unternehmen geben?", "a": ["So viele wie E-Mail-Adressen", "So viele wie Excel-Tabellen", "Nur einen einzigen zentralen Agenten", "So viele wie Mitarbeitende insgesamt"], "r": 1, "e": "Der Gast zitiert Satya Nadella mit der Aussage, es werde in jedem Unternehmen so viele Agenten geben wie heute Excel-Sheets."}, {"id": "A8.vq.C_sR-eLujQA.vor1", "vid": "C_sR-eLujQA", "vq": "vor", "t": "mc", "q": "Was glaubst du: Um wie viel Prozent stieg laut Video die Vertriebspipeline bei Mitarbeitenden, die die KI-Tools nutzen?", "a": ["Etwa 2 Prozent", "Etwa 20 Prozent", "Etwa 50 Prozent", "Etwa 80 Prozent"], "r": 1, "e": "Das Video nennt konkret etwa 20 Prozent mehr Pipeline und 10 Prozent mehr Umsatz bei Nutzenden der Tools."}, {"id": "A8.v.C_sR-eLujQA", "t": "frei", "abruf": 1, "vid": "C_sR-eLujQA", "vq": "nach", "q": "Video «Wie KI-Agenten bei Microsoft den Mittelstand transformieren | Oliver Gürtler» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Oliver Gürtler beschreibt die Reise eines Unternehmens von reiner Chat-Nutzung über bessere Datennutzung im Office Graph bis zu selbst gebauten Agenten und schliesslich zum Agent Boss, der Agenten wie Mitarbeitende im Organigramm führt. 2. Beim eigenen Sales-Agenten, der Kundendaten und frühere Erfolgsgeschichten auswertet, wurde per A/B-Testing bei denselben Mitarbeitenden eine Steigerung von etwa 20 Prozent mehr Pipeline und 10 Prozent mehr Umsatz gemessen. 3. Als Sicherheitskonzept für Agenten nennt Gürtler Microsofts Identitätslösung Entra: Jeder Agent braucht wie ein Mitarbeiter eine eigene Identität mit klar hinterlegten Zugriffsrechten."}, {"id": "A8.vq.C_sR-eLujQA.nach0", "vid": "C_sR-eLujQA", "vq": "nach", "t": "mc", "q": "In welchen Branchen ist laut dem Microsoft-Vertreter die Adaption von Copilot am höchsten?", "a": ["Steuerberatung und Notarrecht", "Landwirtschaft und Fischerei", "Gastronomie und Tourismus", "Bergbau und Energie"], "r": 0, "e": "Er nennt ausdrücklich Steuerberatung und Notarrecht als Branchen mit der höchsten Adaption, weil dort Nulltoleranz bei Fehlern herrscht."}, {"id": "A8.vq.C_sR-eLujQA.nach1", "vid": "C_sR-eLujQA", "vq": "nach", "t": "ms", "q": "Welche zwei Stufen nennt der Gast auf dem Weg vom einfachen Chatten zum Agent Boss?", "a": ["Bessere Datenquellen nutzen", "Den Agenten komplett abschalten", "Selber Agenten bauen", "Nie mehr mit Menschen sprechen"], "r": [0, 2], "e": "Die Reise geht über bessere Datenquellen und das selbstständige Bauen von Agenten bis zum Agent Boss, die anderen beiden Optionen nennt das Video nicht."}, {"id": "A8.vq.C_sR-eLujQA.nach2", "vid": "C_sR-eLujQA", "vq": "nach", "t": "ord", "q": "Bringe die Reise eines Unternehmens laut Video in die richtige Reihenfolge.", "a": ["Mitarbeitende chatten für einfache Aufgaben", "Mitarbeitende nutzen bessere interne Datenquellen", "Mitarbeitende bauen eigene Agenten", "Ein Mensch führt Agenten wie ein Team, als Agent Boss"], "e": "Der Gast beschreibt genau diese vier aufeinanderfolgenden Stufen der Reise eines Unternehmens."}, {"id": "A8.vq.C_sR-eLujQA.nach3", "vid": "C_sR-eLujQA", "vq": "nach", "t": "frei", "q": "Erkläre anhand des Modebranche-Beispiels aus dem Video, warum ein grosses Change-Projekt für eine KI-Einführung manchmal schlechter funktioniert als ein kleiner, direkter Ansatz.", "m": "Im Video hat eine Firma die KI-gestützte Texterstellung 40 Autorinnen und Autoren als offizielles Change-Projekt übergeben, und nach sechs Monaten wurde es ergebnislos eingestellt. Die andere Firma liess den IT-Leiter die rund 9000 Produktbeschreibungen einfach mit einem klaren Prompt anpassen, ohne ein grosses Projekt zu starten, und erzielte dadurch 9 Prozent mehr Umsatz. Ein kleiner, pragmatischer Test kann also schneller zum Ergebnis führen als ein aufwendig aufgesetztes Projekt."}, {"id": "A8.vq.C_sR-eLujQA.abc", "t": "abc", "abruf": 1, "vid": "C_sR-eLujQA", "vq": "nach", "m": ["Agent", "Change-Projekt", "Copilot", "Entra", "Governance", "Identity", "Multiagentensystem", "Notarrecht", "Office Graph", "Pipeline", "Produktbeschreibung", "Sales Agent", "Steuerberatung", "Umsatz"], "q": "ABC-Liste zu «Wie KI-Agenten bei Microsoft den Mittelstand transformieren | Oliver Gürtler»: Zwei Minuten. Schreib zu möglichst vielen Buchstaben einen Begriff aus dem Video. Nicht der Reihe nach, spring zu dem Buchstaben, der dir einfällt.", "zugabe": 1}, {"id": "A8.vq.C_sR-eLujQA.kawa", "t": "kawa", "abruf": 1, "vid": "C_sR-eLujQA", "vq": "nach", "wort": "COPILOT", "m": ["C: Copilot steht 7 mal 24 Stunden zur Verfügung, anders als eine Führungskraft", "O: Office Graph verbindet Mails, Teams und Dokumente für bessere Antworten", "P: Pipeline stieg bei Copilot-Nutzenden um 20 Prozent", "I: Identity für Agenten heisst bei Microsoft Entra", "L: Lernkurve: die Datenqualität entscheidet über den Nutzen", "T: Trust: Branchen wie Steuerberatung verlangen Nulltoleranz bei Fehlern"], "q": "KaWa zu «COPILOT»: Finde zu jedem Buchstaben eine Assoziation aus dem Video.", "zugabe": 1}, {"id": "A8.vq.HgKf6DPOSeU.vor0", "vid": "HgKf6DPOSeU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Wozu dienen die Plugins in der Codex App?", "a": ["Sie sind nur kosmetische Farbthemen", "Sie bündeln Fähigkeiten, MCPs und Verbindungen zu Tools wie Slack oder Gmail", "Sie beschleunigen nur die Internetverbindung", "Sie sind ausschliesslich für Programmierer gedacht"], "r": 1, "e": "Laut Gespräch bündeln Plugins Fähigkeiten und Verbindungen zu Tools wie Slack, Gmail oder Kalender."}, {"id": "A8.vq.HgKf6DPOSeU.vor1", "vid": "HgKf6DPOSeU", "vq": "vor", "t": "mc", "q": "Was glaubst du: Was passiert, wenn du Codex bittest, dir jeden Morgen um 7 Uhr eine Zusammenfassung zu geben?", "a": ["Nichts, das geht nicht automatisch", "Es wird automatisch in eine tägliche Automation umgewandelt", "Du musst den Prompt jeden Tag neu schreiben", "Es fragt dich jedes Mal per SMS um Erlaubnis"], "r": 1, "e": "Im Video wird die Bitte automatisch als tägliche, wiederkehrende Automation angelegt."}, {"id": "A8.v.HgKf6DPOSeU", "t": "frei", "abruf": 1, "vid": "HgKf6DPOSeU", "vq": "nach", "q": "Video «Wie OpenAI Codex intern wirklich nutzt! Use Cases für Agents» (Christoph Magnussen): Was waren die Kernaussagen?", "m": "1. Romain von OpenAI erklärt, dass Codex-Plugins Fähigkeiten und MCPs bündeln und dem Agenten Zugriff auf Slack, Gmail und Kalender geben, sodass er eigenständig einen morgendlichen Tagesüberblick samt E-Mail-Entwürfen erstellen kann. 2. Wird ein Prompt mit einer festen Uhrzeit wie jeden Morgen um 7 Uhr versehen, wandelt Codex ihn automatisch in eine wiederkehrende Automation um, ohne dass der Nutzer das Konzept eines Cronjobs kennen mu
