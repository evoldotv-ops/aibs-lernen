<!DOCTYPE html>
<html lang="de-CH">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIBS Fallsimulator &middot; Entscheidungstraining für die Berufsprüfung AI Business Specialist</title>
<style>
:root{
  --bg:#14171c; --bg2:#1b1f27; --bg3:#232935;
  --tx:#e4e8ef; --tx2:#a3adbd; --li:#7fb3ff;
  --gut:#6fd09a; --mit:#e8c46a; --schwach:#e2857c;
  --rand:#2e3643;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx)}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.rahmen{max-width:860px;margin:0 auto;padding:28px 22px 90px}
.spalte{max-width:70ch}
h1{font-size:30px;line-height:1.25;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.3;margin:30px 0 10px;font-weight:620}
h3{font-size:18px;margin:22px 0 8px;font-weight:620}
p{margin:0 0 14px}
a{color:var(--li)}
.klein{font-size:15px;color:var(--tx2)}
.mini{font-size:14px;color:var(--tx2)}

/* Kopfzeile */
.kopf{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--rand);padding-bottom:12px;margin-bottom:22px;
}
.kopf .weg{margin-left:auto;display:flex;gap:10px;align-items:center}
.marke{
  display:inline-block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx2);border:1px solid var(--rand);border-radius:99px;padding:3px 11px;
}
.marke.hk{color:var(--li);border-color:#33506f}
.uhr{font-variant-numeric:tabular-nums;font-size:15px;color:var(--tx2)}
.uhr.eng{color:var(--schwach);font-weight:600}

/* Schalter */
button{font:inherit;color:inherit;cursor:pointer}
.k{
  display:block;width:100%;text-align:left;background:var(--bg2);
  border:1px solid var(--rand);border-radius:10px;padding:13px 16px;margin:0 0 10px;
  transition:border-color .12s,background .12s;
}
.k:hover,.k:focus-visible{border-color:var(--li);background:var(--bg3);outline:none}
.k .nr{
  display:inline-block;min-width:22px;color:var(--tx2);font-variant-numeric:tabular-nums;
  font-weight:600;margin-right:8px;
}
.weiter{
  background:var(--li);color:#0d1117;border:0;border-radius:9px;
  padding:11px 22px;font-weight:650;margin-top:8px;
}
.weiter:hover{filter:brightness(1.08)}
.flach{
  background:transparent;border:1px solid var(--rand);border-radius:9px;
  padding:8px 15px;color:var(--tx2);font-size:15px;
}
.flach:hover{border-color:var(--li);color:var(--tx)}
.flach.an{border-color:var(--li);color:var(--li)}

/* Kasten */
.kasten{background:var(--bg2);border:1px solid var(--rand);border-radius:12px;padding:18px 20px;margin:0 0 18px}
.kasten.gut{border-left:4px solid var(--gut)}
.kasten.mit{border-left:4px solid var(--mit)}
.kasten.schwach{border-left:4px solid var(--schwach)}
.kasten h3{margin-top:0}
.echo{font-size:17px}
.punkt{float:right;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.punkt.g{color:var(--gut)}.punkt.m{color:var(--mit)}.punkt.s{color:var(--schwach)}

/* Fallkarten */
.karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:18px 0}
.karte{
  background:var(--bg2);border:1px solid var(--rand);border-radius:12px;
  padding:16px 18px;text-align:left;width:100%;
}
.karte:hover,.karte:focus-visible{border-color:var(--li);outline:none}
.karte b{display:block;font-size:17px;margin:6px 0 4px;font-weight:620}
.karte .note{color:var(--gut);font-weight:650;font-variant-numeric:tabular-nums}

/* Tabellen */
table{border-collapse:collapse;width:100%;margin:0 0 18px;font-size:16px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rand);vertical-align:top}
th{color:var(--tx2);font-weight:600;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
td.z{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

textarea{
  width:100%;min-height:132px;background:var(--bg2);color:var(--tx);
  border:1px solid var(--rand);border-radius:10px;padding:12px 14px;
  font:inherit;font-size:16px;line-height:1.55;resize:vertical;
}
textarea:focus{border-color:var(--li);outline:none}

ul{margin:0 0 14px;padding-left:22px}
li{margin:0 0 7px}
.trenner{border:0;border-top:1px solid var(--rand);margin:26px 0}
.notegross{font-size:46px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fuss{margin-top:34px;padding-top:14px;border-top:1px solid var(--rand)}
.verborgen{display:none}

</style>
</head>
<body>
<main class="rahmen" id="buehne"></main>
<script>
/* Die 28 Handlungskompetenzen aus dem Qualifikationsprofil AI Business Specialist,
   Version 15.04.2025, Anhang zur Wegleitung vom 20.05.2026. */
var HK = {
  A1: 'Innovationen und Trends im KI-Umfeld beobachten und bewerten',
  A2: 'Umfeldanalyse für den Einsatz von KI durchführen',
  A3: 'Interne Unternehmensanalyse für den Einsatz von KI durchführen',
  A4: 'Strategische Beiträge erarbeiten und präsentieren',
  A5: 'Governance zum Einsatz von KI in einer Organisation entwerfen',
  B1: 'Handlungsfelder und Geschäftschancen identifizieren',
  B2: 'Geschäftstätigkeiten hinsichtlich KI-Einsatzmöglichkeiten untersuchen',
  B3: 'KI-Einsatzmöglichkeiten vergleichen und priorisieren',
  C1: 'Bedürfnisse und Anforderungen erheben und formulieren',
  C2: 'Entwicklungs- und Prüfprozess einer Idee starten',
  C3: 'KI-basierte Lösungsansätze entwickeln',
  C4: 'KI-basierte Lösung auf Machbarkeit prüfen',
  C5: 'KI-basierte Lösung auf Nutzen und Wirtschaftlichkeit prüfen',
  C6: 'Entscheidungsgrundlagen erarbeiten und präsentieren',
  D1: 'Rahmenbedingungen klären und definieren',
  D2: 'Entwicklungsprozess einer KI-basierten Lösung steuern',
  D3: 'Einführung einer KI-basierten Lösung konzipieren',
  D4: 'Einführungsprozess einer KI-basierten Lösung steuern',
  E1: 'Portfolio von KI-basierten Lösungen pflegen',
  E2: 'Einsatz von KI-basierten Lösungen überwachen',
  E3: 'Compliance-Anforderungen überwachen',
  E4: 'Einsatz von KI-basierten Lösungen kontinuierlich verbessern und optimieren',
  F1: 'Beziehungsnetzwerke zu Anspruchsgruppen aufbauen und pflegen',
  F2: 'Bedürfnisse in Bezug auf Veränderungs- und Lernprozesse identifizieren und analysieren',
  F3: 'Veränderungs- und Lernprozesse initiieren und steuern',
  F4: 'Anspruchsgruppen für KI-relevante Themen sensibilisieren',
  F5: 'Fachliche Beratungsleistungen zu KI-relevanten Themen erbringen',
  F6: 'KI-Wissensmanagement sicherstellen'
};

var FAELLE = [];

FAELLE.push({
  id: "f1",
  titel: "Der Ausschuss und die 9400 Fotos",
  block: "Block B und C",
  hkliste: "B1, B2, C1 bis C6",
  dauer: "15 bis 20 Minuten",
  playlist: "Playlist 1.7 (KI-Einsatzmöglichkeiten finden und priorisieren), Playlist 2.14 (Bilderkennung und Prognosen) " +
    "und vor allem Playlist 2.7 (Trefferquote, Präzision, Recall). Wer die Konfusionsmatrix nicht am Fall erklären kann, " +
    "verliert im Fachgespräch bei C4 Punkte.",
  merksatz: "Bei seltenen Ereignissen ist die Trefferquote eine Lüge. Bei 4 Prozent Ausschuss erreicht ein Modell, " +
    "das immer «gut» sagt, 96 Prozent Trefferquote und findet nichts.",
  firma: { name: "Furrer Präzision AG", ort: "Bülach ZH", branche: "CNC-Drehteile für den Maschinenbau", groesse: "140 Mitarbeitende" },
  lage: [
    "Die Furrer Präzision AG dreht Präzisionsteile für Antriebshersteller. Geprüft wird am Bandende von Hand: " +
    "Zwei Sichtprüferinnen je Schicht drehen jedes Teil unter der Lupe, drei Schichten am Tag.",
    "Seit dem Frühjahr steigt die Ausschussquote. Der wichtigste Kunde, die Meyrat Antriebe AG, hat zwei Reklamationen " +
    "geschrieben und ein Lieferantenaudit auf Ende März angesetzt. Produktionsleiter Ruedi Zingg war an einer Messe " +
    "und kommt mit einer Idee zurück: Bilderkennung.",
    "Material gibt es tatsächlich. Seit zwei Jahren fotografiert eine Kamera am Prüfplatz jedes zweite Teil. " +
    "Die Bilder liegen in einem Netzlaufwerk, benannt nach Datum und Uhrzeit. Welches Teil in Ordnung war und " +
    "welches nicht, steht in einem Papierjournal am Prüfplatz. Zwischendurch wurde die Kamera einmal ersetzt.",
    "Du bist seit acht Monaten als AI Business Specialist im Haus, direkt dem COO unterstellt."
  ],
  zahlen: [
    ["Umsatz", "CHF 24,6 Mio."],
    ["Ausschussquote heute", "4,1 %"],
    ["Ausschusskosten pro Jahr", "CHF 618'000"],
    ["Reklamationskosten pro Jahr", "CHF 180'000"],
    ["Vorhandene Fotos", "9'400"],
    ["Davon beschriftet", "0"],
    ["Budget für den Testlauf", "CHF 60'000"],
    ["Zeit bis zum Kundenaudit", "5 Monate"]
  ],
  auftrag: "Die Geschäftsleitung will in sechs Wochen eine Entscheidungsgrundlage: Ist Bilderkennung hier machbar, " +
    "und lohnt sie sich? Du führst den Testlauf, du schreibst den Antrag.",
  start: "s1",
  szenen: {
    s1: {
      kap: "1 · Der Auftrag", hk: "B2",
      text: "Zingg steht in deinem Büro. «Mach mir eine KI, die den Ausschuss halbiert. Die Bilder haben wir ja.» " +
        "Er hat eine Stunde Zeit, danach fährt er nach Winterthur.",
      frage: "Womit beginnst du diese Stunde?",
      opt: [
        {
          t: "Systemgrenze und Soll-Zustand schriftlich festhalten: welche Bauteilfamilie, welche Fehlerarten, " +
            "welcher Prüfschritt, und woran wir in sechs Wochen erkennen, dass es sich gelohnt hat.",
          p: 3, weiter: "s2",
          echo: "Genau das verlangt B2: Systemgrenzen, Ziel und Rahmenbedingungen mit dem Auftraggeber definieren, " +
            "bevor gemessen wird. Aus «halbiere den Ausschuss» wird «erkenne Riefen und Lunker an der 12er-Welle " +
            "am Prüfplatz 3». Ohne diesen Satz kannst du am Ende nicht sagen, ob der Testlauf geglückt ist."
        },
        {
          t: "Mit Zingg an die Linie gehen und eine Schicht lang zusehen, wie die Sichtprüferinnen entscheiden.",
          p: 2, weiter: "s2",
          echo: "Beobachtung am Arbeitsplatz ist eine der Erhebungsmethoden, die das Qualifikationsprofil unter B2 " +
            "ausdrücklich nennt, und du lernst dabei, worauf die Prüferinnen wirklich schauen. Es fehlt der " +
            "schriftliche Rahmen: Ohne festgehaltenen Soll-Zustand verschiebt sich das Ziel mit jeder Sitzung."
        },
        {
          t: "Drei Anbieter für Bildprüfsysteme anschreiben und Demos für die nächste Woche bestellen.",
          p: 1, weiter: "b1",
          echo: "Damit lässt du dir das Problem vom Verkäufer beschreiben. Jede Demo läuft auf den Bildern des " +
            "Anbieters unter dessen Beleuchtung. Marktabgleich gehört ins Verfahren, aber nach der Problemdefinition, " +
            "nicht davor."
        },
        {
          t: "Die 9'400 Fotos in ein Bildmodell laden und schauen, was herauskommt.",
          p: 0, weiter: "b1",
          echo: "Ohne Angabe, welches Bild Ausschuss zeigt, gibt es kein überwachtes Lernen. Unbeschriftete Bilder " +
            "liefern höchstens Gruppen nach Helligkeit und Kameratyp. Zwei Wochen weg, keine Aussage gewonnen."
        }
      ],
      warum: {
        frage: "Und warum ist das der richtige erste Schritt?",
        arg: [
          {
            t: "Weil ohne definierte Systemgrenze und ohne Soll-Zustand am Schluss niemand entscheiden kann, ob der " +
              "Testlauf gelungen ist, und wir 60'000 Franken für eine Frage ausgeben, die nie gestellt wurde.",
            p: 1,
            rm: "Das ist die Begründung, die trägt. Sie nennt die Folge, nicht nur die Methode. Genau so will es das " +
              "Fachgespräch: Vorgehen plus nachvollziehbare Wirkung."
          },
          {
            t: "Weil man bei jedem Projekt zuerst die Anforderungen aufnimmt.",
            p: 0,
            rm: "Richtig und trotzdem leer. Ein Lehrbuchsatz ohne Fallbezug. Die Expertin fragt sofort nach: welche " +
              "Anforderung genau, von wem, und was passiert, wenn sie fehlt?"
          },
          {
            t: "Weil der Produktionsleiter das Projekt sonst an sich zieht.",
            p: 0,
            rm: "Innenpolitik statt Fachlichkeit. Mag zutreffen, bewertet wird aber die fachliche Begründung. " +
              "Als Nebensatz erlaubt, als Hauptargument nicht."
          }
        ]
      },
      folge: "Eines steht nach dieser Stunde immerhin fest: Riefen und Lunker an der Bauteilfamilie " +
        "12er-Welle machen zusammen 71 Prozent des Ausschusses aus."
    },

    b1: {
      kap: "1b · Der Anbieter sitzt schon da", hk: "C2",
      text: "Zingg hat aus deinem Vorgehen geschlossen, dass es losgeht, und einen Anbieter eingeladen. Der legt " +
        "am Freitag eine Offerte über 145'000 Franken auf den Tisch, mit Unterschriftsfeld. Das Budget für den " +
        "ganzen Testlauf beträgt 60'000 Franken.",
      frage: "Wie bringst du das Verfahren wieder in die richtige Reihenfolge?",
      opt: [
        {
          t: "Die Offerte als eine von mehreren Eingaben behandeln: Freigabeantrag für einen befristeten Testlauf " +
            "schreiben, mit Ziel, Abbruchkriterium, Budget und Team, und diesen Antrag vor jeder Unterschrift " +
            "durch die Geschäftsleitung führen.",
          p: 3, weiter: "s2",
          echo: "Das ist C2 sauber gespielt: Vorgehen wählen, Ressourcen und Zeitplan definieren, Freigabe beantragen. " +
            "Eine Offerte ist kein Entscheid, sondern eine Information."
        },
        {
          t: "Den Anbieter bitten, die Offerte auf einen bezahlten Vorversuch über 25'000 Franken zu kürzen.",
          p: 2, weiter: "s2",
          echo: "Pragmatisch und budgetschonend, aber du legst dich auf einen einzigen Lösungsweg fest, bevor du die " +
            "eigene Datenlage kennst. Der Vorversuch misst dann vor allem, wie gut dieser Anbieter ist."
        },
        {
          t: "Unterschreiben lassen, das Audit drängt und der Anbieter bringt Erfahrung mit.",
          p: 0, weiter: "s2",
          echo: "Zeitdruck ist der teuerste Ratgeber. Du bindest 145'000 Franken an eine Lösung für ein Problem, " +
            "das noch niemand beschrieben hat, und verlierst jede Verhandlungsposition für den Fall, dass die Daten " +
            "nicht taugen."
        }
      ],
      warum: {
        frage: "Wie begründest du das gegenüber Zingg, der sich übergangen fühlt?",
        arg: [
          {
            t: "Dass wir beide dasselbe wollen, nämlich vor dem Audit eine Wirkung, und dass eine Unterschrift ohne " +
              "geprüfte Datenlage genau das Risiko schafft, das wir uns nicht leisten können.",
            p: 1,
            rm: "Gemeinsames Ziel zuerst, Einwand danach. So bleibt der Produktionsleiter im Boot, und die Sache " +
              "bleibt sachlich."
          },
          {
            t: "Dass Beschaffungen über meinen Tisch laufen müssen.",
            p: 0,
            rm: "Zuständigkeit statt Argument. Das erzeugt Widerstand und hält fachlich nicht stand, wenn die " +
              "Geschäftsleitung nachfragt."
          },
          {
            t: "Dass KI-Projekte erfahrungsgemäss scheitern.",
            p: 0,
            rm: "Pauschale Skepsis ist so wertlos wie pauschale Begeisterung. Die Expertin will hören, welches " +
              "Risiko in diesem Fall konkret wirkt."
          }
        ]
      }
    },

    s2: {
      kap: "2 · Die Datenlage", hk: "B2",
      text: "Du öffnest das Netzlaufwerk. 9'400 Bilder, benannt nach Zeitstempel. Rund 5'800 stammen von der alten " +
        "Kamera, der Rest von der neuen mit anderem Bildausschnitt. Ob ein Teil Ausschuss war, steht im Papierjournal, " +
        "handschriftlich, mit Uhrzeit auf zehn Minuten genau.",
      frage: "Wie kommst du zu einer belastbaren Aussage über die Datenqualität?",
      opt: [
        {
          t: "Eine Stichprobe von 300 Bildern ziehen, sie mit zwei Sichtprüferinnen unabhängig beschriften lassen " +
            "und messen, wie oft die beiden dasselbe Bild verschieden beurteilen.",
          p: 3, weiter: "s3",
          echo: "Das ist die Messung, die alles andere trägt. Wenn sich zwei erfahrene Prüferinnen uneinig sind, " +
            "kann kein Modell die Wahrheit lernen, weil es keine gibt. B2 verlangt genau das: Datenquellen analysieren " +
            "und ihre Eignung bewerten, nicht nur zählen."
        },
        {
          t: "Alle 9'400 Bilder von einer Temporärkraft anhand des Papierjournals beschriften lassen.",
          p: 2, weiter: "s3",
          echo: "Du bekommst eine Menge Etiketten, aber über die Zehn-Minuten-Zeitstempel ordnest du Bild und " +
            "Journaleintrag nur ungefähr zu. Falsche Etiketten sind schlimmer als fehlende: Das Modell lernt den " +
            "Fehler und du merkst es nie."
        },
        {
          t: "Den Anbieter fragen, wie viele Bilder er braucht, und danach entscheiden.",
          p: 1, weiter: "s3",
          echo: "Die Menge ist die einfachste und unwichtigste Frage. Entscheidend sind Beschriftungsqualität, " +
            "Abdeckung aller Fehlerarten und die Frage, ob alte und neue Kamera überhaupt vergleichbar sind."
        },
        {
          t: "9'400 Bilder als ausreichend melden und mit dem Testlauf beginnen.",
          p: 0, weiter: "s3",
          echo: "Eine Zahl ohne Prüfung. Die Hälfte stammt von einer Kamera, die es nicht mehr gibt, und kein " +
            "einziges Bild trägt eine verlässliche Etikette. So beginnt jeder Testlauf, der nach vier Wochen " +
            "ergebnislos abgebrochen wird."
        }
      ],
      warum: {
        frage: "Warum ist ausgerechnet die Uneinigkeit zwischen zwei Prüferinnen die wichtigste Zahl?",
        arg: [
          {
            t: "Weil sie die Obergrenze dessen ist, was das Modell je erreichen kann. Wo Menschen die Wahrheit " +
              "nicht einheitlich festlegen, gibt es keine verlässliche Zielgrösse zum Lernen.",
            p: 1,
            rm: "Sitzt. Das ist das Argument, das im Fachgespräch den Unterschied macht zwischen «ich kenne den " +
              "Begriff Datenqualität» und «ich habe verstanden, woran solche Projekte scheitern»."
          },
          {
            t: "Weil man Daten immer bereinigen muss, bevor man sie benutzt.",
            p: 0,
            rm: "Allgemeinplatz. Hier geht es nicht um Bereinigen, sondern um widersprüchliche Etiketten, " +
              "die durch kein Bereinigen verschwinden."
          },
          {
            t: "Weil wir so den Prüferinnen zeigen können, dass sie Fehler machen.",
            p: 0,
            rm: "Falscher Zweck und sicheres Mittel, um die Fachleute zu verlieren, die du später zum Beschriften " +
              "brauchst. Uneinigkeit ist ein Definitionsproblem, kein Versagen."
          }
        ]
      },
      folge: "Ergebnis der Stichprobe: Bei 300 Bildern sind sich die beiden Prüferinnen in 41 Fällen uneinig. " +
        "Das sind 13,7 Prozent."
    },

    s3: {
      kap: "3 · Was heisst gut genug?", hk: "C1",
      text: "Der COO will im Antrag eine Zahl sehen, an der man das Ergebnis misst. «Schreib rein, ab wann wir " +
        "zufrieden sind.»",
      frage: "Welche Anforderung schreibst du auf?",
      opt: [
        {
          t: "Zwei getrennte Zielwerte plus Zuständigkeit: Mindestens 95 Prozent der echten Ausschussteile werden " +
            "erkannt, höchstens 8 Prozent der guten Teile werden fälschlich aussortiert, und im Zweifelsfall " +
            "entscheidet weiterhin die Sichtprüferin.",
          p: 3, weiter: "e1",
          echo: "Richtig, und der dritte Teil ist der wichtigste: Wer entscheidet im Zweifel. Damit ist die Lösung " +
            "von Anfang an als Unterstützung definiert und nicht als Ersatz, was Akzeptanz, Haftung und Prüfaufwand " +
            "auf einmal klärt."
        },
        {
          t: "Eine Trefferquote von 95 Prozent über alle geprüften Teile.",
          p: 1, weiter: "e1",
          echo: "Diese Zahl erreicht bei 4,1 Prozent Ausschuss auch ein Modell, das ausnahmslos «gut» sagt. " +
            "Die Trefferquote ist bei seltenen Ereignissen wertlos, und dieser Fehler kostet in der Prüfung sicher " +
            "Punkte bei C4."
        },
        {
          t: "Das System soll mindestens so gut sein wie ein Mensch.",
          p: 2, weiter: "e1",
          echo: "Als Leitsatz brauchbar und beim Kunden gut verkäuflich, als Abnahmekriterium zu weich. " +
            "Welcher Mensch, gemessen woran? Du hast die Antwort schon: die 13,7 Prozent Uneinigkeit aus der Stichprobe."
        },
        {
          t: "Das legt der Anbieter im Pflichtenheft fest, er kennt die üblichen Werte.",
          p: 0, weiter: "e1",
          echo: "Damit gibst du die Abnahme aus der Hand. Der Anbieter wird einen Wert wählen, den sein System " +
            "erreicht. C1 verlangt, dass du Anforderungen aus Bedürfnissen und Vorgaben ableitest, nicht übernimmst."
        }
      ],
      warum: {
        frage: "Womit begründest du die Zielwerte gegenüber dem COO?",
        arg: [
          {
            t: "Mit den Kosten der beiden Fehlerarten: Ein durchgelassenes Fehlteil landet beim Kunden und kostet " +
              "Reklamation und Audit, ein zu viel aussortiertes Teil kostet nur Nacharbeit. Darum liegt der " +
              "Erkennungswert höher als der Wert für Fehlalarme.",
            p: 1,
            rm: "Genau. Zielwerte aus Schadenhöhe abgeleitet, nicht aus dem Bauch. Damit kannst du jede Nachfrage " +

      text: "Die Preissteuerung läuft im Sommer an. In den vier Häusern arbeiten unterschiedliche Leute " +

        "wann er Vorschläge überschreibt.",
      frage: "Wie sicherst du das entstehende Wissen?",
      opt: [
        {
          t: "Ein Netzwerk von Schlüsselanwendenden aus allen vier Häusern, ein gemeinsamer Ablageort " +
            "für Regeln und Erfahrungen, und vier Treffen im Jahr, in denen aus Einzelpraktiken " +
            "gemeinsame Regeln werden.",
          p: 3, weiter: null,
          echo: "F6 verlangt genau das: Austauschnetzwerke aufbauen und Wissen langfristig verankern. " +
            "Und die Vorgehensweise des Direktors ist dabei die wertvollste Zutat, nicht das Problem."
        },
        {
          t: "Die Vorgehensweise des Direktors dokumentieren und als Anleitung an die anderen Häuser geben.",
          p: 2, weiter: null,
          echo: "Guter Anfang, aber einseitig. Ein Vier-Sterne-Seminarhaus in Weggis funktioniert " +
            "anders als ein kleineres Haus, und die anderen werden die Anleitung als Vorschrift lesen."
        },
        {
          t: "Eine Schulungsunterlage erstellen und einmal jährlich alle schulen.",
          p: 1, weiter: null,
          echo: "Eine jährliche Schulung konserviert den Stand des letzten Jahres. Das Wissen, um das " +
            "es hier geht, entsteht täglich und veraltet in Monaten."
        },
        {
          t: "Den Anbieter bitten, die Erfahrungen aus allen Häusern in seiner Dokumentation zu sammeln.",
          p: 0, weiter: null,
          echo: "Damit gibst du euer wertvollstes eigenes Wissen an den Anbieter ab, der es allen " +
            "Kunden weitergibt, auch dem Mitbewerber am See."
        }
      ],
      warum: {
        frage: "Warum ist die eigene Vorgehensweise des Direktors ein Gewinn und kein Alleingang?",
        arg: [
          {
            t: "Weil darin die Erfahrung steckt, wann der Automatismus danebenliegt, und weil genau " +
              "dieses Wissen nirgends dokumentiert ist. Wenn wir es einsammeln, wird daraus eine " +
              "Regel für alle Häuser, wenn nicht, geht es mit ihm.",
            p: 1,
            rm: "Aus dem Kritiker der ersten Sitzung ist die wichtigste Wissensquelle geworden. " +
              "Genau dieser Bogen ist es, den eine gute Antwort im Fachgespräch schlagen kann."
          },
          {
            t: "Weil Eigeninitiative gefördert werden soll.",
            p: 0,
            rm: "Führungsfloskel. Es geht nicht um Motivation, sondern um ein konkretes Wissen, " +
              "das verlorengehen kann."
          },
          {
            t: "Weil er sonst das System umgeht.",
            p: 0,

        ]

<script>
/* AIBS Fallsimulator - Motor. Vanilla JS, keine Abhängigkeiten, läuft offline.
   Bezeichner sind bewusst ohne Umlaute, jeder sichtbare Text hat echte Umlaute. */
(function () {
  'use strict';

  var SPEICHER = 'aibsfall1';
  var TAKT = 90; // Sekunden je Entscheidung, nur wenn die Uhr an ist

  var el = document.getElementById('buehne');
  var speicher = laden();
  var S = null;      // laufende Partie
  var takt = null;   // Intervall
  var rest = 0;

  function laden() {
    try { var o = JSON.parse(localStorage.getItem(SPEICHER)); return o && typeof o === 'object' ? o : {}; }
    catch (e) { return {}; }
  }
  function sichern() {
    try { speicher.lauf = S; localStorage.setItem(SPEICHER, JSON.stringify(speicher)); } catch (e) {}
  }
  // Schreibt den Speicher, ohne die laufende Partie mitzuschreiben.
  function sichernNurStand() {
    try { localStorage.setItem(SPEICHER, JSON.stringify(speicher)); } catch (e) {}
  }
  function fallVon(id) { for (var i = 0; i < FAELLE.length; i++) if (FAELLE[i].id === id) return FAELLE[i]; return null; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function note(p, m) { return m > 0 ? Math.round((p / m * 5 + 1) * 10) / 10 : 1; }
  function ntext(n) { return n.toFixed(1).replace('.', ','); }

  /* ---------- Uhr ---------- */
  function taktStopp() { if (takt) { clearInterval(takt); takt = null; } }
  function taktStart(beiNull) {
    taktStopp();
    if (!speicher.uhr) return;
    rest = TAKT; taktMalen();
    takt = setInterval(function () {
      rest--; taktMalen();
      if (rest <= 0) { taktStopp(); beiNull(); }
    }, 1000);
  }
  function taktMalen() {
    var d = document.getElementById('uhr');
    if (!d) return;
    d.textContent = 'Uhr ' + Math.floor(rest / 60) + ':' + ('0' + (rest % 60)).slice(-2);
    d.className = 'uhr' + (rest <= 15 ? ' eng' : '');
  }

  /* ---------- Startbildschirm ---------- */
  function zeigeStart() {
    taktStopp(); S = null;
    var h = '<h1>AIBS Fallsimulator</h1>' +
      '<p class="klein spalte">Sechs Fälle aus Schweizer KMU. Du bist AI Business Specialist. ' +
      'Du entscheidest, du begründest, und zweimal je Fall fragt eine Prüfungsexpertin nach. ' +
      'Training für Prüfungsteil 1 (Fachgespräch, 30 Minuten) und Prüfungsteil 3 (Critical Incident, mündlich).</p>' +
      '<div class="karten">';
    for (var i = 0; i < FAELLE.length; i++) {
      var f = FAELLE[i];
      var st = speicher[f.id] || {};
      h += '<button class="karte" data-fall="' + f.id + '">' +
        '<span class="marke">' + esc(f.block) + '</span>' +
        '<b>' + esc(f.titel) + '</b>' +
        '<span class="mini">' + esc(f.firma.name) + ' &middot; ' + esc(f.dauer) + '</span><br>' +
        '<span class="mini">Handlungskompetenzen ' + esc(f.hkliste) + '</span><br>' +
        (st.beste ? '<span class="note">Beste Note ' + ntext(st.beste) + '</span> <span class="mini">&middot; ' +
          st.laeufe + (st.laeufe === 1 ? ' Durchgang' : ' Durchgänge') + '</span>'
          : '<span class="mini">noch nicht gespielt</span>') +
        '</button>';
    }
    h += '</div><hr class="trenner">';
    var lauf = speicher.lauf;
    if (lauf && lauf.fall && fallVon(lauf.fall)) {
      h += '<div class="kasten"><h3>Angefangener Durchgang</h3>' +
        '<p>' + esc(fallVon(lauf.fall).titel) + ', Stand ' + lauf.punkte + ' von ' + lauf.max + ' Punkten. ' +
        'Du steigst am Anfang der zuletzt gezeigten Situation wieder ein.</p>' +
        '<button class="weiter" id="weiterspielen">Durchgang fortsetzen</button></div>';
    }
    h += '<p class="klein">Tastatur: <b>1</b> bis <b>4</b> wählt, <b>Enter</b> weiter, <b>Esc</b> zurück ins Menü.</p>' +
      '<p><button class="flach' + (speicher.uhr ? ' an' : '') + '" id="uhrschalter">Mit Uhr: ' +
      (speicher.uhr ? 'an' : 'aus') + '</button> ' +
      '<button class="flach" id="reset">Fortschritt löschen</button></p>' +
      '<p class="mini">Mit Uhr hast du 90 Sekunden je Entscheidung, wie im mündlichen Teil. Standard ist aus.</p>' +
      '<div class="fuss mini">Firmen, Namen und Zahlen sind erfunden. Die Handlungskompetenzen stammen aus dem ' +
      'Qualifikationsprofil AI Business Specialist vom 15.04.2025, die Prüfungsregeln aus der Wegleitung vom ' +
      '20.05.2026 und ihrem Anhang 1.</div>';
    el.innerHTML = h;
    var ks = el.querySelectorAll('[data-fall]');
    for (var j = 0; j < ks.length; j++) ks[j].onclick = function () { starteFall(this.getAttribute('data-fall')); };
    document.getElementById('uhrschalter').onclick = function () { speicher.uhr = !speicher.uhr; sichernNurStand(); zeigeStart(); };
    document.getElementById('reset').onclick = function () {
      if (confirm('Allen Fortschritt löschen?')) { speicher = {}; sichernNurStand(); zeigeStart(); }
    };
    var wb = document.getElementById('weiterspielen');
    if (wb) wb.onclick = function () {
      S = speicher.lauf;
      if (!S.hk) S.hk = {};
      if (!S.schwach) S.schwach = [];
      S.next = null; S.wahl = null;
      if (!S.szene || !fallVon(S.fall).szenen[S.szene]) { zeigeStart(); return; }
      zeigeSzene();
    };
  }

  /* ---------- Partie ---------- */
  function starteFall(id) {
    var f = fallVon(id);
    S = { fall: id, szene: f.start, phase: 'lage', punkte: 0, max: 0, hk: {}, schwach: [], wahl: null, weg: [] };
    sichern();
    zeigeLage();
  }

  function hkBuchen(hk, p, m) {
    if (!S.hk[hk]) S.hk[hk] = [0, 0];
    S.hk[hk][0] += p; S.hk[hk][1] += m;
    S.punkte += p; S.max += m;
  }

  function kopf(f, kapitel, hk) {
    return '<div class="kopf"><span class="marke">' + esc(f.firma.name) + '</span>' +
      (kapitel ? '<span class="klein">' + kapitel + '</span>' : '') +
      '<span class="weg">' + (hk ? '<span class="marke hk">' + esc(hk) + '</span>' : '') +
      '<span class="uhr" id="uhr"></span>' +
      '<button class="flach" id="menu">Menü</button></span></div>';
  }
  function menuBinden() {
    var m = document.getElementById('menu');
    if (m) m.onclick = function () { if (confirm('Fall verlassen? Der Punktestand geht verloren.')) zeigeStart(); };
  }

  /* ---------- Fallschilderung ---------- */
  function zeigeLage() {
    taktStopp();
    S.phase = 'lage'; sichern();
    var f = fallVon(S.fall);
    var h = kopf(f, 'Ausgangslage', '') +
      '<div class="spalte"><h1>' + esc(f.titel) + '</h1>' +
      '<p class="klein">' + esc(f.firma.name) + ', ' + esc(f.firma.ort) + ' &middot; ' +
      esc(f.firma.branche) + ' &middot; ' + esc(f.firma.groesse) + '</p>';
    for (var i = 0; i < f.lage.length; i++) h += '<p>' + f.lage[i] + '</p>';
    h += '</div><h3>Die Zahlen auf dem Tisch</h3><table><tbody>';
    for (var j = 0; j < f.zahlen.length; j++)
      h += '<tr><td>' + esc(f.zahlen[j][0]) + '</td><td class="z">' + esc(f.zahlen[j][1]) + '</td></tr>';
    h += '</tbody></table>' +
      '<div class="kasten spalte"><h3>Dein Auftrag</h3><p style="margin:0">' + f.auftrag + '</p></div>' +
      '<button class="weiter" id="los">Los geht es</button>' +
      '<p class="mini">Enter drücken genügt auch.</p>';
    el.innerHTML = h;
    menuBinden();
    document.getElementById('los').onclick = zeigeSzene;
  }

  /* ---------- Entscheidung ---------- */
  function zeigeSzene() {
    var f = fallVon(S.fall), sz = f.szenen[S.szene];
    if (!sz) { zeigeEnde(); return; }
    if (sz.typ === 'experte') { zeigeExperte(); return; }
    S.phase = 'wahl'; sichern();
    var h = kopf(f, sz.kap, sz.hk) + '<div class="spalte">' +
      '<p>' + sz.text + '</p><h2>' + sz.frage + '</h2></div>';
    for (var i = 0; i < sz.opt.length; i++)
      h += '<button class="k" data-i="' + i + '"><span class="nr">' + (i + 1) + '</span>' + sz.opt[i].t + '</button>';
    h += '<p class="mini">Keine Antwort ist plump falsch. Es gibt eine beste, eine vertretbare und schwache.</p>';
    el.innerHTML = h;
    menuBinden();
    var ks = el.querySelectorAll('[data-i]');
    for (var j = 0; j < ks.length; j++) ks[j].onclick = function () { wahlTun(parseInt(this.getAttribute('data-i'), 10)); };
    taktStart(function () { wahlTun(-1); });
  }

  // ponytail: Zeitablauf zählt als 0 Punkte und läuft auf dem Weg der ersten Option weiter.
  function wahlTun(i) {
    taktStopp();
    S.wahl = i;
    S.phase = 'warum'; sichern();
    zeigeWarum();
  }

  /* ---------- Begründung ---------- */
  function zeigeWarum() {
    var f = fallVon(S.fall), sz = f.szenen[S.szene];
    var tat = S.wahl >= 0 ? sz.opt[S.wahl].t : '<i>keine Wahl, die Zeit lief ab</i>';
    var h = kopf(f, sz.kap + ' &middot; Begründung', sz.hk) + '<div class="spalte">' +
      '<p class="klein">Du hast gewählt:</p><div class="kasten"><p style="margin:0">' + tat + '</p></div>' +
      '<h2>' + sz.warum.frage + '</h2>' +
      '<p class="klein">Im Fachgespräch gibt es Abzug, wenn Vorgehensweise und Argumentation nicht nachvollziehbar ' +
      'sind (Anhang 1 zur Wegleitung, Ziffer 6.3). Darum jetzt das Warum.</p></div>';
    for (var i = 0; i < sz.warum.arg.length; i++)
      h += '<button class="k" data-g="' + i + '"><span class="nr">' + (i + 1) + '</span>' + sz.warum.arg[i].t + '</button>';
    el.innerHTML = h;
    menuBinden();
    var ks = el.querySelectorAll('[data-g]');
    for (var j = 0; j < ks.length; j++) ks[j].onclick = function () { grundTun(parseInt(this.getAttribute('data-g'), 10)); };
    taktStart(function () { grundTun(-1); });
  }

  function grundTun(gi) {
    taktStopp();
    var f = fallVon(S.fall), sz = f.szenen[S.szene];
    var op = S.wahl >= 0 ? sz.opt[S.wahl] : null;
    var gr = gi >= 0 ? sz.warum.arg[gi] : null;
    var pw = op ? op.p : 0, pg = gr ? gr.p : 0;
    hkBuchen(sz.hk, pw + pg, 4);
    if (pw <= 1) {
      var besser = sz.opt[0];
      for (var i = 0; i < sz.opt.length; i++) if (sz.opt[i].p > besser.p) besser = sz.opt[i];
      S.schwach.push({
        kap: sz.kap, hk: sz.hk, tat: op ? op.t : 'keine Wahl, die Zeit lief ab',
        besser: besser.t, warum: besser.echo
      });
    }
    S.weg.push(S.szene);
    S.next = op ? op.weiter : sz.opt[0].weiter;
    S.phase = 'echo'; sichern();
    zeigeEcho(op, gr, pw, pg);
  }

  /* ---------- Rückmeldung ---------- */
  function zeigeEcho(op, gr, pw, pg) {
    var f = fallVon(S.fall), sz = f.szenen[S.szene];
    var stufe = pw >= 3 ? 'gut' : (pw === 2 ? 'mit' : 'schwach');
    var kz = pw >= 3 ? 'g' : (pw === 2 ? 'm' : 's');
    var h = kopf(f, sz.kap + ' &middot; Rückmeldung', sz.hk) + '<div class="spalte">' +
      '<div class="kasten ' + stufe + '"><span class="punkt ' + kz + '">' + pw + ' von 3</span>' +
      '<h3>Deine Handlung</h3><p class="echo">' + (op ? op.echo :
        'Keine Wahl getroffen. Im mündlichen Teil ist Schweigen die teuerste Antwort: Die Expertin kann nichts bewerten, was nicht gesagt wurde.') +
      '</p></div>' +
      '<div class="kasten ' + (pg ? 'gut' : 'schwach') + '"><span class="punkt ' + (pg ? 'g' : 's') + '">' + pg + ' von 1</span>' +
      '<h3>Deine Begründung</h3><p class="echo">' + (gr ? gr.rm :
        'Keine Begründung gewählt. Eine Handlung ohne Begründung zählt in der Bewertung wenig.') + '</p></div>';
    if (sz.folge) h += '<p class="spalte">' + sz.folge + '</p>';
    h += '<p class="klein">Zwischenstand: ' + S.punkte + ' von ' + S.max + ' Punkten.</p></div>' +
      '<button class="weiter" id="w">Weiter</button>';
    el.innerHTML = h;
    menuBinden();
    document.getElementById('w').onclick = weiterSo;
  }

  function weiterSo() {
    if (!S.next) { zeigeEnde(); return; }
    S.szene = S.next; S.next = null;
    zeigeSzene();
  }

  /* ---------- Expertennachfrage ---------- */
  function zeigeExperte() {
    taktStopp();
    var f = fallVon(S.fall), sz = f.szenen[S.szene];
    S.phase = 'experte'; sichern();
    var h = kopf(f, sz.kap, sz.hk) + '<div class="spalte">' +
      '<div class="kasten"><h3>' + esc(sz.wer) + ' unterbricht</h3><p class="echo">' + sz.text + '</p>' +
      '<p class="echo"><b>' + sz.frage + '</b></p></div>' +
      '<p class="klein">Antworte frei, so wie du es im Fachgespräch sagen würdest. Zwei bis vier Sätze. ' +
      'Erst danach deckst du die Musterantwort auf.</p>' +
      '<textarea id="antwort" placeholder="Deine Antwort ..."></textarea>' +
      '<button class="weiter" id="auf">Musterantwort aufdecken</button></div>';
    el.innerHTML = h;
    menuBinden();
    document.getElementById('auf').onclick = deckeAuf;
  }

  function deckeAuf() {
    var f = fallVon(S.fall), sz = f.szenen[S.szene];
    var meine = document.getElementById('antwort').value.trim();
    S.phase = 'muster'; sichern();
    var h = kopf(f, sz.kap + ' &middot; Abgleich', sz.hk) + '<div class="spalte">' +
      '<div class="kasten"><h3>Deine Antwort</h3><p class="echo">' +
      (meine ? esc(meine).replace(/\n/g, '<br>') : '<i>leer geblieben</i>') + '</p></div>' +
      '<div class="kasten gut"><h3>Musterantwort</h3><p class="echo">' + sz.muster + '</p></div>' +
      (sz.hinweis ? '<p class="klein">' + sz.hinweis + '</p>' : '') +
      '<h2>Wie war deine Antwort?</h2>' +
      '<p class="klein">Ehrlich bewerten. Sonst betrügst du nur dich selbst.</p></div>' +
      '<button class="k" data-s="0"><span class="nr">1</span>Nicht gewusst</button>' +
      '<button class="k" data-s="1"><span class="nr">2</span>Teilweise, die Hälfte fehlte</button>' +
      '<button class="k" data-s="2"><span class="nr">3</span>Gewusst, im Kern dasselbe</button>';
    el.innerHTML = h;
    menuBinden();
    var ks = el.querySelectorAll('[data-s]');
    for (var i = 0; i < ks.length; i++) ks[i].onclick = function () { selbstNote(parseInt(this.getAttribute('data-s'), 10)); };
  }

  function selbstNote(p) {
    var f = fallVon(S.fall), sz = f.szenen[S.szene];
    hkBuchen(sz.hk, p, 2);
    if (p <= 1) S.schwach.push({
      kap: sz.kap, hk: sz.hk, frage: true,
      tat: 'Freie Antwort, Selbstbewertung ' + p + ' von 2',
      besser: sz.frage, warum: sz.muster
    });
    S.weg.push(S.szene);
    S.szene = sz.weiter;
    sichern();
    if (!S.szene) zeigeEnde(); else zeigeSzene();
  }

  /* ---------- Auswertung ---------- */
  function zeigeEnde() {
    taktStopp();
    var f = fallVon(S.fall);
    var n = note(S.punkte, S.max);
    var st = speicher[f.id] || { laeufe: 0, beste: 0 };
    st.laeufe++; if (n > st.beste) st.beste = n;
    speicher[f.id] = st;
    S.phase = 'ende';
    speicher.lauf = null; sichernNurStand(); // abgeschlossener Durchgang wird nicht mehr angeboten

    var h = kopf(f, 'Auswertung', '') + '<div class="spalte"><h1>' + esc(f.titel) + '</h1>' +
      '<p class="notegross">' + ntext(n) + '</p>' +
      '<p class="klein">' + S.punkte + ' von ' + S.max + ' Punkten. Note = Punkte geteilt durch Maximum, mal 5, plus 1. ' +
      'Beste Note in diesem Fall bisher: ' + ntext(st.beste) + '.</p></div>' +
      '<h2>Punkte nach Handlungskompetenz</h2><table><thead><tr><th>HK</th><th>Was das ist</th>' +
      '<th class="z">Punkte</th><th class="z">Anteil</th></tr></thead><tbody>';
    var keys = Object.keys(S.hk).sort();
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i], v = S.hk[k];
      h += '<tr><td><b>' + esc(k) + '</b></td><td>' + esc(HK[k] || '') + '</td>' +
        '<td class="z">' + v[0] + ' / ' + v[1] + '</td>' +
        '<td class="z">' + Math.round(v[0] / v[1] * 100) + ' %</td></tr>';
    }
    h += '</tbody></table><h2>Was du nochmals anschauen solltest</h2>';
    if (!S.schwach.length) {
      h += '<div class="kasten gut"><p style="margin:0">Keine schwache Entscheidung. ' +
        'Spiel den Fall mit eingeschalteter Uhr nochmals, dann wird es enger.</p></div>';
    } else {
      for (var j = 0; j < S.schwach.length; j++) {
        var s = S.schwach[j];
        h += '<div class="kasten schwach"><h3>' + s.kap + ' <span class="marke hk">' + esc(s.hk) + '</span></h3>' +
          '<p class="klein">Du hast gewählt: ' + s.tat + '</p>' +
          '<p><b>' + (s.frage ? 'Die Frage war:' : 'Besser wäre gewesen:') + '</b> ' + s.besser + '</p>' +
          '<p class="klein">' + s.warum + '</p></div>';
      }
    }
    h += '<div class="kasten"><h3>Dazu passt in deiner Videoliste</h3><p style="margin:0">' + f.playlist + '</p></div>' +
      '<div class="kasten"><h3>Merksatz für die Prüfung</h3><p style="margin:0">' + f.merksatz + '</p></div>' +
      '<button class="weiter" id="nochmal">Fall nochmals spielen</button> ' +
      '<button class="flach" id="retour">Zurück zur Fallauswahl</button>';
    el.innerHTML = h;
    var b = document.getElementById('menu'); if (b) b.onclick = zeigeStart;
    document.getElementById('nochmal').onclick = function () { starteFall(f.id); };
    document.getElementById('retour').onclick = zeigeStart;
  }

  /* ---------- Tastatur ---------- */
  document.addEventListener('keydown', function (ev) {
    if (ev.target && ev.target.tagName === 'TEXTAREA') return;
    if (ev.key === 'Escape') {
      if (S) { if (confirm('Fall verlassen? Der Punktestand geht verloren.')) zeigeStart(); }
      return;
    }
    if (ev.key === 'Enter') {
      var w = document.getElementById('los') || document.getElementById('w') ||
        document.getElementById('auf') || document.getElementById('nochmal');
      if (w) { ev.preventDefault(); w.click(); }
      return;
    }
    var n = '1234'.indexOf(ev.key);
    if (n >= 0) {
      var ks = el.querySelectorAll('.k');
      if (ks[n]) { ev.preventDefault(); ks[n].click(); }
    }
  });

  /* ---------- Selbstprüfung aller Pfade, wird vom Test aufgerufen ---------- */
  window.__testAlles = function () {
    var fehler = [], zahlen = { faelle: 0, szenen: 0, optionen: 0, argumente: 0, pfade: 0, verzweigungen: 0, experten: 0 };
    var alleHK = {};
    for (var i = 0; i < FAELLE.length; i++) {
      var f = FAELLE[i]; zahlen.faelle++;
      var keys = Object.keys(f.szenen);
      zahlen.szenen += keys.length;
      var erreicht = {}, verzw = 0;

      for (var a = 0; a < keys.length; a++) {
        var k = keys[a], sz = f.szenen[k];
        if (!sz.hk) fehler.push(f.id + '/' + k + ': keine Handlungskompetenz');
        alleHK[sz.hk] = 1;
        if (sz.typ === 'experte') {
          zahlen.experten++;
          if (!sz.muster) fehler.push(f.id + '/' + k + ': Musterantwort fehlt');
          if (sz.weiter && !f.szenen[sz.weiter]) fehler.push(f.id + '/' + k + ': weiter -> ' + sz.weiter + ' gibt es nicht');
          continue;
        }
        if (!sz.opt || sz.opt.length < 3) fehler.push(f.id + '/' + k + ': weniger als 3 Optionen');
        if (!sz.warum || !sz.warum.arg || sz.warum.arg.length !== 3)
          fehler.push(f.id + '/' + k + ': nicht genau 3 Begruendungen');
        var beste = -1, ziele = {};
        for (var b = 0; b < sz.opt.length; b++) {
          zahlen.optionen++;
          var o = sz.opt[b];
          if (typeof o.p !== 'number' || o.p < 0 || o.p > 3) fehler.push(f.id + '/' + k + '/' + b + ': Punktwert ungueltig');
          if (!o.echo) fehler.push(f.id + '/' + k + '/' + b + ': Rueckmeldung fehlt');
          if (o.weiter && !f.szenen[o.weiter]) fehler.push(f.id + '/' + k + '/' + b + ': weiter -> ' + o.weiter + ' gibt es nicht');
          if (o.p > beste) beste = o.p;
          ziele[String(o.weiter)] = 1;
        }
        if (beste !== 3) fehler.push(f.id + '/' + k + ': keine Option mit 3 Punkten');
        if (Object.keys(ziele).length > 1) verzw++;
        var gp = 0;
        for (var c = 0; c < sz.warum.arg.length; c++) {
          zahlen.argumente++;
          var g = sz.warum.arg[c];
          if (g.p !== 0 && g.p !== 1) fehler.push(f.id + '/' + k + '/g' + c + ': Punktwert ungueltig');
          if (!g.rm) fehler.push(f.id + '/' + k + '/g' + c + ': Rueckmeldung fehlt');
          gp += g.p;
        }
        if (gp !== 1) fehler.push(f.id + '/' + k + ': nicht genau eine Begruendung mit 1 Punkt');
      }
      zahlen.verzweigungen += verzw;
      if (verzw < 3) fehler.push(f.id + ': nur ' + verzw + ' echte Verzweigungspunkte, mindestens 3 verlangt');

      // ponytail: Dynamische Programmierung statt Pfadaufzaehlung, sonst 4 hoch 12 Pfade.
      var kanten = function (k) {
        var sz = f.szenen[k], z = [];
        if (!sz) return z;
        if (sz.typ === 'experte') return [sz.weiter || null];
        for (var b = 0; b < sz.opt.length; b++) z.push(sz.opt[b].weiter || null);
        return z;
      };
      var stapel = [f.start];
      while (stapel.length) {
        var k2 = stapel.pop();
        if (erreicht[k2]) continue;
        erreicht[k2] = 1;
        if (!f.szenen[k2]) { fehler.push(f.id + ': Szene ' + k2 + ' gibt es nicht'); continue; }
        var zs = kanten(k2);
        if (!zs.length) fehler.push(f.id + '/' + k2 + ': Sackgasse, kein Ausgang');
        for (var z1 = 0; z1 < zs.length; z1++) if (zs[z1]) stapel.push(zs[z1]);
      }
      for (var d = 0; d < keys.length; d++) if (!erreicht[keys[d]]) fehler.push(f.id + ': Szene ' + keys[d] + ' ist nicht erreichbar');

      var farbe = {};
      var zyklus = function (k) {
        if (farbe[k] === 2) return false;
        if (farbe[k] === 1) { fehler.push(f.id + ': Schleife bei ' + k); return true; }
        farbe[k] = 1;
        var zs = kanten(k);
        for (var z2 = 0; z2 < zs.length; z2++) if (zs[z2] && f.szenen[zs[z2]] && zyklus(zs[z2])) { farbe[k] = 2; return true; }
        farbe[k] = 2; return false;
      };
      var imKreis = zyklus(f.start);

      var memo = {};
      var rechne = function (k) {
        if (memo[k]) return memo[k];
        var sz = f.szenen[k];
        var eigen = sz.typ === 'experte' ? 0 : 1;
        var zs = kanten(k);
        var r = { pfade: 0, min: 1e9, max: -1e9, bestP: -1e9, bestM: 0 };
        for (var z3 = 0; z3 < zs.length; z3++) {
          var n2 = zs[z3];
          var sub = n2 ? rechne(n2) : { pfade: 1, min: 0, max: 0, bestP: 0, bestM: 0 };
          var pMehr = sz.typ === 'experte' ? 2 : sz.opt[z3].p + 1;
          var mMehr = sz.typ === 'experte' ? 2 : 4;
          if (pMehr > mMehr) fehler.push(f.id + '/' + k + '/' + z3 + ': mehr Punkte als Maximum erreichbar');
          r.pfade += sub.pfade;
          r.min = Math.min(r.min, sub.min + eigen);
          r.max = Math.max(r.max, sub.max + eigen);
          if (sub.bestP + pMehr > r.bestP) { r.bestP = sub.bestP + pMehr; r.bestM = sub.bestM + mMehr; }
        }
        memo[k] = r; return r;
      };
      var pfade = 0, minE = 0, maxE = 0, besteNote = 0, tiefsteNote = 1;
      if (!imKreis) {
        var r0 = rechne(f.start);
        pfade = r0.pfade; minE = r0.min; maxE = r0.max;
        // Musterlauf: immer die staerkste Option nehmen. Der muss glatt auf Note 6 kommen.
        var kk = f.start, pM = 0, mM = 0, schutz = 0;
        while (kk && schutz++ < 60) {
          var szM = f.szenen[kk];
          if (szM.typ === 'experte') { pM += 2; mM += 2; kk = szM.weiter; continue; }
          var bi = 0;
          for (var bx = 1; bx < szM.opt.length; bx++) if (szM.opt[bx].p > szM.opt[bi].p) bi = bx;
          pM += szM.opt[bi].p + 1; mM += 4;
          kk = szM.opt[bi].weiter;
        }
        besteNote = note(pM, mM);
        tiefsteNote = note(0, mM);
        if (pM > mM) fehler.push(f.id + ': Musterlauf ' + pM + ' Punkte mehr als Maximum ' + mM);
        if (besteNote < 5.999) fehler.push(f.id + ': Musterlauf ergibt nur Note ' + besteNote + ', sollte 6 sein');
        if (tiefsteNote < 0.999) fehler.push(f.id + ': Note unter 1 erreichbar');
        if (minE < 8 || maxE > 12) fehler.push(f.id + ': Entscheidungen je Durchgang ' + minE + ' bis ' + maxE + ', verlangt sind 8 bis 12');
      }
      zahlen.pfade += pfade;
      f._test = { pfade: pfade, entscheidungen: minE + ' bis ' + maxE, besteNote: besteNote, tiefsteNote: tiefsteNote, verzweigungen: verzw };
    }
    var hks = Object.keys(alleHK).sort();
    var pflicht = ['B3', 'C3', 'C4', 'C5'];
    for (var e = 0; e < pflicht.length; e++)
      if (hks.indexOf(pflicht[e]) < 0) fehler.push('Pflichtkompetenz ' + pflicht[e] + ' kommt nirgends vor');
    if (hks.length < 18) fehler.push('nur ' + hks.length + ' Handlungskompetenzen abgedeckt, verlangt sind mindestens 18');
    return {
      ok: fehler.length === 0, fehler: fehler, zahlen: zahlen,
      handlungskompetenzen: hks, anzahlHK: hks.length,
      jeFall: FAELLE.map(function (f) { return { id: f.id, titel: f.titel, test: f._test }; })
    };
  };

  zeigeStart();
})();

</script>
