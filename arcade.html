<!DOCTYPE html>
<html lang="de-CH">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Begriffe-Arcade &ndash; AI Business Specialist</title>
<style>:root{
  --bg:#14161a; --panel:#1e2228; --panel2:#262b33; --linie:#343b45;
  --text:#eceff3; --leise:#a6b0bd; --akzent:#e8761a; --gut:#3fb27f; --schlecht:#e05a5a;
  --rund:14px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;font-size:18px}
body{
  background:var(--bg); color:var(--text);
  font:400 1rem/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.5rem}
h2{font-size:1.25rem}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;font-size:1rem}
:focus-visible{outline:3px solid var(--akzent);outline-offset:2px}

/* Kopfzeile */
#kopf{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:#101216;border-bottom:1px solid var(--linie);
  padding-top:calc(10px + env(safe-area-inset-top));
}
#kopftitel{flex:1;min-width:0;font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#uhr{font-variant-numeric:tabular-nums;font-weight:700;color:var(--akzent);font-size:1.05rem}
.kopfknopf{
  background:var(--panel2);border:1px solid var(--linie);border-radius:10px;
  padding:9px 12px;min-height:42px;cursor:pointer;white-space:nowrap;
}
.kopfknopf:hover{background:#30363f}

main{max-width:760px;margin:0 auto;padding:16px 14px 40px}

/* Startbildschirm */
.lead{color:var(--leise);margin-bottom:18px}
.kachelgitter{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:620px){.kachelgitter{grid-template-columns:1fr 1fr}}
.kachel{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--linie);border-left:5px solid var(--akzent);
  border-radius:var(--rund);padding:16px;cursor:pointer;min-height:96px;
}
.kachel:hover{background:var(--panel2)}
.kachel .kt{font-weight:700;font-size:1.15rem;display:block;margin-bottom:4px}
.kachel .ku{color:var(--leise);font-size:.95rem;display:block}
.kachel .kb{color:var(--akzent);font-size:.95rem;display:block;margin-top:8px}

.blockliste{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
.blockknopf{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--linie);border-radius:var(--rund);
  padding:14px;cursor:pointer;min-height:60px;
}
.blockknopf:hover{background:var(--panel2)}
.blockknopf .kz{
  flex:0 0 42px;height:42px;display:flex;align-items:center;justify-content:center;
  background:var(--akzent);color:#14161a;font-weight:800;border-radius:10px;font-size:1.15rem;
}
.blockknopf .bt{flex:1;min-width:0;overflow-wrap:anywhere}
.blockknopf .bz{color:var(--leise);font-size:.95rem;white-space:nowrap}
.blockknopf[disabled]{opacity:.4;cursor:not-allowed}

/* Spielfläche */
.frage{
  background:var(--panel);border:1px solid var(--linie);border-radius:var(--rund);
  padding:16px;margin-bottom:14px;font-size:1.08rem;overflow-wrap:anywhere;
}
.zaehler{display:flex;justify-content:space-between;color:var(--leise);font-size:.95rem;margin-bottom:10px}
.hinweis{color:var(--akzent);margin:10px 0;overflow-wrap:anywhere}
.knopfreihe{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.knopf{
  flex:1 1 140px;background:var(--akzent);color:#14161a;font-weight:700;border:none;
  border-radius:12px;padding:15px 16px;min-height:54px;cursor:pointer;
}
.knopf:hover{filter:brightness(1.1)}
.knopf.zweit{background:var(--panel2);color:var(--text);border:1px solid var(--linie);font-weight:600}
.knopf[disabled]{opacity:.5;cursor:not-allowed}

/* 1 Sortieren */
ol.sortliste{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li.zeile{
  display:flex;align-items:stretch;gap:8px;background:var(--panel2);
  border:1px solid var(--linie);border-radius:12px;padding:8px 8px 8px 0;
}
li.zeile.zieht{border-color:var(--akzent);opacity:.75}
li.zeile.gewaehlt{border-color:var(--akzent)}
.griff{
  flex:0 0 46px;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none;color:var(--leise);font-size:1.4rem;user-select:none;
  border-right:1px solid var(--linie);align-self:stretch;
}
.griff:active{cursor:grabbing}
.nr{flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:var(--akzent);font-weight:800}
.stxt{flex:1;min-width:0;padding:8px 4px;overflow-wrap:anywhere;font-size:1rem}
.pfeile{display:flex;flex-direction:column;gap:4px;flex:0 0 46px}
.pfeile button{
  flex:1;background:var(--panel);border:1px solid var(--linie);border-radius:8px;
  cursor:pointer;min-height:26px;color:var(--leise);line-height:1;
}
.pfeile button:hover{background:#333a44;color:var(--text)}

.zweispalt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.zweispalt h3{font-size:.95rem;color:var(--leise);margin:0 0 6px}
.spalte ol{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:s}
.spalte li{
  background:var(--panel2);border:1px solid var(--linie);border-radius:10px;
  padding:8px;font-size:.95rem;overflow-wrap:anywhere;
}
.spalte li.ok{border-color:var(--gut)}
.spalte li.nok{border-color:var(--schlecht)}

/* 2 Schreiben */
input.feld{
  width:100%;background:var(--panel2);color:var(--text);border:2px solid var(--linie);
  border-radius:12px;padding:15px;font:inherit;font-size:1.1rem;min-height:56px;
}
input.feld:focus{border-color:var(--akzent);outline:none}
.einheit{color:var(--leise);font-size:.95rem;margin-top:6px}

/* 3 Paare */
.paarfeld{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paarspalte{display:grid;gap:8px;align-content:start}
.paarkarte{
  background:var(--panel2);border:2px solid var(--linie);border-radius:12px;
  padding:11px;text-align:left;cursor:pointer;font-size:.95rem;line-height:1.35;
  overflow-wrap:anywhere;min-height:64px;width:100%;
}
.paarkarte:hover{background:#333a44}
.paarkarte.gewaehlt{border-color:var(--akzent);background:#3a2a17}
.paarkarte.fest{border-color:var(--gut);color:var(--leise);opacity:.55;cursor:default}
.paarkarte.falsch{animation:blinkrot .55s ease 2}
@keyframes blinkrot{0%,100%{border-color:var(--linie);background:var(--panel2)}50%{border-color:var(--schlecht);background:#43201f}}
.spaltentitel{color:var(--leise);font-size:.95rem;margin:0 0 2px;font-weight:600}

/* 4 Stapel */
.stapelbuehne{position:relative;min-height:280px;display:flex;align-items:center;justify-content:center}
.aussage{
  width:100%;background:var(--panel);border:2px solid var(--linie);border-radius:18px;
  padding:20px;touch-action:none;cursor:grab;user-select:none;
}
.aussage:active{cursor:grabbing}
.aussage .af{color:var(--leise);font-size:.98rem;margin-bottom:10px;overflow-wrap:anywhere}
.aussage .aa{font-size:1.18rem;font-weight:700;color:var(--akzent);overflow-wrap:anywhere}
.aussage.jaseite{border-color:var(--gut)}
.aussage.neinseite{border-color:var(--schlecht)}
.wischhilfe{display:flex;justify-content:space-between;color:var(--leise);font-size:.95rem;margin:8px 2px}
.knopf.nein{background:var(--schlecht);color:#fff}
.knopf.ja{background:var(--gut);color:#14161a}

/* Auswertung */
.bilanz{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.bilanz div{background:var(--panel);border:1px solid var(--linie);border-radius:12px;padding:12px;text-align:center}
.bilanz .w{display:block;font-size:1.5rem;font-weight:800;color:var(--akzent);font-variant-numeric:tabular-nums}
.bilanz .l{display:block;color:var(--leise);font-size:.95rem}
.fehler{
  background:var(--panel);border:1px solid var(--linie);border-left:4px solid var(--schlecht);
  border-radius:12px;padding:13px;margin-bottom:10px;overflow-wrap:anywhere;
}
.fehler .ff{font-weight:600;margin-bottom:6px}
.fehler .fd{color:var(--schlecht);font-size:.95rem}
.fehler .fr{color:var(--gut);font-size:.95rem}
.fehler .fe{color:var(--leise);font-size:.95rem;margin-top:7px}
.allesgut{background:var(--panel);border-left:4px solid var(--gut);border-radius:12px;padding:13px;margin-bottom:10px}

@media (max-width:420px){
  html{font-size:19px}
  main{padding:14px 10px 40px}
  #kopf{gap:6px;padding-left:8px;padding-right:8px}
  .kopfknopf{padding:9px 9px}
  .bilanz{grid-template-columns:1fr 1fr 1fr;gap:6px}
  .bilanz div{padding:9px 4px}
  .bilanz .w{font-size:1.3rem}
  .bilanz .l{font-size:.95rem}
  .zweispalt{gap:6px}
  .spalte li{padding:7px}
  .paarkarte{padding:9px}
  .griff{flex-basis:38px}
  .pfeile{flex-basis:40px}
}
</style>
</head>
<body>
<header id="kopf">
  <button id="zurueck" class="kopfknopf" type="button" hidden>&#8592; zur&uuml;ck</button>
  <div id="kopftitel">Begriffe-Arcade</div>
  <div id="uhr" hidden>0:00</div>
  <button id="ton" class="kopfknopf" type="button" aria-pressed="true" title="Ton ein oder aus">&#9834; an</button>
</header>
<main id="app" tabindex="-1"></main>
<script>
const DATEN = {"bloecke":[{"kz":"C","titel":"Analysieren, bewerten, rechnen","pl":1,"ord":[{"q":"Bringe die Bestandteile der Satzschablone ohne Bedingung in die richtige Reihenfolge.","a":["System festlegen","Muss oder Soll entscheiden","Benutzeraktion oder Systemaktivität festlegen","Funktion formulieren"],"e":"Das Video baut die Schablone genau in dieser Reihenfolge auf, vom System bis zur konkreten Funktion."},{"q":"Bringe die vier Sektionen einer guten Anforderung nach dem Video in eine sinnvolle Reihenfolge.","a":["Titel als Aufhänger","Kontext: Situation und Problem","Konkrete Schritte","Sonstiges, also what else"],"e":"Genau in dieser Reihenfolge baut das Video seine Feature Requests auf."},{"q":"In welcher Reihenfolge setzt Mira die Werkzeuge ein?","a":["Dokumente und vorhandene Daten","Wenige Interviews","Beobachtung","Befragung oder Messung"],"e":"Von offen zu geschlossen, von wenigen zu vielen, von Worten zu Zahlen. Der Fragebogen kommt erst, wenn man weiss, wonach man fragen muss."},{"q":"Vom Bedürfnis zur Anforderung (C1): richtige Reihenfolge.","a":["Anspruchsgruppen identifizieren und klassifizieren","Erhebungsmethode wählen (Interview, Beobachtung, Befragung)","Bedürfnisse aufnehmen und in einem Katalog ordnen","Anforderungen ableiten und prüfbar formulieren","Anforderungen mit den Anspruchsgruppen validieren"],"e":"Ein Bedürfnis ist ein Wunsch in der Sprache der Person («ich will nicht alles doppelt tippen»), die Anforderung ist die prüfbare Übersetzung."},{"q":"Bringe die Schritte in die Reihenfolge, wie man laut Video ein Stakeholder-Portfolio aufbaut.","a":["Alle Stakeholder auflisten","Für jeden Stakeholder Wohlwollen und Macht einschätzen","Die Stakeholder als Punkte ins Portfolio eintragen","Für jeden der vier Bereiche eine passende Strategie festlegen"],"e":"Das Video beschreibt genau diese vier Schritte in dieser Reihenfolge zum Aufbau des Portfolios."},{"q":"Bringe die Schritte der Nutzwertanalyse in die richtige Reihenfolge.","a":["Alternativen festlegen","Bewertungskriterien definieren","Kriterien gewichten","Bewertungsmassstab festlegen","Alternativen bewerten","Auswertung und Auswahl"],"e":"Das Video erklärt die Nutzwertanalyse genau in dieser Reihenfolge aus sechs Schritten."},{"q":"Schritte einer Nutzwertanalyse in der richtigen Reihenfolge.","a":["Kriterien festlegen","Kriterien gewichten (Summe 100 %)","Alternativen je Kriterium bepunkten","Punkte mit Gewichten multiplizieren und addieren","Ergebnis prüfen: Sensitivität, K.-o.-Kriterien, Plausibilität"],"e":"Wichtig: Gewichte VOR der Bewertung festlegen, sonst rechnet man sich das Wunschergebnis zurecht."},{"q":"Bringe die Schritte zur Berechnung der Amortisationsdauer im Beispiel des Videos in die richtige Reihenfolge.","a":["Investitionskosten der Sanierung ermitteln, zum Beispiel 40000 Euro","Jährliche Mieteinnahmen ermitteln, zum Beispiel 5500 Euro","Investitionskosten durch jährliche Erträge teilen","Ergebnis als Amortisationsdauer in Jahren interpretieren"],"e":"Genau in dieser Reihenfolge rechnet das Video sein Beispiel durch."},{"q":"Bringe die Schritte des Beispiels aus dem Video in die richtige Reihenfolge.","a":["Die eigenen Stärken und Schwächen intern analysieren","Den Markt extern nach Chancen und Risiken untersuchen","Beide Analysen in einer Matrix zusammenführen","Aus jedem Matrixfeld eine passende Strategie ableiten"],"e":"Genau in dieser Reihenfolge baut das Video sein Beispiel des Autoherstellers auf, von der Analyse bis zur Strategieableitung."},{"q":"Bringe die sechs PESTEL-Faktoren in der Reihenfolge, wie sie im Video vorgestellt werden.","a":["politischer Faktor","ökonomischer Faktor","soziokultureller Faktor","technologischer Faktor","ökologischer Faktor","rechtlicher Faktor"],"e":"Das Video stellt die Faktoren genau in dieser Reihenfolge vor: politisch, ökonomisch, soziokulturell, technologisch, ökologisch, rechtlich."},{"q":"Ordne: vom Versuch zum Betrieb.","a":["Proof of Concept: Geht das überhaupt?","Pilot: Wirkt es im echten Betrieb?","Rollout: alle"],"e":"Drei Stufen, drei Fragen, drei Entscheide. Der PoC berührt keinen Patienten, der Pilot hat eine Vergleichsgruppe."},{"q":"Von 37 Ideen zur Roadmap: richtige Reihenfolge.","a":["Ideen in einheitlichen Steckbriefen erfassen","K.-o.-Kriterien anwenden und Doppelte streichen (Triage)","Verbleibende Ideen nach gewichteten Kriterien bewerten","Priorisierungsvorschlag und Nein-Liste der Geschäftsleitung vorlegen","Top-Ideen als PoC starten, Rest im Portfolio führen"],"e":"Trichter statt Wunschliste. Die Nein-Liste ist genauso wichtig wie die Startliste."},{"q":"Bringe die sechs Fragen in die Reihenfolge des Videos.","a":["vollständig","richtig","aktuell","einheitlich","eindeutig","passend"],"e":"Merkhilfe aus dem Anker: DATEN. Dürfen, Aktuell, Trifft es die Frage, Einheitlich und eindeutig, Nichts fehlt und nichts ist falsch."},{"q":"Geschäftstätigkeit untersuchen (B2): richtige Reihenfolge.","a":["Scope, Ziel (SOLL) und Rahmenbedingungen mit dem Auftraggeber festlegen","IST-Zustand erheben (Dokumente, Befragung, Beobachtung, Messung)","IST mit SOLL vergleichen, Problemstellen finden","Datenquellen auf Eignung prüfen","Erkenntnisse konsolidieren und dokumentieren"],"e":"Ohne Scope ufert die Analyse aus. Ohne Messung bleibt die Zahl eine Schätzung."},{"q":"Bringe die fünf Punkte des Hype Cycle laut Video in die richtige Reihenfolge.","a":["technologischer Auslöser","Gipfel der übersteigerten Erwartungen","Tal der Enttäuschung","Pfad der Erleuchtung","Plateau der Produktivität"],"e":"Das Video nennt genau diese fünf Punkte in dieser Reihenfolge, vom Marktstart bis zur Etablierung der Technologie."},{"q":"Die fünf Phasen des Gartner Hype Cycle.","a":["Technologischer Auslöser","Gipfel der überzogenen Erwartungen","Tal der Enttäuschungen","Pfad der Erleuchtung","Plateau der Produktivität"],"e":"Nützlich für A1: Wo steht eine Technologie, und was heisst das für unseren Zeitpunkt des Einstiegs?"},{"q":"Bringe vier der sieben Design-Thinking-Schritte aus dem Video in die richtige Reihenfolge.","a":["Define: Problem und Ziel klären","Research: bestehende Lösungsansätze recherchieren","Ideenfindung: möglichst viele Ideen sammeln, ohne sie zu bewerten","Implement: die gewählte Idee umsetzen"],"e":"Das Video ordnet die sieben Schritte genau in dieser Reihenfolge an."},{"q":"Design Thinking: Phasen in der richtigen Reihenfolge.","a":["Verstehen und beobachten","Problem definieren (Sichtweise)","Ideen finden","Prototyp bauen","Testen"],"e":"Nützlich für B1, um Handlungsfelder aus Nutzersicht zu finden, nicht aus Technikbegeisterung."},{"q":"Bringe die im Video gezeigten Massnahmen in der Reihenfolge, in der sie umgesetzt werden.","a":["Distanz zwischen den Akteuren verkürzen","Die Pfeilspitze entschärfen","Die erfahrene und die unerfahrene Person tauschen","Helm und Schutzbrille für den Akteur mit dem Apfel einsetzen"],"e":"Genau in dieser Reihenfolge testet der Berater im Video verschiedene Massnahmen, bis das Risiko in die grüne Zone fällt."}],"schreib":[{"t":"lueck","q":"Eine Aufgabe mit technischem Charakter ohne direkten Business Value, wie zum Beispiel Refactoring, nennt das Video einen ___.","r":["task"],"e":"Solche technischen Aufgaben ohne direkten Kundennutzen nennt das Video Task."},{"t":"lueck","q":"Stakeholder mit wenig Macht, aber positiver Einstellung, sollte man laut Video vor allem ___.","r":["informieren"],"e":"Für diese Gruppe reicht es, sie über Newsletter und Statusberichte auf dem Laufenden zu halten."},{"t":"lueck","q":"Für jedes Kriterium vergibt man pro Option eine Punktzahl von 1 bis ___, wobei die höchste Zahl die ideale Voraussetzung bedeutet.","r":["10","zehn"],"e":"Das Video legt eine Skala von 1 (schlechte Voraussetzung) bis 10 (ideale Voraussetzung) fest, mit der jede Option pro Kriterium bewertet wird."},{"t":"lueck","q":"Im oberen Teil der Matrix trägt man immer das ___ von dem ein, was im unteren Teil steht.","r":["gegenteil"],"e":"Das Video erklärt, dass man die obere Hälfte spiegelverkehrt zur unteren Hälfte ausfüllt, also jeweils das Gegenteil einträgt."},{"t":"num","q":"Nutzwertanalyse: Nutzen 50 %, Machbarkeit 30 %, Risiko 20 %. Idee X bekommt 8, 6 und 5 Punkte. Gesamtwert?","r":6.8,"tol":0.01,"u":"Punkte","e":"0,5×8 + 0,3×6 + 0,2×5 = 4,0 + 1,8 + 1,0 = 6,8."},{"t":"lueck","q":"Die Zeit, bis die Erträge die Anschaffungskosten übertreffen, nennt man die ___.","r":["amortisationsdauer"],"e":"Diese Kennzahl heisst laut Video Amortisationsdauer."},{"t":"lueck","q":"Bei der Kumulationsmethode werden die Rückflüsse Periode für Periode ___, bis sie den Kapitaleinsatz übersteigen.","r":["addiert"],"e":"Genau das ist der Kern der Kumulationsmethode, im Gegensatz zur Durchschnittsmethode mit einem festen Durchschnittswert."},{"t":"lueck","q":"Der Gewinn ergibt sich laut Video aus Erlöse minus ___.","r":["kosten"],"e":"Das Video definiert den Gewinn ausdrücklich als Erlöse minus Kosten."},{"t":"num","q":"Einmalige Kosten 90'000, Betrieb 15'000 pro Jahr, Nutzen 60'000 pro Jahr. Payback in Jahren?","r":2,"tol":0,"u":"Jahre","e":"Nettonutzen pro Jahr = 60'000 − 15'000 = 45'000. 90'000 ÷ 45'000 = 2 Jahre. Laufende Kosten nicht vergessen."},{"t":"num","q":"Gleiches Projekt, Worst Case: Nutzen nur 35'000 pro Jahr. Kumuliertes Ergebnis nach 3 Jahren (in Franken, Minus mit Vorzeichen)?","r":-30000,"tol":0,"u":"CHF","e":"(35'000 − 15'000) × 3 = 60'000. 60'000 − 90'000 = −30'000. Szenarien zeigen, wie robust der Entscheid ist (C5)."},{"t":"lueck","q":"STEP und PEST haben laut Video denselben Zweck, nur die Reihenfolge der ___ ist unterschiedlich sortiert.","r":["buchstaben"],"e":"Das Video sagt wörtlich, dass bei PEST einfach die Buchstabenreihenfolge von STEP anders sortiert ist."},{"t":"lueck","q":"PESTEL: Political, Economic, Social, Technological, ___ , Legal.","r":["ecological","ökologisch","oekologisch","environmental","umwelt"],"e":"Das Qualifikationsprofil A2 zählt genau diese sechs auf: politisch, wirtschaftlich, gesellschaftlich, technologisch, ökologisch, rechtlich."},{"t":"lueck","q":"Ein Beispiel für einen Quick Win im Video ist ein KI-___-Assistent, während personalisierte Empfehlungen wie bei Disney Plus ein strategischer Anwendungsfall sind.","r":["meeting"],"e":"Das Video nennt einen KI-Meeting-Assistenten als Beispiel für einen schnellen, kleinen Erfolg."},{"t":"lueck","q":"Beim Beispiel der Gabelstapler-Leerfahrten wollte der Kollege mindestens 15 Prozent Reduktion erreichen, bevor sich die Investition in die Technologie laut Gespräch ___.","r":["lohnt"],"e":"Erst ab diesem Schwellenwert soll es laut dem Kollegen sinnvoll sein, weiter in die Technologie zu investieren."},{"t":"lueck","q":"Ein PoC ohne ___ kann nicht scheitern und beweist darum auch nichts.","r":["abbruchkriterium"],"e":"Das Abbruchkriterium wird vor dem Test festgelegt, weil nachher jede Zahl gut aussieht."},{"t":"lueck","q":"Bevor man eine Prozessanalyse macht, sollte man laut Video zuerst klare Prozess___ festlegen, sonst ist der Aufwand reine Verschwendung.","r":["ziele"],"e":"Das Video sagt ausdrücklich, ohne definierte Prozessziele sei die ganze Analyse Selbstverschwendung."},{"t":"lueck","q":"Der Hauptprozess, zu dem das Beispiel gehört, heisst laut Video Personal zur ___ stellen.","r":["verfügung"],"e":"Das Video ordnet den Beispielprozess dem Hauptprozess Personal zur Verfügung stellen zu."},{"t":"lueck","q":"Das Prüfungsmuster für «Beurteilen Sie die Eignung» hat drei Teile: Mangel, Folge, ___ .","r":["massnahme"],"e":"Mangel mit Beleg aus dem Text, Folge für das Modell, Massnahme. «Die Qualität muss sichergestellt werden» gibt null Punkte."},{"t":"lueck","q":"Ein Trendradar muss laut Video ___ überprüft werden, damit er dauerhaft hilft.","r":["regelmaessig"],"e":"Das Video betont am Ende ausdrücklich, dass der Trendradar regelmässig überprüft werden muss."},{"t":"lueck","q":"Produkte oder Dienstleistungen, die als Ersatz für das Produkt einer Branche dienen, nennt Porter ___.","r":["substitute","substitutprodukte"],"e":"Solche Ersatzprodukte nennt das Modell von Porter Substitute."},{"t":"lueck","q":"Ersatzprodukte sind laut Video besonders gefährlich, wenn Kunden kaum ___ zu einem Produkt haben.","r":["loyalität"],"e":"Ohne Kundenloyalität wechseln Kunden leicht zu einem günstigeren oder gleichwertigen Substitut."},{"t":"lueck","q":"Ein gutes Ziel für einen KI-Agenten ist laut Video eins, bei dem der Agent selbst merken kann, dass es erreicht ist, also ein klar ___ Ziel.","r":["definiertes","messbares"],"e":"Das Video betont, dass Ziele für Agenten messbar bzw. klar definiert sein müssen, sonst weiss der Agent nicht, wann er fertig ist."},{"t":"lueck","q":"Porters fünf Kräfte: Rivalität, neue Anbieter, Ersatzprodukte, Verhandlungsmacht der Lieferanten und Verhandlungsmacht der ___ .","r":["kunden","abnehmer","käufer","kaeufer"],"e":"Branchenstrukturanalyse für A2. KI kann jede Kraft verschieben, z.B. Eintrittsbarrieren senken."},{"t":"lueck","q":"Im Beispiel des Videos verrät ein Vergleich der Krankmeldungen zwischen Abteilungen etwas darüber, wie ___ die Mitarbeitenden sind.","r":["zufrieden"],"e":"Das Video erklärt, dass Krankmeldungen viel darüber aussagen, wie zufrieden Mitarbeitende in einer Abteilung sind."},{"t":"lueck","q":"Die Differenz zwischen dem Best-Practice-Case und dem eigenen Ist-Zustand nennt das Video das ___.","r":["potenzial"],"e":"Das Video definiert genau diese Differenz zwischen Best Practice und eigenem Ist-Zustand als Potenzial."},{"t":"lueck","q":"Der Design-Thinking-Prozess ist nicht ___, das heisst einzelne Schritte können sich überlappen und gegenseitig beeinflussen.","r":["linear"],"e":"Das Video betont ausdrücklich, dass der Prozess nicht linear verläuft."},{"t":"lueck","q":"Der wichtigste Tipp am Ende des Gesprächs für Individuen und Unternehmen lautet, ___ zu bleiben.","r":["neugierig"],"e":"Kenza Ait Si Abbou nennt Neugierde als ihren zentralen Tipp, um offen für neue Entwicklungen zu bleiben."},{"t":"lueck","q":"Ein schwaches Modell brau d Fremdbezug genau gleich teuer?","a":["100 Stück","500 Stück","1000 Stück","2000 Stück"],"r":1,"e":"Das Video berechnet die kritische Menge im Beispiel auf 500 Stück, ab der Eigenfertigung günstiger wird."},{"q":"Für welche Fertigungsart entscheidet sich das Unternehmen im Video, wenn es 1000 Stück pro Jahr absetzen kann?","a":["für den Fremdbezug","für keine von beiden","für die Eigenfertigung, weil 1000 über der kritischen Menge von 500 liegt","das Video trifft keine Entscheidung"],"r":2,"e":"Da 1000 Stück über der kritischen Menge von 500 liegen, empfiehlt das Video im Beispiel die Eigenfertigung."},{"q":"Wie lautet der im Video gezeigte Rechen-Hack, um die kritische Menge ohne Funktionen zu berechnen?","a":["Fixkosten mal Stückzahl","Fixkosten geteilt durch die Differenz der variablen Stückkosten von Fremd- und Eigenfertigung","variable Kosten geteilt durch Fixkosten","Fixkosten minus variable Kosten"],"r":1,"e":"Das Video zeigt den Hack: Fixkosten geteilt durch die Differenz der variablen Stückkosten von Fremdfertigung minus Eigenfertigung ergibt direkt die kritische Menge."},{"q":"Wie berechnet man den Risikowert in der Risikomatrix?","a":["Kosten plus Nutzen","Eintrittswahrscheinlichkeit mal Schadensausmass","Anzahl Risiken durch Anzahl Mitarbeitende","Budget mal Laufzeit"],"r":1,"e":"Danach Massnahmen: vermeiden, vermindern, übertragen (Versicherung, Vertrag), akzeptieren.","p":1}]},{"kz":"A","titel":"KI-Technik verstehen","pl":2,"ord":[{"q":"Bringe die Schritte im Transformer laut Video in die richtige Reihenfolge.","a":["Jedes Wort wird in eine Liste von Zahlen umgewandelt","Attention lässt die Wortvektoren sich gegenseitig beeinflussen","Ein Feedforward-Netzwerk verarbeitet die Information weiter","Am Ende entsteht eine Wahrscheinlichkeit für das nächste Wort"],"e":"Das Video beschreibt genau diesen Ablauf: Vektorbildung, Attention, Feedforward-Netzwerk, Vorhersage."},{"q":"Bringe den Ablauf in die richtige Reihenfolge, wie ChatGPT im Video die fehlenden t ein statt nur des letzten Wortes.","p":1},{"q":"Wie viele Dateien braucht es, um das Sprachmodell Llama 2 70B auf einem Laptop laufen zu lassen, ganz ohne Internet?","a":["Nur eine einzige Datei","Zwei Dateien: Parameter und Programmcode","Etwa zehn verschiedene Programme","Ein ganzes Rechenzentrum"],"r":1,"e":"Das Video sagt ausdrücklich, ein grosses Sprachmodell besteht nur aus zwei Dateien: der Parameterdatei und dem Run-Code."},{"q":"Wie gross ist ungefähr die Datei mit den 70 Milliarden Parametern von Llama 2?","a":["14 Megabyte","1,4 Gigabyte","140 Gigabyte","14 Terabyte"],"r":2,"e":"70 Milliarden Parameter mal 2 Byte pro Parameter (float16) ergeben laut Video etwa 140 Gigabyte.","p":1},{"q":"Was steht laut Video in der Parameterdatei eines Sprachmodells wie Llama 2?","a":["Der Quellcode der Webseite","Die Gewichte des neuronalen Netzes","Die komplette Trainingsdatenbank","Die Fragen der Nutzer"],"r":1,"e":"Die Parameterdatei enthält die Gewichte des neuronalen Netzes, gespeichert als 2 Byte pro Parameter.","p":1},{"q":"Was tut ein Sprachmodell im Kern, wenn es antwortet?","a":["Es schlägt die Antwort in einer Datenbank nach","Es berechnet Stück für Stück das wahrscheinlichste nächste Wort","Es versteht die Frage wie ein Mensch und überlegt","Es sucht im Internet nach der besten Quelle"],"r":1,"e":"Ein LLM sagt Token für Token voraus, was wahrscheinlich folgt. Es weiss nichts, es schätzt. Daraus folgen Halluzinationen und die Notwendigkeit fester Regeln.","p":1},{"q":"Wenn ein Sprachmodell zweimal dieselbe Frage bekommt, wieso kann die Antwort unterschiedlich ausfallen?","a":["Weil das Modell zufällig aus den wahrscheinlichsten nächsten Tokens auswählt","Weil sich das Modell zwischendurch neu trainiert","Weil der Server jedes Mal eine andere Version lädt","Weil die Frage bei der zweiten Eingabe automatisch verändert wird"],"r":0,"e":"Das Modell sampelt den nächsten Token aus einer Wahrscheinlichkeitsverteilung, das Video erklärt genau das als Ursache für die Zufälligkeit."},{"q":"Was macht ein LLM, wenn die Temperature nahe null gesetzt wird?","a":["Es wird kreativer und unvorhersehbarer","Es wählt fast immer den wahrscheinlichsten nächsten Token, die Antwort wird deterministisch","Es storniert die Anfrage","Es verdoppelt die Tokenanzahl"],"r":1,"e":"Eine Temperature nahe null macht laut Video die Verteilung so scharf, dass fast immer der Token mit dem höchsten Logit gewählt wird."},{"q":"Wie heisst die Methode, bei der immer der Token mit der höchsten Wahrscheinlichkeit gewählt wird?","a":["Top-P Sampling","Temperature Scaling","Greedy Sampling","Top-K Sampling"],"r":2,"e":"Das Video nennt genau diese Methode Greedy Sampling, sie liefert immer dieselbe, aber oft langweilige Antwort."},{"q":"Was macht Top-K Sampling mit einem K-Wert von fünf?","a":["Es begrenzt die Auswahl auf die fünf Tokens mit der höchsten Wahrscheinlichkeit","Es erhöht die Temperature auf fünf","Es wiederholt den Prompt fünfmal","Es summiert die fünf letzten Antworten"],"r":0,"e":"Top-K mit Wert fünf behält nur die fünf wahrscheinlichsten Tokens und verteilt die Wahrscheinlichkeiten neu."},{"q":"Wie nennt man die kleinste Informationseinheit, die ein KI-Modell verarbeitet?","a":["Bit","Pixel","Token","Byte"],"r":2,"e":"Ein Token ist laut Video die kleinste Einheit, die ein generatives KI-Modell verarbeitet.","p":1},{"q":"Wovon hängt ab, wie viel du für eine Anfrage an ein KI-Modell bezahlst?","a":["Von der Tageszeit","Von der Anzahl verwendeter Tokens","Von der Bildschirmgrösse","Von der Internetgeschwindigkeit"],"r":1,"e":"Je mehr Input- und Output-Tokens genutzt werden, desto mehr wird verrechnet.","p":1},{"q":"Wo speichert ein grosses Sprachmodell die Muster, die es beim Training gelernt hat?","a":["Auf der Festplatte des Nutzers","In einem Vokabular","In der Cloud eines Drittanbieters","Im Arbeitsspeicher der Grafikkarte"],"r":1,"e":"Das Video nennt das gespeicherte Wissen eines Sprachmodells Vokabular, bei Bild- und Audiomodellen heisst es Coo erten Prompt."},{"q":"Was ist Few-Shot-Prompting?","a":["Das Modell mit wenigen Daten neu trainieren","Dem Prompt einige Beispiele von Eingabe und gewünschter Ausgabe beilegen","Den Prompt auf wenige Wörter kürzen","Mehrere Modelle gleichzeitig fragen"],"r":1,"e":"Beispiele im Prompt zeigen Muster und Format. Zero-Shot = ohne Beispiel."},{"q":"Ein Assistent soll zu «Zeig mir alle Produkte der Kategorie Beeren» eine Datenbankabfrage bauen und liefert Zitrusfrüchte. Was fehlte im Prompt am ehesten?","a":["Ein höflicher Ton","Die Zuordnung Kategoriename zu Kategorie-ID bzw. das Schema","Eine höhere Temperatur","Ein längerer Satz"],"r":1,"e":"Ohne Schema oder ID-Liste rät das Modell die ID. Genau dieser Fehlertyp steckt in Nullserie Challenge 01."},{"q":"Wie viele Tokens kann ein Modell wie Gemini 2.5 Pro laut Video maximal in seinem Kontextfenster verarbeiten?","a":["10.000","100.000","Bis zu einer Million","Unbegrenzt viele"],"r":2,"e":"Das Video nennt Gemini 2.5 Pro als Beispiel für ein Modell mit einem Kontextfenster von bis zu einer Million Tokens."},{"q":"Warum kann ein Sprachmodell keine Ereignisse von letzter Woche erklären, auch wenn es sehr gross ist?","a":["Weil es zu langsam rechnet","Weil sein Trainingsdatensatz diese Ereignisse noch nicht enthielt","Weil es keine Internetverbindung braucht","Weil die Temperature zu niedrig eingestellt ist"],"r":1,"e":"Ein Modell kennt laut Video nur das, was im Trainingsdatensatz stand, neuere Ereignisse fehlen einfach."},{"q":"Wofür steht die Abkürzung RAG laut Video?","a":["Random Augmented Generation","Retrieval Augmented Generation","Ranked Attention Generation","Real-time API Gateway"],"r":1,"e":"RAG steht für Retrieval Augmented Generation, das Zusammensuchen relevanter Informationen kombiniert mit generativer KI.","p":1},{"q":"Wie viele grundsätzliche Wege gibt es laut Video, ein Sprachmodell an den Unternehmenskontext anzupassen?","a":["Zwei","Drei","Vier","Fünf"],"r":1,"e":"Das Video nennt Prompt Engineering, RAG n Zahlen, die Daten wie Text oder Bild repräsentiert","Ein Backup der Datenbank","Ein Tag, das ein Mensch manuell vergibt"],"r":1,"e":"Das Video definiert ein Embedding genau so: eine Liste von Zahlen, die Daten in anderer Form darstellt.","p":1},{"q":"Warum reicht es laut Video nicht, Embeddings nur zu speichern?","a":["Weil die Suche über tausende Vektoren ohne Index viel zu langsam wäre","Weil Embeddings sich ständig von selbst verändern","Weil Embeddings nicht in Zahlen umgewandelt werden können","Weil jede Datenbank nur einen Vektor speichern darf"],"r":0,"e":"Ohne Index wäre eine Suche über tausende Vektoren nach Distanz viel zu langsam, deshalb braucht es die Indexierung.","p":1},{"q":"Was ist ein Embedding?","a":["Eine verschlüsselte Kopie des Dokuments","Eine Zahlenreihe (Vektor), die die Bedeutung eines Textes abbildet","Ein Stichwortverzeichnis","Eine Zusammenfassung in einem Satz"],"r":1,"e":"Texte mit ähnlicher Bedeutung liegen als Vektoren nahe beieinander. So findet «Malrechnen» auch «Multiplikation».","p":1},{"q":"In der Metapher des Videos nimmt ein Student in die Klausur seine Unterlagen mit und lernt vorher nichts. Für welches Verfahren steht das?","a":["Fine-Tuning","Retrieval Augmented Generation","Prompt Engineering","Greedy Sampling"],"r":1,"e":"Der Student mit Unterlagen, aber ohne Vorbereitung steht im Video für RAG, das Modell holt sich die Infos erst bei der Anfrage."},{"q":"Welches der beiden Verfahren ist laut dem im Video zitierten Microsoft-Paper meistens teurer?","a":["Fine-Tuning","RAG","Beide sind gleich teuer","Keins von beiden kostet etwas"],"r":0,"e":"Fine-Tuning braucht teure Rechenleistung und viele hochwertige Trainingsdaten, das macht es laut Video deutlich teurer als RAG."},{"q":"Welchen Vorteil von RAG nennt das Video als ersten Punkt?","a":["RAG reduziert die Halluzination des Sprachmodells","RAG macht das Modell schneller als eine direkte Anfrage","RAG braucht überhaupt keine Trainingsdaten mehr","RAG ersetzt die Softmax- lizites Wissen einzelner Mitarbeitender durch Austausch ___ gemacht.","r":["explizit"],"e":"Das Video sagt wörtlich, dass implizites Wissen durch den Austausch in der Cop explizit gemacht werden kann."},{"t":"lueck","q":"Mitglieder einer Community of Practice entwickeln ein gemeinsames ___ an Ressourcen wie Erfahrungen, Geschichten und Werkzeugen.","r":["repertoire"],"e":"Dieses gemeinsame Repertoire an Ressourcen nennt das Video als Kern der dritten Eigenschaft, der Praxis."}],"mc":[{"q":"Wer hat das ADKAR-Modell in den 1990er Jahren entwickelt?","a":["Jeff Hiatt","John Kotter","Kurt Lewin","Peter Drucker"],"r":0,"e":"Das Video nennt Jeff Hiatt als Entwickler des ADKAR-Modells in den 1990er Jahren.","p":1},{"q":"Setzt das ADKAR-Modell den Fokus eher auf die ganze Organisation oder auf jede einzelne Person?","a":["nur auf die gesamte Organisation als Ganzes","auf jede einzelne Person, denn nur wenn Einzelne sich ändern, ändert sich die Organisation","nur auf die oberste Führungsebene","auf gar niemanden, es ist rein technisch"],"r":1,"e":"Das Video betont, dass ADKAR anders als die meisten Modelle auf der individuellen Ebene ansetzt: nur wenn jede Person sich ändert, ändert sich am Ende die ganze Organisation."},{"q":"Was ist laut Video der Kernunterschied zwischen dem dritten Schritt Knowledge und dem vierten Schritt Ability?","a":["Knowledge ist Theorie, wie man sich ändern soll, Ability ist die tatsächlich gezeigte Fähigkeit dazu","beide Schritte bedeuten genau dasselbe","Ability kommt vor Knowledge","Knowledge betrifft nur das Management, Ability nur die Mitarbeitenden"],"r":0,"e":"Das Video unterscheidet Wissen (Knowledge), also die Theorie, wie man sich verändern soll, von der praktisch gezeigten Fähigkeit (Ability), die neuen Verhaltensweisen umzusetzen."},{"q":"Wie viele Phasen hat das ADKAR-Modell laut Video?","a":["Drei","Vier","Fünf","Sieben"],"r":2,"e":"ADKAR ist ein Akronym aus fünf Buchstaben und damit fünf Phasen, Awareness, Desire, Knowledge, Ability und Reinforcement.","p":1},{"q":"Wer hat das ADKAR-Modell laut Video entwickelt?","a":["John Kotter","Jeff Hyatt","Kurt Lewin","Peter Drucker"],"r":1,"e":"Das Video nennt den US-amerikanischen Wissenschaftler und Unternehmer Jeff Hyatt als Entwickler des ADKAR-Modells.","p":1},{"q":"Worauf stellt das ADKAR-Modell laut Video den Fokus?","a":["Auf die Finanzierung des Projekts","Auf den einzelnen Menschen und seinen individuellen Wandel","Auf die IT-Infrastruktur des Unternehmens","Auf die Konkurrenzanalyse"],"r":1,"e":"Das Video betont, dass ADKAR ein Modell für den individuellen Wandel ist und die einzelne Person in den Fokus stellt.","p":1},{"q":"Darf man bei Kotters 8-Stufen-Modell einzelne Phasen überspringen, um schneller voranzukommen?","a":["Ja, das ist sogar empfohlen","Nein, laut Kotter erhöht das die Wahrscheinlichkeit des Scheiterns","Ja, aber nur die letzten zwei Phasen","Das Modell hat gar keine feste Reihenfolge"],"r":1,"e":"Kotter geht laut Video davon aus, dass übersprungene Phasen die Erfolgswahrscheinlichkeit deutlich senken."},{"q":"Was ist die allererste Phase in Kotters Modell für erfolgreichen Wandel?","a":["Die Veränderung in der Kultur verankern","Ein Gefühl der Dringlichkeit erzeugen","Sofort neue Software einführen","Alle Mitarbeitenden entlassen"],"r":1,"e":"Kotters erste Phase besteht laut Video darin, ein Gefühl der Dringlichkeit zu erzeugen.","p":1},{"q":"Wozu dient laut Kotter eine gemeinsame Vision des Wandels?","a":["Nur zur Dekoration von Präsentationen","Als Entscheidungsgrundlage und um die Mitarbeitenden zu motivieren","Um die Führungskraft zu ersetzen","Um Kosten zu sparen"],"r":1,"e":"Die Vision dient laut Video als Entscheidungsgrundlage und motiviert die Mitarbeitenden im Projektverlauf.","p":1},{"q":"Wie viele Phasen hat das Change-Modell von Kurt Lewin?","a":["Zwei","Drei","Fünf","Acht"],"r":1,"e":"Das Modell heisst explizit Dreiphasenmodell.","p":1},{"q":"Was passiert laut Video typischerweise während der mittleren Phase (Bewegung) eines Change-Prozesses?","a":["Alles läuft sofort besser","Es kommt zu einem Leistungsabfall und Konflikten","Nichts verändert sich","Der Prozess ist bereits abgeschlossen"],"r":1,"e":"Weil alte Routinen aufgebrochen und neue noch nicht eingeübt sind, kommt es zu Leistungsabfall, Orientierungslosigkeit und Widerstand."},{"q":"Wie nennt Lewin die dritte Phase, in der ein neuer Zustand zum neuen Standard erhoben wird?","a":["Auftauen (Unfreeze)","Bewegung (Moving)","Stabilisierung (Refreeze)","Rücksturz"],"r":2,"e":"In der Stabilisierungsphase wird der neue Zustand eingefroren und als neuer Standard festgelegt."},{"q":"Worauf konzentriert sich Change Management laut Video, im Unterschied zum klassischen Projektmanagement?","a":["Auf die technischen Systeme","Auf die Menschen und ihre emotionalen Reaktionen auf Veränderung","Auf die Buchhaltung","Auf die Lieferanten"],"r":1,"e":"Das Video sagt, Projektmanagement deckt die funktionale Seite ab, Change Management die emotionale Seite der Menschen."},{"q":"Was ist laut Video der dritte Tipp, um Veränderungen leichter umzusetzen?","a":["Die Veränderung komplett geheim halten","Die Mitarbeitenden mitmachen und mitgestalten lassen","Alle Veränderungen auf einmal einführen, also Big Bang","Nur die Führungskräfte informieren"],"r":1,"e":"Der dritte Tipp im Video lautet, Mitarbeitenden Autonomie und Mitgestaltung zu geben.","p":1},{"q":"Was sind laut Video Komfortängste?","a":["Angst vor Gehaltskürzungen","Sorgen um Arbeitsweg, Büro oder Arbeitsplatzsituation","Angst vor dem kompletten Verlust des Arbeitsplatzes","Angst vor neuen gesetzlichen Vorschriften"],"r":1,"e":"Das Video ordnet Fragen zu Arbeitsweg und Bürosituation den Komfortängsten zu.","p":1},{"q":"In wie viel Prozent der gescheiterten Veränderungsprojekte liegt es laut Video nicht an der fachlichen Planung, sondern am Umgang mit den Betroffenen?","a":["Etwa zehn Prozent","Etwa zwei Drittel der Fälle","Nie, es liegt immer an der Fachlichkeit","Genau 100 Prozent"],"r":1,"e":"Das Video nennt rund zwei Drittel der gescheiterten Projekte, bei denen der Umgang mit den Betroffenen und nicht die fachliche Planung das Problem war."},{"q":"Reicht es laut Video aus, Menschen nur gute Informationen und Erklärungen zu geben, um jede Form von Widerstand aufzulösen?","a":["Ja, das reicht bei jeder Form von Widerstand","Nein, das hilft nur beim rationalen Widerstand, nicht bei Angst oder fehlendem Vertrauen","Nein, Informationen verstärken jeden Widerstand","Diese Frage wird im Video nicht behandelt"],"r":1,"e":"Erklärungen lösen laut Video nur den rationalen Widerstand auf, bei emotionalem oder persönlich begründetem Widerstand braucht es Zuhören und Vertrauensaufbau."},{"q":"Welche Aussage steht laut Video beispielhaft für den rationalen Widerstand?","a":["Ich mag das nicht","Ich verstehe das nicht","Ich mag Sie nicht","Ich habe keine Zeit"],"r":1,"e":"Das Video nennt Ich verstehe das nicht als typische Aussage für rationalen Widerstand, dem man mit Information begegnen kann.","p":1},{"q":"Was steckt laut Video hinter dem persönlich begründeten Widerstand?","a":["Fehlendes Vertrauen","Fehlende technische Ausstattung","Zu viel Information","Ein zu hohes Gehalt"],"r":0,"e":"Beim persönlich begründeten Widerstand, ausgedrückt durch Ich mag Sie nicht, steckt laut Video fehlendes Vertrauen dahinter.","p":1},{"q":"Woher kommen laut der Expertin über 90% der Sicherheitsvorfälle im Zusammenhang mit Sprachmodellen in Unternehmen?","a":["Von Hackerangriffen auf Rechenzentren","Davon, dass Mitarbeitende unangemeldet die kostenlose Version nutzen und Originaldaten eingeben","Von fehlerhafter Software der Anbieter","Von zu langsamen Internetverbindungen"],"r":1,"e":"Die Expertin nennt als Hauptursache, dass Mitarbeitende die kostenlose, unangemeldete Version eines Chatbots nutzen und dabei echte, sensible Originaldaten eingeben."},{"q":"Empfiehlt die Expertin, heute schon eigene Finanz- oder Gesundheitsdaten mit einem Sprachmodell zu teilen?","a":["Ja, das sei völlig unproblematisch","Nein, sie rät ausdrücklich davon ab, Stand heute","Nur bei bezahlten Versionen uneingeschränkt","Nur wenn man ein Passwort setzt"],"r":1,"e":"Ihr allererster Rat ist, aktuell keine Finanzdaten, Kreditkarteninformationen oder tiefe Gesundheitsdaten mit einem Large Language Model zu teilen."},{"q":"Was versteht die Expertin unter 'Ambiguitätstoleranz' im Zusammenhang mit KI?","a":["Die Fähigkeit, KI komplett zu ignorieren","Gleichzeitig Begeisterung und Kritik gegenüber KI aushalten zu können, ohne zum KI-Hasser zu werden","Nur noch positive Dinge über KI zu sagen","Alle Entscheidungen komplett der KI zu überlassen"],"r":1,"e":"Sie beschreibt Ambiguitätstoleranz als die Fähigkeit, positive Effekte und berechtigte Kritik an KI gleichzeitig zuzulassen, ohne in eine extreme Position zu kippen."},{"q":"Wie beschreibt die Expertin Europas Position im globalen KI-Wettbewerb?","a":["Europa ist klarer Marktführer","Europa kann bestenfalls 'Fast Mover' sein, nicht 'First Mover'","Europa hat keinerlei Rückstand","Europa führt bei der Finanzierung von KI-Firmen"],"r":1,"e":"Sie sagt, angesichts der jahrzehntelangen Finanzierungsvorsprünge der USA könne Europa bestenfalls schnell nachziehen, aber nicht führend sein.","p":1},{"q":"Was ist die schwächste erste Reaktion auf Widerstand?","a":["Zuhören und Gründe erfragen","Mit besseren Folien die Vorteile noch einmal erklären","Betroffene am Pilot beteiligen","Offen sagen, was sich ändert und was nicht"],"r":1,"e":"Mehr Argumente gegen Gefühle wirken nicht. Erst verstehen, dann beteiligen, dann informieren.","p":1},{"q":"Der CEO sagt an der Betriebsversammlung: «KI macht uns 20 % effizienter.» Was hört die Belegschaft?","a":["Wir bekommen bessere Werkzeuge","Jede fünfte Stelle ist in Gefahr","Nichts Besonderes","Mehr Lohn"],"r":1,"e":"Kommunikation aus Sicht der Empfänger prüfen. Aussagen zu Stellen, Rollen und Zeitplan gehören ehrlich und früh auf den Tisch."},{"q":"Was passiert im Beispiel des Videos mit dem Wissen über ein Produkt, wenn der einzige zuständige Mitarbeiter in Rente geht, ohne dass es Wissensmanagement gibt?","a":["das Wissen bleibt automatisch im System erhalten","niemand kann die Fragen dazu mehr beantworten, weil es niemand sonst in der Tiefe weiss","ein anderes Unternehmen übernimmt automatisch das Wissen","das Produkt wird sofort eingestellt"],"r":1,"e":"Im Video kann Nina viele Fragen zum Produkt ihres in Rente gegangenen Vorgängers nicht beantwortet bekommen, weil niemand sonst das Wissen in dieser Tiefe hat."},{"q":"Wo findet Paul im Szenario MIT Wissensmanagement die aktuelle Agenda für das nächste Meeting?","a":["er muss dutzende E-Mails durchsuchen","er ruft jeden Kollegen einzeln an","in einem gemeinsam geteilten Wiki, das alle Projektmitglieder bearbeiten können","es gibt gar keine Agenda mehr"],"r":2,"e":"Im Szenario mit Wissensmanagement legt Paul die Agenda in einem Wiki an, das alle Projektmitarbeitenden einsehen und kommentieren können, statt E-Mail-Chaos zu erzeugen."},{"q":"Warum verliert Vera im Szenario OHNE Wissensmanagement Zeit, als Marc krank wird?","a":["weil sie nicht weiss, wo die bisherigen Entwürfe der Postkampagne liegen und das erst per Mail klären muss","weil sie selbst krank wird","weil das Marketingteam aufgelöst wird","weil der Kunde absagt"],"r":0,"e":"Im Video muss Vera erst umständlich per Mail klären, wo die Entwürfe liegen und wer woran weiterarbeitet, weil es kein zentrales Wiki gibt."},{"q":"Wie heisst der Wissenschaftler, von dem das im Video vorgestellte Bausteinmodell stammt?","a":["Probst","Kotter","Hyatt","Lewin"],"r":0,"e":"Das Video stellt das Bausteinmodell von Probst vor, das im Wissensmanagement weit verbreitet ist."},{"q":"In wie viele Ebenen ist das Bausteinmodell laut Video unterteilt?","a":["In eine einzige Ebene","In eine strategische und eine operative Ebene","In drei gleichwertige Ebenen","In fünf Ebenen"],"r":1,"e":"Das Video unterteilt das Modell in eine strategische Ebene und eine Ebene des operativen Umgangs mit Wissen.","p":1},{"q":"Was passiert laut Video, wenn ein Unternehmen fehlendes Wissen nur von aussen einkauft, ohne es intern weiterzuentwickeln?","a":["Das Wissen bleibt automatisch für immer im Unternehmen","Das Unternehmen ist so schlau wie vorher, wenn der Berater geht","Die Kosten sinken automatisch","Es entstehen keinerlei Risiken"],"r":1,"e":"Das Video warnt davor, dass die Organisation so dumm wie vorher bleibt, wenn eingekauftes Wissen nicht an eine eigene Wissensentwicklung angeknüpft wird."},{"q":"Wie viel Prozent ihrer täglichen Arbeitszeit verbringen Mitarbeitende laut Video mit der Suche nach Informationen?","a":["Etwa 5 Prozent","Etwa 20 Prozent","Etwa 50 Prozent","Etwa 80 Prozent"],"r":1,"e":"Das Video nennt fast 20 Prozent der täglichen Arbeitszeit für die Informationssuche."},{"q":"Was ist der Nachteil von einfachen Custom-GPT-Chatbots gegenüber RAG-Modellen?","a":["Sie sind laut Video viel teurer","Sie basieren auf einem festen Datensatz und müssen manuell aktualisiert werden","Sie funktionieren nur auf Englisch","Es gibt laut Video gar keinen Unterschied"],"r":1,"e":"Custom GPTs arbeiten laut Video mit einem festen Datensatz, der manuell aktuell gehalten werden muss."},{"q":"Wofür steht die Abkürzung RAG laut Video?","a":["Random Access Generation","Retrieval Augmented Generation","Rapid AI Growth","Real-time Automated Grouping"],"r":1,"e":"Das Video erklärt RAG ausdrücklich als Retrieval Augmented Generation.","p":1},{"q":"Mitarbeitende haben 40 eigene KI-Agenten gebaut, niemand hat den Überblick. Beste Reaktion?","a":["Alle stoppen","Registrieren statt stoppen: Inventar, einfache Regeln, gute Beispiele sichtbar machen, Riskantes absichern","Ignorieren","Einen Wettbewerb ausrufen"],"r":1,"e":"So bleibt die Energie erhalten, und Wissen wird geteilt statt versteckt. Kern von Critical Incident 05."},{"q":"Woraus setzt sich der Begriff Schwachstelle laut Video zusammen?","a":["Aus Ursache und Wirkung","Aus Kosten und Nutzen","Aus Zeit und Geld","Aus Software und Hardware"],"r":0,"e":"Das Video definiert Schwachstelle als Ursache plus Wirkung.","p":1},{"q":"Was ist ein Workaround laut Video?","a":["Ein neuer Mitarbeiter","Eine Umgehungslösung für eine Störung","Ein Softwareupdate","Ein Vertragsdokument"],"r":1,"e":"Ein Workaround ist eine Umgehungslösung, die genutzt wird, bis die eigentliche Ursache behoben ist.","p":1},{"q":"Wer ist laut Video für die rasche Behebung einer gemeldeten Störung (Wirkung) zuständig?","a":["Das Change Management","Das Incident Management","Das Problem Management","Der Anwender selbst"],"r":1,"e":"Das Incident Management kümmert sich um die schnelle Abwicklung der gemeldeten Störungen."},{"q":"Wofür steht die Abkürzung ITIL?","a":["Internet Technology Information Line","IT Infrastructure Library","International Technical Incident List","Interactive Task and Issue Log"],"r":1,"e":"Das Video sagt ausdrücklich, ITIL steht für IT Infrastructure Library.","p":1},{"q":"Was passiert laut Video zuerst, wenn ein Benutzer beim Servicedesk anruft, weil sein Drucker nicht funktioniert?","a":["Sofort wird ein komplett neues Gerät bestellt","Der Servicedesk prüft im Incident Management, ob die Ursache schon bekannt ist","Der Fall geht direkt an das Change Management","Der Benutzer muss selbst die Software neu installieren"],"r":1,"e":"Der Servicedesk führt laut Video zuerst das Incident Management aus und prüft auf bekannte Ursachen."},{"q":"Wohin wird ein Problem laut Video weitergeleitet, wenn die Ursache eines Fehlers noch unbekannt ist?","a":["An das Release Management","An das Problem Management","Direkt an die CMDB","An den Benutzer zurück"],"r":1,"e":"Ist die Ursache unbekannt, wird das Problem laut Video an das Problem Management weitergeleitet."},{"q":"Ist Organizational Change Management in ITIL 4 laut Video ein klassischer Prozess?","a":["Ja, ganz klar ein Prozess","Nein, es stellt den Menschen in den Mittelpunkt und ist eher keine klassische Prozess-Practice","Es kommt in ITIL 4 gar nicht vor","Es ersetzt alle anderen Practices komplett"],"r":1,"e":"Das Video nennt Organizational Change Management als Beispiel für eine Practice, die die meisten Organisationen nicht als klassischen Prozess verstehen würden."},{"q":"Woraus besteht das ITIL Service Value System laut Video unter anderem?","a":["Leitprinzipien, Governance, Service-Wertschöpfungskette, Practices und kontinuierliche Verbesserung","Nur aus einer einzigen Checkliste","Ausschliesslich aus Kundenbewertungen","Aus 26 nummerierten Prozessen"],"r":0,"e":"Das Video zählt Leitprinzipien, Governance, die Service-Wertschöpfungskette, Practices und kontinuierliche Verbesserung als Bestandteile des Service Value Systems auf."},{"q":"Nach welchem internationalen Standard richtet sich das im Video vorgestellte Jasmin-Prozessmodell besonders?","a":["ISO 20000","ISO 9001","DIN EN 12345","RFC 2549"],"r":0,"e":"Das Video nennt ISO 20000 als internationalen Standard für Service Management, an dem sich das schlankere Prozessmodell orientiert."},{"q":"Der KI-Dienst ist ausgefallen, der Support stellt ihn per Neustart wieder her. Welcher ITIL-Prozess war das?","a":["Problem Management","Incident Management","Change Enablement","Capacity Management"],"r":1,"e":"Incident = Störung so schnell wie möglich beheben. Die Ursache ist damit noch nicht gefunden."},{"q":"Derselbe Ausfall kommt jede Woche. Welcher Prozess sucht die Ursache?","a":["Incident Management","Problem Management","Service Desk","Release Management"],"r":1,"e":"Problem = Ursache wiederkehrender Incidents finden und dauerhaft beseitigen.","p":1},{"q":"Das Modell soll durch eine neue Version ersetzt werden. Welcher Prozess stellt sicher, dass das kontrolliert geschieht?","a":["Incident Management","Problem Management","Change Enablement (Change Management)","Keiner"],"r":2,"e":"Change = Änderungen bewerten, freigeben, planen, mit Rückfallplan. Bei KI: vorher gegen Referenzdaten testen (Champion/Challenger)."},{"q":"Wofür stehen die vier Buchstaben PDCA?","a":["Plan, Design, Check, Act","Plan, Do, Check, Act","Prepare, Do, Control, Analyse","Process, Data, Cost, Analysis"],"r":1,"e":"PDCA steht für Plan, Do, Check, Act, die vier Schritte des Zyklus.","p":1},{"q":"Sollte man eine neue Massnahme im PDCA-Zyklus zuerst im ganz grossen Stil ausrollen oder erst im Kleinen testen?","a":["Sofort im ganz grossen Stil ausrollen","Erst im kleinen Stil testen, z.B. an einer einzigen Produktvariante","Gar nicht testen, nur planen reicht","Nur am Wochenende testen"],"r":1,"e":"In der Do-Phase wird die Massnahme laut Video zunächst im kleinen Stil getestet, damit es im Fehlerfall nicht so teuer wird."},{"q":"Was passiert in der 'Do'-Phase des PDCA-Zyklus laut Video?","a":["Der Ist-Zustand wird zum ersten Mal analysiert","Die geplante Massnahme wird im kleinen, überschaubaren Stil getestet","Die Massnahme wird sofort unternehmensweit eingeführt","Es wird nichts getan, nur beobachtet"],"r":1,"e":"In der Do-Phase wird die Massnahme zunächst im kleinen Stil ausprobiert, zum Beispiel nur bei einer Tortensorte.","p":1},{"q":"Was macht man laut Video, wenn die Ziele beim Check nicht ganz erreicht wurden, aber die Richtung stimmt?","a":["Man verwirft die Änderung komplett","Man kann die Änderung trotzdem einführen und im nächsten Zyklus weiter verbessern","Man muss von vorne mit einer neuen Firma beginnen","Man wartet ein ganzes Jahr ab, ohne etwas zu tun"],"r":1,"e":"Auch eine Teilverbesserung lohnt sich laut Video sofort umzusetzen, den Rest kann man im nächsten PDCA-Durchlauf angehen."},{"q":"Auf wie vielen Ebenen einer Organisation findet KVP laut Video statt?","a":["nur in der Führungsetage","nur an der Basis","auf allen Ebenen, von der Führung bis zur Basis","KVP betrifft nur die IT-Abteilung"],"r":2,"e":"Das Video sagt ausdrücklich, KVP finde auf allen Ebenen der Organisation statt, von der Führungsetage bis zur Basis.","p":1},{"q":"Reicht es beim dritten Schritt des KVP, nur zu prüf
