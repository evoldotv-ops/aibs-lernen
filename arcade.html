uf Klarheit, Struktur und Schlichtheit an","Ja, aber nur bei Farbe","Nein, Flipcharts braucht man laut Video gar nicht mehr"],"r":1,"e":"Das Video betont ausdrücklich, dass kein grosses künstlerisches Talent nötig ist."},{"q":"In welcher Reihenfolge sollte man bei einem Rahmen um einen Textblock vorgehen?","a":["Zuerst den Rahmen zeichnen, dann hineinschreiben","Zuerst schreiben, dann den Rahmen darum ziehen","Das spielt laut Video keine Rolle","Gar keinen Rahmen verwenden"],"r":1,"e":"Das Video empfiehlt ausdrücklich, erst zu schreiben und danach den Rahmen zu ziehen.","p":1},{"q":"Warum empfiehlt das Video, zuerst zu schreiben und erst danach den Rahmen um den Text zu ziehen?","a":["Weil es sonst nicht gelingt, dass die Schrift genau in den Rahmen passt","Weil das schneller aussieht","Weil Rahmen generell verboten sind","Weil man sonst zu viel Papier braucht"],"r":0,"e":"Das Video begründet die Reihenfolge damit, dass die Schrift sonst nicht sauber in den Rahmen passt."},{"q":"Wann ist die Berufsprüfung bestanden?","a":["Wenn der gewichtete Schnitt 4.0 erreicht","Wenn jeder der drei Prüfungsteile mindestens 4.0 erreicht","Wenn Teil 1 bestanden ist","Wenn zwei von drei Teilen bestanden sind"],"r":1,"e":"Keine Kompensation. Die Gewichtung 50/25/25 zählt nur für die Gesamtnote.","p":1}]},{"kz":"F","titel":"Entwickeln und einführen","pl":5,"ord":[{"q":"Bringe die vier Projektphasen aus dem Video in die richtige Reihenfolge.","a":["Startphase mit Initiierung und Projektauftrag","Organisations- und Planungsphase","Durchführungsphase","Abschlussphase mit Projektdokumentation"],"e":"Genau in dieser Reihenfolge durchläuft ein Projekt laut Video seinen Lebenszyklus."},{"q":"Bringe die Scrum-Events eines Sprints in die richtige Reihenfolge, so wie im Video beschrieben.","a":["Sprint Planning","Tägliches Daily Scrum während des Sprints","Sprint Review mit dem fertigen Produktinkrement","Sprint Retrospective zum Prozess"],"e":"Das Video beschreibt genau diese Reihenfolge der Events innerhalb eines Sprints."},{"q":"Bringe die sechs ERP-Phasen aus dem Video in die richtige Reihenfolge.","a":["Discovery and Planning","Design","Development","Testing","Deployment, also Go-Live","Support and Updates"],"e":"Das Video nennt die Phasen genau in dieser Reihenfolge."},{"q":"Ordne die vier Rollout-Wege von «trifft bei einem Fehler sofort alle» bis «null Risiko, aber auch null Entlastung».","a":["Alle auf einmal (Big Bang)","Stufenweise","Pilotgruppe mit Freiwilligen","Im Schatten mitlaufen"],"e":"Je weniger Leute betroffen sind, desto kleiner das Risiko und desto kleiner der Nutzen."},{"q":"Einführung einer KI-Lösung: richtige Reihenfolge.","a":["Betroffene informieren, Sorgen abholen, Spielregeln festlegen","Test mit historischen Fällen und vorab festgelegtem Ziel","Pilot mit Freiwilligen, KI schlägt nur vor, Mensch entscheidet","Auswerten und Entscheid der Leitung","Rollout für alle mit Schulung, Support und Monitoring"],"e":"Dieser Fragetyp kam in fast jeder Übungs-Challenge vor. Menschen zuerst, Messung vor Ausweitung."},{"q":"Bringe die drei Hauptphasen nach Glasl in die richtige Reihenfolge der Eskalation.","a":["Win-win","Win-lose","Lose-lose"],"e":"Ein Konflikt eskaliert laut Glasl von win-win über win-lose bis hin zu lose-lose."}],"schreib":[{"t":"lueck","q":"Im Scrum verteilen sich die Projektmanagementaufgaben auf mehr ___, sie verschwinden aber nicht.","r":["schultern"],"e":"Das Video sagt wörtlich, dass sich die Aufgaben nur auf mehr Schultern verteilen, wenn es keinen zentralen Projektleiter gibt."},{"t":"lueck","q":"Das Dokument, das am Anfang eines Projekts das gemeinsame Verständnis von Projektleitung und Auftraggeber festhält, heisst der ___.","r":["projektauftrag"],"e":"Dieses zentrale Dokument nennt das Video den Projektauftrag."},{"t":"lueck","q":"Ziele sollten laut Video möglichst spezifisch, praxisnah und ___ formuliert werden.","r":["kurz"],"e":"Kurze, verständliche Formulierungen minimieren laut Video Missverständnisse."},{"t":"lueck","q":"Das tägliche, maximal 15-minütige Treffen des Entwicklungsteams heisst laut Video Daily ___.","r":["scrum"],"e":"Das Video nennt das tägliche Treffen ausdrücklich Daily Scrum, es dauert maximal 15 Minuten."},{"t":"lueck","q":"Die fünf Buchstaben, nach denen gute Kennzahlen laut Video aufgestellt werden sollten, ergeben das Wort ___.","r":["smart"],"e":"SMART steht für specific, measurable, achievable, relevant und time-bound."},{"t":"lueck","q":"Wenn jemand eine Seite besucht und sofort wieder verlässt, nennt das Video das eine ___.","r":["absprungrate","bounce rate"],"e":"Das Video beschreibt genau dieses Verhalten, sofortiges Verlassen der Seite, als Absprungrate oder Bounce Rate."},{"t":"lueck","q":"Ein Ziel sollte laut Video einen zeitlichen Puffer haben, damit man es trotz Hindernissen ___ erreichen kann.","r":["trotzdem"],"e":"Das Video empfiehlt einen Puffer von einigen Wochen, damit man das Ziel trotz Krankheit oder Urlaub noch erreicht."},{"t":"lueck","q":"SMART: spezifisch, messbar, attraktiv (akzeptiert), realistisch, ___ .","r":["terminiert","terminierbar","termin"],"e":"Ein Ziel ohne Termin ist ein Wunsch."},{"t":"lueck","q":"In der Deployment-Phase, also dem Go-Live, sollte man bereit sein, aufkommende Probleme zu ___ und Nutzenden bei der Umstellung zu helfen.","r":["beheben","loesen","troubleshooten"],"e":"Das Video verlangt, in dieser Phase auftretende Probleme sofort zu beheben."},{"t":"lueck","q":"Der Franchisegeber hat laut Video eine ___-Pflicht, das heisst, er muss bestehende Partner immer wieder weiterschulen.","r":["innovations"],"e":"Das Video nennt wörtlich die Innovationspflicht des Franchisegebers gegenüber seinen Partnern."},{"t":"lueck","q":"Laut Video entsteht Innovation nur durch ___ und nicht durch Reden.","r":["tun"],"e":"Der Satz aus dem Video lautet wörtlich: Innovation entsteht nur durch Tun und nicht durch Reden."}],"mc":[{"q":"Welche drei Elemente bilden laut Video das magische Dreieck im Projektmanagement?","a":["Leistung, Zeit und Kosten","Team, Budget und Ort","Idee, Umsetzung und Erfolg","Kunde, Lieferant und Produkt"],"r":0,"e":"Das Video nennt Leistung, Zeit und Kosten als die drei Ecken des magischen Dreiecks im Projektmanagement.","p":1},{"q":"Welche Rolle gibt es laut Video in einem Scrum-Projekt nicht?","a":["Product Owner","Scrum Master","Projektleiter","Entwicklungsteam"],"r":2,"e":"Das Video sagt, dass es im Scrum keinen Projektleiter gibt, sondern Product Owner, Scrum Master und Entwicklungsteam.","p":1},{"q":"Welches Merkmal gehört laut Video NICHT zu einem echten Projekt?","a":["Zielvorgabe","Zeitliche Begrenzung","Routinemässige Wiederholung","Begrenzte Ressourcen"],"r":2,"e":"Das Video sagt, dass Routineaufgaben, die immer gleich verlaufen, keine Projekte sind.","p":1},{"q":"Welche drei Dimensionen bilden das magische Dreieck im Projektmanagement?","a":["Geld, Farbe und Ort","Leistung, Zeit und Ressourcen","Team, Kaffee und Büroraum","Idee, Zufall und Glück"],"r":1,"e":"Das magische Dreieck besteht laut Video aus Leistung, Zeit und Ressourcen.","p":1},{"q":"In welcher Projektphase werden laut Video die meisten Ressourcen verbraucht?","a":["In der Startphase","In der Durchführungsphase","In der Abschlussphase","In jeder Phase gleich viel"],"r":1,"e":"Laut Video steigt der Ressourcenverbrauch bis zur Durchführungsphase an und sinkt danach wieder.","p":1},{"q":"Was ist laut Video der Unterschied zwischen Zielen und Randbedingungen in einem Projektauftrag?","a":["Es gibt keinen Unterschied","Ziele schränken das Projekt absichtlich ein, Randbedingungen unabsichtlich","Randbedingungen sind wichtiger als Ziele","Ziele werden nie schriftlich festgehalten"],"r":1,"e":"Ziele werden bewusst gesetzt, während Randbedingungen sich unabsichtlich aus Umständen wie Ressourcenmangel ergeben."},{"q":"Was ist für den Projekterfolg laut Video oft wichtiger als die reinen Zahlen und erreichten Ziele?","a":["Die Farbe der Präsentation","Die subjektive Zufriedenheit der wichtigsten Stakeholder","Die Anzahl der Meetings","Das Alter des Projektmanagers"],"r":1,"e":"Wenn die tatsächliche Motivation der Stakeholder erfüllt wurde, sehen sie laut Video über viele Kritikpunkte hinweg."},{"q":"Wer trägt laut Video letztlich die Verantwortung für den Inhalt des Projektauftrags?","a":["Der Projektauftraggeber","Der Praktikant","Die IT-Abteilung","Niemand konkret"],"r":0,"e":"Der Projektauftraggeber ist laut Video letztlich für den Projektauftrag verantwortlich, auch wenn der Projektleiter mitgestaltet.","p":1},{"q":"Budget 50'000, knappe Ressourcen, unsichere Daten. Wie strukturierst du das Projekt?","a":["Alles in einem Schritt umsetzen","In Etappen mit messbarem Ergebnis und Entscheidungspunkt (weiter, anpassen, stoppen) nach jeder Etappe","Erst in zwei Jahren starten","Das Budget verdoppeln"],"r":1,"e":"Etappierung mit Toren begrenzt das Risiko: Geld wird erst freigegeben, wenn die vorherige Etappe ihre Zahl erreicht hat. Kern von Critical Incident 02."},{"q":"Wie lang dauert ein Sprint in Scrum laut Video ungefähr?","a":["Ein bis vier Tage","Ein bis vier Wochen","Ein bis vier Monate","Genau ein Jahr"],"r":1,"e":"Das Video nennt einen Sprint als Zeitabschnitt von einer bis vier Wochen.","p":1},{"q":"Wer ist laut Video für das Product Backlog verantwortlich?","a":["Der Scrum Master","Der Product Owner","Jedes Teammitglied gleichermassen","Der Kunde direkt"],"r":1,"e":"Das Video sagt ausdrücklich, der Product Owner ist für das Produkt und das Product Backlog verantwortlich.","p":1},{"q":"Wozu dient laut Video das tägliche Daily-Scrum-Treffen?","a":["Um neue Anforderungen ins Product Backlog aufzunehmen","Um sich über Fortschritt und Hindernisse im Sprint auszutauschen","Um das fertige Produkt den Kunden zu präsentieren","Um den nächsten Sprint komplett zu planen"],"r":1,"e":"Das Video beschreibt das Daily Scrum genau so: täglicher Austausch über Fortschritt und Hindernisse.","p":1},{"q":"Wie viele Personen umfasst das Scrum-Team laut Video üblicherweise?","a":["Genau eine Person","Drei bis neun Fachexperten","Mindestens zwanzig Personen","Immer genau fünf Personen"],"r":1,"e":"Das Video nennt drei bis neun Fachexperten als typische Grösse eines selbstorganisierten Scrum-Teams.","p":1},{"q":"Wie lange dauert ein Sprint laut Video typischerweise?","a":["Ein Tag","Zwei bis vier Wochen","Ein ganzes Jahr","Sechs Monate"],"r":1,"e":"Das Video beschreibt Sprints als zeitlich auf zwei bis vier Wochen limitierte Bauabschnitte.","p":1},{"q":"Wer sammelt laut Video alle Anforderungen der Stakeholder im Product Backlog?","a":["Der Scrum Master","Der Product Owner","Die Stakeholder selbst direkt im Sprint","Der Bürgermeister"],"r":1,"e":"Der Product Owner ist laut Video verantwortlich dafür, alle Anforderungen im Product Backlog zu sammeln und zu priorisieren.","p":1},{"q":"Welche Aufgabe hat der Scrum Master laut Video?","a":["Er priorisiert die Produktvision und die Wirtschaftlichkeit","Er sorgt für die Einhaltung der Scrum-Regeln und beseitigt Hindernisse","Er baut den Spielplatz eigenhändig","Er vertritt die Bürger der Stadt"],"r":1,"e":"Frau Huber als Scrum Master sorgt laut Video für die Einhaltung der Scrum-Regeln und -Werte und beseitigt auftretende Hindernisse.","p":1},{"q":"Was ist ein Sprint?","a":["Eine Überstundenphase vor dem Termin","Ein fester Zeitraum von höchstens einem Monat, an dessen Ende ein nutzbares Ergebnis steht","Ein Meeting","Ein Dokument"],"r":1,"e":"Kurze Zyklen mit Review und Retrospektive. Passt zu KI-Lösungen, weil man erst am Ergebnis sieht, was die Daten hergeben."},{"q":"Wofür steht die Abkürzung KPI?","a":["Key Performance Indicator","Kritischer Prozess Index","Kunden Präferenz Indikator","Keine Panik Index"],"r":0,"e":"KPI steht für Key Performance Indicator, auf Deutsch Leistungskennzahl.","p":1},{"q":"Was bedeutet die Kennzahl CAC, Customer Acquisition Cost?","a":["Die Kosten, um einen neuen Kunden zu gewinnen","Die Anzahl der Klicks auf der Website","Die Anzahl der Follower auf Social Media","Der Umsatz pro Sekunde"],"r":0,"e":"CAC beschreibt, wie viel Geld im Schnitt nötig ist, um über einen bestimmten Kanal einen neuen Kunden zu gewinnen.","p":1},{"q":"Warum warnt das Video vor sogenannten Vanity Metrics wie Website-Klicks oder Followerzahlen?","a":["Weil sie zu teuer in der Erhebung sind","Weil sie einen Erfolg suggerieren, aber keine echte Aussagekraft für das Geschäft haben","Weil sie gesetzlich verboten sind","Weil sie nur bei kleinen Unternehmen vorkommen"],"r":1,"e":"Vanity Metrics wie Klicks oder Follower wirken beeindruckend, sagen aber nichts über echten Erfolg wie zahlende Kunden oder echte Interaktion aus."},{"q":"Wofür steht die Abkürzung KPI?","a":["Key Performance Indicator","Kunden Profit Index","Kosten Preis Information","Kritischer Prozess Indikator"],"r":0,"e":"Das Video erklärt, dass KPI für Key Performance Indicator steht, auf Deutsch auch Leistungskennzahl genannt.","p":1},{"q":"Wie nennt man im Online-Marketing die Kennzahl, die zeigt, wie viele Seitenbesucher tatsächlich etwas kaufen?","a":["Absprungrate","Sichtbarkeit","Conversion Rate","Verweildauer"],"r":2,"e":"Das Video nennt die Conversion Rate als die Kennzahl, die zeigt, wie viele Besucher einer Seite tatsächlich etwas kaufen oder eine Transaktion auslösen."},{"q":"Wozu dienen KPIs laut Video ganz allgemein?","a":["nur der Unterhaltung des Managements","der Messung und Kontrolle von Fortschritt oder Erfüllungsgrad","der automatischen Preisfestlegung","der Ersetzung aller Mitarbeitenden"],"r":1,"e":"Das Video definiert den Zweck von KPIs als Messung und Kontrolle von Fortschritt beziehungsweise Erfüllungsgrad.","p":1},{"q":"Wofür steht das zweite A in manchen Varianten von SMART neben attraktiv?","a":["Aktuell","Akzeptiert","Automatisch","Aggressiv"],"r":1,"e":"Das Video erklärt das A auch als akzeptiert, also die Frage, ob man die Konsequenzen des Ziels wirklich mitträgt.","p":1},{"q":"Wie viele Kilometer pro Woche müsste man laut dem Rechenbeispiel im Video joggen, um 200 Kilometer in 52 Wochen zu schaffen?","a":["Etwa 1 Kilometer","Etwa 4 Kilometer","Etwa 10 Kilometer","Etwa 20 Kilometer"],"r":1,"e":"Das Video rechnet vor, dass man bei 200 Kilometern auf 52 Wochen verteilt knapp vier Kilometer pro Woche laufen müsste."},{"q":"Warum funktioniert das Ziel Ich mache mehr Sport laut Video nicht gut?","a":["Weil Sport ungesund ist","Weil es kein smartes Ziel ist und zu unspezifisch bleibt","Weil es zu teuer ist","Weil es verboten ist"],"r":1,"e":"Das Video erklärt, dass mehr Sport machen kein smartes Ziel ist, weil es unter anderem nicht spezifisch genug formuliert ist.","p":1},{"q":"Welche Kennzahl ist handlungsfähig formuliert?","a":["Die Qualität soll gut sein","Fehlalarmquote pro Monat, Schwelle 15 %, darüber prüft ein Mensch alle Fälle und das Modell wird untersucht","Wir beobachten die Lage","Kunden sollen zufrieden sein"],"r":1,"e":"Prüfungsmuster: Kennzahl + Schwellenwert + Massnahme bei Überschreitung."},{"q":"Wie viele Phasen umfasst der ERP-Einführungsplan im Video?","a":["Drei","Vier","Sechs","Zehn"],"r":2,"e":"Das Video beschreibt genau sechs Phasen für eine ERP-Einführung.","p":1},{"q":"In welcher Phase beginnt laut Video schon die erste Schulung der Endnutzenden?","a":["In der ersten Phase Discovery","In der Testphase","Erst ganz am Schluss nach dem Go-Live","Nie, das übernimmt allein der Softwarehersteller"],"r":1,"e":"Laut Video beginnt schon in der Testphase eine erste, einführende Schulung der Endnutzenden.","p":1},{"q":"Was passiert in der allerersten Phase Discovery and Planning laut Video?","a":["Das System geht bereits live","Es werden Systemanforderungen definiert und die Lösung recherchiert und ausgewählt","Die Nutzenden werden abschliessend geschult","Das System wird endgültig abgeschaltet"],"r":1,"e":"In der ersten Phase werden laut Video Anforderungen definiert und eine passende Lösung ausgewählt."},{"q":"Wie lange dauert der Pilotbetrieb für neue Franchise-Partner laut Video typischerweise?","a":["Ein paar Stunden","Ein paar Tage bis eine Woche","Ein ganzes Jahr","Mehrere Jahre"],"r":1,"e":"Das Video nennt ein paar Tage oder auch eine Woche im Pilotbetrieb des Franchisegebers."},{"q":"Warum werden kaufmännische Grundlagen wie Handelsspanne und Deckungsbeitrag extra geschult?","a":["Weil das gesetzlich verboten ist","Weil nicht jeder Franchise-Partner eine kaufmännische Vorbildung hat","Weil das nur für grosse Unternehmen gilt","Weil es sonst zu teuer wäre"],"r":1,"e":"Das Video betont, dass man nicht voraussetzen sollte, dass jeder Partner diese Grundlagen bereits kennt."},{"q":"Welche Themen gehören laut Video zu den ersten Schulungen für neue Franchise-Partner?","a":["Nur Marketing","Qualitätsmanagement, Produkt- und Mitarbeiterschulung","Nur Buchhaltung","Nur Standortsuche"],"r":1,"e":"Das Video nennt Qualitätsmanagement, Produktschulung und Mitarbeiterschulung als direkt zum Konzept gehörende Themen.","p":1},{"q":"Was nennt der Sprecher im Video als wichtigsten ersten Schritt bei der KI-Einführung?","a":["Eine möglichst teure Software zu kaufen","Eine offene, lernende Haltung in der Kultur zu schaffen","Sofort alle alten Prozesse abzuschaffen","Ein Verbot für KI-Nutzung auszusprechen"],"r":1,"e":"Das Video nennt die offene, lernende Haltung ausdrücklich als wichtigsten ersten Schritt.","p":1},{"q":"Was ist ein Rückfallplan wert, den nie jemand ausprobiert hat?","a":["Er ist trotzdem ausreichend","Er ist eine Hoffnung mit Überschrift","Er ist gesetzlich vorgeschrieben","Er ersetzt die Schulung"],"r":1,"e":"Der Schalter auf den alten Ablauf wird vor dem Start einmal wirklich umgelegt, zur Probe.","p":1},{"q":"Welche Messung zeigt Akzeptanz am ehrlichsten?","a":["Die Zufriedenheitsumfrage","Die Zahl der besuchten Schulungen","Der Anteil KI-Entwürfe, die gar nicht geöffnet werden","Das Lob der Geschäftsleitung"],"r":2,"e":"Wer das Werkzeug umgeht, sagt es in keiner Umfrage. Ungeöffnete Entwürfe sind die ehrlichste Zahl.","p":1},{"q":"Hochsaison beginnt Mitte Dezember. Warum startet Selina am 3. November?","a":["Weil der Anbieter dann Zeit hat","Weil das Team vor der Spitze vier Wochen Routine braucht","Weil im November das Budget verfällt","Weil der Direktor es so wollte"],"r":1,"e":"Ein Datum ist ein Wunsch. Ein Zeitplan rechnet rückwärts von der Spitze und kennt Ferien, Schulungstage und eine Pufferwoche.","p":1},{"q":"Wie viele grundlegende Konfliktlösungsmöglichkeiten stellt das Video vor?","a":["Drei","Fünf","Sieben","Zehn"],"r":1,"e":"Das Video zeigt genau fünf Konfliktlösungsmöglichkeiten: Flucht, Kampf, Delegation, Kompromiss und Konsens.","p":1},{"q":"Welche Konfliktlösung führt laut Video am ehesten zu einer echten Win-Win-Situation?","a":["Der Kampf","Der Konsens","Die Flucht","Die Delegation"],"r":1,"e":"Das Video beschreibt den Konsens als Lösung, bei der beide Parteien zufrieden sind und die persönliche Bindung wächst, also eine echte Win-Win-Situation.","p":1},{"q":"Was passiert laut Video bei der Konfliktlösung Kampf?","a":["Der Konfliktpartner wird vernichtet oder man unterwirft sich ihm","Beide Parteien einigen sich auf halbem Weg","Ein Dritter entscheidet den Konflikt","Der Konflikt wird einfach ignoriert"],"r":0,"e":"Beim Kampf gibt es laut Video nur zwei Ergebnisse: der Konfliktpartner wird vernichtet, oder man unterwirft sich ihm.","p":1},{"q":"Für welche Eskalationsstufen eignet sich der Kompromiss laut Video besonders?","a":["Nur für die letzten drei Eskalationsstufen","Für die erste und zweite Ebene, vom Aufkommen des Konflikts bis zu verbalen Drohungen","Ausschliesslich für bewaffnete Konflikte","Für gar keine Eskalationsstufe"],"r":1,"e":"Das Video ordnet den Kompromiss der ersten und zweiten Eskalationsebene zu, also frühen Konfliktphasen."},{"q":"Wie viele Eskalationsstufen unterscheidet das Konfliktmodell von Friedrich Glasl?","a":["Drei","Fünf","Sieben","Neun"],"r":3,"e":"Glasl unterteilt Konflikte in neun Eskalationsstufen, die wiederum in drei Hauptphasen gegliedert sind.","p":1},{"q":"In welcher Phase kann noch eine für beide Seiten vorteilhafte Lösung gefunden werden?","a":["Nur in der letzten Phase 'gemeinsam in den Abgrund'","In der ersten Phase 'win-win'","In keiner Phase mehr","Nur bei Stufe 9"],"r":1,"e":"In der ersten Phase, win-win, ist der Konflikt noch konstruktiv und eine für beide Seiten gute Lösung ist möglich.","p":1},{"q":"Welche drei Stufen gehören zur ersten Phase 'win-win' nach Glasl?","a":["Verhärtung, Polarisation und Debatte, Taten statt Worte","Images und Koalition, Gesichtsverlust, Drohstrategien","Vernichtungsschläge, Zersplitterung, gemeinsam in den Abgrund","Mediation, Moderation, Schlichtung"],"r":0,"e":"Die ersten drei Stufen 1 bis 3 bilden die Phase win-win: Verhärtung, Polarisation/Debatte und Taten statt Worte.","p":1},{"q":"Welche Konfliktlösungsmethode empfiehlt das Video für die Phase win-lose, Stufen 4 bis 6?","a":["Nur noch Trennung der Parteien","Verfahren und Machteingriffe, z.B. durch Vorgesetzte","Gar keine Intervention mehr nötig","Ausschliesslich Mediation"],"r":1,"e":"In der Phase win-lose sind Verfahren und Machteingriffe sinnvoll, etwa wenn ein Vorgesetzter eingreifen muss."},{"q":"Glasl unterscheidet neun Eskalationsstufen in drei Ebenen. Was gilt in der ersten Ebene (Stufen 1 bis 3)?","a":["Beide können noch gewinnen (Win-Win), die Parteien können es selbst oder mit Moderation lösen","Einer verliert sicher","Beide verlieren","Es braucht einen Machteingriff"],"r":0,"e":"Ebene 2: Win-Lose, braucht externe Hilfe (Mediation). Ebene 3: Lose-Lose, braucht Machteingriff."}]},{"kz":"B","titel":"Recht und Governance","pl":6,"ord":[{"q":"Bringe die Routine nach E3 in die richtige Reihenfolge.","a":["Erkennen: Quellen beobachten","Zuordnen: Liste aller Lösungen mit Daten, Rolle, Klasse, EU-Bezug","Bewerten: mit Produktverantwortlicher und Juristin","Dokumentieren: eine Seite mit Ampel und nächstem Termin"],"e":"Ohne Liste aller Lösungen ist jede Gesetzesänderung ein Rätselraten."},{"q":"Bringe die vier Risikostufen des EU AI Act von wenig zu viel Risiko in die richtige Reihenfolge.","a":["Minimales Risiko","Begrenztes Risiko (Transparenzpflicht)","Hohes Risiko","Unannehmbares Risiko (verboten)"],"e":"So heissen die Stufen im Gesetzestext. ACHTUNG: Das Video sagt «Low Risk», dieser Begriff steht nicht in der Verordnung. Die zweite Stufe heisst begrenztes Risiko und bringt Transparenzpflichten nach Art. 50, etwa die Kennzeichnung von Chatbots."},{"q":"Ordne die vier Risikoklassen des EU AI Act von der strengsten zur mildesten.","a":["Unannehmbares Risiko (verboten)","Hohes Risiko (strenge Pflichten)","Begrenztes Risiko (Transparenzpflichten)","Minimales Risiko (keine besonderen Pflichten)"],"e":"Je höher das Risiko für Menschen, desto strenger. Beispiel verboten: Social Scoring. Begrenzt: Chatbots müssen sich als KI zu erkennen geben."},{"q":"Du führst eine KI-Richtlinie ein. Bringe die Schritte in die richtige Reihenfolge.","a":["Ist-Zustand erheben: Wer nutzt heute was?","Entwurf mit Fachbereichen, IT und Recht erarbeiten","Geschäftsleitung entscheidet und steht sichtbar dahinter","Schulen und kommunizieren, Fragenkanal einrichten","Einhaltung prüfen und Richtlinie regelmässig anpassen"],"e":"Erst verstehen, dann mit den Betroffenen entwerfen, dann beschliessen, dann befähigen, dann nachhalten."}],"schreib":[{"t":"lueck","q":"Datenschutz ist laut Video kein Sprint, sondern ein ___.","r":["marathon"],"e":"Das Video vergleicht Datenschutzarbeit mit einem Marathon, also einer dauerhaften Aufgabe."},{"t":"lueck","q":"Die EU reguliert laut dem Gespräch vorab mit Grundsätzen, während die USA erst laufen lassen und dann ___ regulieren.","r":["sektorspezifisch","branchenspezifisch","applikationsspezifisch"],"e":"Das Gespräch beschreibt den amerikanischen Ansatz, zuerst laufen zu lassen und erst dort zu regulieren, wo tatsächlich Schäden entstehen, also sektor- oder applikationsspezifisch."},{"t":"lueck","q":"Der Sprecher empfiehlt, die private KI zu fragen, wie man am besten für die ___ KI im Unternehmen promptet.","r":["neue","geschaeftliche"],"e":"Er beschreibt die Idee, die alte private KI nach gutem Prompting zu fragen und das Ergebnis für die neue geschäftliche KI zu nutzen."},{"t":"lueck","q":"Ein Grund, warum Apple stark auf eigene Chips wie den A17 setzt, ist die Strategie, KI möglichst ___ laufen zu lassen.","r":["on device","lokal"],"e":"Apple setzt laut Video bewusst darauf, KI direkt auf dem Gerät statt in der Cloud laufen zu lassen."},{"t":"lueck","q":"Ein AI Business Specialist ist kein Anwalt. Er ist derjenige, der weiss, wann man einen ___ .","r":["braucht"],"e":"Im Profil steht «unter Beizug von Fachpersonen». In der Prüfung zählt der Satz, wen du bis wann beiziehst."},{"t":"lueck","q":"Chatbots müssen laut Video kennzeichnen, dass man gerade mit einer ___ spricht.","r":["ki","künstlichen intelligenz"],"e":"Bei der Kategorie Transparenzrisiko reicht oft schon der Hinweis, dass man mit einer KI kommuniziert."},{"t":"lueck","q":"Bevor ein neues KI-Tool eingeführt wird, braucht es laut Video einen ___, der Datenschutz, Sicherheit und Zweckbindung prüft.","r":["freigabeprozess"],"e":"Das Video verlangt einen Freigabeprozess vor der Einführung neuer KI-Tools, der genau diese drei Punkte prüft."},{"t":"lueck","q":"Copilot kann bei Nutzenden nur auf die Daten zugreifen, für die sie bereits ein ___ haben.","r":["zugriffsrecht"],"e":"Ein Gast erklärt, dass Copilot die bestehenden Zugriffsrechte einer Person übernimmt und keine zusätzlichen Daten zeigt."},{"t":"lueck","q":"Beim Umgang mit hochsensiblen Daten wie in der Sozialversicherung wird KI zuerst in einem sicheren, geschützten Umfeld getestet, bevor es ins ___ geht.","r":["rollout"],"e":"Die ITSV testet laut Video KI zuerst sicher und im geschützten Umfeld, bevor der Rollout erfolgt."},{"t":"lueck","q":"Eine goldene Regel der Ethik lautet laut Video: Rechtfertigt der Zweck die ___?","r":["mittel"],"e":"Diese Frage soll laut Video immer wieder aufs Neue geprüft werden."},{"t":"lueck","q":"Bei der Invisible Prompt Injection sieht der Mensch normalen Text, aber die KI liest darin geheime ___.","r":["befehle"],"e":"Das Video beschreibt genau das: für Menschen unsichtbare Zeichen enthalten Befehle, die die KI trotzdem ausliest."},{"t":"lueck","q":"Beim absichtlichen Testen eines Systems mit bösartigen Prompts, um Schwachstellen zu finden, spricht das Video von LLM-___.","r":["testing","test"],"e":"Das Video nennt gezieltes LLM-Testing mit eingeschleusten bösartigen Prompts als wichtige Massnahme, um Schwachstellen zu finden."},{"t":"lueck","q":"Kleine, spezialisierte KI-Modelle brauchen laut der im Video zitierten Sustainability-Verantwortlichen deutlich weniger ___ als die grossen generativen Modelle.","r":["energie","strom"],"e":"Im Video wird erklärt, dass kleine, lokal genutzte Modelle nicht so viele Daten und nicht so viel Energie brauchen wie die grossen generativen KI-Modelle."}],"mc":[{"q":"Wer kann bei einer Datenschutzverletzung in der Schweiz persönlich bestraft werden?","a":["Nur das Unternehmen als Ganzes","Auch einzelne Mitarbeitende persönlich","Niemand, es gibt keine Strafen","Nur der Staat"],"r":1,"e":"Im Unterschied zur EU-DSGVO, die vor allem Unternehmen mit Bussen belegt, können in der Schweiz auch einzelne Personen persönlich bestraft werden.","p":1},{"q":"Zählt das Verschicken eines Geburtstagsgeschenks mit Adressdaten schon als Datenbearbeitung im Sinne des Datenschutzgesetzes?","a":["Nein, das ist viel zu banal","Ja, sobald man mit Personendaten hantiert, ist es Datenbearbeitung","Nur wenn es ein Geschäftskunde ist","Nur bei mehr als 100 Geschenken"],"r":1,"e":"Das Video betont, dass Datenbearbeitung fast alles umfasst, was man mit Daten macht, selbst ein einfaches Geburtstagsgeschenk."},{"q":"Was unterscheidet die Schweizer Regelung von der EU-DSGVO laut Video besonders?","a":["Die Schweiz kennt gar keine Strafen","In der Schweiz können auch einzelne Mitarbeitende persönlich bestraft werden","Die EU-DSGVO bestraft nur Einzelpersonen","Es gibt keinen Unterschied"],"r":1,"e":"Das Video hebt hervor, dass in der Schweiz Einzelpersonen bestraft werden können, während sich die EU-DSGVO vor allem an Unternehmen richtet."},{"q":"Kann man sich in der Schweiz gegen eine persönliche Datenschutz-Busse versichern?","a":["Ja, das ist Standard","Nein, laut Video gibt es dafür keine Versicherung","Nur bei grossen Unternehmen","Nur wenn man vorher zahlt"],"r":1,"e":"Das Video sagt ausdrücklich, dass man sich dagegen nicht versichern kann.","p":1},{"q":"Reicht ein einfacher Vertrag mit einem externen Dienstleister aus, damit ein Unternehmen dessen Daten rechtlich verarbeiten lassen darf?","a":["nein, Datenverarbeitung durch Dritte ist grundsätzlich verboten","ja, mit einem Auftragsverarbeitungsvertrag (DPA) darf ein anderer die Daten im eigenen Auftrag verarbeiten","nur wenn der Dienstleister in der Schweiz sitzt","nein, das geht nur mit einer eigenen KI-Verordnung"],"r":1,"e":"Das Video erklärt, dass Auftragsverarbeitung mit einem entsprechenden Vertrag (DPA) im Datenschutzrecht schon lange vorgesehen ist und die Verarbeitung durch Dritte erlaubt."},{"q":"Woher stammt ursprünglich die Idee des Artikels 22 DSGVO, dass niemand allein von einer automatisierten Maschinenentscheidung betroffen sein darf?","a":["aus einer EU-Verordnung der 2000er Jahre","aus einem US-Gerichtsurteil","aus der Science-Fiction-Literatur der 1970er Jahre aus Frankreich","aus der Informatikforschung des IBM-Konzerns"],"r":2,"e":"So erzählt es der Gast im Video. ACHTUNG, in der Prüfung nicht so antworten: Belegt ist Art. 2 der französischen Loi 78-17 von 1978 (Informatique et Libertés). Von dort kam das Verbot rein automatisierter Einzelentscheidungen über die Datenschutzrichtlinie 95/46/EG in Art. 22 DSGVO."},{"q":"Welches Argument bezeichnet Sebastian Kraska im Video als 'gefährliches Halbwissen'?","a":["dass man mit Cloud oder ChatGPT gar nichts machen könne, weil die Server in den USA seien","dass man alle KI-Systeme sofort abschalten müsse","dass Microsoft niemals genutzt werden dürfe","dass die DSGVO für KI gar nicht gilt"],"r":0,"e":"Er kritisiert den pauschalen Satz, mit Claude oder Google gehe wegen der US-Server gar nichts, als typisches Beispiel für gefährliches Halbwissen."},{"q":"In wie viele Phasen unterteilt der Datenschutzexperte im Video den Umgang mit KI-Anwendungen?","a":["Zwei","Drei","Vier","Fünf"],"r":1,"e":"Er unterscheidet drei Phasen: das Antrainieren, das ruhende LLM und die konkrete Implementierung in Anwendungsfälle."},{"q":"Was empfiehlt der Sprecher persönlich für den geschäftlichen Einsatz von KI-Tools?","a":["Immer die kostenlose private Version nutzen","Nur bezahlte Tools mit Vertrag verwenden","Gar keine KI im Unternehmen einsetzen","Nur firmeneigene Tools ohne jeden Anbieter"],"r":1,"e":"Der Sprecher sagt ausdrücklich, dass er persönlich nie kostenlose private Tools nutzt, sondern immer bezahlte Tools mit Vertrag.","p":1},{"q":"Warum musste die Firma im Video ihre Server früher in die Cloud verlagern?","a":["Weil die Cloud billiger war als Strom","Weil das Büro in einem Hochwassergebiet lag","Weil der Vermieter es verlangte","Weil es gesetzlich vorgeschrieben war"],"r":1,"e":"Der Sprecher erzählt, dass sein Büro in einem Hochwassergebiet lag und die Server deshalb gefährdet waren.","p":1},{"q":"Was ist der Hauptvorteil, wenn ein KI-Modell lokal auf deinem Gerät läuft statt in der Cloud?","a":["Es ist immer stärker als Cloud-Modelle","Vertrauliche Daten bleiben auf dem eigenen Gerät","Es kostet garantiert nie etwas","Es braucht kein Smartphone"],"r":1,"e":"Laut Video ist der grosse Vorteil lokaler Modelle, dass vertrauliche Daten das Gerät nicht verlassen."},{"q":"Sind lokale KI-Modelle auf dem Smartphone meist genauso leistungsfähig wie grosse Online-Modelle?","a":["Ja, immer gleich stark","Nein, sie sind meist kleiner und schwächer, weil sie keine Cloud-Infrastruktur nutzen","Ja, aber nur nachts","Nein, sie funktionieren technisch gar nicht"],"r":1, bot jeder Automatisierung","Eine Bewilligung des Bundesrats"],"r":1,"e":"Automatisierte Einzelentscheidung mit Rechtsfolge oder erheblicher Beeinträchtigung: Informationspflicht, Recht auf Darlegung des Standpunkts und menschliche Überprüfung."},{"q":"In wie viele Risikostufen teilt der EU AI Act KI-Systeme ein?","a":["Zwei","Drei","Vier","Sechs"],"r":2,"e":"Das Video beschreibt eine Pyramide mit vier Risikostufen.","p":1},{"q":"Welche Anwendung zählt laut Video zu den komplett verbotenen KI-Systemen?","a":["Spamfilter","Soziale Bewertungssysteme wie in Science-Fiction-Serien","Gesichtsentsperrung am Smartphone","Chatbots im Kundenservice"],"r":1,"e":"Soziale Bewertungssysteme (Social Scoring) zählen zum unannehmbaren Risiko. ACHTUNG: Diese Verbote gelten seit 2.2.2025, nicht erst künftig. Und die biometrische Echtzeit-Fernidentifizierung im öffentlichen Raum ist nach Art. 5 Abs. 1 Bst. h nicht pauschal verboten, sondern nur mit engen Ausnahmen für die Strafverfolgung erlaubt.","p":1},{"q":"Welche Kategorie beschreibt Systeme, die zwar erlaubt sind, aber bestimmte Qualitätsanforderungen erfüllen und geprüft werden müssen?","a":["Minimales Risiko","Transparenzrisiko","Hochrisiko","Inakzeptables Risiko"],"r":2,"e":"Hochrisiko-Systeme, etwa bei Bewerbungen oder medizinischen Diagnosen, müssen geprüft werden, sind aber nicht verboten."},{"q":"Reguliert der EU AI Act laut Video die einzelnen KI-Modelle oder etwas anderes?","a":["Er reguliert die Modelle selbst, zum Beispiel ChatGPT direkt","Er reguliert die konkreten Anwendungsfälle, für die ein Modell genutzt wird","Er reguliert nur Hardware wie Grafikkarten","Er reguliert ausschliesslich staatliche Behörden"],"r":1,"e":"Das Video sagt, nicht die Modelle, sondern die Anwendungsfälle würden reguliert. ACHTUNG, das galt nur für den Entwurf von 2021: Kapitel V (Art. 51 bis 56) regelt seit 2.8.2025 auch die Modelle mit allgemeinem Verwendungszweck (GPAI) direkt. Richtig ist heute: beides."},{"q":"Welche der folgenden Nutzun /* ================= 2 Schreiben ================= */
var SZ = new RegExp(String.fromCharCode(223), 'g');  /* scharfes s, in der Schweiz immer ss */

}

  s = String(s).replace(/['’´\s ]/g, '').replace(/,/g, '.').replace(/[^0-9.\-]/g, '');
  var v = parseFloat(s);
  return isNaN(v) ? null : v;
}
function schreibPruefen(k, ein) {
  if (k.t === 'num') {

    return Math.abs(v - Number(k.r)) <= Number(k.tol || 0) + 1e-9;
  }
  var e = hart(ein);

}

  return out;
}

    app.appendChild(h('div', { cls: 'zaehler' },
      h('span', { text: 'Aussage ' + (i + 1) + ' von ' + karten.length }),

    karte.addEventListener('pointerdown', function (e) { wischStart(e, karte, antworten); });
    app.appendChild(h('div', { cls: 'stapelbuehne' }, karte));
    app.appendChild(h('div', { cls: 'wischhilfe' },
      h('span', { text: '← stimmt nicht' }), h('span', { text: 'stimmt →' })));
    app.appendChild(h('div', { cls: 'knopfreihe' },
      h('button', { cls: 'knopf nein', type: 'button', id: 'nein', text: '✗ Falsch', on: { click: function () { antworten(false); } } }),
      h('button', { cls: 'knopf ja', type: 'button', id: 'ja', text: '✓ Richtig', on: { click: function () { antworten(true); } } })));
  }
  function antworten(sagtWahr) {
    var k = karten[i], ok = (sagtWahr === k.wahr);
    if (ok) { richtig++; tonJa(); } else {
      tonNein();
      fehler.push({
        q: k.q, deine: (sagtWahr ? '"stimmt"' : '"stimmt nicht"') + ' zu: ' + k.a,
        richtig: 'Die Aussage ist ' + (k.wahr ? 'wahr' : 'falsch') + '. Richtig ist: ' + k.gut, e: k.e
      });
    }
    leeren(); kopf('Stapel · Block ' + b.kz, function () { uhrStop(); zeigeBlockwahl(sp); });
    app.appendChild(h('div', { cls: 'frage' }, h('div', { cls: 'af', text: k.q }), h('div', { cls: 'aa', text: k.a })));
    app.appendChild(h('p', { cls: 'hinweis', text: (ok ? '✓ Stimmt, ' : '✗ Daneben, ') + 'die Aussage ist ' + (k.wahr ? 'wahr.' : 'falsch.') }));
    if (!k.wahr) app.appendChild(h('p', { cls: 'lead', text: 'Richtig wäre: ' + k.gut }));
    if (k.e) app.appendChild(h('p', { cls: 'lead', text: k.e }));
    app.appendChild(h('div', { cls: 'knopfreihe' },
      h('button', { cls: 'knopf', type: 'button', id: 'weiter', text: i + 1 >= karten.length ? 'Auswertung' : 'Weiter', on: { click: function () { i++; zeichne(); } } })));
  }
  zeichne();
}
function wischStart(e, karte, antworten) {
  if (e.target.closest && e.target.closest('button')) return;
  e.preventDefault();
  var x0 = e.clientX, aktiv = true;
  function move(ev) {
    if (!aktiv) return;
    var dx = ev.clientX - x0;
    karte.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
    karte.classList.toggle('jaseite', dx > 60);
    karte.classList.toggle('neinseite', dx < -60);
  }
  function up(ev) {
    if (!aktiv) return;
    aktiv = false;
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    var dx = ev.clientX - x0;
    karte.style.transform = ''; karte.classList.remove('jaseite', 'neinseite');
    if (Math.abs(dx) > 70) antworten(dx > 0);
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

/* ================= Auswertung ================= */
function auswertung(sp, b, richtig, gesamt, fehler, rohpunkte, abbruch) {
  var sek = sekunden();
  var gesehen = {};
  fehler = fehler.filter(function (f) {
    var s = f.q + '|' + f.deine;
    if (gesehen[s]) return false; gesehen[s] = 1; return true;
  });
  var punkte = Math.max(0, Math.round(rohpunkte + Math.max(0, (MAXZEIT - sek)) * 1.5));
  var key = sp.id + '|' + b.kz, alt = stand.best[key], neu = !alt || punkte > alt.punkte;
  if (neu) { stand.best[key] = { punkte: punkte, richtig: richtig, gesamt: gesamt, sek: sek }; speichern(); }
  tonEnde();
  leeren(); kopf('Auswertung · ' + sp.name, zeigeStart);
  app.appendChild(h('h1', { text: sp.name + ' · Block ' + b.kz }));
  if (abbruch) app.appendChild(h('p', { cls: 'hinweis', text: 'Runde vorzeitig beendet (Zeitgrenze drei Minuten oder Abbruch).' }));
  app.appendChild(h('div', { cls: 'bilanz' },
    h('div', {}, h('span', { cls: 'w', id: 'ergrichtig', text: richtig + '/' + gesamt }), h('span', { cls: 'l', text: 'richtig' })),
    h('div', {}, h('span', { cls: 'w', text: mmss(sek) }), h('span', { cls: 'l', text: 'Zeit' })),
    h('div', {}, h('span', { cls: 'w', text: String(punkte) }), h('span', { cls: 'l', text: 'Punkte' }))));
  if (neu) app.appendChild(h('p', { cls: 'hinweis', text: 'Neuer Bestwert für ' + sp.name + ' in Block ' + b.kz + '.' }));
  if (!fehler.length) {
    app.appendChild(h('div', { cls: 'allesgut', text: 'Keine Fehler. Gleich den nächsten Block nehmen.' }));
  } else {
    app.appendChild(h('h2', { text: 'Deine Fehler (' + fehler.length + ')' }));
    fehler.forEach(function (f) {
      app.appendChild(h('div', { cls: 'fehler' },
        h('div', { cls: 'ff', text: f.q }),
        h('div', { cls: 'fd', text: 'Du: ' + f.deine }),
        h('div', { cls: 'fr', text: 'Richtig: ' + f.richtig }),
        f.e ? h('div', { cls: 'fe', text: f.e }) : null));
    });
  }
  app.appendChild(h('div', { cls: 'knopfreihe' },
    h('button', { cls: 'knopf', type: 'button', id: 'nochmals', text: 'Nochmals', on: { click: function () { starte(sp, b); } } }),
    h('button', { cls: 'knopf zweit', type: 'button', id: 'andererblock', text: 'Anderer Block', on: { click: function () { zeigeBlockwahl(sp); } } }),
    h('button', { cls: 'knopf zweit', type: 'button', id: 'zumstart', text: 'Startbildschirm', on: { click: zeigeStart } })));
}

zeigeStart();
